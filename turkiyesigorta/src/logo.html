<!doctype html>
<html lang="tr"><head><meta charset="utf-8">
<title>logo</title>
<style>
  @font-face{font-family:'Sora';font-style:normal;font-weight:100 900;src:url('../assets/fonts/Sora-latin.woff2') format('woff2');unicode-range:U+0000-00FF,U+0131,U+0152-0153,U+02BB-02BC,U+02C6,U+02DA,U+02DC,U+0304,U+0308,U+0329,U+2000-206F,U+20AC,U+2122,U+2191,U+2193,U+2212,U+2215,U+FEFF,U+FFFD}
  @font-face{font-family:'Sora';font-style:normal;font-weight:100 900;src:url('../assets/fonts/Sora-latin-ext.woff2') format('woff2');unicode-range:U+0100-02BA,U+02BD-02C5,U+02C7-02CC,U+02CE-02D7,U+02DD-02FF,U+0304,U+0308,U+0329,U+1D00-1DBF,U+1E00-1E9F,U+1EF2-1EFF,U+2020,U+20A0-20AB,U+20AD-20C0,U+2113,U+2C60-2C7F,U+A720-A7FF}
  html,body{margin:0;padding:0;background:transparent}
  .lockup{position:relative;display:inline-flex;align-items:center;gap:15px;padding:14px 16px 14px 14px;font-family:'Sora',sans-serif}
  /* --- emblem: layered eight-pointed tile with red seal --- */
  .emblem{position:relative;width:84px;height:84px;flex:none;filter:drop-shadow(0 6px 10px rgba(0,20,28,.45)) drop-shadow(0 1px 2px rgba(0,20,28,.35))}
  .emblem > i{position:absolute;display:block;left:50%;top:50%;transform:translate(-50%,-50%);
    clip-path:polygon(50% 0%,63.7% 15.9%,85.36% 14.64%,84.1% 36.3%,100% 50%,84.1% 63.7%,85.36% 85.36%,63.7% 84.1%,50% 100%,36.3% 84.1%,14.64% 85.36%,15.9% 63.7%,0% 50%,15.9% 36.3%,14.64% 14.64%,36.3% 15.9%)}
  .emblem .l1{width:84px;height:84px;background:linear-gradient(150deg,#5ee6e9 0%,#19b4c0 38%,#0a7b8a 100%)}
  .emblem .l2{width:84px;height:84px;background:linear-gradient(330deg,rgba(255,255,255,.0) 55%,rgba(255,255,255,.35) 100%)}
  .emblem .l3{width:70px;height:70px;background:linear-gradient(150deg,#0b8393 0%,#0a6f7d 55%,#07535f 100%)}
  .emblem .l4{width:60px;height:60px;background:linear-gradient(150deg,#8ff1f2 0%,#33c6cf 45%,#1499a6 100%)}
  .emblem .l5{width:60px;height:60px;background:linear-gradient(160deg,rgba(255,255,255,.55) 0%,rgba(255,255,255,0) 48%)}
  .emblem .seal{position:absolute;left:50%;top:50%;width:26px;height:26px;border-radius:50%;transform:translate(-50%,-50%);
    background:radial-gradient(circle at 36% 30%,#ff7a86 0%,#e6203a 42%,#a80f24 100%);
    box-shadow:0 2px 5px rgba(60,0,10,.5),inset 0 -2px 3px rgba(80,0,12,.45),inset 0 2px 2px rgba(255,255,255,.55)}
  .emblem .seal:after{content:'';position:absolute;left:5px;top:4px;width:9px;height:6px;border-radius:50%;background:rgba(255,255,255,.55);filter:blur(1px)}
  .emblem .ring{position:absolute;left:50%;top:50%;width:36px;height:36px;border-radius:50%;transform:translate(-50%,-50%);
    border:2px solid rgba(255,255,255,.75);box-shadow:0 0 0 3px rgba(9,90,102,.35)}
  /* --- wordmark --- */
  .word{display:flex;flex-direction:column;line-height:1;color:#fff;text-shadow:0 2px 6px rgba(0,20,28,.35)}
  .word .a{font-size:27px;font-weight:800;letter-spacing:.015em}
  .word .a b{font-weight:800;color:#fff}
  .word .b{margin-top:6px;font-size:13.4px;font-weight:600;letter-spacing:.335em;color:#9df0f2;padding-left:2px}
  .word .rule{margin-top:7px;height:2px;width:100%;border-radius:2px;background:linear-gradient(90deg,#e6203a 0 26%,#5ee6e9 26% 100%)}
</style></head>
<body>
<div class="lockup" id="lockup">
  <div class="emblem">
    <i class="l1"></i><i class="l2"></i><i class="l3"></i><i class="l4"></i><i class="l5"></i>
    <span class="ring"></span><span class="seal"></span>
  </div>
  <div class="word">
    <div class="a">TÜRKİYE</div>
    <div class="b">SİGORTA</div>
    <div class="rule"></div>
  </div>
</div>
</body></html>
