  var BGCLASS = { dk: 'bg-dk', lime: 'bg-lime', yel: 'bg-yel' };

        '<span class="pill y">Kasım alışverişlerinde</span><span class="pill g">En çok kazandıran</span><span class="pill g">kart <em>Bonus!</em></span></div>' +
        '<ul class="chips">' + items.map(function (t) { return '<li><b>✓</b>' + t + '</li>'; }).join('') + '</ul>' +
        '<button class="replay" type="button">↻ Tekrar izle</button>' +

      '<span class="l2">' + s.l2.replace('Bonus', '<em>Bonus</em>') + '</span></div>' +

  }

  var els = SCENES.map(function (s, i) {
    var el = document.createElement('section');

  });
  function fit(el, max) { // uzun başlıkları tek satıra sığdır

    el.parentNode.appendChild(probe);

  var segs = SCENES.slice(0, -1).map(function (s, i) {
    var b = document.createElement('button');
    b.type = 'button'; b.className = 'seg'; b.setAttribute('role', 'tab'); b.setAttribute('aria-label', s.label);
    b.innerHTML = '<span><i></i></span><em>' + s.label + '</em>';
    b.addEventListener('click', function (e) { e.stopPropagation(); go(i, true); });

    return b;
  });

  var cur = -1, timer = null, startedAt = 0, remaining = 0, paused = false, hoverPause = false, z = 1, runStart = Date.now();
  var MAX_MS = 29000;

  function go(i, user) {

    var s = SCENES[i], el = els[i], prev = cur >= 0 ? els[cur] : null;
    if (prev && prev !== el) {

      var v0 = p.querySelector('video'); if (v0) v0.pause();
    }
    el.classList.remove('on'); void el.offsetWidth;
    el.style.zIndex = ++z;
    el.classList.add('on');
    cur = i;
    ad.dataset.bg = s.bg;
    ad.classList.remove('pos-intro', 'pos-cat', 'pos-end'); ad.classList.add('pos-' + s.pos);
    if (s.pos === 'end') { card.classList.remove('flip'); void card.offsetWidth; card.classList.add('flip'); }
    if (s.pos === 'cat') setTimeout(function () { if (cur === i) burst(); }, 900);

    segs.forEach(function (b, k) {

    var v = el.querySelector('video');

      v.onended = function () { if (cur === i) go(i + 1); };
      v.onloadedmetadata = function () { segs[i].style.setProperty('--d', (v.duration * 1000) + 'ms'); };
      if (segs[i]) { segs[i].classList.add('cur'); }
      return;

    if (!s.dur) return; // final karesinde durur
    if (Date.now() - runStart > MAX_MS) return go(SCENES.length - 1);
    var sg = segs[i]; sg.style.setProperty('--d', s.dur + 'ms');
    sg.querySelector('i').style.animation = 'none'; void sg.offsetWidth; sg.querySelector('i').style.animation = '';
    sg.classList.add('cur');

    if (!isPaused()) timer = setTimeout(next, remaining);
  }
  function next() { if (cur < SCENES.length - 1) go(cur + 1); }
  function isPaused() { return paused || hoverPause; }
  function syncPause() {
    var p = isPaused();
    ad.classList.toggle('paused', p);
    var v = els[cur] && els[cur].querySelector('video');
    if (v) { p ? v.pause() : v.play().catch(function () {}); return; }
    if (!SCENES[cur] || !SCENES[cur].dur) return;
    clearTimeout(timer);
    if (p) { remaining -= Date.now() - startedAt; }
    else { startedAt = Date.now(); timer = setTimeout(next, Math.max(remaining, 200)); }
  }

  function burst() {
    card.classList.remove('sweep'); void card.offsetWidth; card.classList.add('sweep');
    if (reduce || !ad.animate) return;
    var r = card.getBoundingClientRect(), a = ad.getBoundingClientRect();
    [[-70, -40], [-10, -62], [40, -34]].forEach(function (o, k) {
      var c = document.createElement('div');
      c.className = 'coin'; c.textContent = '+ Bonus';
      c.style.left = (r.left - a.left + r.width / 2 - 30) + 'px'; c.style.top = (r.top - a.top + 10) + 'px';
      ad.appendChild(c);

        { transform: 'translate(0,0) scale(.3)', opacity: 0 },
        { transform: 'translate(' + o[0] + 'px,' + o[1] + 'px) scale(1)', opacity: 1, offset: .35 },
        { transform: 'translate(' + o[0] * 1.2 + 'px,' + (o[1] - 26) + 'px) scale(.95)', opacity: 0 }
      ], { duration: 1300, delay: k * 120, easing: 'cubic-bezier(.2,.8,.3,1)', fill: 'backwards' }).onfinish = function () { c.remove(); };
    });
  }

  // Etkileşim: üzerine gelince duraklat, düğme, klavye, kaydırma
  ad.addEventListener('mouseenter', function () { hoverPause = true; syncPause(); });
  ad.addEventListener('mouseleave', function () { hoverPause = false; syncPause(); card.style.transform = ''; });
  document.getElementById('pp').addEventListener('click', function (e) { e.stopPropagation(); paused = !paused; syncPause(); });
  ad.addEventListener('mousemove', function (e) {
    var a = ad.getBoundingClientRect(), x = (e.clientX - a.left) / a.width - .5, y = (e.clientY - a.top) / a.height - .5;
    card.style.transform = 'rotateY(' + x * 26 + 'deg) rotateX(' + (-y * 16) + 'deg)';
  });
  ad.addEventListener('keydown', function (e) {
    if (e.key === 'ArrowRight') { e.preventDefault(); go(Math.min(cur + 1, SCENES.length - 1), true); }
    else if (e.key === 'ArrowLeft') { e.preventDefault(); go(Math.max(cur - 1, 0), true); }
    else if (e.target === ad && (e.key === 'Enter' || e.key === ' ')) { e.preventDefault(); exit(); }
  });
  var tx = null;
  ad.addEventListener('touchstart', function (e) { tx = e.touches[0].clientX; }, { passive: true });
  ad.addEventListener('touchend', function (e) {
    if (tx === null) return; var dx = e.changedTouches[0].clientX - tx; tx = null;
    if (Math.abs(dx) > 40) { ad.dataset.swiped = '1'; go(dx < 0 ? Math.min(cur + 1, SCENES.length - 1) : Math.max(cur - 1, 0), true); }
  });
  stage.addEventListener('click', function (e) {
    if (e.target.closest('.replay')) { e.stopPropagation(); runStart = Date.now(); go(0, true); }
    else if (e.target.closest('.sound')) {

    }
  });

  // Tıklama çıkışı
  function exit() {
    if (window.Enabler && Enabler.exit) return Enabler.exit('Bonus_BlackFriday_MediaFirst_Exit');
    window.open(window.clickTag, '_blank');
  }
  ad.addEventListener('click', function () {
    if (ad.dataset.swiped) { delete ad.dataset.swiped; return; }
    exit();
  });

  function start() {
    var ready = document.fonts && document.fonts.ready ? document.fonts.ready : Promise.resolve();
    ready.then(function () {
      els.forEach(function (el) { var l1 = el.querySelector('.l1'); if (l1) fit(l1, 560); });
      runStart = Date.now(); go(0);
    });
  }
  if (document.readyState === 'complete') requestAnimationFrame(start);
  else window.addEventListener('load', function () { requestAnimationFrame(start); });
})();
