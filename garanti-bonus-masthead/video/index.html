<style>
  /* Renkler bonus.com.tr ve garantibbva.com.tr'den ölçüldü (brand-ref/report.json) */
  :root {
    --lime: #7cc325;
    --lime-lt: #aaef51;
    --green-dk: #00623a;
    --yellow: #ffcc00;
    --yellow-dk: #f5bd00;
    --ink: #2e3033;
    --ease: cubic-bezier(.2,.9,.25,1);
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { width: 970px; height: 250px; overflow: hidden; background: #fff; }
  body { font-family: Roboto, Arial, sans-serif; -webkit-font-smoothing: antialiased; }
  .cond { font-family: "Barlow Condensed", "Roboto Condensed", "Arial Narrow", sans-serif; }

  #ad { position: relative; width: 970px; height: 250px; overflow: hidden; cursor: pointer;
    background: radial-gradient(360px 240px at 260px 130px, var(--lime-lt), transparent 70%), var(--lime); }
  #ad:focus-visible { outline: 3px solid var(--green-dk); outline-offset: -3px; }

  /* ---------- Kampanya görseli alanı (sol, 526×250) ---------- */
  .kv { position: absolute; left: 0; top: 0; width: 526px; height: 250px; overflow: hidden; }
  .rays { position: absolute; left: 260px; top: 130px; width: 1200px; height: 1200px; margin: -600px 0 0 -600px; pointer-events: none; opacity: .14;
    background: repeating-conic-gradient(from 0deg, #fff 0 4deg, transparent 4deg 14deg);
    -webkit-mask: radial-gradient(circle, #000 0, transparent 55%); mask: radial-gradient(circle, #000 0, transparent 55%); }

  .logo-tab { position: absolute; left: 0; top: 0; width: 160px; height: 52px; background: #fff; border-radius: 0 0 12px 0;
    display: flex; align-items: center; justify-content: center; box-shadow: 0 4px 14px rgba(0,98,58,.15); }
  .logo-tab img { height: 38px; display: block; }

  .head { position: absolute; left: 22px; top: 66px; }
  .tag { display: inline-flex; align-items: center; gap: 6px; height: 20px; padding: 0 9px; border-radius: 10px; border: 1.5px solid var(--green-dk);
    color: var(--green-dk); font: 800 12px/1 "Barlow Condensed", Arial Narrow, sans-serif; letter-spacing: 1px; }
  .tag i { width: 5px; height: 5px; border-radius: 50%; background: var(--green-dk); }
  .pill { display: table; margin-top: 5px; padding: 3px 12px 2px; border-radius: 22px; line-height: 1; font-weight: 800; text-transform: uppercase; white-space: nowrap; }
  .pill.y { background: var(--yellow); color: var(--green-dk); font-size: 23px; margin-top: 8px; }
  .pill.g { background: var(--green-dk); color: #fff; font-size: 28px; }
  .pill.g em { font-style: normal; color: var(--yellow); }

  .card-wrap { position: absolute; left: 296px; top: 30px; width: 200px; height: 126px; perspective: 700px; }
  .card { position: relative; width: 100%; height: 100%; border-radius: 12px; overflow: hidden; transform: rotate(-6deg);
    background: radial-gradient(160px 110px at 100% 0%, rgba(170,239,81,.55), transparent 65%), linear-gradient(135deg, #0b7a45 0%, var(--green-dk) 55%, #004a2b 100%);
    box-shadow: 0 16px 34px rgba(0,60,30,.45), 0 0 0 1px rgba(255,255,255,.18) inset; transition: transform .3s ease; }
  .card::before { content: ""; position: absolute; right: -60px; bottom: -90px; width: 220px; height: 160px; border-radius: 50%; border: 18px solid rgba(124,195,37,.55); }
  .card::after { content: ""; position: absolute; top: -50%; left: -60%; width: 40%; height: 200%; background: linear-gradient(90deg, transparent, rgba(255,255,255,.4), transparent); transform: rotate(20deg);
    animation: sweep 1s ease 1s; }
  @keyframes sweep { to { left: 130%; } }
  .card .plate { position: absolute; left: 10px; top: 9px; background: #fff; border-radius: 7px; padding: 3px 6px; }

  .card .num { position: absolute; left: 14px; bottom: 13px; font-size: 11px; font-weight: 500; letter-spacing: 2px; color: #fff; opacity: .9; }
  .card .bf-tag { position: absolute; right: 10px; bottom: 10px; background: var(--yellow); color: var(--green-dk); font: 800 11px/1 "Barlow Condensed", Arial Narrow, sans-serif; letter-spacing: .8px; padding: 4px 7px 3px; border-radius: 9px; }

  .cta { position: absolute; left: 296px; top: 184px; width: 200px; height: 42px; border: 0; border-radius: 6px; background: var(--yellow); color: var(--ink);
    font: 700 15px Roboto, Arial, sans-serif; display: flex; align-items: center; justify-content: center; gap: 8px; cursor: pointer;
    box-shadow: 0 6px 14px rgba(0,98,58,.25); transition: background .2s; }
  .cta svg { width: 15px; height: 15px; stroke: currentColor; stroke-width: 2.6; fill: none; transition: transform .2s; }
  #ad:hover .cta { background: var(--yellow-dk); }

  .cta.pulse { animation: ctapulse 1.4s ease 3; }
  @keyframes ctapulse { 50% { box-shadow: 0 0 0 8px rgba(255,204,0,.35), 0 6px 14px rgba(0,98,58,.25); } }
  .legal { position: absolute; left: 22px; bottom: 10px; font-size: 9px; color: var(--green-dk); opacity: .85; }

  /* Giriş animasyonu (kısa, tek sefer) */
  .logo-tab, .tag, .pill, .card-wrap, .cta { opacity: 0; }
  .in .logo-tab, .in .tag, .in .pill, .in .card-wrap, .in .cta { opacity: 1; transform: none; transition: opacity .5s ease, transform .7s var(--ease); }
  .logo-tab { transform: translateY(-100%); } .tag, .pill { transform: translateX(-20px); } .card-wrap { transform: translateX(40px) rotate(8deg); } .cta { transform: translateY(10px); }
  .in .tag { transition-delay: .15s; } .in .pill.y { transition-delay: .25s; } .in .pill:nth-of-type(3) { transition-delay: .35s; } .in .pill:nth-of-type(4) { transition-delay: .45s; }
  .in .card-wrap { transition-delay: .3s; } .in .cta { transition-delay: .6s; }

  .vid { position: absolute; left: 526px; top: 0; width: 444px; height: 250px; overflow: hidden; background: #003d24; cursor: default; }
  .vid video { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; background: #000; }

  .ph { position: absolute; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 10px; color: #fff;
    background: radial-gradient(260px 180px at 50% 45%, #0b7a45, transparent 70%), var(--green-dk); }
  .ph::before { content: ""; position: absolute; inset: 12px; border: 1.5px dashed rgba(170,239,81,.5); border-radius: 8px; }
  .ph .play { width: 58px; height: 58px; border-radius: 50%; background: var(--yellow); color: var(--green-dk); display: grid; place-items: center; box-shadow: 0 6px 18px rgba(0,0,0,.3); }
  .ph .play svg { width: 22px; height: 22px; fill: currentColor; margin-left: 4px; }
  .ph b { font: 800 22px/1 "Barlow Condensed", Arial Narrow, sans-serif; letter-spacing: .5px; text-transform: uppercase; }
  .ph small { font-size: 10px; opacity: .7; letter-spacing: .3px; }
  .has-video .ph { display: none; }

  .vctrl { position: absolute; left: 0; right: 0; bottom: 0; z-index: 3; height: 38px; display: flex; align-items: center; gap: 8px; padding: 0 10px;
    background: linear-gradient(transparent, rgba(0,0,0,.6)); opacity: 0; transition: opacity .25s; }
  .has-video .vctrl { opacity: 1; }
  .vctrl button { width: 26px; height: 26px; border: 0; border-radius: 50%; background: none; color: #fff; cursor: pointer; display: grid; place-items: center; }
  .vctrl button:hover, .vctrl button:focus-visible { background: rgba(255,255,255,.2); outline: none; }
  .vctrl svg { width: 14px; height: 14px; fill: currentColor; }
  .vbar { flex: 1; height: 4px; border-radius: 2px; background: rgba(255,255,255,.3); cursor: pointer; position: relative; }
  .vbar::before { content: ""; position: absolute; inset: -7px 0; }
  .vbar i { display: block; height: 100%; width: 0; border-radius: 2px; background: var(--yellow); }
  .vtime { color: #fff; font: 500 10px/1 Roboto, Arial, sans-serif; min-width: 26px; }
  .vid .i-play, .vid.stopped .i-pause, .vid .i-on, .vid.sound .i-off { display: none; }
  .vid.stopped .i-play, .vid.sound .i-on { display: block; }
  .vbig { position: absolute; left: 50%; top: 50%; z-index: 4; width: 58px; height: 58px; margin: -33px 0 0 -29px; border: 0; border-radius: 50%; cursor: pointer;
    background: var(--yellow); color: var(--green-dk); display: grid; place-items: center; box-shadow: 0 6px 18px rgba(0,0,0,.35);
    opacity: 0; transform: scale(.6); pointer-events: none; transition: all .3s cubic-bezier(.2,1.4,.4,1); }
  .vbig svg { width: 22px; height: 22px; fill: currentColor; margin-left: 4px; }
  .has-video.stopped .vbig { opacity: 1; transform: none; pointer-events: auto; }

    *, *::before, *::after { animation-duration: .01ms !important; animation-iteration-count: 1 !important; transition-duration: .01ms !important; transition-delay: 0s !important; }
  }

        <span class="chip"></span>
        <span class="num">•••• 2026</span>
        <span class="bf-tag">BLACK FRIDAY</span>
      </div>
    </div>
    <button class="cta" id="cta" type="button" tabindex="-1">Kampanyaları Keşfet <svg viewBox="0 0 24 24"><path d="M9 5l7 7-7 7"/></svg></button>
    <p class="legal">Kampanya koşulları için bonus.com.tr</p>
  </div>

  <div class="vid stopped" id="vid" role="region" aria-label="Kampanya filmi">
    <div class="ph" aria-hidden="true">
      <span class="play"><svg viewBox="0 0 16 16"><path d="M4 2.5v11l9.5-5.5z"/></svg></span>
      <b>Kampanya filmi</b>
      <small>Video alanı · 444 × 250 · 16:9</small>
    </div>
    <button class="vbig" type="button" aria-label="Oynat"><svg viewBox="0 0 16 16"><path d="M4 2.5v11l9.5-5.5z"/></svg></button>
    <div class="vctrl">
      <button class="vpp" type="button" aria-label="Oynat / duraklat">
        <span class="i-pause"><svg viewBox="0 0 16 16"><rect x="3" y="2" width="3.5" height="12" rx="1"/><rect x="9.5" y="2" width="3.5" height="12" rx="1"/></svg></span>
        <span class="i-play"><svg viewBox="0 0 16 16"><path d="M4 2.5v11l9.5-5.5z"/></svg></span>
      </button>
      <div class="vbar" role="slider" aria-label="Film ilerlemesi"><i></i></div>
      <span class="vtime">0:00</span>
      <button class="vmute" type="button" aria-label="Sesi aç / kapat">
        <span class="i-off"><svg viewBox="0 0 16 16"><path d="M2 6h3l4-3.5v11L5 10H2z"/><path d="M11 5.5l4 5m0-5l-4 5" stroke="currentColor" stroke-width="1.6" fill="none"/></svg></span>
        <span class="i-on"><svg viewBox="0 0 16 16"><path d="M2 6h3l4-3.5v11L5 10H2z"/><path d="M11.5 5a4 4 0 010 6M13 3.5a6.5 6.5 0 010 9" stroke="currentColor" stroke-width="1.5" fill="none"/></svg></span>
      </button>
      <button class="vfull" type="button" aria-label="Tam ekran"><svg viewBox="0 0 16 16"><path d="M2 6V2h4M10 2h4v4M14 10v4h-4M6 14H2v-4" stroke="currentColor" stroke-width="1.8" fill="none"/></svg></button>
    </div>
  </div>
</div>

<script>
(function () {
  var ad = document.getElementById('ad'), win = document.getElementById('vid'), cta = document.getElementById('cta');
  document.getElementById('plateLogo').src = document.getElementById('logo').src; // logo tek kez gömülür

  // Video alanı
  var vid = null, bar = win.querySelector('.vbar i'), time = win.querySelector('.vtime'), raf = null;
  if (VIDEO_URL) {
    vid = document.createElement('video');
    vid.muted = true; vid.playsInline = true; vid.setAttribute('playsinline', ''); vid.preload = 'auto'; vid.src = VIDEO_URL;
    if (VIDEO_POSTER) vid.poster = VIDEO_POSTER;
    win.insertBefore(vid, win.firstChild);
    win.classList.add('has-video');
    vid.addEventListener('ended', function () { stop(); cta.classList.remove('pulse'); void cta.offsetWidth; cta.classList.add('pulse'); });
  }
  function fmt(s) { s = Math.floor(s); return Math.floor(s / 60) + ':' + ('0' + s % 60).slice(-2); }
  function tick() {
    bar.style.width = (vid.currentTime / (vid.duration || 1) * 100) + '%'; time.textContent = fmt(vid.currentTime);
    raf = requestAnimationFrame(tick);
  }
  function play() { if (!vid) return; if (vid.ended) vid.currentTime = 0; vid.play().catch(function () {}); win.classList.remove('stopped'); cancelAnimationFrame(raf); tick(); }
  function stop() { if (!vid) return; vid.pause(); win.classList.add('stopped'); cancelAnimationFrame(raf); bar.style.width = (vid.currentTime / (vid.duration || 1) * 100) + '%'; }

  win.addEventListener('click', function (e) {
    e.stopPropagation(); // video alanı reklamdan çıkış yapmaz
    if (!vid) return exit(); // film yokken alan da tıklanabilir
    var t = e.target;
    if (t.closest('.vmute')) {
      var on = !win.classList.contains('sound'); win.classList.toggle('sound', on); vid.muted = !on;
      if (on && vid.paused) play();
    } else if (t.closest('.vfull')) { (vid.requestFullscreen || vid.webkitEnterFullscreen || function () {}).call(vid); }
    else if (t.closest('.vbar')) {
      var r = win.querySelector('.vbar').getBoundingClientRect();
      vid.currentTime = Math.max(0, Math.min(1, (e.clientX - r.left) / r.width)) * (vid.duration || 0);
      if (vid.paused) play();
    } else { vid.paused ? play() : stop(); }
  });

  // Kartta hafif 3B eğim
  var card = document.getElementById('card');
  ad.addEventListener('mousemove', function (e) {
    var a = ad.getBoundingClientRect(), x = (e.clientX - a.left) / a.width - .3, y = (e.clientY - a.top) / a.height - .5;
    card.style.transform = 'rotate(-6deg) rotateY(' + x * 24 + 'deg) rotateX(' + (-y * 14) + 'deg)';
  });
  ad.addEventListener('mouseleave', function () { card.style.transform = ''; });

  // Tıklama çıkışı
  function exit() {
    if (window.Enabler && Enabler.exit) return Enabler.exit('Bonus_BlackFriday_Video_Exit');
    window.open(window.clickTag, '_blank');
  }
  ad.addEventListener('click', exit);
  ad.addEventListener('keydown', function (e) {
    if (e.target === ad && (e.key === 'Enter' || e.key === ' ')) { e.preventDefault(); exit(); }
  });

  function start() { ad.classList.add('in'); setTimeout(function () { cta.classList.add('pulse'); }, 1400); play(); }
  if (document.readyState === 'complete') requestAnimationFrame(start);
  else window.addEventListener('load', function () { requestAnimationFrame(start); });
})();
</script>
</body>
</html>
