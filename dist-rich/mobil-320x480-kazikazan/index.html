<style>
:root {
  --navy: #132d7d;
  --navy-d: #0b1c52;
  --green: #5fa511;
  --green-l: #8fd14a;

  --sans: 'Manrope', 'Helvetica Neue', Arial, sans-serif;
  --ease: cubic-bezier(.22, .8, .2, 1);

* { box-sizing: border-box; margin: 0; padding: 0; }
html, body { width: 100%; height: 100%; overflow: hidden; background: var(--navy-d); }
body { font-family: var(--sans); color: var(--white); -webkit-font-smoothing: antialiased; -webkit-tap-highlight-color: transparent; user-select: none; -webkit-user-select: none; }

.ad { position: relative; overflow: hidden; background: var(--navy-d); cursor: pointer; }
.legal { font-size: 8px; line-height: 1.25; color: rgba(255, 255, 255, .72); letter-spacing: .01em; }

.coupon { display: inline-flex; align-items: center; gap: 8px; border-radius: 10px; background: rgba(255, 255, 255, .14); border: 1px dashed rgba(255, 255, 255, .55); padding: 6px 10px; transition: background .25s, transform .25s var(--ease); }

.coupon .cp-act { font-size: 9px; font-weight: 700; text-transform: uppercase; letter-spacing: .08em; color: var(--green-l); }
.coupon .cp-ok { display: none; }
.coupon.copied { background: var(--green); border-color: var(--green); }
.coupon.copied .cp-act { display: none; }
.coupon.copied .cp-ok { display: inline; font-size: 9px; font-weight: 800; text-transform: uppercase; letter-spacing: .08em; }

.cta { display: inline-flex; align-items: center; gap: 8px; height: 34px; padding: 0 16px; border-radius: 999px; background: var(--green); color: #fff; font-weight: 800; font-size: 12.5px; letter-spacing: .01em; white-space: nowrap; box-shadow: 0 6px 18px rgba(95, 165, 17, .38); transition: transform .25s var(--ease), background .25s; }

.cta i { font-style: normal; transition: transform .25s var(--ease); }
.cta:hover i { transform: translateX(3px); }

.pk:hover { transform: translateY(-4px) scale(1.04); box-shadow: 0 10px 22px rgba(5, 15, 50, .4); z-index: 2; }
.pk .tip { position: absolute; left: 50%; bottom: calc(100% + 6px); transform: translate(-50%, 4px); background: #fff; color: var(--navy); font-size: 10px; font-weight: 800; padding: 4px 8px; border-radius: 6px; white-space: nowrap; opacity: 0; pointer-events: none; transition: opacity .2s, transform .2s; box-shadow: 0 4px 12px rgba(0, 0, 0, .25); }

@media (prefers-reduced-motion: reduce) { *, *::before, *::after { transition-duration: .01s !important; animation-duration: .01s !important; } }

.ad { width: 320px; height: 480px; background: var(--navy-d); touch-action: none; }

.ticket::before { left: -9px; } .ticket::after { right: -9px; }

.win { position: absolute; inset: 0; z-index: 8; background: radial-gradient(circle at 50% 30%, #2a4aa8 0%, var(--navy-d) 70%); color: #fff; text-align: center; padding: 22px 18px 0; opacity: 0; pointer-events: none; transition: opacity .45s; }

.trio { display: flex; justify-content: center; gap: 8px; margin-top: 14px; }

.prize small { font-family: var(--sans); font-size: 13px; font-weight: 800; color: #fff; display: inline-block; text-align: left; margin-left: 6px; vertical-align: 12px; line-height: 1.2; }
.win .coupon { margin-top: 12px; width: 100%; justify-content: space-between; font-size: 12px; padding: 9px 12px; }

.win .cta { width: 100%; justify-content: center; height: 40px; margin-top: 9px; }
.win .pp { font-size: 10.5px; font-weight: 800; color: rgba(255, 255, 255, .75); margin-top: 9px; text-decoration: underline; }
.legal { position: absolute; z-index: 9; left: 14px; right: 14px; bottom: 6px; font-size: 7.3px; pointer-events: none; }
</style>

<script>
/* Ortak çalışma zamanı: tıklama çıkışları, ölçüm, kupon kopyalama. Her kreatifin içine satır içi gömülür. */
var AD = window.AD || {};
(function () {

})();

(function () {
  var K = AD.creative.kazi, D = AD.data, ad = document.getElementById('ad'), cv = document.getElementById('cv'), ctx = cv.getContext('2d');
  var $ = function (id) { return document.getElementById(id); };
  $('rule').textContent = K.rule; $('fine').textContent = K.fine;
  // Pencere dizilimi: 3 kazanan ürün + 3 farklı ürün, karışık (kazananlar en az bir satıra yayılır)
  var items = [K.win, K.win, K.win].concat(K.others);
  for (var i = items.length - 1; i > 0; i--) { var j = Math.floor(Math.random() * (i + 1)); var t = items[i]; items[i] = items[j]; items[j] = t; }
  var grid = $('grid');
  var cells = items.map(function (it) { var c = AD.h('div', 'cell', '<img src="' + it.img + '" alt="">'); grid.appendChild(c); return c; });
  // Pencere geometrisi (canvas css px): 3×2, boşluk 10
  var W = 260, H = 200, GAP = 10, CW = (W - 2 * GAP) / 3, CH = (H - GAP) / 2, S = 2;
  function rect(i) { var col = i % 3, row = Math.floor(i / 3); return { x: col * (CW + GAP), y: row * (CH + GAP), w: CW, h: CH }; }
  // Kazınan alanı kendimiz izleriz (canvas okunamasa da çalışır): her pencere 6×6 hücre
  var N = 6, cover = items.map(function () { return new Array(N * N).fill(false); }), opened = items.map(function () { return false; });
  var tex = new Image(); tex.src = 'img/kk-kaplama.webp';
  function paint() {
    ctx.clearRect(0, 0, cv.width, cv.height);
    items.forEach(function (it, i) {
      var r = rect(i), x = r.x * S, y = r.y * S, w = r.w * S, h = r.h * S, rr = 12 * S;
      ctx.save(); ctx.beginPath();
      ctx.moveTo(x + rr, y); ctx.arcTo(x + w, y, x + w, y + h, rr); ctx.arcTo(x + w, y + h, x, y + h, rr); ctx.arcTo(x, y + h, x, y, rr); ctx.arcTo(x, y, x + w, y, rr); ctx.closePath(); ctx.clip();
      // Gerçek bal peteği fotoğrafı + altın tonu
      var iw = tex.naturalWidth || 600, ih = tex.naturalHeight || 420, k = Math.max(w / iw, h / ih) * 2;
      if (tex.complete && tex.naturalWidth) ctx.drawImage(tex, x + (w - iw * k) / 2 + ((i % 3) - 1) * 20 * S, y + (h - ih * k) / 2, iw * k, ih * k);
      ctx.fillStyle = 'rgba(214,160,40,.35)'; ctx.fillRect(x, y, w, h);
      ctx.fillStyle = 'rgba(255,255,255,.92)'; ctx.font = '800 ' + (13 * S) + 'px Manrope, Arial, sans-serif'; ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
      ctx.shadowColor = 'rgba(0,0,0,.45)'; ctx.shadowBlur = 6;
      ctx.fillText('KAZI', x + w / 2, y + h / 2);

  }
  var last = null, started = false, done = false, demoing = false;

    if (demoing) { last = [px, py]; return; }
    var a = last || [px, py], steps = Math.max(1, Math.ceil(Math.hypot(px - a[0], py - a[1]) / 6));
    for (var s = 0; s <= steps; s++) {
      var qx = a[0] + (px - a[0]) * s / steps, qy = a[1] + (py - a[1]) * s / steps;
      items.forEach(function (it, i) {
        if (opened[i]) return; var r = rect(i);
        for (var cy = 0; cy < N; cy++) for (var cx = 0; cx < N; cx++) {

  }
  function check() {
    cover.forEach(function (c, i) {

  }
  var nOpen = 0, nWin = 0;
  function open(i, why) {
    if (opened[i]) return; opened[i] = true; nOpen++;
    var r = rect(i); ctx.clearRect(r.x * S - 2, r.y * S - 2, r.w * S + 4, r.h * S + 4);

    if (items[i] === K.win) { nWin++; cells[i].classList.add('hit'); $('cnt').innerHTML += ' · <b>' + nWin + '/3</b> D3 & K2'; }
    if (why !== 'auto') AD.track('kazi_open_' + items[i].key);
    if (nWin === 3) setTimeout(win, 650);
  }
  function win() {
    if (done) return; done = true;
    ad.classList.add('done');
    $('ws').textContent = '3 Vitamin D3 & K2 buldun — Kasım\'ın güneşsiz günlerine hazırsın.';
    $('trio').innerHTML = [-8, 0, 8].map(function (r) { return '<div style="--r:' + r + 'deg"><img src="' + K.win.img + '" alt=""></div>'; }).join('');
    $('win').classList.add('on');
    AD.track('kazi_win');
  }
  function pos(e) { var b = cv.getBoundingClientRect(); return [(e.clientX - b.left) * W / b.width, (e.clientY - b.top) * H / b.height]; }
  var down = false;
  cv.addEventListener('pointerdown', function (e) {
    down = true; last = null; e.preventDefault();
    if (!started) { started = true; ad.classList.add('user'); clearTimeout(demoT); AD.track('kazi_start'); }
    try { cv.setPointerCapture(e.pointerId); } catch (er) {}
    var p = pos(e); scratch(p[0], p[1]);
  });
  cv.addEventListener('pointermove', function (e) { if (down && !done) { var p = pos(e); scratch(p[0], p[1]); } });

  $('openAll').addEventListener('click', function (e) { e.stopPropagation(); AD.track('kazi_open_all'); items.forEach(function (it, i) { setTimeout(function () { open(i, 'all'); }, i * 160); }); });
  $('cp').addEventListener('click', function (e) { e.stopPropagation(); AD.copy(this, D.coupon.code); });
  $('go').addEventListener('click', function (e) { e.stopPropagation(); AD.exit('kazi_kupon', K.url); });
  $('pp').addEventListener('click', function (e) { e.stopPropagation(); AD.exit('kazi_d3k2', K.win.url); });
  $('win').addEventListener('click', function () { AD.exit('kazi_kupon', K.url); });
  // Tanıtım: ilk pencerede kısa bir kazıma; 8 sn'de "Hepsini aç" belirir; 20 sn etkileşim yoksa kart kendini açar
  var demoT = null;
  function demo() {
    if (started) return;
    var r = rect(0), pts = [], t0 = null;
    for (var k = 0; k <= 16; k++) pts.push([r.x + 14 + k * (r.w - 28) / 16, r.y + r.h / 2 + Math.sin(k / 16 * Math.PI * 3) * 18]);
    last = null; demoing = true;
    (function step(ts) { if (started) { demoing = false; return; } if (t0 === null) t0 = ts; var k = Math.min(pts.length - 1, Math.floor((ts - t0) / 30)); scratch(pts[k][0], pts[k][1]); if (k < pts.length - 1) requestAnimationFrame(step); else { last = null; demoing = false; } })(performance.now());
  }
  tex.onload = paint; paint();
  AD.ready(function () {
    AD.track('impression_ready');
    paint();
    if (AD.reduced) { $('openAll').classList.add('show'); return; }
    demoT = setTimeout(demo, 1500);
    setTimeout(function () { if (!done) $('openAll').classList.add('show'); }, 8000);
    setTimeout(function () { if (!started && !done) items.forEach(function (it, i) { setTimeout(function () { open(i, 'auto'); }, i * 200); }); }, 20000);
  });
})();
</script>
