<style>
:root {
  --navy: #132d7d;
  --navy-d: #0b1c52;
  --green: #5fa511;
  --green-l: #8fd14a;
  --ink: #0f1a3a;
  --white: #fff;
  --serif: 'Fraunces', Georgia, 'Times New Roman', serif;
  --sans: 'Manrope', 'Helvetica Neue', Arial, sans-serif;
  --ease: cubic-bezier(.22, .8, .2, 1);
}
* { box-sizing: border-box; margin: 0; padding: 0; }
html, body { width: 100%; height: 100%; overflow: hidden; background: var(--navy-d); }
body { font-family: var(--sans); color: var(--white); -webkit-font-smoothing: antialiased; -webkit-tap-highlight-color: transparent; user-select: none; -webkit-user-select: none; }
img { display: block; -webkit-user-drag: none; }
button { font: inherit; color: inherit; border: 0; background: none; cursor: pointer; }
.ad { position: relative; overflow: hidden; background: var(--navy-d); cursor: pointer; }
.legal { font-size: 8px; line-height: 1.25; color: rgba(255, 255, 255, .72); letter-spacing: .01em; }

/* Kupon çipi */
.coupon { display: inline-flex; align-items: center; gap: 8px; border-radius: 10px; background: rgba(255, 255, 255, .14); border: 1px dashed rgba(255, 255, 255, .55); padding: 6px 10px; transition: background .25s, transform .25s var(--ease); }
.coupon:hover { background: rgba(255, 255, 255, .22); }
.coupon:active { transform: scale(.97); }
.coupon b { font-weight: 800; letter-spacing: .08em; }
.coupon .cp-act { font-size: 9px; font-weight: 700; text-transform: uppercase; letter-spacing: .08em; color: var(--green-l); }
.coupon .cp-ok { display: none; }
.coupon.copied { background: var(--green); border-color: var(--green); }
.coupon.copied .cp-act { display: none; }
.coupon.copied .cp-ok { display: inline; font-size: 9px; font-weight: 800; text-transform: uppercase; letter-spacing: .08em; }

/* Yeşil CTA */
.cta { display: inline-flex; align-items: center; gap: 8px; height: 34px; padding: 0 16px; border-radius: 999px; background: var(--green); color: #fff; font-weight: 800; font-size: 12.5px; letter-spacing: .01em; white-space: nowrap; box-shadow: 0 6px 18px rgba(95, 165, 17, .38); transition: transform .25s var(--ease), background .25s; }
.cta:hover { background: #6cbb14; transform: translateY(-1px); }
.cta i { font-style: normal; transition: transform .25s var(--ease); }
.cta:hover i { transform: translateX(3px); }

/* Ürün kutucuğu (orijinal ambalaj fotoğrafı, beyaz kart) */
.pk { position: relative; flex: none; background: #fff; border-radius: 10px; display: flex; align-items: center; justify-content: center; box-shadow: 0 6px 16px rgba(5, 15, 50, .28); transition: transform .3s var(--ease), box-shadow .3s; }
.pk img { max-width: 86%; max-height: 82%; object-fit: contain; }
.pk:hover { transform: translateY(-4px) scale(1.04); box-shadow: 0 10px 22px rgba(5, 15, 50, .4); z-index: 2; }
.pk .tip { position: absolute; left: 50%; bottom: calc(100% + 6px); transform: translate(-50%, 4px); background: #fff; color: var(--navy); font-size: 10px; font-weight: 800; padding: 4px 8px; border-radius: 6px; white-space: nowrap; opacity: 0; pointer-events: none; transition: opacity .2s, transform .2s; box-shadow: 0 4px 12px rgba(0, 0, 0, .25); }
.pk:hover .tip { opacity: 1; transform: translate(-50%, 0); }

@media (prefers-reduced-motion: reduce) { *, *::before, *::after { transition-duration: .01s !important; animation-duration: .01s !important; } }

.ad { width: 970px; height: 250px; }
/* Sağ: günün dilimine göre değişen gerçek fotoğraf */
.scene { position: absolute; left: 380px; top: 0; width: 590px; height: 250px; overflow: hidden; }
.scene img { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; opacity: 0; transform: scale(1.06); transition: opacity .9s var(--ease), transform 6s var(--ease), filter .5s linear; }
.scene img.on { opacity: 1; transform: scale(1); }
.scene::after { content: ''; position: absolute; inset: 0; pointer-events: none; background: linear-gradient(90deg, var(--navy-d) 0%, rgba(11, 28, 82, .55) 18%, rgba(11, 28, 82, 0) 42%), linear-gradient(0deg, rgba(11, 28, 82, .85) 0%, rgba(11, 28, 82, 0) 40%); }
.chip { position: absolute; z-index: 2; right: 14px; top: 13px; font-size: 9.5px; font-weight: 800; letter-spacing: .1em; text-transform: uppercase; padding: 5px 10px 5px 20px; border-radius: 999px; background: rgba(11, 28, 82, .55); -webkit-backdrop-filter: blur(6px); backdrop-filter: blur(6px); }
.chip::before { content: ''; position: absolute; left: 9px; top: 50%; width: 6px; height: 6px; margin-top: -3px; border-radius: 50%; background: #ff5a4f; animation: blink 1.4s infinite; }
@keyframes blink { 50% { opacity: .25; } }
/* Sol: saat ve mesaj */
.side { position: absolute; left: 0; top: 0; width: 400px; height: 250px; background: var(--navy-d); padding: 15px 0 0 20px; z-index: 1; }
.side .logo { width: 104px; }

.clock span { font-size: 10px; font-weight: 800; letter-spacing: .1em; text-transform: uppercase; color: rgba(255, 255, 255, .75); line-height: 1.3; }
.msg { margin-top: 8px; width: 350px; transition: opacity .35s; }
.msg h1 { font-family: var(--serif); font-weight: 700; font-size: 23px; line-height: 1.05; }
.msg p { font-size: 11.5px; line-height: 1.4; font-weight: 600; color: rgba(255, 255, 255, .86); margin-top: 5px; }
.msg small { display: block; font-size: 9px; font-weight: 700; color: rgba(255, 255, 255, .6); margin-top: 4px; }
.side .act { position: absolute; left: 20px; right: 22px; bottom: 19px; display: flex; align-items: center; gap: 10px; }
.side .cta { height: 36px; }
.side .coupon { font-size: 10px; padding: 5px 9px; }
.side .legal { position: absolute; left: 20px; right: 8px; bottom: 4px; font-size: 6.8px; }
/* Gün çizelgesi (sürüklenebilir güneş) */
.day { position: absolute; z-index: 2; left: 520px; right: 20px; bottom: 16px; height: 46px; touch-action: none; cursor: pointer; }
.day .tr { position: absolute; left: 0; right: 0; top: 18px; height: 6px; border-radius: 6px; background: linear-gradient(90deg, #1a2557 0%, #1a2557 var(--r), #f3b443 calc(var(--r) + 3%), #ffe08a 50%, #f3a03b calc(var(--s) - 3%), #1a2557 var(--s), #1a2557 100%); }
.day .kn { position: absolute; top: 21px; width: 24px; height: 24px; margin: -12px 0 0 -12px; border-radius: 50%; background: #ffd25a; box-shadow: 0 0 0 4px rgba(255, 210, 90, .3), 0 0 18px rgba(255, 200, 70, .8); transition: background .3s, box-shadow .3s; }
.day .kn.night { background: #dfe6ff; box-shadow: 0 0 0 4px rgba(223, 230, 255, .25), 0 0 16px rgba(200, 210, 255, .7); }
.day .now { position: absolute; top: 10px; width: 2px; height: 22px; margin-left: -1px; background: #fff; }
.day .lb { position: absolute; top: 30px; left: 0; right: 0; display: flex; justify-content: space-between; font-size: 8.5px; font-weight: 800; color: rgba(255, 255, 255, .7); }
.day .sun { position: absolute; top: 0; font-size: 8.5px; font-weight: 800; color: rgba(255, 255, 255, .8); transform: translateX(-50%); white-space: nowrap; }
.hint { position: absolute; z-index: 3; left: 745px; bottom: 66px; transform: translateX(-50%); font-size: 10px; font-weight: 800; color: var(--navy); background: #fff; padding: 5px 10px; border-radius: 999px; box-shadow: 0 4px 12px rgba(0, 0, 0, .3); white-space: nowrap; opacity: 0; transition: opacity .3s; pointer-events: none; }
.hint.on { opacity: 1; }
</style>

<script>
/* Ortak çalışma zamanı: tıklama çıkışları, ölçüm, kupon kopyalama. Her kreatifin içine satır içi gömülür. */
var AD = window.AD || {};
(function () {
  // Ölçüm: Studio/DV360 Enabler varsa sayaç, yoksa konsol (ağ makrosuna buradan bağlanır).
  AD.track = function (name) {
    try { if (window.Enabler && Enabler.counter) Enabler.counter(name); } catch (e) {}
    if (window.console && console.debug) console.debug('[ad]', name);
  };
  // Çıkış: Enabler → exitOverride; clickTag tanımlıysa (Google Ads/CM360 tek çıkış) clickTag; yoksa UTM'li doğrudan adres.
  AD.exit = function (id, url) {
    AD.track('exit_' + id);
    try {
      if (window.Enabler && Enabler.exitOverride) { Enabler.exitOverride(id, url); return; }
    } catch (e) {}
    var tag = window.clickTag || window.clickTAG;
    window.open(tag || url, '_blank');
  };
  // Kupon kodunu panoya kopyalar; el.dataset.code okunur, geri bildirim için `copied` sınıfı eklenir.
  AD.copy = function (el, code, done) {
    function ok() {
      el.classList.add('copied');
      AD.track('coupon_copy');
      clearTimeout(el._t); el._t = setTimeout(function () { el.classList.remove('copied'); }, 1800);
      if (done) done();
    }
    try {
      if (navigator.clipboard && window.isSecureContext) { navigator.clipboard.writeText(code).then(ok, fallback); return; }
    } catch (e) {}
    fallback();
    function fallback() {
      var t = document.createElement('textarea');
      t.value = code; t.setAttribute('readonly', ''); t.style.cssText = 'position:fixed;opacity:0;left:-99px';
      document.body.appendChild(t); t.select();
      try { document.execCommand('copy'); } catch (e) {}
      document.body.removeChild(t); ok();
    }
  };
  AD.reduced = window.matchMedia && matchMedia('(prefers-reduced-motion: reduce)').matches;
  // Görseller yüklenince başlat (Enabler varsa görünür olduğunda).
  AD.ready = function (fn) {
    function go() {
      var imgs = [].slice.call(document.images), n = imgs.length, started = false;
      function start() { if (!started) { started = true; document.documentElement.classList.add('ready'); fn(); } }
      if (!n) return start();
      imgs.forEach(function (im) { if (im.complete) { if (!--n) start(); } else im.onload = im.onerror = function () { if (!--n) start(); }; });
      setTimeout(start, 2500);
    }
    if (window.Enabler && Enabler.isInitialized) {
      if (Enabler.isInitialized()) go(); else Enabler.addEventListener('init', go);
    } else if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', go); else go();
  };
  AD.h = function (tag, cls, html) { var e = document.createElement(tag); if (cls) e.className = cls; if (html != null) e.innerHTML = html; return e; };
})();

/* Gölgen ne diyor? — şehir + tarih için güneş hesabı ve kişisel rutin eşlemesi (kreatife satır içi gömülür). */
var GUNES = (function () {
  var RAD = Math.PI / 180;
  function dayOfYear(d) { return Math.round((Date.UTC(d.getFullYear(), d.getMonth(), d.getDate()) - Date.UTC(d.getFullYear(), 0, 0)) / 864e5); }
  // NOAA yaklaşımı (±2 dk): deklinasyon, zaman denklemi, öğle yüksekliği, gün uzunluğu, doğuş/batış (Türkiye UTC+3)
  function calc(city, date) {
    var N = dayOfYear(date), phi = city.lat * RAD;
    var g = 2 * Math.PI / 365 * (N - 1);
    var decl = 0.006918 - 0.399912 * Math.cos(g) + 0.070257 * Math.sin(g) - 0.006758 * Math.cos(2 * g) + 0.000907 * Math.sin(2 * g) - 0.002697 * Math.cos(3 * g) + 0.00148 * Math.sin(3 * g);
    var eot = 229.18 * (0.000075 + 0.001868 * Math.cos(g) - 0.032077 * Math.sin(g) - 0.014615 * Math.cos(2 * g) - 0.040849 * Math.sin(2 * g));
    var noonAlt = 90 - Math.abs(city.lat - decl / RAD);
    var cosW = (Math.sin(-0.833 * RAD) - Math.sin(phi) * Math.sin(decl)) / (Math.cos(phi) * Math.cos(decl));
    var w = Math.acos(Math.max(-1, Math.min(1, cosW))) / RAD;
    var noon = 720 - 4 * city.lon - eot + 180; // yerel dakika
    return { noonAlt: noonAlt, shadow: 1 / Math.tan(noonAlt * RAD), dayMin: 8 * w, rise: noon - 4 * w, set: noon + 4 * w, noon: noon };
  }
  function hm(min) { min = Math.round(min); return ('0' + Math.floor(min / 60)).slice(-2) + ':' + ('0' + (min % 60)).slice(-2); }
  function dur(min) { min = Math.round(Math.abs(min)); var h = Math.floor(min / 60), m = min % 60; return (h ? h + ' sa ' : '') + m + ' dk'; }
  function num(x) { return x.toFixed(1).replace('.', ','); }
  var AY = ['Ocak', 'Şubat', 'Mart', 'Nisan', 'Mayıs', 'Haziran', 'Temmuz', 'Ağustos', 'Eylül', 'Ekim', 'Kasım', 'Aralık'];
  function dateTR(d) { return d.getDate() + ' ' + AY[d.getMonth()]; }
  // Bulunma eki (ünlü uyumu): 18 Ekim'de, 30 Haziran'da, 1 Ağustos'ta
  var DA = ["'ta", "'ta", "'ta", "'da", "'ta", "'da", "'da", "'ta", "'de", "'de", "'da", "'ta"];
  function dateTRda(d) { return dateTR(d) + DA[d.getMonth()]; }
  // Haziran gündönümünden Aralık gündönümüne: t=0..1
  function yearSpan(now) {
    var y = now.getFullYear(), a = new Date(y, 5, 21), b = new Date(y, 11, 21);
    if (now < a) { a = new Date(y - 1, 5, 21); b = new Date(y - 1, 11, 21); }
    return { a: a, b: b, at: function (t) { return new Date(a.getTime() + (b - a) * t); }, tOf: function (d) { return Math.max(0, Math.min(1, (d - a) / (b - a))); } };
  }
  // Fotoğrafın ışığı: öğle güneşinin yüksekliğine göre (≈27° kış → ≈73° yaz)
  function light(alt) {
    var k = Math.max(0, Math.min(1, (alt - 25) / 48));
    return 'brightness(' + (0.5 + 0.58 * k).toFixed(3) + ') saturate(' + (0.45 + 0.7 * k).toFixed(3) + ') contrast(' + (0.92 + 0.12 * k).toFixed(3) + ') hue-rotate(' + ((1 - k) * 12).toFixed(1) + 'deg)';
  }
  // Cevaplar → en fazla 3 ürün (her zaman gün ışığı ürünüyle başlar)
  function recommend(answers, P) {
    var out = [answers.aile === 'cocuk' ? 'd3' : 'd3k2'];
    if (answers.aile === 'cocuk') out.push('omega3surup');
    out.push(answers.his === 'enerji' ? 'b12' : 'magnezyum');
    if (out.length < 3) out.push(answers.gun === 'masa' ? 'omega3' : 'krill');
    return out.slice(0, 3).map(function (k) { return P[k]; });
  }
  return { calc: calc, hm: hm, dur: dur, num: num, dateTR: dateTR, dateTRda: dateTRda, yearSpan: yearSpan, light: light, recommend: recommend };
})();

(function () {
  var S = AD.creative.gunsaat, D = AD.data, ad = document.getElementById('ad');
  var $ = function (id) { return document.getElementById(id); };
  // Saat: önizleme için ?saat=21 ya da window.AD_SAAT; yoksa izleyicinin yerel saati
  var q = window.AD_SAAT || +((location.search.match(/[?&]saat=(\d+)/) || [])[1] || NaN);
  var real = new Date(), nowMin = isNaN(q) ? real.getHours() * 60 + real.getMinutes() : q * 60;
  var sun = GUNES.calc(S.city, real);
  var imgs = S.slots.map(function (sl) { var im = new Image(); im.src = sl.img; im.alt = ''; $('scene').appendChild(im); return im; });
  // Gün çizelgesi: gün doğumu/batımı İstanbul için canlı hesaplanır
  $('tr').style.setProperty('--r', (sun.rise / 1440 * 100) + '%'); $('tr').style.setProperty('--s', (sun.set / 1440 * 100) + '%');
  $('rise').style.left = (sun.rise / 1440 * 100) + '%'; $('rise').textContent = 'Doğuş ' + GUNES.hm(sun.rise);
  $('set').style.left = (sun.set / 1440 * 100) + '%'; $('set').textContent = 'Batış ' + GUNES.hm(sun.set);
  $('now').style.left = (nowMin / 1440 * 100) + '%';
  function slotOf(min) { var h = min / 60, k = 3; S.slots.forEach(function (sl, i) { if (h >= sl.from) k = i; }); return h < S.slots[0].from ? 3 : k; }
  // Işık: güneş yüksekliği (doğuş–batış arası sinüs yaklaşımı); gece karanlık ve mavi
  function light(min) {
    var alt = min > sun.rise && min < sun.set ? sun.noonAlt * Math.sin(Math.PI * (min - sun.rise) / (sun.set - sun.rise)) : -8;
    var k = Math.max(0, Math.min(1, (alt + 6) / 36));
    return 'brightness(' + (0.55 + 0.5 * k).toFixed(2) + ') saturate(' + (0.6 + 0.55 * k).toFixed(2) + ')';
  }
  var cur = -1, min = nowMin;
  function render(m, live) {
    min = (m + 1440) % 1440;
    var i = slotOf(min), sl = S.slots[i];
    $('clk').textContent = GUNES.hm(min);
    $('where').innerHTML = S.city.name + '<br>' + sl.label;
    $('chip').textContent = live ? 'Şu an · ' + sl.label : sl.label;
    $('kn').style.left = (min / 1440 * 100) + '%';
    $('kn').classList.toggle('night', min < sun.rise || min > sun.set);
    imgs[i].style.filter = light(min);
    if (i !== cur) {
      cur = i;
      imgs.forEach(function (im, j) { im.classList.toggle('on', j === i); });
      $('msg').style.opacity = 0;
      setTimeout(function () { $('hl').textContent = sl.title; $('tx').textContent = sl.text; $('cl').textContent = sl.claim; $('go').innerHTML = sl.product.replace(' & Folik Asit', '') + ' <i>→</i>'; $('msg').style.opacity = 1; }, 200);
    }
  }
  // Sürükleme
  var dr = false, user = false, raf = null;
  function fromX(x) { var b = $('day').getBoundingClientRect(); render(Math.round(Math.max(0, Math.min(1, (x - b.left) / b.width)) * 1439), false); }
  $('day').addEventListener('pointerdown', function (e) { e.stopPropagation(); dr = true; first(); fromX(e.clientX); try { $('day').setPointerCapture(e.pointerId); } catch (er) {} });
  $('day').addEventListener('pointermove', function (e) { if (dr) fromX(e.clientX); });
  $('day').addEventListener('pointerup', function () { dr = false; AD.track('saat_' + S.slots[cur].key); });
  $('day').addEventListener('click', function (e) { e.stopPropagation(); });
  $('go').addEventListener('click', function (e) { e.stopPropagation(); AD.exit('saat_' + S.slots[cur].key, S.slots[cur].url); });
  $('cp').addEventListener('click', function (e) { e.stopPropagation(); AD.copy(this, D.coupon.code); });
  ad.addEventListener('click', function () { AD.exit('saat_' + S.slots[cur].key, S.slots[cur].url); });
  function first() { if (!user) { user = true; cancelAnimationFrame(raf); $('hint').classList.remove('on'); AD.track('saat_user'); } }
  // Tanıtım: güneş tüm günü bir kez gezer (≈ 7 sn), sonra şimdiki saate döner
  render(nowMin, true);
  AD.ready(function () {
    AD.track('impression_ready_' + S.slots[cur].key);
    if (AD.reduced) return;
    setTimeout(function () {
      if (user) return;
      $('hint').classList.add('on');
      var t0 = null, from = nowMin;
      (function step(ts) {
        if (user) return; if (t0 === null) t0 = ts;
        var k = Math.max(0, Math.min(1, (ts - t0) / 7000)), e = k < .5 ? 2 * k * k : 1 - Math.pow(-2 * k + 2, 2) / 2;
        render(from + e * 1440, false);
        if (k < 1) raf = requestAnimationFrame(step); else { render(nowMin, true); setTimeout(function () { $('hint').classList.remove('on'); }, 1800); }
      })(performance.now());
    }, 1600);
  });
})();
</script>
