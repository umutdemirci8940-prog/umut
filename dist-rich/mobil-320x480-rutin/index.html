<style>
:root {
  --navy: #132d7d;
  --navy-d: #0b1c52;
  --green: #5fa511;
  --green-l: #8fd14a;
  --ink: #0f1a3a;
  --white: #fff;
  --serif: 'Fraunces', Georgia, 'Times New Roman', serif;
  --sans: 'Manrope', 'Helvetica Neue', Arial, sans-serif;
  --ease: cubic-bezier(.22, .8, .2, 1);
}
* { box-sizing: border-box; margin: 0; padding: 0; }
html, body { width: 100%; height: 100%; overflow: hidden; background: var(--navy-d); }
body { font-family: var(--sans); color: var(--white); -webkit-font-smoothing: antialiased; -webkit-tap-highlight-color: transparent; user-select: none; -webkit-user-select: none; }
img { display: block; -webkit-user-drag: none; }
button { font: inherit; color: inherit; border: 0; background: none; cursor: pointer; }
.ad { position: relative; overflow: hidden; background: var(--navy-d); cursor: pointer; }
.legal { font-size: 8px; line-height: 1.25; color: rgba(255, 255, 255, .72); letter-spacing: .01em; }

/* Kupon çipi */
.coupon { display: inline-flex; align-items: center; gap: 8px; border-radius: 10px; background: rgba(255, 255, 255, .14); border: 1px dashed rgba(255, 255, 255, .55); padding: 6px 10px; transition: background .25s, transform .25s var(--ease); }
.coupon:hover { background: rgba(255, 255, 255, .22); }
.coupon:active { transform: scale(.97); }
.coupon b { font-weight: 800; letter-spacing: .08em; }
.coupon .cp-act { font-size: 9px; font-weight: 700; text-transform: uppercase; letter-spacing: .08em; color: var(--green-l); }
.coupon .cp-ok { display: none; }
.coupon.copied { background: var(--green); border-color: var(--green); }
.coupon.copied .cp-act { display: none; }
.coupon.copied .cp-ok { display: inline; font-size: 9px; font-weight: 800; text-transform: uppercase; letter-spacing: .08em; }

/* Yeşil CTA */
.cta { display: inline-flex; align-items: center; gap: 8px; height: 34px; padding: 0 16px; border-radius: 999px; background: var(--green); color: #fff; font-weight: 800; font-size: 12.5px; letter-spacing: .01em; white-space: nowrap; box-shadow: 0 6px 18px rgba(95, 165, 17, .38); transition: transform .25s var(--ease), background .25s; }
.cta:hover { background: #6cbb14; transform: translateY(-1px); }
.cta i { font-style: normal; transition: transform .25s var(--ease); }
.cta:hover i { transform: translateX(3px); }

/* Ürün kutucuğu (orijinal ambalaj fotoğrafı, beyaz kart) */
.pk { position: relative; flex: none; background: #fff; border-radius: 10px; display: flex; align-items: center; justify-content: center; box-shadow: 0 6px 16px rgba(5, 15, 50, .28); transition: transform .3s var(--ease), box-shadow .3s; }
.pk img { max-width: 86%; max-height: 82%; object-fit: contain; }
.pk:hover { transform: translateY(-4px) scale(1.04); box-shadow: 0 10px 22px rgba(5, 15, 50, .4); z-index: 2; }
.pk .tip { position: absolute; left: 50%; bottom: calc(100% + 6px); transform: translate(-50%, 4px); background: #fff; color: var(--navy); font-size: 10px; font-weight: 800; padding: 4px 8px; border-radius: 6px; white-space: nowrap; opacity: 0; pointer-events: none; transition: opacity .2s, transform .2s; box-shadow: 0 4px 12px rgba(0, 0, 0, .25); }
.pk:hover .tip { opacity: 1; transform: translate(-50%, 0); }

@media (prefers-reduced-motion: reduce) { *, *::before, *::after { transition-duration: .01s !important; animation-duration: .01s !important; } }

.ad { width: 320px; height: 480px; }
.head { position: absolute; left: 0; right: 0; top: 0; height: 58px; display: flex; align-items: center; justify-content: space-between; padding: 0 14px; background: var(--navy-d); }
.head .logo { width: 100px; }
.head .q { text-align: right; font-family: var(--serif); font-size: 15px; font-weight: 600; line-height: 1.08; }
.head .q em { font-style: italic; color: var(--green-l); }
/* Dikey akordeon: 4 fotoğraf şeridi */
.acc { position: absolute; left: 0; right: 0; top: 58px; height: 362px; display: flex; flex-direction: column; }
.st { position: relative; flex: 0 0 48px; overflow: hidden; border-top: 1px solid rgba(255, 255, 255, .2); transition: flex-basis .65s var(--ease); }
.st.on { flex-basis: 218px; }
.st > .ph { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; transform: scale(1.12); filter: saturate(.8) brightness(.62) blur(1px); transition: transform 3.6s linear, filter .5s; }
.st.on > .ph { transform: scale(1); filter: none; }
.st::before { content: ''; position: absolute; inset: 0; z-index: 1; background: linear-gradient(90deg, rgba(11, 28, 82, .6), rgba(11, 28, 82, .15)); transition: opacity .5s; }
.st.on::before { background: linear-gradient(180deg, rgba(11, 28, 82, .88) 0%, rgba(11, 28, 82, .5) 32%, rgba(11, 28, 82, 0) 50%, rgba(11, 28, 82, 0) 58%, rgba(11, 28, 82, .55) 100%); }
.lab { position: absolute; z-index: 2; left: 14px; right: 12px; top: 0; height: 48px; display: flex; align-items: center; gap: 10px; transition: opacity .3s; }
.lab .no { font-size: 10px; font-weight: 800; color: var(--green-l); letter-spacing: .1em; }
.lab .tt { font-family: var(--serif); font-size: 18px; font-weight: 600; }
.lab .ov2 { font-size: 9.5px; font-weight: 700; color: rgba(255, 255, 255, .75); letter-spacing: .04em; margin-left: 2px; }
.lab .plus { margin-left: auto; width: 26px; height: 26px; border-radius: 50%; border: 1.5px solid rgba(255, 255, 255, .7); display: flex; align-items: center; justify-content: center; font-size: 16px; font-weight: 700; line-height: 1; }
.st.on .lab { opacity: 0; pointer-events: none; }
.cnt { position: absolute; z-index: 2; inset: 0; padding: 12px 14px; opacity: 0; pointer-events: none; transition: opacity .25s; }
.st.on .cnt { opacity: 1; pointer-events: auto; transition: opacity .45s .25s; }
.cnt .ov { font-size: 9.5px; font-weight: 800; letter-spacing: .14em; text-transform: uppercase; color: var(--green-l); }
.cnt h2 { font-family: var(--serif); font-weight: 600; font-size: 26px; line-height: 1.04; margin-top: 2px; letter-spacing: -.01em; }
.cnt p { font-size: 10.5px; line-height: 1.32; font-weight: 600; max-width: 220px; margin-top: 4px; color: rgba(255, 255, 255, .92); text-shadow: 0 1px 8px rgba(0, 0, 0, .4); }
.bar { position: absolute; left: 10px; right: 10px; bottom: 10px; height: 66px; border-radius: 14px; display: flex; align-items: center; gap: 6px; padding: 0 8px; background: rgba(11, 28, 82, .4); -webkit-backdrop-filter: blur(12px) saturate(1.4); backdrop-filter: blur(12px) saturate(1.4); border: 1px solid rgba(255, 255, 255, .22); }
.bar .pk { width: 50px; height: 50px; border-radius: 8px; opacity: 0; transform: translateY(10px); }
.st.on .bar .pk { opacity: 1; transform: none; transition: opacity .4s var(--ease), transform .4s var(--ease); }
.st.on .bar .pk:nth-child(1) { transition-delay: .4s; } .st.on .bar .pk:nth-child(2) { transition-delay: .5s; } .st.on .bar .pk:nth-child(3) { transition-delay: .6s; }
.bar .cta { margin-left: auto; height: 36px; padding: 0 13px; font-size: 12px; }
.prog { position: absolute; z-index: 3; left: 0; top: 0; height: 3px; width: 0; background: var(--green); }
.st.on.run .prog { width: 100%; transition: width var(--dur, 3.6s) linear; }
/* Alt: kupon + yasal ibare */
.foot { position: absolute; left: 0; right: 0; bottom: 0; height: 60px; background: var(--navy-d); padding: 7px 14px 0; }
.foot .coupon { width: 100%; justify-content: space-between; font-size: 11px; padding: 5px 10px; border-radius: 8px; }
.foot .coupon .pct { font-family: var(--serif); font-size: 17px; font-weight: 700; color: var(--green-l); }
.foot .legal { margin-top: 4px; font-size: 7.3px; }
</style>
</head>

sim_2026&utm_content=mobil_rutin_cocuk_d3"}],"url":"https://ilacsizyasam.com/products/gelisim-paketi?utm_source=display&utm_medium=rich_media&utm_campaign=kasim_2026&utm_content=mobil_rutin_cocuk","img":{"st":"img/st-cocuk.webp"}},{"key":"aktif","over":"Spor & hareket","title":"Aktif Yaşam","claim":"Magnezyum normal kas fonksiyonuna katkıda bulunur.","cta":"Formunu destekle","path":"/collections/omegalar-probiyotik","focus":"50% 55%","mini":"22% 40%","products":[{"key":"magnezyum","name":"Magnezyum","path":"/products/magnezyum","img":"img/p-magnezyum.webp","url":"https://ilacsizyasam.com/products/magnezyum?utm_source=display&utm_medium=rich_media&utm_campaign=kasim_2026&utm_content=mobil_rutin_aktif_magnezyum"},{"key":"krill","name":"Krill Yağı","path":"/products/krill-yagi","img":"img/p-krill.webp","url":"https://ilacsizyasam.com/products/krill-yagi?utm_source=display&utm_medium=rich_media&utm_campaign=kasim_2026&utm_content=mobil_rutin_aktif_krill"},{"key":"spirulina","name":"Spirulina","path":"/products/spirulina","img":"img/p-spirulina.webp","url":"https://ilacsizyasam.com/products/spirulina?utm_source=display&utm_medium=rich_media&utm_campaign=kasim_2026&utm_content=mobil_rutin_aktif_spirulina"}],"url":"https://ilacsizyasam.com/collections/omegalar-probiyotik?utm_source=display&utm_medium=rich_media&utm_campaign=kasim_2026&utm_content=mobil_rutin_aktif","img":{"st":"img/st-aktif.webp"}}]}};</script>
<script>
/* Ortak çalışma zamanı: tıklama çıkışları, ölçüm, kupon kopyalama. Her kreatifin içine satır içi gömülür. */
var AD = window.AD || {};
(function () {
  // Ölçüm: Studio/DV360 Enabler varsa sayaç, yoksa konsol (ağ makrosuna buradan bağlanır).
  AD.track = function (name) {
    try { if (window.Enabler && Enabler.counter) Enabler.counter(name); } catch (e) {}
    if (window.console && console.debug) console.debug('[ad]', name);
  };
  // Çıkış: Enabler → exitOverride; clickTag tanımlıysa (Google Ads/CM360 tek çıkış) clickTag; yoksa UTM'li doğrudan adres.
  AD.exit = function (id, url) {
    AD.track('exit_' + id);
    try {
      if (window.Enabler && Enabler.exitOverride) { Enabler.exitOverride(id, url); return; }
    } catch (e) {}
    var tag = window.clickTag || window.clickTAG;
    window.open(tag || url, '_blank');
  };
  // Kupon kodunu panoya kopyalar; el.dataset.code okunur, geri bildirim için `copied` sınıfı eklenir.
  AD.copy = function (el, code, done) {
    function ok() {
      el.classList.add('copied');
      AD.track('coupon_copy');
      clearTimeout(el._t); el._t = setTimeout(function () { el.classList.remove('copied'); }, 1800);
      if (done) done();
    }
    try {
      if (navigator.clipboard && window.isSecureContext) { navigator.clipboard.writeText(code).then(ok, fallback); return; }
    } catch (e) {}
    fallback();
    function fallback() {
      var t = document.createElement('textarea');
      t.value = code; t.setAttribute('readonly', ''); t.style.cssText = 'position:fixed;opacity:0;left:-99px';
      document.body.appendChild(t); t.select();
      try { document.execCommand('copy'); } catch (e) {}
      document.body.removeChild(t); ok();
    }
  };
  AD.reduced = window.matchMedia && matchMedia('(prefers-reduced-motion: reduce)').matches;
  // Görseller yüklenince başlat (Enabler varsa görünür olduğunda).
  AD.ready = function (fn) {
    function go() {
      var imgs = [].slice.call(document.images), n = imgs.length, started = false;
      function start() { if (!started) { started = true; document.documentElement.classList.add('ready'); fn(); } }
      if (!n) return start();
      imgs.forEach(function (im) { if (im.complete) { if (!--n) start(); } else im.onload = im.onerror = function () { if (!--n) start(); }; });
      setTimeout(start, 2500);
    }
    if (window.Enabler && Enabler.isInitialized) {
      if (Enabler.isInitialized()) go(); else Enabler.addEventListener('init', go);
    } else if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', go); else go();
  };
  AD.h = function (tag, cls, html) { var e = document.createElement(tag); if (cls) e.className = cls; if (html != null) e.innerHTML = html; return e; };
})();

(function () {
  var D = AD.data, acc = document.getElementById('acc'), ad = document.getElementById('ad');
  var strips = D.segments.map(function (s, i) {
    var st = AD.h('div', 'st');
    st.innerHTML = '<img class="ph" src="' + s.img.st + '" alt="">' + '<div class="prog"></div>' +
      '<div class="lab"><span class="no">0' + (i + 1) + '</span><span class="tt">' + s.title + '</span><span class="ov2">' + s.over + '</span><span class="plus">+</span></div>' +
      '<div class="cnt"><div class="ov">' + s.over + '</div><h2>' + s.title + '</h2><p>' + s.claim + '</p>' +
      '<div class="bar">' + s.products.map(function (p, j) { return '<div class="pk" data-p="' + j + '"><img src="' + p.img + '" alt="' + p.name + '"></div>'; }).join('') +
      '<button class="cta">Keşfet <i>→</i></button></div></div>';
    st.addEventListener('click', function (e) {
      e.stopPropagation(); stopAuto();
      if (!st.classList.contains('on')) return open(i, 'tap');
      var pk = e.target.closest('.pk');
      if (pk) { var p = s.products[+pk.dataset.p]; return AD.exit(s.key + '_' + p.key, p.url); }
      AD.exit(s.key, s.url);
    });
    acc.appendChild(st);
    return st;
  });
  var cur = -1;
  function open(i, why) {
    if (i === cur) return;
    strips.forEach(function (p, j) { p.classList.toggle('on', j === i); p.classList.remove('run'); });
    cur = i;
    if (why !== 'auto') AD.track('segment_' + D.segments[i].key + '_' + why);
  }
  // Otomatik akış: her şerit 3,6 sn, iki tur (< 30 sn), sonra ilk şeritte durur.
  var DUR = 3600, step = 0, timer = null, autoOn = true;
  acc.style.setProperty('--dur', DUR + 'ms');
  function tick() {
    if (!autoOn) return;
    if (step >= D.segments.length * 2) { stopAuto(); open(0, 'auto'); return; }
    var i = step % D.segments.length;
    open(i, 'auto');
    var p = strips[i]; p.classList.remove('run'); void p.offsetWidth; p.classList.add('run');
    step++; timer = setTimeout(tick, DUR);
  }
  function stopAuto() { if (!autoOn) return; autoOn = false; clearTimeout(timer); strips.forEach(function (p) { p.classList.remove('run'); }); }
  document.getElementById('cp').addEventListener('click', function (e) { e.stopPropagation(); AD.copy(this, D.coupon.code); });
  ad.addEventListener('click', function () { AD.exit('brand', D.brand.home); });
  ad.addEventListener('keydown', function (e) {
    if (e.key === 'ArrowDown' || e.key === 'ArrowUp') { e.preventDefault(); stopAuto(); open((cur + (e.key === 'ArrowDown' ? 1 : D.segments.length - 1)) % D.segments.length, 'key'); }
    if (e.key === 'Enter') AD.exit(D.segments[cur].key, D.segments[cur].url);
  });
  open(0, 'auto');
  AD.ready(function () {
    AD.track('impression_ready');
    if (AD.reduced) { autoOn = false; return; }
    setTimeout(tick, 700);
  });
})();
</script>
