<!DOCTYPE html>
<html lang="tr">
<head>

<meta name="viewport" content="width=320,height=480,initial-scale=1,user-scalable=no">
<title>İlaçsız Yaşam – Rutin Eşleştir 320x480</title>
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,600;0,9..144,700;1,9..144,600&family=Manrope:wght@500;700;800&display=swap" rel="stylesheet">
<style>
:root {
  --navy: #132d7d;
  --navy-d: #0b1c52;
  --green: #5fa511;
  --green-l: #8fd14a;
  --ink: #0f1a3a;
  --white: #fff;
  --serif: 'Fraunces', Georgia, 'Times New Roman', serif;
  --sans: 'Manrope', 'Helvetica Neue', Arial, sans-serif;
  --ease: cubic-bezier(.22, .8, .2, 1);
}
* { box-sizing: border-box; margin: 0; padding: 0; }
html, body { width: 100%; height: 100%; overflow: hidden; background: var(--navy-d); }
body { font-family: var(--sans); color: var(--white); -webkit-font-smoothing: antialiased; -webkit-tap-highlight-color: transparent; user-select: none; -webkit-user-select: none; }
img { display: block; -webkit-user-drag: none; }
button { font: inherit; color: inherit; border: 0; background: none; cursor: pointer; }
.ad { position: relative; overflow: hidden; background: var(--navy-d); cursor: pointer; }
.legal { font-size: 8px; line-height: 1.25; color: rgba(255, 255, 255, .72); letter-spacing: .01em; }

/* Kupon çipi */
.coupon { display: inline-flex; align-items: center; gap: 8px; border-radius: 10px; background: rgba(255, 255, 255, .14); border: 1px dashed rgba(255, 255, 255, .55); padding: 6px 10px; transition: background .25s, transform .25s var(--ease); }
.coupon:hover { background: rgba(255, 255, 255, .22); }
.coupon:active { transform: scale(.97); }
.coupon b { font-weight: 800; letter-spacing: .08em; }
.coupon .cp-act { font-size: 9px; font-weight: 700; text-transform: uppercase; letter-spacing: .08em; color: var(--green-l); }
.coupon .cp-ok { display: none; }
.coupon.copied { background: var(--green); border-color: var(--green); }
.coupon.copied .cp-act { display: none; }
.coupon.copied .cp-ok { display: inline; font-size: 9px; font-weight: 800; text-transform: uppercase; letter-spacing: .08em; }

/* Yeşil CTA */
.cta { display: inline-flex; align-items: center; gap: 8px; height: 34px; padding: 0 16px; border-radius: 999px; background: var(--green); color: #fff; font-weight: 800; font-size: 12.5px; letter-spacing: .01em; white-space: nowrap; box-shadow: 0 6px 18px rgba(95, 165, 17, .38); transition: transform .25s var(--ease), background .25s; }
.cta:hover { background: #6cbb14; transform: translateY(-1px); }
.cta i { font-style: normal; transition: transform .25s var(--ease); }
.cta:hover i { transform: translateX(3px); }

/* Ürün kutucuğu (orijinal ambalaj fotoğrafı, beyaz kart) */
.pk { position: relative; flex: none; background: #fff; border-radius: 10px; display: flex; align-items: center; justify-content: center; box-shadow: 0 6px 16px rgba(5, 15, 50, .28); transition: transform .3s var(--ease), box-shadow .3s; }
.pk img { max-width: 86%; max-height: 82%; object-fit: contain; }
.pk:hover { transform: translateY(-4px) scale(1.04); box-shadow: 0 10px 22px rgba(5, 15, 50, .4); z-index: 2; }
.pk .tip { position: absolute; left: 50%; bottom: calc(100% + 6px); transform: translate(-50%, 4px); background: #fff; color: var(--navy); font-size: 10px; font-weight: 800; padding: 4px 8px; border-radius: 6px; white-space: nowrap; opacity: 0; pointer-events: none; transition: opacity .2s, transform .2s; box-shadow: 0 4px 12px rgba(0, 0, 0, .25); }
.pk:hover .tip { opacity: 1; transform: translate(-50%, 0); }

@media (prefers-reduced-motion: reduce) { *, *::before, *::after { transition-duration: .01s !important; animation-duration: .01s !important; } }

.ad { width: 320px; height: 480px; }
.head { position: absolute; left: 14px; right: 14px; top: 12px; display: flex; align-items: flex-start; justify-content: space-between; }
.head .logo { width: 96px; }
.head .t { text-align: right; }
.head h1 { font-family: var(--serif); font-weight: 600; font-size: 19px; line-height: 1.05; }
.head h1 em { color: var(--green-l); }
.head .mv { font-size: 9.5px; font-weight: 800; letter-spacing: .06em; color: rgba(255, 255, 255, .7); margin-top: 3px; text-transform: uppercase; }
/* Kartlar */
.grid { position: absolute; left: 8px; top: 76px; width: 304px; height: 306px; display: grid; grid-template-columns: repeat(3, 1fr); grid-template-rows: repeat(2, 1fr); gap: 8px; perspective: 900px; }
.cd { position: relative; transform-style: preserve-3d; transition: transform .55s var(--ease); cursor: pointer; }
.cd.up { transform: rotateY(180deg); }
.cd .f, .cd .b { position: absolute; inset: 0; border-radius: 12px; overflow: hidden; -webkit-backface-visibility: hidden; backface-visibility: hidden; box-shadow: 0 6px 16px rgba(0, 0, 0, .3); }
.cd .b > img:first-child { width: 100%; height: 100%; object-fit: cover; filter: saturate(.85) brightness(.82); }
.cd .b .lg { position: absolute; left: 50%; top: 50%; width: 70px; transform: translate(-50%, -50%); filter: drop-shadow(0 2px 8px rgba(0, 0, 0, .5)); }
.cd .b::after { content: ''; position: absolute; inset: 0; border-radius: 12px; box-shadow: inset 0 0 0 2px rgba(255, 255, 255, .35); }
.cd .f { transform: rotateY(180deg); background: #fff; }
.cd .f > img.ph { width: 100%; height: 100%; object-fit: cover; }
.cd .f > img.pk { position: absolute; left: 50%; top: 46%; max-width: 84%; max-height: 64%; transform: translate(-50%, -50%); }
.cd .f .nm { position: absolute; left: 6px; right: 6px; bottom: 6px; text-align: center; font-size: 9px; font-weight: 800; color: var(--navy); line-height: 1.15; }
.cd .f .ok { position: absolute; left: 6px; right: 6px; bottom: 6px; padding: 4px 4px; border-radius: 7px; background: var(--green); color: #fff; font-size: 9px; font-weight: 800; text-align: center; transform: translateY(140%); transition: transform .4s var(--ease) .2s; }
.cd.done .f { box-shadow: 0 0 0 3px var(--green-l), 0 8px 20px rgba(95, 165, 17, .45); }
.cd.done .f .ok { transform: none; }
.cd.done .f .nm { opacity: 0; }
.cd.miss { animation: shake .4s; }
@keyframes shake { 25% { transform: rotateY(180deg) translateX(-5px); } 75% { transform: rotateY(180deg) translateX(5px); } }
/* Durum satırı */
.st { position: absolute; left: 14px; right: 14px; top: 392px; display: flex; align-items: center; gap: 10px; }
.st .pr { display: flex; gap: 4px; }
.st .pr i { width: 22px; height: 5px; border-radius: 5px; background: rgba(255, 255, 255, .25); transition: background .4s; }
.st .pr i.on { background: var(--green-l); }
.st .msg { font-size: 11px; font-weight: 700; color: rgba(255, 255, 255, .88); }
.st .msg b { color: var(--green-l); }
.pill { position: absolute; z-index: 4; left: 50%; top: 210px; transform: translate(-50%, 0) scale(.9); padding: 10px 18px; border-radius: 999px; background: #fff; color: var(--navy); font-size: 14px; font-weight: 800; white-space: nowrap; box-shadow: 0 10px 26px rgba(0, 0, 0, .35); opacity: 0; transition: opacity .3s, transform .3s var(--ease); pointer-events: none; }
.pill.show { opacity: 1; transform: translate(-50%, 0) scale(1); }
.tease { position: absolute; left: 14px; right: 14px; top: 418px; font-size: 10px; font-weight: 700; color: rgba(255, 255, 255, .7); }
.tease b { color: #fff; }
/* Final ekranı */
.end { position: absolute; inset: 0; z-index: 8; opacity: 0; pointer-events: none; transition: opacity .6s var(--ease); }
.end.on { opacity: 1; pointer-events: auto; }
.end > img.bg { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; object-position: 50% 28%; transform: scale(1.1); transition: transform 3s var(--ease); }
.end.on > img.bg { transform: scale(1); }
.end::after { content: ''; position: absolute; inset: 0; background: linear-gradient(180deg, rgba(11, 28, 82, .5) 0%, rgba(11, 28, 82, 0) 18%, rgba(11, 28, 82, 0) 30%, rgba(11, 28, 82, .9) 50%, rgba(11, 28, 82, .98) 100%); }
.end .in { position: absolute; z-index: 1; left: 16px; right: 16px; bottom: 28px; }
.end .ov { font-size: 10px; font-weight: 800; letter-spacing: .14em; text-transform: uppercase; color: var(--green-l); }
.end h2 { font-family: var(--serif); font-weight: 600; font-size: 23px; line-height: 1.05; margin-top: 3px; }
.end .big { font-family: var(--serif); font-weight: 700; font-size: 58px; line-height: .9; color: var(--green-l); margin-top: 6px; }
.end .big small { font-family: var(--sans); font-size: 13px; font-weight: 800; color: #fff; display: inline-block; margin-left: 6px; line-height: 1.15; vertical-align: 8px; }
.end .row { display: flex; gap: 7px; margin-top: 10px; }
.end .row .pk { width: 58px; height: 56px; }
.end .coupon { margin-top: 10px; width: 100%; justify-content: space-between; font-size: 12px; padding: 8px 12px; }
.end .coupon b { font-size: 14px; }
.end .cta { width: 100%; justify-content: center; height: 38px; margin-top: 8px; font-size: 13px; }
.end .logo { position: absolute; z-index: 1; left: 14px; top: 12px; width: 96px; }
.legal { position: absolute; z-index: 9; left: 14px; right: 14px; bottom: 6px; font-size: 7.3px; pointer-events: none; }
</style>
</head>
<body>
<div class="ad" id="ad" role="link" tabindex="0" aria-label="İlaçsız Yaşam – Rutin eşleştir: her anı ürünüyle eşleştir, yüzde 10 indirim kodunu kazan.">
  <div class="head">
    <img class="logo" src="img/logo-beyaz.webp" alt="İlaçsız Yaşam">
    <div class="t"><h1>Anı <em>rutiniyle</em><br>eşleştir.</h1><div class="mv" id="mv">0 hamle</div></div>
  </div>
  <div class="grid" id="grid"></div>
  <div class="pill" id="pill">Ezberle!</div>
  <div class="st"><div class="pr" id="pr"><i></i><i></i><i></i></div><div class="msg" id="msg">Kartlara dokun, eşleri bul.</div></div>
  <div class="tease">Üç eşi bul, <b>%10 yeni üye kodunu</b> aç.</div>
  <div class="end" id="end">
    <img class="bg" src="img/mb-doktor.webp" alt="Dr. Ümit Aktaş">
    <img class="logo" src="img/logo-beyaz.webp" alt="İlaçsız Yaşam">
    <div class="in">
      <div class="ov" id="endOv">Rutini tamamladın</div>
      <h2>Kasım'da kendine <em style="color:var(--green-l)">iyi bak.</em></h2>
      <div class="big">%10<small>ilk<br>alışverişte</small></div>
      <div class="row" id="endRow"></div>
      <button class="coupon" id="cp"><span>İndirim kodu: <b>YENIUYE10</b></span><span class="cp-act">Kopyala</span><span class="cp-ok">✓ Kopyalandı</span></button>
      <button class="cta" id="cta">Alışverişe başla <i>→</i></button>
    </div>
  </div>
  <div class="legal">Takviye edici gıdalar ilaç değildir. Hastalıkların önlenmesi veya tedavi edilmesi amacıyla kullanılmaz.</div>
</div>
<script>window.AD = {"creative":{"memory":[{"key":"enerji","img":"img/m-enerji.webp","pack":"img/p-b12.webp","name":"B12 & Folik Asit","url":"https://ilacsizyasam.com/products/vitamin-b12-metilfolat?utm_source=display&utm_medium=rich_media&utm_campaign=kasim_2026&utm_content=mobil_eslestir_enerji"},{"key":"hareket","img":"img/m-aktif.webp","pack":"img/p-krill.webp","name":"Krill Yağı","url":"https://ilacsizyasam.com/products/krill-yagi?utm_source=display&utm_medium=rich_media&utm_campaign=kasim_2026&utm_content=mobil_eslestir_hareket"},{"key":"cocuk","img":"img/m-cocuk.webp","pack":"img/p-omega3surup.webp","name":"Omega 3 Şurup","url":"https://ilacsizyasam.com/products/omega-3-surup?utm_source=display&utm_medium=rich_media&utm_campaign=kasim_2026&utm_content=mobil_eslestir_cocuk"}]},"data":{"brand":{"name":"İlaçsız Yaşam","by":"Dr. Ümit Aktaş Ürünleri Resmi Satış Noktası","headline":"Kasım'da kendine iyi bak.","sub":"Sana uygun rutini seç, keşfet.","legal":"Takviye edici gıdalar ilaç değildir. Hastalıkların önlenmesi veya tedavi edilmesi amacıyla kullanılmaz.","home":"https://ilacsizyasam.com/collections/gida-takviyeleri?utm_source=display&utm_medium=rich_media&utm_campaign=kasim_2026&utm_content=mobil_eslestir_genel"},"coupon":{"over":"Yeni üyelere","pct":"%10","text":"ilk alışverişte indirim","code":"YENIUYE10","copied":"Kod kopyalandı","url":"https://ilacsizyasam.com/collections/en-cok-satanlar?utm_source=display&utm_medium=rich_media&utm_campaign=kasim_2026&utm_content=mobil_eslestir_kupon"}}};</script>
<script>
/* Ortak çalışma zamanı: tıklama çıkışları, ölçüm, kupon kopyalama. Her kreatifin içine satır içi gömülür. */
var AD = window.AD || {};
(function () {
  // Ölçüm: Studio/DV360 Enabler varsa sayaç, yoksa konsol (ağ makrosuna buradan bağlanır).
  AD.track = function (name) {
    try { if (window.Enabler && Enabler.counter) Enabler.counter(name); } catch (e) {}
    if (window.console && console.debug) console.debug('[ad]', name);
  };
  // Çıkış: Enabler → exitOverride; clickTag tanımlıysa (Google Ads/CM360 tek çıkış) clickTag; yoksa UTM'li doğrudan adres.
  AD.exit = function (id, url) {
    AD.track('exit_' + id);
    try {
      if (window.Enabler && Enabler.exitOverride) { Enabler.exitOverride(id, url); return; }
    } catch (e) {}
    var tag = window.clickTag || window.clickTAG;
    window.open(tag || url, '_blank');
  };
  // Kupon kodunu panoya kopyalar; el.dataset.code okunur, geri bildirim için `copied` sınıfı eklenir.
  AD.copy = function (el, code, done) {
    function ok() {
      el.classList.add('copied');
      AD.track('coupon_copy');
      clearTimeout(el._t); el._t = setTimeout(function () { el.classList.remove('copied'); }, 1800);
      if (done) done();
    }
    try {
      if (navigator.clipboard && window.isSecureContext) { navigator.clipboard.writeText(code).then(ok, fallback); return; }
    } catch (e) {}
    fallback();
    function fallback() {
      var t = document.createElement('textarea');
      t.value = code; t.setAttribute('readonly', ''); t.style.cssText = 'position:fixed;opacity:0;left:-99px';
      document.body.appendChild(t); t.select();
      try { document.execCommand('copy'); } catch (e) {}
      document.body.removeChild(t); ok();
    }
  };
  AD.reduced = window.matchMedia && matchMedia('(prefers-reduced-motion: reduce)').matches;
  // Görseller yüklenince başlat (Enabler varsa görünür olduğunda).
  AD.ready = function (fn) {
    function go() {
      var imgs = [].slice.call(document.images), n = imgs.length, started = false;
      function start() { if (!started) { started = true; document.documentElement.classList.add('ready'); fn(); } }
      if (!n) return start();
      imgs.forEach(function (im) { if (im.complete) { if (!--n) start(); } else im.onload = im.onerror = function () { if (!--n) start(); }; });
      setTimeout(start, 2500);
    }
    if (window.Enabler && Enabler.isInitialized) {
      if (Enabler.isInitialized()) go(); else Enabler.addEventListener('init', go);
    } else if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', go); else go();
  };
  AD.h = function (tag, cls, html) { var e = document.createElement(tag); if (cls) e.className = cls; if (html != null) e.innerHTML = html; return e; };
})();

(function () {
  var P = AD.creative.memory, D = AD.data, ad = document.getElementById('ad'), grid = document.getElementById('grid');
  // 3 an + 3 ürün kartı; sabit ama karışık bir dizilim (her gösterimde rastgele)
  var deck = [];
  P.forEach(function (p, i) { deck.push({ pair: i, kind: 'an' }, { pair: i, kind: 'urun' }); });
  for (var i = deck.length - 1; i > 0; i--) { var j = Math.floor(Math.random() * (i + 1)); var t = deck[i]; deck[i] = deck[j]; deck[j] = t; }
  // Aynı eşin kartları yan yana gelmesin
  for (i = 1; i < deck.length; i++) if (deck[i].pair === deck[i - 1].pair) { var k = (i + 2) % deck.length; t = deck[i]; deck[i] = deck[k]; deck[k] = t; }
  var cards = deck.map(function (c, n) {
    var p = P[c.pair], el = AD.h('div', 'cd');
    el.innerHTML = '<div class="b"><img src="img/m-sirt.webp" alt=""><img class="lg" src="img/logo-beyaz.webp" alt=""></div>' +
      '<div class="f">' + (c.kind === 'an' ? '<img class="ph" src="' + p.img + '" alt="">' : '<img class="pk" src="' + p.pack + '" alt="' + p.name + '"><div class="nm">' + p.name + '</div>') +
      '<div class="ok">✓ ' + p.name + '</div></div>';
    el.addEventListener('click', function (e) { e.stopPropagation(); tap(n, false); });
    grid.appendChild(el);
    return el;
  });
  var open = [], done = {}, nDone = 0, moves = 0, lock = true, user = false;
  var mv = document.getElementById('mv'), msg = document.getElementById('msg'), bars = [].slice.call(document.querySelectorAll('#pr i')), pill = document.getElementById('pill');
  function say(t, ms) { pill.textContent = t; pill.classList.add('show'); clearTimeout(say.t); say.t = setTimeout(function () { pill.classList.remove('show'); }, ms || 1100); }
  function tap(n, auto) {
    var c = deck[n];
    if (done[c.pair]) return AD.exit('eslestir_' + P[c.pair].key, P[c.pair].url);
    if (lock || open.indexOf(n) > -1 || open.length > 1) return;
    if (!auto && !user) { user = true; clearTimeout(idleT); AD.track('memory_start'); }
    cards[n].classList.add('up'); open.push(n);
    if (open.length < 2) return;
    moves++; mv.textContent = moves + ' hamle';
    var a = deck[open[0]], b = deck[open[1]];
    if (a.pair === b.pair) {
      done[a.pair] = true; nDone++;
      open.forEach(function (m) { cards[m].classList.add('done'); });
      bars[nDone - 1].classList.add('on');
      msg.innerHTML = '<b>' + P[a.pair].name + '</b> eşleşti! ' + nDone + '/3';
      if (!auto) AD.track('memory_pair_' + P[a.pair].key);
      open = [];
      if (nDone === P.length) setTimeout(function () { finish(auto ? 'auto' : 'play'); }, 1100);
      else say(['Harika!', 'Süper!'][nDone - 1] || 'Harika!');
    } else {
      lock = true;
      var pairOpen = open.slice(); open = [];
      setTimeout(function () { pairOpen.forEach(function (m) { cards[m].classList.add('miss'); }); }, 350);
      setTimeout(function () { pairOpen.forEach(function (m) { cards[m].classList.remove('up', 'miss'); }); lock = false; }, 950);
      msg.textContent = 'Olmadı, tekrar dene.';
    }
  }
  var end = document.getElementById('end');
  document.getElementById('endRow').innerHTML = P.map(function (p, i) { return '<div class="pk" data-i="' + i + '"><img src="' + p.pack + '" alt="' + p.name + '"></div>'; }).join('');
  function finish(why) {
    document.getElementById('endOv').textContent = why === 'play' ? 'Rutini ' + moves + ' hamlede tamamladın' : 'Kasım sürprizin hazır';
    end.classList.add('on');
    AD.track('memory_finish_' + why);
  }
  document.getElementById('endRow').addEventListener('click', function (e) { e.stopPropagation(); var pk = e.target.closest('.pk'); if (pk) { var p = P[+pk.dataset.i]; AD.exit('eslestir_' + p.key, p.url); } });
  document.getElementById('cp').addEventListener('click', function (e) { e.stopPropagation(); AD.copy(this, D.coupon.code); });
  end.addEventListener('click', function () { AD.exit('kupon', D.coupon.url); });
  ad.addEventListener('click', function () { if (!end.classList.contains('on')) AD.exit('brand', D.brand.home); });

  // Akış: kartlar 2 sn açık (ezberle), kapanır; 9 sn etkileşim yoksa bir eşi kendisi gösterir; 22 sn'de final ekranı açılır.
  var idleT = null;
  function demoPair() {
    if (user) return;
    var p = deck.findIndex(function (c) { return !done[c.pair]; }), q = deck.findIndex(function (c, m) { return m !== p && c.pair === deck[p].pair; });
    tap(p, true); setTimeout(function () { if (!user) tap(q, true); }, 700);
  }
  AD.ready(function () {
    AD.track('impression_ready');
    setTimeout(function () { cards.forEach(function (c, m) { setTimeout(function () { c.classList.add('up'); }, m * 80); }); say('Ezberle!', 1800); }, 500);
    setTimeout(function () { cards.forEach(function (c) { c.classList.remove('up'); }); lock = false; msg.textContent = 'Şimdi her anı ürünüyle eşleştir.'; }, 3000);
    if (AD.reduced) return;
    idleT = setTimeout(function () {
      demoPair();
      idleT = setTimeout(function () { if (!user) finish('auto'); }, 12000);
    }, 9000);
  });
})();
</script>
</body>
</html>
