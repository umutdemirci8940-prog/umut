<title>İlaçsız Yaşam – Gölgen Ne Diyor? 970x250</title>
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,600;0,9..144,700;1,9..144,600&family=Manrope:wght@500;700;800&display=swap" rel="stylesheet">
<style>
:root {
  --navy: #132d7d;
  --navy-d: #0b1c52;
  --green: #5fa511;
  --green-l: #8fd14a;
  --ink: #0f1a3a;
  --white: #fff;
  --serif: 'Fraunces', Georgia, 'Times New Roman', serif;
  --sans: 'Manrope', 'Helvetica Neue', Arial, sans-serif;
  --ease: cubic-bezier(.22, .8, .2, 1);
}
* { box-sizing: border-box; margin: 0; padding: 0; }
html, body { width: 100%; height: 100%; overflow: hidden; background: var(--navy-d); }
body { font-family: var(--sans); color: var(--white); -webkit-font-smoothing: antialiased; -webkit-tap-highlight-color: transparent; user-select: none; -webkit-user-select: none; }
img { display: block; -webkit-user-drag: none; }
button { font: inherit; color: inherit; border: 0; background: none; cursor: pointer; }
.ad { position: relative; overflow: hidden; background: var(--navy-d); cursor: pointer; }
.legal { font-size: 8px; line-height: 1.25; color: rgba(255, 255, 255, .72); letter-spacing: .01em; }

/* Kupon çipi */
.coupon { display: inline-flex; align-items: center; gap: 8px; border-radius: 10px; background: rgba(255, 255, 255, .14); border: 1px dashed rgba(255, 255, 255, .55); padding: 6px 10px; transition: background .25s, transform .25s var(--ease); }
.coupon:hover { background: rgba(255, 255, 255, .22); }
.coupon:active { transform: scale(.97); }
.coupon b { font-weight: 800; letter-spacing: .08em; }
.coupon .cp-act { font-size: 9px; font-weight: 700; text-transform: uppercase; letter-spacing: .08em; color: var(--green-l); }
.coupon .cp-ok { display: none; }
.coupon.copied { background: var(--green); border-color: var(--green); }
.coupon.copied .cp-act { display: none; }
.coupon.copied .cp-ok { display: inline; font-size: 9px; font-weight: 800; text-transform: uppercase; letter-spacing: .08em; }

/* Yeşil CTA */
.cta { display: inline-flex; align-items: center; gap: 8px; height: 34px; padding: 0 16px; border-radius: 999px; background: var(--green); color: #fff; font-weight: 800; font-size: 12.5px; letter-spacing: .01em; white-space: nowrap; box-shadow: 0 6px 18px rgba(95, 165, 17, .38); transition: transform .25s var(--ease), background .25s; }
.cta:hover { background: #6cbb14; transform: translateY(-1px); }
.cta i { font-style: normal; transition: transform .25s var(--ease); }
.cta:hover i { transform: translateX(3px); }

/* Ürün kutucuğu (orijinal ambalaj fotoğrafı, beyaz kart) */
.pk { position: relative; flex: none; background: #fff; border-radius: 10px; display: flex; align-items: center; justify-content: center; box-shadow: 0 6px 16px rgba(5, 15, 50, .28); transition: transform .3s var(--ease), box-shadow .3s; }
.pk img { max-width: 86%; max-height: 82%; object-fit: contain; }
.pk:hover { transform: translateY(-4px) scale(1.04); box-shadow: 0 10px 22px rgba(5, 15, 50, .4); z-index: 2; }
.pk .tip { position: absolute; left: 50%; bottom: calc(100% + 6px); transform: translate(-50%, 4px); background: #fff; color: var(--navy); font-size: 10px; font-weight: 800; padding: 4px 8px; border-radius: 6px; white-space: nowrap; opacity: 0; pointer-events: none; transition: opacity .2s, transform .2s; box-shadow: 0 4px 12px rgba(0, 0, 0, .25); }
.pk:hover .tip { opacity: 1; transform: translate(-50%, 0); }

@media (prefers-reduced-motion: reduce) { *, *::before, *::after { transition-duration: .01s !important; animation-duration: .01s !important; } }

.ad { width: 970px; height: 250px; }
/* Sol: ışığı canlı hesaplanan fotoğraf */
.win { position: absolute; left: 0; top: 0; width: 400px; height: 250px; overflow: hidden; }
.win > img.ph { width: 100%; height: 100%; object-fit: cover; transition: filter .25s linear; }
.win::after { content: ''; position: absolute; inset: 0; background: linear-gradient(180deg, rgba(11, 28, 82, .55) 0%, rgba(11, 28, 82, 0) 30%, rgba(11, 28, 82, 0) 62%, rgba(11, 28, 82, .7) 100%); pointer-events: none; }
.win .logo { position: absolute; z-index: 1; left: 14px; top: 12px; width: 104px; }
.win .sun { position: absolute; z-index: 1; left: 14px; bottom: 12px; font-size: 10px; font-weight: 700; line-height: 1.35; color: rgba(255, 255, 255, .92); text-shadow: 0 1px 6px rgba(0, 0, 0, .4); }
.win .sun b { font-size: 12px; font-weight: 800; color: #fff; }
.win .live { position: absolute; z-index: 1; right: 12px; top: 13px; font-size: 9px; font-weight: 800; letter-spacing: .1em; padding: 4px 8px 4px 18px; border-radius: 999px; background: rgba(11, 28, 82, .55); -webkit-backdrop-filter: blur(6px); backdrop-filter: blur(6px); }
.win .live::before { content: ''; position: absolute; left: 8px; top: 50%; width: 6px; height: 6px; margin-top: -3px; border-radius: 50%; background: #ff5a4f; animation: blink 1.4s infinite; }
@keyframes blink { 50% { opacity: .25; } }
/* Sağ panel */
.pane { position: absolute; left: 400px; top: 0; width: 570px; height: 250px; background: var(--navy-d); }
.st { position: absolute; inset: 0; padding: 16px 20px 0 22px; opacity: 0; pointer-events: none; transform: translateX(16px); transition: opacity .45s var(--ease), transform .45s var(--ease); }
.st.on { opacity: 1; pointer-events: auto; transform: none; }
.ov { font-size: 9.5px; font-weight: 800; letter-spacing: .12em; text-transform: uppercase; color: var(--green-l); display: flex; align-items: center; gap: 6px; }
.city { font: inherit; letter-spacing: inherit; text-transform: none; font-size: 11px; font-weight: 800; color: #fff; background: rgba(255, 255, 255, .14); border: 1px solid rgba(255, 255, 255, .3); border-radius: 999px; padding: 2px 9px; }
.city:hover { background: rgba(255, 255, 255, .24); }
/* 1. durum: gölge */
.g-left { position: absolute; left: 22px; top: 36px; width: 330px; }
.g-left h1 { font-family: var(--serif); font-weight: 600; font-size: 26px; line-height: 1.04; letter-spacing: -.01em; }
.g-left h1 em { color: var(--green-l); }
.g-left p { font-size: 10.5px; line-height: 1.4; font-weight: 600; color: rgba(255, 255, 255, .82); margin-top: 7px; }
.g-left p b { color: #fff; }
.slider { position: absolute; left: 22px; top: 170px; width: 330px; height: 40px; touch-action: none; cursor: pointer; }
.track { position: absolute; left: 0; right: 0; top: 12px; height: 6px; border-radius: 6px; background: linear-gradient(90deg, #f6c544, #e9a23b 40%, #5a6fa8 75%, #33467e); }
.knob { position: absolute; top: 15px; width: 26px; height: 26px; margin: -13px 0 0 -13px; border-radius: 50%; background: #ffd25a; box-shadow: 0 0 0 4px rgba(255, 210, 90, .3), 0 0 18px rgba(255, 200, 70, .7); transition: background .2s; }
.slider:hover .knob { box-shadow: 0 0 0 6px rgba(255, 210, 90, .35), 0 0 22px rgba(255, 200, 70, .8); }
.today { position: absolute; top: 4px; width: 2px; height: 22px; margin-left: -1px; background: #fff; border-radius: 2px; }
.today span { position: absolute; top: -13px; left: 50%; transform: translateX(-50%); font-size: 8.5px; font-weight: 800; white-space: nowrap; }
.months { position: absolute; left: 0; right: 0; top: 26px; display: flex; justify-content: space-between; font-size: 8.5px; font-weight: 700; color: rgba(255, 255, 255, .55); }
.g-right { position: absolute; right: 20px; top: 34px; width: 172px; text-align: center; }
.big { font-family: var(--serif); font-weight: 700; font-size: 66px; line-height: .95; color: #fff; letter-spacing: -.02em; transition: color .3s; }
.big small { font-size: 34px; color: var(--green-l); }
.big-cap { font-size: 9.5px; font-weight: 800; letter-spacing: .1em; text-transform: uppercase; color: rgba(255, 255, 255, .7); margin-top: 2px; }
.g-right .cta { margin-top: 18px; height: 40px; font-size: 12.5px; padding: 0 14px; }
.g-right .cta.pulse { animation: pulse 1.4s var(--ease) 3; }
@keyframes pulse { 50% { transform: scale(1.06); box-shadow: 0 0 0 8px rgba(95, 165, 17, .25); } }
.g-right .sm { font-size: 9px; font-weight: 700; color: rgba(255, 255, 255, .6); margin-top: 6px; }
/* Şehir seçici */
.cities { position: absolute; z-index: 5; left: 120px; top: 36px; display: grid; grid-template-columns: repeat(4, auto); gap: 6px; padding: 10px; border-radius: 14px; background: #fff; box-shadow: 0 12px 30px rgba(0, 0, 0, .35); opacity: 0; transform: translateY(-6px); pointer-events: none; transition: opacity .25s, transform .25s var(--ease); }
.cities.on { opacity: 1; transform: none; pointer-events: auto; }
.cities button { font-size: 11.5px; font-weight: 800; color: var(--navy); padding: 6px 10px; border-radius: 999px; background: #eef1f8; }
.cities button.sel, .cities button:hover { background: var(--navy); color: #fff; }
/* 2. durum: sorular */
.qh { display: flex; align-items: baseline; gap: 10px; margin-top: 2px; }
.qh h2 { font-family: var(--serif); font-weight: 600; font-size: 22px; line-height: 1.1; }
.qh span { font-size: 10px; font-weight: 800; color: var(--green-l); letter-spacing: .08em; }
.ans { display: flex; gap: 12px; margin-top: 12px; }
.ans button { position: relative; width: 258px; height: 150px; border-radius: 14px; overflow: hidden; box-shadow: 0 8px 20px rgba(0, 0, 0, .35); transition: transform .3s var(--ease), box-shadow .3s; }
.ans button:hover { transform: translateY(-3px); box-shadow: 0 0 0 3px var(--green-l), 0 12px 26px rgba(0, 0, 0, .4); }
.ans button img { width: 100%; height: 100%; object-fit: cover; transition: transform 2.5s var(--ease); }
.ans button:hover img { transform: scale(1.06); }
.ans button span { position: absolute; left: 10px; bottom: 10px; font-size: 13px; font-weight: 800; padding: 6px 12px; border-radius: 999px; background: #fff; color: var(--navy); box-shadow: 0 4px 12px rgba(0, 0, 0, .25); }
.ans button.pick { box-shadow: 0 0 0 4px var(--green-l); }
/* 3. durum: sonuç */
.rh { font-family: var(--serif); font-weight: 600; font-size: 19px; line-height: 1.12; margin-top: 4px; max-width: 520px; }
.rh em { color: var(--green-l); }
.rp { display: flex; gap: 10px; margin-top: 10px; }
.rp .it { width: 168px; display: flex; gap: 8px; align-items: center; padding: 6px; border-radius: 12px; background: rgba(255, 255, 255, .08); border: 1px solid rgba(255, 255, 255, .14); cursor: pointer; transition: background .25s; opacity: 0; transform: translateY(10px); }
.st.on .rp .it { opacity: 1; transform: none; transition: opacity .45s var(--ease), transform .45s var(--ease), background .25s; }
.st.on .rp .it:nth-child(2) { transition-delay: .12s; } .st.on .rp .it:nth-child(3) { transition-delay: .24s; }
.rp .it:hover { background: rgba(255, 255, 255, .16); }
.rp .pk { width: 52px; height: 56px; }
.rp b { display: block; font-size: 10.5px; font-weight: 800; line-height: 1.15; }
.rp small { display: block; font-size: 8.8px; font-weight: 600; line-height: 1.25; color: rgba(255, 255, 255, .72); margin-top: 2px; }
.rf { display: flex; align-items: center; gap: 10px; margin-top: 12px; }
.rf .coupon { font-size: 10.5px; padding: 6px 10px; }
.rf .coupon .pct { font-family: var(--serif); font-size: 18px; font-weight: 700; color: var(--green-l); }
.rf .cta { margin-left: auto; height: 36px; }
.again { font-size: 9.5px; font-weight: 800; color: rgba(255, 255, 255, .6); text-decoration: underline; }
.note { position: absolute; left: 22px; right: 20px; bottom: 20px; font-size: 8px; color: rgba(255, 255, 255, .6); }
.pane .legal { position: absolute; left: 22px; right: 20px; bottom: 7px; font-size: 7.4px; }
</style>
</head>

  function num(x) { return x.toFixed(1).replace('.', ','); }
  var AY = ['Ocak', 'Şubat', 'Mart', 'Nisan', 'Mayıs', 'Haziran', 'Temmuz', 'Ağustos', 'Eylül', 'Ekim', 'Kasım', 'Aralık'];
  function dateTR(d) { return d.getDate() + ' ' + AY[d.getMonth()]; }
  // Bulunma eki (ünlü uyumu): 18 Ekim'de, 30 Haziran'da, 1 Ağustos'ta
  var DA = ["'ta", "'ta", "'ta", "'da", "'ta", "'da", "'da", "'ta", "'de", "'de", "'da", "'ta"];
  function dateTRda(d) { return dateTR(d) + DA[d.getMonth()]; }
  // Haziran gündönümünden Aralık gündönümüne: t=0..1
  function yearSpan(now) {
    var y = now.getFullYear(), a = new Date(y, 5, 21), b = new Date(y, 11, 21);
    if (now < a) { a = new Date(y - 1, 5, 21); b = new Date(y - 1, 11, 21); }
    return { a: a, b: b, at: function (t) { return new Date(a.getTime() + (b - a) * t); }, tOf: function (d) { return Math.max(0, Math.min(1, (d - a) / (b - a))); } };
  }
  // Fotoğrafın ışığı: öğle güneşinin yüksekliğine göre (≈27° kış → ≈73° yaz)
  function light(alt) {
    var k = Math.max(0, Math.min(1, (alt - 25) / 48));
    return 'brightness(' + (0.5 + 0.58 * k).toFixed(3) + ') saturate(' + (0.45 + 0.7 * k).toFixed(3) + ') contrast(' + (0.92 + 0.12 * k).toFixed(3) + ') hue-rotate(' + ((1 - k) * 12).toFixed(1) + 'deg)';
  }
  // Cevaplar → en fazla 3 ürün (her zaman gün ışığı ürünüyle başlar)
  function recommend(answers, P) {
    var out = [answers.aile === 'cocuk' ? 'd3' : 'd3k2'];
    if (answers.aile === 'cocuk') out.push('omega3surup');
    out.push(answers.his === 'enerji' ? 'b12' : 'magnezyum');
    if (out.length < 3) out.push(answers.gun === 'masa' ? 'omega3' : 'krill');
    return out.slice(0, 3).map(function (k) { return P[k]; });
  }
  return { calc: calc, hm: hm, dur: dur, num: num, dateTR: dateTR, dateTRda: dateTRda, yearSpan: yearSpan, light: light, recommend: recommend };
})();

(function () {
  var G = AD.creative.gunes, D = AD.data, ad = document.getElementById('ad');
  var $ = function (id) { return document.getElementById(id); };
  // Şehir: yayın makrosu (?city=ankara) varsa o, yoksa İstanbul; kullanıcı değiştirebilir
  var q = (location.search.match(/[?&]city=([^&]+)/) || [])[1];
  var city = G.cities.filter(function (c) { return c.key === (q || '').toLowerCase(); })[0] || G.cities[0];
  var now = new Date(), span = GUNES.yearSpan(now), tToday = span.tOf(now), t = tToday;
  $('today').style.left = (tToday * 100) + '%';
  function update() {
    var d = span.at(t), c = GUNES.calc(city, d), cJ = GUNES.calc(city, span.a), cN = GUNES.calc(city, now);
    var isToday = Math.abs(t - tToday) < 0.012;
    $('ph').style.filter = GUNES.light(c.noonAlt);
    $('knob').style.left = (t * 100) + '%';
    $('cityBtn').textContent = city.name + ' ▾';
    $('dateTxt').textContent = '· ' + (isToday ? 'bugün, ' : '') + GUNES.dateTR(d);
    $('hl').innerHTML = (isToday ? 'Bugün' : GUNES.dateTRda(d)) + ' öğlen gölgen<br>boyunun <em>' + GUNES.num(c.shadow) + ' katı.</em>';
    $('big').innerHTML = GUNES.num(c.shadow) + '<small>×</small>';
    $('big').style.color = c.shadow > 1 ? '#fff' : '#ffd25a';
    var lost = cJ.dayMin - cN.dayMin;
    $('sub').innerHTML = G.fact + (lost > 5 ? ' Haziran\'dan bu yana ' + city.name + ' <b>' + GUNES.dur(lost) + '</b> gün ışığı kaybetti.' : '');
    $('sun').innerHTML = '<b>' + city.name + '</b> · ' + GUNES.dateTR(d) + '<br>Gün doğumu ' + GUNES.hm(c.rise) + ' · batımı ' + GUNES.hm(c.set) + ' · ' + GUNES.dur(c.dayMin) + ' gün ışığı';
  }
  // Kaydırıcı (güneşi sürükle)
  var sl = $('slider'), dragging = false, userTouched = false;
  function setFromX(x) { var b = sl.getBoundingClientRect(); t = Math.max(0, Math.min(1, (x - b.left) / b.width)); update(); }
  sl.addEventListener('pointerdown', function (e) { e.stopPropagation(); dragging = true; touch('slider'); setFromX(e.clientX); try { sl.setPointerCapture(e.pointerId); } catch (er) {} });
  sl.addEventListener('pointermove', function (e) { if (dragging) setFromX(e.clientX); });
  sl.addEventListener('pointerup', function () { dragging = false; });
  sl.addEventListener('click', function (e) { e.stopPropagation(); });
  sl.addEventListener('keydown', function (e) { if (e.key === 'ArrowLeft' || e.key === 'ArrowRight') { e.stopPropagation(); touch('slider'); t = Math.max(0, Math.min(1, t + (e.key === 'ArrowRight' ? .05 : -.05))); update(); } });
  function touch(what) { if (!userTouched) { userTouched = true; stopDemo(); } AD.track('golge_' + what); }
  // Şehir seçici
  var cities = $('cities');
  cities.innerHTML = G.cities.map(function (c) { return '<button data-k="' + c.key + '">' + c.name + '</button>'; }).join('');
  $('cityBtn').addEventListener('click', function (e) { e.stopPropagation(); touch('city_open'); cities.classList.toggle('on'); mark(); });
  function mark() { [].forEach.call(cities.children, function (b) { b.classList.toggle('sel', b.dataset.k === city.key); }); }
  cities.addEventListener('click', function (e) {
    e.stopPropagation(); var b = e.target.closest('button'); if (!b) return;
    city = G.cities.filter(function (c) { return c.key === b.dataset.k; })[0]; AD.track('golge_city_' + city.key);
    cities.classList.remove('on'); t = tToday; update();
  });
  // Sorular
  var answers = {}, qi = 0;
  function show(n) { ['s1', 's2', 's3'].forEach(function (id, i) { $(id).classList.toggle('on', i === n - 1); }); }
  function ask(i) {
    var Q = G.questions[i]; qi = i;
    $('qov').textContent = 'Kasım rutinin · ' + (i + 1) + '/' + G.questions.length + ' · ' + city.name + ' · gölge ' + GUNES.num(GUNES.calc(city, now).shadow) + '×';
    $('qt').textContent = Q.q;
    $('ans').innerHTML = Q.a.map(function (a, j) { return '<button data-j="' + j + '"><img src="' + a.img + '" alt=""><span>' + a.t + '</span></button>'; }).join('');
  }
  $('ans').addEventListener('click', function (e) {
    e.stopPropagation(); var b = e.target.closest('button'); if (!b) return;
    var Q = G.questions[qi], a = Q.a[+b.dataset.j];
    answers[Q.key] = a.v; b.classList.add('pick'); AD.track('quiz_' + Q.key + '_' + a.v);
    setTimeout(function () { if (qi + 1 < G.questions.length) ask(qi + 1); else result(); }, 380);
  });
  $('start').addEventListener('click', function (e) { e.stopPropagation(); touch('start'); answers = {}; ask(0); show(2); });
  var picks = [], code = '';
  function result() {
    picks = GUNES.recommend(answers, G.products);
    code = G.questions.map(function (Q) { return answers[Q.key]; }).join('_');
    var tag = { masa: 'masa başında', hareket: 'hareket halinde', cocuk: 'minikleriyle', ben: 'kendi için', enerji: 'enerji arayan', huzur: 'akşam dinginliği arayan' };
    $('rov').textContent = 'Senin Kasım rutinin · ' + city.name;
    $('rh').innerHTML = 'Günün ' + tag[answers.gun] + ', rutini ' + tag[answers.aile] + ' kuran, <em>' + tag[answers.his] + '</em> biri için:';
    $('rp').innerHTML = picks.map(function (p, i) { return '<div class="it" data-i="' + i + '"><div class="pk"><img src="' + p.img + '" alt=""></div><div><b>' + p.name + '</b><small>' + p.why + '</small></div></div>'; }).join('');
    $('note').textContent = G.note;
    show(3); AD.track('quiz_result_' + code);
  }
  $('rp').addEventListener('click', function (e) { e.stopPropagation(); var it = e.target.closest('.it'); if (it) { var p = picks[+it.dataset.i]; AD.exit('golge_' + p.key, p.url); } });
  $('go').addEventListener('click', function (e) { e.stopPropagation(); AD.exit('golge_sonuc', G.resultUrl + '_' + code); });
  $('again').addEventListener('click', function (e) { e.stopPropagation(); t = tToday; update(); show(1); });
  $('cp').addEventListener('click', function (e) { e.stopPropagation(); AD.copy(this, D.coupon.code); });
  ad.addEventListener('click', function () { cities.classList.remove('on'); if ($('s1').classList.contains('on')) AD.exit('golge_genel', D.brand.home); });
  // Tanıtım: güneş Haziran'dan bugüne kayar (ışık söner, gölge uzar), iki kez; sonra CTA nabız atar (< 30 sn)
  var raf = null, demoT = [];
  function sweep(ms, done) {
    var t0 = null;
    (function step(ts) { if (userTouched) return; if (t0 === null) t0 = ts; var k = Math.max(0, Math.min(1, (ts - t0) / ms)); var e = k < .5 ? 2 * k * k : 1 - Math.pow(-2 * k + 2, 2) / 2; t = tToday * e; update(); if (k < 1) raf = requestAnimationFrame(step); else if (done) done(); })(performance.now());
  }
  function stopDemo() { cancelAnimationFrame(raf); demoT.forEach(clearTimeout); }
  update();
  AD.ready(function () {
    AD.track('impression_ready');
    if (AD.reduced) return;
    t = 0; update();
    demoT.push(setTimeout(function () { sweep(3600, function () { $('start').classList.add('pulse'); }); }, 900));
    demoT.push(setTimeout(function () { if (!userTouched) { t = 0; update(); demoT.push(setTimeout(function () { sweep(3600, function () { $('start').classList.remove('pulse'); void $('start').offsetWidth; $('start').classList.add('pulse'); }); }, 600)); } }, 12000));
  });
})();
</script>
</body>
