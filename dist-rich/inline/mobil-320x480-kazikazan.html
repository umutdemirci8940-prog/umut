<title>İlaçsız Yaşam – Kasım Kazı Kazan 320x480</title>

<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,600;0,9..144,700;1,9..144,700&family=Manrope:wght@500;700;800&display=swap" rel="stylesheet">
<style>
:root {
  --navy: #132d7d;
  --navy-d: #0b1c52;
  --green: #5fa511;
  --green-l: #8fd14a;
  --ink: #0f1a3a;
  --white: #fff;
  --serif: 'Fraunces', Georgia, 'Times New Roman', serif;
  --sans: 'Manrope', 'Helvetica Neue', Arial, sans-serif;
  --ease: cubic-bezier(.22, .8, .2, 1);
}
* { box-sizing: border-box; margin: 0; padding: 0; }
html, body { width: 100%; height: 100%; overflow: hidden; background: var(--navy-d); }
body { font-family: var(--sans); color: var(--white); -webkit-font-smoothing: antialiased; -webkit-tap-highlight-color: transparent; user-select: none; -webkit-user-select: none; }
img { display: block; -webkit-user-drag: none; }
button { font: inherit; color: inherit; border: 0; background: none; cursor: pointer; }
.ad { position: relative; overflow: hidden; background: var(--navy-d); cursor: pointer; }
.legal { font-size: 8px; line-height: 1.25; color: rgba(255, 255, 255, .72); letter-spacing: .01em; }

/* Kupon çipi */
.coupon { display: inline-flex; align-items: center; gap: 8px; border-radius: 10px; background: rgba(255, 255, 255, .14); border: 1px dashed rgba(255, 255, 255, .55); padding: 6px 10px; transition: background .25s, transform .25s var(--ease); }
.coupon:hover { background: rgba(255, 255, 255, .22); }
.coupon:active { transform: scale(.97); }
.coupon b { font-weight: 800; letter-spacing: .08em; }
.coupon .cp-act { font-size: 9px; font-weight: 700; text-transform: uppercase; letter-spacing: .08em; color: var(--green-l); }
.coupon .cp-ok { display: none; }
.coupon.copied { background: var(--green); border-color: var(--green); }
.coupon.copied .cp-act { display: none; }
.coupon.copied .cp-ok { display: inline; font-size: 9px; font-weight: 800; text-transform: uppercase; letter-spacing: .08em; }

/* Yeşil CTA */
.cta { display: inline-flex; align-items: center; gap: 8px; height: 34px; padding: 0 16px; border-radius: 999px; background: var(--green); color: #fff; font-weight: 800; font-size: 12.5px; letter-spacing: .01em; white-space: nowrap; box-shadow: 0 6px 18px rgba(95, 165, 17, .38); transition: transform .25s var(--ease), background .25s; }
.cta:hover { background: #6cbb14; transform: translateY(-1px); }
.cta i { font-style: normal; transition: transform .25s var(--ease); }
.cta:hover i { transform: translateX(3px); }

/* Ürün kutucuğu (orijinal ambalaj fotoğrafı, beyaz kart) */
.pk { position: relative; flex: none; background: #fff; border-radius: 10px; display: flex; align-items: center; justify-content: center; box-shadow: 0 6px 16px rgba(5, 15, 50, .28); transition: transform .3s var(--ease), box-shadow .3s; }
.pk img { max-width: 86%; max-height: 82%; object-fit: contain; }
.pk:hover { transform: translateY(-4px) scale(1.04); box-shadow: 0 10px 22px rgba(5, 15, 50, .4); z-index: 2; }
.pk .tip { position: absolute; left: 50%; bottom: calc(100% + 6px); transform: translate(-50%, 4px); background: #fff; color: var(--navy); font-size: 10px; font-weight: 800; padding: 4px 8px; border-radius: 6px; white-space: nowrap; opacity: 0; pointer-events: none; transition: opacity .2s, transform .2s; box-shadow: 0 4px 12px rgba(0, 0, 0, .25); }
.pk:hover .tip { opacity: 1; transform: translate(-50%, 0); }

@media (prefers-reduced-motion: reduce) { *, *::before, *::after { transition-duration: .01s !important; animation-duration: .01s !important; } }

.ad { width: 320px; height: 480px; background: var(--navy-d); touch-action: none; }
/* Bilet */
.ticket { position: absolute; left: 10px; top: 10px; width: 300px; height: 430px; border-radius: 16px; background: #fbf7ec; overflow: hidden; box-shadow: 0 14px 34px rgba(0, 0, 0, .45); color: var(--ink); }
.ticket::before, .ticket::after { content: ''; position: absolute; top: 96px; width: 18px; height: 18px; border-radius: 50%; background: var(--navy-d); margin-top: -9px; }
.ticket::before { left: -9px; } .ticket::after { right: -9px; }
.hd { position: relative; height: 96px; overflow: hidden; }
.hd > img { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; filter: saturate(1.1); }
.hd::after { content: ''; position: absolute; inset: 0; background: linear-gradient(90deg, rgba(11, 28, 82, .92) 0%, rgba(11, 28, 82, .7) 55%, rgba(11, 28, 82, .15) 100%); }
.hd .in { position: absolute; z-index: 1; left: 14px; top: 10px; color: #fff; }
.hd .logo { width: 88px; }
.hd h1 { font-family: var(--serif); font-style: italic; font-weight: 700; font-size: 25px; line-height: 1; margin-top: 6px; }
.hd h1 em { font-style: normal; color: #ffd25a; }
.perf { border-top: 2px dashed rgba(19, 45, 125, .25); margin: 0 14px; }
.rule { text-align: center; font-size: 11.5px; font-weight: 800; color: var(--navy); margin-top: 9px; }
/* 6 pencere */
.grid { position: absolute; left: 30px; top: 142px; width: 260px; height: 200px; display: grid; grid-template-columns: repeat(3, 80px); grid-template-rows: repeat(2, 95px); gap: 10px; }
.cell { position: relative; min-height: 0; overflow: hidden; border-radius: 12px; background: #fff; box-shadow: inset 0 0 0 1px rgba(19, 45, 125, .12); display: flex; align-items: center; justify-content: center; transition: box-shadow .3s, transform .3s var(--ease); }
.cell img { max-width: 78%; max-height: 74%; object-fit: contain; }
.cell.hit { box-shadow: 0 0 0 3px var(--green), 0 6px 16px rgba(95, 165, 17, .4); transform: scale(1.04); }
canvas { position: absolute; left: 30px; top: 142px; width: 260px; height: 200px; z-index: 2; touch-action: none; transition: opacity .6s; }
.done canvas { opacity: 0; pointer-events: none; }
.stat { position: absolute; left: 24px; right: 24px; top: 356px; display: flex; align-items: center; justify-content: space-between; }
.stat .c { font-size: 11px; font-weight: 800; color: var(--navy); }
.stat .c b { color: var(--green); }
.open { font-size: 11px; font-weight: 800; color: #fff; background: var(--navy); padding: 7px 12px; border-radius: 999px; opacity: 0; transform: translateY(6px); transition: opacity .3s, transform .3s var(--ease); pointer-events: none; }
.open.show { opacity: 1; transform: none; pointer-events: auto; }
.fine { position: absolute; left: 24px; right: 24px; top: 394px; font-size: 8.5px; line-height: 1.35; color: #6b7391; text-align: center; }
.coin { position: absolute; z-index: 4; pointer-events: none; font-size: 11.5px; font-weight: 800; color: #fff; background: var(--navy); padding: 7px 12px; border-radius: 999px; box-shadow: 0 6px 16px rgba(0, 0, 0, .3); left: 50%; top: 224px; transform: translateX(-50%); white-space: nowrap; transition: opacity .3s; animation: bob 1.5s var(--ease) infinite; }
@keyframes bob { 50% { transform: translate(-50%, -4px); } }
.user .coin { opacity: 0; }
/* Kazanma ekranı */
.win { position: absolute; inset: 0; z-index: 8; background: radial-gradient(circle at 50% 30%, #2a4aa8 0%, var(--navy-d) 70%); color: #fff; text-align: center; padding: 22px 18px 0; opacity: 0; pointer-events: none; transition: opacity .45s; }
.win.on { opacity: 1; pointer-events: auto; }
.win .logo { width: 96px; }
.win .k { font-family: var(--serif); font-style: italic; font-weight: 700; font-size: 38px; color: #ffd25a; margin-top: 10px; transform: scale(.5); transition: transform .55s cubic-bezier(.3, 1.7, .5, 1); }
.win.on .k { transform: none; }
.win .s { font-size: 12px; font-weight: 700; color: rgba(255, 255, 255, .85); margin-top: 2px; }
.trio { display: flex; justify-content: center; gap: 8px; margin-top: 14px; }
.trio div { width: 74px; height: 80px; border-radius: 12px; background: #fff; display: flex; align-items: center; justify-content: center; box-shadow: 0 0 0 3px var(--green-l), 0 8px 18px rgba(0, 0, 0, .35); transform: translateY(20px) rotate(var(--r)); opacity: 0; transition: transform .5s var(--ease), opacity .5s; }
.win.on .trio div { transform: rotate(var(--r)); opacity: 1; }
.win.on .trio div:nth-child(2) { transition-delay: .1s; } .win.on .trio div:nth-child(3) { transition-delay: .2s; }
.trio img { max-width: 80%; max-height: 80%; }
.prize { font-family: var(--serif); font-weight: 700; font-size: 72px; line-height: .9; color: var(--green-l); margin-top: 14px; }
.prize small { font-family: var(--sans); font-size: 13px; font-weight: 800; color: #fff; display: inline-block; text-align: left; margin-left: 6px; vertical-align: 12px; line-height: 1.2; }
.win .coupon { margin-top: 12px; width: 100%; justify-content: space-between; font-size: 12px; padding: 9px 12px; }
.win .coupon b { font-size: 15px; }
.win .cta { width: 100%; justify-content: center; height: 40px; margin-top: 9px; }
.win .pp { font-size: 10.5px; font-weight: 800; color: rgba(255, 255, 255, .75); margin-top: 9px; text-decoration: underline; }
.legal { position: absolute; z-index: 9; left: 14px; right: 14px; bottom: 6px; font-size: 7.3px; pointer-events: none; }
</style>
</head>

  function paint() {

        if (opened[i]) return; var r = rect(i);

  function check() {

  }
  var nOpen = 0, nWin = 0;
  function open(i, why) {

    $('cnt').innerHTML = 'Açılan: <b>' + nOpen + '</b>/6';
    if (items[i] === K.win) { nWin++; cells[i].classList.add('hit'); $('cnt').innerHTML += ' · <b>' + nWin + '/3</b> D3 & K2'; }
    if (why !== 'auto') AD.track('kazi_open_' + items[i].key);
    if (nWin === 3) setTimeout(win, 650);
  }
  function win() {
    if (done) return; done = true;
    ad.classList.add('done');
    $('ws').textContent = '3 Vitamin D3 & K2 buldun — Kasım\'ın güneşsiz günlerine hazırsın.';
    $('trio').innerHTML = [-8, 0, 8].map(function (r) { return '<div style="--r:' + r + 'deg"><img src="' + K.win.img + '" alt=""></div>'; }).join('');

  function pos(e) { var b = cv.getBoundingClientRect(); return [(e.clientX - b.left) * W / b.width, (e.clientY - b.top) * H / b.height]; }
