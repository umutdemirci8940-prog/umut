<style>
:root {
  --navy: #132d7d;
  --navy-d: #0b1c52;
  --green: #5fa511;
  --green-l: #8fd14a;
  --ink: #0f1a3a;
  --white: #fff;
  --serif: 'Fraunces', Georgia, 'Times New Roman', serif;
  --sans: 'Manrope', 'Helvetica Neue', Arial, sans-serif;
  --ease: cubic-bezier(.22, .8, .2, 1);
}
* { box-sizing: border-box; margin: 0; padding: 0; }
html, body { width: 100%; height: 100%; overflow: hidden; background: var(--navy-d); }
body { font-family: var(--sans); color: var(--white); -webkit-font-smoothing: antialiased; -webkit-tap-highlight-color: transparent; user-select: none; -webkit-user-select: none; }
img { display: block; -webkit-user-drag: none; }
button { font: inherit; color: inherit; border: 0; background: none; cursor: pointer; }
.ad { position: relative; overflow: hidden; background: var(--navy-d); cursor: pointer; }
.legal { font-size: 8px; line-height: 1.25; color: rgba(255, 255, 255, .72); letter-spacing: .01em; }

/* Kupon çipi */
.coupon { display: inline-flex; align-items: center; gap: 8px; border-radius: 10px; background: rgba(255, 255, 255, .14); border: 1px dashed rgba(255, 255, 255, .55); padding: 6px 10px; transition: background .25s, transform .25s var(--ease); }
.coupon:hover { background: rgba(255, 255, 255, .22); }
.coupon:active { transform: scale(.97); }
.coupon b { font-weight: 800; letter-spacing: .08em; }
.coupon .cp-act { font-size: 9px; font-weight: 700; text-transform: uppercase; letter-spacing: .08em; color: var(--green-l); }
.coupon .cp-ok { display: none; }
.coupon.copied { background: var(--green); border-color: var(--green); }
.coupon.copied .cp-act { display: none; }
.coupon.copied .cp-ok { display: inline; font-size: 9px; font-weight: 800; text-transform: uppercase; letter-spacing: .08em; }

/* Yeşil CTA */
.cta { display: inline-flex; align-items: center; gap: 8px; height: 34px; padding: 0 16px; border-radius: 999px; background: var(--green); color: #fff; font-weight: 800; font-size: 12.5px; letter-spacing: .01em; white-space: nowrap; box-shadow: 0 6px 18px rgba(95, 165, 17, .38); transition: transform .25s var(--ease), background .25s; }
.cta:hover { background: #6cbb14; transform: translateY(-1px); }
.cta i { font-style: normal; transition: transform .25s var(--ease); }
.cta:hover i { transform: translateX(3px); }

/* Ürün kutucuğu (orijinal ambalaj fotoğrafı, beyaz kart) */
.pk { position: relative; flex: none; background: #fff; border-radius: 10px; display: flex; align-items: center; justify-content: center; box-shadow: 0 6px 16px rgba(5, 15, 50, .28); transition: transform .3s var(--ease), box-shadow .3s; }
.pk img { max-width: 86%; max-height: 82%; object-fit: contain; }
.pk:hover { transform: translateY(-4px) scale(1.04); box-shadow: 0 10px 22px rgba(5, 15, 50, .4); z-index: 2; }
.pk .tip { position: absolute; left: 50%; bottom: calc(100% + 6px); transform: translate(-50%, 4px); background: #fff; color: var(--navy); font-size: 10px; font-weight: 800; padding: 4px 8px; border-radius: 6px; white-space: nowrap; opacity: 0; pointer-events: none; transition: opacity .2s, transform .2s; box-shadow: 0 4px 12px rgba(0, 0, 0, .25); }
.pk:hover .tip { opacity: 1; transform: translate(-50%, 0); }

@media (prefers-reduced-motion: reduce) { *, *::before, *::after { transition-duration: .01s !important; animation-duration: .01s !important; } }

.ad { width: 320px; height: 480px; touch-action: none; }
/* Gezinilebilir ofis fotoğrafı */
.world { position: absolute; left: 0; top: 0; width: 693px; height: 520px; will-change: transform; }
.world > img { width: 100%; height: 100%; }
.shade { position: absolute; inset: 0; pointer-events: none; background: linear-gradient(180deg, rgba(11, 28, 82, .9) 0%, rgba(11, 28, 82, .55) 18%, rgba(11, 28, 82, 0) 32%, rgba(11, 28, 82, 0) 84%, rgba(11, 28, 82, .85) 100%); z-index: 2; }
/* Sıcak noktalar: fotoğraftaki gerçek nesneler */
.hs { position: absolute; z-index: 1; width: 40px; height: 40px; margin: -20px 0 0 -20px; border-radius: 50%; display: flex; align-items: center; justify-content: center; }
.hs::before { content: ''; position: absolute; inset: 0; border-radius: 50%; border: 2px solid #fff; animation: ping 1.8s var(--ease) infinite; }
.hs::after { content: ''; width: 14px; height: 14px; border-radius: 50%; background: #fff; box-shadow: 0 0 0 4px rgba(95, 165, 17, .85), 0 4px 12px rgba(0, 0, 0, .4); transition: background .3s; }
.hs.found::after { background: var(--green-l); box-shadow: 0 0 0 4px rgba(255, 255, 255, .9), 0 4px 12px rgba(0, 0, 0, .4); }
.hs.found::before { animation: none; opacity: 0; }
@keyframes ping { 0% { transform: scale(.5); opacity: 1; } 100% { transform: scale(1.6); opacity: 0; } }
.hs span { position: absolute; top: calc(100% + 2px); left: 50%; transform: translateX(-50%); white-space: nowrap; font-size: 9px; font-weight: 800; background: rgba(11, 28, 82, .75); padding: 2px 6px; border-radius: 6px; opacity: 0; transition: opacity .3s; }
.hs.found span { opacity: 1; }
/* Üst bilgi */
.top { position: absolute; z-index: 3; left: 14px; right: 14px; top: 12px; pointer-events: none; }
.top .logo { width: 98px; }
.top h1 { font-family: var(--serif); font-weight: 600; font-size: 21px; line-height: 1.05; margin-top: 8px; letter-spacing: -.01em; text-shadow: 0 2px 12px rgba(0, 0, 0, .35); }
.top h1 em { color: var(--green-l); }
.prog { display: flex; align-items: center; gap: 4px; margin-top: 7px; }
.prog i { width: 18px; height: 4px; border-radius: 4px; background: rgba(255, 255, 255, .3); transition: background .4s; }
.prog i.on { background: var(--green-l); }
.prog span { font-size: 9.5px; font-weight: 800; letter-spacing: .05em; margin-left: 5px; text-shadow: 0 1px 6px rgba(0, 0, 0, .5); }
.hint { position: absolute; z-index: 3; left: 50%; bottom: 40px; transform: translateX(-50%); white-space: nowrap; font-size: 11.5px; font-weight: 800; background: #fff; color: var(--navy); padding: 8px 14px; border-radius: 999px; box-shadow: 0 6px 16px rgba(0, 0, 0, .3); transition: opacity .3s; pointer-events: none; }
.user .hint { opacity: 0; }
/* Alt kart */
.sheet { position: absolute; z-index: 5; left: 8px; right: 8px; bottom: 28px; border-radius: 18px; padding: 14px 14px 12px; background: rgba(11, 28, 82, .82); -webkit-backdrop-filter: blur(14px) saturate(1.3); backdrop-filter: blur(14px) saturate(1.3); border: 1px solid rgba(255, 255, 255, .2); transform: translateY(calc(100% + 40px)); transition: transform .5s var(--ease); }
.sheet.on { transform: none; }
.sheet:not(.on) { pointer-events: none; }
.sheet .x { position: absolute; right: 8px; top: 6px; width: 28px; height: 28px; font-size: 20px; line-height: 1; color: rgba(255, 255, 255, .8); }
.sheet .ov { font-size: 9.5px; font-weight: 800; letter-spacing: .14em; text-transform: uppercase; color: var(--green-l); }
.sheet h2 { font-family: var(--serif); font-weight: 600; font-size: 22px; line-height: 1.05; margin-top: 2px; }
.sheet p { font-size: 11px; line-height: 1.35; font-weight: 600; color: rgba(255, 255, 255, .88); margin-top: 4px; }
.sheet .imgs { display: flex; gap: 7px; margin-top: 10px; }
.sheet .imgs .pk { width: 64px; height: 78px; overflow: hidden; }
.sheet .imgs .pk.book img { max-width: 100%; max-height: 100%; width: 100%; height: 100%; object-fit: cover; }
.sheet .big { font-family: var(--serif); font-weight: 700; font-size: 54px; line-height: .9; color: var(--green-l); margin-top: 6px; }
.sheet .coupon { margin-top: 8px; width: 100%; justify-content: space-between; font-size: 12px; padding: 8px 12px; }
.sheet .coupon b { font-size: 14px; }
.sheet .cta { width: 100%; justify-content: center; height: 38px; margin-top: 10px; font-size: 13px; }
.legal { position: absolute; z-index: 6; left: 14px; right: 14px; bottom: 6px; font-size: 7.3px; pointer-events: none; }
</style>
</head>

    if (!found[k] && why !== 'auto') { found[k] = true; nFound++; bars[nFound - 1].classList.add('on'); dots[k].classList.add('found'); }
    pc.textContent = nFound === H.length ? 'Hepsini buldun!' : nFound + '/' + H.length + ' sürpriz';
    var body = '<div class="ov">' + (nFound === H.length && !h.coupon ? 'Tur tamam · ' : '') + h.label + '</div><h2>' + h.title + '</h2><p>' + h.text + '</p>';
    if (h.coupon) body += '<button class="coupon" data-copy="1"><span>İndirim kodu: <b>' + D.coupon.code + '</b></span><span class="cp-act">Kopyala</span><span class="cp-ok">✓ Kopyalandı</span></button>';
    else body += '<div class="imgs">' + h.imgs.map(function (src) { return '<div class="pk' + (/\/b-/.test(src) ? ' book' : '') + '"><img src="' + src + '" alt=""></div>'; }).join('') + '</div>';
    body += '<button class="cta" data-go="1">' + h.cta + ' <i>→</i></button>';
    sc.innerHTML = body;
    sheet.classList.add('on');
    tgt = lookAt(h); setTimeout(function () { if (openK === k) tgt = null; }, 1400);
    if (why !== 'auto') AD.track('office_' + h.key);
    if (nFound === H.length && why !== 'auto') AD.track('office_all_found');
  }
  function close() { sheet.classList.remove('on'); openK = -1; if (userMoved) tgt = null; }
  document.getElementById('x').addEventListener('click', function (e) { e.stopPropagation(); close(); });
  sheet.addEventListener('click', function (e) {
    e.stopPropagation();
    var h = H[openK]; if (!h) return;
    var c = e.target.closest('[data-copy]'); if (c) return AD.copy(c, D.coupon.code);
    AD.exit('ofis_' + h.key, h.url);
  });
  ad.addEventListener('click', function (e) { if (!dragged && !e.target.closest('.hs') && !e.target.closest('.sheet') && openK < 0 && userMoved) AD.exit('brand', D.brand.home); });
  ad.addEventListener('keydown', function (e) {
    if (e.key === 'ArrowRight' || e.key === 'ArrowLeft') { takeOver(); var k = ((openK < 0 ? -1 : openK) + (e.key === 'ArrowRight' ? 1 : H.length - 1) + H.length) % H.length; open(k, 'key'); }
    if (e.key === 'Escape') close();
    if (e.key === 'Enter' && openK >= 0) AD.exit('ofis_' + H[openK].key, H[openK].url);
  });
  // Tanıtım: kamera kitaplıktan rafa, doktora süzülür; bir nesneyi kendisi açıp kapatır (≈ 12 sn)
  var tourT = null;
  var tourSteps = [[function () { tgt = { x: 0, y: MY / 2 }; }, 2200], [function () { tgt = { x: MX, y: 0 }; }, 2600], [function () { tgt = lookAt({ x: .5, y: .5 }); }, 1800],
    [function () { open(0, 'auto'); }, 3200], [function () { close(); tgt = lookAt({ x: .5, y: .5 }); }, 1200]];
  function tour(i) { if (userMoved || i >= tourSteps.length) return; tourSteps[i][0](); tourT = setTimeout(function () { tour(i + 1); }, tourSteps[i][1]); }
  AD.ready(function () {
    AD.track('impression_ready');
    requestAnimationFrame(frame);
    if (!AD.reduced) setTimeout(function () { tour(0); }, 700);
  });
})();
</script>
