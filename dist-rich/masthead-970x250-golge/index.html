      if (!n) return start();

/* Gölgen ne diyor? — şehir + tarih için güneş hesabı ve kişisel rutin eşlemesi (kreatife satır içi gömülür). */
var GUNES = (function () {
  var RAD = Math.PI / 180;
  function dayOfYear(d) { return Math.round((Date.UTC(d.getFullYear(), d.getMonth(), d.getDate()) - Date.UTC(d.getFullYear(), 0, 0)) / 864e5); }
  // NOAA yaklaşımı (±2 dk): deklinasyon, zaman denklemi, öğle yüksekliği, gün uzunluğu, doğuş/batış (Türkiye UTC+3)
  function calc(city, date) {
    var N = dayOfYear(date), phi = city.lat * RAD;
    var g = 2 * Math.PI / 365 * (N - 1);
    var decl = 0.006918 - 0.399912 * Math.cos(g) + 0.070257 * Math.sin(g) - 0.006758 * Math.cos(2 * g) + 0.000907 * Math.sin(2 * g) - 0.002697 * Math.cos(3 * g) + 0.00148 * Math.sin(3 * g);
    var eot = 229.18 * (0.000075 + 0.001868 * Math.cos(g) - 0.032077 * Math.sin(g) - 0.014615 * Math.cos(2 * g) - 0.040849 * Math.sin(2 * g));
    var noonAlt = 90 - Math.abs(city.lat - decl / RAD);
    var cosW = (Math.sin(-0.833 * RAD) - Math.sin(phi) * Math.sin(decl)) / (Math.cos(phi) * Math.cos(decl));
    var w = Math.acos(Math.max(-1, Math.min(1, cosW))) / RAD;
    var noon = 720 - 4 * city.lon - eot + 180; // yerel dakika
    return { noonAlt: noonAlt, shadow: 1 / Math.tan(noonAlt * RAD), dayMin: 8 * w, rise: noon - 4 * w, set: noon + 4 * w, noon: noon };
  }
  function hm(min) { min = Math.round(min); return ('0' + Math.floor(min / 60)).slice(-2) + ':' + ('0' + (min % 60)).slice(-2); }
  function dur(min) { min = Math.round(Math.abs(min)); var h = Math.floor(min / 60), m = min % 60; return (h ? h + ' sa ' : '') + m + ' dk'; }
  function num(x) { return x.toFixed(1).replace('.', ','); }
  var AY = ['Ocak', 'Şubat', 'Mart', 'Nisan', 'Mayıs', 'Haziran', 'Temmuz', 'Ağustos', 'Eylül', 'Ekim', 'Kasım', 'Aralık'];
  function dateTR(d) { return d.getDate() + ' ' + AY[d.getMonth()]; }
  // Bulunma eki (ünlü uyumu): 18 Ekim'de, 30 Haziran'da, 1 Ağustos'ta
  var DA = ["'ta", "'ta", "'ta", "'da", "'ta", "'da", "'da", "'ta", "'de", "'de", "'da", "'ta"];
  function dateTRda(d) { return dateTR(d) + DA[d.getMonth()]; }
  // Haziran gündönümünden Aralık gündönümüne: t=0..1
  function yearSpan(now) {
    var y = now.getFullYear(), a = new Date(y, 5, 21), b = new Date(y, 11, 21);
    if (now < a) { a = new Date(y - 1, 5, 21); b = new Date(y - 1, 11, 21); }
    return { a: a, b: b, at: function (t) { return new Date(a.getTime() + (b - a) * t); }, tOf: function (d) { return Math.max(0, Math.min(1, (d - a) / (b - a))); } };
  }
  // Fotoğrafın ışığı: öğle güneşinin yüksekliğine göre (≈27° kış → ≈73° yaz)
  function light(alt) {
    var k = Math.max(0, Math.min(1, (alt - 25) / 48));
    return 'brightness(' + (0.5 + 0.58 * k).toFixed(3) + ') saturate(' + (0.45 + 0.7 * k).toFixed(3) + ') contrast(' + (0.92 + 0.12 * k).toFixed(3) + ') hue-rotate(' + ((1 - k) * 12).toFixed(1) + 'deg)';
  }
  // Cevaplar → en fazla 3 ürün (her zaman gün ışığı ürünüyle başlar)
  function recommend(answers, P) {
    var out = [answers.aile === 'cocuk' ? 'd3' : 'd3k2'];
    if (answers.aile === 'cocuk') out.push('omega3surup');
    out.push(answers.his === 'enerji' ? 'b12' : 'magnezyum');
    if (out.length < 3) out.push(answers.gun === 'masa' ? 'omega3' : 'krill');
    return out.slice(0, 3).map(function (k) { return P[k]; });
  }
  return { calc: calc, hm: hm, dur: dur, num: num, dateTR: dateTR, dateTRda: dateTRda, yearSpan: yearSpan, light: light, recommend: recommend };
})();

(function () {
  var G = AD.creative.gunes, D = AD.data, ad = document.getElementById('ad');
  var $ = function (id) { return document.getElementById(id); };
  // Şehir: yayın makrosu (?city=ankara) varsa o, yoksa İstanbul; kullanıcı değiştirebilir
  var q = (location.search.match(/[?&]city=([^&]+)/) || [])[1];
  var city = G.cities.filter(function (c) { return c.key === (q || '').toLowerCase(); })[0] || G.cities[0];
  var now = new Date(), span = GUNES.yearSpan(now), tToday = span.tOf(now), t = tToday;
  $('today').style.left = (tToday * 100) + '%';
  function update() {
    var d = span.at(t), c = GUNES.calc(city, d), cJ = GUNES.calc(city, span.a), cN = GUNES.calc(city, now);
    var isToday = Math.abs(t - tToday) < 0.012;
    $('ph').style.filter = GUNES.light(c.noonAlt);
    $('knob').style.left = (t * 100) + '%';
    $('cityBtn').textContent = city.name + ' ▾';
    $('dateTxt').textContent = '· ' + (isToday ? 'bugün, ' : '') + GUNES.dateTR(d);
    $('hl').innerHTML = (isToday ? 'Bugün' : GUNES.dateTRda(d)) + ' öğlen gölgen<br>boyunun <em>' + GUNES.num(c.shadow) + ' katı.</em>';
    $('big').innerHTML = GUNES.num(c.shadow) + '<small>×</small>';
    $('big').style.color = c.shadow > 1 ? '#fff' : '#ffd25a';
    var lost = cJ.dayMin - cN.dayMin;
    $('sub').innerHTML = G.fact + (lost > 5 ? ' Haziran\'dan bu yana ' + city.name + ' <b>' + GUNES.dur(lost) + '</b> gün ışığı kaybetti.' : '');
    $('sun').innerHTML = '<b>' + city.name + '</b> · ' + GUNES.dateTR(d) + '<br>Gün doğumu ' + GUNES.hm(c.rise) + ' · batımı ' + GUNES.hm(c.set) + ' · ' + GUNES.dur(c.dayMin) + ' gün ışığı';
  }
  // Kaydırıcı (güneşi sürükle)
  var sl = $('slider'), dragging = false, userTouched = false;
  function setFromX(x) { var b = sl.getBoundingClientRect(); t = Math.max(0, Math.min(1, (x - b.left) / b.width)); update(); }
  sl.addEventListener('pointerdown', function (e) { e.stopPropagation(); dragging = true; touch('slider'); setFromX(e.clientX); try { sl.setPointerCapture(e.pointerId); } catch (er) {} });
  sl.addEventListener('pointermove', function (e) { if (dragging) setFromX(e.clientX); });
  sl.addEventListener('pointerup', function () { dragging = false; });
  sl.addEventListener('click', function (e) { e.stopPropagation(); });
  sl.addEventListener('keydown', function (e) { if (e.key === 'ArrowLeft' || e.key === 'ArrowRight') { e.stopPropagation(); touch('slider'); t = Math.max(0, Math.min(1, t + (e.key === 'ArrowRight' ? .05 : -.05))); update(); } });
  function touch(what) { if (!userTouched) { userTouched = true; stopDemo(); } AD.track('golge_' + what); }
  // Şehir seçici
  var cities = $('cities');
  cities.innerHTML = G.cities.map(function (c) { return '<button data-k="' + c.key + '">' + c.name + '</button>'; }).join('');
  $('cityBtn').addEventListener('click', function (e) { e.stopPropagation(); touch('city_open'); cities.classList.toggle('on'); mark(); });
  function mark() { [].forEach.call(cities.children, function (b) { b.classList.toggle('sel', b.dataset.k === city.key); }); }
  cities.addEventListener('click', function (e) {
    e.stopPropagation(); var b = e.target.closest('button'); if (!b) return;
    city = G.cities.filter(function (c) { return c.key === b.dataset.k; })[0]; AD.track('golge_city_' + city.key);
    cities.classList.remove('on'); t = tToday; update();
  });
  // Sorular
  var answers = {}, qi = 0;
  function show(n) { ['s1', 's2', 's3'].forEach(function (id, i) { $(id).classList.toggle('on', i === n - 1); }); }
  function ask(i) {
    var Q = G.questions[i]; qi = i;
    $('qov').textContent = 'Kasım rutinin · ' + (i + 1) + '/' + G.questions.length + ' · ' + city.name + ' · gölge ' + GUNES.num(GUNES.calc(city, now).shadow) + '×';
    $('qt').textContent = Q.q;
    $('ans').innerHTML = Q.a.map(function (a, j) { return '<button data-j="' + j + '"><img src="' + a.img + '" alt=""><span>' + a.t + '</span></button>'; }).join('');
  }
  $('ans').addEventListener('click', function (e) {
    e.stopPropagation(); var b = e.target.closest('button'); if (!b) return;
    var Q = G.questions[qi], a = Q.a[+b.dataset.j];
    answers[Q.key] = a.v; b.classList.add('pick'); AD.track('quiz_' + Q.key + '_' + a.v);
    setTimeout(function () { if (qi + 1 < G.questions.length) ask(qi + 1); else result(); }, 380);
  });
  $('start').addEventListener('click', function (e) { e.stopPropagation(); touch('start'); answers = {}; ask(0); show(2); });
  var picks = [], code = '';
  function result() {
    picks = GUNES.recommend(answers, G.products);
    code = G.questions.map(function (Q) { return answers[Q.key]; }).join('_');
    var tag = { masa: 'masa başında', hareket: 'hareket halinde', cocuk: 'minikleriyle', ben: 'kendi için', enerji: 'enerji arayan', huzur: 'akşam dinginliği arayan' };
    $('rov').textContent = 'Senin Kasım rutinin · ' + city.name;
    $('rh').innerHTML = 'Günün ' + tag[answers.gun] + ', rutini ' + tag[answers.aile] + ' kuran, <em>' + tag[answers.his] + '</em> biri için:';
    $('rp').innerHTML = picks.map(function (p, i) { return '<div class="it" data-i="' + i + '"><div class="pk"><img src="' + p.img + '" alt=""></div><div><b>' + p.name + '</b><small>' + p.why + '</small></div></div>'; }).join('');
    $('note').textContent = G.note;
    show(3); AD.track('quiz_result_' + code);
  }
  $('rp').addEventListener('click', function (e) { e.stopPropagation(); var it = e.target.closest('.it'); if (it) { var p = picks[+it.dataset.i]; AD.exit('golge_' + p.key, p.url); } });
  $('go').addEventListener('click', function (e) { e.stopPropagation(); AD.exit('golge_sonuc', G.resultUrl + '_' + code); });
  $('again').addEventListener('click', function (e) { e.stopPropagation(); t = tToday; update(); show(1); });
  $('cp').addEventListener('click', function (e) { e.stopPropagation(); AD.copy(this, D.coupon.code); });
  ad.addEventListener('click', function () { cities.classList.remove('on'); if ($('s1').classList.contains('on')) AD.exit('golge_genel', D.brand.home); });
  // Tanıtım: güneş Haziran'dan bugüne kayar (ışık söner, gölge uzar), iki kez; sonra CTA nabız atar (< 30 sn)
  var raf = null, demoT = [];
  function sweep(ms, done) {
    var t0 = null;
    (function step(ts) { if (userTouched) return; if (t0 === null) t0 = ts; var k = Math.min(1, (ts - t0) / ms); var e = k < .5 ? 2 * k * k : 1 - Math.pow(-2 * k + 2, 2) / 2; t = tToday * e; update(); if (k < 1) raf = requestAnimationFrame(step); else if (done) done(); })(performance.now());
  }
  function stopDemo() { cancelAnimationFrame(raf); demoT.forEach(clearTimeout); }
  update();
  AD.ready(function () {
    AD.track('impression_ready');
    if (AD.reduced) return;
    t = 0; update();
    demoT.push(setTimeout(function () { sweep(3600, function () { $('start').classList.add('pulse'); }); }, 900));
    demoT.push(setTimeout(function () { if (!userTouched) { t = 0; update(); demoT.push(setTimeout(function () { sweep(3600, function () { $('start').classList.remove('pulse'); void $('start').offsetWidth; $('start').classList.add('pulse'); }); }, 600)); } }, 12000));
  });
})();
</script>
