<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="ad.size" content="width=970,height=250">
<meta name="viewport" content="width=970">
<title>Superonline – 1000 Mbps | KADRAJ | 970x250 Interactive Masthead</title>
<style>
/* ============================================================
   SUPERONLINE · 1000 Mbps · KONSEPT "KADRAJ" · 970x250
   Banner bir vizördür: köşe braketleri sayacı çerçevede tutmaya
   çalışır, hız arttıkça titrer ve genişler; 1000'de rakam kadrajı
   kırıp taşar. Renkler marka varlıklarından: lacivert zemin (#104AA1,
   logodan) → impact'te Superonline sarısı (#FFC40C) → beyaz final,
   sarı CTA. Etkileşim: imleci / parmağı sağa kaydır = hızlan.
   Tek dosya HTML5. Canvas yok, harici bağımlılık yok.
   ------------------------------------------------------------
   Kolay değiştirilecek alanlar:
   - Renkler: :root değişkenleri
   - Metinler: <body> içindeki metin düğümleri
   - Süreler / fizik / fiyat / URL / logo: <script> içindeki CONFIG ve T
   ============================================================ */
:root{
  --w:970px; --h:250px;
  --yellow:#FFC40C;           /* Superonline sarısı (logodan örneklendi) – vurgu, CTA, impact zemini */
  --yellow2:#FFD24A;          /* açık ton */
  --navy:#104AA1;             /* Superonline laciverti (logodan örneklendi) – zemin ve tipografi */
  --navy2:#1A5BBE;            /* açık lacivert – zemin parlaması */
  --ink:#104AA1;              /* metin rengi = lacivert */
  --ink70:rgba(16,74,161,.7);
  --ink40:rgba(16,74,161,.4);
  --gray:#5B6470;             /* yardımcı metin (beyaz zemin) */
  --white:#ffffff;
  --font:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Liberation Sans","Helvetica Neue",Arial,sans-serif;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{background:var(--navy)}
body{width:var(--w);height:var(--h);overflow:hidden;font-family:var(--font);-webkit-font-smoothing:antialiased;text-rendering:geometricPrecision}
#ad{position:relative;width:var(--w);height:var(--h);overflow:hidden;background:var(--navy);contain:strict;user-select:none;-webkit-user-select:none;cursor:pointer;touch-action:none;color:var(--ink)}
#ad::after{content:"";position:absolute;inset:0;pointer-events:none;box-shadow:inset 0 0 0 1px rgba(255,255,255,.08);z-index:5}

/* ---------- Zemin katmanları ---------- */
.bg{position:absolute;inset:0;background:
  radial-gradient(900px 320px at 28% 45%, var(--navy2) 0%, rgba(26,91,190,0) 62%),
  linear-gradient(90deg, rgba(0,0,0,.22) 0%, rgba(0,0,0,0) 12%, rgba(0,0,0,0) 88%, rgba(0,0,0,.22) 100%),
  var(--navy)}
.bgAlt{position:absolute;inset:0;background:radial-gradient(900px 320px at 50% 50%, var(--yellow2) 0%, var(--yellow) 70%);opacity:0}
.streaks{position:absolute;inset:-12px;overflow:hidden;will-change:transform}
.streak{position:absolute;left:0;top:0;height:2px;width:160px;border-radius:2px;transform-origin:100% 50%;will-change:transform,opacity;opacity:0;
  background:linear-gradient(90deg,rgba(255,255,255,0) 0%,rgba(255,255,255,.55) 70%,rgba(255,255,255,.95) 100%)}
.streak.k{background:linear-gradient(90deg,rgba(255,196,12,0) 0%,rgba(255,196,12,.6) 70%,var(--yellow) 100%)}
.streak.beam{height:16px;border-radius:16px;background:radial-gradient(ellipse at 100% 50%,rgba(255,196,12,.4) 0%,rgba(255,196,12,.1) 40%,rgba(255,196,12,0) 72%)}
.alt .streak{background:linear-gradient(90deg,rgba(255,255,255,0) 0%,rgba(255,255,255,.6) 70%,#fff 100%)}
.alt .streak.k{background:linear-gradient(90deg,rgba(16,74,161,0) 0%,rgba(16,74,161,.18) 70%,rgba(16,74,161,.35) 100%)}
.alt .streak.beam{background:radial-gradient(ellipse at 100% 50%,rgba(255,255,255,.5) 0%,rgba(255,255,255,.14) 40%,rgba(255,255,255,0) 72%)}
/* Kullanım şeridi → finalde tam sarı zemin olur */
.strip{position:absolute;inset:0;background:#fff;opacity:0;clip-path:inset(124px 0 124px 0)}

/* ---------- Sahne katmanı ---------- */
.stage{position:absolute;inset:0}

/* Logo (sağ üst) – lacivert zeminde negatif (beyaz yazı), beyaz finalde orijinal renkli sürüm */
.logo{position:absolute;right:30px;top:20px;display:flex;align-items:center;opacity:0;min-height:30px}
.logoImg{display:none;height:36px;width:auto;max-width:240px}
.logo.hasImg .logoW{display:block}
.s5 .logo.hasImg .logoW{display:none}
.s5 .logo.hasImg .logoC{display:block}
.logo.hasImg .logoFallback{display:none}
.logoFallback{font-size:20px;font-weight:800;letter-spacing:-.03em;color:#fff}

/* Sayaç */
.counter{position:absolute;left:120px;top:50%;height:132px;margin-top:-66px;display:flex;align-items:center;opacity:0}
.digitsWrap{position:relative;height:132px;display:flex;align-items:center}
.digits{position:relative;display:flex;align-items:center;font-size:132px;font-weight:900;letter-spacing:-.05em;line-height:1;color:#fff;white-space:nowrap;
  font-variant-numeric:tabular-nums;font-feature-settings:"tnum";transform-origin:0 50%;will-change:transform;transition:color .25s}
.digits .num{position:relative;z-index:2}
.digits .ghost{position:absolute;left:0;top:0;height:100%;display:flex;align-items:center;color:var(--yellow);opacity:0;will-change:transform,opacity;z-index:1}
.unitWrap{margin-left:14px;align-self:flex-end;margin-bottom:20px;will-change:transform}
.unit{font-size:20px;font-weight:800;letter-spacing:.08em;color:rgba(255,255,255,.75);line-height:1;will-change:transform,opacity;transition:color .25s}

/* Vizör braketleri */
.vf{position:absolute;left:0;top:0;width:100px;height:100px;opacity:0;pointer-events:none;will-change:transform}
.vf .c{position:absolute;width:20px;height:20px;border:0 solid var(--yellow)}
.vf .tl{left:0;top:0;border-left-width:2px;border-top-width:2px}
.vf .tr{right:0;top:0;border-right-width:2px;border-top-width:2px}
.vf .bl{left:0;bottom:0;border-left-width:2px;border-bottom-width:2px}
.vf .br{right:0;bottom:0;border-right-width:2px;border-bottom-width:2px}
.vf .m{position:absolute;background:var(--yellow);opacity:.7}
.vf .mt{left:50%;top:-1px;width:2px;height:8px;margin-left:-1px}
.vf .mb{left:50%;bottom:-1px;width:2px;height:8px;margin-left:-1px}
.vf .ml{left:-1px;top:50%;width:8px;height:2px;margin-top:-1px}
.vf .mr{right:-1px;top:50%;width:8px;height:2px;margin-top:-1px}
.vf.snap{transition:left .22s cubic-bezier(.2,.8,.2,1),top .22s cubic-bezier(.2,.8,.2,1),width .22s cubic-bezier(.2,.8,.2,1),height .22s cubic-bezier(.2,.8,.2,1)}
.vf.snap .c{border-color:var(--navy)}
.vf.snap .m{background:var(--navy)}
.vf.break .c{animation:cOut .5s .18s cubic-bezier(.5,0,.8,.3) forwards}
.vf.break .m{animation:off .2s .18s forwards}
.vf .tl{--dx:-90px;--dy:-90px}.vf .tr{--dx:90px;--dy:-90px}.vf .bl{--dx:-90px;--dy:90px}.vf .br{--dx:90px;--dy:90px}

/* Ray (hız skalası + etkileşim) */
.rail{position:absolute;left:120px;width:730px;top:218px;height:1px;background:rgba(255,255,255,.3);opacity:0}
.railFill{position:absolute;left:0;top:-1px;width:100%;height:3px;background:var(--yellow);transform-origin:0 50%;transform:scaleX(0);will-change:transform}
.tick{position:absolute;top:-4px;width:1px;height:9px;background:rgba(255,255,255,.45)}
.tick span{position:absolute;left:50%;top:12px;transform:translateX(-50%);font-size:10px;font-weight:700;letter-spacing:.1em;color:rgba(255,255,255,.7);white-space:nowrap}
.tick.on{background:var(--yellow)}.tick.on span{color:var(--yellow)}
.knob{position:absolute;left:0;top:50%;width:16px;height:16px;margin:-8px 0 0 -8px;border-radius:50%;background:var(--yellow);box-shadow:0 0 0 4px rgba(255,196,12,.22);will-change:transform;transition:box-shadow .2s}
.knob::after{content:"";position:absolute;left:5px;top:5px;width:6px;height:6px;border-radius:50%;background:var(--navy)}
.interacted .knob,.auto .knob{box-shadow:0 0 0 7px rgba(255,196,12,.2)}
.rail,.knob{cursor:grab}
/* Ray boyunca yön veren ışık süpürmesi (etkileşime kadar) */
.railShine{position:absolute;top:-3px;left:0;width:120px;height:7px;border-radius:4px;opacity:0;pointer-events:none;
  background:linear-gradient(90deg,rgba(255,255,255,0),rgba(255,255,255,.65),rgba(255,255,255,0));animation:railSweep 2.4s 1.2s ease-in-out infinite}
.interacted .railShine,.auto .railShine{animation:none;opacity:0}
/* Kademe ödülü */
.tick span{transition:color .25s}
.tick.pop span{animation:tickPop .6s cubic-bezier(.2,.9,.3,1.4)}
.tick.pop::before{content:"";position:absolute;left:50%;top:50%;width:10px;height:10px;margin:-5px 0 0 -5px;border-radius:50%;border:2px solid var(--yellow);animation:tickRing .6s ease-out forwards}
/* Hayalet el: hareketi gösterir */
.hand{position:absolute;left:0;top:-4px;width:30px;height:30px;margin-left:-6px;opacity:0;pointer-events:none;will-change:transform,opacity;filter:drop-shadow(0 4px 10px rgba(0,0,0,.35))}
.hand svg{width:30px;height:30px;stroke:#fff;fill:rgba(16,74,161,.6);stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.hand .tap{position:absolute;left:5px;top:-1px;width:12px;height:12px;border-radius:50%;border:2px solid var(--yellow);opacity:0}
.hand.down .tap{animation:tickRing .7s ease-out infinite}
/* İmleci izleyen ışık */
.cursorGlow{position:absolute;left:0;top:0;width:280px;height:280px;margin:-140px 0 0 -140px;border-radius:50%;opacity:0;pointer-events:none;will-change:transform,opacity;transition:opacity .35s;
  background:radial-gradient(circle,rgba(255,196,12,.22) 0%,rgba(255,196,12,.08) 35%,rgba(255,196,12,0) 65%)}
.cursorGlow.on{opacity:1}
/* Koçluk metni */
.hint{position:absolute;right:120px;top:172px;display:flex;align-items:center;gap:9px;height:28px;padding:0 6px 0 13px;border-radius:14px;border:1px solid rgba(255,196,12,.55);background:rgba(8,44,102,.45);
  font-size:10.5px;font-weight:800;letter-spacing:.2em;color:#fff;opacity:0;white-space:nowrap;pointer-events:none;transition:border-color .3s,background .3s}
.hint svg{width:16px;height:12px;stroke:var(--yellow);fill:none;stroke-width:2.2;stroke-linecap:round;stroke-linejoin:round;animation:nudge 1.2s ease-in-out infinite}
.hint.hot{border-color:var(--yellow);background:rgba(255,196,12,.18)}
.hint.hot svg{animation-duration:.6s}
.hint .txt{display:inline-block}
.hint.swap .txt{animation:hintSwap .35s ease-out}
.s1 .hint{animation:fadeIn .6s .9s forwards}
.s3 .hint{animation:none;opacity:0;transition:opacity .2s}
.s3 .cursorGlow,.s3 .hand{display:none}

/* Impact */
.flash{position:absolute;inset:0;opacity:0;pointer-events:none;background:radial-gradient(circle at 40% 50%,rgba(255,255,255,1) 0%,rgba(255,244,200,.85) 25%,rgba(255,196,12,0) 65%)}

/* Mesaj (karanlık faz) */
.tag{position:absolute;left:0;right:0;top:50%;margin-top:-26px;text-align:center;font-size:36px;font-weight:800;letter-spacing:-.02em;color:var(--navy);opacity:0;line-height:1.35}
.tag em{font-style:normal;background:#fff;color:var(--navy);padding:0 12px;border-radius:8px;box-shadow:0 6px 18px rgba(16,74,161,.12)}

/* Kullanım şeridi kelimeleri */
.ticker{position:absolute;left:0;top:50%;height:62px;margin-top:-31px;display:flex;align-items:center;white-space:nowrap;opacity:0;will-change:transform}
.ticker span{display:inline-flex;align-items:center;font-size:30px;font-weight:900;letter-spacing:.04em;text-transform:uppercase;color:var(--navy);padding:0 26px}
.ticker span::after{content:"";width:10px;height:10px;border-radius:50%;background:var(--yellow);margin-left:40px}

/* Final (sarı zemin) */
.final{position:absolute;left:28px;top:0;height:250px;display:flex;flex-direction:column;justify-content:center;gap:10px;padding-top:8px}
.final > *{opacity:0;transform:translateX(-22px)}
.headline{font-size:44px;font-weight:900;letter-spacing:-.04em;line-height:1;color:var(--ink);white-space:nowrap}
.sub{display:inline-flex;align-self:flex-start;align-items:center;height:22px;padding:0 10px;border-radius:4px;background:var(--yellow);color:var(--navy);font-size:11px;font-weight:800;letter-spacing:.24em;text-transform:uppercase}
.offer{display:flex;align-items:baseline;gap:14px;margin-top:2px;white-space:nowrap}
.price{font-size:30px;font-weight:900;letter-spacing:-.03em;color:var(--ink);line-height:1}
.price small{font-size:15px;font-weight:700;letter-spacing:0;color:var(--gray);margin-left:2px}
.terms{font-size:12px;font-weight:600;color:var(--gray);padding-left:14px;border-left:1px solid rgba(16,74,161,.25);line-height:1.3}
.ghostNum{position:absolute;right:-24px;top:50%;font-size:300px;font-weight:900;letter-spacing:-.05em;line-height:1;color:transparent;-webkit-text-stroke:1px rgba(16,74,161,.14);transform:translateY(-50%);opacity:0;pointer-events:none;white-space:nowrap}

/* CTA – siyah pill */
.ctaWrap{position:absolute;right:34px;top:50%;margin-top:-26px;opacity:0;transform:scale(.85);z-index:3;pointer-events:none}
.s5 .ctaWrap{pointer-events:auto}
.cta{position:relative;display:inline-flex;align-items:center;gap:12px;height:52px;padding:0 22px 0 26px;border-radius:26px;background:var(--yellow);color:var(--navy);
  font-family:var(--font);font-size:15px;font-weight:800;letter-spacing:.14em;text-decoration:none;overflow:hidden;white-space:nowrap;
  box-shadow:0 10px 26px rgba(255,196,12,.35);transition:transform .25s cubic-bezier(.2,.8,.2,1),box-shadow .25s,background .25s}
.cta .arrow{width:18px;height:18px;stroke:var(--navy);fill:none;stroke-width:2.5;stroke-linecap:round;stroke-linejoin:round;transition:transform .3s cubic-bezier(.2,.8,.2,1)}
.cta .shine{position:absolute;top:-20px;bottom:-20px;left:-60px;width:40px;transform:skewX(-22deg);background:linear-gradient(90deg,rgba(255,255,255,0),rgba(255,255,255,.7),rgba(255,255,255,0));opacity:0}
.cta:hover{transform:translateY(-2px) scale(1.02);background:var(--yellow2);box-shadow:0 16px 34px rgba(255,196,12,.45)}
.cta:hover .arrow{transform:translateX(4px)}
.cta:hover .shine{animation:shine .75s ease-out forwards}
.cta:focus-visible{outline:2px solid var(--navy);outline-offset:3px}
.replay{position:absolute;right:40px;bottom:12px;display:flex;align-items:center;gap:6px;font-size:11px;font-weight:700;letter-spacing:.14em;color:#8A93A0;text-decoration:none;opacity:0;z-index:4;pointer-events:none;transition:color .2s}
.replay svg{width:12px;height:12px;stroke:currentColor;fill:none;stroke-width:2.2;stroke-linecap:round;stroke-linejoin:round}
.replay:hover{color:var(--navy)}
.s5 .replay{animation:fadeIn .6s 1.3s ease-out forwards;pointer-events:auto}

/* Tam alan tıklama */
.exit{position:absolute;inset:0;z-index:2;text-decoration:none;color:transparent;font-size:0}

/* ============================================================
   SAHNE DURUMLARI  (#ad üzerine JS'in eklediği sınıflar)
   s1 giriş · s3 impact · s3b mesaj · s4 şerit · s4b şerit açılır · s5 final · done
   dark karanlık faz · auto otomatik · interacted kullanıcı dokundu
   ============================================================ */
.s1 .logo{animation:logoIn .8s .15s cubic-bezier(.2,.8,.2,1) forwards}
.s1 .counter{animation:counterIn .9s .3s cubic-bezier(.2,.8,.2,1) forwards}
.s1 .vf{animation:fadeIn .5s .7s forwards}
.s1 .rail{animation:fadeIn .7s .8s forwards}

.s3 .flash{animation:flash .6s ease-out forwards}
.s3 .bgAlt{animation:fadeIn .22s .05s forwards}
.s3 .stage{animation:shake .4s linear}
.s3 .logo{animation:logoOut .15s forwards}
.s3 .rail{animation:logoOut .2s forwards}
.s3 .digits{color:var(--navy);animation:heroIn 1s cubic-bezier(.22,.9,.28,1) forwards}
.s3 .digits .ghost{opacity:0 !important}
.s3 .unit{color:var(--navy);animation:unitOut 1s cubic-bezier(.22,.9,.28,1) forwards}

.s3b .digitsWrap{animation:dim .6s ease-out forwards}
.s3b .unitWrap{animation:dim .5s ease-out forwards}
.s3b .tag{animation:tagIn .75s cubic-bezier(.16,1,.3,1) forwards}

.s4 .tag{animation:tagOut .4s cubic-bezier(.5,0,.8,.2) forwards}
.s4 .strip{animation:stripIn .35s cubic-bezier(.2,.8,.2,1) forwards}
.s4 .ticker{animation:fadeIn .25s .1s forwards}
.s4 .digitsWrap{animation:dimOff .4s forwards}
.s4 .unitWrap{animation:dimOff .4s forwards}

.s4b .strip{animation:stripFull .6s cubic-bezier(.7,0,.2,1) forwards}
.s4b .ticker{animation:off .3s forwards}

.s5 .logo{animation:logoBack .6s .2s forwards}
.s5 .ghostNum{animation:ghostIn 1.4s .3s ease-out forwards}
.s5 .final .sub{animation:slideIn .7s .15s cubic-bezier(.16,1,.3,1) forwards}
.s5 .final .headline{animation:slideIn .7s .3s cubic-bezier(.16,1,.3,1) forwards}
.s5 .final .offer{animation:slideIn .7s .45s cubic-bezier(.16,1,.3,1) forwards}
.s5 .ctaWrap{animation:ctaIn .65s .55s cubic-bezier(.2,.9,.3,1.25) forwards}
.s5 .cta::after{content:"";position:absolute;inset:-3px;border-radius:30px;border:2px solid rgba(255,196,12,.7);animation:pulse 2.2s 1.4s ease-out 2}

.fadeout .stage,.fadeout .strip,.fadeout .bgAlt{animation:off .5s ease-in forwards}

/* ---------- Keyframes ---------- */
@keyframes fadeIn{to{opacity:1}}
@keyframes off{to{opacity:0}}
@keyframes nudge{0%,100%{transform:translateX(0)}50%{transform:translateX(5px)}}
@keyframes railSweep{0%{transform:translateX(-120px);opacity:0}12%{opacity:1}88%{opacity:1}100%{transform:translateX(740px);opacity:0}}
@keyframes tickPop{0%{transform:translateX(-50%) scale(1)}45%{transform:translateX(-50%) scale(1.8)}100%{transform:translateX(-50%) scale(1)}}
@keyframes tickRing{0%{transform:scale(.6);opacity:.9}100%{transform:scale(3.2);opacity:0}}
@keyframes hintSwap{0%{opacity:0;transform:translateY(6px)}100%{opacity:1;transform:none}}
@keyframes logoIn{from{opacity:0;transform:translateX(12px)}to{opacity:1;transform:none}}
@keyframes logoOut{from{opacity:1}to{opacity:0}}
@keyframes logoBack{from{opacity:0}to{opacity:1}}
@keyframes counterIn{from{opacity:0;transform:translateX(-18px)}to{opacity:1;transform:none}}
@keyframes flash{0%{opacity:0}10%{opacity:1}100%{opacity:0}}
@keyframes shake{0%{transform:translate(0,0)}20%{transform:translate(-5px,3px)}40%{transform:translate(5px,-3px)}60%{transform:translate(-3px,2px)}80%{transform:translate(2px,-1px)}100%{transform:translate(0,0)}}
@keyframes heroIn{0%{transform:scale(1.12)}55%{transform:translate(-40px,14px) scale(3.4)}100%{transform:translate(-60px,14px) scale(2.75)}}
@keyframes unitOut{0%{transform:translate(0,0) scale(1);opacity:1}30%{opacity:0}55%{transform:translate(430px,60px) scale(1.4);opacity:0}100%{transform:translate(430px,60px) scale(1.4);opacity:1}}
@keyframes cOut{to{transform:translate(var(--dx),var(--dy));opacity:0}}
@keyframes dim{from{opacity:1}to{opacity:.12}}
@keyframes dimOff{from{opacity:.12}to{opacity:0}}
@keyframes tagIn{from{opacity:0;transform:translateY(22px) scale(.96)}to{opacity:1;transform:translateY(0) scale(1)}}
@keyframes tagOut{from{opacity:1;transform:translateY(0) scale(1)}to{opacity:0;transform:translateY(-26px) scale(1.02)}}
@keyframes stripIn{from{opacity:1;clip-path:inset(124px 0 124px 0)}to{opacity:1;clip-path:inset(94px 0 94px 0)}}
@keyframes stripFull{from{opacity:1;clip-path:inset(94px 0 94px 0)}to{opacity:1;clip-path:inset(0 0 0 0)}}
@keyframes slideIn{to{opacity:1;transform:translateX(0)}}
@keyframes ctaIn{to{opacity:1;transform:scale(1)}}
@keyframes ghostIn{to{opacity:1}}
@keyframes pulse{0%{opacity:.8;transform:scale(1)}100%{opacity:0;transform:scale(1.22)}}
@keyframes shine{0%{left:-60px;opacity:0}20%{opacity:1}100%{left:120%;opacity:0}}

@media (prefers-reduced-motion:reduce){
  .stage *,.bg *,.strip{animation-duration:.01s !important;animation-delay:0s !important}
}
</style>
</head>
<body>
<div id="ad" class="ad" role="link" tabindex="0" aria-label="Superonline – Online’a Özel 1000 Mbps Fiber İnternet. İmleci sağa kaydırarak hızlandır, Hemen Başvur.">
  <div class="bg"></div>
  <div class="bgAlt"></div>
  <div class="streaks" id="streaks"></div>
  <div class="strip"></div>

  <div class="stage">
    <!-- LOGO: CONFIG.logoWhite (lacivert zemin) / CONFIG.logoColor (beyaz final), base64. Yedek: tipografik wordmark -->
    <div class="logo" id="logo">
      <img class="logoImg logoW" id="logoW" alt="Superonline" decoding="async">
      <img class="logoImg logoC" id="logoC" alt="" decoding="async">
      <span class="logoFallback" aria-hidden="true">superonline</span>
    </div>

    <div class="ghostNum" aria-hidden="true">1000</div>

    <div class="counter" id="counter" aria-hidden="true">
      <div class="digitsWrap">
        <div class="digits" id="digits">
          <span class="ghost g2" id="g2">100</span>
          <span class="ghost g1" id="g1">100</span>
          <span class="num" id="num">100</span>

var W = 970, H = 250;
var streaksEl = document.getElementById('streaks'), streaks = [];
function rnd(a, b){ return a + Math.random() * (b - a); }
(function makeStreaks(){
  for (var i = 0; i < 20; i++) {
    var el = document.createElement('div');
    var beam = i % 7 === 0, dark = i % 3 === 0;
    el.className = 'streak' + (beam ? ' beam' : (dark ? ' k' : ''));
    var w = beam ? rnd(300, 520) : rnd(70, 240);
    el.style.width = w + 'px';
    if (!beam) el.style.height = (i % 4 === 0 ? 2.5 : 1.5) + 'px';
    streaksEl.appendChild(el);
    streaks.push({ el: el, w: w, x: rnd(-w, W), y: rnd(6, H - 8), sp: beam ? rnd(.35, .6) : rnd(.65, 1.45), a: beam ? rnd(.5, .8) : rnd(.45, 1) });
  }
})();
function updateStreaks(v, dt){
  var speed = 220 + 1500 * v, stretch = 1 + 2.4 * v, alpha = Math.min(1, .05 + 1.1 * v);
  for (var i = 0; i < streaks.length; i++) {
    var s = streaks[i];
    s.x += speed * s.sp * dt;
    if (s.x > W + 10) { s.x = -s.w * stretch - rnd(0, 500); s.y = rnd(6, H - 8); }
    s.el.style.transform = 'translate3d(' + s.x.toFixed(1) + 'px,' + s.y.toFixed(1) + 'px,0) scaleX(' + stretch.toFixed(3) + ')';
    s.el.style.opacity = (alpha * s.a).toFixed(3);
  }
}

  var jx = jitter ? (Math.random() - .5) * 2 * jitter : 0, jy = jitter ? (Math.random() - .5) * 2 * jitter : 0;
  vf.style.left = (dr.left - ar.left - pad + jx).toFixed(1) + 'px';
  vf.style.top = (dr.top - ar.top - pad + jy).toFixed(1) + 'px';
  vf.style.width = (dr.width + pad * 2).toFixed(1) + 'px';
  vf.style.height = (dr.height + pad * 2).toFixed(1) + 'px';
}

function triggerImpact(now){
  state = 'after'; tImpact = now; sceneIdx = 0;
  val = CONFIG.speedMax; showVal(val); u = 1;
  digits.style.transform = ''; g1.style.opacity = g2.style.opacity = 0; unitWrap.style.transform = '';
  knob.style.transform = 'translateX(' + RW + 'px)'; railFill.style.transform = 'scaleX(1)';
  /* braketler önce banner kenarlarına sıçrar, sonra kırılıp dağılır */
  vf.classList.add('snap');
  vf.style.left = '12px'; vf.style.top = '12px'; vf.style.width = (W - 24) + 'px'; vf.style.height = (H - 24) + 'px';
  hand.style.opacity = 0; hand.classList.remove('down'); glow.classList.remove('on');
  setTimeout(function(){ vf.classList.add('break'); }, 200);
  tickX = W; tickV = TICK_V0;
  ad.classList.add('s3'); ad.classList.add('alt');
}

function resetAll(){
  for (var i = 0; i < ALL.length; i++) ad.classList.remove(ALL[i]);
  vf.classList.remove('snap'); vf.classList.remove('break');
  state = 'live'; u = 0; uTarget = 0; val = CONFIG.speedStart; tempo = 0; pointerOn = false;
  interacted = false; auto = false; tImpact = null; sceneIdx = 0; shown = -1; fading = false; start = null; last = null;
  digits.style.transform = ''; g1.style.opacity = g2.style.opacity = 0; unitWrap.style.transform = '';
  knob.style.transform = 'translateX(0)'; railFill.style.transform = 'scaleX(0)';
  ticker.style.transform = 'translateX(' + W + 'px)';
  wake = 0; demoU = 0; demoOn = false; releaseUntil = 0; lastU = 0; coachKey = ''; setCoach('start');
  hand.style.opacity = 0; hand.classList.remove('down'); glow.classList.remove('on');
  for (var k = 0; k < tickEls.length; k++) tickEls[k].el.classList.remove('pop');
  for (var j = 0; j < streaks.length; j++) streaks[j].el.style.opacity = 0;
  void ad.offsetWidth;
}

function frame(now){
  if (start === null) { start = now; last = now; ad.classList.add('s1'); ticker.style.transform = 'translateX(' + W + 'px)'; if (reduced) triggerImpact(now - (T.final + .3) * 1000); }
  var dt = Math.min(.05, (now - last) / 1000); last = now;
  var t = (now - start) / 1000, v;

  if (state === 'live') {
    if (!interacted && !auto && t >= CONFIG.autoplayAfter) { auto = true; autoT0 = t; autoU0 = u; ad.classList.add('auto'); }
    if (auto) { var q = Math.min(1, (t - autoT0) / CONFIG.autoGlide); uTarget = autoU0 + (1 - autoU0) * q * q * (3 - 2 * q); }
    else if (!pointerOn) { uTarget = Math.max(0, uTarget - CONFIG.release * dt); }
    /* Davet: hayalet el topuzu tutup biraz sağa çeker, bırakır – etkileşime ya da otomatik akışa kadar tekrar eder */
    if (!interacted && !auto && t >= CONFIG.demoStart) {
      var dp = ((t - CONFIG.demoStart) % CONFIG.demoPeriod) / CONFIG.demoLen;
      if (dp <= 1) {
        var wave = dp < .55 ? dp / .55 : 1 - (dp - .55) / .45;         // 0→1→0
        wave = wave * wave * (3 - 2 * wave);
        demoU = CONFIG.demoReach * wave; demoOn = true;
        hand.style.opacity = Math.min(1, dp * 8, (1 - dp) * 6).toFixed(3);
        hand.style.transform = 'translateX(' + (demoU * RW).toFixed(1) + 'px)';
        if (dp > .1 && dp < .8) hand.classList.add('down'); else hand.classList.remove('down');
        uTarget = Math.max(uTarget, demoU);
      } else if (demoOn) { demoOn = false; hand.style.opacity = 0; hand.classList.remove('down'); }
    } else if (auto) {
      hand.style.opacity = 1; hand.classList.add('down'); hand.style.transform = 'translateX(' + (u * RW).toFixed(1) + 'px)';
    } else if (demoOn || hand.style.opacity !== '0') { demoOn = false; hand.style.opacity = 0; hand.classList.remove('down'); }
    u += (uTarget - u) * Math.min(1, CONFIG.follow * dt);
    /* Koçluk metni */
    if (!auto) {
      if (releaseUntil > now && u < lastU + .001) setCoach('release');
      else if (u > .62) setCoach('almost');
      else if (u > .22) setCoach('go');
      else setCoach('start');
    }
    lastU = u;
    wake = Math.max(0, wake - 1.6 * dt);
    var target = uToVal(u);
    val += (target - val) * Math.min(1, CONFIG.follow * dt);
    if (!interacted && !auto) val = Math.max(val, CONFIG.speedStart + 10 * (.5 + .5 * Math.sin(t * 1.4))); // bekleme nefesi
    if (val >= CONFIG.speedMax - 3 || u >= .995) { triggerImpact(now); }
    else {
      tempo = Math.pow(Math.max(0, (val - CONFIG.speedStart) / (CONFIG.speedMax - CONFIG.speedStart)), .85);
      v = Math.max(.05 + .95 * tempo, .05 + .28 * wake);
      showVal(val);
      var sc = 1 + .12 * tempo;
      digits.style.transform = 'scale(' + sc.toFixed(4) + ') skewX(' + (-7 * tempo).toFixed(2) + 'deg)';
      g1.style.transform = 'translateX(' + (-10 * v).toFixed(2) + 'px)'; g1.style.opacity = (.28 * tempo).toFixed(3);
      g2.style.transform = 'translateX(' + (-21 * v).toFixed(2) + 'px)'; g2.style.opacity = (.13 * tempo).toFixed(3);
      knob.style.transform = 'translateX(' + (u * RW).toFixed(1) + 'px)'; railFill.style.transform = 'scaleX(' + u.toFixed(4) + ')';
      for (var i = 0; i < tickEls.length; i++) { var on = val >= tickEls[i].v - .5; if (on !== tickEls[i].on) { tickEls[i].on = on; tickEls[i].el.classList.toggle('on', on); if (on && tickEls[i].v > CONFIG.speedStart) popTick(i); } }
      layoutVF(tempo, sc, tempo > .35 ? (tempo - .35) * 5 : 0);
    }
  }

  if (state === 'after') {
    var te = (now - tImpact) / 1000;
    while (sceneIdx < afterScenes.length && te >= afterScenes[sceneIdx].at) { ad.classList.add(afterScenes[sceneIdx].cls); sceneIdx++; }
    if (te < T.final) v = 1 - .3 * Math.min(1, te);
    else { var k = Math.min(1, (te - T.final) / 1.2); v = .7 * (1 - k) * (1 - k); }
    if (te >= T.ticker && te < T.stripFull + .4) {
      var tt = te - T.ticker, p = Math.min(1, tt / TICK_DUR);
      tickV = TICK_V0 * (1 - p) * (1 - p);
      tickX -= tickV * dt;
      ticker.style.transform = 'translateX(' + tickX.toFixed(1) + 'px)';
    }
    if (te >= T.end) {
      if (CONFIG.loop && loops < CONFIG.maxLoops) {
        if (!fading && te >= T.end + CONFIG.loopHold) { fading = true; ad.classList.add('fadeout'); holdUntil = te + .55; }
        if (fading && te >= holdUntil) { loops++; resetAll(); }
      } else if (v <= .02) {
        for (var s = 0; s < streaks.length; s++) streaks[s].el.style.opacity = 0;
        stopped = true;
      }
    }
  }

  streaksEl.style.transform = 'translate(' + (px * 10).toFixed(1) + 'px,' + (py * 8).toFixed(1) + 'px)';
  updateStreaks(v, dt);
  if (!stopped) requestAnimationFrame(frame);
}
requestAnimationFrame(frame);
})();
</script>
