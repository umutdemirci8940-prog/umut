<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="ad.size" content="width=970,height=250">
<meta name="viewport" content="width=970, initial-scale=1">
<title>Daikin – Serinliği Yüzünde Hisset · 970×250 Masthead</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Sora:wght@600;700;800&family=Manrope:wght@500;600;700;800&display=swap" rel="stylesheet">
<script>
  /* Reklam ağı (Google Ads / DCM) clickTag tanımlarsa o kullanılır; yoksa Daikin Türkiye ana sayfası. */
  var clickTag = window.clickTag || 'https://www.daikin.com.tr/?utm_source=masthead&utm_medium=display&utm_campaign=serinligi-yuzunde-hisset';
</script>
<style>
  :root{
    --daikin:#0097E0;
    --daikin-deep:#0a4a8f;
    --navy:#03163a;
    --ice:#dcf7ff;
    --white:#ffffff;
    --font-head:'Sora','Manrope','Segoe UI',Roboto,Helvetica,Arial,sans-serif;
    --font-body:'Manrope','Segoe UI',Roboto,Helvetica,Arial,sans-serif;
  }
  html,body{margin:0;padding:0;background:#0b1220;}
  body{min-height:100vh;display:grid;place-items:center;}

  /* ---------- Reklam çerçevesi ---------- */
  #ad{
    position:relative;width:970px;height:250px;overflow:hidden;
    font-family:var(--font-body);color:#fff;cursor:pointer;
    user-select:none;-webkit-user-select:none;-webkit-tap-highlight-color:transparent;
    isolation:isolate;outline:none;
  }
  #ad:focus-visible{box-shadow:0 0 0 3px var(--daikin);}
  #ad > *{position:absolute;}

  /* ---------- Arka planlar: sıcak → serin geçişi ---------- */
  .bg{inset:0;}
  .bg-hot{
    z-index:0;
    background:
      radial-gradient(640px 320px at 20% -10%, rgba(255,246,214,.95), rgba(255,205,130,0) 60%),
      radial-gradient(500px 260px at 88% 100%, rgba(255,120,60,.55), rgba(255,120,60,0) 62%),
      linear-gradient(112deg,#ffd6a0 0%,#ffa95d 42%,#ff7a42 100%);
  }
  .bg-cool{
    z-index:1;opacity:0;
    background:
      radial-gradient(560px 300px at 80% 20%, rgba(150,228,255,.55), rgba(0,120,220,0) 62%),
      radial-gradient(700px 360px at 8% 110%, rgba(0,151,224,.55), rgba(0,151,224,0) 62%),
      linear-gradient(110deg,#03163a 0%,#073b78 40%,#0a8fd8 78%,#8fdcff 100%);
    transition:opacity 2.6s ease;
  }
  #ad.is-cool .bg-cool{opacity:1;}

  /* Güneş parlaması (sıcak faz) */
  .sun{
    z-index:1;left:150px;top:-140px;width:360px;height:360px;border-radius:50%;
    background:radial-gradient(circle, rgba(255,255,240,.95) 0%, rgba(255,225,150,.55) 22%, rgba(255,190,90,0) 62%);
    animation:sunPulse 3s ease-in-out infinite;transition:opacity 1.8s ease;
  }
  #ad.is-cool .sun{opacity:0;}
  @keyframes sunPulse{0%,100%{transform:scale(1)}50%{transform:scale(1.08)}}

  /* Sıcak hava titremesi */
  .haze{
    z-index:1;inset:0;opacity:.55;pointer-events:none;
    background:repeating-linear-gradient(180deg, rgba(255,255,255,0) 0 9px, rgba(255,255,255,.16) 9px 11px);
    filter:url(#heat);transition:opacity 1.4s ease;mix-blend-mode:overlay;
  }
  #ad.is-cool .haze{opacity:0;}

  /* ---------- Hava akımı tuvali ---------- */
  #air{z-index:2;left:0;top:0;width:970px;height:250px;pointer-events:none;}

  /* Rüzgâr dalgası flaşı */
  .coldflash{
    z-index:3;inset:0;opacity:0;pointer-events:none;
    background:radial-gradient(circle at 770px 96px, rgba(255,255,255,.55), rgba(190,242,255,.22) 28%, rgba(190,242,255,0) 60%);
  }
  #ad.gusting .coldflash{animation:flash 1.1s ease-out;}
  @keyframes flash{0%{opacity:0}18%{opacity:1}100%{opacity:0}}

  /* ---------- Buz kristalleri / buğu ---------- */
  .frost{z-index:3;left:0;top:0;width:970px;height:250px;pointer-events:none;overflow:visible;}
  .frost path{
    fill:none;stroke:rgba(255,255,255,.58);stroke-width:1.2;stroke-linecap:round;stroke-linejoin:round;
    stroke-dasharray:var(--len,1000);stroke-dashoffset:var(--len,1000);
    transition:stroke-dashoffset 2.4s cubic-bezier(.3,.7,.3,1);
  }
  #ad.show-frost .frost path{stroke-dashoffset:0;}
  .frostglass{
    z-index:3;inset:0;opacity:0;pointer-events:none;
    box-shadow:inset 0 0 70px rgba(255,255,255,.22), inset 0 0 18px rgba(255,255,255,.18);
    transition:opacity 2.4s ease;
  }
  #ad.show-frost .frostglass{opacity:1;}

  /* ---------- Sol metin bloğu ---------- */
  .logo{z-index:6;left:40px;top:22px;width:110px;height:21px;fill:#fff;filter:drop-shadow(0 2px 8px rgba(0,30,80,.35));}

  .hot{z-index:5;left:40px;top:54px;transition:opacity .55s ease, transform .6s ease, filter .55s ease;}
  .bigtemp{
    font:800 96px/1 var(--font-head);letter-spacing:-4px;color:#fff8ea;
    text-shadow:0 12px 34px rgba(190,70,0,.45);transition:color 1.6s ease, text-shadow 1.6s ease;
    display:flex;align-items:flex-start;
  }
  .bigtemp .deg{font-size:44px;line-height:1;margin:10px 0 0 4px;letter-spacing:0;}
  #ad.is-cool .bigtemp{color:var(--ice);text-shadow:0 0 30px rgba(120,220,255,.75), 0 12px 34px rgba(0,60,140,.5);}
  .hotline{margin:8px 0 0 4px;font:700 17px/1.2 var(--font-body);color:#fff;letter-spacing:.2px;position:relative;height:22px;}
  .hotline span{position:absolute;left:0;top:0;white-space:nowrap;transition:opacity .5s ease, transform .5s ease;}
  .hotline .b{opacity:0;transform:translateY(8px);}
  #ad.is-cool .hotline .a{opacity:0;transform:translateY(-8px);}
  #ad.is-cool .hotline .b{opacity:1;transform:none;}
  #ad.hide-hot .hot{opacity:0;transform:translateX(-18px);filter:blur(8px);pointer-events:none;}

  .copy{z-index:6;left:40px;top:62px;width:540px;pointer-events:none;}
  .hl{margin:0;font:800 42px/1.02 var(--font-head);letter-spacing:-1.2px;text-shadow:0 8px 28px rgba(0,40,100,.35);}
  .hl .w{display:inline-block;opacity:0;transform:translate(30px,4px);filter:blur(10px);
    transition:opacity .55s ease, transform .9s cubic-bezier(.2,.9,.2,1), filter .8s ease;transition-delay:calc(var(--i) * .13s);}
  #ad.show-head .hl .w{opacity:1;transform:none;filter:blur(0);}
  .hl .ice{
    background:linear-gradient(100deg,#fff 0%,#c7f2ff 28%,#fff 48%,#9de6ff 66%,#fff 100%);
    background-size:220% 100%;-webkit-background-clip:text;background-clip:text;color:transparent;
    animation:glint 4.5s linear infinite;
  }
  @keyframes glint{0%{background-position:120% 0}100%{background-position:-120% 0}}
  #ad.gusting .hl{animation:shiver .9s ease;}
  @keyframes shiver{
    0%{transform:none;filter:none}
    22%{transform:translate(-1.2px,.4px);filter:brightness(1.25)}
    44%{transform:translate(1px,-.4px)}
    66%{transform:translate(-.6px,.2px);filter:brightness(1.1)}
    100%{transform:none;filter:none}
  }

  .sub{
    margin:10px 0 0 2px;font:600 15px/1.35 var(--font-body);color:#e6f7ff;max-width:520px;white-space:nowrap;
    opacity:0;transform:translateY(10px);transition:opacity .6s ease .05s, transform .8s cubic-bezier(.2,.9,.2,1) .05s;
  }
  #ad.show-sub .sub{opacity:1;transform:none;}

  .cta{
    z-index:6;left:42px;top:190px;height:38px;padding:0 20px 0 22px;border-radius:999px;
    display:inline-flex;align-items:center;gap:10px;background:#fff;color:var(--daikin-deep);
    font:800 14px var(--font-body);letter-spacing:.2px;box-shadow:0 10px 26px rgba(0,40,90,.35);
    opacity:0;transform:translateY(12px);overflow:hidden;
    transition:opacity .6s ease .25s, transform .8s cubic-bezier(.2,.9,.2,1) .25s, background .3s ease, color .3s ease;
  }
  #ad.show-sub .cta{opacity:1;transform:none;}
  .cta::after{
    content:"";position:absolute;top:-40%;left:-60%;width:40%;height:180%;transform:rotate(18deg);
    background:linear-gradient(90deg, rgba(0,151,224,0), rgba(0,151,224,.35), rgba(0,151,224,0));
    animation:sweep 4.2s ease-in-out infinite 2s;
  }
  @keyframes sweep{0%{left:-60%}35%{left:130%}100%{left:130%}}
  .cta .arr{width:16px;height:16px;transition:transform .35s ease;}
  #ad:hover .cta{background:var(--daikin);color:#fff;box-shadow:0 10px 30px rgba(0,151,224,.55);}
  #ad:hover .cta .arr{transform:translateX(4px);}
  #ad:hover .cta::after{background:linear-gradient(90deg, rgba(255,255,255,0), rgba(255,255,255,.45), rgba(255,255,255,0));}

  /* ---------- Klima ünitesi ---------- */
  .unit{z-index:4;left:610px;top:22px;width:320px;height:90px;pointer-events:none;
    filter:drop-shadow(0 18px 22px rgba(0,20,60,.35)) drop-shadow(0 2px 4px rgba(0,20,60,.25));
    transform:translateY(-8px);opacity:0;transition:transform 1.1s cubic-bezier(.2,.9,.2,1), opacity .9s ease;}
  #ad.unit-in .unit{transform:none;opacity:1;}
  .flap{
    z-index:4;left:628px;top:84px;width:284px;height:13px;border-radius:0 0 6px 6px;pointer-events:none;
    background:linear-gradient(180deg,#f6f9fb 0%,#dde5ec 55%,#b9c5d0 100%);
    box-shadow:0 3px 6px rgba(0,20,60,.25);
    transform-origin:50% 0;transform:perspective(600px) rotateX(0deg);
    transition:transform .6s cubic-bezier(.2,.8,.2,1), opacity .9s ease;opacity:0;
  }
  #ad.unit-in .flap{opacity:1;}
  .led{
    z-index:5;left:900px;top:64px;width:6px;height:6px;border-radius:50%;background:#42506a;pointer-events:none;
    transition:background .4s ease, box-shadow .4s ease;
  }
  #ad.is-on .led{background:#5cf0ff;box-shadow:0 0 6px #5cf0ff, 0 0 14px rgba(92,240,255,.8);animation:ledPulse 2.2s ease-in-out infinite;}
  @keyframes ledPulse{0%,100%{opacity:1}50%{opacity:.6}}
  .disp{
    z-index:5;left:822px;top:52px;width:66px;height:26px;border-radius:6px;pointer-events:none;
    background:linear-gradient(180deg,#0d1b2b,#182a3f);box-shadow:inset 0 0 0 1px rgba(255,255,255,.08), inset 0 -6px 12px rgba(0,0,0,.35);
    display:flex;align-items:center;justify-content:center;gap:5px;color:#3a4d63;font:800 15px/1 var(--font-head);
    transition:color .4s ease, text-shadow .4s ease;
  }
  #ad.is-on .disp{color:#7ff0ff;text-shadow:0 0 8px rgba(127,240,255,.9);}
  .disp .num{min-width:22px;text-align:right;letter-spacing:-.5px;}
  .disp .unitc{font-size:9px;opacity:.85;margin-top:-6px;}
  .disp .mode{font:800 7.5px/1 var(--font-body);letter-spacing:.8px;color:#9fefff;opacity:0;transition:opacity .4s ease;padding:2px 4px;border-radius:3px;border:1px solid rgba(159,239,255,.45);}
  #ad.is-on .disp .mode{opacity:.9;}
  #ad.turbo .disp .mode{background:#7ff0ff;color:#082033;border-color:#7ff0ff;animation:modeBlink 1.2s ease-in-out infinite;}
  @keyframes modeBlink{0%,100%{opacity:1}50%{opacity:.55}}
  .fanbars{z-index:5;left:918px;top:37px;width:6px;height:18px;pointer-events:none;display:flex;flex-direction:column-reverse;gap:2px;}
  .fanbars i{display:block;height:3px;border-radius:1px;background:#3a4d63;transition:background .3s ease, box-shadow .3s ease;}
  #ad.is-on .fanbars i:nth-child(-n+2){background:#7ff0ff;box-shadow:0 0 4px rgba(127,240,255,.9);}
  #ad.turbo .fanbars i{background:#7ff0ff;box-shadow:0 0 4px rgba(127,240,255,.9);}
  #ad.turbo .fanbars i:nth-child(4){animation:barPulse .5s ease-in-out infinite;}
  @keyframes barPulse{0%,100%{opacity:1}50%{opacity:.35}}

  /* ---------- İpucu, çipler, hale ---------- */
  .hint{
    z-index:6;left:640px;top:124px;height:26px;padding:0 12px 0 10px;border-radius:999px;pointer-events:none;
    display:inline-flex;align-items:center;gap:7px;background:rgba(3,22,58,.55);border:1px solid rgba(255,255,255,.35);
    color:#fff;font:700 11.5px var(--font-body);letter-spacing:.2px;backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px);
    opacity:0;transform:translateY(6px);transition:opacity .5s ease, transform .6s ease;
  }
  #ad.show-hint .hint{opacity:1;transform:none;}
  .hint svg{width:14px;height:14px;animation:cursorNudge 1.6s ease-in-out infinite;}
  @keyframes cursorNudge{0%,100%{transform:translate(0,0)}50%{transform:translate(-4px,3px)}}

  .chips{z-index:6;right:26px;top:202px;display:flex;gap:8px;pointer-events:none;}
  .chip{
    height:26px;padding:0 11px 0 9px;border-radius:999px;display:inline-flex;align-items:center;gap:6px;
    background:rgba(255,255,255,.13);border:1px solid rgba(255,255,255,.38);color:#fff;
    font:700 11.5px var(--font-body);letter-spacing:.1px;white-space:nowrap;backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px);
    opacity:0;transform:translateY(10px);transition:opacity .6s ease, transform .8s cubic-bezier(.2,.9,.2,1);
    transition-delay:calc(var(--i) * .12s);
  }
  .chip svg{width:13px;height:13px;fill:none;stroke:#bff1ff;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;}
  #ad.show-chips .chip{opacity:1;transform:none;}

  .halo{
    z-index:7;left:0;top:0;width:150px;height:150px;border-radius:50%;pointer-events:none;opacity:0;
    background:radial-gradient(circle, rgba(255,255,255,.55) 0%, rgba(190,242,255,.28) 32%, rgba(0,151,224,0) 68%);
    mix-blend-mode:screen;will-change:transform,opacity;
  }

  /* ---------- Azaltılmış hareket ---------- */
  @media (prefers-reduced-motion: reduce){
    .sun,.cta::after,.hl .ice,.hint svg,.led,.disp .mode,.fanbars i{animation:none !important;}
    #ad.gusting .hl,#ad.gusting .coldflash{animation:none !important;}
    .hl .w,.sub,.cta,.chip,.unit,.flap,.frost path,.frostglass,.bg-cool{transition:none !important;}
  }
</style>
</head>
<body>

<svg width="0" height="0" style="position:absolute" aria-hidden="true">
  <defs>
    <!-- DAIKIN logotipi (vektör) -->
    <symbol id="daikin-logo" viewBox="0 0 522 100">
      <path fill-rule="evenodd" d="M0 0H50C80 0 102 22 102 50C102 78 80 100 50 100H0ZM24 22V78H48C64 78 78 66 78 50C78 34 64 22 48 22Z"/>
      <path fill-rule="evenodd" transform="translate(116 0)" d="M0 100L38 0H70L108 100H82L74 79H34L26 100ZM41 59H67L54 25Z"/>
      <path transform="translate(238 0)" d="M0 0H24V100H0Z"/>
      <path transform="translate(276 0)" d="M0 0H24V39L62 0H95L54 43L98 100H66L38 62L24 76V100H0Z"/>
      <path transform="translate(388 0)" d="M0 0H24V100H0Z"/>
      <path transform="translate(426 0)" d="M0 0H26L72 62V0H96V100H70L24 38V100H0Z"/>
    </symbol>
    <!-- Sıcak hava titremesi filtresi -->
    <filter id="heat" x="-5%" y="-5%" width="110%" height="110%">
      <feTurbulence type="fractalNoise" baseFrequency="0.012 0.045" numOctaves="2" seed="7" result="n">
        <animate attributeName="baseFrequency" values="0.012 0.045;0.016 0.06;0.012 0.045" dur="3.5s" repeatCount="indefinite"/>
      </feTurbulence>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="14" xChannelSelector="R" yChannelSelector="G"/>
    </filter>
  </defs>
</svg>

<div id="ad" role="link" tabindex="0" aria-label="Daikin – Serinliği yüzünde hisset. Klimaları keşfet">
  <div class="bg bg-hot"></div>
  <div class="bg bg-cool"></div>
  <div class="sun"></div>
  <div class="haze"></div>

  <canvas id="air" width="970" height="250" aria-hidden="true"></canvas>
  <div class="coldflash"></div>

  <svg class="frost" id="frost" viewBox="0 0 970 250" aria-hidden="true"></svg>
  <div class="frostglass"></div>

  <!-- Logo -->
  <svg class="logo" viewBox="0 0 522 100" role="img" aria-label="Daikin"><use href="#daikin-logo"/></svg>

  <!-- Sıcak faz metni -->
  <div class="hot" aria-hidden="true">
    <div class="bigtemp"><span id="bigNum">34</span><span class="deg">°</span></div>
    <div class="hotline"><span class="a">Sıcak bunaltıyor mu?</span><span class="b">Daikin devrede.</span></div>
  </div>

  <!-- Ana metin -->
  <div class="copy">
    <h1 class="hl">
      <span class="w" style="--i:0">Serinliği</span><br>
      <span class="w ice" style="--i:1">yüzünde</span>
      <span class="w" style="--i:2">hisset.</span>
    </h1>
    <p class="sub">Her an tam istediğiniz hava: sessiz, ferah, enerji verimli.</p>
  </div>
  <div class="cta"><span>Klimaları Keşfet</span>
    <svg class="arr" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M2 8h11M9 3.5 13.5 8 9 12.5"/></svg>
  </div>

  <!-- Klima ünitesi (duvar tipi) -->
  <svg class="unit" viewBox="0 0 320 90" aria-hidden="true">
    <defs>
      <linearGradient id="body" x1="0" y1="0" x2="0" y2="1">
        <stop offset="0" stop-color="#ffffff"/><stop offset=".55" stop-color="#f3f6f9"/><stop offset="1" stop-color="#dfe6ed"/>
      </linearGradient>
      <linearGradient id="panel" x1="0" y1="0" x2="1" y2="0">
        <stop offset="0" stop-color="#ffffff" stop-opacity=".9"/><stop offset=".5" stop-color="#ffffff" stop-opacity=".2"/><stop offset="1" stop-color="#ffffff" stop-opacity=".9"/>
      </linearGradient>
      <linearGradient id="slot" x1="0" y1="0" x2="0" y2="1">
        <stop offset="0" stop-color="#0c1826"/><stop offset="1" stop-color="#26364a"/>
      </linearGradient>
    </defs>
    <rect x="1" y="1" width="318" height="72" rx="15" fill="url(#body)"/>
    <rect x="1.5" y="1.5" width="317" height="71" rx="14.5" fill="none" stroke="rgba(255,255,255,.9)" stroke-width="1"/>
    <path d="M18 9H302" stroke="url(#panel)" stroke-width="1.2" stroke-linecap="round"/>
    <path d="M10 56.5H310" stroke="#c9d3dd" stroke-width="1"/>
    <path d="M10 58H310" stroke="#ffffff" stroke-width="1" opacity=".8"/>
    <!-- hava çıkış yuvası -->
    <rect x="18" y="60" width="284" height="8" rx="2" fill="url(#slot)"/>
    <!-- ünite üzerindeki marka -->
    <use href="#daikin-logo" x="24" y="30" width="48" height="9.2" fill="#93a1b0"/>
    <!-- ısı alış ızgarası (üst) -->
    <g stroke="#d6dee6" stroke-width="1">
      <path d="M30 18H160M30 22H160M30 26H160"/>
    </g>
  </svg>
  <div class="flap" id="flap"></div>
  <div class="disp"><span class="num" id="dispNum">--</span><span class="unitc">°C</span><span class="mode" id="dispMode">COOL</span></div>
  <div class="fanbars"><i></i><i></i><i></i><i></i></div>
  <div class="led"></div>

  <!-- Etkileşim ipucu -->
  <div class="hint" id="hint">
    <svg viewBox="0 0 16 16" fill="#fff"><path d="M3 1.5 13 8l-4.2 1 2.4 4.2-1.8 1L7 10 3.6 13z"/></svg>
    Fareni gezdir, serinliği yüzünde hisset
  </div>

  <!-- Özellik çipleri -->
  <div class="chips">
    <div class="chip" style="--i:0"><svg viewBox="0 0 24 24"><path d="M4 9v6h4l5 4V5L8 9H4z"/><path d="M16 9a4 4 0 0 1 0 6"/></svg>Sessiz çalışma</div>
    <div class="chip" style="--i:1"><svg viewBox="0 0 24 24"><path d="M5 21c0-8 4-13 14-16-1 10-6 14-14 16z"/><path d="M5 21c3-5 7-9 11-12"/></svg>Enerji verimli</div>
    <div class="chip" style="--i:2"><svg viewBox="0 0 24 24"><path d="M2 9a16 16 0 0 1 20 0M5.5 12.5a11 11 0 0 1 13 0M9 16a5.5 5.5 0 0 1 6 0"/><circle cx="12" cy="19.5" r="1" fill="#bff1ff"/></svg>Akıllı kontrol</div>
  </div>

  <div class="halo" id="halo"></div>
</div>

<script>
(function(){
  'use strict';
  var AD = document.getElementById('ad');
  var W = 970, H = 250;
  var REDUCE = !!(window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches);
  var $ = function(s){ return AD.querySelector(s); };
  var canvas = $('#air'), ctx = canvas.getContext('2d');
  var flap = $('#flap'), bigNum = $('#bigNum'), dispNum = $('#dispNum'), dispMode = $('#dispMode'), halo = $('#halo');

  /* ---------- Tuval ölçeği ---------- */
  var dpr = 1;
  function fit(){
    dpr = Math.min(2, window.devicePixelRatio || 1);
    canvas.width = W * dpr; canvas.height = H * dpr;
    canvas.style.width = W + 'px'; canvas.style.height = H + 'px';
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  }
  fit(); window.addEventListener('resize', fit);

  /* ---------- Buz kristali (dendrit) üretimi ---------- */
  function fernPath(L, n){
    var d = 'M0 0L' + L + ' 0', a = 58 * Math.PI / 180;
    for (var i = 1; i <= n; i++){
      var t = i / (n + 1), x = L * t, bl = L * 0.42 * (1 - t) + 6;
      for (var s = -1; s <= 1; s += 2){
        var ex = x + Math.cos(a) * bl, ey = s * Math.sin(a) * bl;
        d += 'M' + x.toFixed(1) + ' 0L' + ex.toFixed(1) + ' ' + ey.toFixed(1);
        var us = [0.4, 0.72];
        for (var k = 0; k < us.length; k++){
          var u = us[k], sx = x + Math.cos(a) * bl * u, sy = s * Math.sin(a) * bl * u, sl = bl * 0.34 * (1.15 - u);
          d += 'M' + sx.toFixed(1) + ' ' + sy.toFixed(1) + 'L' + (sx + sl).toFixed(1) + ' ' + sy.toFixed(1);
        }
      }
    }
    return d;
  }
  (function buildFrost(){
    var svg = $('#frost'), NS = 'http://www.w3.org/2000/svg';
    var ferns = [
      ['translate(-4 254) rotate(-42)', 200, 7],
      ['translate(-6 210) rotate(-10)', 120, 5],
      ['translate(34 256) rotate(-78)', 105, 4],
      ['translate(974 -6) rotate(138)', 130, 5],
      ['translate(976 256) rotate(-135)', 150, 6],
      ['translate(978 232) rotate(180)', 100, 4]
    ];
    ferns.forEach(function(f){
      var p = document.createElementNS(NS, 'path');
      p.setAttribute('d', fernPath(f[1], f[2]));
      p.setAttribute('transform', f[0]);
      svg.appendChild(p);
      var len = 1000; try { len = Math.ceil(p.getTotalLength()); } catch(e){}
      p.style.setProperty('--len', len);
    });
  })();

  /* ---------- Durum ---------- */
  var S = {
    on:false, power:0, turbo:0, turboGoal:0, gust:0, waveR:-1,
    target:{x:380, y:200}, goal:{x:380, y:200}, pointer:null,
    pulse:0, lastRing:0, lastPuff:0, hintDone:false, halo:{x:485, y:125}, flapDeg:-1, t0:performance.now()
  };
  var VENT = { x1:640, x2:900, y:96, cx:770 };
  var streaks = [], mists = [], stars = [], rings = [];
  var MAX_STREAK = 230, MAX_MIST = 90, MAX_STAR = 60;

  /* ---------- Sprite'lar ---------- */
  function sprite(size, draw){ var c = document.createElement('canvas'); c.width = c.height = size; draw(c.getContext('2d'), size); return c; }
  var MIST = sprite(128, function(g, s){
    var r = s / 2, gr = g.createRadialGradient(r, r, 0, r, r, r);
    gr.addColorStop(0, 'rgba(255,255,255,.95)'); gr.addColorStop(.3, 'rgba(228,247,255,.5)'); gr.addColorStop(1, 'rgba(200,240,255,0)');
    g.fillStyle = gr; g.fillRect(0, 0, s, s);
  });
  var STAR = sprite(48, function(g, s){
    var c = s / 2, gr = g.createRadialGradient(c, c, 0, c, c, c);
    gr.addColorStop(0, 'rgba(255,255,255,1)'); gr.addColorStop(.22, 'rgba(255,255,255,.45)'); gr.addColorStop(1, 'rgba(255,255,255,0)');
    g.fillStyle = gr; g.fillRect(0, 0, s, s);
    g.strokeStyle = 'rgba(255,255,255,.95)'; g.lineWidth = 1.6; g.lineCap = 'round';
    g.beginPath(); g.moveTo(c, 3); g.lineTo(c, s - 3); g.moveTo(3, c); g.lineTo(s - 3, c); g.stroke();
  });

  /* ---------- Parçacık üreticileri ---------- */
  function rnd(a, b){ return a + Math.random() * (b - a); }
  function spawnStreak(){
    var x = rnd(VENT.x1, VENT.x2), y = VENT.y + rnd(0, 4);
    var ang = Math.PI / 2 + rnd(-0.35, 0.55), sp = rnd(1.5, 3.1);
    var blue = Math.random() < 0.3;
    streaks.push({ x:x, y:y, vx:Math.cos(ang) * sp, vy:Math.sin(ang) * sp, sp:sp, age:0, life:rnd(110, 170),
      w:rnd(0.8, 1.9), wf:rnd(0.05, 0.11), wa:rnd(0.2, 0.7), ph:rnd(0, 6.28), h:[], c: blue ? '120,205,255' : '224,247,255', steer:rnd(0.028, 0.05) });
  }
  function spawnMist(x, y, big){
    mists.push({ x:x, y:y, r: big ? rnd(14, 20) : rnd(8, 16), gr: big ? rnd(1.1, 1.6) : rnd(0.5, 0.9), vx:rnd(-0.8, 0.2), vy:rnd(0.4, 1.2),
      age:0, life: big ? rnd(30, 42) : rnd(90, 140), a: big ? rnd(0.08, 0.12) : rnd(0.12, 0.2), steer: big ? 0 : rnd(0.008, 0.016) });
  }
  function spawnStar(x, y, s){
    stars.push({ x:x, y:y, vx:rnd(-0.7, 0.7), vy:rnd(-0.9, 0.5), age:0, life:rnd(26, 52), s:s || rnd(0.35, 0.8), rot:rnd(0, 6.28), rs:rnd(-0.06, 0.06) });
  }
  function spawnRing(x, y){ rings.push({ x:x, y:y, r:6, age:0, life:38 }); }

  /* ---------- Hedef (imleç ya da otomatik salınım) ---------- */
  function autoGoal(t){ return { x: 330 + 175 * Math.sin(t * 0.42), y: 152 + 58 * Math.sin(t * 0.69 + 1.3) }; }

  function setFlap(){
    var ang = Math.atan2(S.target.y - VENT.y, S.target.x - VENT.cx);
    var k = Math.max(0, Math.min(1, (ang - Math.PI / 2) / (Math.PI / 2)));
    var deg = S.on ? (64 - 36 * k) : 0;
    if (Math.abs(deg - S.flapDeg) > 0.4){
      S.flapDeg = deg;
      flap.style.transform = 'perspective(600px) rotateX(' + (-deg) + 'deg)';
    }
  }

  /* ---------- Ana döngü ---------- */
  var last = performance.now();
  function frame(now){
    var dt = Math.min(2.2, (now - last) / 16.667); last = now;
    var t = (now - S.t0) / 1000;

    // hedef
    if (S.pointer){ S.goal.x = S.pointer.x; S.goal.y = Math.max(VENT.y + 34, S.pointer.y); }
    else { var g = autoGoal(t); S.goal.x = g.x; S.goal.y = g.y; }
    S.target.x += (S.goal.x - S.target.x) * 0.09 * dt;
    S.target.y += (S.goal.y - S.target.y) * 0.09 * dt;
    S.turbo += (S.turboGoal - S.turbo) * 0.06 * dt;
    if (S.on) S.power = Math.min(1, S.power + 0.011 * dt);
    S.gust = Math.max(0, S.gust - 0.012 * dt);
    S.pulse = Math.max(0, S.pulse - 0.05 * dt);
    setFlap();

    // hale
    var hx = S.pointer ? S.pointer.x : S.target.x, hy = S.pointer ? S.pointer.y : S.target.y;
    S.halo.x += (hx - S.halo.x) * 0.2 * dt; S.halo.y += (hy - S.halo.y) * 0.2 * dt;
    halo.style.opacity = (S.turbo * 0.95).toFixed(3);
    halo.style.transform = 'translate(' + (S.halo.x - 75).toFixed(1) + 'px,' + (S.halo.y - 75).toFixed(1) + 'px) scale(' + (0.85 + 0.3 * S.pulse + 0.05 * Math.sin(t * 5)).toFixed(3) + ')';

    // üretim
    var boost = 1 + 1.3 * S.turbo + 1.6 * S.gust;
    var rate = 2.1 * S.power * boost * dt;
    for (var n = rate; n > 0; n--) if (Math.random() < Math.min(1, n) && streaks.length < MAX_STREAK) spawnStreak();
    if (S.power > 0.2 && Math.random() < 0.38 * S.power * boost * dt && mists.length < MAX_MIST) spawnMist(rnd(VENT.x1, VENT.x2), VENT.y + 6, false);
    if (S.power > 0.5 && Math.random() < 0.06 * boost * dt && stars.length < MAX_STAR) spawnStar(rnd(VENT.x1 - 40, VENT.x2), rnd(VENT.y + 10, 200));

    ctx.clearRect(0, 0, W, H);

    // soğuk dalga (esinti)
    if (S.waveR >= 0){
      S.waveR += 10 * dt;
      var wa = 0.22 * (1 - S.waveR / 1000);
      if (wa <= 0){ S.waveR = -1; }
      else {
        ctx.save(); ctx.globalCompositeOperation = 'lighter';
        ctx.strokeStyle = 'rgba(225,248,255,' + wa.toFixed(3) + ')'; ctx.lineWidth = 70;
        ctx.beginPath(); ctx.arc(VENT.cx, VENT.y, S.waveR, 0, Math.PI * 2); ctx.stroke();
        ctx.strokeStyle = 'rgba(255,255,255,' + (wa * 0.7).toFixed(3) + ')'; ctx.lineWidth = 16;
        ctx.beginPath(); ctx.arc(VENT.cx, VENT.y, S.waveR * 0.82 + 10, 0, Math.PI * 2); ctx.stroke();
        ctx.restore();
      }
    }

    // buğu
    ctx.save(); ctx.globalCompositeOperation = 'lighter';
    for (var i = mists.length - 1; i >= 0; i--){
      var m = mists[i]; m.age += dt;
      if (m.age >= m.life){ mists.splice(i, 1); continue; }
      if (m.steer){
        var dx = S.target.x - m.x, dy = S.target.y - m.y, d = Math.hypot(dx, dy) || 1, ms = 1.4 * (1 + 0.6 * S.turbo + 0.8 * S.gust);
        m.vx += (dx / d * ms - m.vx) * m.steer * dt; m.vy += (dy / d * ms - m.vy) * m.steer * dt;
      }
      m.x += m.vx * dt; m.y += m.vy * dt; m.r += m.gr * dt;
      var p = m.age / m.life, al = m.a * Math.sin(Math.PI * p) * (m.steer ? S.power : 1);
      ctx.globalAlpha = al;
      ctx.drawImage(MIST, m.x - m.r, m.y - m.r, m.r * 2, m.r * 2);
    }
    ctx.restore();

    // hava çizgileri
    ctx.lineCap = 'round'; ctx.lineJoin = 'round';
    var speedK = 1 + 0.65 * S.turbo + 0.9 * S.gust;
    for (i = streaks.length - 1; i >= 0; i--){
      var s = streaks[i]; s.age += dt;
      var tdx = S.target.x - s.x, tdy = S.target.y - s.y, td = Math.hypot(tdx, tdy) || 1;
      var want = s.sp * speedK;
      var st = s.steer * (1 + 0.8 * S.turbo) * dt;
      s.vx += (tdx / td * want - s.vx) * st; s.vy += (tdy / td * want - s.vy) * st;
      var vm = Math.hypot(s.vx, s.vy) || 1, px = -s.vy / vm, py = s.vx / vm;
      var wob = Math.sin(now * 0.001 * s.wf * 60 + s.ph) * s.wa;
      s.x += (s.vx + px * wob) * dt; s.y += (s.vy + py * wob) * dt;
      s.h.push(s.x, s.y); if (s.h.length > 20) s.h.splice(0, 2);
      var hit = td < 16;
      if (hit || s.age > s.life || s.x < -30 || s.x > W + 30 || s.y > H + 30 || s.y < -30){
        if (hit){
          S.pulse = Math.min(1, S.pulse + 0.35);
          if (now - S.lastRing > 240){ S.lastRing = now; spawnRing(S.target.x, S.target.y); for (var q = 0; q < 3; q++) spawnStar(S.target.x + rnd(-14, 14), S.target.y + rnd(-14, 14)); }
          if (now - S.lastPuff > 260 && mists.length < MAX_MIST){ S.lastPuff = now; spawnMist(S.target.x + rnd(-10, 10), S.target.y + rnd(-6, 6), true); }
        }
        streaks.splice(i, 1); continue;
      }
      var fade = Math.min(1, s.age / 9) * Math.min(1, (s.life - s.age) / 22) * Math.min(1, (td - 16) / 40 + 0.15) * S.power;
      var L = s.h.length / 2;
      for (var j = 1; j < L; j++){
        var f = j / L;
        ctx.strokeStyle = 'rgba(' + s.c + ',' + (fade * f * 0.85).toFixed(3) + ')';
        ctx.lineWidth = s.w * (0.35 + f * 1.1);
        ctx.beginPath(); ctx.moveTo(s.h[(j - 1) * 2], s.h[(j - 1) * 2 + 1]); ctx.lineTo(s.h[j * 2], s.h[j * 2 + 1]); ctx.stroke();
      }
    }

    // halkalar ("yüze çarpma")
    for (i = rings.length - 1; i >= 0; i--){
      var r = rings[i]; r.age += dt;
      if (r.age >= r.life){ rings.splice(i, 1); continue; }
      var rp = r.age / r.life;
      ctx.strokeStyle = 'rgba(230,250,255,' + (0.55 * (1 - rp)).toFixed(3) + ')';
      ctx.lineWidth = 2.2 * (1 - rp) + 0.4;
      ctx.beginPath(); ctx.arc(r.x, r.y, 6 + 58 * (1 - Math.pow(1 - rp, 3)), 0, Math.PI * 2); ctx.stroke();
    }

    // kıvılcımlar / buz kristalleri
    ctx.save(); ctx.globalCompositeOperation = 'lighter';
    for (i = stars.length - 1; i >= 0; i--){
      var k = stars[i]; k.age += dt;
      if (k.age >= k.life){ stars.splice(i, 1); continue; }
      k.x += k.vx * dt; k.y += k.vy * dt; k.rot += k.rs * dt;
      var kp = k.age / k.life, ka = Math.sin(Math.PI * kp), ks = 48 * k.s * (0.6 + 0.4 * ka);
      ctx.globalAlpha = ka * 0.95;
      ctx.translate(k.x, k.y); ctx.rotate(k.rot);
      ctx.drawImage(STAR, -ks / 2, -ks / 2, ks, ks);
      ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    }
    ctx.restore();

    requestAnimationFrame(frame);
  }

  /* ---------- Zaman çizelgesi ---------- */
  function at(ms, fn){ if (REDUCE) fn(); else setTimeout(fn, ms); }
  function countdown(from, to, dur){
    var t0 = performance.now();
    (function step(){
      var p = Math.min(1, (performance.now() - t0) / dur), e = 1 - Math.pow(1 - p, 3);
      var v = Math.round(from + (to - from) * e);
      bigNum.textContent = v; dispNum.textContent = v;
      if (p < 1) requestAnimationFrame(step);
    })();
  }
  function gust(){
    if (document.hidden || REDUCE) return;
    S.gust = 1; S.waveR = 0;
    AD.classList.remove('gusting'); void AD.offsetWidth; AD.classList.add('gusting');
    setTimeout(function(){ AD.classList.remove('gusting'); }, 1200);
  }

  at(150, function(){ AD.classList.add('unit-in'); });
  at(1300, function(){ S.on = true; AD.classList.add('is-on'); dispNum.textContent = '34'; });
  at(1700, function(){ AD.classList.add('is-cool'); if (REDUCE){ bigNum.textContent = '22'; dispNum.textContent = '22'; } else countdown(34, 22, 2000); });
  at(3600, function(){ AD.classList.add('hide-hot'); });
  at(3900, function(){ AD.classList.add('show-head'); });
  at(4900, function(){ AD.classList.add('show-sub'); });
  at(5300, function(){ AD.classList.add('show-frost'); AD.classList.add('show-chips'); });
  at(6000, function(){ if (!S.hintDone) AD.classList.add('show-hint'); });
  at(10000, function(){ AD.classList.remove('show-hint'); });
  if (!REDUCE){
    setTimeout(function(){ gust(); setInterval(gust, 7000); }, 6800);
    requestAnimationFrame(frame);
  } else {
    S.power = 1; setFlap();
  }

  /* ---------- Etkileşim ---------- */
  function toLocal(e){
    var r = AD.getBoundingClientRect(), k = W / (r.width || W);
    return { x:(e.clientX - r.left) * k, y:(e.clientY - r.top) * k };
  }
  function hideHint(){ S.hintDone = true; AD.classList.remove('show-hint'); }
  var touchTimer = null;
  AD.addEventListener('pointermove', function(e){
    if (e.pointerType === 'touch') return;
    S.pointer = toLocal(e); S.turboGoal = 1; AD.classList.add('turbo'); dispMode.textContent = 'TURBO'; hideHint();
  });
  AD.addEventListener('pointerleave', function(){
    S.pointer = null; S.turboGoal = 0; AD.classList.remove('turbo'); dispMode.textContent = 'COOL';
  });
  AD.addEventListener('pointerdown', function(e){
    if (e.pointerType !== 'touch') return;
    S.pointer = toLocal(e); S.turboGoal = 1; AD.classList.add('turbo'); dispMode.textContent = 'TURBO'; hideHint();
    clearTimeout(touchTimer);
    touchTimer = setTimeout(function(){ S.pointer = null; S.turboGoal = 0; AD.classList.remove('turbo'); dispMode.textContent = 'COOL'; }, 2600);
  }, { passive:true });

  function exit(){
    if (window.Enabler && typeof window.Enabler.exit === 'function'){ window.Enabler.exit('CTA'); return; }
    window.open(clickTag, '_blank');
  }
  AD.addEventListener('click', exit);
  AD.addEventListener('keydown', function(e){ if (e.key === 'Enter' || e.key === ' '){ e.preventDefault(); exit(); } });
})();
</script>
</body>
