  .face.left { border-radius: 8px 0 0 8px; box-shadow: inset -14px 0 24px -14px rgba(83,37,13,.35); }
  .sheen { position: absolute; inset: 0; background: linear-gradient(90deg, rgba(0,0,0,0) 0%, rgba(0,0,0,.18) 100%); opacity: 0; transition: opacity .6s; pointer-events: none; }
  .sheet.turning .sheen { opacity: 1; }

  /* cover */
  .cover { background: #e63d1e; box-shadow: inset 0 0 0 10px #d5351a, inset 0 0 0 11px rgba(255,255,255,.25); }
  .cover:before { content: ""; position: absolute; inset: 0; background: repeating-linear-gradient(135deg, rgba(255,255,255,.04) 0 3px, rgba(0,0,0,0) 3px 8px); }
  .cover .spineBand { position: absolute; left: 0; top: 0; bottom: 0; width: 26px; background: linear-gradient(90deg, #9e2410, #c22f12 60%, #d5351a); }
  .cover .logo { position: absolute; left: 50%; top: 52px; width: 176px; margin-left: -88px; filter: drop-shadow(0 2px 0 rgba(0,0,0,.18)); }
  .cover .t1 { position: absolute; left: 0; right: 0; top: 130px; text-align: center; font: 500 11px/1 "Outfit", sans-serif; letter-spacing: .38em; text-transform: uppercase; color: rgba(255,255,255,.92); }
  .cover .t2 { position: absolute; left: 0; right: 0; top: 154px; text-align: center; font: 300 22px/1 "Outfit", sans-serif; color: #fff; letter-spacing: .02em; }
  .cover .t2 b { font-weight: 800; }
  .cover .bear { position: absolute; right: 26px; bottom: 18px; width: 58px; transform: rotate(8deg); }
  .cover .hintOpen { position: absolute; left: 0; right: 0; bottom: 16px; text-align: center; font: 500 9px/1 "Outfit", sans-serif; letter-spacing: .3em; text-transform: uppercase; color: rgba(255,255,255,.7); animation: pulse 1.6s ease-in-out infinite; }
  @keyframes pulse { 50% { opacity: .35 } }

  /* left page content */
  .lp { position: absolute; inset: 0; padding: 26px 34px 0 40px; }
  .lp .k { font: 500 9px/1 "Outfit", sans-serif; letter-spacing: .36em; text-transform: uppercase; color: var(--brown-2); }
  .lp .k i { display: inline-block; width: 22px; height: 1px; background: var(--brown-2); vertical-align: middle; margin-right: 8px; }
  .lp .hd { margin-top: 10px; width: 122px; }
  .lp .cat { margin-top: 8px; font: 600 14px/1.1 "Outfit", sans-serif; color: var(--brown); }
  .lp .pr { margin-top: 6px; white-space: nowrap; }
  .lp .pr b { font: 800 30px/1 "Outfit", sans-serif; letter-spacing: -1.5px; color: var(--red); }
  .lp .pr span { font: 400 12px/1 "Outfit", sans-serif; color: var(--brown); margin-left: 4px; }
  .lp .cta { position: absolute; right: 34px; bottom: 24px; height: 32px; padding: 0 16px; display: inline-flex; align-items: center; gap: 7px; border-radius: 10px; background: var(--red); color: #fff; font: 700 12px/1 "Outfit", sans-serif; box-shadow: 0 3px 0 var(--red-d), 0 6px 12px rgba(230,61,30,.3); cursor: pointer; transition: transform .12s, box-shadow .12s; white-space: nowrap; }
  .lp .cta:hover { transform: translateY(-2px); box-shadow: 0 5px 0 var(--red-d), 0 8px 14px rgba(230,61,30,.35); }
  .lp .cta:active { transform: translateY(2px); box-shadow: 0 1px 0 var(--red-d); }
  .lp .pg { position: absolute; right: 34px; top: 58px; font: 400 9px/1 "Outfit", sans-serif; letter-spacing: .2em; color: var(--brown-2); }
  .lp .swatch { position: absolute; right: 34px; top: 34px; display: flex; gap: 6px; }
  .lp .swatch i { width: 14px; height: 14px; border-radius: 50%; box-shadow: inset 0 -2px 0 rgba(0,0,0,.15); }

  /* right page: pop-up scene */
  .rp { position: absolute; inset: 0; perspective: 900px; }
  .pop { position: absolute; transform-origin: 50% 100%; transform: rotateX(-88deg); opacity: 0; transition: transform .9s var(--bounce), opacity .3s; }
  .on .pop { transform: rotateX(0); opacity: 1; }
  .rp .kid { left: 250px; bottom: 26px; filter: drop-shadow(0 8px 6px rgba(83,37,13,.25)); }
  .rp .kid img { height: 186px; }
  .rp .ground { position: absolute; left: 40px; right: 40px; bottom: 26px; height: 1px; background: rgba(83,37,13,.18); }
  .rp .ground:after { content: ""; position: absolute; left: 0; right: 0; top: 1px; height: 14px; background: linear-gradient(180deg, rgba(83,37,13,.06), rgba(83,37,13,0)); }
  .rp .blk { position: absolute; width: 34px; height: 34px; }
  .rp .blk svg { position: absolute; left: -6px; top: -8px; width: 46px; height: 46px; overflow: visible; }
  .rp .blk text { font: 700 20px "Fredoka", "Arial Rounded MT Bold", sans-serif; fill: #fff; paint-order: stroke; stroke: rgba(83,37,13,.18); stroke-width: 2px; }
  .rp .tag { left: 112px; bottom: 120px; width: 118px; padding: 7px 10px 8px; border-radius: 9px; background: #fff; box-shadow: 0 8px 18px -6px rgba(83,37,13,.35); transform-origin: 50% 100%; }
  .rp .tag .n { font: 600 9px/1.1 "Outfit", sans-serif; color: var(--brown-2); }
  .rp .tag .p { margin-top: 2px; font: 800 17px/1 "Outfit", sans-serif; color: var(--red); letter-spacing: -.5px; white-space: nowrap; }
  .rp .tag .p small { font-size: 10px; font-weight: 700; margin-left: 1px; }
  .rp .tag .stripe { position: absolute; left: 0; right: 0; bottom: 0; height: 3px; border-radius: 0 0 9px 9px; background: var(--c); }
  .rp .star { position: absolute; }
  .rp .cloud { position: absolute; width: 64px; height: 22px; border-radius: 12px; background: #fff; box-shadow: 0 4px 10px -4px rgba(83,37,13,.25); }
  .rp .cloud:before { content: ""; position: absolute; left: 14px; top: -12px; width: 26px; height: 26px; border-radius: 50%; background: #fff; }
  .rp .cloud:after { content: ""; position: absolute; left: 34px; top: -8px; width: 20px; height: 20px; border-radius: 50%; background: #fff; }
  .rp .next { position: absolute; right: 22px; bottom: 22px; display: flex; align-items: center; gap: 6px; font: 600 9px/1 "Outfit", sans-serif; letter-spacing: .24em; text-transform: uppercase; color: var(--brown-2); }
  .rp .next svg { width: 14px; height: 14px; animation: nudge 1.4s ease-in-out infinite; }
  @keyframes nudge { 50% { transform: translateX(4px) } }
  .rp .curl { position: absolute; right: 0; bottom: 0; width: 34px; height: 34px; background: linear-gradient(225deg, #2b1a11 0 48%, #d9cfc4 50%, #f4efe9 70%); border-radius: 0 0 8px 0; box-shadow: -3px -3px 8px rgba(0,0,0,.15); opacity: .95; }

  /* ---------- HUD ---------- */
  #dots { position: absolute; left: 0; right: 0; bottom: 2px; text-align: center; opacity: 0; transition: opacity .6s; }
  #dots span { display: inline-block; width: 6px; height: 6px; border-radius: 50%; background: rgba(255,255,255,.35); margin: 0 3px; transition: background .3s, transform .3s; }
  #dots span.on { background: #fff; transform: scale(1.3); }
  #bookWrap.open ~ #dots { opacity: 1; }
  .nav { position: absolute; top: 105px; width: 26px; height: 26px; border-radius: 50%; background: rgba(255,255,255,.9); color: var(--brown); display: grid; place-items: center; cursor: pointer; box-shadow: 0 4px 10px rgba(0,0,0,.3); opacity: 0; transition: opacity .5s, transform .15s; z-index: 30; }
  .nav svg { width: 12px; height: 12px; }
  .nav:hover { transform: scale(1.1); }
  #prev { left: 6px; } #next { right: 6px; }
  #bookWrap.open ~ .nav { opacity: 1; }
  #legal { position: absolute; left: 0; right: 0; bottom: 3px; text-align: center; font: 400 6.5px/1.2 "Outfit", sans-serif; color: rgba(255,255,255,.45); pointer-events: none; }
  #fx { position: absolute; left: 0; top: 0; pointer-events: none; z-index: 40; }

  }
  zsort();

  function auto() { if (!idle) return; if (flipped < SPREADS.length) { flip(1); autoT = setTimeout(auto, 4600); } else { autoT = setTimeout(function () { if (idle) { flip(-1); setTimeout(function () { if (idle) flip(-1); }, 1300); autoT = setTimeout(auto, 3200); } }, 4600); } }
  setTimeout(function () { $("bookWrap").classList.add("in"); }, 200);
  setTimeout(function () { if (idle) { flip(1); autoT = setTimeout(auto, 4600); } }, 1700);
})();
</script>
