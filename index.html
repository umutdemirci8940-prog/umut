  #yeni { position: absolute; left: 22px; top: 80px; width: 190px; opacity: 0; transform: translateX(-14px); }
  .in #logo, .in #yeni { opacity: 1; transform: none; transition: opacity .6s ease, transform .6s cubic-bezier(.2,.8,.2,1); }
  .in #yeni { transition-delay: .15s; }

  /* Centre: photo collage */
  #stage {
    position: absolute; left: 244px; top: 8px; width: 306px; height: 214px;
    perspective: 700px;
  }
  #tilt { position: absolute; inset: 0; transition: transform .25s ease-out; transform-style: preserve-3d; }
  .slide {
    position: absolute; inset: 0; display: flex; align-items: center; justify-content: center;
    opacity: 0; transform: rotate(-4deg) translateY(10px) scale(.94);
    transition: opacity .55s ease, transform .7s cubic-bezier(.2,.9,.25,1.15);
    pointer-events: none;
  }
  .slide img { height: 214px; width: auto; max-width: 306px; object-fit: contain; mix-blend-mode: multiply; }
  .slide.on { opacity: 1; transform: none; }
  .slide.out { opacity: 0; transform: rotate(3deg) translateY(-6px) scale(.97); }

  /* Right: offer */
  #panel { position: absolute; left: 578px; top: 0; width: 380px; height: 250px; }
  #chips { position: absolute; left: 0; top: 18px; display: flex; gap: 8px; }
  .chip {
    position: relative; overflow: hidden;
    font: 500 13px/1 "Outfit", sans-serif; color: var(--brown);
    background: rgba(255,255,255,.55); border: 1.5px solid var(--brown);
    border-radius: 999px; padding: 7px 14px 8px; cursor: pointer;
    transition: color .25s, background .25s, transform .2s;
  }
  .chip:hover { transform: translateY(-1px); }
  .chip span { position: relative; z-index: 1; }
  .chip i {
    position: absolute; left: 0; bottom: 0; height: 3px; width: 0; background: rgba(255,255,255,.75); z-index: 0;
  }
  .chip.on { color: #fff; background: var(--brown); }
  .chip.on.run i { animation: fill var(--dur, 4s) linear forwards; }
  @keyframes fill { from { width: 0 } to { width: 100% } }

  #offer { position: absolute; left: 0; top: 64px; }
  #label { font: 400 21px/1.1 "Outfit", sans-serif; letter-spacing: -.2px; }
  #price { font: 700 50px/1 "Outfit", sans-serif; letter-spacing: -1.5px; margin-top: 2px; white-space: nowrap; }
  #sub { font: 400 21px/1.1 "Outfit", sans-serif; margin-top: 2px; }
  #offer.swap #label, #offer.swap #sub { animation: rise .45s cubic-bezier(.2,.8,.2,1); }
  @keyframes rise { from { opacity: 0; transform: translateY(8px) } to { opacity: 1; transform: none } }

  #cta {
    position: absolute; right: 16px; top: 158px;
    font: 700 15px/1 "Outfit", sans-serif; color: #fff; background: var(--red);
    border-radius: 999px; padding: 12px 20px 13px; box-shadow: 0 3px 0 #b62c12;
    transition: transform .15s, box-shadow .15s;
  }
  #cta b { display: inline-block; transition: transform .2s; }
  #cta:hover { transform: translateY(-2px); box-shadow: 0 5px 0 #b62c12; }
  #cta:hover b { transform: translateX(4px); }
  .pulse #cta { animation: pulse 1.6s ease-in-out 2; }
  @keyframes pulse { 50% { transform: scale(1.06); } }

<script>
(function () {
  var SLIDES = [
    { cat: 0, label: "Bebek Takımlar",     price: 399 },
    { cat: 0, label: "Bebek Hırkalar",     price: 399 },
    { cat: 1, label: "Kız Çocuk Pantolon", price: 599 },
    { cat: 2, label: "Erkek Çocuk Gömlek", price: 399 }
  ];
  var DUR = 3800;
  var ad = document.getElementById("ad");
  var slides = document.querySelectorAll(".slide");
  var chips = document.querySelectorAll(".chip");
  var offer = document.getElementById("offer");
  var label = document.getElementById("label");
  var num = document.getElementById("num");
  var bear = document.getElementById("bear");
  var bubble = document.getElementById("bubble");
  var tilt = document.getElementById("tilt");
  var cur = -1, timer = null, paused = false, shown = 0;

  function urlFor(cat) {
    return [window.clickTag1 || window.clickTag, window.clickTag2 || window.clickTag, window.clickTag3 || window.clickTag][cat];
  }

  function countTo(target) {
    var from = parseInt(num.textContent, 10) || 0;
    if (from === target) return;
    var t0 = performance.now(), d = 450;
    (function step(t) {
      var k = Math.min(1, (t - t0) / d), e = 1 - Math.pow(1 - k, 3);
      num.textContent = Math.round(from + (target - from) * e);
      if (k < 1) requestAnimationFrame(step);
    })(t0);
  }

  function show(i) {
    if (i === cur) return;
    var prev = cur;
    cur = i;
    slides.forEach(function (s, n) {
      s.classList.remove("on", "out");
      if (n === i) s.classList.add("on");
      else if (n === prev) s.classList.add("out");
    });
    var s = SLIDES[i];
    chips.forEach(function (c, n) {
      c.classList.toggle("on", n === s.cat);
      c.classList.remove("run");
    });
    if (!paused) restartFill();
    offer.classList.remove("swap"); void offer.offsetWidth; offer.classList.add("swap");
    label.textContent = s.label;
    countTo(s.price);
    shown++;
  }

  function restartFill() {
    var c = chips[SLIDES[cur].cat];
    c.style.setProperty("--dur", DUR + "ms");
    c.classList.remove("run"); void c.offsetWidth; c.classList.add("run");
  }

  function next() { show((cur + 1) % SLIDES.length); }
  function play() { stop(); timer = setInterval(next, DUR); if (cur >= 0) restartFill(); }
  function stop() { clearInterval(timer); timer = null; chips.forEach(function (c) { c.classList.remove("run"); }); }

  // Hover pauses autoplay, leaving resumes it
  ad.addEventListener("mouseenter", function () { paused = true; stop(); });
  ad.addEventListener("mouseleave", function () {
    paused = false; play();
    tilt.style.transform = ""; bubble.classList.remove("show");
  });

  // Subtle 3D tilt on the photo collage
  ad.addEventListener("mousemove", function (e) {
    var r = ad.getBoundingClientRect();
    var x = (e.clientX - r.left) / r.width - .5, y = (e.clientY - r.top) / r.height - .5;
    tilt.style.transform = "rotateY(" + (x * 8) + "deg) rotateX(" + (-y * 6) + "deg)";
  });

  // Category chips switch the collage (no click-out)
  chips.forEach(function (c) {
    function pick(e) {
      e.stopPropagation();
      var cat = +c.dataset.cat;
      if (SLIDES[cur].cat === cat) return;
      for (var n = 0; n < SLIDES.length; n++) if (SLIDES[n].cat === cat) { show(n); break; }
    }
    c.addEventListener("mouseenter", pick);
    c.addEventListener("click", pick);
  });

  // Bear sticker: speech bubble on hover, jumps to the bear set on click
  bear.addEventListener("mouseenter", function () { bubble.classList.add("show"); });
  bear.addEventListener("mouseleave", function () { bubble.classList.remove("show"); });
  bear.addEventListener("click", function (e) {
    e.stopPropagation();
    if (cur !== 0) { show(0); return; }
    window.open(urlFor(0), "_blank");
  });

  // Every other click exits to the collection currently on screen
  ad.addEventListener("click", function () { window.open(urlFor(SLIDES[cur].cat), "_blank"); });

  // Intro
  function start() {
    ad.classList.add("in");
    setTimeout(function () { show(0); if (!paused) play(); }, 250);
    setTimeout(function () { ad.classList.add("pulse"); }, 1800);
    setTimeout(function () { if (!paused) bubble.classList.add("show"); }, 2400);
    setTimeout(function () { if (!paused) bubble.classList.remove("show"); }, 5200);
  }
  if (document.readyState === "complete") start(); else window.addEventListener("load", start);
})();
</script>
</body>
</html>
