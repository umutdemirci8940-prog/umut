  el.logoSweep.style.webkitMaskImage = el.logoSweep.style.maskImage = "url(" + LOGO_SRC + ")";
  el.logo2Sweep.style.webkitMaskImage = el.logo2Sweep.style.maskImage = "url(" + LOGO_SRC + ")";

  var END = 33.5, replayShown = false;

  /* ---------- render ---------- */
  function render(t) {
    var k;

    /* ===== 0–10.6  DARK: opening + brand reveal ===== */
    var darkOn = t < 11.6;
    el.dark.style.visibility = darkOn ? "visible" : "hidden";
    if (darkOn) {
      var push = mix(1.09, 1, seg(t, 0, 7.5, E.out)) * mix(1, 1.22, seg(t, 9.3, 1.5, E.inQ));
      el.cam.style.transform = "scale(" + push + ")";
      el.cam.style.filter = "blur(" + (seg(t, 9.6, 1.2, E.inQ) * 8) + "px)";
      el.darkLight.style.opacity = seg(t, 1.2, 4, E.inOut) * .9 * (1 - seg(t, 9.6, 1, E.inOut));

      k = seg(t, .4, 2.2, E.inOutQ);
      el.line.style.opacity = k * (1 - seg(t, 3.2, 1.6, E.inOut));
      el.line.style.transform = "scaleX(" + mix(.02, 1, k) + ") scaleY(" + mix(1, .6, seg(t, 3.2, 1.6)) + ")";
      el.lineCore.style.opacity = seg(t, .3, .9, E.out) * (1 - seg(t, 2.6, 1.2, E.inOut));
      el.lineCore.style.transform = "scale(" + mix(.4, 2.2, seg(t, .3, 2.6, E.out)) + ")";

      drawParticles(t);

      var lk = seg(t, 5.7, 1.5, E.inOutQ);
      el.logoWrap.style.opacity = lk > 0 ? 1 : 0;
      el.logoMask.style.webkitMaskPosition = el.logoMask.style.maskPosition = (100 - lk * 100) + "% 0";
      var sw = seg(t, 5.9, 1.5, E.inOut);
      el.logoSweep.style.opacity = sw > 0 && sw < 1 ? 1 : 0;
      el.logoSweep.style.backgroundPosition = (150 - sw * 300) + "% 0";
      var breath = 1 + .012 * Math.sin((t - 7) * 1.1);

    /* ===== 9.4–12  light fills the frame and becomes the next world ===== */
    var fk = seg(t, 9.4, 1.4, E.inExpo), fo = 1 - seg(t, 10.9, 1.1, E.inOut);

    /* ===== 10.4–23.8  CREAM: brand experience ===== */
    var creamOn = t > 10.4 && t < 23.8;
    el.cream.style.visibility = creamOn ? "visible" : "hidden";

      el.cream.style.opacity = 1;

      var aIn = seg(t, 10.5, 1.9, E.outQ), aOut = seg(t, 14.0, 1.1, E.inOut);

      // scene B: girl — liquid displacement crossfade

      el.kidB.style.filter = "blur(" + ((1 - seg(t, 14.4, 1.4, E.out)) * 6) + "px)";
      var liq = Math.sin(seg(t, 13.9, 1.7, E.lin) * Math.PI);
      if (liq > 0.001) {
        disp.setAttribute("scale", (liq * 48).toFixed(1));
        turb.setAttribute("baseFrequency", (0.010 + liq * 0.006).toFixed(4) + " " + (0.020 + liq * 0.005).toFixed(4));
        el.kidsFx.style.filter = "url(#liquid)";
      } else el.kidsFx.style.filter = "none";
      // scene C: boy — mask wipe with a light edge
      var wk = seg(t, 18.25, 1.25, E.inOutQ);
      el.kidC.style.opacity = wk > 0 ? 1 : 0;
      el.kidC.style.clipPath = "inset(0 " + ((1 - wk) * 100) + "% 0 0)";
      el.kidC.style.transform = "translateX(" + (-camX * .5) + "px) scale(" + mix(1.1, 1, seg(t, 18.25, 2.6, E.out)) + ")";
      el.kidC.style.filter = "blur(" + ((1 - seg(t, 18.4, 1.6, E.out)) * 5) + "px)";
      el.wipeEdge.style.opacity = wk > 0 && wk < 1 ? .9 : 0;
      el.wipeEdge.style.transform = "translateX(" + (640 + wk * 340) + "px)";

      // copy
      var hdIn = seg(t, 10.9, 1.6, E.outQ);
      el.hd.style.opacity = hdIn;
      el.hd.style.transform = "translateY(" + ((1 - hdIn) * 14) + "px)";
      el.hd.style.filter = "blur(" + ((1 - hdIn) * 6) + "px)";
      el.hd.style.webkitMaskImage = el.hd.style.maskImage = "linear-gradient(180deg,#000 " + (hdIn * 100) + "%,transparent " + (hdIn * 100 + 25) + "%)";
      el.rule.style.width = (seg(t, 11.4, 1.4, E.outQ) * 172) + "px";

      reveal(kickA, t, 11.1, .03, .7);

      merge(kickC, seg(t, 18.7, .9, E.outQ), 34);

    /* ===== 22.6–33.5  HERO + END ===== */

    el.hero.style.visibility = heroOn ? "visible" : "hidden";

      var hl = seg(t, 22.8, 2.2, E.out);
      var shift = seg(t, 27.6, 1.4, E.inOutQ);            // logo slides left to make the end lockup
      el.heroLight.style.transform = "translateX(" + (shift * -150) + "px) scale(" + mix(.08, 1, hl) + ")";
      el.heroLight.style.opacity = .55 + .45 * seg(t, 24.4, 1.5, E.out) * (1 - .3 * seg(t, 27.4, 1.5));
      var r1 = seg(t, 24.6, 2.6, E.outQ);

      var ca = (1 - seg(t, 24.5, 1.5, E.out)) * 2.2;
      if (ca > .05) { caL.setAttribute("dx", (-ca).toFixed(2)); caR.setAttribute("dx", ca.toFixed(2)); el.logo2Wrap.style.filter = "url(#ca) blur(" + ((1 - lo) * 6) + "px)"; }

      var tg = seg(t, 30.2, 1.6, E.outQ);

  }

  /* ---------- clock ---------- */
  var t0 = null;
  function loop(now) {
    if (t0 === null) t0 = now;
    render(Math.min((now - t0) / 1000, END + 60));
    requestAnimationFrame(loop);
  }
  function restart(e) {

  el.ad.addEventListener("click", function () { window.open(window.clickTag, "_blank"); });
  window.__film = { seek: function (s) { t0 = performance.now() - s * 1000; } };

  var imgs = Array.prototype.slice.call(document.images), left = imgs.length;
  function go() { if (--left > 0) return; setTimeout(function () { requestAnimationFrame(loop); }, 250); }
  imgs.forEach(function (im) { if (im.complete) go(); else { im.onload = go; im.onerror = go; } });
  if (!imgs.length) requestAnimationFrame(loop);
})();
