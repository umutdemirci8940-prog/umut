<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=970,initial-scale=1">
<meta name="ad.size" content="width=970,height=250">
<title>Pluxee – Pluxee Geçiyor · Hikâye · 970x250</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@600;700;800&display=swap" rel="stylesheet">
<style>
:root{--navy:#221C46;--ink:#0F0C26;--green:#00EB5E;--lav:#B8A9FF;--ease:cubic-bezier(.22,.8,.26,1)}
*{box-sizing:border-box;margin:0;padding:0}
html,body{width:970px;height:250px;overflow:hidden;background:#0F0C26}
body{font-family:Manrope,Inter,'Segoe UI',Roboto,'Helvetica Neue',Arial,sans-serif;-webkit-font-smoothing:antialiased;text-rendering:optimizeLegibility}
.ad{position:relative;width:970px;height:250px;overflow:hidden;background:var(--ink);color:#fff;user-select:none;-webkit-user-select:none;outline:0;cursor:pointer}
.ad:focus-visible{box-shadow:inset 0 0 0 2px var(--green)}
.bg{position:absolute;inset:0;overflow:hidden}
.bg canvas,.bg img.ph{position:absolute;left:0;top:0;width:970px;height:250px;opacity:0;transition:opacity 1.1s ease}
.bg img.ph{object-fit:cover;transform-origin:60% 50%}
.bg canvas.is-on,.bg img.ph.is-on{opacity:1}
.bg img.ph.is-on{animation:kb 9s linear forwards}
@keyframes kb{from{transform:scale(1.02)}to{transform:scale(1.09)}}
.grain{position:absolute;inset:0;opacity:.08;mix-blend-mode:overlay;pointer-events:none;background-repeat:repeat}
.vig{position:absolute;inset:0;pointer-events:none;background:radial-gradient(120% 140% at 70% 48%,transparent 40%,rgba(0,0,0,.6) 100%)}
.shade{position:absolute;inset:0;pointer-events:none;z-index:3;background:linear-gradient(90deg,rgba(15,12,38,.97) 0%,rgba(15,12,38,.9) 32%,rgba(15,12,38,.5) 48%,rgba(15,12,38,0) 64%),linear-gradient(180deg,rgba(15,12,38,0) 70%,rgba(15,12,38,.5) 100%)}
.rain{position:absolute;inset:0;opacity:0;transition:opacity .8s;pointer-events:none;background-image:repeating-linear-gradient(112deg,transparent 0 22px,rgba(210,225,255,.16) 22px 23px,transparent 23px 40px);background-size:80px 120px;animation:rain .5s linear infinite}
.ad.is-rain .rain{opacity:.5}
@keyframes rain{to{background-position:-26px 120px}}
/* giriş: ışık süpürmesi + logo açılışı + kademeli sol sütun */
.beam{position:absolute;top:-20px;bottom:-20px;left:0;width:140px;pointer-events:none;z-index:9;opacity:0;background:linear-gradient(90deg,rgba(0,235,94,0),rgba(0,235,94,.28) 35%,rgba(255,255,255,.75) 50%,rgba(0,235,94,.28) 65%,rgba(0,235,94,0));transform:translateX(-160px) skewX(-18deg);filter:blur(1px)}
.ad.is-in .beam{animation:beam .95s cubic-bezier(.4,0,.2,1) forwards}
@keyframes beam{0%{opacity:0;transform:translateX(-160px) skewX(-18deg)}10%{opacity:1}90%{opacity:1}100%{opacity:0;transform:translateX(1120px) skewX(-18deg)}}
.left{position:absolute;left:44px;top:28px;width:400px;height:214px;z-index:6}
.logo{display:flex;align-items:center;gap:7px;height:26px;clip-path:inset(0 100% 0 0);opacity:0}
.ad.is-in .logo{animation:logoIn .7s .25s var(--ease) forwards}
@keyframes logoIn{0%{clip-path:inset(0 100% 0 0);opacity:1}100%{clip-path:inset(0 -8% 0 0);opacity:1}}
.logo b{font-size:23px;font-weight:800;letter-spacing:-.03em;color:#fff;line-height:1}
.logo i{width:8px;height:8px;border-radius:2px;background:var(--green);transform:rotate(45deg);margin-top:2px}
.logo img{height:26px;width:auto;display:block}
.logo img.is-white{filter:brightness(0) invert(1)}
.eyebrow,.hl,.sub,.cta{opacity:0;transform:translateY(8px);transition:opacity .55s,transform .7s var(--ease)}
.ad.is-live .eyebrow{opacity:1;transform:none;transition-delay:.05s}
.ad.is-live .hl{opacity:1;transform:none;transition-delay:.15s}
.ad.is-live .sub{opacity:1;transform:none;transition-delay:.3s}
.ad.is-live .cta{opacity:1;transform:none;transition-delay:.45s}
.eyebrow{position:absolute;left:0;top:46px;height:14px;line-height:14px;font-size:10.5px;font-weight:800;letter-spacing:.22em;text-transform:uppercase;color:var(--green);white-space:nowrap}
.eyebrow.is-out{opacity:0!important;transform:translateY(4px)!important;transition:opacity .22s,transform .3s var(--ease)!important}
.hl{position:absolute;left:0;top:62px;font-size:29px;font-weight:800;letter-spacing:-.02em;line-height:1.08;color:#fff;white-space:nowrap}
.hl .l1{display:block;position:relative;width:400px;height:36px;line-height:32px;overflow:hidden;color:var(--green)}
.hl .l1 span{position:absolute;left:0;top:0;height:32px;line-height:32px;white-space:nowrap;transition:transform .5s var(--ease),opacity .4s}
.hl .l1 span.in{transform:translateY(110%);opacity:0}
.hl .l1 span.on{transform:none;opacity:1}
.hl .l1 span.out{transform:translateY(-110%);opacity:0}
.hl .l2{display:block;height:32px;line-height:32px}
.sub{position:absolute;left:0;top:134px;width:392px;font-size:12.5px;line-height:1.45;color:rgba(255,255,255,.82);height:36px;overflow:hidden}
.cta{position:absolute;left:0;top:176px;display:inline-flex;align-items:center;gap:8px;height:36px;padding:0 16px 0 18px;border-radius:99px;background:var(--green);color:var(--navy);font:inherit;font-size:12.5px;font-weight:800;border:0;cursor:pointer;box-shadow:0 10px 24px rgba(0,235,94,.3);white-space:nowrap}
.ad.is-live .cta{transition:opacity .55s .45s,transform .25s var(--ease),box-shadow .25s}
.ad.is-live .cta:hover{transform:translateY(-1px);box-shadow:0 12px 28px rgba(0,235,94,.45)}
.cta svg{width:12px;height:12px}
.ad.is-final .cta{animation:pulse 1.7s ease-in-out infinite}
@keyframes pulse{0%,100%{box-shadow:0 10px 24px rgba(0,235,94,.3)}50%{box-shadow:0 10px 24px rgba(0,235,94,.3),0 0 0 7px rgba(0,235,94,.15)}}
/* kart: ölçüler em ile (font-size = ölçek) */
.card{position:absolute;font-size:10px;width:19em;height:12em;border-radius:1.3em;transform-style:preserve-3d;box-shadow:0 3.6em 6em -1.2em rgba(0,0,0,.75),0 1em 2.2em rgba(0,0,0,.4);will-change:transform}
.face{position:absolute;inset:0;border-radius:1.3em;overflow:hidden;background:linear-gradient(116deg,#3A2F78 0%,#261D5C 36%,#1A1345 66%,#120D33 100%);box-shadow:inset 0 1px 0 rgba(255,255,255,.28),inset 0 -1px 0 rgba(0,0,0,.55)}
.face .band{position:absolute;left:-4em;top:5.8em;width:30em;height:3em;background:linear-gradient(90deg,#00EB5E,#00C77E 60%,#00B37A);transform:rotate(-16deg);box-shadow:0 .3em 1.2em rgba(0,235,94,.35)}
.face .band:after{content:"";position:absolute;left:0;right:0;top:0;height:1px;background:rgba(255,255,255,.35)}
.face .chip{position:absolute;left:1.8em;top:3em;width:3.2em;height:2.4em;border-radius:.5em;background:linear-gradient(135deg,#F9E6A8 0%,#D9AE4E 42%,#B98A2C 58%,#F0D28A 100%);box-shadow:inset 0 0 0 1px rgba(0,0,0,.3),0 1px 2px rgba(0,0,0,.35)}
.face .chip:before,.face .chip:after{content:"";position:absolute;left:0;right:0;height:1px;background:rgba(0,0,0,.35)}
.face .chip:before{top:.8em}.face .chip:after{top:1.6em}
.face .nfc{position:absolute;right:1.6em;top:2.6em;width:2em;height:2em;color:rgba(255,255,255,.85)}
.face .wm{position:absolute;left:1.8em;bottom:1.6em;font-size:1.9em;font-weight:800;letter-spacing:-.02em;color:#fff;text-shadow:0 1px 0 rgba(255,255,255,.22),0 -1px 0 rgba(0,0,0,.55)}
.face .wm i{display:inline-block;width:.32em;height:.32em;border-radius:.08em;background:var(--green);transform:rotate(45deg);margin-left:.26em;vertical-align:middle}
.face .img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;display:block}
.face .gloss{position:absolute;inset:0;background:linear-gradient(104deg,transparent 28%,rgba(255,255,255,.22) 44%,rgba(255,255,255,.06) 50%,transparent 60%) 0 0/260% 100%;animation:sweep 4.4s ease-in-out infinite;pointer-events:none}
@keyframes sweep{0%,25%{background-position:130% 0}70%,100%{background-position:-30% 0}}
/* ipucu, tekrar, parçacık, sinyal çubuğu */
.hint{position:absolute;display:inline-flex;align-items:center;gap:8px;padding:5px 10px;border-radius:99px;background:rgba(15,12,38,.55);backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px);box-shadow:inset 0 0 0 1px rgba(255,255,255,.14);font-size:8.5px;font-weight:800;letter-spacing:.16em;text-transform:uppercase;color:#fff;opacity:0;transform:translate(-50%,4px);transition:opacity .4s,transform .5s var(--ease);pointer-events:none;white-space:nowrap;z-index:8}
.hint small{font-size:8px;font-weight:700;letter-spacing:.1em;color:rgba(255,255,255,.55);text-transform:none}
.hint svg{width:22px;height:10px;color:var(--green)}
.scene.is-hint .hint{opacity:1;transform:translate(-50%,0)}
.scene.is-passing .hint{opacity:0;transform:translate(-50%,4px)}
.again{position:absolute;transform:translateX(-50%);display:none;align-items:center;gap:6px;height:24px;padding:0 11px 0 9px;border-radius:99px;background:rgba(255,255,255,.12);box-shadow:inset 0 0 0 1px rgba(255,255,255,.22);font:inherit;font-size:9px;font-weight:800;letter-spacing:.14em;text-transform:uppercase;color:#fff;border:0;cursor:pointer;z-index:8;transition:background .2s}
.again:hover{background:rgba(255,255,255,.2)}
.again svg{width:11px;height:11px}
.ad.is-ended .again{display:inline-flex}
.burst{position:absolute;width:0;height:0;pointer-events:none;z-index:7}
.burst i{position:absolute;left:-3px;top:-3px;width:6px;height:6px;border-radius:50%;background:var(--green);opacity:0;animation:burst .8s cubic-bezier(.2,.8,.3,1) forwards}
.burst i.w{background:#fff;width:4px;height:4px}
@keyframes burst{0%{opacity:1;transform:translate(0,0) scale(1)}100%{opacity:0;transform:translate(var(--dx),var(--dy)) scale(.3)}}
.sig{position:absolute;right:12px;top:8px;height:18px;display:none;align-items:center;gap:4px;z-index:7;font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;font-size:9px;letter-spacing:.03em;pointer-events:none}
.ad.is-demo .sig{display:flex}
.sig span{padding:0 6px;height:18px;line-height:18px;border-radius:4px;background:rgba(0,0,0,.5);color:rgba(255,255,255,.85);box-shadow:inset 0 0 0 1px rgba(255,255,255,.12);white-space:nowrap}
.sig span b{color:var(--green);font-weight:700}
.sig .lbl{background:var(--green);color:var(--navy);font-weight:800;letter-spacing:.06em}
@media (prefers-reduced-motion:reduce){*,*:before,*:after{animation-duration:.01ms!important;animation-iteration-count:1!important;transition-duration:.01ms!important;transition-delay:0s!important}}

.left{z-index:12}
.scene{position:absolute;left:0;top:0;width:970px;height:250px;z-index:4;touch-action:none;cursor:pointer}
/* fotoğraf: hikâyeye özgü yavaş Ken Burns; çıkan kare ölçeğini korur (sıçrama yok) */
.bg img.ph{transition:opacity .8s ease;animation:kbh 7.5s linear forwards;animation-play-state:paused}
.bg img.ph.is-on{animation:kbh 7.5s linear forwards}
@keyframes kbh{from{transform:scale(1.06) translate(1.1%,0)}to{transform:scale(1.15) translate(-.9%,.7%)}}
.ad.is-thud .bg{animation:thud .55s var(--ease)}
@keyframes thud{0%{transform:scale(1)}14%{transform:scale(1.014)}100%{transform:scale(1)}}
.tops{position:absolute;left:440px;top:0;width:530px;height:76px;pointer-events:none;background:linear-gradient(180deg,rgba(15,12,38,.55),rgba(15,12,38,0))}
.flash{position:absolute;left:440px;top:0;width:530px;height:250px;pointer-events:none;opacity:0;background:linear-gradient(90deg,rgba(255,255,255,0),#fff 22%)}
.flash.is-on{animation:flash .5s ease-out}
@keyframes flash{0%{opacity:.5}100%{opacity:0}}
/* ilerleme çubukları */
.bars{position:absolute;left:480px;top:14px;width:470px;height:3px;display:flex;gap:6px;pointer-events:none}
.bar{flex:1;height:3px;border-radius:2px;background:rgba(255,255,255,.28);overflow:hidden;box-shadow:0 1px 3px rgba(0,0,0,.3);opacity:0;transform:translateY(-4px);transition:opacity .5s,transform .6s var(--ease)}
.ad.is-live .bar{opacity:1;transform:none}
.ad.is-live .bar:nth-child(2){transition-delay:.06s}.ad.is-live .bar:nth-child(3){transition-delay:.12s}.ad.is-live .bar:nth-child(4){transition-delay:.18s}
.bar i{display:block;height:100%;width:100%;background:var(--green);transform:scaleX(0);transform-origin:0 50%;box-shadow:0 0 8px rgba(0,235,94,.6)}
.bar.is-done i{transform:scaleX(1)}
.num{position:absolute;left:480px;top:24px;font-size:8.5px;font-weight:800;letter-spacing:.22em;color:rgba(255,255,255,.72);text-shadow:0 1px 6px rgba(0,0,0,.5);opacity:0;transition:opacity .5s .2s;pointer-events:none}
.ad.is-live .num{opacity:1}
.scene.is-final .num{opacity:0;transition-delay:0s}
/* damga */
.story{position:absolute;left:0;top:0;width:970px;height:250px;pointer-events:none;transition:opacity .35s}
.scene.is-final .story{opacity:0}
.stamp{position:absolute;left:730px;top:106px;display:inline-flex;align-items:center;gap:10px;padding:8px 16px 8px 19px;border:3px solid var(--green);border-radius:10px;color:var(--green);font-size:27px;font-weight:800;letter-spacing:.17em;line-height:1;text-transform:uppercase;white-space:nowrap;background:rgba(0,235,94,.07);opacity:0;transform:translate(-50%,-50%) rotate(-10deg) scale(2.2);filter:drop-shadow(0 10px 18px rgba(0,0,0,.5));will-change:transform,opacity}
.stamp:before{content:"";position:absolute;inset:3px;border:1px solid rgba(0,235,94,.75);border-radius:6px}
.stamp svg{width:24px;height:24px;margin-top:-2px}
.story.is-stamp .stamp{animation:slam .42s cubic-bezier(.2,.9,.3,1) forwards}
@keyframes slam{0%{opacity:0;transform:translate(-50%,-50%) rotate(-10deg) scale(2.2)}55%{opacity:1}100%{opacity:1;transform:translate(-50%,-50%) rotate(-10deg) scale(1)}}
.slbl{position:absolute;left:730px;top:150px;transform:translate(-50%,6px);opacity:0;font-size:10px;font-weight:800;letter-spacing:.32em;text-transform:uppercase;color:#fff;text-shadow:0 2px 10px rgba(0,0,0,.65);white-space:nowrap;transition:opacity .45s,transform .55s var(--ease)}
.slbl em{font-style:normal;color:var(--green)}
.story.is-lbl .slbl{opacity:1;transform:translate(-50%,0)}
/* duraklatma rozeti */
.pz{position:absolute;left:715px;top:32px;transform:translate(-50%,-4px);opacity:0;display:inline-flex;align-items:center;gap:7px;height:20px;padding:0 9px 0 8px;border-radius:99px;background:rgba(15,12,38,.55);backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px);box-shadow:inset 0 0 0 1px rgba(255,255,255,.14);font-size:8px;font-weight:800;letter-spacing:.18em;text-transform:uppercase;color:#fff;pointer-events:none;transition:opacity .25s,transform .35s var(--ease);white-space:nowrap}
.pz i{width:2px;height:8px;background:var(--green);border-radius:1px}
.pz i+i{margin-left:-4px}
.scene.is-paused .pz{opacity:1;transform:translate(-50%,0)}
.scene.is-paused .bar i{box-shadow:0 0 12px rgba(0,235,94,.95)}
/* final: dört damga alt sırada */
.fin{position:absolute;left:480px;top:188px;width:346px;height:48px;display:flex;gap:10px;align-items:flex-end;pointer-events:none}
.fs{flex:1;display:flex;flex-direction:column;align-items:center;gap:6px;opacity:0;will-change:transform,opacity}
.fs small{font-size:7.5px;font-weight:800;letter-spacing:.24em;text-transform:uppercase;color:rgba(255,255,255,.85);text-shadow:0 1px 6px rgba(0,0,0,.6);white-space:nowrap}
.fs .box{position:relative;display:inline-flex;align-items:center;gap:4px;padding:3px 7px 3px 8px;border:2px solid var(--green);border-radius:5px;color:var(--green);font-size:8.5px;font-weight:800;letter-spacing:.1em;line-height:1;text-transform:uppercase;transform:rotate(-6deg);background:rgba(0,235,94,.08);filter:drop-shadow(0 4px 8px rgba(0,0,0,.5));white-space:nowrap}
.fs .box:before{content:"";position:absolute;inset:2px;border:1px solid rgba(0,235,94,.7);border-radius:3px}
.fs .box svg{width:9px;height:9px}
.scene.is-final .fs{animation:fslam .5s cubic-bezier(.2,.9,.3,1) forwards}
.scene.is-final .fs:nth-child(1){animation-delay:.35s}.scene.is-final .fs:nth-child(2){animation-delay:.5s}.scene.is-final .fs:nth-child(3){animation-delay:.65s}.scene.is-final .fs:nth-child(4){animation-delay:.8s}
@keyframes fslam{0%{opacity:0;transform:scale(1.7)}100%{opacity:1;transform:scale(1)}}
/* imza: kart */
.card{font-size:6.2px;left:auto;top:auto;right:14px;bottom:14px;z-index:6;pointer-events:none;opacity:0;transform:translateY(10px) rotate(-14deg);transition:opacity .7s .55s,transform 1s .55s var(--ease);box-shadow:0 2.4em 3.6em -.8em rgba(0,0,0,.65),0 .6em 1.4em rgba(0,0,0,.35)}
.ad.is-live .card{opacity:1;transform:translateY(0) rotate(-8deg)}
.ad.is-ended .gloss{animation:none}
.burst{left:730px;top:106px}
.hint{left:655px;top:214px}
.hint svg{width:12px;height:12px}
.again{left:715px;top:30px}
</style>
</head>
<body>
<div class="ad" id="ad" role="region" aria-label="Pluxee reklamı" tabindex="0" data-concept="hikaye">

  <div class="bg"></div>
  <div class="grain"></div>
  <div class="vig"></div>
  <div class="rain"></div>
  <div class="shade"></div>
  <div class="scene" aria-label="Fotoğraf hikâyeleri: dokunun, ilerleyin; basılı tutun, durdurun">
    <div class="tops"></div>
    <div class="flash"></div>
    <div class="bars" aria-hidden="true"></div>
    <span class="num" aria-hidden="true"></span>
    <div class="story"><div class="stamp">GEÇİYOR<svg viewBox="0 0 12 12" aria-hidden="true"><path d="M2.5 6.5l2.3 2.3L9.5 4" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"/></svg></div><span class="slbl"></span></div>
    <div class="fin" aria-hidden="true"></div>
    <div class="pz" aria-hidden="true"><i></i><i></i>Durduruldu</div>
    <div class="card" aria-hidden="true"><div class="face"><span class="band"></span><span class="chip"></span><svg class="nfc" viewBox="0 0 24 24" aria-hidden="true"><path d="M6.5 8.5a5 5 0 0 1 0 7M10.5 5.5a10 10 0 0 1 0 13M14.5 2.5a15 15 0 0 1 0 19" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round"/></svg><span class="wm">pluxee<i></i></span><span class="gloss"></span></div></div>
    <div class="burst"></div>
    <div class="hint"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M9 11.5V4.8a1.6 1.6 0 0 1 3.2 0v5.4l1.1-.3a1.5 1.5 0 0 1 1.9 1.4v.3l1.2-.2a1.5 1.5 0 0 1 1.8 1.5v.4l.9.1a1.6 1.6 0 0 1 1.4 1.6v2.8c0 2.9-2.3 5.2-5.2 5.2h-2.1a5.2 5.2 0 0 1-4.3-2.3l-3.3-4.9a1.5 1.5 0 0 1 2.3-1.9z" fill="#fff" stroke="#14102F" stroke-width="1.2" stroke-linejoin="round"/></svg> Dokunun: ilerleyin <small>· basılı tutun: durdurun</small></div>
    <button class="again" type="button"><svg viewBox="0 0 12 12" aria-hidden="true"><path d="M2.2 6a3.8 3.8 0 1 0 1.1-2.7" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/><path d="M2 1.8v2.4h2.4" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></svg>Baştan izle</button>
  </div>
  <div class="left">
    <div class="logo"><b>pluxee</b><i></i></div>
    <span class="eyebrow"></span>
    <div class="hl"><span class="l1"></span><span class="l2">Pluxee geçiyor.</span></div>
    <p class="sub"></p>
    <button class="cta" type="button"><span class="cta-t"></span><svg viewBox="0 0 12 12" aria-hidden="true"><path d="M2 6h8M6.5 2.5L10 6l-3.5 3.5" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></svg></button>
  </div>
<div class="beam"></div>
<div class="sig" aria-hidden="true"></div>

  holdT=setTimeout(function(){holdT=null;if(ptr&&!ptr.moved&&phase==='play'){ptr.hold=true;setPaused(true,true)}},T.press);
});
scene.addEventListener('pointermove',function(e){if(!ptr||e.pointerId!==ptr.id)return;var dx=e.clientX-ptr.sx,dy=e.clientY-ptr.sy;if(!ptr.moved&&(Math.abs(dx)>6||Math.abs(dy)>6)){ptr.moved=true;if(holdT){clearTimeout(holdT);holdT=null}}});
function endPtr(e){
  if(!ptr||(e&&e.pointerId!==ptr.id))return;try{scene.releasePointerCapture(ptr.id)}catch(err){}
  var p=ptr;ptr=null;if(holdT){clearTimeout(holdT);holdT=null}
  if(p.hold){setPaused(false,true);return}
  var s=scaleOf(),dx=(e.clientX-p.sx)/s,dy=(e.clientY-p.sy)/s;
  if(p.moved){if(Math.abs(dx)>=T.swipe&&Math.abs(dx)>Math.abs(dy)){if(dx<0)go(idx+1,true);else go(idx-1,true)}return}
  var r=scene.getBoundingClientRect(),x=(e.clientX-r.left)/s;
  if(x<SPLIT)go(idx-1,true);else go(idx+1,true);
}
scene.addEventListener('pointerup',endPtr);scene.addEventListener('pointercancel',endPtr);
scene.addEventListener('click',function(e){e.stopPropagation()});
again.addEventListener('click',function(e){e.stopPropagation();replay()});
engine.key=function(e){
  if(e.key==='ArrowRight'){e.preventDefault();go(idx+1,true)}
  else if(e.key==='ArrowLeft'){e.preventDefault();go(idx-1,true)}
  else if(e.key===' '){e.preventDefault();setPaused(!paused,true)}
};
engine.restart=restart;
engine.snapshot=function(){return {phase:phase,idx:idx,paused:paused,elapsed:Math.round(elapsed),story:STORY}};
S=readSignals();build();start();

})();</script>
