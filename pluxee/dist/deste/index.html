<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=970,initial-scale=1">
<meta name="ad.size" content="width=970,height=250">
<title>Pluxee – Pluxee Geçiyor · Deste · 970x250</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@600;700;800&display=swap" rel="stylesheet">
<style>
:root{--navy:#221C46;--ink:#0F0C26;--green:#00EB5E;--lav:#B8A9FF;--ease:cubic-bezier(.22,.8,.26,1)}
*{box-sizing:border-box;margin:0;padding:0}
html,body{width:970px;height:250px;overflow:hidden;background:#0F0C26}
body{font-family:Manrope,Inter,'Segoe UI',Roboto,'Helvetica Neue',Arial,sans-serif;-webkit-font-smoothing:antialiased;text-rendering:optimizeLegibility}
.ad{position:relative;width:970px;height:250px;overflow:hidden;background:var(--ink);color:#fff;user-select:none;-webkit-user-select:none;outline:0;cursor:pointer}
.ad:focus-visible{box-shadow:inset 0 0 0 2px var(--green)}
.bg{position:absolute;inset:0;overflow:hidden}
.bg canvas,.bg img.ph{position:absolute;left:0;top:0;width:970px;height:250px;opacity:0;transition:opacity 1.1s ease}
.bg img.ph{object-fit:cover;transform-origin:60% 50%}
.bg canvas.is-on,.bg img.ph.is-on{opacity:1}
.bg img.ph.is-on{animation:kb 9s linear forwards}
@keyframes kb{from{transform:scale(1.02)}to{transform:scale(1.09)}}
.grain{position:absolute;inset:0;opacity:.08;mix-blend-mode:overlay;pointer-events:none;background-repeat:repeat}
.vig{position:absolute;inset:0;pointer-events:none;background:radial-gradient(120% 140% at 70% 48%,transparent 40%,rgba(0,0,0,.6) 100%)}
.shade{position:absolute;inset:0;pointer-events:none;z-index:3;background:linear-gradient(90deg,rgba(15,12,38,.97) 0%,rgba(15,12,38,.9) 32%,rgba(15,12,38,.5) 48%,rgba(15,12,38,0) 64%),linear-gradient(180deg,rgba(15,12,38,0) 70%,rgba(15,12,38,.5) 100%)}
.rain{position:absolute;inset:0;opacity:0;transition:opacity .8s;pointer-events:none;background-image:repeating-linear-gradient(112deg,transparent 0 22px,rgba(210,225,255,.16) 22px 23px,transparent 23px 40px);background-size:80px 120px;animation:rain .5s linear infinite}
.ad.is-rain .rain{opacity:.5}
@keyframes rain{to{background-position:-26px 120px}}
/* giriş: ışık süpürmesi + logo açılışı + kademeli sol sütun */
.beam{position:absolute;top:-20px;bottom:-20px;left:0;width:140px;pointer-events:none;z-index:9;opacity:0;background:linear-gradient(90deg,rgba(0,235,94,0),rgba(0,235,94,.28) 35%,rgba(255,255,255,.75) 50%,rgba(0,235,94,.28) 65%,rgba(0,235,94,0));transform:translateX(-160px) skewX(-18deg);filter:blur(1px)}
.ad.is-in .beam{animation:beam .95s cubic-bezier(.4,0,.2,1) forwards}
@keyframes beam{0%{opacity:0;transform:translateX(-160px) skewX(-18deg)}10%{opacity:1}90%{opacity:1}100%{opacity:0;transform:translateX(1120px) skewX(-18deg)}}
.left{position:absolute;left:44px;top:28px;width:400px;height:214px;z-index:6}
.logo{display:flex;align-items:center;gap:7px;height:26px;clip-path:inset(0 100% 0 0);opacity:0}
.ad.is-in .logo{animation:logoIn .7s .25s var(--ease) forwards}
@keyframes logoIn{0%{clip-path:inset(0 100% 0 0);opacity:1}100%{clip-path:inset(0 -8% 0 0);opacity:1}}
.logo b{font-size:23px;font-weight:800;letter-spacing:-.03em;color:#fff;line-height:1}
.logo i{width:8px;height:8px;border-radius:2px;background:var(--green);transform:rotate(45deg);margin-top:2px}
.logo img{height:26px;width:auto;display:block}
.logo img.is-white{filter:brightness(0) invert(1)}
.eyebrow,.hl,.sub,.cta{opacity:0;transform:translateY(8px);transition:opacity .55s,transform .7s var(--ease)}
.ad.is-live .eyebrow{opacity:1;transform:none;transition-delay:.05s}
.ad.is-live .hl{opacity:1;transform:none;transition-delay:.15s}
.ad.is-live .sub{opacity:1;transform:none;transition-delay:.3s}
.ad.is-live .cta{opacity:1;transform:none;transition-delay:.45s}
.eyebrow{position:absolute;left:0;top:46px;height:14px;line-height:14px;font-size:10.5px;font-weight:800;letter-spacing:.22em;text-transform:uppercase;color:var(--green);white-space:nowrap}
.eyebrow.is-out{opacity:0!important;transform:translateY(4px)!important;transition:opacity .22s,transform .3s var(--ease)!important}
.hl{position:absolute;left:0;top:62px;font-size:29px;font-weight:800;letter-spacing:-.02em;line-height:1.08;color:#fff;white-space:nowrap}
.hl .l1{display:block;position:relative;width:400px;height:36px;line-height:32px;overflow:hidden;color:var(--green)}
.hl .l1 span{position:absolute;left:0;top:0;height:32px;line-height:32px;white-space:nowrap;transition:transform .5s var(--ease),opacity .4s}
.hl .l1 span.in{transform:translateY(110%);opacity:0}
.hl .l1 span.on{transform:none;opacity:1}
.hl .l1 span.out{transform:translateY(-110%);opacity:0}
.hl .l2{display:block;height:32px;line-height:32px}
.sub{position:absolute;left:0;top:134px;width:392px;font-size:12.5px;line-height:1.45;color:rgba(255,255,255,.82);height:36px;overflow:hidden}
.cta{position:absolute;left:0;top:176px;display:inline-flex;align-items:center;gap:8px;height:36px;padding:0 16px 0 18px;border-radius:99px;background:var(--green);color:var(--navy);font:inherit;font-size:12.5px;font-weight:800;border:0;cursor:pointer;box-shadow:0 10px 24px rgba(0,235,94,.3);white-space:nowrap}
.ad.is-live .cta{transition:opacity .55s .45s,transform .25s var(--ease),box-shadow .25s}
.ad.is-live .cta:hover{transform:translateY(-1px);box-shadow:0 12px 28px rgba(0,235,94,.45)}
.cta svg{width:12px;height:12px}
.ad.is-final .cta{animation:pulse 1.7s ease-in-out infinite}
@keyframes pulse{0%,100%{box-shadow:0 10px 24px rgba(0,235,94,.3)}50%{box-shadow:0 10px 24px rgba(0,235,94,.3),0 0 0 7px rgba(0,235,94,.15)}}
/* kart: ölçüler em ile (font-size = ölçek) */
.card{position:absolute;font-size:10px;width:19em;height:12em;border-radius:1.3em;transform-style:preserve-3d;box-shadow:0 3.6em 6em -1.2em rgba(0,0,0,.75),0 1em 2.2em rgba(0,0,0,.4);will-change:transform}
.face{position:absolute;inset:0;border-radius:1.3em;overflow:hidden;background:linear-gradient(116deg,#3A2F78 0%,#261D5C 36%,#1A1345 66%,#120D33 100%);box-shadow:inset 0 1px 0 rgba(255,255,255,.28),inset 0 -1px 0 rgba(0,0,0,.55)}
.face .band{position:absolute;left:-4em;top:5.8em;width:30em;height:3em;background:linear-gradient(90deg,#00EB5E,#00C77E 60%,#00B37A);transform:rotate(-16deg);box-shadow:0 .3em 1.2em rgba(0,235,94,.35)}
.face .band:after{content:"";position:absolute;left:0;right:0;top:0;height:1px;background:rgba(255,255,255,.35)}
.face .chip{position:absolute;left:1.8em;top:3em;width:3.2em;height:2.4em;border-radius:.5em;background:linear-gradient(135deg,#F9E6A8 0%,#D9AE4E 42%,#B98A2C 58%,#F0D28A 100%);box-shadow:inset 0 0 0 1px rgba(0,0,0,.3),0 1px 2px rgba(0,0,0,.35)}
.face .chip:before,.face .chip:after{content:"";position:absolute;left:0;right:0;height:1px;background:rgba(0,0,0,.35)}
.face .chip:before{top:.8em}.face .chip:after{top:1.6em}
.face .nfc{position:absolute;right:1.6em;top:2.6em;width:2em;height:2em;color:rgba(255,255,255,.85)}
.face .wm{position:absolute;left:1.8em;bottom:1.6em;font-size:1.9em;font-weight:800;letter-spacing:-.02em;color:#fff;text-shadow:0 1px 0 rgba(255,255,255,.22),0 -1px 0 rgba(0,0,0,.55)}
.face .wm i{display:inline-block;width:.32em;height:.32em;border-radius:.08em;background:var(--green);transform:rotate(45deg);margin-left:.26em;vertical-align:middle}
.face .img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;display:block}
.face .gloss{position:absolute;inset:0;background:linear-gradient(104deg,transparent 28%,rgba(255,255,255,.22) 44%,rgba(255,255,255,.06) 50%,transparent 60%) 0 0/260% 100%;animation:sweep 4.4s ease-in-out infinite;pointer-events:none}
@keyframes sweep{0%,25%{background-position:130% 0}70%,100%{background-position:-30% 0}}
/* ipucu, tekrar, parçacık, sinyal çubuğu */
.hint{position:absolute;display:inline-flex;align-items:center;gap:8px;padding:5px 10px;border-radius:99px;background:rgba(15,12,38,.55);backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px);box-shadow:inset 0 0 0 1px rgba(255,255,255,.14);font-size:8.5px;font-weight:800;letter-spacing:.16em;text-transform:uppercase;color:#fff;opacity:0;transform:translate(-50%,4px);transition:opacity .4s,transform .5s var(--ease);pointer-events:none;white-space:nowrap;z-index:8}
.hint small{font-size:8px;font-weight:700;letter-spacing:.1em;color:rgba(255,255,255,.55);text-transform:none}
.hint svg{width:22px;height:10px;color:var(--green)}
.scene.is-hint .hint{opacity:1;transform:translate(-50%,0)}
.scene.is-passing .hint{opacity:0;transform:translate(-50%,4px)}
.again{position:absolute;transform:translateX(-50%);display:none;align-items:center;gap:6px;height:24px;padding:0 11px 0 9px;border-radius:99px;background:rgba(255,255,255,.12);box-shadow:inset 0 0 0 1px rgba(255,255,255,.22);font:inherit;font-size:9px;font-weight:800;letter-spacing:.14em;text-transform:uppercase;color:#fff;border:0;cursor:pointer;z-index:8;transition:background .2s}
.again:hover{background:rgba(255,255,255,.2)}
.again svg{width:11px;height:11px}
.ad.is-ended .again{display:inline-flex}
.burst{position:absolute;width:0;height:0;pointer-events:none;z-index:7}
.burst i{position:absolute;left:-3px;top:-3px;width:6px;height:6px;border-radius:50%;background:var(--green);opacity:0;animation:burst .8s cubic-bezier(.2,.8,.3,1) forwards}
.burst i.w{background:#fff;width:4px;height:4px}
@keyframes burst{0%{opacity:1;transform:translate(0,0) scale(1)}100%{opacity:0;transform:translate(var(--dx),var(--dy)) scale(.3)}}
.sig{position:absolute;right:12px;top:8px;height:18px;display:none;align-items:center;gap:4px;z-index:7;font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;font-size:9px;letter-spacing:.03em;pointer-events:none}
.ad.is-demo .sig{display:flex}
.sig span{padding:0 6px;height:18px;line-height:18px;border-radius:4px;background:rgba(0,0,0,.5);color:rgba(255,255,255,.85);box-shadow:inset 0 0 0 1px rgba(255,255,255,.12);white-space:nowrap}
.sig span b{color:var(--green);font-weight:700}
.sig .lbl{background:var(--green);color:var(--navy);font-weight:800;letter-spacing:.06em}
@media (prefers-reduced-motion:reduce){*,*:before,*:after{animation-duration:.01ms!important;animation-iteration-count:1!important;transition-duration:.01ms!important;transition-delay:0s!important}}

html,body{background:#F4F1EB}
.ad{background:#F4F1EB;color:var(--navy)}
.paper{position:absolute;inset:0;background:radial-gradient(120% 170% at 80% 30%,#FFFFFF 0%,#F4F1EB 46%,#E7E2D7 100%)}
.rule{position:absolute;left:452px;top:0;width:1px;height:250px;background:linear-gradient(180deg,rgba(34,28,70,0),rgba(34,28,70,.12) 30%,rgba(34,28,70,.12) 70%,rgba(34,28,70,0))}
.grain{opacity:.07;mix-blend-mode:multiply}
.glow{position:absolute;left:560px;top:10px;width:330px;height:230px;border-radius:50%;background:radial-gradient(closest-side,rgba(0,235,94,.26),rgba(0,235,94,0));filter:blur(10px);opacity:0;transition:opacity 1.2s}
.ad.is-live .glow{opacity:1}
.beam{background:linear-gradient(90deg,rgba(0,235,94,0),rgba(0,235,94,.35) 35%,rgba(34,28,70,.12) 50%,rgba(0,235,94,.35) 65%,rgba(0,235,94,0))}
/* sol sütun: açık zemin */
.logo b{color:var(--navy)}
.logo img.is-white{filter:none}
.eyebrow{color:#00A64A}
.hl,.hl .l1{color:var(--navy)}
.hl .l1 span{padding:0 5px 0 3px;margin-left:-3px;background:linear-gradient(transparent 60%,rgba(0,235,94,.5) 60%,rgba(0,235,94,.5) 93%,transparent 93%)}
.sub{color:rgba(34,28,70,.7)}
.cta{box-shadow:0 10px 24px rgba(0,235,94,.28)}
.again{background:rgba(34,28,70,.07);box-shadow:inset 0 0 0 1px rgba(34,28,70,.22);color:var(--navy)}
.again:hover{background:rgba(34,28,70,.13)}
/* sahne */
.scene{position:absolute;left:452px;top:0;width:518px;height:250px;z-index:4;touch-action:none;cursor:grab;overflow:hidden}
.scene.is-drag{cursor:grabbing}
.scene.is-final{cursor:default}
.deck{position:absolute;inset:0}
/* fotoğraf baskısı */
.pc{position:absolute;left:141px;top:22px;width:236px;height:196px;padding:7px;border-radius:5px;background:#fff;box-shadow:0 22px 44px -14px rgba(34,28,70,.42),0 2px 6px rgba(34,28,70,.12),inset 0 0 0 1px rgba(34,28,70,.05);opacity:0;will-change:transform,opacity;transform-origin:50% 60%;transition:transform .6s var(--ease),opacity .45s}
.pc.is-drag{transition:none}
.pc.is-out{transition:transform .6s cubic-bezier(.3,.7,.4,1),opacity .45s .15s;opacity:0}
.pc.is-fan{transition:transform .8s var(--ease),opacity .5s;opacity:1;transform-origin:50% 100%}
.pc .win{position:relative;width:222px;height:160px;overflow:hidden;border-radius:2px;background:#E7E2D7}
.pc .win img.ph,.pc .win canvas{position:absolute;left:0;top:0;width:100%;height:100%;object-fit:cover;display:block}
.pc .win:after{content:"";position:absolute;inset:0;pointer-events:none;background:linear-gradient(180deg,rgba(0,0,0,0) 60%,rgba(0,0,0,.22) 100%)}
.pc .cap{position:absolute;left:9px;right:9px;bottom:6px;height:18px;display:flex;align-items:center;gap:6px;white-space:nowrap}
.pc .cap b{font-size:8.5px;font-weight:800;letter-spacing:.2em;text-transform:uppercase;color:var(--navy);line-height:1}
.pc .cap small{font-size:8px;font-weight:700;letter-spacing:.06em;color:#00A64A;line-height:1}
.pc .cap em{margin-left:auto;font-style:normal;font-size:8px;font-weight:800;letter-spacing:.14em;color:rgba(34,28,70,.42);line-height:1}
/* damga: kauçuk (2 → 1, -12°) */
.pc .stamp{position:absolute;left:118px;top:87px;display:inline-flex;align-items:center;gap:7px;padding:6px 11px 6px 13px;border:2.5px solid var(--green);border-radius:7px;color:var(--green);font-size:17px;font-weight:800;letter-spacing:.17em;line-height:1;text-transform:uppercase;white-space:nowrap;background:rgba(15,12,38,.42);backdrop-filter:blur(2px);-webkit-backdrop-filter:blur(2px);opacity:0;transform:translate(-50%,-50%) rotate(-12deg) scale(2);pointer-events:none;filter:drop-shadow(0 6px 12px rgba(0,0,0,.35))}
.pc .stamp:before{content:"";position:absolute;inset:3px;border:1px solid rgba(0,235,94,.7);border-radius:4px}
.pc .stamp svg{width:15px;height:15px}
.pc.is-stamp .stamp{animation:slam .38s cubic-bezier(.2,.9,.3,1) forwards}
@keyframes slam{0%{opacity:0;transform:translate(-50%,-50%) rotate(-12deg) scale(2)}55%{opacity:1}100%{opacity:1;transform:translate(-50%,-50%) rotate(-12deg) scale(1)}}
/* ilerleme */
.dots{position:absolute;left:112px;top:30px;display:flex;flex-direction:column;gap:6px;opacity:0;transition:opacity .5s .3s}
.ad.is-live .dots{opacity:1}
.dot{width:3px;height:16px;border-radius:2px;background:rgba(34,28,70,.16);transition:background .3s,transform .3s}
.dot.is-cur{background:var(--navy)}
.dot.is-on{background:var(--green)}
.scene.is-final .dots{opacity:0;transition-delay:0s}
/* Pluxee kartı: damga vurucu */
.card{left:392px;top:152px;font-size:6.4px;z-index:20;pointer-events:none;opacity:0;transform:translateY(12px) rotate(-8deg);transition:opacity .6s .5s,transform .8s .5s var(--ease),left .8s var(--ease),top .8s var(--ease),font-size .8s var(--ease)}
.ad.is-live .card{opacity:1;transform:rotate(-8deg)}
.ad.is-live .card.is-tap{animation:tap .5s var(--ease)}
@keyframes tap{0%{transform:rotate(-8deg)}38%{transform:translate(-30px,-16px) rotate(-15deg)}100%{transform:rotate(-8deg)}}
.scene.is-final .card{left:196px;top:156px;font-size:7px;transform:rotate(-5deg);transition:left .8s .25s var(--ease),top .8s .25s var(--ease),font-size .8s .25s var(--ease),transform .8s .25s var(--ease)}
.ad.is-ended .gloss{animation:none}
.burst{left:259px;top:110px}
.hint{left:259px;top:222px}
.hint svg{width:22px;height:10px}
.again{left:259px;top:12px;z-index:30}
</style>
</head>

function paint(P,W,H){

/* Katmanlar: gerçek fotoğraf varsa <img> (object-fit: cover), yoksa üretilmiş bokeh (geçici) */

function photoOf(k){return D.photos&&D.photos[k]?D.photos[k]:null}

var K=D.copy,T=K.timing,FAN=D.fan;
var scene=$('.scene'),deck=$('.deck'),dots=$('.dots'),card=$('.card'),again=$('.again'),burst=$('.burst');
var cards=[],dotEls=[],idx=0,phase='',busy=false,drag=null,live=false;
(function(){try{var g=grainUri(),gs=ad.querySelectorAll('.grain');for(var i=0;i<gs.length;i++)gs[i].style.backgroundImage='url('+g+')'}catch(err){}})();
function stackT(d){return d===0?'none':'translate('+(d*7)+'px,'+(-d*4)+'px) rotate('+((d%2?-1:1)*(2.2+d*1.1)).toFixed(1)+'deg) scale('+(1-d*.035).toFixed(3)+')'}

function build(){
  buildCore();
  deck.innerHTML='';dots.innerHTML='';cards=[];dotEls=[];
  for(var i=0;i<order.length;i++){
    var o=order[i],el=document.createElement('div');el.className='pc';el.setAttribute('data-key',o.key);o.passed=false;
    var win=document.createElement('div');win.className='win';var ph=photoOf(o.key),im;
    if(ph){im=document.createElement('img');im.src=ph;im.alt='';im.className='ph';im.style.objectPosition=photoPosOf(o.key)}else{try{im=paint(PAL[o.key]||PAL.city,222,160)}catch(err){im=null}}
    if(im)win.appendChild(im);el.appendChild(win);
    var cap=document.createElement('span');cap.className='cap';cap.innerHTML='<b>'+esc(o.scene.label)+'</b><small>· '+esc(o.tag)+'</small><em>'+pad(i+1)+'</em>';el.appendChild(cap);
    var st=document.createElement('span');st.className='stamp';st.innerHTML=esc(K.stamp)+"<svg viewBox=\"0 0 12 12\" aria-hidden=\"true\"><path d=\"M2.5 6.5l2.3 2.3L9.5 4\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.9\" stroke-linecap=\"round\" stroke-linejoin=\"round\"/></svg>";el.appendChild(st);
    el.style.zIndex=String(10-i);el.style.transform=stackT(i)+' translateY(40px)';
    deck.appendChild(el);cards.push(el);
    var d=document.createElement('i');d.className='dot';dots.appendChild(d);dotEls.push(d);
  }
  idx=0;busy=false;phase='';drag=null;scene.classList.remove('is-final','is-drag');
  setCopy(0);drawDots();
}
function setCopy(i){var o=order[i];setTitle(o.scene.title);setWord(K.words[o.key]||o.scene.word)}
function drawDots(){for(var i=0;i<dotEls.length;i++){dotEls[i].classList.toggle('is-on',!!order[i].passed);dotEls[i].classList.toggle('is-cur',i===idx&&phase==='play')}}
function layout(){for(var k=idx;k<cards.length;k++){var d=k-idx,el=cards[k];el.style.zIndex=String(10-d);el.style.transform=stackT(d);el.style.opacity=d>3?'0':'1'}}
function armAuto(){later(function(){if(phase==='play'&&!drag)dismiss(1,false)},T.show)}
function armHint(){later(function(){if(phase==='play'&&!userPlayed){showHint(scene);emit('state')}},T.hint)}
function tap(){card.classList.remove('is-tap');void card.offsetWidth;card.classList.add('is-tap')}
function dismiss(dir,byUser,dy){
  if(phase!=='play'||busy||idx>=order.length)return;busy=true;clearTimers();
  var i=idx,o=order[i],el=cards[i];o.passed=true;o.visited=true;
  if(byUser){userPlayed=true;hideHint(scene)}
  el.classList.remove('is-drag');el.classList.add('is-stamp');tap();
  var r=el.getBoundingClientRect(),s=scene.getBoundingClientRect(),sc=(s.width||518)/518;burst.style.left=((r.left+r.width/2-s.left)/sc).toFixed(0)+'px';burst.style.top=((r.top+r.height*.44-s.top)/sc).toFixed(0)+'px';sparks(burst);
  drawDots();emit('state');

    el.classList.add('is-out');el.style.transform='translate('+(dir*780)+'px,'+((dy||0)+18)+'px) rotate('+(dir*24)+'deg)';
    idx=i+1;busy=false;

    layout();setCopy(idx);drawDots();emit('state');armAuto();
  },byUser?170:T.stampToFly);

function finish(){
  if(phase==='final')return;phase='final';busy=false;drag=null;clearTimers();hideHint(scene);scene.classList.remove('is-drag');
  for(var i=0;i<order.length;i++){order[i].visited=true;order[i].passed=true;var el=cards[i];el.classList.remove('is-out','is-drag');el.classList.add('is-fan','is-stamp');el.style.zIndex=String(10+i);el.style.opacity='1';el.style.transitionDelay=(i*70)+'ms';el.style.transform=fanT(i)}
  scene.classList.add('is-final');setTitle(K.final.title);setWord(K.final.word);drawDots();markFinal();emit('state');
  later(function(){markEnded();emit('state')},T.hold);

function reset(){clearTimers();phase='';busy=false;drag=null;idx=0;scene.classList.remove('is-final','is-drag');hideHint(scene);card.classList.remove('is-tap')}
function start(){
  live=true;
  if(reduced){ad.classList.add('is-in','is-live');phase='play';finish();clearTimers();markEnded();emit('state');return}
  intro(function(){
    for(var i=cards.length-1;i>=0;i--)(function(k,delay){later(function(){var el=cards[k];el.style.opacity='1';el.style.transform=stackT(k)},delay)})(i,(cards.length-1-i)*110);
    later(function(){phase='play';drawDots();emit('state');armAuto();if(!userPlayed)armHint()},T.enter);
  });
  emit('state');
}

function replay(){reset();userPlayed=true;build();start()}
/* etkileşim: en üstteki baskıyı kaydır (sağa/sola) ya da dokun */
function scale(){var r=scene.getBoundingClientRect();return (r.width||518)/518}
scene.addEventListener('pointerdown',function(e){
  if(within(e.target,'again'))return;e.preventDefault();e.stopPropagation();
  if(phase!=='play'||busy)return;
  try{scene.setPointerCapture(e.pointerId)}catch(err){}
  drag={id:e.pointerId,sx:e.clientX,sy:e.clientY,dx:0,dy:0,moved:false};
  userPlayed=true;hideHint(scene);clearTimers();scene.classList.add('is-drag');cards[idx].classList.add('is-drag');emit('state');
});
scene.addEventListener('pointermove',function(e){
  if(!drag||e.pointerId!==drag.id)return;var s=scale();drag.dx=(e.clientX-drag.sx)/s;drag.dy=(e.clientY-drag.sy)/s;
  if(!drag.moved&&(Math.abs(drag.dx)>5||Math.abs(drag.dy)>5))drag.moved=true;if(!drag.moved)return;
  cards[idx].style.transform='translate('+drag.dx.toFixed(1)+'px,'+(drag.dy*.35).toFixed(1)+'px) rotate('+(drag.dx*.06).toFixed(2)+'deg)';
});
function endDrag(e){
  if(!drag||(e&&e.pointerId!==drag.id))return;try{scene.releasePointerCapture(drag.id)}catch(err){}
  var d=drag;drag=null;scene.classList.remove('is-drag');var el=cards[idx];
  if(phase!=='play'){if(el)el.classList.remove('is-drag');return}
  if(!d.moved){dismiss(1,true,0);return}
  if(Math.abs(d.dx)>80){dismiss(d.dx>0?1:-1,true,d.dy*.35);return}
  el.classList.remove('is-drag');el.style.transform=stackT(0);armAuto();emit('state');
}
scene.addEventListener('pointerup',endDrag);scene.addEventListener('pointercancel',endDrag);
scene.addEventListener('click',function(e){e.stopPropagation()});
again.addEventListener('click',function(e){e.stopPropagation();replay()});
engine.key=function(e){if(phase!=='play')return;if(e.key==='ArrowRight'||e.key==='ArrowLeft'){e.preventDefault();dismiss(e.key==='ArrowRight'?1:-1,true,0)}};
engine.restart=restart;

S=readSignals();build();start();
