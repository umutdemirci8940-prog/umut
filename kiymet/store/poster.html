<!doctype html>
<!--
  Kıymet mağaza görselleri (çalışma dosyası).
  Başlıkları POSTERS listesinden değiştirip tools/render-store.sh ile yeniden üretin.
  Parametreler: ?i=<sıra>&size=ios|play|feature
-->
<html lang="tr">
<head>
<meta charset="utf-8">
<style>
  :root { --navy: #0E1A2B; --gold: #E7B941; }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { width: var(--w); height: var(--h); overflow: hidden; }
  body {
    font-family: 'Inter Display', 'Inter', sans-serif;
    background:
      radial-gradient(ellipse 70% 45% at 50% 18%, rgba(233,184,58,.28), transparent 70%),
      radial-gradient(ellipse 90% 60% at 50% 110%, rgba(64,110,180,.35), transparent 70%),
      linear-gradient(180deg, #13243F 0%, #0B1526 60%, #081120 100%);
    color: #fff; position: relative;
  }
  .grain { position: absolute; inset: 0; opacity: .06;
    background-image: radial-gradient(#fff 1px, transparent 1px); background-size: calc(var(--u) * 6) calc(var(--u) * 6); }
  .head { position: absolute; left: 0; right: 0; top: calc(var(--u) * 70); text-align: center; padding: 0 calc(var(--u) * 70); }
  .brand { display: inline-flex; align-items: center; gap: calc(var(--u) * 14); font-weight: 700;
    font-size: calc(var(--u) * 40); color: #E9D9A8; letter-spacing: .5px; }
  .brand img { width: calc(var(--u) * 64); height: calc(var(--u) * 64); }
  h1 { margin-top: calc(var(--u) * 34); font-weight: 800; font-size: calc(var(--u) * 104); line-height: 1.04; letter-spacing: -2px; }
  h1 em { font-style: normal;
    background: linear-gradient(180deg, #FFF0B0 0%, #F0C64E 50%, #C7911C 100%);
    -webkit-background-clip: text; background-clip: text; color: transparent; }
  p.sub { margin-top: calc(var(--u) * 26); font-family: 'Inter', sans-serif; font-weight: 500;
    font-size: calc(var(--u) * 42); line-height: 1.35; color: #C7D2E4; }

  .device { position: absolute; left: 50%; transform: translateX(-50%);
    top: var(--devTop); width: var(--devW); aspect-ratio: 1290 / 2796; border-radius: calc(var(--devW) * .135);
    padding: calc(var(--devW) * .022); background: linear-gradient(145deg, #3A4A63, #121B2B 45%, #2B3850);
    box-shadow: 0 calc(var(--u) * 40) calc(var(--u) * 90) rgba(0,0,0,.55), 0 0 0 calc(var(--u) * 3) rgba(255,255,255,.08) inset; }
  .screen { position: relative; width: 100%; height: 100%; border-radius: calc(var(--devW) * .115); overflow: hidden; background: #F7F5EF; }
  .screen img.shot { width: 100%; height: 100%; display: block; }
  .status { position: absolute; left: 0; right: 0; top: 0; height: 6.33%; display: flex; align-items: center;
    justify-content: space-between; padding: 0 9% 0 11%; font-family: 'Inter', sans-serif; font-weight: 600;
    font-size: calc(var(--devW) * .041); color: #111; }
  .island { position: absolute; top: 1.3%; left: 50%; transform: translateX(-50%); width: 29%; height: 3.9%;
    background: #000; border-radius: 999px; }
  .status svg { height: calc(var(--devW) * .03); }
  .dim .status { color: #fff; }

  /* Play öne çıkan görsel */
  body.feature .head { text-align: left; top: 50%; transform: translateY(-50%); left: calc(var(--u) * 60); right: auto; width: 56%; padding: 0; }
  body.feature .logo-h { height: calc(var(--u) * 120); }
  body.feature h1 { font-size: calc(var(--u) * 58); margin-top: calc(var(--u) * 22); }
  body.feature p.sub { font-size: calc(var(--u) * 24); margin-top: calc(var(--u) * 14); }
</style>
</head>
<body>
<div class="grain"></div>
<div class="head" id="head"></div>
<div id="dev"></div>
<script>
const POSTERS = [
  { shot: '01_portfoy', title: 'Tüm <em>kıymetlerin</em><br>tek yerde', sub: 'Altın, döviz ve kripto<br>tek ekranda, canlı fiyatlarla.' },
  { shot: '06_alacak_detay', title: 'Enflasyon ne kadar<br><em>eritti?</em>', sub: 'Verdiğin borcun bugünkü<br>gerçek değerini gör.', dim: true },
  { shot: '02_piyasalar_altin', title: 'Çeyrekten bileziğe<br><em>her altın</em>', sub: 'Gram, çeyrek, yarım, tam, Cumhuriyet<br>ve ayar altınlar anlık.' },
  { shot: '05_alacak_borc', title: 'Alacağını<br><em>unutma</em>', sub: 'Kime ne verdin, bugün kaç TL ediyor;<br>hepsi kayıtlı.' },
  { shot: '04_varlik_ekle', title: 'Alış fiyatı<br><em>otomatik</em>', sub: 'Tarihi seç, o günün fiyatı gelsin;<br>toplam tutar hemen hesaplansın.' },
  { shot: '03_piyasalar_kripto', title: 'Kripto paralar<br><em>da burada</em>', sub: "Bitcoin, Ethereum, Solana<br>ve onlarca kripto para anlık." },
];
const SIZES = {
  ios:     { w: 1320, h: 2868, devW: 1010, devTop: 700 },
  play:    { w: 1080, h: 1920, devW: 640,  devTop: 560 },
  feature: { w: 1024, h: 500 },
};
const q = new URLSearchParams(location.search);
const size = SIZES[q.get('size') || 'ios'];
const poster = POSTERS[(+q.get('i') || 1) - 1];
const u = size.w / 1320; // ölçek birimi
const root = document.documentElement.style;
root.setProperty('--w', size.w + 'px'); root.setProperty('--h', size.h + 'px'); root.setProperty('--u', u + 'px');

const statusBar = `<div class="island"></div><div class="status"><span>9:41</span><span style="display:flex;gap:6px;align-items:center">
  <svg viewBox="0 0 34 22"><g fill="currentColor"><rect x="0" y="14" width="6" height="8" rx="1.5"/><rect x="9" y="10" width="6" height="12" rx="1.5"/><rect x="18" y="5" width="6" height="17" rx="1.5"/><rect x="27" y="0" width="6" height="22" rx="1.5"/></g></svg>
  <svg viewBox="0 0 30 22"><path fill="currentColor" d="M15 4c4.6 0 8.8 1.8 11.9 4.7l2.1-2.2C25.3 2.9 20.4.8 15 .8S4.7 2.9 1 6.5l2.1 2.2C6.2 5.8 10.4 4 15 4zm0 6.2c2.9 0 5.5 1.1 7.5 2.9l2.1-2.2c-2.5-2.4-5.9-3.8-9.6-3.8s-7.1 1.4-9.6 3.8l2.1 2.2c2-1.8 4.6-2.9 7.5-2.9zm0 6.2c1.2 0 2.3.5 3.1 1.2L15 21l-3.1-3.4c.8-.7 1.9-1.2 3.1-1.2z"/></svg>
  <svg viewBox="0 0 50 22"><rect x="1" y="1" width="42" height="20" rx="6" fill="none" stroke="currentColor" stroke-opacity=".4" stroke-width="2"/><rect x="4" y="4" width="34" height="14" rx="3.5" fill="currentColor"/><rect x="45.5" y="7" width="3" height="8" rx="1.5" fill="currentColor" fill-opacity=".4"/></svg>
</span></div>`;

if (q.get('size') === 'feature') {
  document.body.classList.add('feature');
  document.getElementById('head').innerHTML =
    `<img class="logo-h" src="../brand/export/logo-horizontal.png">
     <h1>Paranın <em>gerçek</em> değerini gör</h1>
     <p class="sub">Altın, döviz, kripto ve alacaklar tek yerde.</p>`;
  const dev = document.getElementById('dev');
  dev.innerHTML = `<div class="device" style="left:auto;right:${70*u}px;transform:rotate(-8deg);--devW:${300}px;--devTop:${40}px;top:${40}px">
     <div class="screen"><img class="shot" src="screens-raw/01_portfoy.png">${statusBar}</div></div>`;
} else {
  document.getElementById('head').innerHTML =
    `<div class="brand"><img src="../brand/export/mark-1024.png">Kıymet</div>
     <h1>${poster.title}</h1><p class="sub">${poster.sub}</p>`;
  root.setProperty('--devW', size.devW + 'px'); root.setProperty('--devTop', size.devTop + 'px');
  document.getElementById('dev').innerHTML =
    `<div class="device"><div class="screen ${poster.dim ? 'dim' : ''}"><img class="shot" src="screens-raw/${poster.shot}.png">${statusBar}</div></div>`;
}
</script>
</body>
</html>
