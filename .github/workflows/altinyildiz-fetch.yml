name: Altınyıldız Classics – siteden görselleri çek

# Bulut oturumunun ağ politikası altinyildizclassics.com'a erişemediği için görseller
# GitHub sunucusunda Playwright ile toplanır ve dala geri push'lanır.
on:
  workflow_dispatch:
  push:
    paths:
      - 'altinyildiz-classics/tools/fetch-site.js'
      - 'altinyildiz-classics/.fetch-trigger'

permissions:
  contents: write

jobs:
  fetch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref }}
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Playwright + Chromium kur
        run: |
          npm install --no-save --no-package-lock playwright@1.56.1
          npx playwright install --with-deps chromium
      - name: Siteden görselleri topla
        run: node altinyildiz-classics/tools/fetch-site.js
      - name: Özet
        run: ls -la altinyildiz-classics/assets/raw altinyildiz-classics/assets/raw/img | head -200
      - name: Dala push'la
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A altinyildiz-classics/assets/raw
          git commit -m "Altınyıldız Classics: siteden ham görseller (GitHub Actions)" || { echo "Değişiklik yok"; exit 0; }
          git pull --rebase origin ${GITHUB_REF_NAME} || true
          git push
