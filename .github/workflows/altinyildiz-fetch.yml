name: Altınyıldız Classics – siteden görselleri çek

# Bulut oturumunun ağ politikası altinyildizclassics.com'a erişemediği için orijinal ürün görselleri,
# logo ve fiyatlar GitHub'ın kendi sunucusunda Playwright ile çekilip dala geri push'lanır.
# Tetikleme: altinyildiz/tools/ veya altinyildiz/fetch.trigger değiştiğinde push ile ya da elle (Run workflow).
on:
  push:
    paths:
      - 'altinyildiz/tools/fetch-site.js'
      - 'altinyildiz/fetch.trigger'
      - '.github/workflows/altinyildiz-fetch.yml'
  workflow_dispatch:
    inputs:
      per:
        description: Kategori başına ürün sayısı
        default: '6'

permissions:
  contents: write

jobs:
  fetch:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref }}

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Playwright + Chromium kur
        run: |
          npm install --no-save --no-package-lock playwright@1.56.1
          npx playwright install --with-deps chromium

      - name: Siteden görselleri, logoyu ve fiyatları çek
        run: node altinyildiz/tools/fetch-site.js --per=${{ inputs.per || '6' }}

      - name: Özet
        run: |
          ls -la altinyildiz/assets/site altinyildiz/assets/site/products | head -80
          du -sh altinyildiz/assets/site

      - name: Sonuçları dala push'la
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A altinyildiz/assets/site
          git commit -m "Altınyıldız Classics: siteden orijinal ürün görselleri ve logo (GitHub Actions)" || { echo "Değişiklik yok"; exit 0; }
          for i in 1 2 3; do git pull --rebase origin "${GITHUB_REF_NAME}" && git push origin "HEAD:${GITHUB_REF_NAME}" && break; sleep 5; done
