name: Superonline kampanya sayfasını ziyaret et

# Bulut oturumunun ağ politikası superonline.net'e erişemediği için sayfa GitHub'ın
# sunucusunda gerçek Chromium ile açılır; metin, ekran görüntüleri ve logo dala geri push'lanır.
on:
  workflow_dispatch:
  push:
    branches: [claude/zen-keller-lw23zy]
    paths: [superonline/tools/visit-site.js, .github/workflows/visit-superonline.yml]

permissions:
  contents: write

jobs:
  visit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Playwright + Chromium kur
        run: |
          npm install --no-save --no-package-lock playwright@1.56.1
          npx playwright install --with-deps chromium
      - name: Sayfayı ziyaret et
        run: node superonline/tools/visit-site.js
      - name: Sonuçları dala push'la
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A superonline/research
          git commit -m "Superonline kampanya sayfası ziyaret çıktıları (GitHub Actions)" || { echo "Değişiklik yok"; exit 0; }
          git push
