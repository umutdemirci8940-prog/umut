name: oasismedia.com.tr içeriğini ve logolarını çek

# Bulut oturumunun ağ politikası oasismedia.com.tr'ye erişemediği için site GitHub sunucusunda
# indirilir (HTML + görseller + logolar) ve oasismedia/source/ altına geri push'lanır.
on:
  workflow_dispatch:
  push:
    paths:
      - .github/workflows/oasis-mirror.yml

permissions:
  contents: write

jobs:
  mirror:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref }}

      - name: Siteyi indir
        run: |
          mkdir -p oasismedia/source && cd oasismedia/source
          UA="Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/129.0 Safari/537.36"
          wget --mirror --level=2 --page-requisites --adjust-extension --no-parent \
               --span-hosts --domains=oasismedia.com.tr,www.oasismedia.com.tr \
               --reject-regex '(wp-json|xmlrpc|feed|\?replytocom|/wp-admin)' \
               -e robots=off --user-agent="$UA" --tries=3 --timeout=30 --wait=0.3 \
               https://oasismedia.com.tr/ || true
          for p in about-us contact-us reklam-formatlari; do
            wget -q -e robots=off --user-agent="$UA" -x --adjust-extension "https://oasismedia.com.tr/$p/" || true
          done
          # Sitedeki tüm upload görsellerini (logolar, referans logoları) ayrıca topla
          grep -rhoE 'https?://(www\.)?oasismedia\.com\.tr/wp-content/uploads/[^"'"'"' )>]+\.(png|jpe?g|svg|webp|gif)' . | sort -u > upload-urls.txt || true
          mkdir -p uploads && (cd uploads && wget -q -nc -e robots=off --user-agent="$UA" -i ../upload-urls.txt || true)
          find . -type f | sort > files.txt
          du -sh . ; wc -l files.txt

      - name: Metin dökümü
        run: |
          pip install -q beautifulsoup4
          python3 - <<'PY'
          import pathlib, json
          from bs4 import BeautifulSoup
          out = {}
          for f in pathlib.Path('oasismedia/source').rglob('*.html'):
              s = BeautifulSoup(f.read_text(errors='ignore'), 'html.parser')
              for t in s(['script','style','noscript']): t.decompose()
              imgs = [{'src': i.get('src') or i.get('data-src'), 'alt': i.get('alt')} for i in s.find_all('img')]
              links = sorted({a.get('href') for a in s.find_all('a') if a.get('href')})
              text = '\n'.join(l.strip() for l in s.get_text('\n').splitlines() if l.strip())
              out[str(f)] = {'title': s.title.string if s.title else None, 'text': text, 'images': imgs, 'links': links}
          pathlib.Path('oasismedia/source/content.json').write_text(json.dumps(out, ensure_ascii=False, indent=1))
          PY

      - name: Dala push'la
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A oasismedia/source
          git commit -m "oasismedia.com.tr içeriği ve görselleri (GitHub Actions)" || { echo "Değişiklik yok"; exit 0; }
          git pull --rebase origin ${{ github.ref_name }} || true
          git push
