name: Altınyıldız Classics – ürün sayfalarından görsel çek

on:
  workflow_dispatch:
  push:
    paths:
      - 'altinyildiz-classics/src/ac-urunler.json'
      - 'altinyildiz-classics/tools/fetch-products.js'

permissions:
  contents: write

jobs:
  products:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref }}
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: |
          npm install --no-save --no-package-lock playwright@1.56.1
          npx playwright install --with-deps chromium
      - run: node altinyildiz-classics/tools/fetch-products.js
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A altinyildiz-classics/assets/raw-ac
          git commit -m "Altınyıldız Classics: AC ürün görselleri (GitHub Actions)" || exit 0
          git pull --rebase origin ${GITHUB_REF_NAME} || true
          git push
