name: Pluxee – siteden logo ve kart görselini çek, derle

# Bulut oturumunun ağ politikası pluxee.com.tr'ye erişemediği için varlıklar GitHub'ın kendi
# sunucusunda indirilir, optimize edilir, üç konsept derlenir, test edilir ve dala geri push'lanır.
on:
  # Dal varsayılan dal olmadığı için "Run workflow" düğmesi görünmez; pluxee/assets/.fetch-trigger dosyasını
  # değiştirip push'lamak iş akışını çalıştırır. Varsayılan dala alınırsa workflow_dispatch da kullanılabilir.
  push:
    branches: ['claude/**', 'main', 'master']
    paths: ['pluxee/assets/.fetch-trigger']
  workflow_dispatch:
    inputs:
      logo_url:
        description: Logo adresi (boşsa sitede aranır)
        default: ''
      card_url:
        description: Kart görseli adresi (boşsa sitede aranır)
        default: ''

permissions:
  contents: write

jobs:
  fetch-and-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref }}

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Siteden logo, kart ve sahne fotoğraflarını çek
        run: node pluxee/tools/fetch-pluxee-assets.js ${{ inputs.logo_url && format('--logo={0}', inputs.logo_url) || '' }} ${{ inputs.card_url && format('--card={0}', inputs.card_url) || '' }}

      - name: Playwright + Chromium kur
        run: |
          npm install --no-save --no-package-lock playwright@1.56.1
          npx playwright install --with-deps chromium

      - name: Görselleri optimize et
        run: node pluxee/tools/optimize-pluxee-assets.js

      - name: Konseptleri derle
        run: node pluxee/build.js

      - name: Ekran görüntüleri
        continue-on-error: true
        run: node pluxee/tools/capture.js

      - name: Duman testi
        continue-on-error: true
        run: node pluxee/tools/smoke.js

      - name: Varlık özeti
        run: |
          node -e "const fs=require('fs');const m=JSON.parse(fs.readFileSync('pluxee/assets/manifest.json','utf8'));const p=fs.existsSync('pluxee/assets/photos.json')?JSON.parse(fs.readFileSync('pluxee/assets/photos.json','utf8')):{};console.log(JSON.stringify({logo:m.logo,card:m.card,slots:p.slots,site:(p.site||[]).map(s=>s.file+' '+s.w+'x'+s.h+' '+s.tags.join(','))},null,1))"

      - uses: actions/upload-artifact@v4
        with:
          name: pluxee-masthead-konseptleri
          path: |
            pluxee/dist
            pluxee/preview
            pluxee/assets
          if-no-files-found: error

      - name: Sonuçları dala push'la
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A pluxee/assets pluxee/dist pluxee/preview
          git reset -q pluxee/assets/photos/standin 2>/dev/null || true
          git commit -m "Pluxee: siteden gerçek logo, kart ve sahne fotoğraflarıyla derleme (GitHub Actions) [skip ci]" || { echo "Değişiklik yok"; exit 0; }
          git push
