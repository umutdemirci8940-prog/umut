name: tabii.com'dan marka varlıklarını çek

# Bulut oturumunun ağ politikası tabii.com'a erişemediği için logo, renkler ve fontlar
# GitHub'ın sunucusunda çekilir ve dala geri push'lanır.
on:
  workflow_dispatch:
  push:
    branches: [claude/charming-ramanujan-ub8q4r]
    paths: [tabii-4dortluk/tools/fetch-site.js, tabii-4dortluk/tools/fetch-posters.js, .github/workflows/tabii-fetch.yml]

permissions:
  contents: write

jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref }}
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Playwright + Chromium kur
        run: |
          npm install --no-save --no-package-lock playwright@1.56.1
          npx playwright install --with-deps chromium
      - name: tabii.com/tr varlıklarını çek
        run: node tabii-4dortluk/tools/fetch-site.js
      - name: Dizi/film afişlerini çek
        run: node tabii-4dortluk/tools/fetch-posters.js
      - name: Sonuçları dala push'la
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A tabii-4dortluk/assets
          git commit -m "tabii.com/tr marka varlıkları (GitHub Actions)" || { echo "Değişiklik yok"; exit 0; }
          git pull --rebase origin ${{ github.ref_name }}
          git push
