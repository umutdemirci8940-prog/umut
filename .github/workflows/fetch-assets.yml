name: Siteden görselleri çek ve derle

# Bulut oturumunun ağ politikası ilacsizyasam.com'a erişemediği için görseller
# GitHub'ın kendi sunucusunda indirilir, optimize edilir, bannerlar derlenir ve dala geri push'lanır.
on:
  workflow_dispatch:
    inputs:
      task:
        description: Görev
        type: choice
        default: tchibo-logo
        options:
          - tchibo-logo
          - tchibo-video
          - ilacsizyasam-assets
      video_id:
        description: Kampanya videosu YouTube kimliği (tchibo-video görevi)
        default: QD5d6irb-ZA
      tolerance:
        description: Fon temizleme toleransı (0-255)
        default: '22'
      height:
        description: Ürün görseli azami yüksekliği (px)
        default: '460'
      quality:
        description: WebP kalitesi (0-1)
        default: '0.8'
      keep_bg:
        description: Fon temizlemeyi kapat (kart görünümü)
        type: boolean
        default: false

permissions:
  contents: write

jobs:
  # ---------------------------------------------------------------------------
  # Tchibo masthead: resmi logoyu indir, şeffaf PNG render et, masthead'i derle, dala push'la.
  # (Bulut oturumunun ağ politikası tchibo.com.tr ve Wikimedia'ya erişemediği için burada çalışır.)
  tchibo-logo:
    if: ${{ inputs.task == 'tchibo-logo' }}
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: tchibo-barista-colombia
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref }}

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Resmi logoyu indir
        run: node tools/fetch-logo.js

      - name: Playwright + Chromium kur
        run: |
          npm install --no-save --no-package-lock playwright@1.56.1
          npx playwright install --with-deps chromium

      - name: Logoyu şeffaf PNG olarak render et (özgün + krem)
        run: node tools/render-logo.js

      - name: Masthead'i derle
        run: node build.js

      - name: Ekran görüntüleri
        run: node tools/capture.js

      - uses: actions/upload-artifact@v4
        with:
          name: tchibo-masthead
          path: |
            tchibo-barista-colombia/dist
            tchibo-barista-colombia/preview/screens
            tchibo-barista-colombia/assets/logo*
          if-no-files-found: error

      - name: Sonuçları dala push'la
        working-directory: .
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A tchibo-barista-colombia/assets tchibo-barista-colombia/dist tchibo-barista-colombia/preview/screens
          git commit -m "Tchibo resmi logosu ile masthead derlemesi (GitHub Actions)" || { echo "Değişiklik yok"; exit 0; }
          git push

  # ---------------------------------------------------------------------------
  # Tchibo kampanya videosu: YouTube'dan indir, kareleri ve 960p sessiz kopyayı assets/video altına al, dala push'la.
  tchibo-video:
    if: ${{ inputs.task == 'tchibo-video' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref }}

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: ffmpeg
        run: sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg >/dev/null

      - name: Videoyu indir, kareleri çıkar
        run: bash tchibo-barista-colombia/tools/fetch-video.sh "${{ inputs.video_id }}"

      - uses: actions/upload-artifact@v4
        with:
          name: tchibo-kampanya-videosu
          path: |
            tchibo-barista-colombia/assets/video
            .video-original
          if-no-files-found: warn

      - name: Sonuçları dala push'la
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A tchibo-barista-colombia/assets/video
          git commit -m "Tchibo kampanya videosu kareleri ve 960p kopya (GitHub Actions)" || { echo "Değişiklik yok"; exit 0; }
          git push

  # ---------------------------------------------------------------------------
  # İlaçsız Yaşam banner seti: siteden görselleri çek ve derle (önceki görev).
  fetch-and-build:
    if: ${{ inputs.task == 'ilacsizyasam-assets' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref }}

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Siteden ürün görselleri, logo ve fiyatları çek
        run: node tools/fetch-assets.js

      - name: Playwright + Chromium kur
        run: |
          npm install --no-save --no-package-lock playwright@1.56.1
          npx playwright install --with-deps chromium

      - name: Görselleri optimize et
        run: node tools/optimize-assets.js --tolerance=${{ inputs.tolerance }} --height=${{ inputs.height }} --quality=${{ inputs.quality }} ${{ inputs.keep_bg && '--keep-bg' || '' }}

      - name: Bannerları derle
        run: node build.js

      - name: Ekran görüntüleri ve etkileşim testi
        run: |
          node tools/capture.js
          node tools/smoke.js

      - name: Teslim paketini üret
        run: node tools/package.js

      - name: Manifest özeti
        run: |
          node -e "const m=require('./assets/manifest.json');console.log(JSON.stringify({logo:m.logo,products:m.products.map(p=>({key:p.key,title:p.title,price:p.price,image:p.image&&(p.image.optimized||p.image.file),transparent:p.image&&p.image.transparent}))},null,1))"

      - uses: actions/upload-artifact@v4
        with:
          name: ilacsizyasam-banner-seti
          path: |
            release/ilacsizyasam-banner-seti.zip
            preview/screens
            assets
          if-no-files-found: error

      - name: Sonuçları dala push'la
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A assets dist preview/screens release
          git commit -m "Siteden gerçek ürün görselleri ve logo ile derleme (GitHub Actions)" || { echo "Değişiklik yok"; exit 0; }
          git push
