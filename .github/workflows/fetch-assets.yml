name: Siteden görselleri çek ve derle

# Bulut oturumunun ağ politikası hedef sitelere erişemediği için görseller GitHub'ın kendi
# sunucusunda indirilir ve dala geri push'lanır. Dosya adı, workflow_dispatch'in varsayılan
# daldaki kayıtlı yolla tetiklenebilmesi için "fetch-assets.yml" olarak korunur.
on:
  workflow_dispatch:
    inputs:
      task:
        description: Görev
        type: choice
        options: [turkiyesigorta, ilacsizyasam]
        default: turkiyesigorta
      hosts:
        description: (turkiyesigorta) Denenecek alan adları (virgülle)
        default: 'https://www.turkiyesigorta.com.tr,https://turkiyesigorta.com.tr,https://bireysel.turkiyesigorta.com.tr'
      max_img:
        description: (turkiyesigorta) En fazla görsel sayısı
        default: '90'
      tolerance:
        description: (ilacsizyasam) Fon temizleme toleransı (0-255)
        default: '22'
      height:
        description: (ilacsizyasam) Ürün görseli azami yüksekliği (px)
        default: '460'
      quality:
        description: (ilacsizyasam) WebP kalitesi (0-1)
        default: '0.8'
      keep_bg:
        description: (ilacsizyasam) Fon temizlemeyi kapat
        type: boolean
        default: false

permissions:
  contents: write

jobs:
  turkiyesigorta:
    if: ${{ inputs.task == 'turkiyesigorta' }}
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: turkiyesigorta
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref }}

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Playwright + Chromium kur
        run: |
          npm install --no-save --no-package-lock playwright@1.56.1
          npx playwright install --with-deps chromium

      - name: turkiyesigorta.com.tr üzerinden logo, görsel, renk ve metinleri topla
        continue-on-error: true
        run: node tools/fetch-site.js --hosts="${{ inputs.hosts }}" --max-img=${{ inputs.max_img }}

      - name: Rapor özeti
        if: always()
        run: |
          if [ -f assets/site/report.md ]; then sed -n '1,120p' assets/site/report.md; else echo "assets/site/report.md yok"; fi
          du -sh assets/site 2>/dev/null || true

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: turkiyesigorta-site-assets
          path: turkiyesigorta/assets/site
          if-no-files-found: warn

      - name: Sonuçları dala push'la
        if: always()
        working-directory: .
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A turkiyesigorta/assets/site
          git commit -m "Türkiye Sigorta: siteden çekilen logo, görsel, renk ve metinler (GitHub Actions)" || { echo "Değişiklik yok"; exit 0; }
          git pull --rebase origin "${GITHUB_REF_NAME}" || true
          git push

  ilacsizyasam:
    if: ${{ inputs.task == 'ilacsizyasam' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref }}

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Siteden ürün görselleri, logo ve fiyatları çek
        run: node tools/fetch-assets.js

      - name: Playwright + Chromium kur
        run: |
          npm install --no-save --no-package-lock playwright@1.56.1
          npx playwright install --with-deps chromium

      - name: Görselleri optimize et
        run: node tools/optimize-assets.js --tolerance=${{ inputs.tolerance }} --height=${{ inputs.height }} --quality=${{ inputs.quality }} ${{ inputs.keep_bg && '--keep-bg' || '' }}

      - name: Bannerları derle
        run: node build.js

      - name: Ekran görüntüleri ve etkileşim testi
        run: |
          node tools/capture.js
          node tools/smoke.js

      - name: Teslim paketini üret
        run: node tools/package.js

      - uses: actions/upload-artifact@v4
        with:
          name: ilacsizyasam-banner-seti
          path: |
            release/ilacsizyasam-banner-seti.zip
            preview/screens
            assets
          if-no-files-found: error

      - name: Sonuçları dala push'la
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A assets dist preview/screens release
          git commit -m "Siteden gerçek ürün görselleri ve logo ile derleme (GitHub Actions)" || { echo "Değişiklik yok"; exit 0; }
          git push
