name: Siteden görselleri çek ve derle

# KFC Türkiye: bulut oturumunun ağ politikası kfcturkiye.com'a kapalı olduğu için sitenin gerçek görselleri,
# videoları, logosu ve fontları GitHub'ın kendi sunucusunda toplanır ve dala geri push'lanır.
# (workflow_dispatch yalnızca varsayılan daldaki kayıtlı yolları tanıdığı için dosya adı fetch-assets.yml kaldı.)
on:
  workflow_dispatch:
    inputs:
      max_video_mb:
        description: Video başına azami boyut (MB)
        default: '60'
      max_total_mb:
        description: Toplam indirme sınırı (MB)
        default: '400'

permissions:
  contents: write

concurrency:
  group: fetch-kfc-${{ github.ref }}
  cancel-in-progress: false

jobs:
  fetch:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref }}

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Playwright + Chromium kur
        run: |
          npm install --no-save --no-package-lock playwright@1.56.1
          npx playwright install --with-deps chromium

      - name: ffmpeg hazır mı
        run: |
          if ! command -v ffmpeg >/dev/null; then sudo apt-get update && sudo apt-get install -y ffmpeg; fi
          ffmpeg -version | head -1

      - name: Siteyi gez, varlıkları topla
        run: node tools/fetch-kfc.js --max-video-mb=${{ inputs.max_video_mb }} --max-total-mb=${{ inputs.max_total_mb }}

      - name: Özet
        run: |
          node -e "const m=require('./assets/kfc/manifest.json');console.log('pages',m.pages.map(p=>[p.path,p.status,p.title,p.imgCount]));console.log('videos',m.videos.map(v=>[v.file,v.w,v.h,v.duration,v.derived]));console.log('fonts',m.theme.fontFaces.map(f=>f.family+' '+f.weight));console.log('colors',m.theme.colors.slice(0,15));console.log('errors',m.errors)"
          du -sh assets/kfc assets/kfc/* | sort -h | tail -12

      - uses: actions/upload-artifact@v4
        with:
          name: kfc-assets
          path: assets/kfc
          if-no-files-found: error

      - name: Sonuçları dala push'la
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A assets/kfc
          git commit -m "KFC: siteden toplanan görsel, video, logo ve font varlıkları (GitHub Actions)" || { echo "Değişiklik yok"; exit 0; }
          git pull --rebase origin "${GITHUB_REF_NAME}" || true
          git push origin HEAD:"${GITHUB_REF_NAME}"
