name: Siteden görselleri çek ve derle

# KFC Türkiye: bulut oturumunun ağ politikası kfcturkiye.com'a kapalı olduğu için sitenin gerçek görselleri,
# videoları, logosu ve fontları GitHub'ın kendi sunucusunda toplanır ve dala geri push'lanır.
# (workflow_dispatch yalnızca varsayılan daldaki kayıtlı yolları tanıdığı için dosya adı fetch-assets.yml kaldı.)
on:
  workflow_dispatch:
    inputs:
      max_video_mb:
        description: Video başına azami boyut (MB)
        default: '60'
      max_total_mb:
        description: Toplam indirme sınırı (MB)
        default: '400'
      budget_min:
        description: İndirme aşaması süre bütçesi (dk)
        default: '18'
      page_budget_min:
        description: Sayfa gezme süre bütçesi (dk)
        default: '10'
      hosts:
        description: Denenecek alan adları (virgülle; boş = varsayılan liste)
        default: ''
      pages_only:
        description: Yalnız sayfaları gez (ekran görüntüsü + sınırlı indirme)
        type: boolean
        default: false
      out_dir:
        description: Çıktı klasörü
        default: 'assets/kfc'

permissions:
  contents: write

concurrency:
  group: fetch-kfc-${{ github.ref }}-${{ github.run_id }}
  cancel-in-progress: false

jobs:
  fetch:
    runs-on: ubuntu-latest
    timeout-minutes: 55
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref }}

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Playwright + Chromium kur
        run: |
          npm install --no-save --no-package-lock playwright@1.56.1
          npx playwright install --with-deps chromium

      - name: ffmpeg hazır mı
        run: |
          if ! command -v ffmpeg >/dev/null; then sudo apt-get update && sudo apt-get install -y ffmpeg; fi
          ffmpeg -version | head -1

      - name: Siteyi gez, varlıkları topla
        run: node tools/fetch-kfc.js --max-video-mb=${{ inputs.max_video_mb }} --max-total-mb=${{ inputs.max_total_mb }} --budget-min=${{ inputs.budget_min }} --page-budget-min=${{ inputs.page_budget_min }} --out=${{ inputs.out_dir }} ${{ inputs.hosts != '' && format('--hosts={0}', inputs.hosts) || '' }} ${{ inputs.pages_only && '--pages-only' || '' }}

      - name: Özet
        if: always()
        run: |
          node -e "const m=require(process.cwd()+'/${{ inputs.out_dir }}/manifest.json');console.log('hosts',m.hostStatus,'archive',m.archiveMode,m.homeTs,'cdx',m.cdx&&m.cdx.counts);console.log('pages',m.pages.map(p=>[p.path,p.status,(p.title||'').slice(0,40),p.imgCount]));console.log('videos',m.videos.map(v=>[v.file,v.w,v.h,v.duration,v.derived]));console.log('fonts',m.theme.fontFaces.map(f=>f.family+' '+f.weight));console.log('colors',m.theme.colors.slice(0,15));console.log('errors',m.errors)"
          du -sh ${{ inputs.out_dir }} ${{ inputs.out_dir }}/* | sort -h | tail -12

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: kfc-assets-${{ github.run_number }}
          path: ${{ inputs.out_dir }}
          if-no-files-found: error

      - name: Sonuçları dala push'la
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A "${{ inputs.out_dir }}"
          git commit -m "KFC: siteden toplanan görsel, video, logo ve font varlıkları (GitHub Actions, ${{ inputs.out_dir }})" || { echo "Değişiklik yok"; exit 0; }
          # Aynı anda biten başka bir koşu manifesti değiştirmişse kendi sürümümüzü koru (-X theirs = bu koşunun commit'i)
          git pull --rebase -X theirs origin "${GITHUB_REF_NAME}" || { git rebase --abort || true; git fetch origin "${GITHUB_REF_NAME}"; git reset --soft "origin/${GITHUB_REF_NAME}"; git add -A "${{ inputs.out_dir }}"; git commit -m "KFC: siteden toplanan varlıklar (GitHub Actions, çakışma sonrası)"; }
          git push origin HEAD:"${GITHUB_REF_NAME}"
