name: Daikin – siteden logo ve ürün görsellerini çek

# Not: workflow_dispatch yalnızca varsayılan dalda kayıtlı dosya yolları için çalıştığından bu iş akışı
# "fetch-assets.yml" adını taşır; içerik bu dalda (Daikin masthead) Daikin varlıklarını çeker.
# Bulut oturumunun ağ politikası daikin.com.tr'ye erişemediği için gerçek marka varlıkları
# GitHub'ın kendi sunucusunda indirilir, küçültülür ve assets/daikin altına push'lanır.
on:
  workflow_dispatch:
    inputs:
      base:
        description: Taban adres(ler), virgülle ayrılmış
        default: 'https://www.daikin.com.tr'
      pages:
        description: Taranacak ürün sayfası sayısı
        default: '8'
      urls:
        description: Doğrudan indirilecek görsel adresleri (virgülle, isteğe bağlı)
        default: ''
      keywords:
        description: Ürün sayfası anahtar kelimeleri (virgülle; boşsa klima varsayılanı)
        default: ''
      models:
        description: Öncelikli model adları (virgülle; boşsa klima varsayılanı)
        default: ''
      out:
        description: Çıktı klasörü
        default: 'assets/daikin'

permissions:
  contents: write

jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref }}

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Playwright, Chromium ve sharp kur
        run: |
          npm install --no-save --no-package-lock playwright@1.56.1 sharp
          npx playwright install --with-deps chromium

      - name: Siteden varlıkları çek
        run: node tools/fetch-daikin.js --base="${{ inputs.base }}" --pages=${{ inputs.pages }} --urls="${{ inputs.urls }}" --keywords="${{ inputs.keywords }}" --models="${{ inputs.models }}" --out="${{ inputs.out }}"

      - name: Rapor
        if: always()
        run: cat "${{ inputs.out }}/report.md" || true

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: daikin-assets
          path: ${{ inputs.out }}
          if-no-files-found: warn

      - name: Sonuçları dala push'la
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A "${{ inputs.out }}"
          git commit -m "Daikin: siteden çekilen logo, ürün görselleri ve rapor (GitHub Actions)" || { echo "Değişiklik yok"; exit 0; }
          git push
