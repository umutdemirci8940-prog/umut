name: Paribu – siteden logo/renkleri çek ve mastheadi derle

# Not: workflow_dispatch yalnızca varsayılan dalda kayıtlı dosya yolları için çalıştığından bu iş akışı
# "fetch-assets.yml" adını taşır; içerik bu dalda (Paribu masthead) Paribu varlıklarını çeker.
# Bulut oturumunun ağ politikası paribu.com'a erişemediği için gerçek logo/sembol/renkler GitHub'ın
# sunucusunda toplanır, masthead gerçek varlıklarla derlenir, ekran görüntüleri/paket üretilir ve dala push'lanır.
on:
  workflow_dispatch:
    inputs:
      base:
        description: Taban adres
        default: 'https://www.paribu.com'
      extra:
        description: Ek sayfalar (virgülle; basın/medya sayfaları logo dosyası için taranır)
        default: 'https://net.paribu.com/medya,https://www.paribu.com/blog/,https://www.paribu.com/hub'
      skip_fetch:
        description: Siteden çekmeyi atla (mevcut assets ile yalnız derle/paketle)
        type: boolean
        default: false

permissions:
  contents: write

defaults:
  run:
    working-directory: paribu-masthead

jobs:
  fetch-and-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref }}

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Playwright + Chromium kur
        run: |
          npm install --no-save --no-package-lock playwright@1.56.1
          npx playwright install --with-deps chromium

      - name: Siteden logo, sembol, renk ve metinleri çek
        if: ${{ !inputs.skip_fetch }}
        continue-on-error: true
        run: node tools/fetch-assets.js --base="${{ inputs.base }}" --extra="${{ inputs.extra }}"

      - name: Logoyu koyu zemine hazırla (kırp / beyazlat)
        continue-on-error: true
        run: node tools/optimize-logo.js

      - name: Rapor özeti
        if: always()
        run: |
          if [ -f assets/report.md ]; then sed -n '1,60p' assets/report.md; else echo "assets/report.md yok"; fi
          if [ -f assets/manifest.json ]; then node -e "const m=require('./assets/manifest.json');console.log(JSON.stringify({logo:m.logo,symbol:m.symbol,brand:m.colors&&m.colors.brand,theme:m.colors&&m.colors.themeColor,fonts:m.fonts},null,1))"; fi

      - name: Mastheadi derle
        run: node build.js

      - name: Ekran görüntüleri, video ve etkileşim testi
        run: |
          node tools/capture.js --video
          node tools/smoke.js

      - name: Teslim paketini üret
        run: node tools/package.js

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: paribu-masthead
          path: |
            paribu-masthead/release
            paribu-masthead/preview/screens
            paribu-masthead/preview/video
            paribu-masthead/assets/manifest.json
            paribu-masthead/assets/report.md
            paribu-masthead/assets/logo
            paribu-masthead/assets/site
          if-no-files-found: warn

      - name: Sonuçları dala push'la
        if: always()
        working-directory: .
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A paribu-masthead/assets paribu-masthead/dist paribu-masthead/preview paribu-masthead/release
          git commit -m "Paribu: siteden çekilen logo/sembol/renkler ile masthead derlemesi (GitHub Actions)" || { echo "Değişiklik yok"; exit 0; }
          git pull --rebase origin "${GITHUB_REF_NAME}" || true
          git push
