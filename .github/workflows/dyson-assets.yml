name: Dyson sitesinden görsel ve video çek

# Bulut oturumunun ağ politikası dyson.com.tr'ye erişemediği için materyaller GitHub sunucusunda indirilir
# ve dyson/assets/raw altına dala geri push'lanır.
on:
  workflow_dispatch:
  push:
    branches: ['claude/**']
    paths: ['dyson/tools/fetch-dyson-assets.js', 'dyson/tools/fetch-dyson-products.js', '.github/workflows/dyson-assets.yml']

permissions:
  contents: write

jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Ürün fotoğrafları (şeffaf PNG)
        run: node dyson/tools/fetch-dyson-products.js
      - name: Özet
        run: cat dyson/assets/products/index.json | head -c 6000
      - name: Dala push'la
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A dyson/assets/products
          git commit -m "Dyson ürün fotoğrafları – şeffaf PNG (GitHub Actions)" || { echo "Değişiklik yok"; exit 0; }
          git pull --rebase origin "${GITHUB_REF_NAME}" && git push
