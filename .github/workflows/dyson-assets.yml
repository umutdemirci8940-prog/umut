name: Dyson sitesinden görsel ve video çek

# Bulut oturumunun ağ politikası dyson.com.tr'ye erişemediği için materyaller GitHub sunucusunda indirilir
# ve dyson/assets/raw altına dala geri push'lanır.
on:
  workflow_dispatch:
  push:
    branches: ['claude/**']
    paths: ['dyson/tools/fetch-dyson-assets.js', '.github/workflows/dyson-assets.yml']

permissions:
  contents: write

jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Playwright + Chromium kur
        run: |
          npm install --no-save --no-package-lock playwright@1.56.1
          npx playwright install --with-deps chromium
      - name: Sayfaları aç, görsel ve videoları topla
        run: ONLY=haircare HEADED=1 xvfb-run -a node dyson/tools/fetch-dyson-assets.js
      - name: Özet
        run: cat dyson/assets/raw/index.json | head -c 6000
      - name: Dala push'la
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A dyson/assets/raw
          git commit -m "Dyson sitesinden ham görsel/video materyalleri (GitHub Actions)" || { echo "Değişiklik yok"; exit 0; }
          git pull --rebase origin "${GITHUB_REF_NAME}" && git push
