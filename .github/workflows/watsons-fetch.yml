name: Watsons 11.11 – siteden görsel arşivini çek

# Bulut oturumunun ağ politikası watsons.com.tr'ye erişemediği için görseller
# GitHub'ın sunucusunda gerçek tarayıcıyla (Playwright) çekilir ve dala geri push'lanır.
on:
  workflow_dispatch:
  push:
    branches: ['claude/**']
    paths:
      - watsons-1111/tools/fetch-site.js
      - watsons-1111/tools/fetch-wayback.js
      - .github/workflows/watsons-fetch.yml

permissions:
  contents: write

jobs:
  fetch:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref }}

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Playwright + Chromium kur
        run: |
          cd watsons-1111
          npm init -y >/dev/null
          npm install --no-save --no-package-lock playwright@1.56.1
          npx playwright install --with-deps chromium

      - name: Görsel arşivini çek (doğrudan; Akamai engellerse Wayback Machine kopyası)
        run: |
          cd watsons-1111
          rm -rf assets/site assets/products assets/shots assets/html assets/cdx assets/index.json
          node tools/fetch-site.js --pages=3 || true
          if node -e "const m=require('./assets/index.json');process.exit(m.site.length>5?0:1)"; then
            echo "Doğrudan erişim başarılı"
          else
            echo "Doğrudan erişim engellendi → Wayback Machine"
            rm -rf assets/site assets/products assets/shots assets/html assets/index.json
            node tools/fetch-wayback.js
          fi

      - name: Özet
        run: |
          cd watsons-1111
          rm -f package.json
          du -sh assets/* && find assets -type f | wc -l
          node -e "const m=require('./assets/index.json');console.log(JSON.stringify({pages:m.pages,logos:m.logos,theme:m.theme},null,1))"

      - name: Sonuçları dala push'la
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A watsons-1111/assets
          git commit -m "watsons.com.tr görsel arşivi (GitHub Actions)" || { echo "Değişiklik yok"; exit 0; }
          git pull --rebase origin "${GITHUB_REF_NAME}" || true
          git push
