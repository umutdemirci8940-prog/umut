name: Selfy Fest sayfasını tara

# Bulut oturumu selfy.com.tr'ye erişemediği için sayfa GitHub sunucusunda ziyaret edilir,
# metin / ekran görüntüsü / görseller selfyfest26/source/ altına kaydedilip dala push'lanır.
on:
  workflow_dispatch:
  push:
    paths:
      - selfyfest26/tools/scrape.js
      - selfyfest26/tools/scrape.trigger

permissions:
  contents: write

jobs:
  scrape:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref }}
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Playwright + Chromium kur
        run: |
          npm install --no-save --no-package-lock playwright@1.56.1
          npx playwright install --with-deps chromium
      - name: HTTP yoklaması
        continue-on-error: true
        run: |
          mkdir -p selfyfest26/source
          curl -sS -L -m 60 -A "Mozilla/5.0 (Windows NT 10.0; Win64; x64) Chrome/141 Safari/537.36" -o selfyfest26/source/raw.html -w "HTTP %{http_code} %{size_download}B %{time_total}s\n" https://www.selfy.com.tr/kampanyalar/selfyfest26 || true
      - name: Sayfayı tara
        timeout-minutes: 8
        run: node selfyfest26/tools/scrape.js || echo "tarama başarısız"

      - name: Özet
        run: |
          head -c 6000 selfyfest26/source/page.txt || true
          ls -la selfyfest26/source selfyfest26/source/img || true
      - name: Sonuçları dala push'la
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A selfyfest26/source
          git commit -m "Selfy Fest '26 kampanya sayfası kaynakları (GitHub Actions)" || { echo "Değişiklik yok"; exit 0; }
          git pull --rebase
          git push
