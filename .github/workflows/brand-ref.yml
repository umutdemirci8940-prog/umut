name: Garanti BBVA / Bonus marka referansı

# Bulut oturumunun ağ politikası garantibbva.com.tr ve bonus.com.tr'ye erişemediği için
# ekran görüntüleri, renkler, fontlar ve logolar GitHub sunucusunda toplanıp dala push'lanır.
on:
  workflow_dispatch:
  push:
    paths:
      - tools/brand-ref.js
      - .github/workflows/brand-ref.yml

permissions:
  contents: write

jobs:
  brand-ref:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Playwright + Chromium kur
        run: |
          npm install --no-save --no-package-lock playwright@1.56.1
          npx playwright install --with-deps chromium
      - name: Marka referansını topla
        run: node tools/brand-ref.js
      - name: Sonuçları dala push'la
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A garanti-bonus-masthead/brand-ref
          git commit -m "Garanti BBVA / Bonus marka referansı (GitHub Actions)" || { echo "Değişiklik yok"; exit 0; }
          git pull --rebase origin ${{ github.ref_name }}
          git push origin HEAD:${{ github.ref_name }}
