<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="ad.size" content="width=970,height=250">
<meta name="viewport" content="width=970,height=250">
<title>Selfy Fest '26 – 970x250 Masthead</title>
<script>var clickTag = "{{CLICK_URL}}";</script>
<style>
{{FONTS}}
:root{
  --violet:#4f0098; --violet-d:#2e0276; --night:#14012f; --magenta:#c13cff;
  --orange:#ff8300; --orange-2:#ffa62b; --pink:#ff3d8b; --white:#fff;
  --glass:rgba(255,255,255,.08); --glass-b:rgba(255,255,255,.28);
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{width:970px;height:250px;overflow:hidden;background:var(--night)}
body{font-family:'Mulish',Arial,sans-serif;color:#fff;-webkit-font-smoothing:antialiased;user-select:none}
#ad{position:relative;width:970px;height:250px;overflow:hidden;cursor:pointer;outline:none;
  background:radial-gradient(120% 140% at 50% 120%,#7a2cff 0%,#4f0098 30%,#2e0276 58%,#14012f 100%)}
#ad:focus-visible{box-shadow:inset 0 0 0 3px var(--orange-2)}
.layer{position:absolute;inset:0;pointer-events:none}

/* ---------- sahne arka planı ---------- */
#bgphoto{background-size:700px auto;background-position:50% -20px;background-repeat:no-repeat;opacity:0;mix-blend-mode:screen;transition:opacity 1.2s;-webkit-mask-image:radial-gradient(36% 62% at 50% 34%,#000 35%,transparent 100%);mask-image:radial-gradient(36% 62% at 50% 34%,#000 35%,transparent 100%)}
#bgphoto.on{opacity:.7}
#haze{background:
  radial-gradient(40% 70% at 50% 0%,rgba(214,120,255,.45),transparent 70%),
  radial-gradient(30% 60% at 12% 10%,rgba(120,60,255,.35),transparent 70%),
  radial-gradient(30% 60% at 88% 10%,rgba(255,80,190,.25),transparent 70%)}
#rings{opacity:.35;background:repeating-radial-gradient(circle at 50% 135%,transparent 0 22px,rgba(220,170,255,.18) 23px,transparent 25px)}
#beams{transition:transform .6s}
.beam{position:absolute;top:-30px;width:150px;height:330px;margin-left:-75px;transform-origin:50% 0;
  background:linear-gradient(180deg,rgba(255,255,255,.55),rgba(206,140,255,.18) 45%,transparent 85%);
  clip-path:polygon(46% 0,54% 0,100% 100%,0 100%);filter:blur(3px);mix-blend-mode:screen;opacity:0;
  transition:transform 1.1s cubic-bezier(.3,.7,.2,1),opacity .8s}
.beam.pink{background:linear-gradient(180deg,rgba(255,170,230,.6),rgba(255,61,139,.2) 45%,transparent 85%)}
.on .beam{opacity:.8}
#crowd{top:auto;height:96px;bottom:0;opacity:.95}
#spot{background:radial-gradient(140px 140px at var(--mx,50%) var(--my,50%),rgba(255,214,255,.22),transparent 70%);mix-blend-mode:screen;opacity:0;transition:opacity .4s}
#ad:hover #spot{opacity:1}
#fx{z-index:6}
#flash{background:#fff;opacity:0;z-index:20}
#flash.go{animation:flash .9s ease-out}
@keyframes flash{0%{opacity:.9}100%{opacity:0}}

/* ---------- sol: logo ---------- */
#brand{position:absolute;left:14px;top:0;width:246px;height:250px;z-index:5}
#logo{position:absolute;left:6px;top:22px;width:236px;height:78px;display:flex;align-items:flex-end;gap:6px;opacity:0;transform:scale(.3) rotate(-8deg);transform-origin:30% 60%}
#logo img{width:84px;height:61px;display:block;filter:drop-shadow(0 3px 0 #2e0276) drop-shadow(0 0 14px rgba(193,60,255,.6))}
#logo .fest{font:400 50px/.86 'Anton';letter-spacing:.005em;color:#fff;white-space:nowrap;text-shadow:0 3px 0 #2e0276,0 0 18px rgba(193,60,255,.6);margin-bottom:-1px}
#logo .fest em{font-style:normal;color:var(--orange);text-shadow:0 3px 0 #7a2600}
#tag{position:absolute;left:94px;top:104px;padding:5px 11px 6px;background:linear-gradient(180deg,var(--orange-2),var(--orange));
  border:2px solid #fff;border-radius:4px;transform:rotate(-4deg) translateX(-30px);opacity:0;box-shadow:0 6px 18px rgba(255,131,0,.45);text-align:center}
#tag:after{content:"";position:absolute;left:18px;bottom:-9px;border:8px solid transparent;border-top-color:#fff;border-bottom:0}
#tag b{display:block;font:400 25px/1 'Anton';letter-spacing:.02em}
#tag i{display:block;font:400 12.5px/1.15 'Anton';font-style:normal;letter-spacing:.05em}
#next{position:absolute;left:10px;top:178px;width:226px;height:48px;border-radius:14px;padding:6px 10px 6px 46px;
  background:linear-gradient(90deg,rgba(255,255,255,.14),rgba(255,255,255,.05));border:1px solid var(--glass-b);backdrop-filter:blur(4px);
  opacity:0;transform:translateY(14px)}
#next .pulse{position:absolute;left:12px;top:12px;width:24px;height:24px;border-radius:50%;background:var(--orange)}
#next .pulse:before,#next .pulse:after{content:"";position:absolute;inset:0;border-radius:50%;border:2px solid var(--orange);animation:ping 1.8s infinite}
#next .pulse:after{animation-delay:.9s}
#next .pulse svg{position:absolute;left:6px;top:6px;width:12px;height:12px}
@keyframes ping{0%{transform:scale(1);opacity:.9}100%{transform:scale(2.1);opacity:0}}
#next small{display:block;font:800 9.5px/1 'Mulish';letter-spacing:.1em;color:#ffcf9a;margin-bottom:2px}
#next strong{display:block;font:400 19px/1.15 'Anton';letter-spacing:.02em;white-space:nowrap}
#next strong em{font-style:normal;color:var(--orange-2)}

/* ---------- orta: tur slider ---------- */
#stage{position:absolute;left:262px;top:0;width:516px;height:250px;z-index:5;perspective:900px}
.card{position:absolute;top:8px;width:164px;height:210px;transform-style:preserve-3d}
.card .in{position:absolute;inset:0;transform-origin:50% 100%;opacity:0}
.photo{position:absolute;left:0;top:0;width:164px;height:118px;border-radius:14px 14px 4px 4px;overflow:hidden;transition:transform .35s;
  -webkit-mask-image:radial-gradient(120% 95% at 50% 30%,#000 62%,transparent 100%);mask-image:radial-gradient(120% 95% at 50% 30%,#000 62%,transparent 100%)}
.photo img{display:block;width:164px;height:118px;object-fit:cover;object-position:50% 0;transition:transform .45s,filter .45s}
.photo .ph{width:100%;height:100%;display:flex;align-items:center;justify-content:center;font:400 44px/1 'Anton';color:rgba(255,255,255,.5);background:rgba(255,255,255,.08)}
.glow{position:absolute;left:10px;right:10px;top:40px;height:90px;border-radius:50%;background:radial-gradient(closest-side,rgba(255,131,0,.75),rgba(193,60,255,.25) 60%,transparent);
  filter:blur(8px);opacity:0;transition:opacity .35s}
.city{position:absolute;left:7px;top:7px;height:17px;padding:1px 7px 0;border-radius:9px;z-index:3;
  background:linear-gradient(180deg,#3c0f86,#25065d);box-shadow:inset 0 0 0 1.5px rgba(206,160,255,.65),0 3px 8px rgba(0,0,0,.35);
  display:flex;align-items:center;justify-content:center;font:400 9.5px/1 'Anton';letter-spacing:.08em;white-space:nowrap}
.eq{position:absolute;right:10px;top:10px;display:flex;gap:2px;align-items:flex-end;height:16px;opacity:0;transition:opacity .3s;z-index:3}
.eq i{width:3px;background:var(--orange-2);border-radius:2px;height:30%;animation:eq .8s ease-in-out infinite alternate;box-shadow:0 0 4px rgba(0,0,0,.4)}
.eq i:nth-child(2){animation-delay:-.2s}.eq i:nth-child(3){animation-delay:-.5s}.eq i:nth-child(4){animation-delay:-.35s}
@keyframes eq{0%{height:20%}100%{height:100%}}
.name{position:absolute;left:2px;right:2px;top:110px;height:30px;border-radius:15px;z-index:2;
  background:linear-gradient(90deg,#ff3d2e 0%,#ff6a13 30%,#ff8300 60%,#ffa62b 100%);box-shadow:0 0 0 2px rgba(255,255,255,.9),0 0 18px rgba(255,120,20,.65);
  display:flex;align-items:center;justify-content:center;font:400 19px/1 'Anton';letter-spacing:.02em;text-shadow:0 2px 0 rgba(140,30,0,.45);white-space:nowrap;overflow:hidden}
.name:after{content:"";position:absolute;top:0;bottom:0;width:40px;left:-60px;background:linear-gradient(90deg,transparent,rgba(255,255,255,.7),transparent);transform:skewX(-20deg)}
.info{position:absolute;left:6px;right:6px;top:146px;height:60px;perspective:500px}
.face{position:absolute;inset:0;border-radius:30px;border:1.5px solid rgba(225,190,255,.75);text-align:center;padding-top:7px;backface-visibility:hidden;
  background:linear-gradient(180deg,rgba(79,0,152,.55),rgba(46,2,118,.6));box-shadow:inset 0 0 14px rgba(193,60,255,.35),0 0 12px rgba(193,60,255,.25);
  transition:transform .5s cubic-bezier(.3,.7,.2,1)}
.face b{display:block;font:400 20px/1 'Anton';letter-spacing:.04em}
.face span{display:block;margin-top:3px;font:400 10.5px/1.12 'Anton';letter-spacing:.03em;text-transform:uppercase;opacity:.95;padding:0 10px}
.face.back{transform:rotateX(-180deg);background:linear-gradient(180deg,rgba(255,131,0,.9),rgba(255,61,46,.85));border-color:#fff;padding-top:8px}
.face.back b{font-size:16px}.face.back span{font:800 9.5px/1.25 'Mulish';padding:0 4px;white-space:nowrap;text-transform:none;letter-spacing:0;margin-top:3px}
.card:hover .face.front,.card.focus .face.front{transform:rotateX(180deg)}
.card:hover .face.back,.card.focus .face.back{transform:none}
.badge{position:absolute;right:2px;top:92px;padding:3px 7px 2px;border-radius:6px;background:#fff;color:var(--orange);font:400 10.5px/1.1 'Anton';letter-spacing:.06em;
  transform:rotate(6deg);box-shadow:0 3px 8px rgba(0,0,0,.3);z-index:4}
.card.soon .badge{animation:bob 1.2s ease-in-out infinite alternate}
.card.past .badge{background:rgba(255,255,255,.88);color:#4f0098}
.card.past .photo img{filter:saturate(.6)}
@keyframes bob{to{transform:rotate(6deg) translateY(-3px)}}
.card:hover .photo img,.card.focus .photo img{transform:scale(1.07)}
.card:hover .glow,.card.focus .glow{opacity:.9}
.card:hover .eq,.card.focus .eq{opacity:1}
.card:hover .name:after,.card.focus .name:after{animation:shine .8s ease-out}
@keyframes shine{to{left:200px}}

.nav{position:absolute;top:100px;width:22px;height:22px;border-radius:50%;border:1.5px solid rgba(255,255,255,.7);background:rgba(17,2,43,.55);
  display:flex;align-items:center;justify-content:center;z-index:8;opacity:0;transition:opacity .3s,background .2s;cursor:pointer}
.nav svg{width:10px;height:10px}
.nav:hover{background:var(--orange)}
#prev{left:-11px}#nextBtn{right:-11px}
#ad:hover .nav{opacity:1}

#route{position:absolute;left:0;right:0;top:227px;height:18px;z-index:7}
#route .line{position:absolute;left:11px;right:75px;top:8px;height:2px;background:rgba(255,255,255,.25);border-radius:2px}
#route .fill{position:absolute;left:0;top:0;bottom:0;width:0;background:linear-gradient(90deg,var(--orange-2),var(--pink));border-radius:2px;transition:width .8s cubic-bezier(.3,.7,.2,1)}
.stop{position:absolute;top:0;width:86px;height:18px;cursor:pointer}
.stop i{position:absolute;left:6px;top:4px;width:10px;height:10px;border-radius:50%;background:#2a0a66;border:2px solid rgba(255,255,255,.7);transition:all .3s}
.stop span{position:absolute;left:21px;top:3px;font:400 11px/1 'Anton';letter-spacing:.05em;white-space:nowrap;color:rgba(255,255,255,.55);transition:color .3s;
  text-shadow:0 1px 3px rgba(0,0,0,.6)}
.stop span em{font-style:normal;color:var(--orange-2);margin-right:3px}
.stop:hover span{color:#fff}
.stop.act i{background:var(--orange);border-color:#fff;box-shadow:0 0 10px var(--orange)}
.stop.act span{color:#fff}
.stop.next i:after{content:"";position:absolute;inset:-5px;border-radius:50%;border:1.5px solid var(--orange-2);animation:ping 1.6s infinite}

/* ---------- sağ: CTA + sponsorlar ---------- */
#side{position:absolute;right:12px;top:0;width:170px;height:250px;z-index:5}
#hook{position:absolute;left:0;right:0;top:16px;text-align:center;opacity:0;transform:translateY(-8px)}
#hook small{display:block;font:900 9px/1.1 'Mulish';letter-spacing:.06em;white-space:nowrap;color:#e4c8ff}
#hook strong{display:block;font:400 30px/1 'Anton';letter-spacing:.02em;margin-top:3px}
#hook strong em{font-style:normal;color:var(--orange)}
#ticker{position:relative;height:16px;margin-top:5px;overflow:hidden}
#ticker div{position:absolute;left:-6px;right:-6px;font:800 11px/16px 'Mulish';white-space:nowrap;opacity:0;transform:translateY(12px);transition:all .45s}
#ticker div.on{opacity:1;transform:none}
#ticker div.off{opacity:0;transform:translateY(-12px)}
#ticker b{color:var(--orange-2);font-weight:900}
#cta{position:absolute;left:12px;right:12px;top:98px;height:40px;border-radius:20px;border:2px solid #fff;
  background:linear-gradient(180deg,#ffa62b,#ff8300 60%,#ff5a1a);box-shadow:0 8px 22px rgba(255,120,0,.55);overflow:hidden;
  display:flex;align-items:center;justify-content:center;gap:6px;font:400 18px/1 'Anton';letter-spacing:.06em;opacity:0;transform:scale(.6);transition:transform .25s,box-shadow .25s}
#cta:before{content:"";position:absolute;top:0;bottom:0;width:36px;left:-50px;background:linear-gradient(90deg,transparent,rgba(255,255,255,.75),transparent);transform:skewX(-20deg);animation:sweep 3.2s 2.4s infinite}
@keyframes sweep{0%{left:-50px}30%,100%{left:190px}}
#cta svg{width:14px;height:14px;transition:transform .25s}
#ad.ready #cta:hover{transform:scale(1.06);box-shadow:0 10px 28px rgba(255,120,0,.85)}
#cta:hover svg{transform:translateX(4px)}
#url{position:absolute;left:0;right:0;top:145px;text-align:center;font:800 11.5px/1 'Mulish';opacity:0}
#url b{color:var(--orange-2);font-weight:900}
#spons{position:absolute;left:0;right:0;top:166px;height:72px;border-radius:12px;background:#fff;padding:6px 8px 5px;opacity:0;transform:translateY(12px);
  box-shadow:0 6px 18px rgba(0,0,0,.3);display:flex;flex-direction:column;align-items:center;justify-content:space-between}
#spons .s1{width:154px;height:27px;object-fit:contain}
#spons .row{display:flex;align-items:center;gap:8px;height:30px}
#spons small{font:900 8px/1.1 'Mulish';letter-spacing:.08em;color:#4f0098;text-align:right}
#spons .s2{height:28px;width:auto}

/* ---------- giriş animasyonları ---------- */
.on #logo{animation:pop .75s .25s cubic-bezier(.2,1.6,.4,1) forwards}
.on #tag{animation:slap .5s .85s cubic-bezier(.2,1.5,.4,1) forwards}
.on #next{animation:fadeUp .6s 1.6s forwards}
.on #hook{animation:fadeUp .6s 1.25s forwards}
.on #cta{animation:pop2 .55s 1.5s cubic-bezier(.2,1.6,.4,1) forwards}
.on #url{animation:fadeUp .5s 1.7s forwards}
.on #spons{animation:fadeUp .6s 1.85s forwards}
@keyframes fadeUp{to{opacity:1;transform:none}}
@keyframes pop{to{opacity:1;transform:none}}
@keyframes pop2{to{opacity:1;transform:none}}
@keyframes slap{to{opacity:1;transform:rotate(-4deg)}}
.card .in.enter{animation:cardIn .7s cubic-bezier(.2,1.3,.4,1) forwards}
.card .in.leave{animation:cardOut .35s ease-in forwards}
@keyframes cardIn{0%{opacity:0;transform:translateY(40px) rotateX(-55deg) scale(.85)}100%{opacity:1;transform:none}}
@keyframes cardOut{0%{opacity:1;transform:none}100%{opacity:0;transform:translateY(-16px) rotateX(35deg) scale(.92)}}

@media (prefers-reduced-motion:reduce){
  *,*:before,*:after{animation-duration:.01s!important;animation-delay:0s!important;transition-duration:.01s!important}
}
</style>
</head>
<body>
<div id="ad" role="link" tabindex="0" aria-label="Selfy Fest '26 – Eğlence kampüse geldi! Konser takvimi ve detaylar için selfy.com.tr">
  <div class="layer" id="bgphoto"></div>
  <div class="layer" id="haze"></div>
  <div class="layer" id="rings"></div>
  <div class="layer" id="beams"></div>
  <canvas class="layer" id="crowd" width="970" height="96"></canvas>
  <div class="layer" id="spot"></div>

  <div id="brand">
    <div id="logo">{{LOGO}}</div>
    <div id="tag"><b>EĞLENCE</b><i>KAMPÜSE GELDİ!</i></div>
    <div id="next" aria-live="polite">
      <div class="pulse"><svg viewBox="0 0 12 12"><path d="M4.5 1.5v6.2A2 2 0 1 0 6 9.6V4l4-1V1z" fill="#fff"/></svg></div>
      <small id="nextLbl">SIRADAKİ DURAK</small>
      <strong id="nextTxt">&nbsp;</strong>
    </div>
  </div>

  <div id="stage">
    <div class="nav" id="prev" role="button" aria-label="Önceki konserler"><svg viewBox="0 0 10 10"><path d="M6.5 1.5 3 5l3.5 3.5" stroke="#fff" stroke-width="2" fill="none" stroke-linecap="round"/></svg></div>
    <div class="nav" id="nextBtn" role="button" aria-label="Sonraki konserler"><svg viewBox="0 0 10 10"><path d="M3.5 1.5 7 5 3.5 8.5" stroke="#fff" stroke-width="2" fill="none" stroke-linecap="round"/></svg></div>
    <div id="cards"></div>
    <div id="route"><div class="line"><div class="fill"></div></div></div>
  </div>

  <div id="side">
    <div id="hook"><small>HER ANIN SPONSORU SELFY</small><strong>6-23 <em>EKİM</em></strong><div id="ticker"></div></div>
    <div id="cta" role="button" aria-label="Detayları gör">DETAYLAR<svg viewBox="0 0 14 14"><path d="M2 7h9M7.5 3 11.5 7 7.5 11" stroke="#fff" stroke-width="2.4" fill="none" stroke-linecap="round" stroke-linejoin="round"/></svg></div>
    <div id="url">Detaylar <b>selfy.com.tr</b>'de.</div>
    <div id="spons">{{SPONSORS}}</div>
  </div>

  <canvas class="layer" id="fx" width="970" height="250"></canvas>
  <div class="layer" id="flash"></div>
</div>

<script>
(function(){
  'use strict';
  var DATA = {{DATA}};
  var A = DATA.artists, PER = 3, PAGES = Math.ceil(A.length / PER), AUTO_MS = 4600, MAX_MS = 29000;
  var ad = document.getElementById('ad'), cardsEl = document.getElementById('cards'), route = document.getElementById('route');
  var fill = route.querySelector('.fill');
  var page = 0, timer = null, started = 0, hovering = false, autoStopped = false;
  var reduce = window.matchMedia && matchMedia('(prefers-reduced-motion: reduce)').matches;

  /* ---- tarih / sıradaki konser ---- */
  var now = new Date(), today = new Date(now.getFullYear(), now.getMonth(), now.getDate());
  function dayDiff(a){ var d = new Date(DATA.year, DATA.month - 1, a.day); return Math.round((d - today) / 864e5); }
  var nextIdx = -1;
  for (var i = 0; i < A.length; i++) { A[i].diff = dayDiff(A[i]); if (nextIdx < 0 && A[i].diff >= 0) nextIdx = i; }
  (function(){
    var lbl = document.getElementById('nextLbl'), txt = document.getElementById('nextTxt');
    if (nextIdx < 0) { lbl.textContent = 'SELFY FEST \'26'; txt.innerHTML = 'TÜM KAMPÜSLERDE <em>EĞLENCE!</em>'; return; }
    var n = A[nextIdx], d = n.diff, when = d === 0 ? 'BUGÜN!' : d === 1 ? 'YARIN!' : d + ' GÜN KALDI';
    lbl.textContent = 'SIRADAKİ DURAK · ' + n.city;
    txt.innerHTML = n.name + ' <em>' + when + '</em>';
    var fs = 19; while (txt.scrollWidth > 172 && fs > 12) { txt.style.fontSize = (--fs) + 'px'; }
  })();

  /* ---- etkinlik bandı ---- */
  (function(){
    var box = document.getElementById('ticker'), items = DATA.ticker.map(function(t){ var d = document.createElement('div'); d.innerHTML = t; box.appendChild(d); return d; }), k = 0;
    items[0].className = 'on';
    setInterval(function(){ items[k].className = 'off'; var o = items[k]; setTimeout(function(){ o.className = ''; }, 460); k = (k + 1) % items.length; items[k].className = 'on'; }, 2400);
  })();

  /* ---- kartlar ---- */
  var slots = [];
  for (var s = 0; s < PER; s++) {
    var c = document.createElement('div'); c.className = 'card'; c.style.left = (s * 176) + 'px';
    cardsEl.appendChild(c); slots.push(c);
    (function(card, s){
      card.addEventListener('mouseenter', function(){ aimBeams(s); });
      card.addEventListener('mouseleave', function(){ aimBeams(-1); });
    })(c, s);
  }
  function cardHTML(a){
    var img = a.img ? '<img src="' + a.img + '" alt="' + a.name + '">' : '<div class="ph">' + a.name.charAt(0) + '</div>';
    var badge = a.diff === 0 ? 'BUGÜN!' : a.diff === 1 ? 'YARIN!' : a.diff < 0 ? 'GERÇEKLEŞTİ' : (a === A[nextIdx] ? 'SIRADAKİ' : '');
    return '<div class="in"><div class="glow"></div><div class="photo">' + img + '</div><div class="city">' + a.city + '</div>' +
      '<div class="eq"><i></i><i></i><i></i><i></i></div>' +
      (badge ? '<div class="badge">' + badge + '</div>' : '') +
      '<div class="name">' + a.name + '</div><div class="info">' +
      '<div class="face front"><b>' + a.day + ' ' + DATA.monthName + '</b><span>' + a.uni.replace(/ (ÜNİVERSİTESİ)$/, '<br>$1') + '</span></div>' +
      '<div class="face back"><b>' + DATA.backTitle + '</b><span>' + DATA.backText + '</span></div></div></div>';
  }
  function fitName(card){
    var n = card.querySelector('.name'); if (!n) return;
    var fs = 19; n.style.fontSize = fs + 'px';
    while (n.scrollWidth > n.clientWidth - 8 && fs > 12) { fs -= 1; n.style.fontSize = fs + 'px'; }
  }
  function show(p, dir){
    page = (p + PAGES) % PAGES;
    slots.forEach(function(card, s){
      var a = A[page * PER + s], old = card.querySelector('.in');
      if (old) { old.classList.remove('enter'); old.classList.add('leave'); }
      setTimeout(function(){
        if (!a) { card.innerHTML = ''; return; }
        card.className = 'card' + (a.diff < 0 ? ' past' : (a.diff <= 1 || a === A[nextIdx]) ? ' soon' : '');
        card.innerHTML = cardHTML(a); fitName(card);
        var inn = card.querySelector('.in'); inn.style.animationDelay = (s * 0.11) + 's';
        void inn.offsetWidth; inn.classList.add('enter');
      }, old ? 300 : 0);
    });
    updateRoute();
    if (ad.classList.contains('on')) burst(0.5, 18);
  }

  /* ---- tur rotası ---- */
  var stops = A.map(function(a, i){
    var el = document.createElement('div'); el.className = 'stop' + (i === nextIdx ? ' next' : '');
    el.style.left = (i * 86) + 'px';
    el.innerHTML = '<i></i><span><em>' + a.day + '</em>' + a.city + '</span>';
    el.setAttribute('role', 'button'); el.setAttribute('aria-label', a.city + ' ' + a.day + ' ' + DATA.monthName + ' ' + a.name);
    el.addEventListener('click', function(e){ e.stopPropagation(); userNav(Math.floor(i / PER)); });
    el.addEventListener('mouseenter', function(){ var c = slots[i % PER]; if (Math.floor(i / PER) === page && c) c.classList.add('focus'); });
    el.addEventListener('mouseleave', function(){ slots.forEach(function(c){ c.classList.remove('focus'); }); });
    route.appendChild(el); return el;
  });
  // yalnızca etkin sayfanın etiketleri görünsün; sayfa dışı duraklar nokta olarak kalır
  function updateRoute(){
    var first = page * PER, last = Math.min(A.length, first + PER) - 1;
    stops.forEach(function(el, i){
      el.classList.toggle('act', i >= first && i <= last);
    });
    fill.style.width = (last * 86) + 'px';
  }

  /* ---- gezinme ---- */
  function userNav(p){ stopAuto(); show(p); }
  function startAuto(){ if (autoStopped || reduce) return; clearInterval(timer); timer = setInterval(function(){
    if (hovering) return;
    if (Date.now() - started > MAX_MS) { stopAuto(); var np = Math.max(0, Math.floor(Math.max(nextIdx, 0) / PER)); if (np !== page) show(np); return; }
    show(page + 1);
  }, AUTO_MS); }
  function stopAuto(){ autoStopped = true; clearInterval(timer); }
  document.getElementById('prev').addEventListener('click', function(e){ e.stopPropagation(); userNav(page - 1); });
  document.getElementById('nextBtn').addEventListener('click', function(e){ e.stopPropagation(); userNav(page + 1); });
  ad.addEventListener('keydown', function(e){
    if (e.key === 'ArrowRight') userNav(page + 1); else if (e.key === 'ArrowLeft') userNav(page - 1);
    else if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); exit(); }
  });
  var tx = null;
  ad.addEventListener('touchstart', function(e){ tx = e.touches[0].clientX; }, { passive: true });
  ad.addEventListener('touchend', function(e){ if (tx === null) return; var dx = e.changedTouches[0].clientX - tx; tx = null;
    if (Math.abs(dx) > 40) { ad._swiped = true; userNav(page + (dx < 0 ? 1 : -1)); } }, { passive: true });
  document.getElementById('stage').addEventListener('mouseenter', function(){ hovering = true; });
  document.getElementById('stage').addEventListener('mouseleave', function(){ hovering = false; });

  /* ---- tıklama çıkışı ---- */
  function exit(){
    var url = (typeof window.clickTag === 'string' && /^https?:/.test(window.clickTag)) ? window.clickTag : DATA.url;
    if (window.Enabler && Enabler.exit) { try { Enabler.exit('Masthead'); return; } catch (e) {} }
    window.open(url, '_blank');
  }
  ad.addEventListener('click', function(){ if (ad._swiped) { ad._swiped = false; return; } exit(); });

  /* ---- sahne ışıkları ---- */
  var beamsEl = document.getElementById('beams'), beams = [];
  var BX = [120, 330, 485, 640, 850], BASE = [-24, -12, 0, 12, 24];
  BX.forEach(function(x, i){ var b = document.createElement('div'); b.className = 'beam' + (i % 2 ? ' pink' : ''); b.style.left = x + 'px'; beamsEl.appendChild(b); beams.push(b); });
  var sweepT = 0, aimed = -1;
  function swing(){
    sweepT += 1;
    if (aimed >= 0) return;
    beams.forEach(function(b, i){ var a = BASE[i] + Math.sin(sweepT * 0.9 + i * 1.3) * 16; b.style.transform = 'rotate(' + a + 'deg)'; });
  }
  function aimBeams(s){
    aimed = s;
    if (s < 0) { swing(); return; }
    var tx = 262 + s * 176 + 82, ty = 70;
    beams.forEach(function(b, i){ var bx = BX[i]; var ang = Math.atan2(bx - tx, ty + 30) * 180 / Math.PI; b.style.transform = 'rotate(' + ang + 'deg)'; });
  }

  /* ---- fare spotu + paralaks ---- */
  var spot = document.getElementById('spot'), crowd = document.getElementById('crowd');
  ad.addEventListener('mousemove', function(e){
    var r = ad.getBoundingClientRect(), x = e.clientX - r.left, y = e.clientY - r.top;
    spot.style.setProperty('--mx', x + 'px'); spot.style.setProperty('--my', y + 'px');
    var px = (x / 970 - .5);
    crowd.style.transform = 'translateX(' + (-px * 12) + 'px)';
    beamsEl.style.transform = 'translateX(' + (px * 10) + 'px)';
  });

  /* ---- kalabalık silueti ---- */
  (function drawCrowd(){
    var g = crowd.getContext('2d'), W = 990, H = 96, seed = 7;
    function rnd(){ seed = (seed * 9301 + 49297) % 233280; return seed / 233280; }
    var grad = g.createLinearGradient(0, 0, 0, H); grad.addColorStop(0, 'rgba(14,2,40,.0)'); grad.addColorStop(.35, 'rgba(14,2,40,.85)'); grad.addColorStop(1, '#0b0124');
    g.fillStyle = grad; g.translate(-10, 0);
    for (var row = 0; row < 3; row++) {
      var y0 = 46 + row * 16, sc = 0.75 + row * 0.2;
      for (var x = -10; x < W; x += 14 * sc + rnd() * 10) {
        var hy = y0 + rnd() * 8, r = 6.5 * sc;
        g.beginPath(); g.arc(x, hy, r, 0, Math.PI * 2); g.fill();
        g.beginPath(); g.ellipse(x, hy + r * 2.4, r * 1.9, r * 1.8, 0, 0, Math.PI * 2); g.fill();
        if (rnd() < 0.45) { // havaya kalkan kollar
          var side = rnd() < .5 ? -1 : 1, ax = x + side * r * 1.2, len = 18 + rnd() * 14;
          g.save(); g.lineWidth = 3.4 * sc; g.lineCap = 'round'; g.strokeStyle = grad;
          g.beginPath(); g.moveTo(ax, hy + r * 1.4); g.quadraticCurveTo(ax + side * 6, hy - len * .5, ax + side * (4 + rnd() * 8), hy - len); g.stroke();
          if (rnd() < .3) { g.fillStyle = 'rgba(255,240,200,.9)'; g.fillRect(ax + side * 8 - 1.5, hy - len - 4, 3, 5); g.fillStyle = grad; } // telefon ışığı
          g.restore();
        }
        g.fillRect(x - r * 1.9, hy + r * 2.4, r * 3.8, H);
      }
    }
  })();

  /* ---- parçacıklar (ışık tozu + konfeti) ---- */
  var fx = document.getElementById('fx'), ctx = fx.getContext('2d'), parts = [];
  var COLORS = ['#ff9a1f', '#ff6a13', '#ffffff', '#c13cff', '#ff3d8b', '#ffd54a'];
  function dust(){ return { x: Math.random() * 970, y: 250 + Math.random() * 40, vx: (Math.random() - .5) * .2, vy: -.25 - Math.random() * .45, r: .6 + Math.random() * 1.6, a: .25 + Math.random() * .5, t: 'd' }; }
  for (var k = 0; k < 40; k++) { var d = dust(); d.y = Math.random() * 250; parts.push(d); }
  function burst(cx, n, x, y){
    if (reduce) return;
    x = x == null ? 262 + 516 * cx : x; y = y == null ? 40 : y;
    for (var j = 0; j < n; j++) parts.push({ x: x + (Math.random() - .5) * 120, y: y, vx: (Math.random() - .5) * 3.2, vy: -1 - Math.random() * 2.5,
      w: 3 + Math.random() * 4, h: 2 + Math.random() * 3, rot: Math.random() * 6, vr: (Math.random() - .5) * .3, c: COLORS[j % COLORS.length], life: 120 + Math.random() * 60, t: 'c' });
  }
  document.getElementById('cta').addEventListener('mouseenter', function(){ burst(0, 26, 885, 110); });
  var last = 0;
  function loop(ts){
    if (ts - last > 2600) { swing(); last = ts; }
    ctx.clearRect(0, 0, 970, 250);
    for (var i = parts.length - 1; i >= 0; i--) {
      var p = parts[i];
      if (p.t === 'd') {
        p.x += p.vx; p.y += p.vy;
        if (p.y < -5) parts[i] = dust();
        ctx.globalAlpha = p.a * (0.6 + 0.4 * Math.sin(ts / 300 + i)); ctx.fillStyle = '#f3d9ff';
        ctx.beginPath(); ctx.arc(p.x, p.y, p.r, 0, 6.283); ctx.fill();
      } else {
        p.vy += .06; p.vx *= .99; p.x += p.vx; p.y += p.vy; p.rot += p.vr; p.life--;
        if (p.life <= 0 || p.y > 260) { parts.splice(i, 1); continue; }
        ctx.globalAlpha = Math.min(1, p.life / 40); ctx.save(); ctx.translate(p.x, p.y); ctx.rotate(p.rot);
        ctx.fillStyle = p.c; ctx.fillRect(-p.w / 2, -p.h / 2, p.w, p.h); ctx.restore();
      }
    }
    ctx.globalAlpha = 1;
    requestAnimationFrame(loop);
  }

  /* ---- başlat ---- */
  if (DATA.bg) { var bg = document.getElementById('bgphoto'); bg.style.backgroundImage = 'url(' + DATA.bg + ')'; }
  function start(){
    if (ad.classList.contains('on')) return;
    ad.classList.add('on'); document.getElementById('flash').classList.add('go');
    if (DATA.bg) document.getElementById('bgphoto').classList.add('on');
    swing(); requestAnimationFrame(loop);
    setTimeout(function(){ show(0); burst(.5, 40); }, 700);
    setTimeout(function(){ ad.classList.add('ready'); }, 2200);
    started = Date.now() + 700; startAuto();
  }
  function whenFonts(cb){ var done = false, go = function(){ if (!done) { done = true; cb(); } };
    if (document.fonts && document.fonts.ready) document.fonts.ready.then(go); setTimeout(go, 1200); }
  if (document.readyState === 'complete') whenFonts(start); else window.addEventListener('load', function(){ whenFonts(start); });
})();
</script>
