<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="ad.size" content="width={{WIDTH}},height={{HEIGHT}}">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>Interstitial</title>
<script type="text/javascript">
  var clickTag = "{{CLICK_URL}}";
</script>
<style>
  html, body { margin: 0; padding: 0; width: 100%; height: 100%; background: #000; overflow: hidden; }
  #ad { position: relative; width: 100%; height: 100%; min-width: {{WIDTH}}px; min-height: {{HEIGHT}}px; cursor: pointer; overflow: hidden; }
  #vid { position: absolute; top: 0; left: 0; width: 100%; height: 100%; object-fit: contain; background: #000; }
  .btn { position: absolute; bottom: 12px; width: 36px; height: 36px; border: 0; border-radius: 50%;
         background: rgba(0,0,0,.55); color: #fff; font: 16px/36px Arial, sans-serif; text-align: center;
         padding: 0; cursor: pointer; z-index: 2; -webkit-tap-highlight-color: transparent; }
  #sound { right: 12px; }
  #replay { right: 56px; display: none; }
</style>
<script type="text/javascript" src="video.js"></script>
</head>
<body>
{{IMPRESSION_PIXEL}}
<div id="ad">
  <video id="vid" poster="poster.jpg" autoplay muted playsinline webkit-playsinline preload="auto"></video>
  <button class="btn" id="replay" aria-label="Tekrar oynat">&#8635;</button>
  <button class="btn" id="sound" aria-label="Ses">&#128263;</button>
</div>
<script type="text/javascript">
  (function () {
    var ad = document.getElementById('ad');
    var vid = document.getElementById('vid');
    var sound = document.getElementById('sound');
    var replay = document.getElementById('replay');

    ad.addEventListener('click', function () {
      window.open(window.clickTag, '_blank');
    });

    sound.addEventListener('click', function (e) {
      e.stopPropagation();
      vid.muted = !vid.muted;
      sound.innerHTML = vid.muted ? '&#128263;' : '&#128266;';
      if (vid.paused) vid.play();
    });

    replay.addEventListener('click', function (e) {
      e.stopPropagation();
      vid.currentTime = 0;
      vid.play();
      replay.style.display = 'none';
    });

    vid.addEventListener('ended', function () { replay.style.display = 'block'; });

    try {
      var bin = atob(window.VIDEO_B64), len = bin.length, bytes = new Uint8Array(len);
      for (var i = 0; i < len; i++) bytes[i] = bin.charCodeAt(i);
      vid.src = URL.createObjectURL(new Blob([bytes], { type: 'video/mp4' }));
      window.VIDEO_B64 = null;
    } catch (err) {}
    var p = vid.play();
    if (p && p.catch) p.catch(function () {});
  })();
</script>
</body>
</html>
