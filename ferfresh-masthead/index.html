<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="ad.size" content="width=970,height=250">
<meta name="viewport" content="width=970,height=250">
<title>Ferfresh Masthead 970x250</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@600;800&family=Nunito:wght@500;700;800&display=swap" rel="stylesheet">
<script>
/* ==========================================================================
   FERFRESH – 970x250 İNTERAKTİF MASTHEAD
   Kurgu:
   1) Ekran "kirli" bir katmanla kaplı gelir; kullanıcı sürükleyerek siler
      (etkileşim olmazsa demo + otomatik temizlik devreye girer).
   2) Temizlik bitince oda sekmeleri (Mutfak, Banyo, Cam, Çamaşır, Bulaşık)
      arasında kampanya videoları oynar. Video tanımlı değilse her oda için
      animasyonlu "ürün kullanımı" sahnesi oynar (yer tutucu).
   3) Sağda ürün varyantları ve dönen fayda mesajları.
   Dikey (9:16) TikTok/Reels videoları için: fit:'blur' → video ortada dikey,
   arkasında aynı videonun bulanık kopyası yatay alanı doldurur.
   Yatay kurgusu yapılmış videolar için fit:'cover' kullanın.
   ========================================================================== */
var CONFIG = {
  landing: 'https://www.fersan.com.tr/marka/ferfresh',
  fit: 'blur',                 // 'blur' (dikey kaynak) | 'cover' (yatay kurgu)
  autoplayRoomMs: 5600,        // sahne/video başına süre (otomatik akışta)
  rooms: [
    { id:'mutfak',  label:'Mutfak',  title:'Mutfak tezgâhı',   claim:'Yağ lekelerini çözer',
      video:'', pattern:'tile',   base:['#fff8ec','#f3e3c6'], grout:'#e4cfaa', stain:'150,98,38' },
    { id:'banyo',   label:'Banyo',   title:'Banyo & armatür',  claim:'Kireci kolayca giderir',
      video:'', pattern:'tile',   base:['#eef8fc','#d2eaf4'], grout:'#b5d6e5', stain:'160,150,118' },
    { id:'cam',     label:'Cam',     title:'Cam & ayna',       claim:'İz bırakmadan parlatır',
      video:'', pattern:'glass',  base:['#bfe6f7','#eef9fd'], grout:'#ffffff', stain:'120,128,126' },
    { id:'camasir', label:'Çamaşır', title:'Çamaşır makinesi', claim:'Yumuşatır, kalıntıyı alır',
      video:'', pattern:'fabric', base:['#f4f1fb','#e3ddf3'], grout:'#cfc6e8', stain:'176,150,70' },
    { id:'bulasik', label:'Bulaşık', title:'Bulaşık makinesi', claim:'Bardak ve tabakları parlatır',
      video:'', pattern:'plate',  base:['#2b7f9c','#1d5f78'], grout:'#ffffff', stain:'140,96,48' }
  ],
  products: [
    { name:'Karbonatlı<br>Temizlik Sirkesi', size:'500 ml', tag:'KARBONATLI', lab:'#1e90d8', lab2:'#0b5aa3', cap:'#0b5aa3' },
    { name:'Beyaz<br>Sirke',                 size:'1 L',    tag:'BEYAZ SİRKE', lab:'#55b437', lab2:'#2c8a1f', cap:'#2c8a1f' }
  ],
  claims: ['Doğal fermantasyonla üretilir','Kimyasal kalıntı bırakmaz','Kireç ve yağı çözer','Katkı maddesi içermez']
};
</script>
<style>
:root{
  --navy:#0a3552; --green:#43a832; --green2:#2f8a22; --aqua:#22b3d6; --mint:#e8f8f1;
  --lab:#1e90d8; --lab2:#0b5aa3; --cap:#0b5aa3;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{width:970px;height:250px;overflow:hidden;background:#fff}
body{font-family:'Nunito',system-ui,sans-serif;color:var(--navy);-webkit-font-smoothing:antialiased}
button{font:inherit;border:0;background:none;color:inherit;cursor:pointer}

#ad{position:relative;width:970px;height:250px;overflow:hidden;cursor:pointer;
  display:grid;grid-template-columns:262px 444px 264px;border:1px solid #cfe3ea;
  background:linear-gradient(100deg,#f3fcf8 0%,#e4f6f4 30%,#e2f3fb 70%,#eef9fd 100%)}
#ad:focus-visible{outline:3px solid var(--aqua);outline-offset:-3px}

/* ---------- Sol: marka ---------- */
.brand{position:relative;padding:18px 18px 16px 22px;display:flex;flex-direction:column;overflow:hidden}
.logo{display:flex;align-items:flex-end;gap:6px;opacity:0;transform:translateY(-8px);transition:.6s cubic-bezier(.2,.8,.2,1)}
.logo .word{font-family:'Baloo 2',sans-serif;font-weight:800;font-size:32px;line-height:.9;letter-spacing:-.5px}
.logo .w1{color:var(--navy)} .logo .w2{color:var(--green)}
.logo svg{width:20px;height:24px;margin-bottom:6px;margin-left:-4px}
.logo .by{font-size:10px;font-weight:800;letter-spacing:1.4px;color:#5d7f93;margin-bottom:5px;margin-left:4px;text-transform:uppercase}
h1{font-family:'Baloo 2',sans-serif;font-weight:800;font-size:25px;line-height:1.02;margin-top:14px;letter-spacing:-.2px}
h1 span{display:block;opacity:0;transform:translateY(12px);transition:.55s cubic-bezier(.2,.8,.2,1)}
h1 em{font-style:normal;color:var(--green);position:relative}
h1 em::after{content:"";position:absolute;left:0;right:0;bottom:2px;height:7px;background:rgba(34,179,214,.25);border-radius:4px;z-index:-1}
.sub{font-size:12.5px;line-height:1.3;color:#3d6075;margin-top:8px;font-weight:700;opacity:0;transition:.6s .1s}
.cta{margin-top:auto;align-self:flex-start;display:inline-flex;align-items:center;gap:8px;
  background:linear-gradient(180deg,#50b93e,#2f8a22);color:#fff;font-weight:800;font-size:14px;
  padding:9px 16px 9px 18px;border-radius:999px;box-shadow:0 6px 16px -6px rgba(47,138,34,.7),inset 0 1px 0 rgba(255,255,255,.35);
  opacity:0;transform:scale(.85);transition:opacity .5s,transform .5s cubic-bezier(.3,1.6,.5,1),box-shadow .2s}
.cta i{display:inline-grid;place-items:center;width:20px;height:20px;border-radius:50%;background:rgba(255,255,255,.25);font-style:normal;transition:transform .25s}
.cta:hover i{transform:translateX(3px)}
.cta.pulse{animation:pulse 1.6s ease-in-out 3}
@keyframes pulse{50%{box-shadow:0 0 0 8px rgba(67,168,50,.18),0 6px 16px -6px rgba(47,138,34,.7)}}
.in .logo,.in .sub{opacity:1;transform:none}
.in h1 span{opacity:1;transform:none}
.in h1 span:nth-child(2){transition-delay:.12s}.in h1 span:nth-child(3){transition-delay:.24s}
.in .cta{opacity:1;transform:none;transition-delay:.45s}

.bubbles span{position:absolute;bottom:-30px;border-radius:50%;pointer-events:none;
  background:radial-gradient(circle at 32% 30%,rgba(255,255,255,.95),rgba(255,255,255,.25) 40%,rgba(34,179,214,.15) 70%,rgba(34,179,214,.35));
  box-shadow:inset 0 0 0 1px rgba(34,179,214,.25);animation:rise linear infinite}
@keyframes rise{to{transform:translateY(-310px) translateX(14px)}}
.still .bubbles span,.still .claims .c{animation-play-state:paused}

/* ---------- Orta: sahne / video ---------- */
.stage{position:relative;width:444px;height:250px;overflow:hidden;background:#0a3552}
.stage video,.stage canvas{position:absolute;inset:0;width:100%;height:100%;display:block}
#vBlur{object-fit:cover;filter:blur(18px) saturate(1.2) brightness(.85);transform:scale(1.15);opacity:0}
#vMain{object-fit:contain;opacity:0}
.fit-cover #vMain{object-fit:cover}
.has-video #vMain{opacity:1}
.has-video.fit-blur #vBlur{opacity:1}
.has-video #scene{opacity:0}
#scene{transition:opacity .35s}

#dirt{touch-action:none;cursor:none;transition:opacity .7s ease}
.cleared #dirt{opacity:0;pointer-events:none}
.sponge-cur{position:absolute;width:58px;height:38px;left:0;top:0;pointer-events:none;z-index:6;opacity:0;
  transform:translate(-50%,-50%) rotate(-12deg);transition:opacity .2s}
.stage.hovering:not(.cleared) .sponge-cur,.sponge-cur.ghost{opacity:1}
.hint{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);z-index:5;pointer-events:none;text-align:center;color:#fff;
  transition:opacity .4s}
.hint b{display:block;font-family:'Baloo 2',sans-serif;font-size:27px;line-height:1;text-shadow:0 2px 10px rgba(0,0,0,.35)}
.hint small{display:inline-block;margin-top:8px;font-size:12px;font-weight:800;background:rgba(255,255,255,.2);
  border:1px solid rgba(255,255,255,.4);padding:5px 12px;border-radius:999px;backdrop-filter:blur(4px)}
.hint .arrows{display:block;margin:6px auto 0;width:120px;height:18px}
.hint .arrows path{stroke:#fff;stroke-width:2.5;fill:none;stroke-linecap:round;stroke-dasharray:6 6;animation:dash 1s linear infinite}
@keyframes dash{to{stroke-dashoffset:-24}}
.scrubbing .hint,.cleared .hint{opacity:0}

.cap{position:absolute;left:12px;top:12px;z-index:4;display:flex;align-items:center;gap:8px;pointer-events:none;
  opacity:0;transform:translateY(-6px);transition:.4s}
.cleared .cap{opacity:1;transform:none}
.cap .t{background:rgba(10,53,82,.85);color:#fff;font-weight:800;font-size:11.5px;padding:5px 10px;border-radius:999px;letter-spacing:.2px}
.cap .c{background:#fff;color:var(--green2);font-weight:800;font-size:11.5px;padding:5px 10px;border-radius:999px;box-shadow:0 3px 10px -4px rgba(0,0,0,.4)}
.cap .c.swap{animation:pop .45s cubic-bezier(.3,1.6,.5,1)}
@keyframes pop{from{transform:scale(.6);opacity:0}}

.rooms{position:absolute;left:0;right:0;bottom:10px;z-index:7;display:flex;justify-content:center;gap:5px;
  opacity:0;transform:translateY(10px);transition:.45s .2s}
.cleared .rooms{opacity:1;transform:none}
.rooms button{position:relative;overflow:hidden;font-size:11.5px;font-weight:800;color:var(--navy);
  background:rgba(255,255,255,.82);backdrop-filter:blur(6px);padding:6px 11px;border-radius:999px;
  box-shadow:0 4px 12px -6px rgba(0,0,0,.45);transition:background .2s,color .2s,transform .2s}
.rooms button:hover{transform:translateY(-2px);background:#fff}
.rooms button.on{background:var(--green);color:#fff}
.rooms button .bar{position:absolute;left:0;bottom:0;height:3px;width:0;background:rgba(255,255,255,.75)}
.rooms button.on .bar.run{animation:bar linear forwards}
@keyframes bar{to{width:100%}}

.replay{position:absolute;right:10px;top:10px;z-index:7;width:28px;height:28px;border-radius:50%;
  background:rgba(255,255,255,.85);display:grid;place-items:center;opacity:0;transition:.3s;box-shadow:0 3px 10px -4px rgba(0,0,0,.4)}
.cleared .replay{opacity:1}
.replay:hover{transform:rotate(-60deg)}
.replay svg{width:15px;height:15px}

.toast{position:absolute;left:50%;top:44%;z-index:8;pointer-events:none;transform:translate(-50%,-50%) scale(.4);opacity:0;
  font-family:'Baloo 2',sans-serif;font-weight:800;font-size:40px;color:#fff;white-space:nowrap;
  text-shadow:0 3px 0 var(--green2),0 8px 24px rgba(10,53,82,.5)}
.toast.show{animation:toast 1.5s cubic-bezier(.3,1.5,.5,1) forwards}
@keyframes toast{0%{opacity:0;transform:translate(-50%,-50%) scale(.4)}20%{opacity:1;transform:translate(-50%,-50%) scale(1)}
  75%{opacity:1;transform:translate(-50%,-50%) scale(1)}100%{opacity:0;transform:translate(-50%,-70%) scale(.95)}}
.spark{position:absolute;z-index:8;pointer-events:none;width:16px;height:16px;margin:-8px 0 0 -8px}
.spark::before{content:"";position:absolute;inset:0;background:#fff;
  clip-path:polygon(50% 0,61% 39%,100% 50%,61% 61%,50% 100%,39% 61%,0 50%,39% 39%);filter:drop-shadow(0 0 4px #bff3ff)}

/* ---------- Sağ: ürün ---------- */
.product{position:relative;display:flex;align-items:center;padding:0 14px 0 6px;overflow:hidden}
.product::before{content:"";position:absolute;left:-40px;top:50%;width:220px;height:220px;margin-top:-110px;border-radius:50%;
  background:radial-gradient(circle,rgba(255,255,255,.95),rgba(255,255,255,0) 68%)}
.bottle{position:relative;width:96px;height:214px;flex:none;transform-origin:50% 100%;
  opacity:0;transform:translateY(30px) rotate(6deg);transition:opacity .6s .2s,transform .8s .2s cubic-bezier(.3,1.4,.5,1)}
.in .bottle{opacity:1;transform:none}
.bottle svg{width:100%;height:100%;overflow:visible;filter:drop-shadow(0 10px 10px rgba(10,53,82,.22))}
.bottle.wob{animation:wob .7s ease}
@keyframes wob{25%{transform:rotate(-6deg)}55%{transform:rotate(4deg)}80%{transform:rotate(-2deg)}}
.bottle .fizz circle{animation:fizz 2.4s linear infinite;opacity:0}
@keyframes fizz{0%{opacity:0;transform:translateY(0)}15%{opacity:.9}100%{opacity:0;transform:translateY(-70px)}}
.label-fill{fill:var(--lab);transition:fill .5s}.label-fill2{fill:var(--lab2);transition:fill .5s}.cap-fill{fill:var(--cap);transition:fill .5s}

.info{position:relative;flex:1;padding-left:8px;display:flex;flex-direction:column;gap:7px;opacity:0;transform:translateX(12px);transition:.6s .35s}
.in .info{opacity:1;transform:none}
.info .kick{font-size:10px;font-weight:800;letter-spacing:1.5px;color:#5d7f93;text-transform:uppercase}
.info .pname{font-family:'Baloo 2',sans-serif;font-weight:800;font-size:19px;line-height:1;margin-top:-2px;min-height:38px}
.info .pname small{font-family:'Nunito',sans-serif;font-size:11px;color:#5d7f93;font-weight:800;margin-left:2px}
.pname.swap{animation:pop .45s cubic-bezier(.3,1.6,.5,1)}
.claims{position:relative;height:44px}
.claims .c{position:absolute;left:0;right:0;top:0;display:flex;align-items:center;gap:7px;font-size:11.5px;font-weight:800;line-height:1.15;color:var(--navy);
  opacity:0;transform:translateY(8px);transition:.4s}
.claims .c.on{opacity:1;transform:none}
.claims .c i{flex:none;width:22px;height:22px;border-radius:50%;background:var(--green);display:grid;place-items:center}
.claims .c i svg{width:12px;height:12px}
.vars{display:flex;align-items:center;gap:6px}
.vars button{width:20px;height:20px;border-radius:50%;box-shadow:0 0 0 2px #fff,0 2px 6px -2px rgba(0,0,0,.4);transition:transform .2s}
.vars button.on{transform:scale(1.18);box-shadow:0 0 0 2px #fff,0 0 0 4px var(--navy)}
.vars span{font-size:10.5px;font-weight:800;color:#5d7f93;margin-left:3px}
.buy{font-size:12px;font-weight:800;color:var(--green2);display:inline-flex;align-items:center;gap:4px;align-self:flex-start;
  border-bottom:2px solid rgba(67,168,50,.35);padding-bottom:1px;transition:border-color .2s}
.buy:hover{border-color:var(--green2)}

.legal{position:absolute;right:8px;bottom:4px;font-size:8.5px;color:#7d97a6;font-weight:700;pointer-events:none}

@media (prefers-reduced-motion:reduce){
  .bubbles,.bottle .fizz{display:none}
  *{transition-duration:.01s!important;animation-duration:.01s!important}
}
</style>
</head>
<body>
<div id="ad" role="link" tabindex="0" aria-label="Ferfresh – doğal gücüyle her yer pırıl pırıl. Ürünleri keşfet.">

  <!-- SOL: Marka -->
  <section class="brand">
    <div class="bubbles" aria-hidden="true"></div>
    <div class="logo" aria-label="Ferfresh">
      <span class="word"><span class="w1">fer</span><span class="w2">fresh</span></span>
      <svg viewBox="0 0 20 24" aria-hidden="true"><path d="M10 1C10 1 2 10 2 15a8 8 0 0 0 16 0C18 10 10 1 10 1Z" fill="#22b3d6"/><path d="M6.5 15.5a3.6 3.6 0 0 0 3.6 3.6" stroke="#fff" stroke-width="1.8" fill="none" stroke-linecap="round"/></svg>
      <span class="by">by Fersan</span>
    </div>
    <h1><span>Doğanın gücüyle</span><span>her yer</span><span><em>pırıl pırıl!</em></span></h1>

    <button class="cta" data-exit="cta">Ürünleri Keşfet <i>&rarr;</i></button>
  </section>

  <!-- ORTA: Sahne / Video -->
  <section class="stage" id="stage">
    <video id="vBlur" muted playsinline loop preload="none" aria-hidden="true"></video>
    <video id="vMain" muted playsinline loop preload="none"></video>
    <canvas id="scene" width="888" height="500" aria-hidden="true"></canvas>
    <canvas id="dirt" width="444" height="250" data-noexit aria-label="Kirli yüzey – temizlemek için sürükleyin"></canvas>
    <svg class="sponge-cur" id="cur" viewBox="0 0 58 38" aria-hidden="true">
      <rect x="2" y="6" width="54" height="30" rx="8" fill="#ffd63f"/><rect x="2" y="2" width="54" height="11" rx="5" fill="#3aa856"/>
      <circle cx="14" cy="24" r="2.2" fill="#e8b81f"/><circle cx="30" cy="28" r="2" fill="#e8b81f"/><circle cx="44" cy="22" r="2.4" fill="#e8b81f"/>
    </svg>
    <div class="hint">
      <b>Sil, farkı gör!</b>
      <svg class="arrows" viewBox="0 0 120 18"><path d="M4 9 Q 30 -4 60 9 T 116 9"/></svg>
      <small>&#9995; Sürükleyerek temizle</small>
    </div>
    <div class="cap"><span class="t" id="capT">Mutfak tezgâhı</span><span class="c" id="capC">Yağ lekelerini çözer</span></div>

      <svg viewBox="0 0 24 24" fill="none" stroke="#0a3552" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"><path d="M3 12a9 9 0 1 0 3-6.7"/><path d="M3 4v5h5"/></svg>
    </button>
    <nav class="rooms" id="rooms" data-noexit aria-label="Yaşam alanları"></nav>
    <div class="toast" id="toast">Pırıl pırıl!</div>
  </section>

  <!-- SAĞ: Ürün -->
  <section class="product">
    <div class="bottle" id="bottle" data-noexit>
      <svg viewBox="0 0 100 220" aria-hidden="true">
        <defs>
          <linearGradient id="pet" x1="0" x2="1"><stop offset="0" stop-color="#d9f2fb"/><stop offset=".45" stop-color="#ffffff"/><stop offset="1" stop-color="#bfe4f2"/></linearGradient>
          <linearGradient id="liq" x1="0" x2="1"><stop offset="0" stop-color="#e9f9ff" stop-opacity=".9"/><stop offset=".5" stop-color="#f7fdff" stop-opacity=".7"/><stop offset="1" stop-color="#cdeefa" stop-opacity=".9"/></linearGradient>
          <clipPath id="bodyClip"><path d="M40 38 L60 38 Q60 52 72 60 Q86 70 86 88 L86 200 Q86 214 72 214 L28 214 Q14 214 14 200 L14 88 Q14 70 28 60 Q40 52 40 38 Z"/></clipPath>
        </defs>
        <path d="M40 38 L60 38 Q60 52 72 60 Q86 70 86 88 L86 200 Q86 214 72 214 L28 214 Q14 214 14 200 L14 88 Q14 70 28 60 Q40 52 40 38 Z" fill="url(#pet)" stroke="#9fd2e6" stroke-width="1"/>
        <g clip-path="url(#bodyClip)">
          <rect x="10" y="74" width="80" height="150" fill="url(#liq)"/>
          <path d="M10 74 Q30 70 50 74 T90 74" stroke="#bfe8f6" stroke-width="2" fill="none"/>
          <g class="fizz" fill="#ffffff" stroke="#a9dcef" stroke-width=".6">
            <circle cx="26" cy="206" r="2.2" style="animation-delay:0s"/><circle cx="74" cy="200" r="1.8" style="animation-delay:.6s"/>
            <circle cx="34" cy="196" r="1.5" style="animation-delay:1.2s"/><circle cx="66" cy="208" r="2" style="animation-delay:1.8s"/>
          </g>
          <rect class="label-fill" x="10" y="102" width="80" height="80"/>
          <path class="label-fill2" d="M10 160 Q50 148 90 160 L90 182 L10 182 Z"/>
          <path d="M10 102 Q50 112 90 102" stroke="#fff" stroke-width="2.2" fill="none" opacity=".9"/>
          <rect x="20" y="40" width="7" height="170" rx="3.5" fill="#fff" opacity=".55"/>
        </g>
        <text x="50" y="129" text-anchor="middle" font-family="Baloo 2,sans-serif" font-weight="800" font-size="16" fill="#fff" textLength="62" lengthAdjust="spacingAndGlyphs">ferfresh</text>
        <text x="50" y="142" text-anchor="middle" font-family="Nunito,sans-serif" font-weight="800" font-size="7.4" fill="#fff" textLength="64" lengthAdjust="spacingAndGlyphs">TEMİZLİK SİRKESİ</text>
        <text id="bTag" x="50" y="174" text-anchor="middle" font-family="Nunito,sans-serif" font-weight="800" font-size="7.6" fill="#fff" letter-spacing=".8">KARBONATLI</text>
        <path d="M44 152 c0 -6 6 -9 6 -9 s6 3 6 9 a6 6 0 0 1 -12 0z" fill="#fff" opacity=".9"/>
        <rect x="38" y="20" width="24" height="20" rx="2" fill="#e8f6fb" stroke="#9fd2e6"/>
        <rect class="cap-fill" x="34" y="2" width="32" height="22" rx="5"/>
        <g stroke="#fff" stroke-opacity=".35" stroke-width="1.4"><path d="M40 6v14M46 6v14M52 6v14M58 6v14"/></g>
      </svg>
    </div>
    <div class="info">
      <span class="kick">Ferfresh</span>
      <div class="pname" id="pname">Karbonatlı<br>Temizlik Sirkesi <small>500 ml</small></div>
      <div class="claims" id="claims"></div>
      <div class="vars" id="vars" data-noexit></div>
      <button class="buy" data-exit="buy">Online satın al &rarr;</button>
    </div>
    <span class="legal">Fersan güvencesiyle</span>
  </section>
</div>

<script>
(function(){
'use strict';
var $ = function(s){return document.querySelector(s);};
var ad=$('#ad'), stage=$('#stage'), W=444, H=250;
var reduce = window.matchMedia && matchMedia('(prefers-reduced-motion: reduce)').matches;

/* ---------- Tıklama / çıkış ---------- */
function exitUrl(){ return (typeof window.clickTag==='string' && window.clickTag) || CONFIG.landing; }
function exit(id){
  if (window.Enabler && Enabler.exit) { Enabler.exit(id||'main'); return; }
  window.open(exitUrl(),'_blank');

      var a=pts[k-1], b=pts[k], f=(tgt-L[k-1])/((L[k]-L[k-1])||1), p=[a[0]+(b[0]-a[0])*f, a[1]+(b[1]-a[1])*f];

      if (u<1) requestAnimationFrame(step); else { cur.classList.remove('ghost'); last=null; cb&&cb(); }
    })(performance.now());
  }
  function ghost(){ if (touched||done) return; animatePath([[80,70],[180,110],[150,160],[260,150],[330,190]],1700,null,true); }
  function autoClean(){
    if (touched||done) return;
    var pts=[], rows=[30,75,120,165,210,240];
    rows.forEach(function(y,i){ pts.push(i%2?[424,y]:[20,y]); pts.push(i%2?[20,y]:[424,y]); });
    animatePath(pts,2200,function(){ finish(); },true);
  }
  function burst(){
    for (var i=0;i<16;i++){ var s=document.createElement('span'); s.className='spark';
      var a=Math.random()*Math.PI*2, d=50+Math.random()*130, sc=.6+Math.random()*1.2;
      s.style.left=(W/2)+'px'; s.style.top=(H/2-10)+'px'; stage.appendChild(s);
      s.animate([{transform:'translate(0,0) scale(0) rotate(0)',opacity:1},{transform:'translate('+Math.cos(a)*d+'px,'+Math.sin(a)*d*.6+'px) scale('+sc+') rotate(90deg)',opacity:1,offset:.6},{transform:'translate('+Math.cos(a)*d*1.1+'px,'+Math.sin(a)*d*.66+'px) scale(0) rotate(160deg)',opacity:0}],{duration:1100+Math.random()*400,easing:'cubic-bezier(.2,.8,.3,1)'}).onfinish=(function(n){return function(){ n.remove(); };})(s);
    }
    var t=$('#toast'); t.classList.remove('show'); void t.offsetWidth; t.classList.add('show');
  }
  function finish(silent){
    if (done) return; done=true; ghostOn=false;
    stage.classList.add('cleared'); stage.classList.remove('scrubbing');
    $('.cta').classList.add('pulse');
    if (silent) return;
    Scene.clean(); burst();
    setTimeout(function(){ Rooms.show(0,true); },1400);
  }
  function reset(){
    done=false; touched=false; moves=0; last=null; paint();
    Scene.stop(); stage.classList.remove('cleared','has-video','scrubbing'); vMain.pause(); vBlur.pause();
    Rooms.show(0,false);
  }
  paint();
  return { finish:finish, reset:reset, ghost:ghost, autoClean:autoClean };
})();
$('#replay').addEventListener('click',function(){ Clean.reset(); });

/* ==========================================================================
   ÜRÜN – varyantlar + dönen faydalar
   ========================================================================== */
(function(){
  var vars=$('#vars'), cl=$('#claims'), bottle=$('#bottle'), cur=0, ci=0, userPicked=false;
  var check='<svg viewBox="0 0 12 12" fill="none" stroke="#fff" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M2.5 6.3 5 8.6 9.6 3.6"/></svg>';
  CONFIG.claims.forEach(function(t,i){ var d=document.createElement('div'); d.className='c'+(i===0?' on':''); d.innerHTML='<i>'+check+'</i><span>'+t+'</span>'; cl.appendChild(d); });
  CONFIG.products.forEach(function(p,i){
    var b=document.createElement('button'); b.type='button'; b.style.background='linear-gradient(135deg,'+p.lab+','+p.lab2+')';
    b.setAttribute('aria-label',p.name.replace('<br>',' ')+' '+p.size); if(i===0) b.className='on';
    b.addEventListener('click',function(){ userPicked=true; pick(i); }); vars.appendChild(b);
  });
  var lbl=document.createElement('span'); vars.appendChild(lbl);
  function pick(i){
    cur=i; var p=CONFIG.products[i];
    ad.style.setProperty('--lab',p.lab); ad.style.setProperty('--lab2',p.lab2); ad.style.setProperty('--cap',p.cap);
    $('#bTag').textContent=p.tag; lbl.textContent=p.size;
    var n=$('#pname'); n.innerHTML=p.name+' <small>'+p.size+'</small>'; n.classList.remove('swap'); void n.offsetWidth; n.classList.add('swap');
    [].forEach.call(vars.querySelectorAll('button'),function(b,k){ b.classList.toggle('on',k===i); });
    wob();
  }
  function wob(){ bottle.classList.remove('wob'); void bottle.offsetWidth; bottle.classList.add('wob'); }
  bottle.addEventListener('pointerenter',wob);
  bottle.addEventListener('click',function(){ userPicked=true; pick((cur+1)%CONFIG.products.length); });
  lbl.textContent=CONFIG.products[0].size;
  setInterval(function(){ if(!alive()) return; var c=cl.children; c[ci].classList.remove('on'); ci=(ci+1)%c.length; c[ci].classList.add('on'); },2600);
  setInterval(function(){ if(!alive()||userPicked) return; pick((cur+1)%CONFIG.products.length); },7000);
})();

/* ---------- Başlat ---------- */
function start(){
  Rooms.show(0,false);
  requestAnimationFrame(function(){ ad.classList.add('in'); });
  setTimeout(Clean.ghost,1400);
  setTimeout(Clean.autoClean,7000);
}
var started=false;
function go(){ if(started) return; started=true; start(); }
if (window.Enabler){ if (Enabler.isInitialized()) go(); else Enabler.addEventListener('init',go); }
else if (document.fonts && document.fonts.ready){ document.fonts.ready.then(go); setTimeout(go,1200); }
else window.addEventListener('load',go);
})();
</script>
