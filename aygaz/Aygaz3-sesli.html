<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>[SESLİ ÖNİZLEME] Aygaz Otogaz - 100+ Oktan 970x250 Masthead Banner</title>
  
  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  
  <!-- React & ReactDOM CDN -->
  <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
  <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>

  <style>
    body {
      margin: 0;
      padding: 0;
      background-color: #000a1a;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      user-select: none;
      -webkit-user-select: none;
    }
  </style>
</head>
<body class="bg-[#000A1A] flex items-center justify-center min-h-screen p-4 text-white">

  <!-- 970x250 Interactive Banner Root -->
  <div id="aygaz-masthead-root"></div>

  <script>window.AYGAZ_OPTIONS = { startUnmuted: true };</script>
  <script type="text/babel">
    const { useState, useEffect, useRef } = React;

    // --- Lucide SVG Icon Components ---
    const ShieldCheck = ({ className = "w-4 h-4" }) => (
      <svg className={className} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round">
        <path d="M20 13c0 5-3.5 7.5-7.66 8.95a1 1 0 0 1-.67 0C7.5 20.5 4 18 4 13V6a1 1 0 0 1 1-1c2 0 4.5-1.2 6.24-2.72a1.17 1.17 0 0 1 1.52 0C14.51 3.81 17 5 19 5a1 1 0 0 1 1 1z"/>
        <path d="m9 12 2 2 4-4"/>

    const ChevronRight = ({ className = "w-4 h-4" }) => (

    const Play = ({ className = "w-4 h-4" }) => (

    const Pause = ({ className = "w-4 h-4" }) => (

        <rect x="6" y="4" width="4" height="16" rx="1"/>

    const Volume2 = ({ className = "w-4 h-4" }) => (
      <svg className={className} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round">
        <polygon points="11 5 6 9 2 9 2 15 6 15 11 19 11 5"/>
        <path d="M15.54 8.46a5 5 0 0 1 0 7.07"/>
        <path d="M19.07 4.93a10 10 0 0 1 0 14.14"/>
      </svg>
    );

    const VolumeX = ({ className = "w-4 h-4" }) => (
      <svg className={className} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round">
        <polygon points="11 5 6 9 2 9 2 15 6 15 11 19 11 5"/>
        <line x1="22" x2="16" y1="9" y2="15"/>

    const Users = ({ className = "w-4 h-4" }) => (
      <svg className={className} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round">
        <path d="M16 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2"/>
        <circle cx="9" cy="7" r="4"/>
        <path d="M22 21v-2a4 4 0 0 0-3-3.87"/>
        <path d="M16 3.13a4 4 0 0 1 0 7.75"/>
      </svg>

    const Briefcase = ({ className = "w-4 h-4" }) => (
      <svg className={className} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round">
        <path d="M16 20V4a2 2 0 0 0-2-2h-4a2 2 0 0 0-2 2v16"/>
        <rect width="20" height="14" x="2" y="6" rx="2"/>
      </svg>
    );

    const Car = ({ className = "w-4 h-4" }) => (
      <svg className={className} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round">
        <path d="M19 17h2c.6 0 1-.4 1-1v-3c0-.9-.7-1.7-1.5-1.9C18.7 10.6 16 10 16 10s-1.3-1.4-2.2-2.3c-.5-.4-1.1-.7-1.8-.7H5c-.6 0-1.1.4-1.4.9l-1.4 2.9A3.7 3.7 0 0 0 2 12v4c0 .6.4 1 1 1h2"/>
        <circle cx="7" cy="17" r="2"/>
        <path d="M9 17h6"/>
        <circle cx="17" cy="17" r="2"/>
      </svg>
    );

    const Building2 = ({ className = "w-4 h-4" }) => (
      <svg className={className} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round">
        <path d="M6 22V4a2 2 0 0 1 2-2h8a2 2 0 0 1 2 2v18Z"/>
        <path d="M6 12H4a2 2 0 0 0-2 2v6a2 2 0 0 0 2 2h2"/>
        <path d="M18 9h2a2 2 0 0 1 2 2v9a2 2 0 0 0 2 2h-2"/>
        <path d="M10 6h4"/><path d="M10 10h4"/><path d="M10 14h4"/><path d="M10 18h4"/>
      </svg>
    );

    const CheckCircle2 = ({ className = "w-4 h-4" }) => (
      <svg className={className} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round">
        <circle cx="12" cy="12" r="10"/>
        <path d="m9 12 2 2 4-4"/>
      </svg>
    );

    const MapPin = ({ className = "w-4 h-4" }) => (
      <svg className={className} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round">
        <path d="M20 10c0 4.993-5.539 10.193-7.399 11.799a1 1 0 0 1-1.202 0C9.539 20.193 4 14.993 4 10a8 8 0 0 1 16 0"/>
        <circle cx="12" cy="10" r="3"/>
      </svg>
    );

    const Flame = ({ className = "w-4 h-4" }) => (
      <svg className={className} viewBox="0 0 24 24" fill="currentColor" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round">
        <path d="M8.5 14.5A2.5 2.5 0 0 0 11 12c0-1.38-.5-2-1-3-1.072-2.143-.224-4.054 2-6 .5 2.5 2 4.9 4 6.5 2 1.6 3 3.5 3 5.5a7 7 0 1 1-14 0c0-1.153.433-2.294 1-3a2.5 2.5 0 0 0 2.5 2.5z"/>
      </svg>
    );

    const Globe = ({ className = "w-4 h-4" }) => (
      <svg className={className} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round">
        <circle cx="12" cy="12" r="10"/>
        <path d="M12 2a14.5 14.5 0 0 0 0 20 14.5 14.5 0 0 0 0-20"/>
        <path d="M2 12h20"/>
      </svg>
    );

    const MapIcon = ({ className = "w-4 h-4" }) => (
      <svg className={className} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round">
        <path d="M14.106 5.553a2 2 0 0 0 1.788 0l3.659-1.83A1 1 0 0 1 21 4.619v12.764a1 1 0 0 1-.553.894l-4.553 2.277a2 2 0 0 1-1.788 0l-4.212-2.106a2 2 0 0 0-1.788 0l-3.659 1.83A1 1 0 0 1 3 19.381V6.618a1 1 0 0 1 .553-.894l4.553-2.277a2 2 0 0 1 1.788 0z"/>
        <path d="M15 5.764v15"/>
        <path d="M9 3.236v15"/>
      </svg>
    );

    const Flag = ({ className = "w-4 h-4" }) => (
      <svg className={className} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round">
        <path d="M4 22V4a1 1 0 0 1 .4-.8A6 6 0 0 1 8 2c3 0 5 2 7.333 2q2 0 3.067-.8A1 1 0 0 1 20 4v10a1 1 0 0 1-.4.8A6 6 0 0 1 16 16c-3 0-5-2-7.333-2A6 6 0 0 0 4 15"/>
      </svg>
    );

    // --- Campaign Data Assets ---
    // Varsayılan varlık adresleri. Yayın paketi (build-dv360.js) bunları window.AYGAZ_ASSETS ile
    // paket içindeki yerel dosyalara çevirir; bu dosya tek başına açıldığında aşağıdakiler kullanılır.
    const ASSETS = Object.assign({
      LOGO_URL: 'https://100oktan.aygaz.com.tr/assets/images/logo/logo-white.png',
      // Persona videoları bu HTML ile aynı klasörden okunur (ör. S3'te /Aygaz/Aile.mp4).
      // Videolar başka bir yerde duracaksa klasör adresini buraya yazın, sonu "/" ile bitmeli:
      // VIDEO_BASE: 'https://splashdigital.s3.eu-west-1.amazonaws.com/Aygaz/'
      VIDEO_BASE: '',
      KEY_VISUAL_URL: 'https://splashdigital.s3.eu-west-1.amazonaws.com/Aygaz/aygaz.jpg',
      LOGO_NAME: 'Aygaz Otogaz'
    }, window.AYGAZ_ASSETS || {});

    // Önizleme seçenekleri. startUnmuted: sesli başlamayı dener; tarayıcı kullanıcı etkileşimi olmadan
    // sesli oynatmaya izin vermezse sessiz başlar ve banner içindeki ilk tıklamada sesi açar.
    // (Yayın paketinde kullanılmaz: reklamda ses yalnızca kullanıcı tıklamasıyla açılır.)
    const OPTIONS = Object.assign({ startUnmuted: false }, window.AYGAZ_OPTIONS || {});

    // Tıklama çıkışları. DV360 / CM360 paketinde index.html içinde `var clickTag = ...` ve
    // `var clickTag1 = ...` tanımlıdır; platform yayında bu değerleri kendi izleme adresleriyle değiştirir.
    // clickTag tanımlı değilse (ör. bu önizleme dosyası) doğrudan site adresi açılır.
    const EXITS = {
      site:    { clickTag: 'clickTag',  url: 'https://100oktan.aygaz.com.tr/',             studioExit: 'Site' },
      station: { clickTag: 'clickTag1', url: 'https://100oktan.aygaz.com.tr/nerede.html', studioExit: 'Istasyon' }
    };
    const openExit = (key) => {
      const exit = EXITS[key] || EXITS.site;
      if (window.Enabler && typeof window.Enabler.exit === 'function') { // Studio (rich media)
        window.Enabler.exit(exit.studioExit, exit.url);
        return;
      }
      // Çıkışa özel clickTag yoksa ana clickTag (tek click tracker) kullanılır
      const tagged = window[exit.clickTag] || window.clickTag;
      window.open(typeof tagged === 'string' && tagged ? tagged : exit.url, '_blank');
    };

    // Persona başlığı -> müşterinin gönderdiği video dosyası (dosya adları birebir, büyük/küçük harf dahil)
    const PERSONA_VIDEOS = {
      'Aile': 'Aile.mp4',
      'Beyaz Yaka': 'Beyazyaka.mp4',
      'Taksici': 'Taksi.mp4',
      'Filo Yöneticisi': 'filoyoneticisi.mp4'
    };
    const videoUrlFor = (persona) => ASSETS.VIDEO_BASE + PERSONA_VIDEOS[persona.title];

    const PERSONAS = [
      {
        id: 'aile',
        title: 'Aile',
        badge: 'Güvenli & Konforlu Sürüş',
        tagline: 'Ailenize Güvenli, Bütçenize Dost Otogaz',
        benefits: [
          'Benzine kıyasla %40\'a varan tasarruf',
          'Sessiz ve konforlu sürüş'
        ],
        ctaText: 'Şimdi İncele',
        iconName: 'Users'
      },
      {
        id: 'beyaz_yaka',
        title: 'Beyaz Yaka',
        badge: 'Akıllı Şehir Sürüşü',
        tagline: 'Şehir İçi Trafikte Akıllı & Verimli Seçim',
        benefits: [
          'Dur-kalk trafikte düşük tüketim',
          'Temiz enjektör ve motor bakımı'
        ],
        ctaText: 'Şimdi İncele',
        iconName: 'Briefcase'
      },
      {
        id: 'taksici',
        title: 'Taksici',
        badge: '7/24 Kazanç & Verim',
        tagline: 'Yüksek Kilometrede Maksimum Kazanç',
        benefits: [
          'Her km için net bütçe kazancı',
          'Aşınmayı önleyen katkılı formül'
        ],
        ctaText: 'Şimdi İncele',
        iconName: 'Car'
      },
      {
        id: 'patron',
        title: 'Filo Yöneticisi',
        badge: 'Filo & Kurumsal Çözüm',
        tagline: 'Filolarınızda Yüksek Verim ve Bütçe Kontrolü',
        benefits: [
          'Filo bütçesinde doğrudan tasarruf',
          'Yüksek tork ve araç koruma'
        ],
        ctaText: 'Şimdi İncele',
        iconName: 'Building2'
      }
    ];

    // İstasyon Bul sekmesi – kaynak: https://100oktan.aygaz.com.tr/nerede.html
    const STATION_STATS = {
      worldLpgStations: 80000,   // Dünya genelinde LPG istasyonu
      aygazStations: 1900        // Türkiye'de Aygaz istasyonu (1.900+)
    };
    const formatNumber = (n) => n.toLocaleString('tr-TR'); // 80.000 / 1.900

    // Tasarruf Hesapla sekmesi varsayımları
    const CALC = {
      benzinLitreTL: 43.50,        // benzin litre fiyatı (TL) – varsayım
      benzinTuketimL100km: 8.0,    // benzin tüketimi (L/100 km) – varsayım
      tasarrufOrani: 0.40          // "Benzine kıyasla %40'a varan tasarruf"
    };

    const OKTAN_BENEFITS = [
      {
        id: 'power',
        title: 'Yüksek Tork & İvmelenme',
        description: 'Vuruntusuz çalışan motor ile dik yokuşlarda ve sollamalarda anında tork tepkisi.',
        statValue: '+18%'
      },
      {
        id: 'economy',
        title: 'Maksimum Tasarruf',
        description: 'Tam yanma sağlayan formülü ile her depoda daha uzun mesafe ve tasarruf.',
        statValue: '%40'
      },
      {
        id: 'engine_protection',
        title: 'Motor Koruma',
        description: 'Silindir içi kurum birikmesini önler, motor ömrünü uzatır.',
        statValue: '2x'
      },
      {
        id: 'safety',
        title: 'Aygaz Güvencesi',
        description: 'Türkiye genelinde 1.900+ denetimli istasyonda %100 emniyet garantisi.',
        statValue: '1.900+'
      }
    ];

    function Masthead970x250() {
      const [activePersonaId, setActivePersonaId] = useState('aile');
      const [activeTab, setActiveTab] = useState('personas');
      const [isPlaying, setIsPlaying] = useState(true);
      const [isMuted, setIsMuted] = useState(!OPTIONS.startUnmuted);
      // Sesli başlatma tarayıcı tarafından engellendiyse true: ilk tıklamada ses açılır
      const [soundBlocked, setSoundBlocked] = useState(false);
      const [monthlyKm, setMonthlyKm] = useState(1500);

      // Intro Overlay state
      const [isIntroActive, setIsIntroActive] = useState(true);
      const [introFading, setIntroFading] = useState(false);
      const [introStep, setIntroStep] = useState(0);

      // Station counters (İstasyon Bul sekmesi açılınca 0'dan sayar)
      const [worldCount, setWorldCount] = useState(0);
      const [stationCount, setStationCount] = useState(0);

      // Her persona için ayrı <video> elemanı; sadece aktif olan görünür ve oynar
      const videoRefs = useRef({});
      const getVideo = (id) => videoRefs.current[id] || null;
      const activePersona = PERSONAS.find(p => p.id === activePersonaId) || PERSONAS[0];

      // Run Intro animation sequence on mount
      useEffect(() => {
        setIsIntroActive(true);
        setIntroFading(false);
        setIntroStep(1);

        const timer1 = setTimeout(() => setIntroStep(2), 400);
        const timer2 = setTimeout(() => setIntroStep(3), 1100);
        const timer3 = setTimeout(() => setIntroFading(true), 2400);
        const timer4 = setTimeout(() => {
          setIsIntroActive(false);
          setIntroStep(0);
        }, 3000);

        return () => {
          clearTimeout(timer1); clearTimeout(timer2); clearTimeout(timer3); clearTimeout(timer4);
        };
      }, []);

      // Sesli başlatma (yalnızca OPTIONS.startUnmuted): engellenirse sessiz oynat, ilk tıklamada aç
      useEffect(() => {
        if (!OPTIONS.startUnmuted) return;
        const first = getVideo(PERSONAS[0].id);
        if (!first) return;
        first.muted = false;
        first.play().then(() => {
          setSoundBlocked(false);
        }).catch(() => {
          first.muted = true;
          setIsMuted(true);
          setSoundBlocked(true);
          first.play().catch(() => {});
        });
      }, []);

      const unmuteAll = () => {
        PERSONAS.forEach((p) => { const v = getVideo(p.id); if (v) v.muted = false; });
        setIsMuted(false);
        setSoundBlocked(false);
      };

      // Sesli başlatma engellendiyse banner içindeki ilk tıklama (Geç, persona, sekme…) sesi açar
      const handleFirstInteraction = () => {
        if (soundBlocked) unmuteAll();
      };

      // Station counter animation
      useEffect(() => {
        if (activeTab === 'station') {
          setWorldCount(0); setStationCount(0);
          const duration = 1000;
          const startTime = performance.now();

          const animate = (currentTime) => {
            const elapsed = currentTime - startTime;
            const progress = Math.min(elapsed / duration, 1);
            const easeProgress = 1 - Math.pow(1 - progress, 3);

            setWorldCount(Math.floor(easeProgress * STATION_STATS.worldLpgStations));
            setStationCount(Math.floor(easeProgress * STATION_STATS.aygazStations));

            if (progress < 1) {
              requestAnimationFrame(animate);
            }
          };
          requestAnimationFrame(animate);
        }
      }, [activeTab]);

      // Alt bardaki "Şimdi İncele" her sekmede ana çıkışa (clickTag / site) gider;
      // yalnızca İstasyon Bul sekmesindeki harita satırı istasyon çıkışına (clickTag1 / nerede.html) gider.
      const handleCtaClick = (ctaName) => {
        const name = (ctaName || '').toLowerCase();
        const isStation = name.includes('istasyon') || name.includes('station');
        openExit(isStation ? 'station' : 'site');
      };

      const handlePersonaSelect = (personaId) => {
        const next = getVideo(personaId);
        if (personaId !== activePersonaId) {
          const current = getVideo(activePersonaId);
          if (current) current.pause();
          if (next) {
            try { next.currentTime = 0; } catch (e) { /* metadata henüz yüklenmediyse zaten baştan başlar */ }
          }
          setActivePersonaId(personaId);
        }
        if (next) {
          next.play().catch(() => {});
          setIsPlaying(true);
        }
      };

      const togglePlay = () => {
        const video = getVideo(activePersonaId);
        if (!video) return;
        if (isPlaying) {
          video.pause();
          setIsPlaying(false);
        } else {
          video.play().catch(() => {});
          setIsPlaying(true);
        }
      };

      const toggleMute = () => {
        const nextMuted = !isMuted;
        PERSONAS.forEach((p) => {
          const video = getVideo(p.id);
          if (video) video.muted = nextMuted;
        });
        setIsMuted(nextMuted);
      };

      // Tasarruf Hesapla: marka iddiası "Benzine kıyasla %40'a varan tasarruf" esas alınır.
      // Tasarruf = aylık benzin maliyeti x %40. Benzin fiyatı ve tüketim varsayımdır (marka onayı önerilir).
      const monthlyBenzinTL = (monthlyKm / 100) * CALC.benzinTuketimL100km * CALC.benzinLitreTL;
      const monthlySavingsTL = Math.round(monthlyBenzinTL * CALC.tasarrufOrani);
      const annualSavingsTL = monthlySavingsTL * 12;

      const getPersonaIcon = (iconName) => {
        switch (iconName) {
          case 'Users': return <Users className="w-3.5 h-3.5" />;
          case 'Briefcase': return <Briefcase className="w-3.5 h-3.5" />;
          case 'Car': return <Car className="w-3.5 h-3.5" />;
          case 'Building2': return <Building2 className="w-3.5 h-3.5" />;
          default: return <Users className="w-3.5 h-3.5" />;
        }
      };

      return (
        <div 
          id="aygaz-masthead-interactive-970x250"
          className="relative bg-[#000D21] rounded-none overflow-hidden shadow-2xl border border-slate-800/90 font-sans text-white select-none"
          style={{ width: '970px', height: '250px', minWidth: '970px', minHeight: '250px' }}
          onPointerDownCapture={handleFirstInteraction}
        >
          {/* Top Header Branding Bar (Height: 38px) */}
          <div className="absolute top-0 left-0 right-0 h-[38px] bg-[#00122E] border-b border-slate-800 px-3.5 flex items-center justify-between z-20">
            
            {/* Brand Logo */}
            <div className="flex items-center gap-3">
              <img 
                src={ASSETS.LOGO_URL} 
                alt="Aygaz Otogaz Logo" 
                className="h-6 object-contain"
              />
            </div>

            {/* Navigation Tabs */}
            <div className="flex items-center gap-1.5 text-[11px] font-bold">
              <button
                onClick={() => setActiveTab('personas')}
                className={`px-3 py-1 rounded transition-all cursor-pointer ${
                  activeTab === 'personas' 
                    ? 'bg-[#004791] text-white shadow-sm border border-sky-400/30' 
                    : 'text-slate-300 hover:text-white hover:bg-white/5'
                }`}
              >
                Sürücü Profilleri
              </button>

              <button
                onClick={() => setActiveTab('benefits')}
                className={`px-3 py-1 rounded transition-all cursor-pointer ${
                  activeTab === 'benefits' 
                    ? 'bg-[#004791] text-white shadow-sm border border-sky-400/30' 
                    : 'text-slate-300 hover:text-white hover:bg-white/5'
                }`}
              >
                100+ Oktan Gücü
              </button>

              <button
                onClick={() => setActiveTab('calculator')}
                className={`px-3 py-1 rounded transition-all cursor-pointer ${
                  activeTab === 'calculator' 
                    ? 'bg-[#FF5500] text-white font-extrabold shadow-sm' 
                    : 'text-slate-300 hover:text-white hover:bg-white/5'
                }`}
              >
                Tasarruf Hesapla
              </button>

              <button
                onClick={() => setActiveTab('station')}
                className={`px-3 py-1 rounded transition-all cursor-pointer ${
                  activeTab === 'station' 
                    ? 'bg-emerald-600 text-white shadow-sm' 
                    : 'text-slate-300 hover:text-white hover:bg-white/5'
                }`}
              >
                İstasyon Bul
              </button>
            </div>

          </div>

          {/* Main Content Area */}
          <div className="absolute top-[38px] left-0 right-0 bottom-[36px] flex items-center overflow-hidden">
            
            {/* Left Column: Video Player (340px) */}
            <div className="w-[340px] h-full relative bg-slate-950 border-r border-slate-800 flex-shrink-0 group overflow-hidden">
              {PERSONAS.map((p, idx) => {
                const isActive = p.id === activePersonaId;
                return (
                  <video
                    key={p.id}
                    ref={(el) => { videoRefs.current[p.id] = el; }}
                    src={videoUrlFor(p)}
                    poster={ASSETS.KEY_VISUAL_URL}
                    autoPlay={idx === 0}
                    loop
                    muted={isMuted}
                    playsInline
                    preload={isActive ? 'auto' : 'metadata'}
                    aria-hidden={!isActive}
                    data-persona={p.title}
                    className={`absolute inset-0 w-full h-full object-cover object-bottom transition-opacity duration-300 ${
                      isActive ? 'opacity-100 z-[1]' : 'opacity-0 z-0 pointer-events-none'
                    }`}
                  />
                );
              })}

              <div className="absolute inset-0 bg-gradient-to-t from-slate-950/80 via-transparent to-transparent pointer-events-none z-[2]" />

              <div className="absolute top-2.5 left-2.5 flex items-center gap-1 bg-slate-950/80 backdrop-blur-sm px-2 py-1 rounded border border-slate-800 z-10">
                <button
                  onClick={togglePlay}
                  className="w-5 h-5 rounded bg-[#004791] text-white flex items-center justify-center hover:bg-[#003B7A] cursor-pointer"
                  title={isPlaying ? 'Duraklat' : 'Oynat'}
                >
                  {isPlaying ? <Pause className="w-3 h-3" /> : <Play className="w-3 h-3" />}
                </button>

                <button
                  onClick={toggleMute}
                  className="w-5 h-5 rounded bg-slate-800 text-slate-200 flex items-center justify-center hover:bg-slate-700 cursor-pointer"
                  title={isMuted ? 'Sesi Aç' : 'Sesi Kapat'}
                >
                  {isMuted ? <VolumeX className="w-3 h-3 text-red-400" /> : <Volume2 className="w-3 h-3 text-emerald-400" />}
                </button>

                {soundBlocked && (
                  <span className="ml-1 text-[9.5px] font-bold text-amber-300 whitespace-nowrap animate-pulse">
                    Ses için tıklayın
                  </span>
                )}
              </div>
            </div>

            {/* Right Column: Tab Body (630px) */}
            <div className="flex-1 h-full bg-[#000D21] p-3 flex flex-col justify-between overflow-hidden">
              
              {/* TAB 1: PERSONAS */}
              {activeTab === 'personas' && (
                <div className="flex flex-col h-full justify-between">
                  
                  {/* Persona Selector Chips */}
                  <div className="grid grid-cols-4 gap-1.5">
                    {PERSONAS.map((p) => {
                      const isSelected = activePersonaId === p.id;
                      return (
                        <button
                          key={p.id}
                          onClick={() => handlePersonaSelect(p.id)}
                          className={`flex items-center justify-center gap-1.5 py-1.5 px-2 rounded text-xs font-bold transition-all border cursor-pointer ${
                            isSelected
                              ? 'bg-[#004791] text-white border-sky-400/60 shadow-md'
                              : 'bg-[#001533] text-slate-300 border-slate-800 hover:border-slate-700 hover:bg-[#001D47]'
                          }`}
                        >
                          {getPersonaIcon(p.iconName)}
                          <span className="truncate">{p.title}</span>
                        </button>
                      );
                    })}
                  </div>

                  {/* Active Persona Details */}
                  <div className="bg-[#001533] border border-slate-800 rounded-lg p-3 my-1 flex items-start gap-3">
                    <div className="p-2 rounded bg-[#004791]/30 border border-[#004791]/50 text-sky-400 flex-shrink-0">
                      {getPersonaIcon(activePersona.iconName)}
                    </div>

                    <div className="flex-1 min-w-0">
                      <div className="flex items-center justify-between">
                        <h4 className="text-xs font-black text-white truncate">
                          {activePersona.title}
                        </h4>
                        <span className="text-[10px] text-slate-400 font-medium truncate">
                          {activePersona.badge}
                        </span>
                      </div>

                      <p className="text-[11px] text-sky-200 font-semibold mt-0.5 line-clamp-1 italic">
                        "{activePersona.tagline}"
                      </p>

                      <ul className="mt-1.5 grid grid-cols-2 gap-x-3 gap-y-1 text-[10.5px] text-slate-300">
                        {activePersona.benefits.slice(0, 2).map((b, idx) => (
                          <li key={idx} className="flex items-center gap-1.5 truncate">
                            <CheckCircle2 className="w-3 h-3 text-emerald-400 flex-shrink-0" />
                            <span className="truncate">{b}</span>
                          </li>
                        ))}
                      </ul>
                    </div>
                  </div>

                </div>
              )}

              {/* TAB 2: BENEFITS */}
              {activeTab === 'benefits' && (
                <div className="grid grid-cols-2 gap-2 h-full py-0.5">
                  {OKTAN_BENEFITS.map((benefit) => (
                    <div 
                      key={benefit.id}
                      className="bg-[#001533] border border-slate-800 rounded-lg p-2.5 flex flex-col justify-between"
                    >
                      <div className="flex items-center justify-between">
                        <span className="text-[11px] font-black text-white truncate">{benefit.title}</span>
                        <span className="text-[10px] font-extrabold px-1.5 py-0.2 rounded bg-sky-500/20 text-sky-300 border border-sky-500/30">
                          {benefit.statValue}
                        </span>
                      </div>
                      <p className="text-[10px] text-slate-300 line-clamp-2 mt-1 leading-tight">
                        {benefit.description}
                      </p>
                    </div>
                  ))}
                </div>
              )}

              {/* TAB 3: CALCULATOR */}
              {activeTab === 'calculator' && (
                <div className="bg-[#001533] border border-slate-800 rounded-lg p-3 h-full flex items-center justify-between gap-4">
                  <div className="flex-1 space-y-2">
                    <div>
                      <div className="flex justify-between text-[11px] font-bold text-slate-300 mb-1">
                        <span>Aylık Ortalama Sürüş (KM)</span>
                        <span className="text-amber-400 font-mono font-bold">{formatNumber(monthlyKm)} km</span>
                      </div>
                      <input
                        type="range"
                        min="500"
                        max="5000"
                        step="250"
                        value={monthlyKm}
                        onChange={(e) => setMonthlyKm(Number(e.target.value))}
                        className="w-full h-1.5 bg-slate-800 rounded appearance-none cursor-pointer accent-[#FF5500]"
                      />
                    </div>

                    <div className="text-[10px] text-slate-400">
                      Benzine kıyasla %40'a varan tasarruf esas alınmıştır.
                    </div>
                  </div>

                  <div className="bg-gradient-to-br from-[#001D4A] to-[#003B7A] border border-sky-500/30 rounded p-2.5 text-center min-w-[180px]">
                    <span className="text-[10px] font-bold text-sky-300 uppercase tracking-wider block">
                      Tahmini Yıllık Tasarruf
                    </span>
                    <div className="text-xl font-black text-amber-400 my-0.5 font-mono">
                      {formatNumber(annualSavingsTL)} TL
                    </div>
                    <span className="text-[10px] text-slate-200 font-semibold block">
                      Aygaz 100+ Oktan İle
                    </span>
                  </div>
                </div>
              )}

              {/* TAB 4: STATION FINDER */}
              {activeTab === 'station' && (
                <div className="bg-[#001533] border border-slate-800 rounded-lg p-3 h-full flex flex-col justify-between">
                  
                  {/* Header */}
                  <div className="flex items-center justify-between">
                    <div className="flex items-center gap-2">
                      <MapPin className="w-4 h-4 text-emerald-400 flex-shrink-0" />
                      <span className="text-xs font-black text-white">Türkiye Geneli Yaygın Aygaz İstasyon Ağı</span>
                    </div>
                    <span className="text-[10px] font-bold text-emerald-400 bg-emerald-500/10 px-2 py-0.5 rounded border border-emerald-500/20">
                      Canlı İstasyon Bulucu
                    </span>
                  </div>

                  {/* Animated Counters Grid – veriler: 100oktan.aygaz.com.tr/nerede.html */}
                  <div className="grid grid-cols-3 gap-2 my-1">
                    <div className="bg-[#000D21] px-2.5 py-1.5 rounded border border-slate-800 flex items-center gap-2">
                      <div className="w-7 h-7 rounded-full bg-white flex items-center justify-center text-[#FF8A00] flex-shrink-0">
                        <Globe className="w-4 h-4" />
                      </div>
                      <div className="min-w-0">
                        <div className="text-base font-black text-emerald-400 font-mono tracking-tight leading-none">
                          {formatNumber(worldCount)}
                        </div>
                        <div className="text-[9.5px] text-slate-300 font-semibold mt-1 leading-tight">Dünya Genelinde<br />LPG istasyonu</div>
                      </div>
                    </div>

                    <div className="bg-[#000D21] px-2.5 py-1.5 rounded border border-slate-800 flex items-center gap-2">
                      <div className="w-7 h-7 rounded-full bg-white flex items-center justify-center text-[#FF8A00] flex-shrink-0">
                        <MapIcon className="w-4 h-4" />
                      </div>
                      <div className="min-w-0">
                        <div className="text-base font-black text-sky-400 font-mono tracking-tight leading-none">
                          {formatNumber(stationCount)}+
                        </div>
                        <div className="text-[9.5px] text-slate-300 font-semibold mt-1 leading-tight">Türkiye'de<br />Aygaz istasyonu</div>
                      </div>
                    </div>

                    <div className="bg-[#000D21] px-2.5 py-1.5 rounded border border-slate-800 flex items-center gap-2">
                      <div className="w-7 h-7 rounded-full bg-white flex items-center justify-center text-[#FF8A00] flex-shrink-0">
                        <Flag className="w-4 h-4" />
                      </div>
                      <div className="min-w-0">
                        <div className="text-base font-black text-amber-400 tracking-tight leading-none">
                          Aygaz
                        </div>
                        <div className="text-[9.5px] text-slate-300 font-semibold mt-1 leading-tight">100+ Oktan<br />Aygaz'ın tüm istasyonlarında!</div>
                      </div>
                    </div>
                  </div>

                  {/* Station Link */}
                  <button
                    onClick={() => handleCtaClick('station')}
                    className="w-full bg-[#004791] hover:bg-[#003B7A] text-white text-[11px] font-bold py-1.5 px-3 rounded transition-all flex items-center justify-between border border-sky-400/30 cursor-pointer shadow-sm"
                  >
                    <span>Size En Yakın Aygaz İstasyonunu Haritada Bulun</span>
                    <span className="text-amber-300 text-[10px] underline flex items-center gap-1">
                      100oktan.aygaz.com.tr/nerede.html →
                    </span>
                  </button>

                </div>
              )}

            </div>

          </div>

          {/* Footer Bar */}
          <div className="absolute bottom-0 left-0 right-0 h-[36px] bg-[#00122E] border-t border-slate-800 px-3.5 flex items-center justify-between z-20">
            <div className="flex items-center gap-1.5 text-[10.5px] text-slate-300 font-semibold">
              <ShieldCheck className="w-3.5 h-3.5 text-emerald-400" />
              <span>{activePersona.badge}</span>
            </div>

            <button
              onClick={() => handleCtaClick(activePersona.ctaText)}
              className="bg-[#FF5500] hover:bg-[#E04B00] text-white font-black text-xs px-4 py-1 rounded shadow-md transition-all flex items-center gap-1 cursor-pointer"
            >
              <span>{activePersona.ctaText}</span>
              <ChevronRight className="w-3.5 h-3.5" />
            </button>
          </div>

          {/* Intro Overlay */}
          {isIntroActive && (
            <div 
              className={`absolute inset-0 z-50 bg-[#000B21] flex flex-col items-center justify-center overflow-hidden transition-opacity duration-700 ease-out ${
                introFading ? 'opacity-0 pointer-events-none' : 'opacity-100'
              }`}
            >
              <div className="absolute inset-0 bg-[radial-gradient(circle_at_center,_var(--tw-gradient-stops))] from-[#003B7A]/40 via-[#00102E]/80 to-[#000817] pointer-events-none" />

              <div className="relative z-10 flex flex-col items-center text-center px-4 space-y-3">
                <div className={`transform transition-all duration-700 ease-out flex items-center justify-center ${introStep >= 1 ? 'scale-100 opacity-100' : 'scale-50 opacity-0'}`}>
                  <div className="relative">
                    <div className="absolute -inset-4 rounded-full bg-sky-500/20 blur-xl animate-pulse" />
                    <img 
                      src={ASSETS.LOGO_URL} 
                      alt="Aygaz Logo" 
                      className="h-10 md:h-12 object-contain relative z-10 drop-shadow-[0_0_15px_rgba(0,140,255,0.6)]"
                    />
                  </div>
                </div>

                <div className={`transform transition-all duration-700 delay-200 ease-out flex flex-col items-center space-y-1 ${introStep >= 2 ? 'translate-y-0 opacity-100' : 'translate-y-4 opacity-0'}`}>
                  <div className="bg-gradient-to-r from-[#FF5500] via-[#FF7700] to-[#E04B00] text-white px-3.5 py-1 rounded-full text-xs font-black tracking-widest uppercase flex items-center gap-1.5 shadow-[0_0_20px_rgba(255,85,0,0.6)] border border-amber-300/40">
                    <Flame className="w-4 h-4 text-white fill-white animate-bounce" />
                    <span>100+ OKTAN TEKNOLOJİSİ</span>
                  </div>

                  <p className={`text-xs font-bold text-slate-200 tracking-wide transition-all duration-500 delay-500 ${introStep >= 3 ? 'opacity-100 scale-100' : 'opacity-0 scale-95'}`}>
                    Yollarda Maksimum Performans & Bütçe Dostu Sürüş
                  </p>
                </div>
              </div>

              <button
                onClick={() => {
                  setIntroFading(true);
                  setTimeout(() => setIsIntroActive(false), 300);
                }}
                className="absolute top-2 right-3 text-[10px] text-slate-400 hover:text-white bg-slate-900/60 hover:bg-slate-800 px-2.5 py-1 rounded border border-slate-700/60 z-20 cursor-pointer transition-all"
              >
                Geç ✕
              </button>
            </div>
          )}

        </div>
      );
    }

    ReactDOM.createRoot(document.getElementById('aygaz-masthead-root')).render(<Masthead970x250 />);
  </script>
</body>
</html>
