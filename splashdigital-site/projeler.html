    .top { position: fixed; right: 18px; bottom: 18px; width: 44px; height: 44px; border-radius: 50%; background: #fff; border: 1px solid var(--line); display: grid; place-items: center; box-shadow: 0 8px 20px -10px rgba(12, 27, 46, .35); opacity: 0; pointer-events: none; transition: opacity .3s; }
    .top.is-on { opacity: 1; pointer-events: auto; }

    .progress span { display: block; height: 100%; transform-origin: left; transform: scaleX(var(--sp, 0)); background: linear-gradient(90deg, var(--brand), #3fb3f0); box-shadow: 0 0 10px rgba(63, 179, 240, .7); }
    .js .pg { opacity: 0; transform: perspective(1600px) translateY(60px) rotateX(16deg); transform-origin: 50% 0; transition: opacity .7s, transform .9s cubic-bezier(.2, .8, .2, 1), box-shadow .3s; }
    .js .pg.is-in { opacity: 1; transform: none; }
    .pg::after { content: ''; position: absolute; left: 0; right: 0; top: 0; height: 2px; pointer-events: none; opacity: 0; background: linear-gradient(90deg, transparent, #3fb3f0, transparent); box-shadow: 0 0 14px 2px rgba(63, 179, 240, .7); }

  <script>
  (function () {
    var pages = document.querySelectorAll('.pg');
    var total = pages.length, counter = document.getElementById('count'), top = document.getElementById('top'), t;
    if ('IntersectionObserver' in window) {
      var io = new IntersectionObserver(function (es) {
        es.forEach(function (e) {
          if (!e.isIntersecting) return;
          counter.textContent = e.target.id.slice(1) + ' / ' + total;
          counter.classList.add('is-on');
          clearTimeout(t); t = setTimeout(function () { counter.classList.remove('is-on'); }, 1200);
        });
      }, { rootMargin: '-50% 0px -50% 0px' });
      pages.forEach(function (p) { io.observe(p); });
    }
    window.addEventListener('scroll', function () { top.classList.toggle('is-on', window.scrollY > 1200); }, { passive: true });
    // Sayfalar ekrana girince belirir + ilerleme çizgisi
    var bar = document.querySelector('.progress');
    function prog() { var m = document.documentElement.scrollHeight - innerHeight; bar.style.setProperty('--sp', m > 0 ? (scrollY / m).toFixed(4) : 0); }
    window.addEventListener('scroll', prog, { passive: true }); prog();
    if ('IntersectionObserver' in window) {
      var rio = new IntersectionObserver(function (es) { es.forEach(function (e) { if (e.isIntersecting) { e.target.classList.add('is-in'); rio.unobserve(e.target); } }); }, { rootMargin: '0px 0px -8% 0px', threshold: 0.05 });
      pages.forEach(function (p) { rio.observe(p); });
    } else { pages.forEach(function (p) { p.classList.add('is-in'); }); }

  })();
  </script>
