<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Pegasus İnteraktif Masthead</title>
  
  <!-- Tailwind CSS (CDN) -->
  <script src="https://cdn.tailwindcss.com"></script>
  
  <!-- Pegasus Fontu (Nunito Sans) -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Nunito+Sans:wght@400;600;700;800;900&display=swap" rel="stylesheet">
  
  <!-- Tailwind Konfigürasyonu -->
  <script>
    tailwind.config = {
      theme: {
        extend: {
          fontFamily: {
            sans: ['"Nunito Sans"', 'sans-serif'],
          }
        }
      }
    }
  </script>

  <!-- Animasyon Stilleri -->
  <style>
    .dest-card {
      transition: width 0.4s ease-out;
      width: 33.333%;
    }
    .dest-card.hovered {
      width: 60%;
    }
    .dest-card.not-hovered {
      width: 20%;
    }
    .dest-overlay {
      transition: opacity 0.3s ease;
      opacity: 0.5;
    }
    .dest-card.hovered .dest-overlay {
      opacity: 0.2;
    }
    .dest-content {
      transition: all 0.3s ease;
      opacity: 0;
      transform: translateY(10px);
      pointer-events: none;
      height: 0;
      overflow: hidden;
    }
    .dest-card.hovered .dest-content {
      opacity: 1;
      transform: translateY(0);
      pointer-events: auto;
      height: auto;
      margin-top: 0.5rem;
    }
  </style>
</head>
<body class="bg-gray-200 flex items-center justify-center min-h-screen p-4 font-sans">

  <!-- Masthead Container (970x250) -->
  <div onclick="window.open('https://web.flypgs.com/trip-finder?currency=TL&language=tr', '_blank')"
       class="w-[970px] h-[250px] bg-white rounded-xl shadow-2xl overflow-hidden flex relative border border-gray-200 shrink-0 cursor-pointer">

    <!-- Sol Marka Alanı -->
    <div class="w-[300px] bg-[#FFC000] p-8 flex flex-col justify-between z-10 relative shrink-0">
      <div>
        <img src="https://cdnp.flypgs.com/files/pegasus-logo.svg" alt="Pegasus" class="h-10 object-contain" referrerpolicy="no-referrer" />
        <p class="text-gray-900 font-extrabold mt-6 text-4xl leading-tight tracking-tight">Senin yaz<br/>rotan neresi?</p>
      </div>
      <div>
        <div class="flex items-center text-[#E30A17] font-bold text-base animate-pulse">
          Keşfetmek için seç 
          <!-- Chevron Right Icon -->
          <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="ml-1"><path d="m9 18 6-6-6-6"/></svg>
        </div>
      </div>
    </div>

    <!-- Sağ İnteraktif Alan -->
    <div class="flex-1 flex bg-gray-100" id="destinations-container">
      
      <!-- Destinasyon 1: Yurt İçi -->
      <div class="dest-card relative overflow-hidden border-l border-white/20">
        <div class="dest-overlay absolute inset-0 bg-black/40 z-10"></div>
        <img src="https://images.unsplash.com/photo-1520114878144-6123749968dd?q=80&w=800&auto=format&fit=crop" alt="Yurt İçi" class="absolute inset-0 w-full h-full object-cover" referrerpolicy="no-referrer" />
        <div class="absolute inset-0 z-20 p-5 flex flex-col justify-end">
          <h3 class="text-white font-bold text-2xl drop-shadow-md">Yurt İçi</h3>
          <div class="dest-content">
            <p class="text-white/90 text-sm mb-3 drop-shadow-sm font-medium">Ege ve Akdeniz sahilleri seni bekliyor.</p>
            <div class="flex items-center justify-between">
              <span class="bg-[#E30A17] text-white px-2 py-1 rounded text-xs font-bold shadow-sm">799 TL'den başlayan</span>
              <button class="bg-[#FFC000] text-gray-900 px-4 py-1.5 rounded-full text-sm font-bold flex items-center hover:bg-white transition-colors shadow-sm">
                <!-- Ticket Icon -->
                <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="mr-1"><path d="M2 9a3 3 0 0 1 0 6v2a2 2 0 0 0 2 2h16a2 2 0 0 0 2-2v-2a3 3 0 0 1 0-6V7a2 2 0 0 0-2-2H4a2 2 0 0 0-2 2Z"/><path d="M13 5v2"/><path d="M13 17v2"/><path d="M13 11v2"/></svg>
                Bilet Al
              </button>
            </div>
          </div>
        </div>
      </div>

      <!-- Destinasyon 2: Avrupa -->
      <div class="dest-card relative overflow-hidden border-l border-white/20">
        <div class="dest-overlay absolute inset-0 bg-black/40 z-10"></div>
        <img src="https://images.unsplash.com/photo-1499856871958-5b9627545d1a?q=80&w=800&auto=format&fit=crop" alt="Avrupa" class="absolute inset-0 w-full h-full object-cover" referrerpolicy="no-referrer" />
        <div class="absolute inset-0 z-20 p-5 flex flex-col justify-end">
          <h3 class="text-white font-bold text-2xl drop-shadow-md">Avrupa</h3>
          <div class="dest-content">
            <p class="text-white/90 text-sm mb-3 drop-shadow-sm font-medium">Tarih, kültür ve eğlence bir arada.</p>
            <div class="flex items-center justify-between">
              <span class="bg-[#E30A17] text-white px-2 py-1 rounded text-xs font-bold shadow-sm">49 €'den başlayan</span>
              <button class="bg-[#FFC000] text-gray-900 px-4 py-1.5 rounded-full text-sm font-bold flex items-center hover:bg-white transition-colors shadow-sm">
                <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="mr-1"><path d="M2 9a3 3 0 0 1 0 6v2a2 2 0 0 0 2 2h16a2 2 0 0 0 2-2v-2a3 3 0 0 1 0-6V7a2 2 0 0 0-2-2H4a2 2 0 0 0-2 2Z"/><path d="M13 5v2"/><path d="M13 17v2"/><path d="M13 11v2"/></svg>
                Bilet Al
              </button>
            </div>
          </div>
        </div>
      </div>

      <!-- Destinasyon 3: Kıbrıs -->
      <div class="dest-card relative overflow-hidden border-l border-white/20">
        <div class="dest-overlay absolute inset-0 bg-black/40 z-10"></div>
        <img src="https://images.unsplash.com/photo-1552465011-b4e21bf6e79a?q=80&w=800&auto=format&fit=crop" alt="Kıbrıs" class="absolute inset-0 w-full h-full object-cover" referrerpolicy="no-referrer" />
        <div class="absolute inset-0 z-20 p-5 flex flex-col justify-end">
          <h3 class="text-white font-bold text-2xl drop-shadow-md">Kıbrıs</h3>
          <div class="dest-content">
            <p class="text-white/90 text-sm mb-3 drop-shadow-sm font-medium">Sıcak kumsallar ve kesintisiz eğlence.</p>
            <div class="flex items-center justify-between">
              <span class="bg-[#E30A17] text-white px-2 py-1 rounded text-xs font-bold shadow-sm">999 TL'den başlayan</span>
              <button class="bg-[#FFC000] text-gray-900 px-4 py-1.5 rounded-full text-sm font-bold flex items-center hover:bg-white transition-colors shadow-sm">
                <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="mr-1"><path d="M2 9a3 3 0 0 1 0 6v2a2 2 0 0 0 2 2h16a2 2 0 0 0 2-2v-2a3 3 0 0 1 0-6V7a2 2 0 0 0-2-2H4a2 2 0 0 0-2 2Z"/><path d="M13 5v2"/><path d="M13 17v2"/><path d="M13 11v2"/></svg>
                Bilet Al
              </button>
            </div>
          </div>
        </div>
      </div>

    </div>
  </div>

  <!-- Etkileşim (Hover) Scripti -->
  <script>
    const cards = document.querySelectorAll('.dest-card');
    const container = document.getElementById('destinations-container');

    cards.forEach(card => {
      card.addEventListener('mouseenter', () => {
        cards.forEach(c => {
          if (c === card) {
            c.classList.add('hovered');
            c.classList.remove('not-hovered');
          } else {
            c.classList.add('not-hovered');
            c.classList.remove('hovered');
          }
        });
      });
    });

    container.addEventListener('mouseleave', () => {
      cards.forEach(c => {
        c.classList.remove('hovered');
        c.classList.remove('not-hovered');
      });
    });
  </script>
</body>
</html>
