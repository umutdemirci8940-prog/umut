<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Yemeksepeti 25. Yıl Award-Winning Banner</title>
  
  <!-- Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;900&display=swap" rel="stylesheet">
  
  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          fontFamily: {
            sans: ['Inter', 'sans-serif'],
          }
        }
      }
    }
  </script>

  <!-- React & ReactDOM -->
  <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
  <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
  
  <!-- Framer Motion -->
  <script src="https://unpkg.com/framer-motion@10.16.4/dist/framer-motion.js"></script>
  
  <!-- Babel (JSX Derleyici) -->
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
</head>
<body class="bg-[#050505] min-h-screen flex items-center justify-center p-4">
  
  <!-- Uygulamanın çalışacağı ana div -->
  <div id="root"></div>

  <!-- React Kodları -->
  <script type="text/babel">
    const { useState } = React;
    const { motion } = window.Motion;

    // --- İKONLAR ---
    const Utensils = ({ size = 24, strokeWidth = 2, className = "" }) => (
      <svg xmlns="http://www.w3.org/2000/svg" width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth={strokeWidth} strokeLinecap="round" strokeLinejoin="round" className={className}><path d="M3 2v7c0 1.1.9 2 2 2h4a2 2 0 0 0 2-2V2"/><path d="M7 2v20"/><path d="M21 15V2v0a5 5 0 0 0-5 5v6c0 1.1.9 2 2 2h3Zm0 0v7"/></svg>
    );
    const Store = ({ size = 24, strokeWidth = 2, className = "" }) => (
      <svg xmlns="http://www.w3.org/2000/svg" width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth={strokeWidth} strokeLinecap="round" strokeLinejoin="round" className={className}><path d="m2 7 4.41-4.41A2 2 0 0 1 7.83 2h8.34a2 2 0 0 1 1.42.59L22 7"/><path d="M4 12v8a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2v-8"/><path d="M15 22v-4a2 2 0 0 0-2-2h-2a2 2 0 0 0-2 2v4"/><path d="M2 7h20"/><path d="M22 7v3a2 2 0 0 1-2 2v0a2.7 2.7 0 0 1-1.59-.63.7.7 0 0 0-.82 0A2.7 2.7 0 0 1 16 12a2.7 2.7 0 0 1-1.59-.63.7.7 0 0 0-.82 0A2.7 2.7 0 0 1 12 12a2.7 2.7 0 0 1-1.59-.63.7.7 0 0 0-.82 0A2.7 2.7 0 0 1 8 12a2.7 2.7 0 0 1-1.59-.63.7.7 0 0 0-.82 0A2.7 2.7 0 0 1 4 12v0a2 2 0 0 1-2-2V7"/></svg>
    );
    const MapPin = ({ size = 24, strokeWidth = 2, className = "" }) => (
      <svg xmlns="http://www.w3.org/2000/svg" width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth={strokeWidth} strokeLinecap="round" strokeLinejoin="round" className={className}><path d="M20 10c0 6-8 12-8 12s-8-6-8-12a8 8 0 0 1 16 0Z"/><circle cx="12" cy="10" r="3"/></svg>
    );
    const ShoppingBag = ({ size = 24, strokeWidth = 2, className = "" }) => (
      <svg xmlns="http://www.w3.org/2000/svg" width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth={strokeWidth} strokeLinecap="round" strokeLinejoin="round" className={className}><path d="M6 2 3 6v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2V6l-3-4Z"/><path d="M3 6h18"/><path d="M16 10a4 4 0 0 1-8 0"/></svg>
    );
    const ArrowRight = ({ size = 24, strokeWidth = 2, className = "" }) => (
      <svg xmlns="http://www.w3.org/2000/svg" width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth={strokeWidth} strokeLinecap="round" strokeLinejoin="round" className={className}><path d="M5 12h14"/><path d="m12 5 7 7-7 7"/></svg>
    );
    const Sparkles = ({ size = 24, strokeWidth = 2, className = "" }) => (
      <svg xmlns="http://www.w3.org/2000/svg" width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth={strokeWidth} strokeLinecap="round" strokeLinejoin="round" className={className}><path d="m12 3-1.912 5.813a2 2 0 0 1-1.275 1.275L3 12l5.813 1.912a2 2 0 0 1 1.275 1.275L12 21l1.912-5.813a2 2 0 0 1 1.275-1.275L21 12l-5.813-1.912a2 2 0 0 1-1.275-1.275L12 3Z"/><path d="M5 3v4"/><path d="M19 17v4"/><path d="M3 5h4"/><path d="M17 19h4"/></svg>
    );

    const SERVICES = [
      {
        id: 'food',
        title: 'Yemek',
        desc: 'Binlerce restoran tek tıkla kapında.',
        icon: <Utensils size={22} strokeWidth={1.5} />,
        img: 'https://images.unsplash.com/photo-1555939594-58d7cb561ad1?auto=format&fit=crop&w=800&q=80',
        link: 'https://www.yemeksepeti.com/'
      },
      {
        id: 'market',
        title: 'Market',
        desc: 'İhtiyaçların dakikalar içinde seninle.',
        icon: <ShoppingBag size={22} strokeWidth={1.5} />,
        img: 'https://images.unsplash.com/photo-1542838132-92c53300491e?auto=format&fit=crop&w=800&q=80',
        link: 'https://www.yemeksepeti.com/?expedition=delivery&vertical=darkstores'
      },
      {
        id: 'mahalle',
        title: 'Mahalle',
        desc: 'Yerel esnafın sıcaklığı ve hızı.',
        icon: <Store size={22} strokeWidth={1.5} />,
        img: 'https://www.adjustbrand.com/wp-content/uploads/2021/10/1634283596_Yemeksepeti_Mahalle-scaled.jpg',
        link: 'https://www.yemeksepeti.com/?expedition=delivery&vertical=shop'
      },
      {
        id: 'gelal',
        title: 'Gel Al',
        desc: 'Sıra beklemeden, anında teslimat.',
        icon: <MapPin size={22} strokeWidth={1.5} />,
        img: 'https://kurumsal.yemeksepeti.com/wp-content/uploads/2024/02/Yemeksepeti-Gel-Al.jpeg',
        link: 'https://www.yemeksepeti.com/?expedition=pickup&vertical=restaurants'
      },
    ];

    function AwardWinningBanner() {
      const [activeIdx, setActiveIdx] = useState(0);

      return (
        <div className="w-[970px] h-[250px] bg-[#0a0a0a] rounded-[32px] overflow-hidden flex relative shadow-[0_0_80px_rgba(234,0,75,0.15)] ring-1 ring-white/10">
          {/* Ambient Glow */}
          <div className="absolute top-0 left-0 w-[400px] h-[400px] bg-[#ea004b] rounded-full mix-blend-screen filter blur-[120px] opacity-20 pointer-events-none transform -translate-x-1/2 -translate-y-1/2"></div>

          {/* Left: Brand Area */}
          <div className="w-[340px] p-8 flex flex-col justify-between relative z-10">
            <div>
              <img
                src="https://kurumsal.yemeksepeti.com/wp-content/uploads/2023/04/yemek-logo.svg"
                alt="Yemeksepeti"
                className="h-7 object-contain brightness-0 invert"
                referrerPolicy="no-referrer"
              />
            </div>

            <div>
              <div className="inline-flex items-center gap-1.5 bg-white/5 border border-white/10 backdrop-blur-md text-white px-3 py-1.5 rounded-full mb-4">
                <Sparkles size={14} className="text-[#ea004b]" />
                <span className="text-[10px] font-bold tracking-[0.2em] uppercase text-white/90">25. Yıl Özel</span>
              </div>
              <h2 className="text-[36px] font-light text-white leading-[1.05] tracking-tight">
                Aklındaysa <br />
                <span className="font-black text-[#ea004b]">Kapında.</span>
              </h2>
              
              <button 
                onClick={() => window.open('https://www.yemeksepeti.com/', '_blank')}
                className="mt-6 group relative inline-flex items-center justify-center gap-2 bg-[#ea004b] text-white px-6 py-3 rounded-full font-semibold text-[13px] tracking-wide overflow-hidden transition-all duration-300 hover:scale-105 hover:shadow-[0_0_30px_rgba(234,0,75,0.4)]"
              >
                <span className="relative z-10 flex items-center gap-2">
                  Hemen Sipariş Ver
                  <ArrowRight size={16} className="group-hover:translate-x-1 transition-transform duration-300" />
                </span>
                <div className="absolute inset-0 bg-white/20 translate-y-full group-hover:translate-y-0 transition-transform duration-300 ease-out rounded-full"></div>
              </button>
            </div>
          </div>

          {/* Right: Interactive Accordion */}
          <div className="flex-1 flex gap-2 p-3 relative z-10">
            {SERVICES.map((item, idx) => {
              const isActive = activeIdx === idx;

              return (
                <motion.div
                  key={item.id}
                  onMouseEnter={() => setActiveIdx(idx)}
                  onClick={() => window.open(item.link, '_blank')}
                  animate={{
                    width: isActive ? '380px' : '70px',
                  }}
                  transition={{ type: 'spring', bounce: 0.2, duration: 0.6 }}
                  className="relative h-full rounded-[24px] overflow-hidden cursor-pointer group"
                >
                  {/* Background Image */}
                  <motion.div
                    className="absolute inset-0 bg-cover bg-center"
                    style={{ backgroundImage: `url(${item.img})` }}
                    animate={{ scale: isActive ? 1 : 1.2 }}
                    transition={{ duration: 0.8, ease: "easeOut" }}
                  />

                  {/* Gradient Overlay */}
                  <div className={`absolute inset-0 transition-opacity duration-500 ${isActive ? 'bg-gradient-to-t from-black/90 via-black/40 to-transparent' : 'bg-black/60 group-hover:bg-black/40'}`} />

                  {/* Content Container */}
                  <div className="absolute inset-0 p-5 flex flex-col justify-end">
                    {/* Active State Content */}
                    <motion.div
                      animate={{ opacity: isActive ? 1 : 0, y: isActive ? 0 : 20 }}
                      transition={{ duration: 0.4, delay: isActive ? 0.1 : 0 }}
                      className={`flex flex-col gap-2 ${isActive ? 'pointer-events-auto' : 'pointer-events-none absolute opacity-0'}`}
                    >
                      <div className="w-10 h-10 rounded-full bg-[#ea004b] flex items-center justify-center text-white shadow-lg shadow-[#ea004b]/30 mb-1">
                        {item.icon}
                      </div>
                      <h3 className="text-white font-bold text-2xl tracking-tight leading-none">{item.title}</h3>
                      <p className="text-white/80 text-[13px] font-medium line-clamp-2 leading-snug pr-4">{item.desc}</p>
                      <div className="mt-1 flex items-center gap-1.5 text-[#ea004b] text-[11px] font-bold uppercase tracking-widest">
                        Keşfet <ArrowRight size={14} />
                      </div>
                    </motion.div>

                    {/* Inactive State Content (Vertical Text) */}
                    <motion.div
                      animate={{ opacity: !isActive ? 1 : 0 }}
                      transition={{ duration: 0.3 }}
                      className={`absolute inset-0 flex flex-col items-center justify-end pb-6 ${!isActive ? 'pointer-events-auto' : 'pointer-events-none'}`}
                    >
                      <div className="text-white/50 mb-4 group-hover:text-white/90 transition-colors duration-300">
                        {item.icon}
                      </div>
                      <span
                        className="text-white font-semibold tracking-widest text-sm uppercase group-hover:text-[#ea004b] transition-colors duration-300"
                        style={{ writingMode: 'vertical-rl', transform: 'rotate(180deg)' }}
                      >
                        {item.title}
                      </span>
                    </motion.div>
                  </div>
                </motion.div>
              );
            })}
          </div>
        </div>
      );
    }

    // React uygulamasını başlat
    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<AwardWinningBanner />);
  </script>
</body>
</html>
