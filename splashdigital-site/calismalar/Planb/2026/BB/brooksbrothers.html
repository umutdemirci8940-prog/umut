<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Brooks Brothers - Interactive Masthead</title>
  
  <!-- 1. Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>
  
  <!-- 2. Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Libre+Baskerville:ital,wght@0,400;0,700;1,400&family=Montserrat:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  
  <!-- 3. React & ReactDOM (UMD) -->
  <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
  <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
  
  <!-- 4. Framer Motion (UMD) -->
  <script src="https://unpkg.com/framer-motion@10.16.4/dist/framer-motion.js"></script>
  
  <!-- 5. Babel Standalone -->
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

  <!-- Tailwind Configuration -->
  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            'bb-navy': '#002147', // Brooks Brothers Navy
            'bb-gold': '#A38856', // Gold/Bronze
            'bb-cream': '#F5F5F0', // Off-white
          },
          fontFamily: {
            serif: ['"Libre Baskerville"', 'serif'],
            sans: ['"Montserrat"', 'sans-serif'],
          },
        }
      }
    }
  </script>

  <style>
    body {
      margin: 0;
      padding: 0;
      background-color: #e5e7eb;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      font-family: 'Montserrat', sans-serif;
    }
    .no-scrollbar::-webkit-scrollbar { display: none; }
    .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
  </style>
</head>
<body>

  <!-- Root Element -->
  <div id="root"></div>

  <!-- React Application Logic -->
  <script type="text/babel">
    // Global değişkenlerden React hook'larını ve kütüphaneleri alıyoruz
    const { useState, useEffect } = React;
    const { createRoot } = ReactDOM;
    const { motion, AnimatePresence } = window.Motion;

    // --- ICONS (Inline SVG to remove dependency) ---
    const ArrowRightIcon = ({ className }) => (
      <svg 
        xmlns="http://www.w3.org/2000/svg" 
        width="24" height="24" 
        viewBox="0 0 24 24" 
        fill="none" 
        stroke="currentColor" 
        strokeWidth="2" 
        strokeLinecap="round" 
        strokeLinejoin="round" 
        className={className}
      >
        <path d="M5 12h14" />
        <path d="m12 5 7 7-7 7" />
      </svg>
    );

    // --- LOGO COMPONENT ---
    const Logo = ({ className }) => (
      <motion.img 
        src="https://logos-world.net/wp-content/uploads/2020/08/Brooks-Brothers-Logo.png" 
        alt="Brooks Brothers"
        // Added brightness-0 invert to make the logo white on the dark navy background
        className={`${className} brightness-0 invert`} 
        initial={{ opacity: 0 }}
        animate={{ opacity: 1 }}
        transition={{ duration: 0.8 }}
      />
    );

    // --- DATA ---
    const SECTIONS = [
      {
        id: 1,
        category: "NEW ARRIVALS",
        title: "Sonbahar Şıklığı",
        description: "Şehre dönüş için modern klasikler.",
        // 1. Man in suit - good crop
        image: "https://images.unsplash.com/photo-1594938298603-c8148c4dae35?auto=format&fit=crop&q=80&w=2000", 
        imgPosition: "object-top", 
        btnText: "KEŞFET"
      },
      {
        id: 2,
        category: "NON-IRON",
        title: "Kusursuz Görünüm",
        description: "Ütü gerektirmeyen teknolojiyle gün boyu şıklık.",
        // 2. White shirt, clear product
        image: "https://images.unsplash.com/photo-1521572163474-6864f9cf17ab?auto=format&fit=crop&q=80&w=2000", 
        imgPosition: "object-center", 
        btnText: "İNCELE"
      },
      {
        id: 3,
        category: "FRAGRANCE",
        title: "Park Avenue",
        description: "İmza niteliğinde, zamansız bir koku.",
        // 3. Premium Perfume Bottle (Park Avenue representation)
        image: "https://images.unsplash.com/photo-1541643600914-78b084683601?auto=format&fit=crop&q=80&w=2000", 
        imgPosition: "object-center", 
        btnText: "ALIŞVERİŞ"
      }
    ];

    // --- BANNER COMPONENT ---
    const BrooksBanner = () => {
      const [activeId, setActiveId] = useState(null);
      const [introFinished, setIntroFinished] = useState(false);

      useEffect(() => {
        const timer = setTimeout(() => setIntroFinished(true), 2400);
        return () => clearTimeout(timer);
      }, []);

      return (
        <div className="relative w-[970px] h-[250px] bg-bb-cream overflow-hidden shadow-2xl flex select-none group border border-white/40">
          
          {/* --- STATIC HEADER / LOGO AREA --- */}
          <div className="absolute top-0 left-0 w-full z-20 pointer-events-none px-6 py-5 flex justify-between items-start">
            <div className="flex flex-col">
              {/* Logo size preserved (h-16) */}
              <Logo className="h-16 w-auto object-contain" />
            </div>
          </div>

          {/* --- ACCORDION SECTIONS --- */}
          {SECTIONS.map((section) => {
            const isActive = activeId === section.id || (activeId === null && section.id === 1); 
            
            return (
              <motion.div
                key={section.id}
                layout
                onMouseEnter={() => setActiveId(section.id)}
                onMouseLeave={() => setActiveId(null)}
                className="relative h-full border-r border-white/50 overflow-hidden cursor-pointer bg-bb-navy"
                initial={{ flex: 1 }}
                animate={{ flex: isActive ? 2.5 : 0.8 }}
                transition={{ type: "spring", stiffness: 200, damping: 25 }}
              >
                {/* Image Layer */}
                <motion.div 
                  className="absolute inset-0 w-full h-full"
                  // Scale: 1.0 when active to see full product context. 1.1 when inactive for depth.
                  animate={{ scale: isActive ? 1.0 : 1.1 }} 
                  transition={{ duration: 0.8 }}
                >
                  <img 
                    src={section.image} 
                    alt={section.title} 
                    className={`w-full h-full object-cover ${section.imgPosition || 'object-center'}`}
                  />
                  {/* Overlay */}
                  <motion.div 
                    className="absolute inset-0 bg-bb-navy"
                    animate={{ opacity: isActive ? 0.1 : 0.4 }}
                    transition={{ duration: 0.3 }}
                  />
                  
                  {/* Bottom Gradient */}
                  <div className="absolute inset-x-0 bottom-0 h-3/4 bg-gradient-to-t from-bb-navy via-bb-navy/50 to-transparent" />
                </motion.div>

                {/* Content Layer */}
                <div className="absolute inset-0 p-8 flex flex-col justify-end">
                  <motion.div
                    layout="position"
                    className="flex flex-col items-start w-full"
                  >
                    {/* Category Label */}
                    <motion.span 
                      className="text-bb-gold font-sans text-[9px] font-bold tracking-[0.25em] uppercase mb-2 bg-bb-navy/90 px-2 py-1 backdrop-blur-sm rounded-sm"
                      animate={{ opacity: isActive ? 1 : 0.8 }}
                    >
                      {section.category}
                    </motion.span>

                    {/* Title */}
                    <motion.h2 
                      className="text-white font-serif text-3xl leading-none mb-2 text-nowrap"
                      layout="position"
                    >
                      {section.title}
                    </motion.h2>

                    {/* Description & Button */}
                    <AnimatePresence>
                      {isActive && (
                        <motion.div
                          initial={{ opacity: 0, height: 0 }}
                          animate={{ opacity: 1, height: "auto" }}
                          exit={{ opacity: 0, height: 0 }}
                          transition={{ duration: 0.3 }}
                          className="overflow-hidden"
                        >
                          <p className="text-gray-200 font-sans text-xs mb-4 max-w-[280px] leading-relaxed">
                            {section.description}
                          </p>
                          
                          <button className="bg-white text-bb-navy px-6 py-2 flex items-center gap-2 hover:bg-bb-gold hover:text-white transition-colors duration-300 group/btn shadow-lg">
                            <span className="font-sans text-[10px] font-bold tracking-widest uppercase">{section.btnText}</span>
                            <ArrowRightIcon className="w-3 h-3 group-hover/btn:translate-x-1 transition-transform" />
                          </button>
                        </motion.div>
                      )}
                    </AnimatePresence>
                  </motion.div>
                </div>
              </motion.div>
            );
          })}

          {/* --- INTRO SHUTTER ANIMATION --- */}
          <AnimatePresence>
            {!introFinished && (
              <motion.div 
                className="absolute inset-0 z-50 flex"
                exit={{ pointerEvents: "none" }}
              >
                {[0, 1, 2, 3, 4].map((i) => (
                  <motion.div
                    key={i}
                    className="h-full bg-bb-navy relative border-r border-white/5"
                    style={{ zIndex: i === 2 ? 20 : 10 }}
                    initial={{ width: "20%" }}
                    exit={{ height: 0 }}
                    transition={{ 
                      duration: 0.8, 
                      ease: [0.76, 0, 0.24, 1],
                      delay: i * 0.1 
                    }}
                  >
                    {/* Logo in Center Panel - Now Larger and Overlapping */}
                    {i === 2 && (
                      <motion.div 
                        className="absolute inset-0 flex items-center justify-center"
                        exit={{ opacity: 0 }}
                        transition={{ duration: 0.3 }}
                      >
                        <div className="">
                           {/* INCREASED LOGO SIZE: w-80 */}
                           <Logo className="w-80 h-auto object-contain drop-shadow-lg" />
                        </div>
                      </motion.div>
                    )}
                  </motion.div>
                ))}
              </motion.div>
            )}
          </AnimatePresence>
          
          {/* Decorative Border Frame */}
          <div className="absolute inset-0 border-[6px] border-bb-cream pointer-events-none z-10" />
          
        </div>
      );
    };

    // --- APP WRAPPER ---
    const App = () => {
      return (
        <div className="flex justify-center items-center">
          <BrooksBanner />
        </div>
      );
    };

    const root = createRoot(document.getElementById('root'));
    root.render(<App />);
  </script>
</body>
</html>
