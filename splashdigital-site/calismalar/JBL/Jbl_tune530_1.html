<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>JBL TUNE 530BT Banner</title>
    <script src="https://cdn.tailwindcss.com"></script>
    
    <!-- React & ReactDOM -->
    <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    
    <!-- Framer Motion -->
    <script src="https://unpkg.com/framer-motion@10.16.4/dist/framer-motion.js"></script>
    
    <!-- Babel -->
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;900&display=swap');
        body { font-family: 'Inter', sans-serif; background-color: #171717; margin: 0; display: flex; justify-content: center; align-items: center; min-height: 100vh; }
    </style>
</head>
<body>
    <div id="root"></div>

    <script type="text/babel">
        // Global değişkenlerden React ve Motion bileşenlerini al
        const { useState, useEffect } = React;
        const { createRoot } = ReactDOM;
        const { motion, AnimatePresence } = Motion;

        // Icons
        const Zap = ({ size = 24, className = "" }) => (
            <svg xmlns="http://www.w3.org/2000/svg" width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={className}><polygon points="13 2 3 14 12 14 11 22 21 10 12 10 13 2"/></svg>
        );
        const Battery = ({ size = 24, className = "" }) => (
            <svg xmlns="http://www.w3.org/2000/svg" width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={className}><rect width="16" height="10" x="2" y="7" rx="2" ry="2"/><line x1="22" x2="22" y1="11" y2="13"/></svg>
        );
        const Droplets = ({ size = 24, className = "" }) => (
            <svg xmlns="http://www.w3.org/2000/svg" width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={className}><path d="M7 16.3c2.2 0 4-1.83 4-4.05 0-1.16-.57-2.26-1.71-3.19S7.29 6.75 7 5.3c-.29 1.45-1.14 2.8-2.29 3.76S3 11.1 3 12.25c0 2.22 1.8 4.05 4 4.05z"/><path d="M12.56 6.6A10.97 10.97 0 0 0 14 3.02c.5 2.5 2 4.9 4 6.5s3 3.5 3 5.5a6.98 6.98 0 0 1-11.91 4.97"/></svg>
        );
        const Radio = ({ size = 24, className = "" }) => (
            <svg xmlns="http://www.w3.org/2000/svg" width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={className}><path d="M4.9 19.1C1 15.2 1 8.8 4.9 4.9"/><path d="M7.8 16.2c-2.3-2.3-2.3-6.1 0-8.5"/><circle cx="12" cy="12" r="2"/><path d="M16.2 7.8c2.3 2.3 2.3 6.1 0 8.5"/><path d="M19.1 4.9C23 8.8 23 15.1 19.1 19"/></svg>
        );
        const ChevronRight = ({ size = 24, className = "" }) => (
            <svg xmlns="http://www.w3.org/2000/svg" width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={className}><path d="m9 18 6-6-6-6"/></svg>
        );

        // Data
        const SLIDES = [
          {
            id: 0,
            title: "JBL PURE BASS SES",
            subtitle: "MÜZİĞİN GÜCÜNÜ HİSSEDİN",
            icon: <Zap size={20} />,
            desc: "33 mm sürücüler ile derin, güçlü ve zengin bas deneyimi.",
            color: "#0055cc"
          },
          {
            id: 1,
            title: "76 SAAT PİL ÖMRÜ",
            subtitle: "KESİNTİSİZ EĞLENCE",
            icon: <Battery size={20} />,
            desc: "Sadece 5 dakikalık hızlı şarjla 6 saat ek kullanım.",
            color: "#cc0055"
          },
          {
            id: 2,
            title: "BLUETOOTH 6.0 + LE",
            subtitle: "DÜŞÜK GECİKME, YÜKSEK KALİTE",
            icon: <Radio size={20} />,
            desc: "Daha az güç tüketimi ile kusursuz kablosuz bağlantı.",
            color: "#00cc55"
          },
          {
            id: 3,
            title: "KUSURSUZ ARAMALAR",
            subtitle: "BEAMFORMING MİKROFONLAR",
            icon: <Zap size={20} />,
            desc: "Gürültüyü geride bırakın, sesiniz kristal netliğinde ulaşsın.",
            color: "#cc5500"
          }
        ];

        const VARIANTS = [
          {
            id: 'black',
            name: 'BLACK',
            color: '#a3a3a3', // Siyah varyant için okunabilir Gümüş/Gri tonu
            image: 'https://global.jbl.com/dw/image/v2/BFND_PRD/on/demandware.static/-/Sites-masterCatalog_Harman/default/dwf7b34080/01.LS_JBL_Tune_530BT_Product-Image_Hero_Black.png?sw=535&sh=535'
          },
          {
            id: 'purple',
            name: 'PURPLE',
            color: '#8A2BE2',
            image: 'https://global.jbl.com/dw/image/v2/BFND_PRD/on/demandware.static/-/Sites-masterCatalog_Harman/default/dw38f79212/01.LS_JBL_Tune_530BT_Product-Image_Hero_Purple.png?sw=535&sh=535'
          },
          {
            id: 'white',
            name: 'WHITE',
            color: '#f0f0f0',
            image: 'https://global.jbl.com/dw/image/v2/BFND_PRD/on/demandware.static/-/Sites-masterCatalog_Harman/default/dw134ee35c/01.LS_JBL_Tune_530BT_Product-Image_Hero_White.png?sw=535&sh=535'
          },
          {
            id: 'gold',
            name: 'GOLD',
            color: '#D4AF37',
            image: 'https://global.jbl.com/dw/image/v2/BFND_PRD/on/demandware.static/-/Sites-masterCatalog_Harman/default/dw99ca7cf3/01.LS_JBL_Tune_530BT_Product-Image_Hero_Beige.png?sw=535&sh=535'
          }
        ];

        function JBLTune530BTBanner() {
          const [currentSlide, setCurrentSlide] = useState(0);
          const [isBoosted, setIsBoosted] = useState(true);
          const [selectedVariant, setSelectedVariant] = useState(VARIANTS[1]); // Varsayılan Mor
          const [particles, setParticles] = useState([]);

          // Auto-rotate slides
          useEffect(() => {
            const slideTimer = setInterval(() => {
              setCurrentSlide((prev) => (prev + 1) % SLIDES.length);
            }, 4000);
            return () => clearInterval(slideTimer);
          }, []);

          // Generate particles
          useEffect(() => {
            if (isBoosted) {
              const newParticles = Array.from({ length: 40 }).map((_, i) => ({
                x: Math.random() * 100,
                y: Math.random() * 100,
                id: i,
              }));
              setParticles(newParticles);
            }
          }, [isBoosted]);

          const activeColor = selectedVariant.color;

          return (
            <div className="relative w-[970px] h-[250px] overflow-hidden bg-black font-sans select-none shadow-2xl group transition-colors duration-1000">
              
              {/* Dynamic Background */}
              <div className="absolute inset-0 bg-black">
                <motion.div
                  animate={{
                    opacity: 0.6,
                    background: `radial-gradient(circle at 70% 50%, ${activeColor} 0%, #000 70%)`
                  }}
                  transition={{ duration: 1 }}
                  className="absolute inset-0"
                />
                
                {/* Floating Particles */}
                <AnimatePresence>
                  {particles.map((p) => (
                    <motion.div
                      key={p.id}
                      initial={{ opacity: 0, scale: 0, x: `${p.x}%`, y: `${p.y}%` }}
                      animate={{ 
                        opacity: [0, 0.8, 0], 
                        scale: [0, 1.5, 0],
                        y: [`${p.y}%`, `${p.y - 20}%`],
                        x: [`${p.x}%`, `${p.x + (Math.random() - 0.5) * 15}%`]
                      }}
                      transition={{ duration: 2, repeat: Infinity, delay: Math.random() * 2 }}
                      className="absolute w-1 h-1 rounded-full blur-[1px]"
                      style={{ backgroundColor: activeColor }}
                    />
                  ))}
                </AnimatePresence>
              </div>

              {/* Content Container */}
              <div className="relative z-10 w-full h-full flex items-center justify-between px-12">
                
                {/* LEFT: Branding & Slide Content */}
                <div className="flex flex-col justify-center w-[40%] z-20 h-full py-8">
                  {/* Static Header */}
                  <div className="flex items-center space-x-3 mb-4">
                     <img 
                      src="https://global.jbl.com/on/demandware.static/-/Library-Sites-SharedLibrary-JB-GLOBAL/default/dw4f3bcdb9/images/jbl-logo.svg" 
                      alt="JBL Logo" 
                      className="h-10 w-auto filter drop-shadow-[0_0_5px_rgba(255,255,255,0.5)]"
                      referrerPolicy="no-referrer"
                    />
                    <div className="h-8 w-[1px] bg-white/30"></div>
                    <h2 className="text-2xl font-black italic tracking-tighter text-white leading-none">
                      TUNE 530BT <span className="text-[10px] not-italic font-normal tracking-widest block opacity-70" style={{ color: activeColor }}>{selectedVariant.name} EDITION</span>
                    </h2>
                  </div>

                  {/* Dynamic Slide Content */}
                  <div className="relative h-32">
                    <AnimatePresence mode="wait">
                      <motion.div
                        key={currentSlide}
                        initial={{ opacity: 0, x: -20 }}
                        animate={{ opacity: 1, x: 0 }}
                        exit={{ opacity: 0, x: 20 }}
                        transition={{ duration: 0.4 }}
                        className="absolute inset-0 flex flex-col justify-center"
                      >
                        <div className="flex items-center space-x-2 mb-2" style={{ color: activeColor }}>
                          {SLIDES[currentSlide].icon}
                          <span className="text-xs font-bold tracking-widest uppercase">{SLIDES[currentSlide].subtitle}</span>
                        </div>
                        <h3 className="text-3xl font-black uppercase leading-[0.9] text-white mb-2">
                          {SLIDES[currentSlide].title}
                        </h3>
                        <p className="text-white/70 text-xs leading-relaxed max-w-xs">
                          {SLIDES[currentSlide].desc}
                        </p>
                      </motion.div>
                    </AnimatePresence>
                  </div>

                  {/* Slide Indicators */}
                  <div className="flex space-x-1 mt-auto">
                    {SLIDES.map((_, idx) => (
                      <div 
                        key={idx} 
                        className={`h-1 rounded-full transition-all duration-300 ${idx === currentSlide ? 'w-8' : 'w-2 bg-white/20'}`}
                        style={{ backgroundColor: idx === currentSlide ? activeColor : undefined }}
                      />
                    ))}
                  </div>
                </div>

                {/* CENTER: Explosive Product */}
                <div className="relative w-[30%] h-full flex items-center justify-center z-30">
                  {/* Shockwaves - Yavaşlatıldı */}
                  {[...Array(3)].map((_, i) => (
                    <motion.div
                      key={i}
                      animate={{ 
                        scale: [1, 2.5], 
                        opacity: [0.6, 0],
                        borderWidth: [2, 0]
                      }}
                      transition={{
                        duration: 1.5,
                        repeat: Infinity,
                        delay: i * 0.5,
                        ease: "easeOut"
                      }}
                      className="absolute w-48 h-48 rounded-full border shadow-[0_0_30px_currentColor]"
                      style={{ borderColor: activeColor, color: activeColor }}
                    />
                  ))}
                  
                  {/* Intense Glow - Yavaşlatıldı */}
                  <motion.div
                    animate={{ opacity: [0.3, 0.6, 0.3], scale: [1, 1.05, 1] }}
                    transition={{ duration: 1.0, repeat: Infinity, repeatType: "reverse" }}
                    className="absolute w-64 h-64 rounded-full blur-[60px] mix-blend-screen"
                    style={{ backgroundColor: activeColor }}
                  />

                  {/* Product Image - BASS SHAKE EFFECT - Yavaşlatıldı */}
                  <motion.div
                    key={selectedVariant.id}
                    initial={{ scale: 0.8, opacity: 0 }}
                    animate={{ 
                      scale: [1, 1.05, 1], // Pump effect
                      rotate: [0, -1, 1, -0.5, 0.5, 0], // Shake effect
                      opacity: 1
                    }}
                    transition={{ 
                      scale: { duration: 1.0, repeat: Infinity, ease: "easeInOut" },
                      rotate: { duration: 1.0, repeat: Infinity, ease: "easeInOut" },
                      opacity: { duration: 0.3 }
                    }}
                    className="relative z-20 cursor-pointer"
                    onClick={() => setIsBoosted(!isBoosted)}
                  >
                    <img 
                      src={selectedVariant.image}
                      alt={`JBL TUNE 530BT ${selectedVariant.name}`}
                      className="w-64 h-64 object-contain drop-shadow-[0_20px_50px_rgba(0,0,0,0.8)]"
                      referrerPolicy="no-referrer"
                    />
                  </motion.div>

                  {/* Color Palette */}
                  <div className="absolute -right-8 top-1/2 transform -translate-y-1/2 flex flex-col space-y-2 z-40">
                    {VARIANTS.map((variant) => (
                      <button
                        key={variant.id}
                        onClick={() => setSelectedVariant(variant)}
                        className={`w-4 h-4 rounded-full border-2 transition-all duration-300 ${selectedVariant.id === variant.id ? 'scale-125 border-white shadow-[0_0_10px_white]' : 'border-transparent opacity-50 hover:opacity-100 hover:scale-110'}`}
                        style={{ backgroundColor: variant.color }}
                        title={variant.name}
                      />
                    ))}
                  </div>
                </div>

                {/* RIGHT: CTA */}
                <div className="flex flex-col items-end justify-center w-[30%] space-y-6 z-20">
                  <div className="flex flex-col items-end space-y-2">
                    <a 
                      href="https://global.jbl.com/on-ear-headphones/TUNE530BT.html" 
                      target="_blank" 
                      rel="noopener noreferrer"
                      className="group relative overflow-hidden text-black px-8 py-3 rounded-none skew-x-[-10deg] font-black uppercase text-sm tracking-widest flex items-center space-x-2 shadow-[0_0_20px_rgba(255,255,255,0.2)]"
                      style={{ backgroundColor: activeColor, boxShadow: `0 0 20px ${activeColor}66` }}
                    >
                      <span className="relative z-10 skew-x-[10deg]">SATIN AL</span>
                      <ChevronRight size={16} className="relative z-10 skew-x-[10deg] group-hover:translate-x-1 transition-transform" />
                      <div className="absolute inset-0 bg-white transform scale-x-0 group-hover:scale-x-100 transition-transform origin-left duration-300" />
                    </a>
                    <p className="text-white/50 text-[10px] tracking-wider font-mono">SINIRLI SÜRE FIRSATI</p>
                  </div>
                </div>
              </div>
              
              {/* Beat Flash Effect - Yavaşlatıldı */}
              <motion.div
                animate={{ opacity: [0, 0.05, 0] }}
                transition={{ duration: 1.0, repeat: Infinity }}
                className="absolute inset-0 mix-blend-overlay pointer-events-none z-50"
                style={{ backgroundColor: activeColor }}
              />
            </div>
          );
        }

        const root = createRoot(document.getElementById('root'));
        root.render(<JBLTune530BTBanner />);
    </script>
</body>
</html>
