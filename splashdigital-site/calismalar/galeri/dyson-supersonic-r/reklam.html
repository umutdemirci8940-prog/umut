:root {
  --k: #0b0b0b;
  --k2: #171717;
  --k3: #262626;
  --w: #fff;
  --g: #f3f3f3;
  --g2: #e4e4e4;
  --mut: #8c8c8c;
  --cu: #c8875a;
  --cu2: #e8b48c;
  --plum: #4a2338;
  --sans: 'Jost', 'Futura', 'Century Gothic', 'Helvetica Neue', Arial, sans-serif;
  --ease: cubic-bezier(.22, .8, .2, 1);
}
* { box-sizing: border-box; margin: 0; padding: 0; }
html, body { width: 100%; height: 100%; overflow: hidden; background: var(--k); }
body { font-family: var(--sans); color: var(--w); -webkit-font-smoothing: antialiased; -webkit-tap-highlight-color: transparent; user-select: none; -webkit-user-select: none; cursor: default; }
img { display: block; -webkit-user-drag: none; user-select: none; pointer-events: none; }
button { font: inherit; color: inherit; border: 0; background: none; cursor: pointer; }
.ad { position: relative; width: 970px; height: 250px; overflow: hidden; background: var(--k); }
.logo { width: 74px; height: 28px; }
.logo.s { width: 60px; height: 23px; }

/* 11.11 rozeti */
.n11 { font-weight: 600; letter-spacing: -.03em; line-height: .82; background: linear-gradient(180deg, #f3c9a6 0%, var(--cu) 55%, #9c5f38 100%); -webkit-background-clip: text; background-clip: text; color: transparent; }
.kick { font-size: 11px; font-weight: 600; letter-spacing: .18em; text-transform: uppercase; color: var(--cu2); }

/* CTA – tek yönlendirme noktası */
.cta { display: inline-flex; align-items: center; justify-content: center; gap: 10px; height: 38px; padding: 0 20px; background: var(--w); color: var(--k); font-weight: 600; font-size: 13px; letter-spacing: .02em; text-decoration: none; white-space: nowrap; border-radius: 3px; cursor: pointer; transition: background .25s, color .25s, transform .25s var(--ease), box-shadow .25s; }
.cta:hover { background: var(--cu); color: #fff; transform: translateY(-1px); box-shadow: 0 8px 20px rgba(200, 135, 90, .35); }
.cta i { font-style: normal; transition: transform .25s var(--ease); }
.cta:hover i { transform: translateX(3px); }
.cta.dk { background: var(--k); color: #fff; }
.cta.dk:hover { background: var(--cu); }
.cta.sm { height: 32px; padding: 0 14px; font-size: 12px; }

/* Fiyat */
.old { font-size: 12px; color: rgba(255, 255, 255, .55); text-decoration: line-through; white-space: nowrap; }
.now { font-weight: 600; white-space: nowrap; letter-spacing: -.01em; }
.now small { font-size: .5em; font-weight: 500; letter-spacing: .02em; margin-right: 6px; opacity: .8; }

/* Kupon kodu (kopyalama – yönlendirme yok) */
.code { display: inline-flex; align-items: center; gap: 8px; height: 26px; padding: 0 10px; border: 1px dashed rgba(255, 255, 255, .55); border-radius: 3px; font-size: 11px; font-weight: 600; letter-spacing: .08em; white-space: nowrap; cursor: pointer; transition: background .2s, border-color .2s; }
.code:hover { background: rgba(255, 255, 255, .1); }
.code em { font-style: normal; font-size: 9px; letter-spacing: .1em; text-transform: uppercase; color: var(--cu2); }
.code.ok { background: var(--cu); border-color: var(--cu); }
.code.ok em { color: #fff; }

.legal { font-size: 8.5px; line-height: 1.3; color: rgba(255, 255, 255, .5); }
.fade { animation: fade .6s var(--ease) both; }
@keyframes fade { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: none; } }
@keyframes rise { from { opacity: 0; transform: translateY(14px); } to { opacity: 1; transform: none; } }
@keyframes pulse { 0%, 100% { box-shadow: 0 0 0 0 rgba(200, 135, 90, .6); } 50% { box-shadow: 0 0 0 8px rgba(200, 135, 90, 0); } }
@media (prefers-reduced-motion: reduce) { *, *::before, *::after { transition-duration: .01s !important; animation-duration: .01s !important; } }

</style>
</head>
