<title>Honda Africa Twin – Kumdan Doğan</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700&family=Barlow:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{--red:#cc0000;--red2:#ff3d3d;--ink:#0d0f12;--paper:#f4f1ea;--mute:rgba(244,241,234,.7);--sand:#e2c08d}
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{width:100%;height:100%;overflow:hidden;background:var(--ink)}
  body{font-family:Barlow,Arial,sans-serif;color:var(--paper);-webkit-font-smoothing:antialiased;user-select:none;-webkit-user-select:none;-webkit-tap-highlight-color:transparent}
  button{font:inherit;color:inherit}
  img{-webkit-user-drag:none}
  #ad{position:relative;width:100vw;height:100vh;overflow:hidden;background:radial-gradient(70% 140% at 70% 60%,#2b2016,#120e0b 55%,var(--ink))}

  /* fırtına sonrası gerçek fotoğraf */
  .photo{position:absolute;left:330px;top:0;right:0;bottom:0;opacity:0;transform:scale(1.15);filter:blur(10px) sepia(.6);
         transition:opacity 1.2s ease,transform 3s cubic-bezier(.2,.7,.2,1),filter 1.6s ease;
         -webkit-mask-image:linear-gradient(90deg,transparent 0,#000 140px);mask-image:linear-gradient(90deg,transparent 0,#000 140px)}
  .photo img{width:100%;height:100%;object-fit:cover;object-position:60% 50%;display:block}
  .storm .photo{opacity:1;transform:none;filter:none}
  .photo::after{content:"";position:absolute;inset:0;background:linear-gradient(0deg,rgba(13,15,18,.8),rgba(13,15,18,0) 45%)}
  canvas{position:absolute;inset:0;width:100%;height:100%;touch-action:none;cursor:crosshair}
  .storm canvas{pointer-events:none}

  .brand{position:absolute;z-index:6;left:28px;top:18px;display:flex;align-items:center;gap:12px;pointer-events:none}
  .brand img{height:32px;display:block}
  .brand .bar{width:1px;height:22px;background:rgba(255,255,255,.3)}
  .brand .model{font:600 14px/1 'Barlow Condensed';letter-spacing:.24em;color:#fff}
  .copy{position:absolute;z-index:6;left:28px;top:62px;width:290px;pointer-events:none}
  .kicker{font:600 12px/1 'Barlow Condensed';letter-spacing:.22em;text-transform:uppercase;color:var(--sand);margin-bottom:7px}
  .storm .kicker{color:var(--red2)}
  h1{font:700 30px/1 'Barlow Condensed';text-transform:uppercase}
  .copy p{margin-top:7px;font:400 12.5px/1.38 Barlow;color:var(--mute)}
  .swap{transition:opacity .35s,transform .35s}.swap.out{opacity:0;transform:translateY(6px)}

  .meter{position:absolute;z-index:6;left:28px;bottom:24px;width:250px;pointer-events:none;transition:opacity .5s}
  .meter .row{display:flex;justify-content:space-between;font:600 11px/1 'Barlow Condensed';letter-spacing:.18em;text-transform:uppercase;color:var(--mute);margin-bottom:6px}
  .meter .row b{color:#fff;font-variant-numeric:tabular-nums}
  .meter .track{height:4px;background:rgba(255,255,255,.14);overflow:hidden}
  .meter .fill{height:100%;width:0;background:linear-gradient(90deg,var(--sand),var(--red2));transition:width .2s}
  .storm .meter{opacity:0}
  .tip{position:absolute;z-index:6;left:50%;top:14px;margin-left:120px;font:600 11px/1 'Barlow Condensed';letter-spacing:.2em;text-transform:uppercase;color:var(--sand);
       padding:7px 11px;background:rgba(13,15,18,.5);pointer-events:none;transition:opacity .4s;animation:tip 2s ease-in-out infinite}
  @keyframes tip{50%{opacity:.45}}
  .touched .tip,.storm .tip{opacity:0;animation:none}
  .chips{position:absolute;z-index:6;left:28px;bottom:22px;display:flex;gap:6px;opacity:0;transform:translateY(8px);transition:opacity .5s .9s,transform .5s .9s}
  .storm .chips{opacity:1;transform:none}
  .chip{font:500 11px/1 Barlow;padding:7px 9px;background:rgba(255,255,255,.08);border-left:2px solid var(--red2)}
  .again{position:absolute;z-index:6;right:24px;top:20px;border:0;background:none;cursor:pointer;opacity:0;pointer-events:none;
         font:600 11px/1 'Barlow Condensed';letter-spacing:.16em;text-transform:uppercase;color:var(--mute);text-decoration:underline;text-underline-offset:3px;transition:opacity .4s 1.4s}
  .storm .again{opacity:1;pointer-events:auto}

  .cta{position:absolute;z-index:7;right:24px;bottom:20px;display:flex;gap:8px}
  .btn{border:0;cursor:pointer;font:600 13px/1 'Barlow Condensed';letter-spacing:.16em;text-transform:uppercase;padding:12px 16px;transition:background .2s,color .2s,transform .2s}
  .btn.primary{background:var(--red);color:#fff}.btn.primary:hover{background:#e00000;transform:translateY(-1px)}
  .btn.ghost{background:rgba(13,15,18,.55);color:#fff;box-shadow:inset 0 0 0 1px rgba(255,255,255,.45)}.btn.ghost:hover{background:#fff;color:var(--ink)}
  .storm .btn.primary{animation:pulse 1.4s ease-out 3 1.2s}
  @keyframes pulse{0%{box-shadow:0 0 0 0 rgba(204,0,0,.75)}100%{box-shadow:0 0 0 14px rgba(204,0,0,0)}}
  .legal{position:absolute;z-index:7;right:24px;bottom:5px;font:400 8.5px/1 Barlow;color:rgba(255,255,255,.5)}

  @media (max-aspect-ratio:1/1){
    .photo{left:0;right:0;top:0;bottom:auto;height:290px;-webkit-mask-image:linear-gradient(0deg,transparent 0,#000 70px);mask-image:linear-gradient(0deg,transparent 0,#000 70px)}
    .brand{left:16px;top:14px;gap:9px}.brand img{height:26px}.brand .model{font-size:12px}
    .tip{left:50%;margin-left:0;transform:translateX(-50%);top:236px;white-space:nowrap}
    .copy{left:16px;right:16px;top:272px;width:auto}
    h1{font-size:26px}.copy p{font-size:12px;margin-top:5px}
    .meter,.chips{left:16px;right:16px;width:auto;bottom:74px}
    .chips{display:none}
    .again{right:auto;left:16px;top:auto;bottom:78px}
    .cta{left:16px;right:16px;bottom:22px}.cta .btn{flex:1;padding:13px 0}
    .legal{left:16px;right:16px;bottom:7px;text-align:center}
  }
</style>
</head>

    for(var y=0;y<BH;y+=STEP) for(var x=0;x<BW;x+=STEP){ var i=(y*BW+x)*4; if(d[i+3]>140) pts.push(x,y,d[i],d[i+1],d[i+2]); }
    n=pts.length/5;
    HX=new Float32Array(n);HY=new Float32Array(n);X=new Float32Array(n);Y=new Float32Array(n);VX=new Float32Array(n);VY=new Float32Array(n);Z=new Float32Array(n);DL=new Float32Array(n);
    CT=new Uint32Array(n); CS=new Uint32Array(n);
    for(var k=0;k<n;k++){
      var x=pts[k*5], y=pts[k*5+1], r=pts[k*5+2], g=pts[k*5+3], b=pts[k*5+4];
      HX[k]=ox+x; HY[k]=oy+y; Z[k]=Math.random()*2-1;
      // açılış: kum taneleri sağdan, rüzgârla gelir
      X[k]=W+Math.random()*W*.6; Y[k]=HY[k]+(Math.random()-.5)*H*1.2; VX[k]=-2-Math.random()*3; VY[k]=0;
      DL[k]=(x/BW)*1.1+Math.random()*.35;                 // soldan sağa toplanma sırası
      CT[k]=(255<<24)|(b<<16)|(g<<8)|r;
      var l=(r*.3+g*.59+b*.11)/255, sr=Math.min(255,120+l*140), sg=Math.min(255,88+l*120), sb=Math.min(255,52+l*90);   // kum tonu
      CS[k]=(255<<24)|((sb|0)<<16)|((sg|0)<<8)|(sr|0);
    }
    t0=performance.now();
  }

  function lerpColor(a,b,t){
    var ar=a&255,ag=(a>>8)&255,ab=(a>>16)&255, br=b&255,bg=(b>>8)&255,bb=(b>>16)&255;
    return (255<<24)|(((ab+(bb-ab)*t)|0)<<16)|(((ag+(bg-ag)*t)|0)<<8)|((ar+(br-ar)*t)|0);
  }

  function frame(now){
    requestAnimationFrame(frame); if(!n) return;
    var t=(now-t0)/1000, cw=cv.width, chh=cv.height, s=Math.max(1,Math.round(STEP*dpr));
    mx+=(tmx-mx)*.07; my+=(tmy-my)*.07;
    buf.fill(0);
    // renk: kum tonundan gerçek renklere “çiçek açar”
    var bloom=storm?1:Math.max(0,Math.min(1,(t-2.6)/1.4));
    var R=mobile?52:64, R2=R*R, pvx=px-ppx, pvy=py-ppy; ppx+=(px-ppx)*.5; ppy+=(py-ppy)*.5;
    var sp=Math.min(30,Math.hypot(pvx,pvy));
    for(var k=0;k<n;k++){
      var x=X[k], y=Y[k], vx=VX[k], vy=VY[k];
      if(storm){
        var st=(now-stormT)/1000; vx+=-.35-Math.random()*.4-st*.2; vy+=(Math.random()-.5)*.8+Math.sin(y*.05+st*6)*.25; vx*=.985; vy*=.96;
      } else if(t>DL[k]){
        var k1=Math.min(.06,.012+(t-DL[k])*.02);
        vx+=(HX[k]-x)*k1; vy+=(HY[k]-y)*k1;
        var dx=x-px, dy=y-py, d2=dx*dx+dy*dy;
        if(d2<R2){ var dd=Math.sqrt(d2)+.01, f=(1-dd/R)*(2.2+sp*.25); vx+=dx/dd*f+pvx*.08; vy+=dy/dd*f+pvy*.08-.4; }
        vx*=.86; vy*=.86;
      } else { vx*=.995; vy+=(Math.random()-.5)*.15; }
      x+=vx; y+=vy; X[k]=x; Y[k]=y; VX[k]=vx; VY[k]=vy;
      // derinlik paralaksı (3B kum hacmi)
      var sx=((x+mx*Z[k]*14)*dpr)|0, sy=((y+my*Z[k]*8)*dpr)|0;
      if(sx<0||sy<0||sx>=cw-s||sy>=chh-s) continue;
      var col= bloom<=0?CS[k]:(bloom>=1?CT[k]:lerpColor(CS[k],CT[k],bloom));
      var p=sy*cw+sx; for(var yy=0;yy<s;yy++){ var q=p+yy*cw; for(var xx=0;xx<s;xx++) buf[q+xx]=col; }
    }
    ctx.putImageData(imgData,0,0);
  }
  requestAnimationFrame(frame);

  // etkileşim: rüzgâr
  function pos(e){ var r=cv.getBoundingClientRect(); return [e.clientX-r.left, e.clientY-r.top]; }
  cv.addEventListener('pointermove',function(e){
    var p=pos(e), r=cv.getBoundingClientRect(); tmx=(p[0]/r.width)*2-1; tmy=(p[1]/r.height)*2-1;
    if(e.pointerType!=='mouse' && e.buttons===0) return;
    if(!touched){ touched=true; ad.classList.add('touched'); }
    var dx=p[0]-px, dy=p[1]-py; px=p[0]; py=p[1];
    if(storm) return;
    var nearBike = n && Math.abs(px-(HX[0]+BW/2))<BW*.7 && Math.abs(py-(HY[0]+BH/2))<BH*.8;
    if(nearBike){ energy=Math.min(1,energy+Math.min(40,Math.hypot(dx,dy))*.0016); }
    document.getElementById('pct').textContent='%'+Math.round(energy*100); document.getElementById('fill').style.width=(energy*100)+'%';
    if(energy>=1) startStorm();
  });
  cv.addEventListener('pointerdown',function(e){ var p=pos(e); px=ppx=p[0]; py=ppy=p[1]; });
  cv.addEventListener('pointerleave',function(){ px=py=-999; tmx=tmy=0; });
  cv.addEventListener('pointerup',function(e){ if(e.pointerType!=='mouse'){ px=py=-999; } });

  function setText(k,h,p){
    ['kicker','h1','p'].forEach(function(id){document.getElementById(id).classList.add('out')});
    setTimeout(function(){ document.getElementById('kicker').textContent=k; document.getElementById('h1').innerHTML=h; document.getElementById('p').textContent=p;
      ['kicker','h1','p'].forEach(function(id){document.getElementById(id).classList.remove('out')}); },300);
  }
  function startStorm(){
    if(storm) return; storm=true; stormT=performance.now(); ad.classList.add('storm'); px=py=-999;
    if(navigator.vibrate) navigator.vibrate([30,30,60]);
    setText('Africa Twin Adventure Sports','Fırtına geçer.<br>Efsane kalır.','Kumun içinden gerçeğine: 1084 cc Uni-cam motor, gün boyu aerodinamik, 6,5" dokunmatik TFT.');
  }
  document.getElementById('again').addEventListener('click',function(e){ e.stopPropagation();
    storm=false; energy=0; ad.classList.remove('storm'); document.getElementById('pct').textContent='%0'; document.getElementById('fill').style.width='0';
    setText('Kumdan doğan efsane','Çölün ruhu,<br>yolun teknolojisi.','Fareyi ya da parmağınızı kumun içinde gezdirin; fırtınayı siz başlatın.');
    for(var k=0;k<n;k++){ X[k]=W+Math.random()*W*.6; Y[k]=HY[k]+(Math.random()-.5)*H*1.2; VX[k]=-2-Math.random()*3; VY[k]=0; }
    t0=performance.now(); });

  // ipucu: dokunulmazsa görünmez bir “rüzgâr” motosikletin üzerinden bir kez geçer
  setTimeout(function demo(){
    if(touched||storm||!n) return; var a0=performance.now(), cx=HX[0]+BW/2, cy=HY[0]+BH/2;
    (function step(t){ if(touched||storm) { px=py=-999; return; } var k=(t-a0)/1300; if(k>1){ px=py=-999; setTimeout(demo,4500); return; }
      px=cx-BW*.6+k*BW*1.2; py=cy+Math.sin(k*Math.PI*2)*BH*.25; requestAnimationFrame(step); })(a0);
  },4600);

  document.querySelectorAll('[data-exit]').forEach(function(b){
    b.addEventListener('click',function(e){ e.stopPropagation(); window.open(b.dataset.exit==='test'?clickTag2:clickTag,'_blank'); });
  });
</script>
<!-- WOW:START (ortak/wow_inject.py tarafından eklenir) -->
<style>
  #ad{--mx:0;--my:0}
  .wow-intro{position:absolute;inset:0;z-index:95;pointer-events:none;background:#0d0f12;clip-path:inset(0 0 0 0);animation:wowIn 1.05s .1s cubic-bezier(.75,0,.2,1) forwards}
  .wow-line{position:absolute;z-index:96;top:0;bottom:0;left:0;width:3px;pointer-events:none;background:#ff3d3d;box-shadow:0 0 22px 6px rgba(255,40,40,.55);animation:wowLine 1.05s .1s cubic-bezier(.75,0,.2,1) forwards}
  @keyframes wowIn{to{clip-path:inset(0 0 0 100%)}}
  @keyframes wowLine{90%{opacity:1}to{left:100%;opacity:0}}
  #ad h1{animation:wowRise .9s .55s cubic-bezier(.2,.8,.2,1) backwards}
  @keyframes wowRise{from{opacity:0;transform:translateY(16px);filter:blur(8px)}}
  .wow-grain{position:absolute;inset:-50%;z-index:90;pointer-events:none;opacity:.07;mix-blend-mode:overlay;animation:wowGrain .9s steps(5) infinite}
  @keyframes wowGrain{0%{transform:translate(0,0)}20%{transform:translate(-6%,4%)}40%{transform:translate(5%,-7%)}60%{transform:translate(-3%,6%)}80%{transform:translate(7%,2%)}100%{transform:translate(0,0)}}
  .wow-vig{position:absolute;inset:0;z-index:89;pointer-events:none;box-shadow:inset 0 0 90px rgba(0,0,0,.38)}
  .wow-bg{translate:calc(var(--mx) * -11px) calc(var(--my) * -6px);scale:1.06}
  .wow-mid{translate:calc(var(--mx) * -7px) calc(var(--my) * -4px)}
  .wow-fg{translate:calc(var(--mx) * 4px) calc(var(--my) * 3px)}
  .btn.primary{position:relative;overflow:hidden}
  .btn.primary::after{content:"";position:absolute;top:0;bottom:0;left:-70%;width:45%;pointer-events:none;
    background:linear-gradient(100deg,rgba(255,255,255,0),rgba(255,255,255,.5),rgba(255,255,255,0));animation:wowShine 5s 2.2s infinite}
  @keyframes wowShine{0%{left:-70%}22%,100%{left:130%}}
  @media (prefers-reduced-motion:reduce){.wow-intro,.wow-line,.wow-grain{display:none}#ad h1{animation:none}.btn.primary::after{animation:none}}
</style>
<script>
(function(){
  var ad=document.getElementById('ad'); if(!ad) return;
  var D=[[], [], []];
  function tag(list,cls){ list.forEach(function(s){ ad.querySelectorAll(s).forEach(function(el){ el.classList.add(cls); }); }); }
  tag(D[0],'wow-bg'); tag(D[1],'wow-mid'); tag(D[2],'wow-fg');
  // sonradan eklenen öğeler (ör. renk seçicideki motosikletler) için kısa bir yeniden tarama
  setTimeout(function(){ tag(D[0],'wow-bg'); tag(D[1],'wow-mid'); },400);
  ['wow-vig','wow-grain','wow-intro','wow-line'].forEach(function(c){ var d=document.createElement('div'); d.className=c; ad.appendChild(d); });
  setTimeout(function(){ ['.wow-intro','.wow-line'].forEach(function(s){ var e=ad.querySelector(s); if(e) e.remove(); }); },1400);
  // film greni: çalışma anında üretilen raster gürültü dokusu
  try{ var c=document.createElement('canvas'); c.width=c.height=140; var x=c.getContext('2d'), im=x.createImageData(140,140);
    for(var i=0;i<im.data.length;i+=4){ var v=Math.random()*255|0; im.data[i]=im.data[i+1]=im.data[i+2]=v; im.data[i+3]=255; }
    x.putImageData(im,0,0); ad.querySelector('.wow-grain').style.backgroundImage='url('+c.toDataURL()+')'; }catch(e){}
  // derinlik paralaksı: fare / dokunma / telefon eğimi
  var tx=0,ty=0,cx=0,cy=0;
  function set(x,y){ tx=Math.max(-1,Math.min(1,x)); ty=Math.max(-1,Math.min(1,y)); }
  ad.addEventListener('pointermove',function(e){ var r=ad.getBoundingClientRect(); set((e.clientX-r.left)/r.width*2-1,(e.clientY-r.top)/r.height*2-1); });
  ad.addEventListener('pointerleave',function(){ set(0,0); });
  window.addEventListener('deviceorientation',function(e){ if(e.gamma==null) return; set(e.gamma/22,(e.beta-40)/22); });
  (function loop(){ cx+=(tx-cx)*.08; cy+=(ty-cy)*.08; ad.style.setProperty('--mx',cx.toFixed(3)); ad.style.setProperty('--my',cy.toFixed(3)); requestAnimationFrame(loop); })();
})();
</script>
