:root {
  --red: #df0000;
  --red-d: #a80000;
  --red-l: #ff2a2a;
  --ink: #0d0d0d;
  --ink-2: #1c1c1c;
  --grey: #f2f2f2;
  --mut: #8a8a8a;
  --white: #fff;
  --hd: 'MMHeadline', 'Arial Black', Arial, sans-serif;
  --tx: 'Noto Sans Display', 'Helvetica Neue', Arial, sans-serif;
  --pr: 'MMPrice', 'MMHeadline', Arial, sans-serif;
  --ease: cubic-bezier(.22, .8, .2, 1);
  --spring: cubic-bezier(.3, 1.4, .5, 1);
}
* { box-sizing: border-box; margin: 0; padding: 0; }
html, body { width: 100%; height: 100%; overflow: hidden; background: var(--ink); }
body { font-family: var(--tx); color: var(--white); -webkit-font-smoothing: antialiased; -webkit-tap-highlight-color: transparent; user-select: none; -webkit-user-select: none; }
img { display: block; -webkit-user-drag: none; }
button { font: inherit; color: inherit; border: 0; background: none; cursor: pointer; }
.ad { position: relative; overflow: hidden; overflow: clip; width: 970px; height: 250px; background: var(--ink); }
@media (max-width: 600px) { .ad { width: 320px; height: 480px; } }

/* Logo */
.logo { height: 22px; width: auto; }

/* 11.11 rozeti */
.t11 { display: inline-flex; align-items: center; gap: 6px; font-family: var(--hd); font-size: 13px; line-height: 1; letter-spacing: .02em; padding: 6px 9px 5px; border-radius: 6px; background: var(--red); color: #fff; }
.t11.w { background: #fff; color: var(--red); }

/* Başlık */
.hd { font-family: var(--hd); font-weight: 400; line-height: .92; letter-spacing: -.005em; }
.hd em { font-style: normal; color: var(--red); }

/* Fiyat etiketi: MediaMarkt fiyat fontu, hafif eğik "störer" */
.price { display: inline-flex; align-items: flex-start; gap: 2px; font-family: var(--pr); font-size: 30px; line-height: 1; color: var(--ink); background: #fff; padding: 6px 9px 4px; border-radius: 6px; transform: rotate(-3deg); box-shadow: 0 6px 16px rgba(0, 0, 0, .28); white-space: nowrap; }
.price small { font-family: var(--tx); font-weight: 800; font-size: .5em; margin-top: .12em; }
.price.r { background: var(--red); color: #fff; }
.price.k { background: var(--ink); color: #fff; }

/* CTA */
.cta { display: inline-flex; align-items: center; justify-content: center; gap: 8px; height: 36px; padding: 0 16px; border-radius: 8px; background: var(--red); color: #fff; font-family: var(--tx); font-weight: 800; font-size: 13px; white-space: nowrap; box-shadow: 0 6px 18px rgba(223, 0, 0, .35); transition: transform .25s var(--ease), background .25s; }
.cta:hover { background: var(--red-l); transform: translateY(-1px); }
.cta i { font-style: normal; transition: transform .25s var(--ease); }
.cta:hover i { transform: translateX(3px); }
.cta.w { background: #fff; color: var(--red); box-shadow: 0 6px 18px rgba(0, 0, 0, .25); }
.cta.w:hover { background: #fff; }
.cta.k { background: var(--ink); color: #fff; box-shadow: 0 6px 18px rgba(0, 0, 0, .3); }

/* Kupon (kopyala) */
.coupon { display: inline-flex; align-items: center; gap: 8px; height: 34px; padding: 0 12px; border-radius: 8px; border: 1.5px dashed rgba(255, 255, 255, .7); background: rgba(255, 255, 255, .1); font-size: 12px; font-weight: 700; white-space: nowrap; transition: background .25s, transform .25s var(--ease); }
.coupon b { font-family: var(--hd); font-weight: 400; font-size: 14px; letter-spacing: .06em; }
.coupon .cp-act { font-size: 9.5px; font-weight: 800; letter-spacing: .08em; text-transform: uppercase; opacity: .8; }
.coupon .cp-ok { display: none; font-size: 9.5px; font-weight: 800; letter-spacing: .08em; text-transform: uppercase; }
.coupon:hover { background: rgba(255, 255, 255, .2); }
.coupon.copied { background: #fff; color: var(--red); border-color: #fff; }
.coupon.copied .cp-act { display: none; }
.coupon.copied .cp-ok { display: inline; }

/* İpucu baloncuğu */
.hint { position: absolute; z-index: 20; font-size: 11px; font-weight: 800; color: var(--ink); background: #fff; padding: 6px 11px; border-radius: 999px; box-shadow: 0 8px 20px rgba(0, 0, 0, .35); white-space: nowrap; pointer-events: none; transition: opacity .35s, transform .35s var(--ease); }
.hint.off { opacity: 0; transform: translateY(6px); }
.hand { display: inline-block; animation: hand 1.4s ease-in-out infinite; }
@keyframes hand { 50% { transform: translateX(6px); } }

/* Yasal */
.legal { font-size: 7.5px; line-height: 1.25; color: rgba(255, 255, 255, .55); letter-spacing: .01em; }

@media (prefers-reduced-motion: reduce) { *, *::before, *::after { transition-duration: .01s !important; animation-duration: .01s !important; animation-iteration-count: 1 !important; } }

.disc .pi img { max-width: 100%; max-height: 100%; object-fit: contain; filter: drop-shadow(0 2px 3px rgba(0,0,0,.45)); }
.disc .pi b { position: absolute; top: -17px; left: 50%; transform: translateX(-50%); font-family: var(--hd); font-weight: 400; font-size: 10px; white-space: nowrap; }
.hub { position: absolute; left: 50%; top: 50%; width: 62px; height: 62px; margin: -31px; border-radius: 50%; background: radial-gradient(circle at 35% 30%, #fff, #ddd); box-shadow: 0 4px 12px rgba(0,0,0,.5), 0 0 0 4px #111; display: flex; align-items: center; justify-content: center; flex-direction: column; color: var(--red); cursor: pointer; transition: transform .25s var(--ease); }
.hub:hover { transform: scale(1.06); }
.hub b { font-family: var(--hd); font-weight: 400; font-size: 17px; line-height: 1; }
.hub small { font-size: 8px; font-weight: 800; letter-spacing: .1em; color: var(--ink); }
.ptr { position: absolute; left: 50%; top: -18px; width: 26px; height: 34px; margin-left: -13px; z-index: 3; transform-origin: 50% 8px; filter: drop-shadow(0 3px 4px rgba(0,0,0,.5)); }
.ptr::before { content: ''; position: absolute; inset: 0; background: #fff; clip-path: polygon(0 0, 100% 0, 50% 100%); }
.ptr::after { content: ''; position: absolute; inset: 3px 4px 7px; background: var(--red); clip-path: polygon(0 0, 100% 0, 50% 100%); }
.ptr.tick { animation: tick .14s ease-out; }
@keyframes tick { 40% { transform: rotate(-22deg); } }

/* Panel */
.panel { position: absolute; left: 598px; top: 14px; width: 354px; height: 222px; }
.st { position: absolute; inset: 0; display: flex; flex-direction: column; justify-content: center; opacity: 0; pointer-events: none; transform: translateY(10px); transition: opacity .45s, transform .45s var(--ease); }
.st.on { opacity: 1; pointer-events: auto; transform: none; }
.st0 .ov { font-size: 10px; font-weight: 800; letter-spacing: .16em; color: rgba(255,255,255,.6); }
.st0 h2 { font-size: 28px; margin-top: 6px; }
.st0 .row { display: flex; align-items: center; gap: 12px; margin-top: 14px; }
.st0 .cta { height: 44px; font-size: 15px; padding: 0 24px; font-family: var(--hd); font-weight: 400; letter-spacing: .02em; }
.st0 .left { font-size: 11px; font-weight: 700; color: rgba(255,255,255,.7); }
.st0 .left b { color: #fff; }
.res { flex-direction: row; align-items: center; gap: 12px; background: #fff; color: var(--ink); border-radius: 14px; padding: 12px 14px; box-shadow: 0 14px 30px rgba(0,0,0,.45); justify-content: flex-start; }
.res .im { width: 92px; height: 150px; flex: none; display: flex; align-items: center; justify-content: center; }
.res .im img { max-width: 100%; max-height: 100%; object-fit: contain; }
.res .bd { flex: 1; min-width: 0; }
.res .ov { font-size: 9.5px; font-weight: 800; letter-spacing: .14em; color: var(--red); }
.res .n { font-family: var(--hd); font-weight: 400; font-size: 18px; line-height: 1; margin-top: 4px; }
.res .price { font-size: 25px; margin-top: 8px; background: var(--red); color: #fff; }
.res .coupon { margin-top: 10px; height: 28px; font-size: 10.5px; color: var(--ink); border-color: rgba(0,0,0,.35); background: var(--grey); }
.res .coupon b { font-size: 12.5px; }
.res .coupon.copied { background: var(--red); color: #fff; border-color: var(--red); }
.res .acts { display: flex; align-items: center; gap: 10px; margin-top: 9px; white-space: nowrap; }
.res .cta { height: 30px; font-size: 11.5px; padding: 0 12px; }
.res .again { font-size: 10.5px; font-weight: 800; color: var(--ink); text-decoration: underline; }
.res .again[hidden] { display: none; }
.res.pop { animation: pop .5s var(--spring); }
@keyframes pop { 0% { transform: scale(.85); } }
.conf { position: absolute; inset: 0; pointer-events: none; overflow: hidden; }
.conf i { position: absolute; top: -10px; width: 6px; height: 10px; border-radius: 1px; animation: fall 1.6s ease-in forwards; }
@keyframes fall { to { transform: translateY(290px) rotate(540deg); opacity: .2; } }

@media (max-width: 600px) {
  .ad { background: radial-gradient(130% 70% at 50% 55%, #4a0000 0%, #170202 60%, #070707 100%); }
  .rays { left: 160px; top: 262px; }
  .side { left: 18px; top: 18px; width: 284px; }
  .side .logo { height: 19px; }
  .side .t11 { position: absolute; right: 0; top: -3px; margin: 0; }
  .side h1 { font-size: 34px; margin-top: 16px; }
  .side h1 br { display: none; }
  .side p { font-size: 11.5px; }
  .wheel { left: 160px; top: 262px; width: 236px; height: 236px; margin: -118px 0 0 -118px; }
  .panel { left: 14px; right: 14px; top: auto; bottom: 22px; width: auto; height: 74px; }
  .st0 { flex-direction: row; align-items: center; justify-content: center; gap: 12px; }
  .st0 .ov, .st0 h2 { display: none; }
  .st0 .row { margin: 0; }
  .st0 .cta { height: 42px; }
  .res { position: absolute; inset: auto 0 0 0; height: 196px; padding: 12px; }
  .res .im { width: 92px; height: 160px; }
  .res .n { font-size: 16px; }
  .res .price { font-size: 22px; }
  .res .im { width: 80px; }
  .res .acts { flex-direction: column; align-items: flex-start; gap: 6px; margin-top: 8px; }
  .res .coupon { margin-top: 8px; }
  .hint { left: 50% !important; top: 122px !important; transform: translateX(-50%); }
  .hint.off { transform: translate(-50%, 6px); }
  .legal { left: 18px; right: 18px; width: auto; bottom: 8px; text-align: center; }
}
</style>

    var aim = -((target + .5) * A) + (Math.random() - .5) * A * .6;
    var turns = 4 + Math.round((power || 1) * 2);
    var end = cur + turns * 360 + ((aim - cur) % 360 + 360) % 360;
    var t0 = performance.now(), dur = 3800 + (power || 1) * 600;
    AD.track('spin');
    (function step(now) {
      var k = Math.min(1, (now - t0) / dur), e = 1 - Math.pow(1 - k, 4);
      setRot(cur + (end - cur) * e);
      if (k < 1) requestAnimationFrame(step); else done(under(end));
    })(t0);
  }
  function done(i) {
    spinning = false; $('wheel').classList.remove('spinning');
    var x = S[i]; AD.track('win_' + x.p.key);
    $('rImg').src = x.p.img; $('rImg').alt = x.s; $('rN').textContent = x.s; $('rP').innerHTML = AD.price(x.p.price);
    $('go').onclick = function (e) { e.stopPropagation(); AD.exit('cark_' + x.p.key, x.p.url); };
    $('again').hidden = tries <= 0;
    $('s0').classList.remove('on'); var r = $('s1'); r.classList.add('on'); r.classList.remove('pop'); void r.offsetWidth; r.classList.add('pop');
    var cf = $('conf'); cf.innerHTML = '';
    for (var j = 0; j < 26; j++) { var c = document.createElement('i'); c.style.left = Math.random() * 100 + '%'; c.style.background = COL[j % 3] === '#141414' ? '#ffd24a' : COL[j % 3]; c.style.animationDelay = Math.random() * .4 + 's'; cf.appendChild(c); }
  }
  function first() { if (!user) { user = true; stopDemo(); } }
  $('spin').addEventListener('click', function (e) { e.stopPropagation(); first(); spin(1); });
  $('hub').addEventListener('click', function (e) { e.stopPropagation(); first(); if (!moved) spin(1); });
  $('again').addEventListener('click', function (e) { e.stopPropagation(); spin(1); });
  $('cp').addEventListener('click', function (e) { e.stopPropagation(); AD.copy(this, 'MM1111'); });
  $('s1').addEventListener('click', function (e) { e.stopPropagation(); });

  // Sürükle-fırlat: merkez etrafındaki açısal hız
  var wh = $('wheel'), drag = false, la = 0, lt = 0, vel = 0, moved = 0;
  function ang(e) { var b = wh.getBoundingClientRect(); return Math.atan2(e.clientY - (b.top + b.height / 2), e.clientX - (b.left + b.width / 2)) * 180 / Math.PI; }
  wh.addEventListener('pointerdown', function (e) { e.stopPropagation(); first(); if (spinning) return; drag = true; moved = 0; la = ang(e); lt = performance.now(); vel = 0; try { wh.setPointerCapture(e.pointerId); } catch (x) {} });
  wh.addEventListener('pointermove', function (e) {
    if (!drag) return; var a = ang(e), d = a - la; if (d > 180) d -= 360; if (d < -180) d += 360;
    var now = performance.now(); vel = d / Math.max(8, now - lt); la = a; lt = now; moved += Math.abs(d); setRot(rot + d);
  });
  function up() { if (!drag) return; drag = false; if (moved > 12 && Math.abs(vel) > .25) spin(Math.min(2, Math.abs(vel))); else if (moved < 5) spin(1); setTimeout(function () { moved = 0; }, 0); }
  wh.addEventListener('pointerup', up); wh.addEventListener('pointercancel', up);
  wh.addEventListener('click', function (e) { e.stopPropagation(); });

  // Tanıtım: çark hafifçe sallanıp ipucu verir
  var demo = [];
  function stopDemo() { demo.forEach(clearTimeout); demo = []; }
  AD.ready(function () {
    AD.track('impression_ready');
    if (AD.reduced) { $('hint').classList.remove('off'); return; }
    var t0 = performance.now(), base = rot;
    demo.push(setTimeout(function () {
      (function tease(now) {
        if (user) return;
        var k = (now - t0 - 600) / 1800; if (k > 1) { setRot(base); $('hint').classList.remove('off'); return; }
        setRot(base + Math.sin(k * Math.PI * 2) * 38 * (1 - k)); requestAnimationFrame(tease);
      })(performance.now());
    }, 600));
  });
})();
</script>
