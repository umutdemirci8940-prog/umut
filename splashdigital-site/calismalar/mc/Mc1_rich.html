<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mastercard x Ziraat Bankası Banner</title>
    
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    
    <!-- React & ReactDOM -->
    <script crossorigin src="https://unpkg.com/react@18/umd/react.development.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
    
    <!-- Babel for JSX -->
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    
    <!-- Framer Motion -->
    <script src="https://unpkg.com/framer-motion@10.16.4/dist/framer-motion.js"></script>

    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700&display=swap');
        
        body { 
            font-family: 'Inter', sans-serif; 
            background-color: #f0f0f0; 
            display: flex; 
            justify-content: center; 
            align-items: center; 
            min-height: 100vh; 
            margin: 0; 
        }
        
        .writing-vertical-rl { 
            writing-mode: vertical-rl; 
        }
        
        /* Custom Scrollbar hide */
        .no-scrollbar::-webkit-scrollbar {
            display: none;
        }
        .no-scrollbar {
            -ms-overflow-style: none;
            scrollbar-width: none;
        }
    </style>
</head>
<body>
    <div id="root"></div>

    <script type="text/babel">
        const { useState } = React;
        // Framer Motion global object is usually 'Motion'
        const { motion, AnimatePresence } = window.Motion;

        // --- Icons (Inline SVGs) ---
        const GraduationCap = ({ size = 24, className = "" }) => (
            <svg xmlns="http://www.w3.org/2000/svg" width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={className}><path d="M21.42 10.922a1 1 0 0 0-.019-1.838L12.83 5.18a2 2 0 0 0-1.66 0L2.6 9.08a1 1 0 0 0 0 1.832l8.57 3.908a2 2 0 0 0 1.66 0z"/><path d="M22 10v6"/><path d="M6 12.5V16a6 3 0 0 0 12 0v-3.5"/></svg>
        );
        const ShoppingCart = ({ size = 24, className = "" }) => (
            <svg xmlns="http://www.w3.org/2000/svg" width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={className}><circle cx="8" cy="21" r="1"/><circle cx="19" cy="21" r="1"/><path d="M2.05 2.05h2l2.66 12.42a2 2 0 0 0 2 1.58h9.78a2 2 0 0 0 1.95-1.57l1.65-7.43H5.12"/></svg>
        );
        const ChevronRight = ({ size = 24, className = "" }) => (
            <svg xmlns="http://www.w3.org/2000/svg" width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={className}><path d="m9 18 6-6-6-6"/></svg>
        );
        const CreditCard = ({ size = 24, className = "" }) => (
            <svg xmlns="http://www.w3.org/2000/svg" width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={className}><rect width="20" height="14" x="2" y="5" rx="2"/><line x1="2" x2="22" y1="10" y2="10"/></svg>
        );

        // --- Main App Component ---
        function App() {
            const [activeTab, setActiveTab] = useState(1); // Default to first tab

            // Brand Colors
            const MC_RED = "#EB001B";
            const MC_ORANGE = "#FF5F00";
            const ZIRAAT_RED = "#E30613";

            const campaigns = [
                {
                    id: 1,
                    title: "Eğitim",
                    headline: "Okul Ödemelerinde",
                    subheadline: "Bankkart Ayrıcalığı!",
                    description: "Anlaşmalı okullarda +8, seçili okullarda 6 taksit fırsatı.",
                    image: "https://images.unsplash.com/photo-1509062522246-3755977927d7?q=80&w=1000&auto=format&fit=crop",
                    icon: GraduationCap,
                    color: "from-blue-600/90 to-blue-900/90",
                    link: "https://www.bankkart.com.tr/kampanyalar/egitim-kitap-ve-kirtasiye/okul-odemelerinizde-8-taksit"
                },
                {
                    id: 2,
                    title: "Ramazan",
                    headline: "Ramazan Alışverişlerinize",
                    subheadline: "3.000 TL Bankkart Lira!",
                    description: "Market alışverişlerinizde kazandıran fırsatlar sizi bekliyor.",
                    image: "https://images.unsplash.com/photo-1578916171728-46686eac8d58?q=80&w=1000&auto=format&fit=crop",
                    icon: ShoppingCart,
                    color: "from-emerald-600/90 to-emerald-900/90",
                    link: "https://www.bankkart.com.tr/kampanyalar/market-ve-gida/ramazan-alisverislerinize-3000-tl-bankkart-lira?"
                }
            ];

            return (
                <div className="relative w-[970px] h-[250px] bg-white overflow-hidden shadow-2xl flex font-sans select-none rounded-lg">
                
                {/* Left Sidebar: Branding & Static Info */}
                <div className="w-[280px] h-full bg-white z-20 flex flex-col justify-between p-8 shadow-[4px_0_24px_rgba(0,0,0,0.05)] relative">
                    {/* Logos */}
                    <div className="flex flex-col gap-4">
                    <div className="flex items-center gap-3">
                        {/* Mastercard Logo */}
                        <div className="relative w-10 h-6 flex-shrink-0">
                        <div className="absolute left-0 w-6 h-6 rounded-full mix-blend-multiply opacity-90" style={{ backgroundColor: MC_RED }}></div>
                        <div className="absolute right-0 w-6 h-6 rounded-full mix-blend-multiply opacity-90" style={{ backgroundColor: MC_ORANGE }}></div>
                        </div>
                        <div className="h-6 w-px bg-gray-300 mx-1"></div>
                        {/* Ziraat Bankası Logo Image */}
                        <img src="https://www.bankkart.com.tr/_assets/img/logo-v3.png" alt="Bankkart Logo" className="h-8 w-auto object-contain" />
                    </div>
                    </div>

                    {/* Static CTA Text */}
                    <div className="mt-2">
                    <p className="text-xs text-gray-500 leading-tight mb-3">
                        Ayrıntılı bilgi ve kart başvurusu için tıklayın.
                    </p>
                    
                    {/* Real Card Images */}
                    <div className="flex -space-x-10 mt-1 pl-2">
                        <a href="https://www.bankkart.com.tr/kartlar/bankkartlar/bankkart" target="_blank" className="relative z-10 transform -rotate-6 hover:z-40 transition-all hover:scale-105">
                            <img src="https://www.bankkart.com.tr/_assets/img/card/features/bc_on.png" alt="Bankkart" className="w-16 h-auto shadow-sm" />
                        </a>
                        <a href="https://www.bankkart.com.tr/kartlar/bankkartlar/bankkart-gold" target="_blank" className="relative z-20 transform -rotate-3 hover:z-40 transition-all hover:scale-105">
                            <img src="https://www.bankkart.com.tr/_assets/img/card/features/bcg_on.png" alt="Bankkart Gold" className="w-16 h-auto shadow-sm" />
                        </a>
                        <a href="https://www.bankkart.com.tr/kartlar/bankkartlar/bankkart-platinum" target="_blank" className="relative z-30 hover:z-40 transition-all hover:scale-105">
                            <img src="https://www.bankkart.com.tr/_assets/img/card/features/bcp_on.png" alt="Bankkart Platinum" className="w-16 h-auto shadow-sm" />
                        </a>
                    </div>
                    </div>

                    <a href="https://www.bankkart.com.tr/kartlar/bankkartlar/bankkart-gold" target="_blank" className="group flex items-center gap-2 text-xs font-bold text-[#E30613] mt-2 hover:underline cursor-pointer decoration-[#E30613]">
                    HEMEN BAŞVUR <ChevronRight size={14} className="group-hover:translate-x-1 transition-transform" />
                    </a>
                </div>

                {/* Interactive Right Section */}
                <div className="flex-1 flex relative">
                    {campaigns.map((campaign) => (
                    <motion.div
                        key={campaign.id}
                        className="relative h-full overflow-hidden cursor-pointer border-l border-white/20"
                        animate={{ 
                        flex: activeTab === campaign.id ? 3 : 1,
                        }}
                        transition={{ duration: 0.5, ease: "easeInOut" }}
                        onMouseEnter={() => setActiveTab(campaign.id)}
                    >
                        {/* Background Image */}
                        <div className="absolute inset-0">
                        <img 
                            src={campaign.image} 
                            alt={campaign.title} 
                            className="w-full h-full object-cover"
                        />
                        {/* Overlay Gradient */}
                        <div className={`absolute inset-0 bg-gradient-to-r ${activeTab === campaign.id ? 'from-black/80 via-black/40 to-transparent' : 'from-black/60 to-black/60'}`}></div>
                        </div>

                        {/* Content Container */}
                        <div className="absolute inset-0 p-8 flex flex-col justify-center text-white">
                        
                        {/* Collapsed State (Icon + Vertical Text) */}
                        <motion.div 
                            className="absolute inset-0 flex flex-col items-center justify-center gap-4"
                            animate={{ opacity: activeTab === campaign.id ? 0 : 1 }}
                        >
                            <div className="p-3 rounded-full bg-white/20 backdrop-blur-sm">
                            <campaign.icon size={24} />
                            </div>
                            <span className="writing-vertical-rl rotate-180 text-sm font-bold tracking-widest uppercase opacity-80">
                            {campaign.title}
                            </span>
                        </motion.div>

                        {/* Expanded State */}
                        <motion.div
                            className="relative z-10 max-w-[400px]"
                            initial={{ opacity: 0, x: 20 }}
                            animate={{ 
                            opacity: activeTab === campaign.id ? 1 : 0,
                            x: activeTab === campaign.id ? 0 : 20
                            }}
                            transition={{ duration: 0.4, delay: 0.1 }}
                        >
                            <div className="flex items-center gap-2 mb-2 text-white/80 text-sm font-medium uppercase tracking-wider">
                            <campaign.icon size={16} />
                            {campaign.title}
                            </div>
                            
                            <h2 className="text-3xl font-light leading-tight mb-1">
                            {campaign.headline}
                            </h2>
                            <h3 className="text-3xl font-bold text-[#F79E1B] mb-4 drop-shadow-md">
                            {campaign.subheadline}
                            </h3>
                            
                            <p className="text-white/90 text-sm leading-relaxed mb-6 max-w-[300px]">
                            {campaign.description}
                            </p>

                            <motion.a
                            href={campaign.link}
                            target="_blank"
                            whileHover={{ scale: 1.05 }}
                            whileTap={{ scale: 0.95 }}
                            className="inline-block px-6 py-2.5 bg-[#E30613] text-white rounded-lg font-bold text-sm shadow-lg hover:bg-[#c40510] transition-colors"
                            >
                            Fırsatı Yakala
                            </motion.a>
                        </motion.div>
                        </div>
                    </motion.div>
                    ))}
                </div>
                </div>
            );
        }

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
