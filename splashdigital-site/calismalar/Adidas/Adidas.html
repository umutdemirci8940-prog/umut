<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Hotel Superstar</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <style>
      @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;600&family=Oswald:wght@500;700&display=swap');
      
      body {
        font-family: 'Inter', sans-serif;
        background-color: #f0f0f0;
        display: flex;
        justify-content: center;
        align-items: center;
        height: 100vh;
        margin: 0;
      }
      #root {
        width: 970px;
        height: 250px;
        box-shadow: 0 4px 20px rgba(0,0,0,0.1);
      }
      .font-headline {
        font-family: 'Oswald', sans-serif;
      }
      .font-body {
        font-family: 'Inter', sans-serif;
      }
      /* Animation Keyframes */
      @keyframes scroll-up {
        0% { transform: translateY(0); }
        100% { transform: translateY(-50%); }
      }
      .animate-scroll-vertical {
        animation: scroll-up 12s linear infinite;
      }
    </style>
  <script type="importmap">
{
  "imports": {
    "react": "https://esm.sh/react@^19.2.3",
    "react/": "https://esm.sh/react@^19.2.3/"
  }
}
</script>
</head>
  <body>
    <div id="root"></div>

    <script type="text/babel">
      const { useState, useEffect } = React;

      // --- CONSTANTS ---
      const ROOMS = [
        {
          id: 'room-street',
          title: 'SOKAK',
          subtitle: 'OG Street',
          segment: 'OG Street',
          image: 'https://images.unsplash.com/photo-1523398002811-999ca8dec234?q=80&w=800&auto=format&fit=crop',
          color: 'bg-zinc-800'
        },
        {
          id: 'room-arcade',
          title: 'ARCADE',
          subtitle: 'Subskate',
          segment: 'Subskate',
          image: 'https://images.unsplash.com/photo-1564982752979-3f7bc974d29a?q=80&w=800&auto=format&fit=crop',
          color: 'bg-zinc-900'
        },
        {
          id: 'room-stage',
          title: 'SAHNE',
          subtitle: 'Orijinal Sesler',
          segment: 'Music',
          image: 'https://images.unsplash.com/photo-1501612780327-45045538702b?q=80&w=800&auto=format&fit=crop',
          color: 'bg-blue-900'
        }
      ];

      // --- COMPONENTS ---

      const ThreeStripes = ({ className = '', color = 'bg-white' }) => {
        return (
          <div className={`flex gap-1 -skew-x-12 ${className}`}>
            <div className={`w-3 h-full ${color}`}></div>
            <div className={`w-3 h-full ${color}`}></div>
            <div className={`w-3 h-full ${color}`}></div>
          </div>
        );
      };

      const IntroSequence = ({ onComplete }) => {
        const [step, setStep] = useState(0);
        const [exiting, setExiting] = useState(false);

        useEffect(() => {
          const t1 = setTimeout(() => setStep(1), 500); 
          const t2 = setTimeout(() => setStep(2), 1500);
          const t3 = setTimeout(() => setStep(3), 3500); 
          const t4 = setTimeout(() => setExiting(true), 3800); 
          const t5 = setTimeout(() => onComplete(), 4800); 

          return () => {
            clearTimeout(t1);
            clearTimeout(t2);
            clearTimeout(t3);
            clearTimeout(t4);
            clearTimeout(t5);
          };
        }, [onComplete]);

        return (
          <div 
            className={`absolute inset-0 z-50 bg-black text-white flex flex-col items-center justify-center overflow-hidden font-headline transition-transform duration-1000 ease-[cubic-bezier(0.77,0,0.175,1)] ${exiting ? '-translate-y-full' : 'translate-y-0'}`}
            style={{ willChange: 'transform' }}
          >
            <div className={`absolute inset-0 flex items-center justify-center overflow-hidden pointer-events-none transition-all duration-1000 ${step >= 3 ? 'opacity-0 scale-110' : 'opacity-100 scale-100'}`}>
               <div className="flex gap-12 -rotate-[20deg] opacity-[0.08] select-none transform translate-y-10 scale-150">
                  <div className="w-24 h-[1000px] bg-white"></div>
                  <div className="w-24 h-[1000px] bg-white"></div>
                  <div className="w-24 h-[1000px] bg-white"></div>
               </div>
            </div>

            <div className="relative z-10 text-center px-4 w-full flex flex-col items-center justify-center">
              <div className={`flex flex-col items-center transition-all duration-700 transform ${step >= 3 ? 'opacity-0 scale-110' : 'opacity-100 scale-100'}`}>
                 <div className={`w-40 mb-6 transition-all duration-700 transform ${step >= 1 ? 'opacity-100 translate-y-0' : 'opacity-0 translate-y-8'}`}>
                    <img 
                      src="https://upload.wikimedia.org/wikipedia/commons/2/24/Adidas_logo.png" 
                      alt="adidas" 
                      className="w-full h-auto"
                      style={{ filter: 'brightness(0) invert(1)' }}
                    />
                 </div>
              </div>
            </div>
          </div>
        );
      };

      const RoomAccordion = ({ onRoomSelect }) => {
        const [activeId, setActiveId] = useState(null);

        return (
          <div className="flex-1 flex h-full bg-black relative z-10 border-l border-white/20">
            {ROOMS.map((room) => {
              const isActive = activeId === room.id;
              
              return (
                <div
                  key={room.id}
                  onMouseEnter={() => setActiveId(room.id)}
                  onMouseLeave={() => setActiveId(null)}
                  className={`
                    relative h-full transition-all duration-500 ease-[cubic-bezier(0.25,1,0.5,1)] overflow-hidden border-r border-white/20 cursor-pointer group
                    ${isActive ? 'flex-[3]' : 'flex-1'}
                  `}
                >
                  <div className="absolute inset-0">
                     <img 
                       src={room.image} 
                       alt={room.title} 
                       className={`w-full h-full object-cover transition-transform duration-1000 ${isActive ? 'scale-105 grayscale-0' : 'scale-100 grayscale'}`}
                     />
                     <div className={`absolute inset-0 bg-black transition-opacity duration-300 ${isActive ? 'opacity-20' : 'opacity-60'}`}></div>
                     <div className="absolute inset-0 bg-blue-900 mix-blend-color-burn opacity-0 group-hover:opacity-30 transition-opacity duration-500"></div>
                  </div>

                  <div className={`absolute inset-0 flex flex-col items-center justify-center transition-all duration-300 ${isActive ? 'opacity-0 translate-y-4' : 'opacity-100 translate-y-0'}`}>
                     <h3 className="text-white font-headline font-bold text-2xl uppercase tracking-widest -rotate-90 whitespace-nowrap z-10 drop-shadow-md">
                       {room.segment}
                     </h3>
                  </div>

                  <div className={`absolute bottom-0 left-0 w-full p-6 transition-all duration-500 transform ${isActive ? 'translate-y-0 opacity-100' : 'translate-y-8 opacity-0'}`}>
                    
                    <h2 className="text-white font-headline text-5xl font-bold uppercase leading-[0.85] mb-2 tracking-tighter">
                      {room.title}
                    </h2>
                    
                    <p className="text-white font-body font-medium text-xs mb-6 uppercase tracking-wider opacity-90 border-l-2 border-[#0076BD] pl-2">
                      {room.subtitle}
                    </p>
                    
                    <button className="group/btn flex items-center gap-3 text-white uppercase font-headline font-bold tracking-widest text-sm hover:underline underline-offset-4 decoration-2">
                      ODAYI KEŞFET
                      <svg className="w-4 h-4 transition-transform group-hover/btn:translate-x-1" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2">
                        <path d="M5 12H19M19 12L12 5M19 12L12 19" strokeLinecap="square" strokeLinejoin="miter"/>
                      </svg>
                    </button>
                  </div>
                </div>
              );
            })}
          </div>
        );
      };

      const App = () => {
        // Animation States
        const INTRO = 'INTRO';
        const EXPLORE = 'EXPLORE';
        
        const [animState, setAnimState] = useState(INTRO);

        const handleIntroComplete = () => {
          setAnimState(EXPLORE);
        };

        const handleCTAClick = () => {
          window.open('https://www.adidas.com.tr/', '_blank');
        };

        return (
          <div className="w-[970px] h-[250px] relative bg-white overflow-hidden flex select-none font-body text-black">
            
            {animState === INTRO && (
              <IntroSequence onComplete={handleIntroComplete} />
            )}

            <div className="flex w-full h-full relative z-0">
              
              {/* Left: Branding & Context */}
              <div className="w-[200px] h-full bg-black text-white flex flex-col justify-between p-6 relative z-20 shrink-0">
                 
                 <div className="flex flex-col items-start">
                   <div className="w-16 mb-4">
                     <img 
                       src="https://upload.wikimedia.org/wikipedia/commons/2/24/Adidas_logo.png" 
                       alt="adidas" 
                       className="w-full h-auto"
                       style={{ filter: 'brightness(0) invert(1)' }}
                     />
                   </div>
                   <div className="w-10 h-[2px] bg-[#0076BD] mb-4"></div>
                 </div>
                 
                 {/* Footer Info: Vertical Scrolling Text */}
                 <div className="relative h-[110px] overflow-hidden opacity-80">
                   <div className="absolute top-0 left-0 w-full h-8 bg-gradient-to-b from-black z-10"></div>
                   <div className="absolute bottom-0 left-0 w-full h-8 bg-gradient-to-t from-black z-10"></div>
                   
                   <div className="animate-scroll-vertical flex flex-col">
                     {[...Array(2)].map((_, i) => (
                       <div key={i} className="flex flex-col gap-10 pb-10">
                         <div className="flex flex-col gap-1">
                            <span className="text-[10px] font-headline font-bold tracking-[0.2em] text-white uppercase leading-none">YOU GOT THIS</span>
                            <span className="text-[8px] font-body text-gray-400 tracking-wide leading-tight w-[140px]">We all need someone to make us believe.</span>
                         </div>
                         <div className="flex flex-col gap-1">
                            <span className="text-[10px] font-headline font-bold tracking-[0.2em] text-white uppercase leading-none">YOU GOT THIS</span>
                            <span className="text-[8px] font-body text-gray-400 tracking-wide leading-tight w-[140px]">We all need someone to make us believe.</span>
                         </div>
                       </div>
                     ))}
                   </div>
                 </div>
              </div>

              <RoomAccordion onRoomSelect={() => {}} />

              {/* Right: Product Hero & CTA */}
              <div className="w-[320px] h-full bg-white relative shrink-0 group overflow-hidden border-l border-gray-100">
                
                <ThreeStripes className="absolute top-[-20px] right-[-30px] h-[350px] opacity-[0.03] group-hover:opacity-[0.05] transition-opacity duration-300 origin-top-right rotate-12" color="bg-black" />

                <div className="absolute inset-0 flex items-center justify-center p-4 pb-16">
                   <img 
                     src="https://images.unsplash.com/photo-1512374382149-233c42b6a83b?q=80&w=600&auto=format&fit=crop" 
                     alt="Superstar Shoe" 
                     className="w-[260px] h-auto object-contain -rotate-[12deg] group-hover:-rotate-[2deg] group-hover:scale-105 transition-all duration-700 ease-[cubic-bezier(0.25,1,0.5,1)]"
                     style={{filter: 'contrast(1.05) brightness(1.05)'}} 
                   />
                </div>

                <div className="absolute bottom-0 left-0 right-0 p-6 bg-white">
                  <div className="flex justify-between items-end mb-4">
                    <div>
                      <h3 className="text-black font-headline font-bold text-3xl uppercase leading-none tracking-tighter">
                        Superstar
                      </h3>
                      <div className="flex flex-col mt-1">
                        <p className="text-sm text-black font-bold uppercase tracking-widest">
                          YOU GOT THIS
                        </p>
                        <p className="text-[9px] text-gray-500 font-medium tracking-wide mt-0.5 max-w-[200px] leading-tight">
                          We all need someone to make us believe.
                        </p>
                      </div>
                    </div>
                  </div>
                  
                  <button 
                    onClick={handleCTAClick}
                    className="w-full bg-black text-white h-12 flex items-center justify-between px-5 uppercase font-headline font-bold tracking-widest text-sm hover:bg-gray-900 transition-colors group/btn relative overflow-hidden"
                  >
                     <span className="relative z-10">ÜRÜNLERİ İNCELE</span>
                     <svg className="w-5 h-5 relative z-10 transition-transform duration-300 group-hover/btn:translate-x-1" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2">
                       <path d="M5 12H19M19 12L12 5M19 12L12 19" strokeLinecap="square" strokeLinejoin="miter"/>
                     </svg>
                     <div className="absolute bottom-0 left-0 h-[2px] w-full bg-[#0076BD] translate-y-full group-hover/btn:translate-y-0 transition-transform duration-300"></div>
                  </button>
                </div>
              </div>

            </div>

          </div>
        );
      };

      const root = ReactDOM.createRoot(document.getElementById('root'));
      root.render(<App />);
    </script>
  </body>
</html>
