<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Tefal Titanium 6X Excellence</title>
    
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    
    <!-- Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@200;300;400;500;600;700;800;900&display=swap" rel="stylesheet">
    
    <!-- Babel -->
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

    <!-- Import Map -->
    <script type="importmap">
    {
      "imports": {
        "react": "https://esm.sh/react@18.2.0?dev",
        "react-dom/client": "https://esm.sh/react-dom@18.2.0/client?dev",
        "framer-motion": "https://esm.sh/framer-motion@10.16.4?external=react,react-dom&dev",
        "lucide-react": "https://esm.sh/lucide-react@0.292.0?external=react&dev"
      }
    }
    </script>

    <script>
      tailwind.config = {
        theme: {
          extend: {
            colors: {
              tefal: {
                red: '#E30613',
                green: '#4da037',
                dark: '#080808',
                metal: '#2a2a2a'
              }
            },
            fontFamily: {
              sans: ['Montserrat', 'sans-serif'],
            },
            backgroundImage: {
              'titanium': "url('https://www.transparenttextures.com/patterns/brushed-alum.png')",
            }
          }
        }
      }
    </script>
    <style>
      body {
        background-color: #050505;
        display: flex;
        justify-content: center;
        align-items: center;
        min-height: 100vh;
        margin: 0;
        font-family: 'Montserrat', sans-serif;
      }
      #root {
        width: 970px;
        height: 250px;
        position: relative;
        overflow: hidden;
        background-color: #000;
        box-shadow: 0 0 50px rgba(0,0,0,0.9);
      }
      
      .glare {
        background: linear-gradient(90deg, transparent, rgba(255,255,255,0.1), transparent);
      }

      /* ENHANCED Pan Interior Texture */
      .bg-pan-coating {
        /* Slightly lighter center to reveal texture against black */
        background: radial-gradient(circle at center, #333333 0%, #050505 90%);
        position: absolute;
        inset: 0;
      }
      
      /* 1. Grain/Noise Layer - Stronger Opacity */
      .bg-pan-coating::before {
        content: "";
        position: absolute;
        inset: 0;
        /* Coarser noise */
        background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 200 200' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='noise'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.65' numOctaves='3' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23noise)' opacity='0.4'/%3E%3C/svg%3E");
        opacity: 0.35;
        mix-blend-mode: overlay;
        pointer-events: none;
      }

      /* 2. Speckles/Particles Layer - Simulating the Titanium Coating Dots */
      .bg-pan-coating::after {
        content: "";
        position: absolute;
        inset: 0;
        background-image: 
            radial-gradient(circle, rgba(255,255,255,0.15) 1px, transparent 1.5px),
            radial-gradient(circle, rgba(255,255,255,0.1) 1.5px, transparent 2px);
        background-size: 50px 50px, 90px 90px;
        background-position: 0 0, 25px 25px;
        opacity: 0.4;
        pointer-events: none;
      }
    </style>
</head>
<body>
    <div id="root"></div>

    <script type="text/babel" data-type="module">
      import React, { useState, useEffect } from 'react';
      import { createRoot } from 'react-dom/client';
      import { motion, AnimatePresence, useSpring, useMotionValue } from 'framer-motion';
      import { ChevronRight, ShieldCheck, Zap, RotateCcw, Leaf, Utensils } from 'lucide-react';

      // --- ASSETS ---
      const TEFAL_LOGO = "https://upload.wikimedia.org/wikipedia/commons/thumb/2/2f/Tefal_logo.svg/2560px-Tefal_logo.svg.png";
      const PAN_IMG = "tava.jpeg";

      // --- STAGES ---
      const STAGE = {
        THERMO_HEAT: 0,   // New: Thermo signal appears and heats up
        FOOD_POP: 1,      // New: Food emojis pop out
        INTRO_TEXT: 2,    // Old Intro: "6X" Cinematic Title
        REVEAL_PRODUCT: 3, // Pan slides in
        HERO_SPECS: 4     // Specs appear
      };

      // --- COMPONENTS ---

      // Background Particles
      const Particles = () => {
         return (
            <div className="absolute inset-0 overflow-hidden pointer-events-none opacity-20">
               {[...Array(20)].map((_, i) => (
                  <motion.div
                     key={i}
                     className="absolute bg-white rounded-full blur-[1px]"
                     style={{
                        width: Math.random() * 2 + 1,
                        height: Math.random() * 2 + 1,
                        top: Math.random() * 100 + '%',
                        left: Math.random() * 100 + '%'
                     }}
                     animate={{
                        y: [0, -30, 0],
                        opacity: [0.1, 0.5, 0.1],
                        scale: [1, 1.5, 1]
                     }}
                     transition={{
                        duration: 2 + Math.random() * 3,
                        repeat: Infinity,
                        ease: "easeInOut"
                     }}
                  />
               ))}
            </div>
         )
      }

      // Thermo Signal Component
      const ThermoSignal = ({ isHot }) => {
        return (
          <div className="relative w-32 h-32 rounded-full overflow-hidden shadow-[0_0_30px_rgba(227,6,19,0.5)] border-4 border-[#8B0000]">
            {/* Base Red Background */}
            <div className="absolute inset-0 bg-[#E30613]" />
            
            {/* Pattern Layer (The Hourglass/T shape) - Disappears when hot */}
            <motion.div 
               className="absolute inset-0"
               initial={{ opacity: 1 }}
               animate={{ opacity: isHot ? 0 : 1 }}
               transition={{ duration: 1.5, ease: "easeInOut" }}
            >
               <svg viewBox="0 0 100 100" className="w-full h-full p-2 opacity-40">
                  <path d="M50 0 L100 0 L50 50 L100 100 L0 100 L50 50 L0 0 Z" fill="#600000" />
               </svg>
            </motion.div>
            
            {/* Center "T" text usually, but keeping it abstract pattern for simplicity/copyright safety */}
            
            {/* Glow when hot */}
            <motion.div 
               className="absolute inset-0 bg-[#E30613] mix-blend-screen"
               animate={{ opacity: isHot ? 0.8 : 0 }}
               transition={{ duration: 0.5 }}
            />
          </div>
        )
      }

      // Food Explosion Component
      const FoodExplosion = () => {
         const foods = ['🥩', '🥦', '🍳', '🍤', '🥞', '🌶️'];
         
         return (
            <div className="absolute inset-0 flex items-center justify-center pointer-events-none z-50">
               {foods.map((food, i) => {
                  const angle = (i / foods.length) * 2 * Math.PI;
                  const radius = 150; 
                  return (
                     <motion.div
                        key={i}
                        className="absolute text-4xl filter drop-shadow-lg"
                        initial={{ scale: 0, x: 0, y: 0, opacity: 0 }}
                        animate={{ 
                           scale: [0, 1.5, 1], 
                           x: Math.cos(angle) * radius, 
                           y: Math.sin(angle) * radius,
                           opacity: [0, 1, 0],
                           rotate: Math.random() * 360
                        }}
                        transition={{ duration: 1.2, ease: "easeOut" }}
                     >
                        {food}
                     </motion.div>
                  )
               })}
            </div>
         )
      }

      // --- MAIN APP ---
      const App = () => {
        const [stage, setStage] = useState(STAGE.THERMO_HEAT);
        
        // Spotlight interaction
        const x = useMotionValue(0);
        const y = useMotionValue(0);
        const mouseX = useSpring(x, { stiffness: 40, damping: 25 });
        const mouseY = useSpring(y, { stiffness: 40, damping: 25 });

        const handleMouseMove = (e) => {
          const rect = e.currentTarget.getBoundingClientRect();
          x.set(e.clientX - rect.left);
          y.set(e.clientY - rect.top);
        };

        // Timeline
        useEffect(() => {
          const runSequence = async () => {
            if (stage === STAGE.THERMO_HEAT) {
               // Heat up phase
               await new Promise(r => setTimeout(r, 1500)); 
               setStage(STAGE.FOOD_POP);
               
               // Food pop phase
               await new Promise(r => setTimeout(r, 1200));
               setStage(STAGE.INTRO_TEXT);

               // 6X Text Phase
               await new Promise(r => setTimeout(r, 2200));
               setStage(STAGE.REVEAL_PRODUCT);

               // Specs Phase
               await new Promise(r => setTimeout(r, 800));
               setStage(STAGE.HERO_SPECS);
            }
          };
          runSequence();
        }, [stage]);

        const restart = () => {
           setStage(STAGE.THERMO_HEAT);
        };

        const openLink = () => {
           window.open('https://www.tefal.com.tr/titanyum-6x-excellence-induksiyon-tabanli-tava-32-cm-2100118365/', '_blank');
        };

        return (
          <div 
            className="w-full h-full relative cursor-default select-none overflow-hidden bg-[#080808]"
            onMouseMove={handleMouseMove}
          >
            {/* Global Background (Brushed Aluminum - subtle) */}
            <div className="absolute inset-0 bg-titanium opacity-10"></div>

            {/* INTRO SPECIFIC BACKGROUND: Pan Coating Texture */}
            <AnimatePresence>
               {(stage === STAGE.INTRO_TEXT || stage === STAGE.THERMO_HEAT || stage === STAGE.FOOD_POP) && (
                  <motion.div 
                     className="bg-pan-coating z-10" 
                     initial={{ opacity: 0 }}
                     animate={{ opacity: 1 }}
                     exit={{ opacity: 0 }}
                     transition={{ duration: 1 }}
                  />
               )}
            </AnimatePresence>
            
            {/* Global Particles (on top of backgrounds) */}
            <div className="z-20 absolute inset-0 pointer-events-none">
                <Particles />
            </div>
            
            {/* Ambient Red Glow (Dynamic) */}
            <motion.div 
               animate={{ 
                 opacity: (stage === STAGE.INTRO_TEXT || stage === STAGE.THERMO_HEAT) ? 0.5 : 0.2,
                 scale: (stage === STAGE.INTRO_TEXT || stage === STAGE.THERMO_HEAT) ? 1.4 : 1
               }}
               transition={{ duration: 1.5 }}
               className="absolute top-1/2 left-1/2 -translate-x-1/2 -translate-y-1/2 w-[600px] h-[600px] bg-[#E30613] blur-[140px] rounded-full pointer-events-none z-0"
            />

            {/* --- LAYOUT --- */}
            
            {/* LEFT: Branding - Logo (STATIC & ALWAYS VISIBLE) */}
            <div className="absolute left-8 top-6 z-50">
               <img src={TEFAL_LOGO} alt="Tefal" className="w-20 drop-shadow-lg" />
            </div>

            {/* LEFT: Main Heading & Message */}
            <AnimatePresence>
              {stage >= STAGE.REVEAL_PRODUCT && (
                <motion.div 
                   className="absolute left-8 bottom-8 z-40 max-w-[320px]"
                   initial={{ opacity: 0, x: -20 }}
                   animate={{ opacity: 1, x: 0 }}
                   transition={{ delay: 0.3, duration: 0.8 }}
                >
                    <h2 className="text-gray-400 text-[10px] tracking-[0.4em] mb-1 font-bold">EXCELLENCE</h2>
                    <h1 className="text-white text-3xl font-light leading-none">
                      TITANIUM <span className="font-bold text-[#E30613]">6X</span>
                    </h1>
                    
                    {/* Brand Message Added Here */}
                    <p className="text-gray-300 text-xs mt-1 font-medium tracking-wide italic opacity-80">
                      Yıllara Meydan Okuyan Dayanıklılık
                    </p>

                    <div className="w-6 h-0.5 bg-[#E30613] mt-3 mb-4"></div>
                    
                    <motion.button
                      onClick={openLink}
                      whileHover={{ scale: 1.05 }}
                      whileTap={{ scale: 0.95 }}
                      className="group bg-white/5 border border-white/20 hover:bg-[#E30613] hover:border-[#E30613] text-white px-5 py-2 text-[10px] font-bold tracking-widest flex items-center gap-2 transition-all duration-300"
                    >
                      KEŞFET <ChevronRight size={12} className="group-hover:translate-x-1 transition-transform" />
                    </motion.button>
                </motion.div>
              )}
            </AnimatePresence>

             {/* --- FUN INTRO: THERMO SIGNAL --- */}
             <AnimatePresence>
               {(stage === STAGE.THERMO_HEAT || stage === STAGE.FOOD_POP) && (
                  <motion.div 
                     className="absolute inset-0 flex flex-col items-center justify-center z-[60]"
                     exit={{ opacity: 0, scale: 2, filter: "blur(20px)" }}
                     transition={{ duration: 0.6 }}
                  >
                     <motion.div
                        initial={{ scale: 0, opacity: 0 }}
                        animate={{ scale: 1, opacity: 1 }}
                        transition={{ type: "spring", stiffness: 100, damping: 20 }}
                     >
                        <ThermoSignal isHot={stage === STAGE.FOOD_POP} />
                     </motion.div>

                     {/* Thermo Text */}
                     <motion.div 
                        className="mt-6 text-center"
                        initial={{ opacity: 0, y: 10 }}
                        animate={{ opacity: 1, y: 0 }}
                        transition={{ delay: 0.3 }}
                     >
                        <div className="text-gray-400 text-[10px] uppercase tracking-[0.3em] font-medium mb-1">Thermo-Signal™</div>
                        <AnimatePresence mode="wait">
                           {stage === STAGE.THERMO_HEAT ? (
                              <motion.div 
                                 key="waiting"
                                 initial={{ opacity: 0 }} animate={{ opacity: 1 }} exit={{ opacity: 0, y: -10 }}
                                 className="text-white text-xl font-light italic"
                              >
                                 Isınıyor...
                              </motion.div>
                           ) : (
                              <motion.div 
                                 key="ready"
                                 initial={{ opacity: 0, scale: 0.5 }} animate={{ opacity: 1, scale: 1.2 }}
                                 className="text-[#E30613] text-2xl font-black italic tracking-wider uppercase"
                              >
                                 TAM ZAMANI!
                              </motion.div>
                           )}
                        </AnimatePresence>
                     </motion.div>
                     
                     {/* FOOD POPPER */}
                     {stage === STAGE.FOOD_POP && <FoodExplosion />}
                  </motion.div>
               )}
             </AnimatePresence>

             {/* --- CENTER: DURABILITY INTRO (6X TEXT) --- */}
             <AnimatePresence>
                {stage === STAGE.INTRO_TEXT && (
                   <motion.div 
                      className="absolute inset-0 flex flex-col items-center justify-center z-[100] pointer-events-none"
                      exit={{ opacity: 0, scale: 1.1, filter: "blur(10px)" }}
                      transition={{ duration: 0.5 }}
                   > 
                       <div className="relative flex flex-col items-center">
                           {/* 6X Text */}
                           <motion.div
                              initial={{ scale: 5, opacity: 0, filter: "blur(20px)" }}
                              animate={{ scale: 1, opacity: 1, filter: "blur(0px)" }}
                              transition={{ duration: 0.6, ease: [0.22, 1, 0.36, 1] }}
                              className="relative"
                           >
                              <h1 className="text-9xl font-black text-transparent bg-clip-text bg-gradient-to-br from-white via-gray-200 to-gray-500 tracking-tighter italic"
                                  style={{ textShadow: "0 10px 40px rgba(255,255,255,0.1)" }}
                              >
                                 6X
                              </h1>
                              {/* Subtle Red overlay outline effect */}
                              <div className="absolute inset-0 text-9xl font-black text-[#E30613] tracking-tighter italic blur-lg opacity-40 -z-10">
                                 6X
                              </div>
                           </motion.div>

                           {/* Subtitle with expanding spacing */}
                           <motion.div
                              initial={{ opacity: 0, letterSpacing: "0.1em", y: 20 }}
                              animate={{ opacity: 1, letterSpacing: "0.35em", y: 0 }}
                              transition={{ delay: 0.2, duration: 1.0, ease: "easeOut" }}
                              className="text-white font-bold text-sm uppercase mt-2 relative overflow-hidden whitespace-nowrap"
                           >
                              <span className="relative z-10 text-gray-100">RAKİPSİZ DAYANIKLILIK</span>
                              
                              {/* Shimmer Glint Effect */}
                              <motion.div 
                                className="absolute top-0 left-0 w-full h-full bg-gradient-to-r from-transparent via-white to-transparent skew-x-12 opacity-80"
                                initial={{ x: '-150%' }}
                                animate={{ x: '150%' }}
                                transition={{ delay: 0.8, duration: 1.2, ease: "easeInOut" }}
                              />
                           </motion.div>
                       </div>
                   </motion.div>
                )}
             </AnimatePresence>


            {/* --- CENTER: THE PAN --- */}
            <div className="absolute inset-0 flex items-center justify-center pointer-events-none z-20">
               <motion.div
                  // Resized container to fit better within 250px height
                  className="relative w-[500px] h-[220px] flex items-center justify-center"
                  initial={{ x: 400, opacity: 0, scale: 0.8, rotate: 5 }}
                  animate={{
                     x: (stage === STAGE.THERMO_HEAT || stage === STAGE.FOOD_POP || stage === STAGE.INTRO_TEXT) ? 400 : (stage === STAGE.HERO_SPECS ? -50 : 20),
                     opacity: (stage === STAGE.THERMO_HEAT || stage === STAGE.FOOD_POP || stage === STAGE.INTRO_TEXT) ? 0 : 1,
                     scale: (stage === STAGE.THERMO_HEAT || stage === STAGE.FOOD_POP || stage === STAGE.INTRO_TEXT) ? 0.8 : 1,
                     rotate: (stage === STAGE.THERMO_HEAT || stage === STAGE.FOOD_POP || stage === STAGE.INTRO_TEXT) ? 5 : 0
                  }}
                  transition={{ 
                    duration: 1.0, 
                    type: "spring",
                    stiffness: 70,
                    damping: 15
                  }}
               >
                  {/* Subtle Backlight behind pan */}
                  <div className="absolute inset-0 bg-radial-gradient from-white/10 to-transparent blur-xl scale-75 opacity-40"></div>

                  {/* The Pan Image - Object Contain to prevent cropping */}
                  <img 
                     src={PAN_IMG} 
                     alt="Tefal Pan"
                     className="w-full h-full object-contain relative z-20 drop-shadow-[0_20px_40px_rgba(0,0,0,0.8)]"
                  />
                  
                  {/* Thermo Signal Glow (Static after intro) */}
                  {stage >= STAGE.REVEAL_PRODUCT && (
                    <div className="absolute top-[50%] left-[50%] w-[60px] h-[60px] -translate-x-1/2 -translate-y-1/2 z-30 pointer-events-none mix-blend-screen">
                      <motion.div 
                          initial={{ opacity: 0, scale: 0.8 }}
                          animate={{ opacity: [0, 0.4, 0], scale: [0.8, 1.2, 0.8] }}
                          transition={{ repeat: Infinity, duration: 2.5, delay: 1 }}
                          className="w-full h-full bg-[#E30613] blur-[20px] rounded-full"
                      />
                    </div>
                  )}
               </motion.div>
            </div>

            {/* --- RIGHT: FEATURES (Simplified & Smaller) --- */}
            <div className="absolute right-0 top-0 h-full w-[350px] z-30 flex flex-col justify-center pr-8 pl-4 pointer-events-none">
               <AnimatePresence>
                 {stage === STAGE.HERO_SPECS && (
                   <div className="space-y-3">
                     
                     {/* Feature 1: 6 KAT */}
                     <motion.div 
                        initial={{ x: 50, opacity: 0 }}
                        animate={{ x: 0, opacity: 1 }}
                        transition={{ delay: 0.2 }}
                        className="flex items-center justify-end gap-3"
                     >
                        <div className="text-right">
                           <div className="text-white text-2xl font-black leading-none tracking-tight">6 KAT</div>
                           <div className="text-[#E30613] text-[9px] font-bold tracking-widest uppercase">DAHA DAYANIKLI</div>
                        </div>
                        <div className="w-8 h-8 rounded-full bg-white/5 flex items-center justify-center border border-white/10 text-[#E30613]">
                           <ShieldCheck size={16} />
                        </div>
                     </motion.div>

                     {/* Feature 2: 100% SAFE */}
                     <motion.div 
                        initial={{ x: 50, opacity: 0 }}
                        animate={{ x: 0, opacity: 1 }}
                        transition={{ delay: 0.3 }}
                        className="flex items-center justify-end gap-3"
                     >
                         <div className="text-right">
                           <div className="text-white text-2xl font-black leading-none tracking-tight">%100</div>
                           <div className="text-tefal-green text-[9px] font-bold tracking-widest uppercase">GÜVENLİ KAPLAMA</div>
                        </div>
                        <div className="w-8 h-8 rounded-full bg-white/5 flex items-center justify-center border border-white/10 text-tefal-green">
                           <Leaf size={16} />
                        </div>
                     </motion.div>

                     {/* Feature 3: INDUCTION */}
                     <motion.div 
                        initial={{ x: 50, opacity: 0 }}
                        animate={{ x: 0, opacity: 1 }}
                        transition={{ delay: 0.4 }}
                        className="flex items-center justify-end gap-3"
                     >
                        <div className="text-right">
                           <div className="text-white text-xl font-black leading-none tracking-tight uppercase">İNDÜKSİYON</div>
                           <div className="text-cyan-400 text-[9px] font-bold tracking-widest uppercase">UYUMLU TABAN</div>
                        </div>
                        <div className="w-8 h-8 rounded-full bg-white/5 flex items-center justify-center border border-white/10 text-cyan-400">
                           <Zap size={16} />
                        </div>
                     </motion.div>

                   </div>
                 )}
               </AnimatePresence>

                {/* Replay Button */}
                {stage === STAGE.HERO_SPECS && (
                  <motion.button 
                     initial={{ opacity: 0 }} animate={{ opacity: 1 }} transition={{ delay: 1.5 }}
                     onClick={restart}
                     className="absolute bottom-5 right-8 text-gray-600 hover:text-white transition-colors pointer-events-auto flex items-center gap-1.5 text-[9px] uppercase tracking-widest"
                  >
                     <RotateCcw size={12} /> Tekrar
                  </motion.button>
               )}
            </div>

            {/* --- SPOTLIGHT OVERLAY --- */}
            {stage === STAGE.HERO_SPECS && (
                <motion.div 
                   style={{ x: mouseX, y: mouseY, translateX: '-50%', translateY: '-50%' }}
                   className="absolute top-0 left-0 w-[500px] h-[500px] bg-[radial-gradient(circle,rgba(255,255,255,0.03)_0%,transparent_70%)] blur-3xl pointer-events-none z-10 mix-blend-screen"
                />
             )}

          </div>
        );
      };

      const root = createRoot(document.getElementById('root'));
      root.render(<App />);
    </script>
</body>
</html>
