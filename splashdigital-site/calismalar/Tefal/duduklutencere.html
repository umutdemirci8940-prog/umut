<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Tefal Clipso Chef</title>
  
  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>
  
  <!-- Fonts -->
  <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@300;400;500;700&family=Playfair+Display:ital,wght@0,600;0,700;1,600&display=swap" rel="stylesheet">
  
  <!-- React & ReactDOM -->
  <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
  <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
  
  <!-- Babel -->
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

  <style>
    body {
      margin: 0;
      padding: 0;
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
      background-color: #050505;
      font-family: 'Manrope', sans-serif;
    }

    #root {
      width: 970px;
      height: 250px;
      background: radial-gradient(circle at 80% 50%, #1a0505 0%, #000000 70%);
      position: relative;
      overflow: hidden;
      color: white;
      border: 1px solid #333;
      box-shadow: 0 0 50px rgba(0,0,0,0.8);
    }

    /* --- ANIMATIONS --- */

    /* Intro Animations */
    @keyframes reveal-mask {
      0% { clip-path: circle(0% at 50% 50%); }
      100% { clip-path: circle(150% at 50% 50%); }
    }
    
    @keyframes text-glow {
      0% { text-shadow: 0 0 5px rgba(255,255,255,0.1); opacity: 0; transform: translateY(10px); }
      50% { opacity: 1; }
      100% { text-shadow: 0 0 20px rgba(255,255,255,0.8), 0 0 40px #E30613; opacity: 1; transform: translateY(0); }
    }

    /* Fog & Steam */
    .fog-container {
      position: absolute;
      width: 100%;
      height: 100%;
      overflow: hidden;
      z-index: 0;
      pointer-events: none;
    }
    .fog-img {
      position: absolute;
      height: 100vh;
      width: 300vw;
      z-index: 1;
      opacity: 0.3;
      background: url('https://raw.githubusercontent.com/danielstuart14/CSS_FOG_ANIMATION/master/img/fog1.png') repeat-x;
      background-size: contain;
      animation: fog 60s linear infinite;
    }
    @keyframes fog {
      0% { transform: translate3d(0, 0, 0); }
      100% { transform: translate3d(-200vw, 0, 0); }
    }

    @keyframes rise {
      0% { opacity: 0; transform: translateY(0) scale(0.5); filter: blur(2px); }
      20% { opacity: 0.6; filter: blur(4px); }
      100% { opacity: 0; transform: translateY(-120px) scale(2.5); filter: blur(8px); }
    }
    .steam-particle {
      position: absolute;
      background: radial-gradient(circle, rgba(255,255,255,0.8) 0%, rgba(255,255,255,0) 70%);
      border-radius: 50%;
      pointer-events: none;
      z-index: 15;
    }

    /* Glassmorphism Cards */
    .glass-card {
      background: rgba(255, 255, 255, 0.03);
      backdrop-filter: blur(10px);
      -webkit-backdrop-filter: blur(10px);
      border: 1px solid rgba(255, 255, 255, 0.05);
      box-shadow: 0 4px 30px rgba(0, 0, 0, 0.1);
      transition: all 0.4s cubic-bezier(0.25, 0.8, 0.25, 1);
    }
    .glass-card:hover {
      background: rgba(255, 255, 255, 0.08);
      border-color: rgba(255, 255, 255, 0.2);
      transform: translateY(-1px) scale(1.005);
      box-shadow: 0 5px 15px rgba(0,0,0,0.3);
    }
    .glass-card.active {
      background: linear-gradient(90deg, rgba(227, 6, 19, 0.2) 0%, rgba(0,0,0,0) 100%);
      border-left: 2px solid #E30613;
      border-top: 1px solid rgba(227, 6, 19, 0.3);
      border-bottom: 1px solid rgba(227, 6, 19, 0.3);
    }

    /* Product Glow */
    .product-glow {
      position: absolute;
      width: 300px;
      height: 300px;
      background: radial-gradient(circle, rgba(227,6,19,0.4) 0%, rgba(0,0,0,0) 70%);
      filter: blur(40px);
      mix-blend-mode: screen;
      animation: pulse-glow 4s infinite alternate;
    }
    @keyframes pulse-glow {
      0% { opacity: 0.5; transform: scale(1); }
      100% { opacity: 0.8; transform: scale(1.1); }
    }

    /* Animations */
    .animate-spin-slow { animation: spin 8s linear infinite; }
    @keyframes spin { 100% { transform: rotate(360deg); } }

    .animate-float { animation: float 6s ease-in-out infinite; }
    @keyframes float { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-8px); } }

    .animate-slide-in { animation: slideIn 0.8s cubic-bezier(0.2, 0.8, 0.2, 1) forwards; opacity: 0; transform: translateX(-20px); }
    @keyframes slideIn { to { opacity: 1; transform: translateX(0); } }
    
    .fade-out { animation: fadeOut 0.5s forwards; }
    @keyframes fadeOut { to { opacity: 0; visibility: hidden; } }

    /* Custom Scrollbar */
    ::-webkit-scrollbar { width: 0; background: transparent; }
  </style>
</head>
<body>
  <div id="root"></div>

  <!-- Environment Shim -->
  <script>
    if (typeof process === 'undefined') {
      window.process = { env: { API_KEY: '' } };
    }
  </script>

  <script type="text/babel">
    const { useState, useEffect, useRef } = React;
    
    // --- ICONS ---
    const ClockIcon = () => <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" strokeWidth={1.5} stroke="currentColor" className="w-4 h-4"><path strokeLinecap="round" strokeLinejoin="round" d="M12 6v6h4.5m4.5 0a9 9 0 11-18 0 9 9 0 0118 0z" /></svg>;
    const BatteryIcon = () => <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" strokeWidth={1.5} stroke="currentColor" className="w-4 h-4"><path strokeLinecap="round" strokeLinejoin="round" d="M21 10.5h.375c.621 0 1.125.504 1.125 1.125v2.25c0 .621-.504 1.125-1.125 1.125H21m0-4.5v4.5m-14.25-4.5h7.5c.621 0 1.125.504 1.125 1.125v2.25c0 .621-.504 1.125-1.125 1.125H6.75a1.125 1.125 0 01-1.125-1.125v-2.25c0-.621.504-1.125 1.125-1.125z" /></svg>;
    const SparkleIcon = () => <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" strokeWidth={1.5} stroke="currentColor" className="w-4 h-4"><path strokeLinecap="round" strokeLinejoin="round" d="M9.813 15.904L9 18.75l-.813-2.846a4.5 4.5 0 00-3.09-3.09L2.25 12l2.846-.813a4.5 4.5 0 003.09-3.09L9 5.25l.813 2.846a4.5 4.5 0 003.09 3.09L15.75 12l-2.846.813a4.5 4.5 0 00-3.09 3.09zM18.259 8.715L18 9.75l-.259-1.035a3.375 3.375 0 00-2.455-2.456L14.25 6l1.036-.259a3.375 3.375 0 002.455-2.456L18 2.25l.259 1.035a3.375 3.375 0 002.456 2.456L21.75 6l-1.035.259a3.375 3.375 0 00-2.456 2.456z" /></svg>;
    const ArrowRight = () => <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="currentColor" className="w-3 h-3"><path fillRule="evenodd" d="M16.28 11.47a.75.75 0 010 1.06l-7.5 7.5a.75.75 0 01-1.06-1.06L14.69 12 7.72 5.03a.75.75 0 011.06-1.06l7.5 7.5z" clipRule="evenodd" /></svg>;

    // --- INTRO COMPONENT ---
    const IntroSequence = ({ onComplete }) => {
      const [step, setStep] = useState(0);

      useEffect(() => {
        // Step 1: Logo fades in
        setTimeout(() => setStep(1), 300);
        // Step 2: Slogan appears
        setTimeout(() => setStep(2), 1200);
        // Step 3: Exit
        setTimeout(() => {
          setStep(3);
          setTimeout(onComplete, 600); // Allow fade out
        }, 3200);
      }, []);

      return (
        <div className={`absolute inset-0 z-[100] bg-black flex flex-col items-center justify-center transition-opacity duration-700 ${step === 3 ? 'opacity-0 pointer-events-none' : 'opacity-100'}`}>
          <div className="absolute inset-0 bg-[radial-gradient(circle_at_center,_var(--tw-gradient-stops))] from-red-900/20 to-black"></div>
          
          {/* Animated Ring */}
          <div className={`w-40 h-40 rounded-full border-2 border-transparent border-t-[#E30613] absolute animate-spin-slow transition-all duration-1000 ${step >= 1 ? 'opacity-100 scale-100' : 'opacity-0 scale-50'}`}></div>
          <div className={`w-32 h-32 rounded-full border border-white/10 absolute transition-all duration-1000 delay-100 ${step >= 1 ? 'opacity-100 scale-100' : 'opacity-0 scale-50'}`}></div>
          
          <div className="z-10 flex flex-col items-center">
            <img 
              src="https://upload.wikimedia.org/wikipedia/commons/thumb/2/2f/Tefal_logo.svg/2560px-Tefal_logo.svg.png" 
              alt="Tefal"
              className={`h-10 object-contain mb-4 transition-all duration-1000 transform ${step >= 1 ? 'translate-y-0 opacity-100' : 'translate-y-4 opacity-0'}`}
            />
            
            <div className="overflow-hidden h-8">
               <span className={`block font-serif italic text-white text-xl transition-transform duration-1000 ${step >= 2 ? 'translate-y-0' : 'translate-y-10'}`}>
                 Mutfağın <span className="text-[#E30613]">Zaman Makinesi</span>
               </span>
            </div>
          </div>
        </div>
      );
    };

    // --- PARTICLE SYSTEM ---
    const Steam = ({ active }) => {
      const [particles, setParticles] = useState([]);
      
      useEffect(() => {
        if (!active) {
          setParticles([]);
          return;
        }
        
        const interval = setInterval(() => {
          const id = Date.now();
          const left = 30 + Math.random() * 40; // Center ish
          const size = 10 + Math.random() * 20;
          setParticles(prev => [...prev.slice(-15), { id, left, size }]);
        }, 150);
        return () => clearInterval(interval);
      }, [active]);

      return (
        <div className="absolute top-1/2 left-1/2 -translate-x-1/2 -translate-y-1/2 w-[200px] h-[300px] overflow-visible pointer-events-none z-20">
          {particles.map(p => (
            <div 
              key={p.id}
              className="steam-particle"
              style={{
                left: `${p.left}%`,
                width: `${p.size}px`,
                height: `${p.size}px`,
                bottom: '40%',
                animation: 'rise 2.5s forwards ease-out'
              }}
            />
          ))}
        </div>
      );
    };

    const Header = () => (
      <div className="absolute top-0 right-0 p-4 z-50 flex flex-col items-end pointer-events-none">
        <img 
            src="https://upload.wikimedia.org/wikipedia/commons/thumb/2/2f/Tefal_logo.svg/2560px-Tefal_logo.svg.png" 
            alt="Tefal"
            className="h-6 object-contain"
        />
        <div className="flex items-center gap-2 mt-1">
           <div className="h-[1px] w-6 bg-[#E30613]"></div>
           <span className="text-[9px] text-gray-300 uppercase tracking-[0.4em] font-light">Clipso Chef</span>
        </div>
      </div>
    );

    const ScenarioCard = ({ id, icon, title, desc, active, onClick }) => (
      <button 
        onClick={() => onClick(id)}
        className={`glass-card w-full text-left p-2 rounded-lg mb-1.5 flex items-center gap-3 group relative overflow-hidden h-[42px]
          ${active ? 'active' : ''}`}
      >
        <div className={`relative p-1.5 rounded-full transition-all duration-300 z-10 ${active ? 'bg-red-600 text-white shadow-[0_0_15px_#E30613]' : 'bg-white/5 text-gray-400 group-hover:bg-white/10 group-hover:text-white'}`}>
          {icon}
        </div>
        <div className="relative z-10 flex-1">
          <h3 className={`text-[11px] font-bold tracking-wide leading-none mb-0.5 transition-colors ${active ? 'text-white' : 'text-gray-300 group-hover:text-white'}`}>{title}</h3>
          <p className="text-[9px] text-gray-500 font-light leading-none hidden sm:block group-hover:text-gray-400 transition-colors line-clamp-1">{desc}</p>
        </div>
        
        {/* Shine Effect on Hover */}
        <div className="absolute inset-0 translate-x-[-100%] group-hover:translate-x-[100%] transition-transform duration-700 bg-gradient-to-r from-transparent via-white/10 to-transparent z-0"></div>

        {active && (
           <div className="absolute right-3 animate-pulse text-[#E30613] drop-shadow-[0_0_5px_#E30613]">
             <ArrowRight />
           </div>
        )}
      </button>
    );

    const ProductHero = ({ loading, phase }) => {
      const [imgIndex, setImgIndex] = useState(0);
      
      const images = [
        { 
          // Image 1: Main Clipso Chef (Standard)
          src: "https://d32iut21qthkdz.cloudfront.net/images/media/B3F06089-FB88-4ED6-BE965C6F91A6104B/?w=2362&h=2362&crop=false", 
          className: "scale-100"
        },
        { 
          // Image 2: Main Clipso Chef (Flipped Horizontal - simulates other side view)
          src: "https://d32iut21qthkdz.cloudfront.net/images/media/B3F06089-FB88-4ED6-BE965C6F91A6104B/?w=2362&h=2362&crop=false", 
          className: "scale-100 -scale-x-100" 
        },
        {
          // Image 3: Main Clipso Chef (Slightly Rotated - simulates dynamic angle)
          src: "https://d32iut21qthkdz.cloudfront.net/images/media/B3F06089-FB88-4ED6-BE965C6F91A6104B/?w=2362&h=2362&crop=false",
          className: "scale-105 rotate-3"
        }
      ];

      useEffect(() => {
        // Only cycle if we aren't in a 'busy' state
        if (phase === 'result') {
          setImgIndex(0); // Reset to full view on result
          return;
        }
        
        const timer = setInterval(() => {
          setImgIndex(prev => (prev + 1) % images.length);
        }, 4000); // Change image every 4 seconds
        
        return () => clearInterval(timer);
      }, [phase]);

      return (
        <div className="relative w-[340px] h-[340px] flex items-center justify-center translate-y-[-15px]">
          
          {/* Glow behind product */}
          <div className={`product-glow transition-all duration-1000 ${loading ? 'opacity-100 scale-110' : 'opacity-40'}`}></div>

          {/* Dynamic Rings */}
          <div className={`absolute w-[240px] h-[240px] rounded-full border border-white/10 transition-all duration-1000
             ${loading ? 'scale-100 border-red-500/30' : 'scale-90 opacity-30'}`}>
          </div>
          
          {loading && (
            <>
              <div className="absolute w-[240px] h-[240px] rounded-full border-t-2 border-r-2 border-[#E30613] animate-spin-slow opacity-100 shadow-[0_0_30px_rgba(227,6,19,0.4)]"></div>
               <div className="absolute w-[220px] h-[220px] rounded-full border-b-2 border-l-2 border-white/20 animate-spin-slow opacity-100" style={{animationDirection: 'reverse', animationDuration: '5s'}}></div>
            </>
          )}

          {/* Steam Particles - ALWAYS ACTIVE now */}
          <Steam active={true} />

          {/* Product Image Slideshow */}
          <div className={`relative w-full h-full z-10 transition-all duration-1000 
              ${loading ? 'scale-105 drop-shadow-[0_20px_50px_rgba(0,0,0,0.8)]' : 'drop-shadow-[0_10px_30px_rgba(0,0,0,0.5)]'} 
              ${phase === 'result' ? 'translate-x-[-30px] scale-95' : 'animate-float'}`}>
            
             {images.map((img, i) => (
                <img 
                  key={i}
                  src={img.src} 
                  alt="Tefal Clipso" 
                  className={`absolute inset-0 w-full h-full object-contain transition-all duration-1000 ease-in-out ${img.className}`}
                  style={{ opacity: i === imgIndex ? 1 : 0 }}
                />
             ))}
          </div>
        </div>
      );
    };

    const getRandomRecipe = (scenario) => {
      const db = {
        panic: [
          { dish: "Şipşak Tavuk Sote", desc: "Zile basmadan sofra hazır. Yüksek basınçla rekor sürede pişen gurme lezzet.", time: "12" },
          { dish: "Ekspres Mercimek", desc: "Dakikalar içinde kıvamlı, besleyici ve içinizi ısıtacak bir başlangıç.", time: "8" },
          { dish: "Hızlı Karnıyarık", desc: "Kızartma derdi yok. Tek tencerede, kendi buharında lezzet patlaması.", time: "15" }
        ],
        tired: [
          { dish: "Sebzeli Et Haşlama", desc: "Sen dinlen, o çalışsın. Doğra, at, kapağı kapat. Şifa kaynağı.", time: "25" },
          { dish: "Tencerede Makarna", desc: "Süzme derdi yok, sosuyla pişen en pratik İtalyan lezzeti.", time: "7" },
          { dish: "Zeytinyağlı Pırasa", desc: "Minimum eforla maksimum sağlık. Kendi suyunda pişen hafiflik.", time: "10" }
        ],
        gourmet: [
          { dish: "Kuzu İncik Konfi", desc: "Saatlerce pişmiş gibi yumuşacık, kemiğinden ayrılan etler. Evde restoran deneyimi.", time: "45" },
          { dish: "Osso Buco", desc: "İtalyan mutfağının incisi. İlikli lezzet, özel sosuyla sofranızda.", time: "40" },
          { dish: "Bütün Ördek Tandır", desc: "Dışı nar gibi kızarmış, içi sulu. Özel davetlerin yıldızı.", time: "50" }
        ]
      };
      
      const pool = db[scenario];
      return pool[Math.floor(Math.random() * pool.length)];
    };

    const App = () => {
      const [introFinished, setIntroFinished] = useState(false);
      const [scenario, setScenario] = useState(null); 
      const [phase, setPhase] = useState('intro'); 
      const [loading, setLoading] = useState(false);
      const [result, setResult] = useState(null);

      const handleSolve = async (selectedId) => {
        setScenario(selectedId);
        setLoading(true);

        const delay = Math.floor(Math.random() * 800) + 1500;

        try {
           const apiKey = window.process?.env?.API_KEY;
           if (apiKey) {
              const { GoogleGenAI } = await import('https://esm.sh/@google/genai@0.1.1');
              const ai = new GoogleGenAI({ apiKey });
              
              const prompts = {
                panic: "Durum: Acil yemek. Hızlı, pratik ve lezzetli Türk yemeği.",
                tired: "Durum: Yorgun kullanıcı. Sıfır efor, sağlıklı, tek kap yemek.",
                gourmet: "Durum: Şef modu. Havalı, teknik gerektiren ama Clipso ile kolaylaşan yemek."
              };

              const prompt = `${prompts[selectedId]} JSON formatında: { "dish": "Yemek Adı (Max 3 kelime)", "desc": "Çözüm odaklı kısa açıklama (Max 12 kelime)", "time": "Sayı" }. Farklı ve yaratıcı ol.`;
              
              const response = await ai.models.generateContent({
                 model: 'gemini-3-flash-preview',
                 contents: prompt,
                 config: { responseMimeType: "application/json" }
               });
               setResult(JSON.parse(response.text));
           } else {
             await new Promise(r => setTimeout(r, delay));
             setResult(getRandomRecipe(selectedId));
           }
           setPhase('result');
        } catch (e) {
           await new Promise(r => setTimeout(r, delay));
           setResult(getRandomRecipe(selectedId));
           setPhase('result');
        } finally {
           setLoading(false);
        }
      };

      const reset = () => {
        setPhase('intro');
        setScenario(null);
        setResult(null);
      };

      return (
        <div className="w-full h-full flex items-center pl-8 relative z-10 overflow-hidden">
          
          {!introFinished && <IntroSequence onComplete={() => setIntroFinished(true)} />}

          <Header />
          
          {/* ATMOSPHERE LAYERS */}
          <div className="fog-container">
            <div className="fog-img"></div>
          </div>
          
          {/* Subtle noise overlay */}
          <div className="absolute inset-0 opacity-[0.03] pointer-events-none" style={{backgroundImage: `url("data:image/svg+xml,%3Csvg viewBox='0 0 200 200' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='noiseFilter'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.65' numOctaves='3' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23noiseFilter)'/%3E%3C/svg%3E")`}}></div>

          {/* --- LEFT PANEL --- */}
          <div className={`w-[60%] flex flex-col justify-center h-full pt-2 relative z-20 transition-opacity duration-1000 ${introFinished ? 'opacity-100' : 'opacity-0'}`}>
            
            {phase === 'intro' && !loading && (
              <div className="animate-slide-in">
                <h1 className="text-2xl font-serif text-white mb-1.5 leading-none drop-shadow-lg">
                  Bu Akşam <br/> <span className="text-[#E30613] italic font-semibold">Durum Ne?</span>
                </h1>
                <p className="text-gray-400 text-[10px] mb-3 max-w-xs leading-tight font-light tracking-wide line-clamp-2">
                  Tefal Clipso Chef mutfağın kontrolünü ele alıyor. Ruh halini seç, çözümü anında bul.
                </p>

                <div className="w-[280px] flex flex-col">
                  <ScenarioCard 
                    id="panic"
                    title="Misafirler Kapıda!"
                    desc="Acil, hızlı ve hatasız sunum."
                    icon={<ClockIcon />}
                    active={scenario === 'panic'}
                    onClick={handleSolve}
                  />
                  <ScenarioCard 
                    id="tired"
                    title="Pilim Bitti..."
                    desc="Yorgunum, uğraştırma beni."
                    icon={<BatteryIcon />}
                    active={scenario === 'tired'}
                    onClick={handleSolve}
                  />
                  <ScenarioCard 
                    id="gourmet"
                    title="Şef Gibi Hisset"
                    desc="İlham arıyorum, özel olsun."
                    icon={<SparkleIcon />}
                    active={scenario === 'gourmet'}
                    onClick={handleSolve}
                  />
                </div>
              </div>
            )}

            {loading && (
              <div className="animate-slide-in">
                 <h2 className="text-xl font-serif italic text-white mb-4">Çözüm Yükleniyor...</h2>
                 <div className="flex flex-col gap-3">
                    <div className="flex items-center gap-3">
                      <div className="h-[2px] w-8 bg-red-600 animate-pulse"></div>
                      <span className="text-xs text-gray-300 font-light tracking-widest uppercase">Basınç Optimum</span>
                    </div>
                    <div className="flex items-center gap-3">
                      <div className="h-[2px] w-12 bg-red-600/60 animate-pulse" style={{animationDelay: '0.2s'}}></div>
                      <span className="text-xs text-gray-400 font-light tracking-widest uppercase">Akıllı Zamanlayıcı</span>
                    </div>
                    <div className="flex items-center gap-3">
                      <div className="h-[2px] w-5 bg-red-600/30 animate-pulse" style={{animationDelay: '0.4s'}}></div>
                      <span className="text-xs text-gray-500 font-light tracking-widest uppercase">Lezzet Mühürleniyor</span>
                    </div>
                 </div>
              </div>
            )}

            {phase === 'result' && result && (
               <div className="animate-slide-in glass-card p-4 border-l-4 border-red-600 max-w-[340px] relative overflow-hidden h-[180px] flex flex-col justify-between">
                  <div>
                    <div className="text-[9px] uppercase font-bold text-red-500 mb-1 tracking-[0.2em] flex items-center gap-2">
                        <span className="w-1.5 h-1.5 rounded-full bg-red-500 animate-pulse"></span>
                        Kriz Çözüldü
                    </div>
                    
                    <h1 className="text-xl font-serif text-white mb-1 leading-none drop-shadow-md line-clamp-1">{result.dish}</h1>
                    <p className="text-[10px] text-gray-300 mb-2 leading-tight font-light line-clamp-2">{result.desc}</p>
                    
                    <div className="flex items-center gap-3 mb-2 p-1.5 bg-black/20 rounded-lg border border-white/5 w-fit">
                        <div className="flex items-center gap-1.5">
                            <ClockIcon />
                            <span className="font-bold text-base text-white tracking-tighter">{result.time}<span className="text-[9px] align-top ml-0.5">dk</span></span>
                        </div>
                        <div className="h-4 w-[1px] bg-white/10"></div>
                        <span className="text-[9px] text-gray-400 leading-none">Hızlı &<br/>Lezzetli</span>
                    </div>
                  </div>

                  <div className="flex gap-2 mt-auto">
                     <a href="https://www.tefal.com.tr/tava-ve-tencereler/clipso-serileri/" target="_blank" className="flex-1 bg-[#E30613] text-white py-1.5 rounded text-[10px] font-bold hover:bg-red-700 transition-all shadow-[0_4px_15px_rgba(227,6,19,0.4)] text-center tracking-wide uppercase">
                        Ürünü İncele
                     </a>
                     <button onClick={reset} className="px-3 py-1.5 rounded border border-white/10 text-gray-400 hover:text-white hover:border-white/30 hover:bg-white/5 transition-all text-[10px] font-bold">
                        ↻
                     </button>
                  </div>
               </div>
            )}

          </div>

          {/* --- RIGHT HERO --- */}
          <div className={`absolute right-[-20px] top-[-65px] w-[500px] h-[350px] pointer-events-none flex items-center justify-center z-10 transition-opacity duration-1000 ${introFinished ? 'opacity-100' : 'opacity-0'}`}>
             <ProductHero loading={loading} phase={phase} />
          </div>

        </div>
      );
    };

    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<App />);
  </script>
</body>
</html>
