<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="ad.size" content="width=970,height=250">
    <title>Tefal Ice Force - PNG Knife</title>
    
    <!-- Gerekli Kütüphaneler -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;700;900&display=swap" rel="stylesheet">

    <script type="text/javascript">
        var clickTag = "https://www.tefal.com.tr/mutfak-aksesuarlari-1";
    </script>

    <style>
        body, html { margin: 0; padding: 0; width: 100%; height: 100%; overflow: hidden; font-family: 'Inter', sans-serif; background-color: #f0f0f0; display: flex; align-items: center; justify-content: center; }
        @keyframes bounce-custom { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-12px); } }
        .animate-bounce-custom { animation: bounce-custom 2s ease-in-out infinite; }
        
        /* Particle Glow */
        .spark-glow {
            box-shadow: 0 0 10px 2px rgba(225, 27, 34, 0.8);
        }
    </style>
</head>
<body>
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useRef, useEffect } = React;

        const TEFAL_RED = '#E11B22';
        const LOGO_URL = 'https://upload.wikimedia.org/wikipedia/commons/thumb/2/2f/Tefal_logo.svg/2560px-Tefal_logo.svg.png';
        // BIÇAK GÖRSELİ (PNG) - Klasöre knife.png atılmalı
        const KNIFE_PNG = 'knife.png';

        const Masthead = () => {
            const [cutProgress, setCutProgress] = useState(0); 
            const [isCompleted, setIsCompleted] = useState(false);
            const [isDragging, setIsDragging] = useState(false);
            const [mousePos, setMousePos] = useState({ x: 485, y: 125 }); 
            const [particles, setParticles] = useState([]);
            
            const containerRef = useRef(null);
            const requestRef = useRef();

            const handleExitClick = (e) => {
                e.stopPropagation();
                window.open(window.clickTag || 'https://www.tefal.com.tr', '_blank');
            };

            const resetInteraction = (e) => {
                e.stopPropagation();
                setIsCompleted(false);
                setCutProgress(0);
                setParticles([]);
            };

            // Parçacık Döngüsü
            const animateParticles = () => {
                setParticles(prevParticles => {
                    return prevParticles
                        .map(p => ({
                            ...p,
                            x: p.x + p.vx,
                            y: p.y + p.vy,
                            life: p.life - 0.05,
                            vy: p.vy + 0.2
                        }))
                        .filter(p => p.life > 0);
                });
                requestRef.current = requestAnimationFrame(animateParticles);
            };

            useEffect(() => {
                requestRef.current = requestAnimationFrame(animateParticles);
                return () => cancelAnimationFrame(requestRef.current);
            }, []);

            const handleUpdate = (clientX, clientY) => {
                if (!containerRef.current || isCompleted) return;
                const rect = containerRef.current.getBoundingClientRect();
                const x = ((clientX - rect.left) / rect.width) * 100;
                
                // Parçacık Üretimi
                if (isDragging) {
                    const newParticles = Array.from({ length: 4 }).map(() => ({
                        id: Math.random(),
                        x: clientX - rect.left,
                        y: clientY - rect.top,
                        vx: (Math.random() - 0.5) * 8,
                        vy: (Math.random() - 0.5) * 8,
                        life: 1.0,
                        color: Math.random() > 0.5 ? '#fff' : TEFAL_RED,
                        size: Math.random() * 3 + 1
                    }));
                    setParticles(prev => [...prev, ...newParticles]);
                }

                if (x > cutProgress) {
                    const step = Math.min(x * 1.5, 100); 
                    if (step >= 98) {
                        setCutProgress(100);
                        setTimeout(() => setIsCompleted(true), 300); 
                    } else {
                        setCutProgress(step);
                    }
                }
            };

            const onMouseMove = (e) => {
                const rect = containerRef.current?.getBoundingClientRect();
                if (rect) {
                    setMousePos({ x: e.clientX - rect.left, y: e.clientY - rect.top });
                }
                if (isDragging) handleUpdate(e.clientX, e.clientY);
            };

            return (
                <div 
                    ref={containerRef}
                    onMouseMove={onMouseMove}
                    onMouseDown={() => setIsDragging(true)}
                    onMouseUp={() => setIsDragging(false)}
                    onMouseLeave={() => setIsDragging(false)}
                    className="relative w-[970px] h-[250px] bg-[#000] overflow-hidden select-none cursor-none border border-white/5 shadow-2xl"
                >
                    {/* --- FINAL EKRAN --- */}
                    <div className={`absolute inset-0 flex items-center px-12 transition-all duration-1000 ${isCompleted ? 'opacity-100 scale-100' : 'opacity-0 scale-110 pointer-events-none'}`}>
                        <div className="absolute inset-0 bg-gradient-to-br from-[#111] via-[#050505] to-[#300a0a] opacity-95" />
                        
                        <button 
                            onClick={resetInteraction}
                            className="absolute top-4 right-4 z-50 w-8 h-8 rounded-full bg-white/5 hover:bg-white/10 flex items-center justify-center text-white/40 hover:text-red-500 transition-all cursor-pointer border border-white/10"
                        >
                            <i className="fas fa-home text-[12px]"></i>
                        </button>

                        <div className="relative z-10 w-[460px]">
                            <img src={LOGO_URL} alt="Tefal" className="h-5 mb-5 object-contain" />
                            <div className="inline-block px-2 py-0.5 bg-red-600/10 border border-red-600/30 rounded-sm mb-3">
                                <span className="text-red-500 text-[8px] font-black tracking-[0.3em] uppercase italic">ICE FORCE TECHNOLOGY</span>
                            </div>
                            <h2 className="text-white text-[44px] font-black leading-[0.85] tracking-tighter mb-6">
                                MÜKEMMEL<br/><span className="text-red-600">KESKİNLİK.</span>
                            </h2>
                            <div className="flex items-center gap-6 mt-2">
                                <button 
                                    onClick={handleExitClick}
                                    className="px-10 py-3 bg-red-600 text-white font-black text-[11px] tracking-[0.2em] uppercase rounded-sm hover:bg-red-700 transition-all shadow-2xl active:scale-95 cursor-pointer"
                                >
                                    ŞİMDİ İNCELE
                                </button>
                                <div className="flex flex-col border-l border-white/20 pl-5">
                                    <span className="text-white font-bold text-lg leading-none">10 YIL</span>
                                    <span className="text-slate-500 text-[8px] font-bold uppercase tracking-widest">GARANTİ</span>
                                </div>
                            </div>
                        </div>
                        
                        {/* Final PNG Bıçak */}
                        <div className="relative z-10 flex-1 flex justify-end items-center pr-4">
                            <img 
                                src={KNIFE_PNG} 
                                alt="Tefal Knife"
                                className="w-[500px] drop-shadow-[0_25px_60px_rgba(225,27,34,0.4)] rotate-[-4deg] object-contain"
                                onError={(e) => e.target.style.display = 'none'} // Resim yoksa gizle
                            />
                        </div>
                    </div>

                    {/* --- İNTERAKTİF KATMAN --- */}
                    {!isCompleted && (
                        <div className="absolute inset-0 z-30 pointer-events-none">
                            {/* Üst Parça */}
                            <div 
                                className="absolute top-0 left-0 w-full h-[50.2%] bg-[#0f0f0f] border-b border-white/5 flex items-end justify-center transition-transform duration-300 ease-out"
                                style={{ transform: `translateY(${-cutProgress / 1.5}%)` }}
                            >
                                <div className="mb-4 text-white/5 font-black text-[70px] tracking-tighter">TEFAL</div>
                            </div>

                            {/* Alt Parça */}
                            <div 
                                className="absolute bottom-0 left-0 w-full h-[50.2%] bg-[#0f0f0f] border-t border-white/5 flex items-start justify-center transition-transform duration-300 ease-out"
                                style={{ transform: `translateY(${cutProgress / 1.5}%)` }}
                            >
                                <div className="mt-4 text-red-600/5 font-black text-[70px] tracking-widest uppercase italic">ICE FORCE</div>
                            </div>

                            {/* Lazer Çizgisi */}
                            <div 
                                className="absolute top-1/2 left-0 w-full h-[1px] bg-red-600/40 -translate-y-1/2"
                                style={{ opacity: 1 - cutProgress / 100 }}
                            >
                                <div className="absolute inset-0 bg-red-600 shadow-[0_0_20px_#E11B22]" />
                            </div>

                            {/* HUD */}
                            <div className="absolute bottom-8 left-1/2 -translate-x-1/2 w-64 flex flex-col items-center">
                                <div className="flex justify-between w-full mb-1.5 px-1">
                                    <span className="text-[9px] font-black text-white/20 tracking-[0.3em] uppercase">MÜKEMMEL KESİM</span>
                                    <span className="text-[10px] font-black text-red-600 tracking-[0.1em] italic">%{Math.round(cutProgress)}</span>
                                </div>
                                <div className="w-full h-[2px] bg-white/5 rounded-full overflow-hidden">
                                    <div 
                                        className="h-full bg-red-600 transition-all duration-300 shadow-[0_0_10px_#E11B22]"
                                        style={{ width: `${cutProgress}%` }}
                                    />
                                </div>
                            </div>

                            {/* İpucu */}
                            <div 
                                className="absolute inset-0 flex flex-col items-center justify-center transition-opacity duration-300"
                                style={{ opacity: isDragging ? 0 : 1 }}
                            >
                                <div className="flex flex-col items-center">
                                    <div className="w-14 h-14 rounded-full border border-red-600/40 flex items-center justify-center bg-black/80 backdrop-blur-md animate-bounce-custom">
                                        <i className="fas fa-hand-pointer text-red-600 text-xl"></i>
                                    </div>
                                    <p className="text-white/40 font-bold text-[9px] tracking-[0.6em] uppercase mt-8">SAĞA KAYDIRIN</p>
                                </div>
                            </div>
                        </div>
                    )}

                    {/* --- PARÇACIKLAR (SPARKS) --- */}
                    {particles.map(p => (
                        <div
                            key={p.id}
                            className="absolute rounded-full spark-glow pointer-events-none"
                            style={{
                                left: p.x,
                                top: p.y,
                                width: p.size,
                                height: p.size,
                                backgroundColor: p.color,
                                opacity: p.life,
                                transform: `scale(${p.life})`
                            }}
                        />
                    ))}

                    {/* --- BIÇAK İMLECİ (PNG) --- */}
                    <div 
                        className={`absolute z-40 pointer-events-none transition-opacity duration-300 ${isCompleted ? 'opacity-0' : 'opacity-100'}`}
                        style={{ 
                            left: mousePos.x, 
                            top: mousePos.y,
                            transform: `translate(-15%, -50%) rotate(${isDragging ? '-15deg' : '0deg'})`,
                            transition: 'transform 0.05s linear'
                        }}
                    >
                        {/* Burada PNG Bıçak Kullanılıyor */}
                        <img 
                            src={KNIFE_PNG} 
                            alt="Knife"
                            className="w-[320px] drop-shadow-[0_20px_40px_rgba(0,0,0,0.9)] object-contain"
                            onError={(e) => {
                                // Eğer resim yüklenemezse fallback olarak basit bir div gösterelim ki bıçak kaybolmasın
                                e.target.style.display = 'none';
                            }}
                        />
                        
                        {/* Glow Efekti */}
                        {isDragging && (
                            <div className="absolute left-1/4 top-1/2 w-48 h-48 -translate-y-1/2 bg-red-600/20 blur-[60px] rounded-full pointer-events-none animate-pulse" />
                        )}
                    </div>
                </div>
            );
        };

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<Masthead />);
    </script>
</body>
</html>
