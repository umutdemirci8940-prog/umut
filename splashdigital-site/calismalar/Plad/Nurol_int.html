<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Urla 77 - İnteraktif Masthead</title>
    <!-- Tailwind CSS v3 CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Google Fonts: Inter & Playfair Display -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Playfair+Display:ital,wght=0,500;0,600;0,700;1,400&display=swap" rel="stylesheet">
    
    <!-- Custom Tailwind Configuration -->
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        'urla-green': '#4E6A33',
                        'urla-green-light': '#628543',
                        'urla-sand': '#F8FAE8',
                        'urla-beige': '#D1C7BD',
                        'urla-dark': '#1C1A17',
                    },
                    fontFamily: {
                        serif: ['Playfair Display', 'serif'],
                        sans: ['Inter', 'sans-serif'],
                    }
                }
            }
        }
    </script>

    <style>
        /* Pulse Animation for Hotspots */
        @keyframes custom-ping {
            0% {
                transform: scale(1);
                opacity: 0.8;
            }
            100% {
                transform: scale(2.4);
                opacity: 0;
            }
        }
        .animate-custom-ping {
            animation: custom-ping 2s cubic-bezier(0, 0, 0.2, 1) infinite;
        }

        /* Glassmorphism background for Hotspot popups */
        .glass-panel {
            background: rgba(0, 0, 0, 0.75);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.15);
        }
    </style>
</head>
<body class="bg-gray-100 p-4 min-h-screen flex items-center justify-center font-sans">
    <div id="root"></div>

    <!-- MAIN BANNER CONTAINER (970px x 250px) -->
    <div id="urla-banner-root" class="w-[970px] h-[250px] bg-urla-sand shadow-2xl overflow-hidden border border-black/10 flex flex-row relative select-none">
        
        <!-- LEFT SECTION: Dual Media Area (Image Column + Video Column) -> Total 710px -->
        <div class="relative w-[710px] h-full max-h-full overflow-hidden shrink-0 flex flex-row">
            
            <!-- LEFT 266px: Single Brand Image -->
            <div class="relative w-[266px] h-full overflow-hidden bg-[#F8FAE8] flex items-center justify-center border-r border-black/10 shrink-0">
                <img id="off-image"
                     src="off.png" 
                     onerror="this.onerror=null; this.src='https://images.unsplash.com/photo-1600585154340-be6161a56a0c?auto=format&fit=crop&w=600&q=80'"
                     alt="Urla 77 Görsel" 
                     class="w-full h-full object-cover select-none pointer-events-none"
                     referrerPolicy="no-referrer">
                <!-- Soft elegant overlay -->
                <div class="absolute inset-0 bg-gradient-to-t from-black/20 to-transparent pointer-events-none"></div>
            </div>

            <!-- RIGHT 444px: Video Block (Perfect 16:9 Ratio: 444px width x 250px height) -->
            <div class="relative w-[444px] h-full overflow-hidden bg-black shrink-0">
                <video id="urla-video" src="urla.mp4" 
                       class="w-full h-full object-cover absolute inset-0 block pointer-events-none" 
                       loop playsinline autoplay muted></video>
                
                <!-- Floating Mute/Unmute Overlay Button on Video -->
                <button id="sound-btn" onclick="toggleMute()" class="absolute top-3 right-3 p-1.5 rounded-full bg-black/60 backdrop-blur-md border border-white/15 text-white hover:bg-black/80 cursor-pointer flex items-center justify-center transition-all z-20" title="Ses Aç / Kapat">
                    <svg id="icon-mute" class="w-4 h-4 text-white/70" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
                        <polygon points="11 5 6 9 2 9 2 15 6 15 11 19 11 5"></polygon>
                        <line x1="23" y1="9" x2="17" y2="15"></line>
                        <line x1="17" y1="9" x2="23" y2="15"></line>
                    </svg>
                    <svg id="icon-unmute" class="w-4 h-4 text-emerald-400 animate-pulse hidden" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
                        <polygon points="11 5 6 9 2 9 2 15 6 15 11 19 11 5"></polygon>
                        <path d="M19.07 4.93a10 10 0 0 1 0 14.14M15.54 8.46a5 5 0 0 1 0 7.07"></path>
                    </svg>
                </button>
            </div>

        </div>

        <!-- RIGHT SECTION: ELEGANT BRAND LOGO & CTA PANEL (260px) -->
        <div class="w-[260px] h-full flex flex-col shrink-0 justify-between border-l border-white/10 bg-urla-sand z-10">
            <!-- Top Half: Brand Logo Image with Fallback -->
            <div class="flex-1 flex flex-col items-center justify-center p-4 text-center border-b border-urla-beige/40">
                <img id="main-logo-img"
                     src="urla77.png" 
                     onerror="this.style.display='none'; document.getElementById('main-logo-svg').style.display='flex';"
                     alt="Urla 77" 
                     class="max-h-[110px] w-auto object-contain transition-transform duration-500 hover:scale-105"
                     referrerPolicy="no-referrer">
                <!-- SVG Vector Fallback for Main Logo -->
                <div id="main-logo-svg" class="hidden flex-col items-center justify-center text-center p-2">
                    <span class="font-serif text-3xl font-bold text-urla-green tracking-tight leading-none">URLA 77</span>
                    <span class="font-sans text-[9px] font-semibold text-urla-green/80 uppercase tracking-[0.25em] mt-1.5">Müstakil Yaşam Projesi</span>
                </div>
            </div>

            <!-- Bottom Half: Interactive CTA Box -->
            <div class="bg-urla-green text-white px-3 py-4 flex flex-col gap-2 shrink-0 select-none">
                <!-- Interactive Link Button with Hover Action -->
                <a href="https://www.urla77.com/?utm_source=Splash&utm_medium=%C4%B0nteraktif+Masthead+&utm_campaign=Urla77_Lansman&utm_id=Urla77" 
                   target="_blank" 
                   rel="noopener noreferrer"
                   onmouseenter="document.getElementById('btn-glow').classList.remove('opacity-0')"
                   onmouseleave="document.getElementById('btn-glow').classList.add('opacity-0')"
                   class="w-full bg-white hover:bg-urla-sand text-urla-green font-bold text-xs py-2 rounded shadow-sm active:scale-98 transition-all flex items-center justify-center gap-1.5 cursor-pointer text-center relative">
                    
                    <svg class="w-3.5 h-3.5 text-urla-green" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
                        <circle cx="12" cy="12" r="10"></circle>
                        <line x1="12" y1="16" x2="12" y2="12"></line>
                        <line x1="12" y1="8" x2="12.01" y2="8"></line>
                    </svg>
                    <span>Detaylı Bilgi İçin Tıklayın</span>
                    
                    <!-- Dynamic Glow element -->
                    <span id="btn-glow" class="w-1.5 h-1.5 rounded-full bg-urla-green-light ml-1.5 animate-ping opacity-0 transition-opacity duration-200"></span>
                </a>

                <!-- Contact Details & Developer Logos Footer -->
                <div class="flex justify-between items-center border-t border-white/20 pt-2 flex-nowrap gap-1">
                    <!-- Phone CTA -->
                    <a href="tel:4446496" class="flex items-center gap-1 hover:text-amber-200 transition-colors shrink-0 whitespace-nowrap" title="Hemen Arayın">
                        <div class="w-5 h-5 rounded-full bg-white/10 flex items-center justify-center shrink-0">
                            <svg class="w-2.5 h-2.5 text-white" fill="none" stroke="currentColor" stroke-width="2.5" viewBox="0 0 24 24">
                                <path d="M22 16.92v3a2 2 0 0 1-2.18 2 19.79 19.79 0 0 1-8.63-3.07 19.5 19.5 0 0 1-6-6 19.79 19.79 0 0 1-3.07-8.67A2 2 0 0 1 4.11 2h3a2 2 0 0 1 2 1.72 12.84 12.84 0 0 0 .7 2.81 2 2 0 0 1-.45 2.11L8.09 9.91a16 16 0 0 0 6 6l1.27-1.27a2 2 0 0 1 2.11-.45 12.84 12.84 0 0 0 2.81.7A2 2 0 0 1 22 16.92z"></path>
                            </svg>
                        </div>
                        <span class="text-xs font-bold font-mono tracking-wider whitespace-nowrap">444 6 496</span>
                    </a>

                    <!-- Developer Branding - Nurol GYO & Prokar Combined Lockup Logo -->
                    <div class="flex items-center shrink-0">
                        <img id="lockup-logo-img"
                             src="https://www.urla77.com/assets/img/nurol-prokar-lockup-white.webp?v=20260629-1348" 
                             onerror="this.style.display='none'; document.getElementById('lockup-logo-fallback').style.display='flex';"
                             alt="Nurol GYO & Prokar" 
                             class="h-[16px] max-w-[130px] object-contain opacity-95 hover:opacity-100 transition-opacity"
                             referrerPolicy="no-referrer">
                        <div id="lockup-logo-fallback" class="hidden items-center gap-1.5">
                            <span class="text-[10px] font-bold text-white tracking-wider">NUROL GYO</span>
                            <span class="w-px h-3 bg-white/30"></span>
                            <span class="text-[10px] font-extrabold text-white tracking-wider">PROKAR</span>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    

    <!-- MAIN INTERACTIVE JAVASCRIPT LOGIC -->
    <script>
        let isMuted = true;

        window.addEventListener('DOMContentLoaded', () => {
            const videoElement = document.getElementById('urla-video');
            if (videoElement) {
                videoElement.muted = isMuted;
                videoElement.play().catch(e => console.log("Autoplay prevented", e));
            }
        });

        // Audio System Controller for the Main Video
        function toggleMute() {
            isMuted = !isMuted;
            const iconMute = document.getElementById('icon-mute');
            const iconUnmute = document.getElementById('icon-unmute');
            const videoElement = document.getElementById('urla-video');

            if (isMuted) {
                if (iconMute) iconMute.classList.remove('hidden');
                if (iconUnmute) iconUnmute.classList.add('hidden');
                if (videoElement) videoElement.muted = true;
            } else {
                if (iconMute) iconMute.classList.add('hidden');
                if (iconUnmute) iconUnmute.classList.remove('hidden');
                if (videoElement) videoElement.muted = false;
            }
        }
    </script>
</body>
</html>
