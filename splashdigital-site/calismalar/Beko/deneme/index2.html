<style>
html,body{margin:0;padding:0;width:970px;height:250px;overflow:hidden;background:#fff}
*{box-sizing:border-box}
[hidden]{display:none!important}
.mh{position:relative;width:970px;height:250px;overflow:hidden;font-family:"Encode Sans","Segoe UI",Helvetica,Arial,sans-serif;color:#fff;user-select:none;-webkit-user-select:none;line-height:1.3}
.mh .legal{position:absolute;left:24px;bottom:5px;font-size:8px;line-height:1;opacity:.72;margin:0;letter-spacing:.01em}
.mh .logo{position:absolute;left:22px;top:16px;width:64px;height:36px;color:#fff}
.mh .logo img{width:100%;height:auto;display:block}
.mh .cta{position:absolute;white-space:nowrap;display:inline-flex;align-items:center;justify-content:center;gap:6px;height:40px;padding:0 18px;border-radius:999px;background:#fff;color:#E2520A;font-weight:700;font-size:14px;text-decoration:none;letter-spacing:.01em;box-shadow:0 6px 18px rgba(0,0,0,.18);transition:transform .15s;cursor:pointer}
.mh .cta:hover{transform:translateY(-1px)}
.mh .cta.pulse{animation:pulse 1.4s ease-in-out infinite}
@keyframes pulse{0%,100%{box-shadow:0 6px 18px rgba(0,0,0,.18)}50%{box-shadow:0 6px 18px rgba(0,0,0,.18),0 0 0 8px rgba(255,255,255,.25)}}
.mh .machine{position:absolute;pointer-events:none;filter:drop-shadow(0 14px 18px rgba(0,0,0,.28))}
.mh .replay{position:absolute;right:12px;top:12px;width:28px;height:28px;border-radius:50%;border:0;background:rgba(0,0,0,.3);color:#fff;font:700 16px/1 "Encode Sans",Arial,sans-serif;cursor:pointer;opacity:0;pointer-events:none;transition:opacity .3s;padding:0;z-index:9}
.mh[data-state="payoff"] .replay{opacity:1;pointer-events:auto}
.mh .replay:hover{background:rgba(0,0,0,.5)}
.fly{position:absolute;width:44px;height:44px;pointer-events:none;z-index:5}
.spark{position:absolute;width:18px;height:18px;pointer-events:none;z-index:6;color:#fff}
@keyframes spin{to{transform:rotate(360deg)}}
.mh button:focus-visible,.mh a:focus-visible,.mh [tabindex]:focus-visible{outline:2px solid #fff;outline-offset:2px}
@media (prefers-reduced-motion: reduce){.mh *{animation-duration:.01ms!important;animation-iteration-count:1!important;transition-duration:.01ms!important}}

.mhB{background:linear-gradient(180deg,#FF7A2A 0%,#FF6B1A 60%,#F25A0C 100%)}
.mhB .rope{position:absolute;left:0;top:0;width:640px;height:80px;pointer-events:none}
.mhB .garment{position:absolute;top:44px;width:92px;height:104px;cursor:crosshair;overflow:visible;filter:drop-shadow(0 8px 10px rgba(0,0,0,.22));transform-origin:50% 0}
.mhB[data-state="teaser"] .garment{animation:sway 3.6s ease-in-out infinite}
.mhB .garment:nth-child(2){animation-delay:-.9s}.mhB .garment:nth-child(3){animation-delay:-1.8s}.mhB .garment:nth-child(4){animation-delay:-2.7s}.mhB .garment:nth-child(5){animation-delay:-1.2s}
@keyframes sway{50%{transform:rotate(1.6deg)}}
.mhB .garment.hit{animation:hit .5s ease-out}
@keyframes hit{30%{transform:rotate(-5deg) scale(1.04)}70%{transform:rotate(3deg)}}
.mhB .g-body{fill:#fff}
.mhB .g-edge{fill:none;stroke:#E8E8EE;stroke-width:1.5}
.mhB .pin{fill:#1B1F2A}
.mhB .colL{position:absolute;left:24px;top:164px;width:560px}
.mhB .hl{font-family:"Encode Sans Condensed","Encode Sans","Arial Narrow",Arial,sans-serif;font-weight:900;font-size:36px;line-height:.92;letter-spacing:-.01em;margin:0 0 6px;white-space:nowrap}
.mhB .sub{font-size:12.5px;font-weight:600;opacity:.95;margin:0}
.mhB .mid{position:absolute;left:606px;top:56px;width:190px;display:grid;gap:10px;justify-items:start}
.mhB .counter{font-family:"IBM Plex Mono",Menlo,Consolas,monospace;font-size:12px;font-weight:600;letter-spacing:.08em;text-transform:uppercase;background:rgba(0,0,0,.22);padding:6px 10px;border-radius:999px}
.mhB .counter b{font-size:16px;margin-right:4px}
.mhB .washbtn{font:700 14px "Encode Sans",Arial,sans-serif;height:44px;padding:0 16px;border-radius:999px;border:2px solid rgba(255,255,255,.55);background:transparent;color:#fff;cursor:pointer;transition:all .2s}
.mhB .washbtn:disabled{opacity:.5;cursor:default}
.mhB .washbtn.ready{background:#fff;color:#E2520A;border-color:#fff;animation:pulse 1.4s ease-in-out infinite}
.mhB .timer{font-family:"IBM Plex Mono",Menlo,Consolas,monospace;font-weight:600;font-size:44px;line-height:1;letter-spacing:-.02em;font-variant-numeric:tabular-nums}
.mhB .timer small{display:block;font-size:11px;letter-spacing:.12em;text-transform:uppercase;margin-top:6px;opacity:.9}

<script>
var clickTag = "https://www.beko.com.tr/10-kg-camasir-makinesi/cm-10122-camasir-makinesi";
(function(){
  window.$=function(id){return document.getElementById(id);};
  window.NS='http://www.w3.org/2000/svg';
  window.RM=matchMedia('(prefers-reduced-motion: reduce)').matches;
  window.D=function(ms){return RM?Math.min(ms,120):ms;};
  window.fmt=function(sec){var m=Math.floor(sec/60),s=Math.floor(sec%60);return m+':'+String(s).padStart(2,'0');};
  window.countdown=function(el,ms,done){var t0=null;function f(t){if(t0===null)t0=t;var p=Math.max(0,Math.min(1,(t-t0)/ms));el.firstChild.nodeValue=fmt(2400*(1-p));if(p<1)requestAnimationFrame(f);else done&&done();}el.firstChild.nodeValue='40:00';requestAnimationFrame(f);};
  window.readyAt=function(){var d=new Date(Date.now()+40*60000);return String(d.getHours()).padStart(2,'0')+':'+String(d.getMinutes()).padStart(2,'0');};
  window.sparkles=function(mh,cx,cy,n){if(RM)return;for(var i=0;i<n;i++){var s=document.createElementNS(NS,'svg');s.setAttribute('viewBox','-10 -10 20 20');s.classList.add('spark');var p=document.createElementNS(NS,'path');p.setAttribute('d','M0-8L2-2 8 0 2 2 0 8-2 2-8 0-2-2Z');p.setAttribute('fill','currentColor');s.appendChild(p);var a=Math.random()*Math.PI*2,r=40+Math.random()*90;s.style.left=(cx-9)+'px';s.style.top=(cy-9)+'px';mh.appendChild(s);s.animate([{transform:'translate(0,0) scale(0) rotate(0)',opacity:1},{transform:'translate('+(Math.cos(a)*r)+'px,'+(Math.sin(a)*r)+'px) scale('+(.6+Math.random())+') rotate(180deg)',opacity:0}],{duration:700+Math.random()*500,delay:Math.random()*300,easing:'cubic-bezier(.2,.8,.3,1)'}).onfinish=function(ev){ev.target.effect.target.remove();};}};
  window.localPos=function(mh,el){var m=mh.getBoundingClientRect(),r=el.getBoundingClientRect(),s=m.width/970;return{x:(r.left-m.left)/s,y:(r.top-m.top)/s,w:r.width/s,h:r.height/s};};
  /* clickTag: every CTA opens the ad-server click URL */
  window.wire=function(mh,set){
    mh.querySelectorAll('.cta').forEach(function(a){a.addEventListener('click',function(e){e.preventDefault();window.open(window.clickTag,'_blank');});});
    var rp=mh.querySelector('.replay');if(rp)rp.addEventListener('click',function(){set('teaser');});
    /* QA hook: open index.html#wash or #payoff to jump to a state */
    var h=(location.hash||'').replace('#','');if(h==='wash'||h==='payoff')setTimeout(function(){set(h);},50);
  };
})();

(function(){
  const mh=$('mhB');
  const garms=[...mh.querySelectorAll('.garment')],countEl=$('bCount'),wash=$('bWash'),timer=$('bTimer'),cta=$('bCta'),hl=$('bHl'),sub=$('bSub');
  const colors=['#C8102E','#6B4423','#3E9B3E','#5C3A21','#E4A11B'];
  const BLOB='M0-10C5-13 12-8 11-1 15 4 10 12 3 10-2 15-11 10-10 3-14-2-9-11 0-10Z';
  let count=0;
  function splat(g,x,y){const gr=g.querySelector('.splats');const c=colors[Math.floor(Math.random()*colors.length)],s=.9+Math.random()*1.1,rot=Math.random()*360;const p=document.createElementNS(NS,'path');p.setAttribute('d',BLOB);p.setAttribute('fill',c);p.setAttribute('transform','translate('+x+' '+y+') rotate('+rot+') scale('+s+')');gr.appendChild(p);for(let k=0;k<4;k++){const d=document.createElementNS(NS,'circle');d.setAttribute('cx',x+(Math.random()*36-18));d.setAttribute('cy',y+(Math.random()*36-18));d.setAttribute('r',(1+Math.random()*3).toFixed(1));d.setAttribute('fill',c);gr.appendChild(d);}if(!RM){p.style.transformOrigin='0 0';p.animate([{transform:'translate('+x+'px,'+y+'px) rotate('+rot+'deg) scale(0)'},{transform:'translate('+x+'px,'+y+'px) rotate('+rot+'deg) scale('+s+')'}],{duration:220,easing:'cubic-bezier(.2,1.4,.4,1)'});}}
  function hit(g,e){if(mh.dataset.state!=='teaser')return;let x=50,y=60;if(e&&e.clientX!=null&&!(e.clientX===0&&e.clientY===0)){const pt=g.createSVGPoint();pt.x=e.clientX;pt.y=e.clientY;const p=pt.matrixTransform(g.getScreenCTM().inverse());x=p.x;y=p.y;}else{x=30+Math.random()*40;y=30+Math.random()*60;}splat(g,x,y);count++;countEl.textContent=count;sub.textContent=count>=6?'İşte bu. Şimdi 40 dakikaya bırak.':count>=3?'Hadi, çekinme. Daha da.':'Daha cesur.';g.classList.remove('hit');void g.offsetWidth;g.classList.add('hit');if(count>=3&&wash.disabled){wash.disabled=false;wash.classList.add('ready');}}
  garms.forEach(g=>{g.addEventListener('click',e=>hit(g,e));g.addEventListener('keydown',e=>{if(e.key==='Enter'||e.key===' '){e.preventDefault();hit(g,null);}});});
  wash.addEventListener('click',()=>set('wash'));
  function set(state){
    mh.dataset.state=state;
    if(state==='teaser'){count=0;countEl.textContent='0';garms.forEach(g=>{g.getAnimations().forEach(a=>a.cancel());g.querySelector('.splats').innerHTML='';});wash.hidden=false;wash.disabled=true;wash.classList.remove('ready');timer.hidden=true;cta.hidden=true;hl.textContent='KİRLET BAKALIM.';sub.textContent='Tıkla, lekele. Sonrasını 40 dakikaya bırak.';timer.firstChild.nodeValue='40:00';}
    if(state==='wash'){if(count<3){garms.forEach((g,i)=>{if(i<3)splat(g,30+Math.random()*40,40+Math.random()*40);});count=Math.max(count,3);countEl.textContent=count;}wash.hidden=true;cta.hidden=true;timer.hidden=false;hl.textContent='HEPSİ TAMBURA.';sub.textContent='40°C, 40 dakika, tam yük.';garms.forEach((g,i)=>{const p=localPos(mh,g);const tx=888-(p.x+p.w/2),ty=145-(p.y+p.h/2);g.animate([{transform:'translate(0,0) scale(1) rotate(0)',opacity:1},{transform:'translate('+tx+'px,'+ty+'px) scale(.12) rotate(220deg)',opacity:0}],{duration:D(650),delay:D(i*90),easing:'cubic-bezier(.5,0,.8,.5)',fill:'forwards'});});setTimeout(()=>countdown(timer,D(3200),()=>set('payoff')),D(700));}
    if(state==='payoff'){wash.hidden=true;timer.hidden=true;cta.hidden=false;hl.textContent='NE KADAR KİRLETİRSEN KİRLET.';sub.textContent='40°C · 40 dk · 10 kg · Kanıtlanmış temizlik*';garms.forEach((g,i)=>{g.querySelector('.splats').innerHTML='';g.getAnimations().forEach(a=>a.cancel());g.animate([{transform:'translate(0,-60px) scale(.5)',opacity:0},{transform:'translate(0,0) scale(1)',opacity:1}],{duration:D(520),delay:D(i*80),easing:'cubic-bezier(.2,1.2,.4,1)'});});sparkles(mh,300,100,16);}
  }
  wire(mh,set);
})();
</script>
