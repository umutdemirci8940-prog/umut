<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Beko Banner Preview</title>
    
    <!-- Performance Optimizations -->
    <link rel="preconnect" href="https://esm.sh">
    <link rel="preconnect" href="https://cdn.tailwindcss.com">
    <link rel="preconnect" href="https://www.beko.com.tr">

    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    animation: {
                        'spin-slow': 'spin 3s linear infinite',
                    },
                    keyframes: {
                        shimmer: {
                            '0%': { transform: 'translateX(-100%)' },
                            '100%': { transform: 'translateX(100%)' },
                        }
                    }
                }
            }
        }
    </script>
    
    <!-- Error Handling for Debugging -->
    <script>
        window.process = { env: { NODE_ENV: 'production' } };
        window.onerror = function(message, source, lineno, colno, error) {
            console.error(error);
            const errorDiv = document.createElement('div');
            errorDiv.style.cssText = 'position: fixed; top: 0; left: 0; width: 100%; background: #fee2e2; color: #991b1b; padding: 1rem; z-index: 9999; font-family: monospace; border-bottom: 1px solid #ef4444;';
            errorDiv.innerHTML = '<strong>Error:</strong> ' + message + '<br><small>' + source + ':' + lineno + '</small>';
            document.body.appendChild(errorDiv);
        };
    </script>

    <!-- Import Map for React and Libraries -->
    <script type="importmap">
        {
            "imports": {
                "react": "https://esm.sh/react@18.2.0",
                "react-dom/client": "https://esm.sh/react-dom@18.2.0/client",
                "framer-motion": "https://esm.sh/framer-motion@10.16.4?external=react,react-dom",
                "lucide-react": "https://esm.sh/lucide-react@0.292.0?external=react,react-dom"
            }
        }
    </script>

    <!-- Babel for JSX -->
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
</head>
<body class="bg-slate-200 min-h-screen flex items-center justify-center p-4">
    <div id="root" class="text-slate-500 font-sans">
        <div class="fixed inset-0 flex items-center justify-center bg-slate-200 z-50">
            <div class="flex flex-col items-center gap-4">
                <div class="animate-spin rounded-full h-8 w-8 border-b-2 border-slate-600"></div>
                <div class="text-sm font-medium text-slate-600">Yükleniyor...</div>
            </div>
        </div>
    </div>

    <script type="text/babel" data-type="module">
        import React, { useState, useEffect } from 'react';
        import { createRoot } from 'react-dom/client';
        import { motion, AnimatePresence } from 'framer-motion';
        import { ArrowRight, Check, ChevronRight, Snowflake, Thermometer } from 'lucide-react';
        
        // Ensure React is available globally
        window.React = React;

        function Banner() {
            const [step, setStep] = useState('intro');
            const [isHoveringFridge, setIsHoveringFridge] = useState(false);
            const [showShockwave, setShowShockwave] = useState(false);

            // Realistic assets - Transparent PNGs
            const ASSETS = {
                logo: "https://upload.wikimedia.org/wikipedia/commons/3/3a/Beko_2014_logo.png",
                // User provided specific Beko fridge image - Higher resolution to prevent pixelation
                fridge: "https://www.beko.com.tr/media/resize/7281520232_LO1_20230705_171102.png/1000Wx1000H/image.webp",
                // User provided stew pot image
                pot: "https://png.pngtree.com/png-clipart/20250205/original/pngtree-stew-in-cooking-pot-png-image_20309521.png"
            };

            const handleDragEnd = (event, info) => {
                // Check if dragged far enough to the right (e.g., > 150px)
                if (info.offset.x > 150) { 
                    triggerSuccess();
                } else {
                    setIsHoveringFridge(false);
                }
            };

            const triggerSuccess = () => {
                setShowShockwave(true);
                setTimeout(() => {
                    setStep('result');
                    setShowShockwave(false);
                }, 800);
            };

            return (
                <div className="w-[970px] h-[250px] bg-white relative overflow-hidden shadow-2xl border border-slate-100 select-none font-sans group rounded-xl">
                
                {/* Dynamic Background */}
                <div className="absolute inset-0 z-0">
                    <div className="absolute inset-0 bg-[radial-gradient(circle_at_0%_0%,_#f8fafc_0%,_#ffffff_100%)]" />
                    {/* Subtle animated mesh gradient */}
                    <motion.div 
                    animate={{ 
                        backgroundPosition: ['0% 0%', '100% 100%'],
                        opacity: [0.3, 0.5, 0.3]
                    }}
                    transition={{ duration: 10, repeat: Infinity, repeatType: "reverse" }}
                    className="absolute inset-0 bg-[url('https://www.transparenttextures.com/patterns/cubes.png')] opacity-30"
                    />
                    {/* Blue accent glow */}
                    <div className="absolute -right-20 -top-20 w-96 h-96 bg-blue-50 rounded-full blur-3xl opacity-60" />
                </div>

                {/* Header */}
                <div className="absolute top-6 left-8 z-30 flex items-center gap-4 pointer-events-none">
                    <img src={ASSETS.logo} alt="Beko" className="h-10 object-contain opacity-90" />
                </div>

                <AnimatePresence mode='wait'>
                    
                    {/* STEP 1: INTRO */}
                    {step === 'intro' && (
                    <motion.div 
                        key="intro"
                        className="absolute inset-0 z-10 flex items-center justify-between px-16"
                        exit={{ opacity: 0, scale: 0.95, filter: "blur(10px)" }}
                        transition={{ duration: 0.5 }}
                    >
                        {/* Left: Typography */}
                        <div className="w-[55%] space-y-6 relative z-10 pt-4 ml-14">
                        <div className="overflow-hidden">
                            <motion.h2 
                            initial={{ y: 100 }}
                            animate={{ y: 0 }}
                            transition={{ duration: 0.8, ease: [0.16, 1, 0.3, 1] }}
                            className="text-5xl font-bold text-slate-900 leading-[0.95] tracking-tight"
                            >
                            Sıcak yemeği <br/>
                            <span className="text-transparent bg-clip-text bg-gradient-to-r from-blue-600 to-cyan-500">
                                bekletme.
                            </span>
                            </motion.h2>
                        </div>
                        
                        <motion.p 
                            initial={{ opacity: 0 }}
                            animate={{ opacity: 1 }}
                            transition={{ delay: 0.4 }}
                            className="text-slate-500 text-sm font-medium leading-relaxed max-w-sm -mt-[3px]"
                        >
                            Yeni nesil Direct Cool teknolojisi ile sıcak tencereleri anında buzdolabına yerleştirin.
                        </motion.p>
                        
                        <motion.button
                            onClick={() => setStep('interaction')}
                            initial={{ opacity: 0, y: 20 }}
                            animate={{ opacity: 1, y: 0 }}
                            transition={{ delay: 0.6 }}
                            whileHover={{ scale: 1.05 }}
                            whileTap={{ scale: 0.95 }}
                            className="group relative overflow-hidden bg-slate-900 text-white px-8 py-3 rounded-full text-sm font-bold shadow-xl shadow-slate-900/20 -mt-[5px]"
                        >
                            <span className="relative z-10 flex items-center gap-2">
                            Deneyimle <ArrowRight className="w-4 h-4 group-hover:translate-x-1 transition-transform" />
                            </span>
                            {/* Button Shimmer */}
                            <motion.div 
                            className="absolute inset-0 -translate-x-full group-hover:animate-[shimmer_1.5s_infinite] bg-gradient-to-r from-transparent via-white/20 to-transparent z-0"
                            />
                        </motion.button>
                        </div>

                        {/* Right: Hero Visual */}
                        <div className="w-[45%] h-full relative flex items-center justify-center">
                        <div className="relative">
                            {/* Steam Particles */}
                            <div className="absolute -top-10 left-1/2 -translate-x-1/2 w-20 h-32 pointer-events-none">
                                {[...Array(5)].map((_, i) => (
                                <motion.div
                                    key={i}
                                    className="absolute bottom-0 left-1/2 w-4 h-4 bg-white rounded-full blur-md"
                                    animate={{
                                    y: -80 - Math.random() * 40,
                                    x: (Math.random() - 0.5) * 30,
                                    opacity: [0, 0.4, 0],
                                    scale: [0.5, 1.5, 2]
                                    }}
                                    transition={{
                                    duration: 2 + Math.random(),
                                    repeat: Infinity,
                                    delay: Math.random() * 2,
                                    ease: "easeOut"
                                    }}
                                />
                                ))}
                            </div>

                            <motion.div
                            animate={{ y: [0, -10, 0] }}
                            transition={{ duration: 6, repeat: Infinity, ease: "easeInOut" }}
                            className="relative z-10"
                            >
                            <img 
                                src={ASSETS.pot} 
                                alt="Pot" 
                                className="w-56 h-auto object-contain drop-shadow-2xl"
                            />
                            {/* Floor Shadow */}
                            <div className="absolute -bottom-4 left-1/2 -translate-x-1/2 w-40 h-4 bg-black/20 blur-xl rounded-full" />
                            </motion.div>

                            {/* Hot Badge */}
                            <motion.div 
                            initial={{ scale: 0 }}
                            animate={{ scale: 1 }}
                            transition={{ delay: 0.8, type: "spring" }}
                            className="absolute -right-4 top-0 bg-white/80 backdrop-blur-md border border-white/50 p-2 rounded-2xl shadow-lg flex items-center gap-2"
                            >
                            <div className="bg-red-100 p-1.5 rounded-full">
                                <Thermometer className="w-4 h-4 text-red-500" />
                            </div>
                            <div className="pr-2">
                                <div className="text-[10px] font-bold text-slate-400 uppercase leading-none">Sıcaklık</div>
                                <div className="text-sm font-bold text-slate-800 leading-none">90°C</div>
                            </div>
                            </motion.div>
                        </div>
                        </div>
                    </motion.div>
                    )}

                    {/* STEP 2: INTERACTION */}
                    {step === 'interaction' && (
                    <motion.div 
                        key="interaction"
                        className="absolute inset-0 z-10 flex items-center justify-center"
                        initial={{ opacity: 0 }}
                        animate={{ opacity: 1 }}
                        exit={{ opacity: 0 }}
                    >
                        {/* Instruction Pill */}
                        <motion.div 
                        initial={{ y: -50, opacity: 0 }}
                        animate={{ y: 0, opacity: 1 }}
                        className="absolute top-6 z-30"
                        >
                        <div className="bg-white/90 backdrop-blur-md px-6 py-2 rounded-full border border-slate-200 shadow-lg flex items-center gap-3">
                            <div className="flex h-3 w-3 relative">
                            <span className="animate-ping absolute inline-flex h-full w-full rounded-full bg-blue-400 opacity-75"></span>
                            <span className="relative inline-flex rounded-full h-3 w-3 bg-blue-500"></span>
                            </div>
                            <span className="text-slate-700 font-semibold text-sm">Tencereyi buzdolabına sürükleyin</span>
                        </div>
                        </motion.div>

                        {/* Drag Zone */}
                        <div className="w-full h-full flex items-center justify-between px-20 relative">
                        
                        {/* Draggable Item */}
                        <motion.div
                            drag
                            dragConstraints={{ left: -50, right: 800, top: -100, bottom: 100 }}
                            dragElastic={0.2}
                            dragMomentum={false}
                            onDragEnd={handleDragEnd}
                            whileHover={{ scale: 1.05, cursor: "grab" }}
                            whileDrag={{ scale: 1.1, cursor: "grabbing", zIndex: 100 }}
                            className="relative z-50 touch-none cursor-grab active:cursor-grabbing"
                        >
                            {/* Steam following the pot - Positioned closer */}
                            <div className="absolute -top-2 left-1/2 -translate-x-1/2 w-full flex justify-center pointer-events-none">
                            <motion.div 
                                animate={{ opacity: [0.4, 0.8, 0.4], y: [0, -5, 0] }}
                                transition={{ duration: 2, repeat: Infinity }}
                                className="bg-red-500 text-white text-[10px] font-bold px-2 py-0.5 rounded-full shadow-sm"
                            >
                                SICAK
                            </motion.div>
                            </div>
                            <img 
                            src={ASSETS.pot} 
                            alt="Pot" 
                            draggable="false"
                            className="w-40 h-auto object-contain drop-shadow-2xl pointer-events-none select-none"
                            />
                            {/* Dynamic Shadow */}
                            <motion.div 
                            className="absolute -bottom-4 left-1/2 -translate-x-1/2 w-32 h-4 bg-black/20 blur-xl rounded-full"
                            whileDrag={{ scale: 0.5, opacity: 0.5 }}
                            />
                        </motion.div>

                        {/* Target Zone */}
                        <div className="relative z-20 group pr-10">
                            <motion.div
                            animate={{ 
                                scale: isHoveringFridge ? 1.05 : 1,
                                filter: isHoveringFridge ? "brightness(1.05)" : "brightness(1)"
                            }}
                            transition={{ type: "spring", stiffness: 300, damping: 20 }}
                            >
                            <img 
                                src={ASSETS.fridge} 
                                alt="Fridge" 
                                className="h-60 w-auto object-contain drop-shadow-2xl"
                            />
                            {/* Floor Shadow */}
                            <div className="absolute -bottom-2 left-1/2 -translate-x-1/2 w-48 h-6 bg-black/30 blur-xl rounded-full" />
                            </motion.div>

                            {/* Magnetic Glow Field */}
                            {isHoveringFridge && (
                            <motion.div 
                                initial={{ opacity: 0, scale: 0.8 }}
                                animate={{ opacity: 1, scale: 1 }}
                                className="absolute inset-0 -z-10 bg-blue-500/20 blur-3xl rounded-full"
                            />
                            )}
                        </div>
                        </div>
                    </motion.div>
                    )}

                    {/* STEP 3: RESULT */}
                    {step === 'result' && (
                    <motion.div 
                        key="result"
                        className="absolute inset-0 z-10 flex items-center justify-between px-10 bg-white"
                        initial={{ opacity: 0 }}
                        animate={{ opacity: 1 }}
                    >
                        {/* Background Frost Pattern */}
                        <div className="absolute right-0 top-0 bottom-0 w-2/3 bg-blue-50/50 skew-x-12 translate-x-32 -z-10" />

                        {/* Left Content - Adjusted layout to prevent overlap */}
                        <div className="w-[60%] flex flex-col justify-start h-full z-20 space-y-2 ml-[86px] pt-[25px]">
                        <div>
                            <motion.h2 
                            initial={{ y: 20, opacity: 0 }}
                            animate={{ y: 0, opacity: 1 }}
                            transition={{ delay: 0.2 }}
                            className="text-3xl font-bold text-slate-900 leading-tight"
                            >
                            Tazelik <span className="italic font-serif text-blue-600">koruma</span> <br/>
                            altında.
                            </motion.h2>
                        </div>

                        <motion.div 
                            initial={{ opacity: 0 }}
                            animate={{ opacity: 1 }}
                            transition={{ delay: 0.4 }}
                            className="space-y-2"
                        >
                            {[
                            "Sıcak tencereyi beklemeden koyun",
                            "Besin değerlerini 2 kata kadar koruyun"
                            ].map((item, i) => (
                            <motion.div 
                                key={i}
                                initial={{ x: -20, opacity: 0 }}
                                animate={{ x: 0, opacity: 1 }}
                                transition={{ delay: 0.5 + (i * 0.1) }}
                                className="flex items-center gap-2"
                            >
                                <div className="w-5 h-5 min-w-[20px] rounded-full bg-green-50 border border-green-100 flex items-center justify-center text-green-600 shadow-sm">
                                <Check className="w-3 h-3" />
                                </div>
                                <span className="text-slate-600 font-medium text-xs whitespace-nowrap">{item}</span>
                            </motion.div>
                            ))}
                        </motion.div>

                        <div className="flex items-center gap-3 pt-1">
                            <motion.a
                            href="https://www.beko.com.tr/no-frost-buzdolabi/678551-edi-buzdolabi"
                            target="_blank"
                            rel="noopener noreferrer"
                            initial={{ scale: 0.9, opacity: 0 }}
                            animate={{ scale: 1, opacity: 1 }}
                            transition={{ delay: 0.8 }}
                            whileHover={{ scale: 1.05 }}
                            whileTap={{ scale: 0.95 }}
                            className="bg-blue-600 text-white px-6 py-2.5 rounded-full text-xs font-bold shadow-lg shadow-blue-600/30 hover:bg-blue-700 transition-colors flex items-center gap-2 cursor-pointer"
                            >
                            İncele <ChevronRight className="w-3 h-3" />
                            </motion.a>
                        </div>
                        </div>

                        {/* Right Visual - Adjusted sizing and position */}
                        <div className="w-[40%] h-full relative flex items-end justify-center pb-0">
                        <motion.div 
                            initial={{ scale: 0.8, opacity: 0 }}
                            animate={{ scale: 1, opacity: 1 }}
                            transition={{ type: "spring", duration: 0.8, delay: 0.2 }}
                            className="relative z-10 h-full flex items-end"
                        >
                            <img 
                            src={ASSETS.fridge} 
                            alt="Beko Fridge" 
                            className="h-[90%] w-auto object-contain drop-shadow-2xl mb-4"
                            />
                            
                            {/* Floating Badge */}
                            <motion.div 
                            initial={{ y: 20, opacity: 0 }}
                            animate={{ y: 0, opacity: 1 }}
                            transition={{ delay: 1, type: "spring" }}
                            className="absolute top-1/3 -left-4 bg-white/90 backdrop-blur-xl border border-white p-3 rounded-xl shadow-xl"
                            >
                            <div className="text-center">
                                <div className="text-2xl font-black text-blue-600 leading-none">2x</div>
                                <div className="text-[8px] font-bold text-slate-400 uppercase tracking-wider mt-1">Daha Hızlı<br/>Soğutma</div>
                            </div>
                            </motion.div>
                        </motion.div>
                        </div>
                    </motion.div>
                    )}

                </AnimatePresence>

                {/* SHOCKWAVE OVERLAY */}
                <AnimatePresence>
                    {showShockwave && (
                    <motion.div 
                        initial={{ clipPath: "circle(0% at 80% 50%)" }}
                        animate={{ clipPath: "circle(150% at 80% 50%)" }}
                        exit={{ opacity: 0 }}
                        transition={{ duration: 0.8, ease: "easeOut" }}
                        className="absolute inset-0 z-50 bg-blue-500 flex items-center justify-center"
                    >
                        <motion.div
                        initial={{ scale: 0.5, opacity: 0 }}
                        animate={{ scale: 1.5, opacity: 1 }}
                        className="text-white"
                        >
                        <Snowflake className="w-32 h-32 animate-spin-slow" />
                        </motion.div>
                    </motion.div>
                    )}
                </AnimatePresence>

                </div>
            );
        }

        function App() {
            return (
                <div className="flex flex-col items-center gap-4">
                    <img 
                        src="https://ci3.googleusercontent.com/mail-sig/AIorK4ytim2yfGqtrmGis2N9sHj-LyEC_p2wVIS_4T9V1FzGln0oo-p5BlvIwVBXDDDwkaICxfEd10hq_a6X" 
                        alt="Preview" 
                        className="max-w-[200px] h-auto mb-2 rounded shadow-sm"
                        referrerPolicy="no-referrer"
                    />
                    <Banner />
                </div>
            );
        }

        try {
            const root = createRoot(document.getElementById('root'));
            root.render(<App />);
        } catch (error) {
            console.error("Render Error:", error);
            document.getElementById('root').innerHTML = '<div class="text-red-500 p-4 border border-red-200 bg-red-50 rounded">Uygulama başlatılamadı: ' + error.message + '</div>';
        }
    </script>
</body>
</html>
