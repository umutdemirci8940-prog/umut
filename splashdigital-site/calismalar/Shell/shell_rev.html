<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Shell Interactive Masthead</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800&display=swap" rel="stylesheet">
    <!-- React & ReactDOM (UMD) -->
    <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <!-- Babel Standalone (for JSX) -->
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    
    <style>
        body {
            background-color: #f3f4f6;
            font-family: 'Inter', sans-serif;
        }
        
        /* Custom animations */
        @keyframes shimmer {
            0% { transform: skewX(-12deg) translateX(-150%); }
            100% { transform: skewX(-12deg) translateX(250%); }
        }
        .animate-shimmer {
            animation: shimmer 2.5s infinite;
        }

        @keyframes fade-in-up {
            from { opacity: 0; transform: translateY(8px); }
            to { opacity: 1; transform: translateY(0); }
        }
        .animate-fade-in-up {
            animation: fade-in-up 0.4s ease-out forwards;
        }
    </style>
<script type="importmap">
{
  "imports": {
    "react": "https://esm.sh/react@^19.2.4",
    "react-dom/": "https://esm.sh/react-dom@^19.2.4/",
    "react/": "https://esm.sh/react@^19.2.4/",
    "lucide-react": "https://esm.sh/lucide-react@^0.563.0"
  }
}
</script>
</head>
<body>
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useEffect } = React;

        // --- INLINE ICONS ---
        const Sparkles = (props) => (
            <svg {...props} xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><path d="m12 3-1.912 5.813a2 2 0 0 1-1.275 1.275L3 12l5.813 1.912a2 2 0 0 1 1.275 1.275L12 21l1.912-5.813a2 2 0 0 1 1.275-1.275L12 3Z"/><path d="M5 3v4"/><path d="M9 5H5"/><path d="M19 19v2"/><path d="M19 21h2"/></svg>
        );
        const Wind = (props) => (
            <svg {...props} xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><path d="M17.7 7.7a2.5 2.5 0 1 1 1.8 4.3H2"/><path d="M9.6 4.6A2 2 0 1 1 11 8H2"/><path d="M12.6 19.4A2 2 0 1 0 14 16H2"/></svg>
        );
        const HandDryer = (props) => (
            <svg {...props} xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round">
                <path d="M2 7h20v5a3 3 0 0 1-3 3h-4l-3 4-3-4H5a3 3 0 0 1-3-3V7z" />
                <path d="M12 19v3" />
                <path d="M8 20l-1 2" />
                <path d="M16 20l1 2" />
            </svg>
        );
        const Play = (props) => (
            <svg {...props} xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><polygon points="5 3 19 12 5 21 5 3"/></svg>
        );
        const ChevronRight = (props) => (
            <svg {...props} xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><polyline points="9 18 15 12 9 6"/></svg>
        );
        const ChevronLeft = (props) => (
            <svg {...props} xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><polyline points="15 18 9 12 15 6"/></svg>
        );
        const MapPin = (props) => (
            <svg {...props} xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><path d="M20 10c0 6-8 12-8 12s-8-6-8-12a8 8 0 0 1 16 0Z"/><circle cx="12" cy="10" r="3"/></svg>
        );
        const RotateCcw = (props) => (
            <svg {...props} xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><path d="M3 12a9 9 0 1 0 9-9 9.75 9.75 0 0 0-6.74 2.74L3 8"/><path d="M3 3v5h5"/></svg>
        );

        // --- CONSTANTS ---
        const COLORS = {
            RED: "#DD1D21",
            YELLOW: "#FBCE07",
            WHITE: "#FFFFFF",
            DARK_GRAY: "#1F2937"
        };

        const IMAGES = {
            LOGO: "https://upload.wikimedia.org/wikipedia/en/thumb/e/e8/Shell_logo.svg/1280px-Shell_logo.svg.png",
            VIDEO_THUMB: "https://img.youtube.com/vi/sAZo1MN2a_A/maxresdefault.jpg"
        };

        const FEATURES = [
            {
                id: 1,
                title: "Ozon Temizliği",
                text: "Ozon teknolojisiyle derinlemesine temizlik sağlanır, hijyen seviyesi artırılır.",
                icon: Sparkles
            },
            {
                id: 2,
                title: "Akıllı Havalandırma",
                text: "Ortam havası sürekli yenilenerek ferah ve temiz bir alan oluşturulur.",
                icon: Wind
            },
            {
                id: 3,
                title: "Hepa Filtreli El Kurutma",
                text: "Hepa filtreli sistem sayesinde hijyen sağlanırken kağıt tüketimi azaltılır.",
                icon: HandDryer
            }
        ];

        // --- COMPONENTS ---

        const VideoPlayer = ({ isPlaying }) => {
            const [progress, setProgress] = useState(0);

            useEffect(() => {
                let interval;
                if (isPlaying) {
                    interval = window.setInterval(() => {
                        setProgress((prev) => {
                            if (prev >= 100) return 0; // Loop the video bar
                            return prev + 0.5;
                        });
                    }, 50);
                } else {
                    setProgress(0);
                }
                return () => clearInterval(interval);
            }, [isPlaying]);

            return (
                <div className="relative w-full h-full bg-black overflow-hidden group">
                    <img
                        src={IMAGES.VIDEO_THUMB}
                        alt="Shell Station Atmosphere"
                        className={`absolute inset-0 w-full h-full object-cover transition-transform duration-[20s] ease-linear ${isPlaying ? 'scale-125' : 'scale-100'}`}
                    />
                    <div className="absolute inset-0 bg-gradient-to-t from-black/80 via-black/20 to-transparent" />
                    <div className="absolute inset-0 flex items-center justify-center pointer-events-none">
                        <div className={`bg-white/20 backdrop-blur-sm p-4 rounded-full transition-opacity duration-500 ${isPlaying ? 'opacity-0' : 'opacity-100'}`}>
                            <Play fill="white" className="text-white w-8 h-8 ml-1" />
                        </div>
                    </div>
                    <div className="absolute bottom-0 left-0 right-0 p-4">
                        <div className="flex items-center justify-between text-white text-[10px] font-medium mb-1.5 opacity-80 whitespace-nowrap">
                            <span>SHELL SELECT</span>
                            <span>00:{Math.floor(progress / 3.3).toString().padStart(2, '0')} / 00:30</span>
                        </div>
                        <div className="w-full h-1 bg-white/30 rounded-full overflow-hidden">
                            <div
                                className="h-full rounded-full transition-all duration-75 ease-linear shadow-[0_0_10px_rgba(251,206,7,0.7)]"
                                style={{
                                    width: `${progress}%`,
                                    backgroundColor: COLORS.YELLOW
                                }}
                            />
                        </div>
                    </div>
                    <div className="absolute top-3 right-3 bg-black/60 backdrop-blur text-white text-[9px] font-bold px-2 py-1 rounded border border-white/10 pointer-events-none z-10">
                        REKLAM
                    </div>
                </div>
            );
        };

        const HygieneAssistant = () => {
            const [activeFeature, setActiveFeature] = useState(null);

            return (
                <div className="h-full w-full bg-white flex flex-col border-r border-gray-100 relative z-10 overflow-hidden">
                    {/* Header: Fixed Height 55px */}
                    <div className="h-[55px] flex flex-col justify-center px-4 border-b border-gray-50 flex-shrink-0">
                        <h3 className="text-[13px] font-extrabold text-gray-900 flex items-center gap-2 leading-none tracking-tight">
                            <span className="w-1.5 h-7 bg-[#DD1D21] rounded-full flex-shrink-0"></span>
                            Tuvaletleri ile Shell hep ileride
                        </h3>
                        {!activeFeature && (
                            <p className="text-[10px] text-gray-500 mt-1 pl-3.5 leading-none animate-fade-in-up">
                                Merak ettiğiniz başlığa tıklayın.
                            </p>
                        )}
                    </div>

                    {/* Content: Takes remaining height */}
                    <div className="flex-1 relative w-full overflow-hidden">
                        {activeFeature ? (
                            <div className="absolute inset-0 p-4 flex flex-col animate-fade-in-up bg-white z-20 h-full">
                                <button 
                                    onClick={() => setActiveFeature(null)}
                                    className="flex-shrink-0 self-start flex items-center gap-1 text-[10px] font-bold text-gray-400 hover:text-[#DD1D21] transition-colors mb-2 group"
                                >
                                    <ChevronLeft size={14} className="group-hover:-translate-x-1 transition-transform" />
                                    Geri Dön
                                </button>

                                <div className="flex-1 flex flex-col items-center justify-center text-center pb-2">
                                    <div className="w-12 h-12 bg-red-50 rounded-full flex items-center justify-center text-[#DD1D21] mb-2 shadow-sm ring-4 ring-red-50/50">
                                        <activeFeature.icon size={24} strokeWidth={1.5} />
                                    </div>
                                    <h4 className="text-[15px] font-black text-gray-900 mb-1 leading-tight">
                                        {activeFeature.title}
                                    </h4>
                                    <p className="text-[11px] text-gray-600 leading-tight max-w-[260px]">
                                        {activeFeature.text}
                                    </p>
                                </div>
                            </div>
                        ) : (
                            <div className="h-full flex flex-col p-2 gap-2">
                                {FEATURES.map((feature) => {
                                    const Icon = feature.icon;
                                    return (
                                        <button
                                            key={feature.id}
                                            onClick={() => setActiveFeature(feature)}
                                            className="flex-1 group relative flex items-center gap-3 px-3 rounded-lg text-left transition-all duration-200 bg-white hover:bg-gray-50 border border-gray-100 hover:border-red-100 hover:shadow-sm w-full"
                                        >
                                            <div className="w-8 h-8 flex items-center justify-center rounded-md bg-gray-100 text-gray-500 group-hover:bg-[#DD1D21] group-hover:text-white transition-colors duration-200 flex-shrink-0">
                                                <Icon size={16} strokeWidth={2.5} />
                                            </div>
                                            <span className="text-[11px] font-bold text-gray-700 group-hover:text-[#DD1D21] transition-colors leading-tight">
                                                {feature.title}
                                            </span>
                                            <ChevronRight size={14} className="ml-auto text-gray-300 group-hover:text-[#DD1D21] transition-colors flex-shrink-0" />
                                        </button>
                                    );
                                })}
                            </div>
                        )}
                    </div>
                </div>
            );
        };

        const BrandingPanel = ({ onReplay }) => {
            return (
                <div className="flex-1 h-full bg-white flex flex-col items-center justify-center text-center px-4 relative overflow-hidden flex-shrink-0">
                    <div className="absolute top-0 right-0 w-24 h-24 bg-yellow-50 rounded-bl-full -mr-10 -mt-10 z-0"></div>
                    <div className="absolute bottom-0 left-0 w-16 h-16 bg-red-50 rounded-tr-full -ml-8 -mb-8 z-0"></div>

                    <div className="relative z-10 flex flex-col items-center w-full max-w-[280px]">
                        <img
                            src={IMAGES.LOGO}
                            alt="Shell Logo"
                            className="w-14 h-auto mb-3 drop-shadow-sm block"
                        />
                        <h1 className="text-[18px] font-black text-gray-900 leading-[1.1] mb-2 whitespace-nowrap">
                            Yolculuğun<br/>
                            <span className="text-[#DD1D21]">En Temiz</span> Molası
                        </h1>
                        <div className="w-10 h-1 bg-[#FBCE07] rounded-full mb-4"></div>
                        <a
                            href="https://www.shell.com.tr/suruculer/shell-station-locator.html"
                            target="_blank"
                            rel="noopener noreferrer"
                            className="group relative overflow-hidden bg-[#DD1D21] hover:bg-[#b9161a] transition-colors text-white text-[11px] font-bold uppercase tracking-widest px-6 py-2.5 rounded-full shadow-lg shadow-red-200 flex items-center justify-center gap-2 w-auto min-w-[180px]"
                        >
                            <MapPin size={14} className="group-hover:-translate-y-0.5 transition-transform duration-300 flex-shrink-0" />
                            <span className="whitespace-nowrap">Rotayı Oluştur</span>
                            <div className="absolute inset-0 -translate-x-full group-hover:animate-shimmer w-full bg-gradient-to-r from-transparent via-white/40 to-transparent skew-x-12" />
                        </a>
                    </div>
                    {onReplay && (
                        <button 
                            onClick={onReplay}
                            className="absolute bottom-2 right-2 text-gray-300 hover:text-gray-500 transition-colors p-1 z-20"
                            title="Animasyonu Tekrarla"
                        >
                            <RotateCcw size={12} />
                        </button>
                    )}
                </div>
            );
        };

        const IntroOverlay = ({ onComplete }) => {
            const [visible, setVisible] = useState(true);
            const [fadingOut, setFadingOut] = useState(false);

            useEffect(() => {
                const timer1 = setTimeout(() => { setFadingOut(true); }, 1200);
                const timer2 = setTimeout(() => { setVisible(false); onComplete(); }, 1700);
                return () => { clearTimeout(timer1); clearTimeout(timer2); };
            }, [onComplete]);

            if (!visible) return null;

            return (
                <div className={`absolute inset-0 z-50 flex items-center justify-center bg-[#FBCE07] transition-opacity duration-500 ease-out ${fadingOut ? 'opacity-0' : 'opacity-100'}`}>
                    <div className="relative">
                        <div className="absolute inset-0 bg-white/30 rounded-full animate-ping"></div>
                        <img src={IMAGES.LOGO} alt="Shell Intro" className="relative w-28 h-auto drop-shadow-md z-10 animate-bounce" />
                    </div>
                </div>
            );
        };

        const App = () => {
            const [key, setKey] = useState(0);
            const [introFinished, setIntroFinished] = useState(false);

            const handleReplay = () => {
                setIntroFinished(false);
                setKey(prev => prev + 1);
            };

            return (
                <div className="min-h-screen flex flex-col items-center justify-center p-8 bg-gray-200">
                    <div 
                        key={key}
                        className="relative shadow-2xl bg-white flex overflow-hidden rounded-md ring-1 ring-black/5"
                        style={{ width: 970, height: 250 }}
                    >
                        <IntroOverlay onComplete={() => setIntroFinished(true)} />
                        <div className="w-[290px] h-full flex-shrink-0 border-r border-gray-100">
                            <VideoPlayer isPlaying={introFinished} />
                        </div>
                        <div className="w-[340px] h-full flex-shrink-0">
                            <HygieneAssistant />
                        </div>
                        <BrandingPanel onReplay={handleReplay} />
                    </div>
                </div>
            );
        };

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
