<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="ad.size" content="width=970,height=250">
    <title>Banvit - Taktik Maktik Yok</title>
    
    <!-- DV360 Click Tag Definition -->
    <script type="text/javascript">
      var clickTag = "https://www.banvit.com/"; 
    </script>

    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    
    <!-- Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Black+Ops+One&family=Inter:wght@400;700;900&display=swap" rel="stylesheet">
    
    <!-- React & ReactDOM (UMD for browser) -->
    <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    
    <!-- Babel for JSX compilation in browser -->
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    
    <!-- Lucide Icons (UMD) -->
    <script src="https://unpkg.com/lucide@latest"></script>
    <script src="https://unpkg.com/lucide-react/dist/umd/lucide-react.min.js"></script>

    <style>
      body {
        background-color: transparent;
        margin: 0;
        padding: 0;
        overflow: hidden;
        font-family: 'Inter', sans-serif;
        width: 970px;
        height: 250px;
        user-select: none;
      }
      .font-gamer {
        font-family: 'Black Ops One', system-ui;
      }
      /* Custom Animation Utilities */
      @keyframes spin-slow {
        from { transform: translate(-50%, -50%) rotate(0deg); }
        to { transform: translate(-50%, -50%) rotate(360deg); }
      }
      .animate-spin-slow {
        animation: spin-slow 25s linear infinite;
      }
    </style>
<script type="importmap">
{
  "imports": {
    "react": "https://esm.sh/react@^19.2.3",
    "react-dom/": "https://esm.sh/react-dom@^19.2.3/",
    "react/": "https://esm.sh/react@^19.2.3/",
    "lucide-react": "https://esm.sh/lucide-react@^0.561.0"
  }
}
</script>
</head>
<body>
    <div id="root"></div>

    <script type="text/babel">
      const { useState, useEffect, useRef, useCallback } = React;
      
      // --- Icons (Simulating Lucide React Components with SVG for standalone) ---
      const IconWrapper = ({ children, className }) => (
        <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={className}>
          {children}
        </svg>
      );

      const Sparkles = ({ className }) => (
        <IconWrapper className={className}>
          <path d="m12 3-1.912 5.813a2 2 0 0 1-1.275 1.275L3 12l5.813 1.912a2 2 0 0 1 1.275 1.275L12 21l1.912-5.813a2 2 0 0 1 1.275-1.275L21 12l-5.813-1.912a2 2 0 0 1-1.275-1.275L12 3Z" />
        </IconWrapper>
      );
      const MousePointer2 = ({ className }) => (
        <IconWrapper className={className}>
          <path d="m12 12 6.875 6.875a1 1 0 0 1-1.417 1.412L12 14.5l-4.232 4.233a1 1 0 0 1-1.415-1.415L12 12Z" />
          <path d="M12 12 8 8" />
        </IconWrapper>
      );
      const Home = ({ className }) => (
        <IconWrapper className={className}>
          <path d="m3 9 9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z" />
          <polyline points="9 22 9 12 15 12 15 22" />
        </IconWrapper>
      );
      const Timer = ({ className }) => (
        <IconWrapper className={className}>
          <line x1="10" x2="14" y1="2" y2="2" />
          <line x1="12" x2="15" y1="14" y2="11" />
          <circle cx="12" cy="14" r="8" />
        </IconWrapper>
      );
      const Trophy = ({ className }) => (
        <IconWrapper className={className}>
          <path d="M6 9H4.5a2.5 2.5 0 0 1 0-5H6" />
          <path d="M18 9h1.5a2.5 2.5 0 0 0 0-5H18" />
          <path d="M4 22h16" />
          <path d="M10 14.66V17c0 .55-.47.98-.97 1.21C7.85 18.75 7 20.24 7 22" />
          <path d="M14 14.66V17c0 .55.47.98.97 1.21C16.15 18.75 17 20.24 17 22" />
          <path d="M18 2H6v7a6 6 0 0 0 12 0V2Z" />
        </IconWrapper>
      );
      const Zap = ({ className }) => (
        <IconWrapper className={className}>
          <polygon points="13 2 3 14 12 14 11 22 21 10 12 10 13 2" />
        </IconWrapper>
      );
      const Utensils = ({ className }) => (
        <IconWrapper className={className}>
          <path d="M3 2v7c0 1.1.9 2 2 2h4a2 2 0 0 0 2-2V2" />
          <path d="M7 2v20" />
          <path d="M21 15V2v0a5 5 0 0 0-5 5v6c0 1.1.9 2 2 2h3Zm0 0v7" />
        </IconWrapper>
      );

      // --- Constants ---
      const AdState = {
        INTRO: 'INTRO',
        SELECT_TEAM: 'SELECT_TEAM',
        GAME: 'GAME',
        RESULT: 'RESULT'
      };

      const ProductType = {
        NUGGET: 'NUGGET',
        SOSIS: 'SOSIS',
        NONE: 'NONE'
      };

      const IMG_SOSIS = "https://images.unsplash.com/photo-1585325701165-351af916e581?q=80&w=500&auto=format&fit=crop"; 
      const IMG_NUGGET = "https://images.unsplash.com/photo-1626082927389-6cd097cdc6ec?q=80&w=500&auto=format&fit=crop";
      const GAME_DURATION = 10;

      // --- Components ---

      const ParticleBackground = () => {
        const canvasRef = useRef(null);

        useEffect(() => {
          const canvas = canvasRef.current;
          if (!canvas) return;
          const ctx = canvas.getContext('2d');
          if (!ctx) return;

          canvas.width = 970;
          canvas.height = 250;

          const colors = ['#007a33', '#f39200', '#ffffff', '#e6f4ea', '#fdb813']; 
          let particles = [];

          for (let i = 0; i < 60; i++) {
            particles.push({
              x: Math.random() * canvas.width,
              y: Math.random() * canvas.height,
              vx: (Math.random() - 0.5) * 1.5,
              vy: (Math.random() - 0.5) * 1.5,
              size: Math.random() * 5,
              color: colors[Math.floor(Math.random() * colors.length)]
            });
          }

          let animId;
          const animate = () => {
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            
            particles.forEach(p => {
              p.x += p.vx;
              p.y += p.vy;

              if (p.x < 0 || p.x > canvas.width) p.vx *= -1;
              if (p.y < 0 || p.y > canvas.height) p.vy *= -1;

              ctx.beginPath();
              ctx.arc(p.x, p.y, p.size, 0, Math.PI * 2);
              ctx.fillStyle = p.color;
              ctx.globalAlpha = 0.5;
              ctx.fill();
            });

            animId = requestAnimationFrame(animate);
          };

          animate();
          return () => cancelAnimationFrame(animId);
        }, []);

        return <canvas ref={canvasRef} className="absolute inset-0 z-0 pointer-events-none mix-blend-soft-light" />;
      };

      const BannerContent = () => {
        const [currentState, setCurrentState] = useState(AdState.INTRO);
        const [selectedTeam, setSelectedTeam] = useState(ProductType.NONE);
        const [score, setScore] = useState(0);
        const [timeLeft, setTimeLeft] = useState(GAME_DURATION);
        const [items, setItems] = useState([]);
        const [clickEffect, setClickEffect] = useState(null);

        const spawnItem = useCallback(() => {
          const id = Date.now() + Math.random();
          const x = 100 + Math.random() * 770;
          const y = 50 + Math.random() * 150;
          
          setItems(prev => [...prev, {
            id,
            x,
            y,
            type: Math.random() > 0.8 ? 'distraction' : 'target',
            active: true
          }]);

          setTimeout(() => {
            setItems(prev => prev.filter(item => item.id !== id));
          }, 1500);
        }, []);

        useEffect(() => {
          if (currentState === AdState.GAME) {
            const interval = setInterval(() => {
              setTimeLeft(prev => {
                if (prev <= 0.1) {
                  setCurrentState(AdState.RESULT);
                  return 0;
                }
                return prev - 0.1;
              });
            }, 100);

            const spawner = setInterval(spawnItem, 500); 

            return () => {
              clearInterval(interval);
              clearInterval(spawner);
            };
          }
        }, [currentState, spawnItem]);

        const handleItemClick = (id, type, e) => {
          e.stopPropagation();
          const rect = e.target.getBoundingClientRect();
          setClickEffect({ x: rect.left + rect.width/2, y: rect.top + rect.height/2, id: Date.now() });
          setTimeout(() => setClickEffect(null), 500);

          setItems(prev => prev.map(item => item.id === id ? { ...item, active: false } : item));
          if (type === 'target') {
            setScore(s => s + 100);
          } else {
            setScore(s => Math.max(0, s - 50));
          }
        };

        const startGame = (team) => {
          setSelectedTeam(team);
          setScore(0);
          setTimeLeft(GAME_DURATION);
          setItems([]);
          setCurrentState(AdState.GAME);
        };

        const goHome = (e) => {
          if (e) e.stopPropagation();
          setCurrentState(AdState.INTRO);
          setScore(0);
          setItems([]);
        };

        const replay = () => {
          setCurrentState(AdState.SELECT_TEAM);
        };

        const handleClickThrough = () => {
          const exitUrl = window.clickTag || "https://www.banvit.com/";
          window.open(exitUrl, "_blank");
        };

        // Render Helpers
        const renderIntro = () => (
          <div className="flex flex-col items-center justify-center h-full w-full relative z-10 cursor-pointer group overflow-hidden" onClick={() => setCurrentState(AdState.SELECT_TEAM)}>
            <div className="absolute top-1/2 left-1/2 w-[900px] h-[900px] bg-[conic-gradient(from_0deg,transparent_0_10deg,#ffffff20_10deg_20deg,transparent_20deg)] animate-spin-slow opacity-40"></div>
            
            <div className="z-10 text-center relative mt-2 flex flex-col items-center">
              <h2 className="text-white text-md font-bold tracking-[0.4em] mb-0 uppercase opacity-90 drop-shadow-sm flex items-center justify-center gap-2">
                 <Sparkles className="w-4 h-4 text-[#f39200]" /> Banvit Sunar <Sparkles className="w-4 h-4 text-[#f39200]" />
              </h2>
              
              <h1 className="font-gamer text-6xl text-white font-black italic tracking-tighter drop-shadow-[0_4px_0px_#004d20] leading-tight transform group-hover:scale-105 transition-transform duration-300">
                TAKTIK MAKTIK <span className="text-[#f39200] inline-block skew-x-12 drop-shadow-[0_4px_0px_#963e00]">YOK</span>
              </h1>
              
              <div className="flex items-center justify-center gap-6 mt-3">
                 <div className="bg-white px-8 py-2 rounded-full shadow-[0_5px_15px_rgba(0,0,0,0.1)] flex items-center gap-2 transform -rotate-1 border-b-4 border-[#e6e6e6]">
                   <span className="text-2xl font-black text-[#007a33]">BAN</span>
                   <span className="text-2xl font-black text-[#f39200]">BAN</span>
                 </div>
              </div>
            </div>

            <div className="absolute bottom-6 right-12 flex items-center gap-3 bg-[#f39200] text-white pl-6 pr-2 py-2 rounded-full transform transition-all duration-300 animate-bounce hover:animate-none hover:scale-110 shadow-xl border-2 border-white/50">
              <span className="font-black uppercase text-sm tracking-wide">Lezzeti Yakala</span>
              <div className="bg-white text-[#f39200] rounded-full p-1">
                  <MousePointer2 className="w-4 h-4" />
              </div>
            </div>
          </div>
        );

        const renderSelection = () => (
          <div className="flex h-full w-full relative z-10">
            <div className="w-1/2 h-full relative group cursor-pointer overflow-hidden border-r-2 border-white" onClick={() => startGame(ProductType.SOSIS)}>
              <div className="absolute inset-0 bg-[#007a33]"></div>
              <div className="absolute inset-0 bg-[url('https://www.transparenttextures.com/patterns/diagonal-stripes.png')] opacity-10"></div>
              <div className="absolute inset-0 flex items-center justify-center">
                  <img src={IMG_SOSIS} alt="Sosis" className="w-full h-full object-cover opacity-60 group-hover:opacity-80 transition-opacity duration-500 group-hover:scale-110 transform" />
              </div>
              <div className="absolute inset-0 bg-gradient-to-t from-[#005c26] via-transparent to-transparent flex flex-col items-center justify-center p-4">
                  <div className="bg-white/95 backdrop-blur-sm p-5 rounded-xl shadow-xl transform transition-transform group-hover:-translate-y-2 border-b-4 border-[#007a33]">
                      <h3 className="font-gamer text-4xl text-[#007a33] italic leading-none">TEAM SOSIS</h3>
                  </div>
              </div>
            </div>

            <div className="absolute left-1/2 top-1/2 -translate-x-1/2 -translate-y-1/2 z-20">
               <div className="relative">
                   <div className="bg-white border-4 border-[#f39200] text-[#007a33] w-16 h-16 flex items-center justify-center rounded-full font-black italic text-xl shadow-xl transform rotate-12 relative z-10">VS</div>
               </div>
            </div>

            <div className="w-1/2 h-full relative group cursor-pointer overflow-hidden border-l-2 border-white" onClick={() => startGame(ProductType.NUGGET)}>
              <div className="absolute inset-0 bg-[#f39200]"></div>
              <div className="absolute inset-0 bg-[url('https://www.transparenttextures.com/patterns/diagonal-stripes.png')] opacity-10"></div>
               <div className="absolute inset-0 flex items-center justify-center">
                   <img src={IMG_NUGGET} alt="Nugget" className="w-full h-full object-cover opacity-60 group-hover:opacity-80 transition-opacity duration-500 group-hover:scale-110 transform" />
              </div>
              <div className="absolute inset-0 bg-gradient-to-t from-[#c47500] via-transparent to-transparent flex flex-col items-center justify-center p-4">
                   <div className="bg-white/95 backdrop-blur-sm p-5 rounded-xl shadow-xl transform transition-transform group-hover:-translate-y-2 border-b-4 border-[#f39200]">
                      <h3 className="font-gamer text-4xl text-[#f39200] italic leading-none">TEAM NUGGET</h3>
                   </div>
              </div>
            </div>

            <button onClick={goHome} className="absolute top-4 right-4 z-50 bg-white/20 hover:bg-white/40 backdrop-blur-md p-2 rounded-full border border-white/40 transition-colors shadow-lg" title="Ana Ekrana Dön">
              <Home className="w-5 h-5 text-white drop-shadow-md" />
            </button>
          </div>
        );

        const renderGame = () => (
          <div className="w-full h-full relative z-10 flex flex-col">
            <div className="flex justify-between items-center pl-36 pr-8 py-3 bg-gradient-to-b from-[#004d20]/50 to-transparent pointer-events-none z-20">
              <div className="flex items-center gap-3 bg-white/90 backdrop-blur-md px-4 py-1 rounded-full border border-white/50 shadow-md">
                  <div className={`w-8 h-8 rounded-full border-2 border-[#007a33] overflow-hidden bg-gray-200`}>
                      <img src={selectedTeam === ProductType.SOSIS ? IMG_SOSIS : IMG_NUGGET} className="w-full h-full object-cover" alt="Team" />
                  </div>
                  <span className="text-[#007a33] font-black tracking-wider text-lg italic">TEAM {selectedTeam}</span>
              </div>
              
              <div className="flex items-center gap-4">
                   <div className="flex items-center gap-2 bg-white px-4 py-1 rounded-l-full shadow-lg border-b-2 border-[#007a33]">
                      <Timer className="w-5 h-5 text-[#f39200]" />
                      <span className="text-2xl font-gamer text-[#007a33] leading-none pt-1">{timeLeft.toFixed(1)}</span>
                   </div>
                   <div className="flex items-center gap-2 bg-[#f39200] px-4 py-1 rounded-r-full shadow-lg border-b-2 border-orange-700">
                      <Trophy className="w-5 h-5 text-white" />
                      <span className="text-2xl font-gamer text-white leading-none pt-1">{score}</span>
                   </div>
              </div>
            </div>

            <div className="flex-1 relative overflow-hidden">
              <div className="absolute inset-0 flex items-center justify-center pointer-events-none opacity-10">
                   <h1 className="text-[120px] font-black text-white uppercase italic tracking-tighter">YAKALA</h1>
              </div>

              {items.map(item => (
                item.active && (
                  <button
                      key={item.id}
                      onClick={(e) => handleItemClick(item.id, item.type, e)}
                      className="absolute transform -translate-x-1/2 -translate-y-1/2 transition-transform active:scale-95 hover:scale-110 cursor-pointer group"
                      style={{ left: item.x, top: item.y }}
                  >
                      {item.type === 'target' ? (
                           <div className="relative w-24 h-24">
                              <div className="absolute inset-0 bg-white/50 rounded-full animate-ping opacity-30"></div>
                              <div className="w-24 h-24 rounded-full flex items-center justify-center border-4 border-white shadow-xl overflow-hidden relative z-10 bg-white">
                                  <img src={selectedTeam === ProductType.SOSIS ? IMG_SOSIS : IMG_NUGGET} className="w-full h-full object-cover scale-110" alt="Target" loading="eager" />
                              </div>
                              <div className="absolute -top-2 -right-2 bg-[#f39200] text-white text-[12px] font-black px-2 py-0.5 rounded-sm shadow-sm rotate-12 z-20 border border-white">+100</div>
                           </div>
                      ) : (
                          <div className="w-16 h-16 bg-white rounded-full flex items-center justify-center border-4 border-[#007a33] shadow-lg relative overflow-hidden hover:bg-[#007a33] transition-colors group">
                               <span className="text-3xl group-hover:scale-125 transition-transform">🥦</span>
                          </div>
                      )}
                  </button>
                )
              ))}

              {clickEffect && (
                   <div 
                      className="fixed pointer-events-none text-3xl font-black text-[#f39200] animate-[bounce_0.5s_ease-out_forwards] z-50 drop-shadow-md"
                      style={{ left: clickEffect.x, top: clickEffect.y, textShadow: '2px 2px 0 #fff' }}
                   >
                      NAM NAM!
                   </div>
              )}
            </div>
          </div>
        );

        const renderResult = () => (
          <div className="flex flex-col items-center justify-center h-full w-full relative z-10">
            <div className="relative z-10 text-center">
              <h2 className="text-4xl font-gamer text-white italic drop-shadow-[0_3px_0_#004d20] mb-1">
                  {score > 500 ? 'HARİKA LEZZET!' : 'İYİ DENEME!'}
              </h2>
              <div className="flex items-baseline justify-center gap-2 mb-6">
                  <span className="text-7xl font-black text-[#f39200] drop-shadow-[2px_2px_0_#fff]">{score}</span>
                  <span className="text-2xl font-bold text-white uppercase drop-shadow-md">Puan</span>
              </div>
              
              <div className="flex gap-4 justify-center">
                  <button 
                      onClick={handleClickThrough}
                      className="group relative bg-[#f39200] text-white font-black py-3 px-8 rounded-full shadow-lg hover:shadow-xl hover:-translate-y-1 transition-all flex items-center gap-2 overflow-hidden border-2 border-white cursor-pointer"
                  >
                      <Utensils className="w-5 h-5" />
                      LEZZETİ KEŞFET
                  </button>
                  <button 
                      onClick={replay}
                      className="border-2 border-white text-white hover:bg-white hover:text-[#007a33] font-bold py-3 px-6 rounded-full transition-all flex items-center gap-2"
                  >
                      <Zap className="w-4 h-4" />
                      TEKRAR OYNA
                  </button>
              </div>
            </div>

            <div className="absolute bottom-3 text-white/80 text-[10px] uppercase tracking-[0.3em] font-bold">
              Taktik Maktik Yok, Ban Ban Var.
            </div>

            <button 
              onClick={goHome}
              className="absolute top-4 right-4 bg-white/10 hover:bg-white/30 p-2 rounded-full border border-white/20 transition-colors"
            >
              <Home className="w-5 h-5 text-white" />
            </button>
          </div>
        );

        return (
          <div className="w-[970px] h-[250px] relative overflow-hidden shadow-2xl border border-gray-100 select-none bg-[#007a33]">
            <div className="absolute inset-0 bg-[radial-gradient(circle_at_center,_#009640_0%,_#007a33_60%,_#005c26_100%)] z-0"></div>
            <div className="absolute inset-0 bg-[url('https://www.transparenttextures.com/patterns/cubes.png')] opacity-5 mix-blend-overlay z-0"></div>
            
            <ParticleBackground />
            
            {currentState === AdState.INTRO && renderIntro()}
            {currentState === AdState.SELECT_TEAM && renderSelection()}
            {currentState === AdState.GAME && renderGame()}
            {currentState === AdState.RESULT && renderResult()}
            
            <div className="absolute top-4 left-6 z-50 pointer-events-none flex flex-col items-center justify-center filter drop-shadow-lg">
               <img src="https://www.banvit.com/themes/custom/banvit/images/logo.png" alt="Banvit Logo" className="h-12 w-auto object-contain mb-1" />
               <span className="text-white text-[9px] font-black italic tracking-[0.2em] mt-0 text-center leading-tight drop-shadow-md shadow-black">
                 LEZZETİN<br/>ENERJİSİ
               </span>
            </div>
          </div>
        );
      };

      const root = ReactDOM.createRoot(document.getElementById('root'));
      root.render(
        <React.StrictMode>
          <BannerContent />
        </React.StrictMode>
      );
    </script>
</body>
</html>
