    background: #fff; border: 1px solid #e6e1d8; }

  #bookWrap { position: absolute; inset: 0; transform: translateY(260px); transition: transform 1s var(--bounce); }

  #bookShadow { position: absolute; left: 470px; top: 18px; width: 30px; height: 218px; box-shadow: 0 14px 34px 10px rgba(20,33,61,.22); border-radius: 50%; opacity: 0; transition: opacity 1s; }

  .face { position: absolute; inset: 0; backface-visibility: hidden; -webkit-backface-visibility: hidden; overflow: hidden; background: var(--paper); }

  .face.right { border-radius: 0 8px 8px 0; box-shadow: inset 14px 0 24px -14px rgba(20,33,61,.35); }
  .face.left { border-radius: 8px 0 0 8px; box-shadow: inset -14px 0 24px -14px rgba(20,33,61,.35); }

  /* kapak: lacivert kumaş cilt + altın varak */

  .cover:before { background: repeating-linear-gradient(45deg, rgba(255,255,255,.035) 0 2px, transparent 2px 6px), repeating-linear-gradient(-45deg, rgba(0,0,0,.12) 0 2px, transparent 2px 6px); }
  .cover .spine { position: absolute; left: 0; top: 0; bottom: 0; width: 24px; background: linear-gradient(90deg, #0c1427, #152039 60%, #1a2541); }
  .cover .lg { position: absolute; left: 0; right: 0; top: 40px; display: flex; justify-content: center; }
  .cover .lg .ay-logo { width: 220px; }
  .cover .gold { background: linear-gradient(180deg, #f6e2a8, #c9a35a 55%, #9c7a3c); -webkit-background-clip: text; background-clip: text; color: transparent; }
  .cover .t1 { position: absolute; left: 0; right: 0; top: 96px; text-align: center; font: 500 9.5px/1 "Urbanist", sans-serif; letter-spacing: .42em; color: var(--gold-l); }
  .cover .t2 { position: absolute; left: 0; right: 0; top: 112px; text-align: center; font: 600 italic 36px/1 "Cormorant Garamond", serif; }
  .cover .st { position: absolute; left: 50%; top: 158px; width: 22px; margin-left: -11px; }
  .cover .hintOpen { position: absolute; left: 0; right: 0; bottom: 20px; text-align: center; font: 500 8.5px/1 "Urbanist", sans-serif; letter-spacing: .32em; color: rgba(231,207,152,.8); animation: blink 1.6s ease-in-out infinite; }

  /* sol sayfa */
  .lp { position: absolute; inset: 0; padding: 24px 30px 0 38px; }
  .lp .k { font: 500 8.5px/1 "Urbanist", sans-serif; letter-spacing: .34em; color: var(--gold-d); }
  .lp .k i { display: inline-block; width: 22px; height: 1px; background: var(--gold-d); vertical-align: middle; margin-right: 8px; }
  .lp .ttl { margin-top: 10px; font: 600 italic 40px/.9 "Cormorant Garamond", serif; color: var(--c); }
  .lp .cat { margin-top: 8px; font: 600 13px/1.1 "Urbanist", sans-serif; color: var(--ink); letter-spacing: .02em; }
  .lp .nm { margin-top: 4px; width: 250px; font: 400 10.5px/1.25 "Urbanist", sans-serif; color: var(--mute); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .lp .pr { margin-top: 8px; white-space: nowrap; }
  .lp .pr b { font: 700 28px/1 "Urbanist", sans-serif; letter-spacing: -1px; color: var(--navy); }
  .lp .pr span { font: 400 11px/1 "Urbanist", sans-serif; color: var(--mute); margin-left: 4px; }
  .lp .pr s { font: 400 11px/1 "Urbanist", sans-serif; color: #a39c8d; margin-left: 6px; }
  .lp .cta { position: absolute; left: 38px; bottom: 22px; height: 32px; padding: 0 16px; display: inline-flex; align-items: center; gap: 7px; border-radius: 999px; background: var(--navy); color: var(--gold-l); font: 600 11.5px/1 "Urbanist", sans-serif; letter-spacing: .05em; box-shadow: 0 3px 0 #0a1222, 0 6px 12px rgba(20,33,61,.3); cursor: pointer; transition: transform .12s, box-shadow .12s; white-space: nowrap; }

  .lp .thumbs img:hover { transform: translateY(-4px) rotate(-3deg); }

    return '<div class="lp" style="--c:' + c.tone + '" data-sp="' + s.n + '"><div class="k"><i></i>KIŞIN YENİ RENKLERİ</div>' +
      '<div class="ttl">' + c.tonename + '</div><div class="cat">' + c.label + '</div><div class="nm" data-nm>' + it.name + '</div>' +
      '<div class="pr"><b data-pr>' + AY.tl(it.price) + ' TL</b>' + (it.oldPrice ? '<s data-old>' + AY.tl(it.oldPrice) + ' TL</s>' : '<s data-old></s>') + '</div>' +
      '<div class="thumbs">' + c.items.map(function (x, k) { return '<img src="' + x.img + '" alt="' + x.name.replace(/"/g, "") + '" data-pick="' + k + '">'; }).join("") + '</div>' +
      '<div class="cta" data-go="' + s.n + '">Koleksiyona Git <b>→</b></div><div class="pg">' + (s.n + 1) + ' / ' + TOTAL + '</div></div>';
  }
  function rightPage(s) {
    var c = s.c, it = c.items[0], word = c.word.split("");
    var tiles = word.map(function (ch, i) {
      return '<div class="pop tile" style="left:' + (30 + i * 36) + 'px;bottom:26px;transition-delay:' + (.25 + i * .07) + 's"><b>' + ch + '</b></div>';
    }).join("");
    return '<div class="rp" style="--c:' + c.tone + '"><div class="ground"></div>' +
      '<div class="pop star" style="left:40px;top:26px;width:18px;height:18px;transition-delay:.8s">' + AY.star("#c9a35a") + '</div>' +
      '<div class="pop star" style="left:250px;top:40px;width:12px;height:12px;transition-delay:.9s">' + AY.star(c.tone) + '</div>' +
      '<div class="pop star" style="left:448px;top:30px;width:14px;height:14px;transition-delay:1s">' + AY.star("#e7cf98") + '</div>' +
      '<div class="pop photo" style="transition-delay:.1s"><img data-ph src="' + it.img + '" alt="' + it.name.replace(/"/g, "") + '"><div class="cap">' + c.chip.toUpperCase() + '</div></div>' +
      tiles +
      '<div class="pop tag" style="transition-delay:.5s"><div class="n">YENİ SEZON</div><div class="p"><span data-tp>' + AY.tl(it.price) + '</span><small>TL</small></div></div>' +
      (s.n < TOTAL - 1 ? '<div class="next">SAYFAYI ÇEVİR ' + ARROW + '</div><div class="curl"></div>' : '<div class="next" style="letter-spacing:.16em">ALTINYILDIZ CLASSICS ✦</div>') +
      '</div>';
  }

  /* ---------- kitabı kur ---------- */
  var book = $("book"), sheets = [];
  book.innerHTML = '<div class="base"></div>';
  var cover = document.createElement("div"); cover.className = "sheet";
  cover.innerHTML = '<div class="face right cover"><div class="spine"></div><div class="lg">' + AY.logo("#e7cf98") + '</div>' +
    '<div class="t1">SONBAHAR / KIŞ 2026</div><div class="t2 gold">Lookbook</div><div class="st">' + AY.star("#c9a35a") + '</div><div class="hintOpen">AÇMAK İÇİN DOKUN</div><div class="sheen"></div></div>' +
    '<div class="face back left">' + leftPage(SPREADS[0]) + '<div class="sheen"></div></div>';
  book.appendChild(cover); sheets.push(cover);
  for (var n = 0; n < TOTAL; n++) {
    var sh = document.createElement("div"); sh.className = "sheet";
    sh.innerHTML = '<div class="face right">' + rightPage(SPREADS[n]) + '<div class="sheen"></div></div>' +
      (n < TOTAL - 1 ? '<div class="face back left">' + leftPage(SPREADS[n + 1]) + '<div class="sheen"></div></div>' : '<div class="face back left"></div>');
    book.appendChild(sh); sheets.push(sh);
  }
  var dots = $("dots"); SPREADS.forEach(function () { dots.appendChild(document.createElement("span")); });

  /* ---------- sayfa çevirme ---------- */
  var flipped = 0;
  function zsort() { var N = sheets.length; sheets.forEach(function (s, i) { s.style.zIndex = i < flipped ? i + 1 : N - i + 1; }); }
  zsort();
  function activate() {
    sheets.forEach(function (s, i) { s.classList.toggle("on", i === flipped && flipped > 0); });
    Array.prototype.forEach.call(dots.children, function (d, i) { d.classList.toggle("on", i === flipped - 1); });
  }
  var busy = false;
  function flip(dir) {
    if (busy) return;
    var target = flipped + dir;
    if (target < 1 || target > TOTAL) return;
    busy = true;
    var s = dir > 0 ? sheets[flipped] : sheets[flipped - 1];
    s.style.zIndex = 50; s.classList.add("turning");
    sheets.forEach(function (x) { x.classList.remove("on"); });
    if (dir > 0) s.classList.add("flipped"); else s.classList.remove("flipped");
    flipped = target;
    if (flipped === 1) $("bookWrap").classList.add("open");
    setTimeout(function () { s.classList.remove("turning"); zsort(); activate(); busy = false; if (dir > 0) burst(485 + 360, 110, 16); }, 1150);
  }

  /* Küçük resme tıklayınca: o spread'in fotoğrafı, adı ve fiyatı değişir */
  function pick(sp, k) {
    var c = SPREADS[sp].c, it = c.items[k]; SPREADS[sp].sel = k;
    book.querySelectorAll('.lp[data-sp="' + sp + '"]').forEach(function (lp) {
      lp.querySelector("[data-nm]").textContent = it.name;
      lp.querySelector("[data-pr]").textContent = AY.tl(it.price) + " TL";
      lp.querySelector("[data-old]").textContent = it.oldPrice ? AY.tl(it.oldPrice) + " TL" : "";
    });
    var rp = sheets[sp + 1].querySelector(".rp");
    var ph = rp.querySelector(".photo");
    ph.style.transition = "none"; ph.style.transform = "rotateX(-70deg)"; void ph.offsetWidth;
    ph.style.transition = ""; ph.style.transform = "";
    rp.querySelector("[data-ph]").src = it.img;
    rp.querySelector("[data-tp]").textContent = AY.tl(it.price);
    burst(485 + 360, 100, 8);
  }

  book.addEventListener("click", function (e) {
    var t = e.target;
    var go = t.closest ? t.closest("[data-go]") : null;
    touched();
    if (go) { e.stopPropagation(); AY.exit(+go.dataset.go + 1); return; }
    if (t.dataset && t.dataset.pick !== undefined) { var lp = t.closest(".lp"); pick(+lp.dataset.sp, +t.dataset.pick); return; }
    if (t.closest && t.closest(".photo") && flipped > 0) { AY.exit(flipped); return; }
    var r = book.getBoundingClientRect();
    if (e.clientX - r.left >= 485) flip(1); else flip(-1);
  });
  $("next").addEventListener("click", function (e) { e.stopPropagation(); touched(); flip(1); });
  $("prev").addEventListener("click", function (e) { e.stopPropagation(); touched(); flip(-1); });
  document.addEventListener("keydown", function (e) { if (e.key === "ArrowRight") { touched(); flip(1); } else if (e.key === "ArrowLeft") { touched(); flip(-1); } });
  // Sürükleyerek sayfa çevirme (mobil)
  var sx = null;
  book.addEventListener("touchstart", function (e) { sx = e.touches[0].clientX; }, { passive: true });
  book.addEventListener("touchend", function (e) { if (sx === null) return; var dx = e.changedTouches[0].clientX - sx; if (Math.abs(dx) > 40) { touched(); flip(dx < 0 ? 1 : -1); } sx = null; });

  /* ---------- açılış + otomatik sayfalama (≤30 sn) ---------- */
  var idle = true, autoT = null, t0 = Date.now();
  function touched() { idle = false; AY.wake(); clearTimeout(autoT); autoT = setTimeout(function () { idle = true; auto(); }, 9000); }
  function auto() {
    if (!idle || Date.now() - t0 > 27000) return;
    if (flipped < TOTAL) { flip(1); autoT = setTimeout(auto, 4400); }
  }
  AY.ready(function () {
    setTimeout(function () { $("bookWrap").classList.add("in"); }, 200);
    setTimeout(function () { if (idle) { flip(1); autoT = setTimeout(auto, 4400); } }, 2200);
  });
})();
</script>
</body>
</html>
