<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="ad.size" content="width=970,height=250">
<title>Pluxee Geçiyor · 12'yi Geçiyor · 970×250</title>
<meta name="description" content="Pluxee Geçiyor kampanyası için media-first özel proje: 12'yi Geçiyor. Başlığı saat yazar, gövdeyi Türkiye'nin öğle arası cevabı yazar. 970x250 kahraman birim ve bağlam simülatörü.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@500;700;800&display=swap" rel="stylesheet">
<style>
:root{
  --pg:#221C46; --pg2:#2E2760; --pg3:#3A3375;
  --sg:#00EB5E; --sg20:rgba(0,235,94,.2);
  --w:#FFFFFF; --w70:rgba(255,255,255,.72); --w50:rgba(255,255,255,.5); --w12:rgba(255,255,255,.12);
  --font:"Manrope",Inter,-apple-system,"Segoe UI",Roboto,Arial,sans-serif;
}
*{box-sizing:border-box}
html,body{margin:0;padding:0;background:var(--pg);font-family:var(--font);-webkit-font-smoothing:antialiased}
body.dev{background:#0c0a1f;color:#fff;min-height:100vh}

/* ---------- 970x250 birim ---------- */
.unit{position:relative;width:970px;height:250px;overflow:hidden;background:var(--pg);color:var(--w);font-family:var(--font);cursor:pointer;user-select:none;outline:none;isolation:isolate}
.unit:focus-visible{box-shadow:inset 0 0 0 2px var(--sg)}
.unit.green{color:var(--pg)}
.wave{position:absolute;left:785px;top:80px;width:2400px;height:2400px;margin:-1200px 0 0 -1200px;border-radius:50%;background:var(--sg);transform:scale(0);transition:transform .9s cubic-bezier(.2,.8,.2,1);pointer-events:none;z-index:0}
.unit.green .wave{transform:scale(1)}
.unit>*:not(.wave){z-index:1}
.logo{position:absolute;left:20px;top:15px;display:flex;align-items:center;gap:1px;font-weight:800;font-size:26px;letter-spacing:-.03em;line-height:1}
.logo svg{width:24px;height:24px;margin:0 1px;animation:pulse 1.6s ease-in-out infinite;transform-origin:center}
.logo svg path{stroke:var(--sg)}
.unit.green .logo svg path{stroke:var(--pg)}
@keyframes pulse{0%,100%{transform:scale(1)}50%{transform:scale(1.08)}}
.left{position:absolute;left:20px;top:52px;width:585px}
.h1{margin:0;font-size:34px;line-height:38px;font-weight:800;letter-spacing:-.015em;max-height:82px;padding-bottom:6px;overflow:hidden;text-wrap:balance}
.h1 .pay{color:var(--sg);transition:opacity .3s}
.unit.green .h1 .pay{color:var(--pg)}
.sub{margin:8px 0 0;font-size:15px;line-height:20px;font-weight:500;color:var(--w70);max-height:40px;overflow:hidden}
.unit.green .sub{color:var(--pg)}
.ctas{position:absolute;left:20px;top:190px;display:flex;align-items:center;gap:14px}
.btn{height:36px;padding:0 18px;border-radius:18px;background:var(--sg);color:var(--pg);font-weight:800;font-size:14px;border:0;font-family:inherit;cursor:pointer;white-space:nowrap}
.btn:hover{filter:brightness(1.06)}
.lnk{background:none;border:0;color:var(--w70);font-size:13px;font-weight:700;text-decoration:underline;text-underline-offset:3px;cursor:pointer;font-family:inherit;padding:0}
.panel{position:absolute;left:620px;top:18px;width:330px;height:208px}
.tag{position:absolute;left:20px;bottom:7px;font-size:11px;font-weight:700;color:var(--w50);letter-spacing:.01em}
.unit.green .tag{color:var(--pg)}
.prog{position:absolute;left:0;bottom:0;width:100%;height:3px;background:var(--w12)}
.prog i{display:block;height:100%;width:0;background:var(--sg);transition:width .6s}
.fade-in{animation:fadein .3s ease both}
@keyframes fadein{from{opacity:0}to{opacity:1}}
.slide-r{animation:slider .4s cubic-bezier(.2,.8,.2,1) both}
@keyframes slider{from{opacity:0;transform:translateX(24px)}to{opacity:1;transform:none}}

/* saat paneli */
.clock{position:absolute;right:0;top:44px;text-align:right}
.clock .big{font-size:64px;line-height:64px;font-weight:800;color:var(--sg);font-variant-numeric:tabular-nums;letter-spacing:-.02em;transition:font-size .3s}
.clock .big.xl{font-size:80px;line-height:80px}
.unit.green .clock .big{color:var(--pg)}
.clock .lbl{font-size:13px;color:var(--w70);margin-top:8px;font-weight:700}
.unit.green .clock .lbl{color:var(--pg)}
.mclock{font-size:14px;color:var(--w70);font-weight:700;margin-bottom:8px;font-variant-numeric:tabular-nums;display:flex;justify-content:space-between;align-items:center}

/* çipler */
.chips{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.chip{height:40px;border-radius:20px;background:var(--pg3);color:var(--w);font-size:14px;font-weight:700;border:1px solid transparent;font-family:inherit;cursor:pointer;display:flex;align-items:center;gap:8px;padding:0 12px;text-align:left;animation:chipin .35s cubic-bezier(.2,.8,.2,1) both}
.chip svg{width:18px;height:18px;flex:none}
.chip:hover{background:var(--sg20);border-color:var(--sg)}
.chip.sel{background:var(--sg);color:var(--pg)}
.chip.wide{grid-column:1/-1;background:var(--sg);color:var(--pg);justify-content:center}
.chips.c3{grid-template-columns:repeat(3,1fr)}
.chips.c3 .chip{height:36px;font-size:12px;padding:0 8px;gap:6px}
@keyframes chipin{from{opacity:0;transform:translateX(-10px)}to{opacity:1;transform:none}}

/* barometre */
.baro .hd,.baro .ft{font-size:12px;color:var(--w70);font-weight:700;font-variant-numeric:tabular-nums}
.baro .hd{margin-bottom:6px;display:flex;justify-content:space-between}
.baro .ft{margin-top:6px}
.row{display:grid;grid-template-columns:104px 1fr 34px;align-items:center;gap:8px;height:22px;font-size:12px;font-weight:700}
.row .pct{text-align:right;font-variant-numeric:tabular-nums;color:var(--w70)}
.row.lead .pct{color:var(--sg)}
.bar{height:8px;border-radius:4px;background:var(--w12);overflow:hidden}
.bar i{display:block;height:100%;width:0;background:var(--w50);border-radius:4px;transition:width .8s cubic-bezier(.2,.8,.2,1)}
.row.lead .bar i{background:var(--sg)}
.baro.compact .row{height:18px;font-size:11px;grid-template-columns:90px 1fr 30px}
.baro.compact .bar{height:6px}

/* il derbisi */
.dhd{display:flex;justify-content:space-between;align-items:center;height:20px;margin-top:2px}
.derby{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:10px;position:relative}
.dcard{background:var(--pg2);border-radius:14px;padding:12px 14px;position:relative;overflow:hidden}
.dcard .il{font-size:13px;color:var(--w70);font-weight:700}
.dcard .opt{font-size:16px;font-weight:800;margin:8px 0 2px;display:flex;align-items:center;gap:8px}
.dcard .opt svg{width:22px;height:22px}
.dcard .pct{font-size:28px;font-weight:800;color:var(--sg);font-variant-numeric:tabular-nums;line-height:1}
.dcard .n{font-size:11px;color:var(--w50);margin-top:6px}
.badge{margin-left:auto;font-size:11px;font-weight:800;padding:3px 9px;border-radius:10px;background:var(--sg20);color:var(--sg)}
.rain{display:flex;align-items:center;gap:5px;font-size:11px;font-weight:700;color:var(--w70);animation:drop .4s ease both}
.rain svg{width:14px;height:14px}
@keyframes drop{from{opacity:0;transform:translateY(-8px)}to{opacity:1;transform:none}}

/* işveren minyatürü */
.mini .lbl{font-size:11px;color:var(--w50);font-weight:700;margin-bottom:5px}
.mini .frame{width:322px;height:85px;overflow:hidden;border:1px solid var(--sg20);border-radius:8px;position:relative;background:var(--pg)}
.mini .frame .unit{position:absolute;left:0;top:0;transform:scale(.33);transform-origin:0 0;pointer-events:none;cursor:default}
.mini .baro{margin-top:8px}

/* kod kutusu */
.code{display:flex;align-items:center;justify-content:space-between;background:var(--pg2);border-radius:10px;height:44px;padding:0 14px;margin-bottom:8px}
.code b{color:var(--sg);font-size:16px;letter-spacing:.08em;font-variant-numeric:tabular-nums}
.code button{background:none;border:0;color:var(--w70);font-size:12px;font-weight:700;cursor:pointer;font-family:inherit}
.code button:hover{color:var(--w)}

/* kapanış birleşmesi: gezilen mecralar tek yeşil çizgide toplanır, çizgi x'e varır */
.merge{position:relative;height:150px;margin-top:34px}
.merge .mi{position:absolute;top:22px;width:64px;text-align:center;font-size:11px;font-weight:700;color:var(--w70);animation:fadein .4s ease both}
.merge .mi svg{width:26px;height:26px;display:block;margin:0 auto 6px;background:var(--pg);border-radius:50%;padding:2px}
.merge .mi:nth-child(1){left:0;animation-delay:.1s}
.merge .mi:nth-child(2){left:86px;animation-delay:.4s}
.merge .mi:nth-child(3){left:172px;animation-delay:.7s}
.merge .line{position:absolute;left:30px;top:35px;height:3px;width:0;background:var(--sg);border-radius:2px;animation:linegrow .9s .9s cubic-bezier(.2,.8,.2,1) both;z-index:-1}
@keyframes linegrow{to{width:246px}}
.merge .xm{position:absolute;left:266px;top:12px;width:48px;height:48px;opacity:0;animation:xin .4s 1.7s ease both}
.merge .xm path{stroke:var(--sg)}
@keyframes xin{to{opacity:1}}
.merge .cap{position:absolute;left:0;right:0;top:92px;text-align:left;font-size:12px;font-weight:700;color:var(--w70);opacity:0;animation:xin .4s 2s ease both}

/* Ramazan / sakin */
.calm{position:absolute;right:0;top:60px;text-align:right}
.calm .t{font-size:22px;font-weight:800;color:var(--sg)}
.calm .l{font-size:13px;color:var(--w70);font-weight:700;margin-top:6px}

@media (prefers-reduced-motion:reduce){
  .logo svg,.chip,.merge .mi,.merge .line,.merge .xm,.merge .cap,.rain{animation:none!important;opacity:1;transform:none}
  .wave{transition:none}.bar i{transition:none}
}

/* ---------- sunum kabuğu (yalnız dev modunda) ---------- */
.stage{display:none;width:970px;margin:26px auto 40px}
body.dev .stage{display:block}
body.dev #unitHost{box-shadow:0 30px 80px rgba(0,0,0,.55);border-radius:2px}
body:not(.dev) #unitHost{position:absolute;left:0;top:0}
.hdr{display:flex;justify-content:space-between;align-items:baseline;font-size:12px;color:rgba(255,255,255,.55);margin-bottom:10px}
.hdr b{color:#fff;font-size:14px}
.hdr .ctx{font-variant-numeric:tabular-nums;color:var(--sg);font-weight:700}
.sim{margin-top:14px;background:#15112e;border-radius:12px;padding:12px 14px;font-size:12px}
.grp{display:flex;flex-wrap:wrap;align-items:center;gap:6px;margin:6px 0}
.grp .l{width:58px;flex:none;color:rgba(255,255,255,.45);font-size:10px;text-transform:uppercase;letter-spacing:.08em;font-weight:800}
.pill{border:1px solid rgba(255,255,255,.16);background:transparent;color:#fff;border-radius:999px;padding:4px 10px;font-size:12px;cursor:pointer;font-family:inherit;font-weight:600}
.pill:hover{border-color:rgba(255,255,255,.45)}
.pill.on{background:var(--sg);color:var(--pg);border-color:var(--sg);font-weight:800}
.pill.act{border-color:var(--sg);color:var(--sg)}
.pill.act.on{color:var(--pg)}
.sim input[type=range]{width:250px;accent-color:var(--sg);margin:0 6px}
.sim .tm{font-variant-numeric:tabular-nums;font-weight:800;color:var(--sg);min-width:44px;display:inline-block}
.sim .note{margin-top:8px;color:rgba(255,255,255,.4);font-size:11px;line-height:1.5}
.sep{width:1px;height:18px;background:rgba(255,255,255,.12);margin:0 4px}
#triple{margin-top:20px;display:none}
#triple .tl{font-size:12px;color:rgba(255,255,255,.55);margin:14px 0 6px;font-weight:700}
#triple .tl b{color:var(--sg)}
</style>
</head>

/* ---------- yardımcılar ---------- */
function fmt(n) { return String(Math.round(n)).replace(/\B(?=(\d{3})+(?!\d))/g, '.'); }
function pad(n) { return (n < 10 ? '0' : '') + n; }
function lead(pay) { var m = 0; for (var i = 1; i < pay.length; i++) if (pay[i] > pay[m]) m = i; return m; }
function nLive(nFinal, t) { if (t < 718) return 0; if (t >= 840) return nFinal; return Math.round(nFinal * (1 - Math.exp(-(t - 718) / 25))); }
function tpl(s, o) { return s.replace(/\{(\w+)\}/g, function (_, k) { return o[k] != null ? o[k] : ''; }); }
function esc(s) { return String(s).replace(/[&<>"]/g, function (c) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]; }); }

/* Türkçe saat formülü: başlığı metin yazarı değil saat yazar */
var ACC = { 12: "12'yi", 1: 'Biri', 2: 'İkiyi', 3: 'Üçü', 4: 'Dördü', 5: 'Beşi', 6: 'Altıyı', 7: 'Yediyi', 8: 'Sekizi', 9: 'Dokuzu', 10: 'Onu', 11: 'On biri' };
var DAT = { 12: "12'ye", 1: 'Bire', 2: 'İkiye', 3: 'Üçe', 4: 'Dörde', 5: 'Beşe', 6: 'Altıya', 7: 'Yediye', 8: 'Sekize', 9: 'Dokuza', 10: 'Ona', 11: 'On bire' };
var NOM = { 12: '12', 1: 'bir', 2: 'iki', 3: 'üç', 4: 'dört', 5: 'beş', 6: 'altı', 7: 'yedi', 8: 'sekiz', 9: 'dokuz', 10: 'on', 11: 'on bir' };
function h12(h) { return ((h % 12) + 11) % 12 + 1; }
function cap(s) { return s.charAt(0).toUpperCase() + s.slice(1); }
function saatCumlesi(h, m) {
  var t = h * 60 + m;
  if (t < 710) { /* 12'ye uzak: geri sayım */
    var d = 720 - t, H = Math.floor(d / 60), M = d % 60;
    return "12'ye " + (H ? H + ' saat ' : '') + (M ? M + ' dakika ' : '') + 'var.';
  }
  var hh = h12(h), nh = h12(h + 1);
  if (m === 0) return hh === 12 ? 'Saat 12.' : 'Saat ' + NOM[hh] + '.';
  if (m === 30) return hh === 12 ? 'On iki buçuk.' : cap(NOM[hh]) + ' buçuk.';
  if (m === 15) return ACC[hh] + ' çeyrek geçiyor.';
  if (m === 45) return DAT[nh] + ' çeyrek var.';
  if (m < 30) return ACC[hh] + ' ' + m + ' geçiyor.';
  return DAT[nh] + ' ' + (60 - m) + ' var.';
}
function payoff(h1) {
  if (h1 === 'Saat 12.') return 'Öğle arası. Pluxee de.';
  if (h1 === 'On iki buçuk.') return 'Yarısı geçti; Pluxee de burada.';
  if (h1 === 'Saat bir.') return 'Geç çıkanlar için de.';
  if (h1 === 'Saat iki.') return 'Öğle arası geçti.';
  if (/var\.$/.test(h1)) return 'Pluxee de var.';
  return 'Pluxee de.';
}
function iftarMin(city) { var s = (city ? city.iftar : '19:40').split(':'); return (+s[0]) * 60 + (+s[1]); }

/* barometre kapsamı: il ≥ 300 oy → il; yoksa bölge; yoksa Türkiye */
function scopeOf(st, t) {
  var c = CITIES[st.city];
  if (!c || st.data === 'none') return { ad: TR.ad, da: TR.da, n: nLive(TR.nFinal, t), pay: TR.pay, kind: 'tr' };
  var n = nLive(c.nFinal, t);
  if (st.data === 'low' || n < 300) {
    var b = BOLGE[c.bolge];
    if (b && nLive(b.nFinal, t) >= 100) return { ad: c.bolge, da: b.da, n: nLive(b.nFinal, t), pay: b.pay, kind: 'bolge' };
    return { ad: TR.ad, da: TR.da, n: nLive(TR.nFinal, t), pay: TR.pay, kind: 'tr' };
  }
  return { ad: c.ad, da: c.da, n: n, pay: c.pay, kind: 'il' };
}
function optOf(k, list) { list = list || OPTS; for (var i = 0; i < list.length; i++) if (list[i].k === k) return list[i]; return null; }

function buildRamazan(st, t, city, cat, b2b, v) {

  if (d > 90) {

      v.panel = { type: 'baro', scope: { ad: c.ad, n: Math.round(c.nFinal * .6), pay: RPAY }, list: ROPTS, sel: vi, label: 'İftar ' + c.iftar };

    var t = document.createElement('div'); t.className = 'tl'; t.innerHTML = '<b>Aynı dakika, üç bağlam:</b> ' + it[0]; tr.appendChild(t);
    var h = document.createElement('div'); tr.appendChild(h);
    var st = {}; for (var k in base) st[k] = base[k]; for (var k2 in it[1]) st[k2] = it[1][k2];
    var u = createUnit(h, { interactive: false }); u.render(st);
  });
}

if (DEV) { document.body.classList.add('dev'); buildSim(); loopStart(); }
else render();
})();
</script>
</body>
