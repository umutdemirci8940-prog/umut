<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="ad.size" content="width=970,height=250">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1">
<!-- Boyutlar: 970x250, 320x480 (aynı dosya; alan genişliğine göre yerleşim değiştirir) -->
<title>Coffy – Çok da Coffy – En Yakın Coffy (Konum)</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700;800&amp;family=Manrope:wght@500;600;700;800&amp;display=swap" rel="stylesheet">
<style>:root{--W:100vw;--H:100vh}
:root{
  /* Coffy kimliği: siyah zemin, beyaz yazı; vurgu kahve tonları */
  --esp:#0b0b0b;--roast:#1c1c1c;--bean:#5a3422;--cream:#ffffff;--foam:#ffffff;
  --acc:#c8864e;--acc2:#e9d1ad;--mint:#5fe0bd;--pink:#ff8fb3;--ink:#0b0b0b;
  --h:'Barlow Condensed','Manrope',system-ui,sans-serif;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{width:var(--W);height:var(--H);overflow:hidden;background:var(--esp)}
body{font-family:'Manrope',system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;color:var(--cream);-webkit-font-smoothing:antialiased;-webkit-user-select:none;user-select:none;-webkit-tap-highlight-color:transparent;touch-action:manipulation}
button{font:inherit;color:inherit}
.ad{position:relative;width:var(--W);height:var(--H);overflow:hidden;isolation:isolate;
  background:radial-gradient(120% 80% at 80% -10%,rgba(200,134,78,.22),transparent 55%),radial-gradient(90% 60% at -10% 110%,rgba(233,209,173,.08),transparent 60%),var(--esp)}
.ad::after{content:"";position:absolute;inset:0;pointer-events:none;z-index:50;box-shadow:inset 0 0 0 1px rgba(255,255,255,.08)}
.hd{font-family:var(--h);font-weight:700;letter-spacing:.005em;line-height:.95;text-transform:uppercase}
.scene{position:absolute;inset:0;opacity:0;visibility:hidden;transition:opacity .45s ease,visibility .45s}
.scene.on{opacity:1;visibility:visible}

/* logo */
.logo{display:inline-flex;align-items:center;gap:5px;font-family:var(--h);font-weight:800;letter-spacing:-.05em;font-size:22px;line-height:1;color:var(--cream);text-decoration:none}
.logo img,.logo svg{display:block;height:1em;width:auto;fill:currentColor}
.ad-logo{position:absolute;z-index:30;top:14px;left:14px;font-size:17px}

/* butonlar */
.btn{appearance:none;border:0;cursor:pointer;display:inline-flex;align-items:center;justify-content:center;gap:7px;font-weight:800;font-size:14px;line-height:1;border-radius:999px;padding:13px 18px;background:#fff;color:var(--ink);box-shadow:0 8px 22px -10px rgba(255,255,255,.45);transition:transform .2s,background .2s;text-transform:uppercase;letter-spacing:.04em}
.btn:active{transform:scale(.96)}
.btn.alt{background:var(--acc2);color:var(--ink);box-shadow:none}
.btn.ghost{background:rgba(255,255,255,.08);color:var(--cream);box-shadow:inset 0 0 0 1.5px rgba(255,255,255,.22)}
.btn .pin{width:12px;height:12px;flex:none}.btn .pin svg{fill:currentColor;width:12px;height:12px;display:block}
.pulse{animation:pulse 1.6s ease-in-out infinite}
@keyframes pulse{0%,100%{transform:scale(1)}50%{transform:scale(1.05)}}
.btn:focus-visible,.opt:focus-visible{outline:2px solid var(--acc2);outline-offset:2px}

/* slogan */
.slogan{display:inline-flex;flex-direction:column;align-items:flex-start;font-family:var(--h);font-weight:700;letter-spacing:.01em;line-height:.86;color:var(--cream);text-transform:uppercase}
.slogan .s1{font-size:.5em;letter-spacing:.06em;color:var(--acc2);margin-left:.04em}
.slogan .s2{position:relative;font-size:1em}
.slogan .s2 i{font-style:normal;color:var(--acc)}
.slogan .sw{position:absolute;left:0;right:-.1em;bottom:-.16em;height:.22em;width:100%;overflow:visible}
.slogan .sw path{stroke:var(--acc);stroke-width:5;fill:none;stroke-linecap:round;stroke-dasharray:220;stroke-dashoffset:220;animation:draw .9s .35s cubic-bezier(.6,0,.2,1) forwards}
@keyframes draw{to{stroke-dashoffset:0}}

/* ürün (orijinal görsel) ve dolum efekti */
.prod{display:block;height:100%;width:auto;-webkit-user-drag:none;user-select:none;pointer-events:none}
.pf{position:relative;display:inline-block;height:160px;line-height:0;--fill:1}
.pf::after{content:"";position:absolute;left:12%;right:12%;bottom:-4px;height:10px;border-radius:50%;background:radial-gradient(closest-side,rgba(0,0,0,.6),transparent);z-index:-1}
.pf .ghost{filter:grayscale(1) brightness(.5);opacity:.28}
.pf .full{position:absolute;left:0;top:0;clip-path:inset(calc((1 - var(--fill)) * 100%) 0 0 0);transition:clip-path .7s cubic-bezier(.3,1.3,.5,1)}
.pf .lvl{position:absolute;left:10%;right:10%;height:2px;top:calc((1 - var(--fill)) * 100%);background:rgba(255,255,255,.7);filter:blur(.6px);box-shadow:0 0 10px rgba(255,255,255,.6);transition:top .7s cubic-bezier(.3,1.3,.5,1);opacity:calc((1 - var(--fill)) * 6)}

/* 3B: eğim */
.tilt{transform:perspective(700px) rotateX(var(--rx,0deg)) rotateY(var(--ry,0deg));transition:transform .35s cubic-bezier(.2,.8,.2,1);transform-style:preserve-3d}
.sway{animation:sway3d 5s ease-in-out infinite}
@keyframes sway3d{0%,100%{transform:perspective(700px) rotateY(-14deg) rotateX(4deg)}50%{transform:perspective(700px) rotateY(14deg) rotateX(-2deg)}}

/* 3B: ürün karuseli */
.ring{position:relative;perspective:900px;transform-style:preserve-3d;cursor:grab;touch-action:pan-y}
.ring .ri{position:absolute;left:50%;bottom:22px;height:calc(100% - 34px);transform-origin:50% 100%;will-change:transform}
.ring .ri .prod{filter:drop-shadow(0 14px 14px rgba(0,0,0,.55))}
.ring .floor{position:absolute;left:8%;right:8%;bottom:12px;height:22px;border-radius:50%;background:radial-gradient(closest-side,rgba(200,134,78,.38),transparent);z-index:-1}
.ring .cap{position:absolute;left:0;right:0;bottom:-4px;text-align:center;font-family:var(--h);font-weight:700;font-size:13px;letter-spacing:.14em;text-transform:uppercase;color:var(--acc2);z-index:200}

/* 3B: kart çevirme */
.flip{perspective:1000px}
.flip .fi{position:relative;width:100%;height:100%;transform-style:preserve-3d;transition:transform .95s cubic-bezier(.3,1.25,.4,1)}
.flip.on .fi{transform:rotateY(180deg)}
.flip .fa,.flip .fb{position:absolute;inset:0;-webkit-backface-visibility:hidden;backface-visibility:hidden}
.flip .fb{transform:rotateY(180deg)}

/* video katmanı */
.vid{position:absolute;inset:0;overflow:hidden;background:#000;container-type:size}
.vid video{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.vid .skip{position:absolute;z-index:5;right:10px;bottom:10px;border:0;cursor:pointer;border-radius:999px;padding:7px 12px;font-size:11px;font-weight:800;background:rgba(0,0,0,.55);color:#fff;backdrop-filter:blur(6px);opacity:0;transform:translateY(6px);transition:.3s}
.vid .skip.on{opacity:1;transform:none}
.vid .snd{position:absolute;z-index:5;left:10px;bottom:10px;width:30px;height:30px;border:0;border-radius:50%;cursor:pointer;background:rgba(0,0,0,.55);display:grid;place-items:center}
.vid .snd svg{width:15px;height:15px;fill:#fff}
.vid .bar{position:absolute;z-index:5;left:0;bottom:0;height:3px;background:var(--acc);width:0}

/* açılış (ana video gelene kadar) – 5 sn sinematik sekans; .loop iken sürekli döner */
.vph{position:absolute;inset:0;overflow:hidden;background:radial-gradient(70% 90% at 50% 60%,#1d140e,#070707 70%)}
.vph *{animation-duration:5s;animation-fill-mode:both;animation-timing-function:cubic-bezier(.2,.8,.2,1)}
.vph.loop *{animation-iteration-count:infinite}
.op-ph{position:absolute;inset:0;background-size:cover;background-position:50% 45%;opacity:0;animation-name:opPh}
.op-sh{position:absolute;inset:0;background:linear-gradient(90deg,rgba(0,0,0,.82),rgba(0,0,0,.3) 70%),linear-gradient(0deg,rgba(0,0,0,.6),transparent 55%);opacity:0;animation-name:opPh}
@keyframes opPh{0%,15%{opacity:0;transform:scale(1.18)}22%{opacity:1}62%{opacity:1}70%,100%{opacity:0;transform:scale(1)}}
.op-logo{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);font-size:min(18cqh,11cqw);color:#fff;animation-name:opLogo;overflow:hidden;padding:.08em .1em}
.op-logo .logo{font-size:1em}
.op-gl{position:absolute;top:-20%;bottom:-20%;width:40%;left:-60%;background:linear-gradient(90deg,transparent,rgba(255,255,255,.75),transparent);transform:skewX(-20deg);mix-blend-mode:overlay;animation-name:opGl}
@keyframes opLogo{0%{opacity:0;clip-path:inset(0 100% 0 0);letter-spacing:.3em}3%{opacity:1}12%{clip-path:inset(0 0 0 0)}17%{opacity:1;transform:translate(-50%,-50%) scale(1)}22%,100%{opacity:0;transform:translate(-50%,-50%) scale(1.25)}}
@keyframes opGl{0%,8%{left:-60%}18%,100%{left:130%}}
.vph-w{position:absolute;left:8cqw;right:8cqw;top:50%;transform:translateY(-50%);font-family:var(--h);font-weight:700;letter-spacing:.01em;text-transform:uppercase;line-height:.9;font-size:min(13cqw,24cqh);color:#fff;opacity:0;text-shadow:0 6px 30px rgba(0,0,0,.6)}
.vph-w em{font-style:normal;color:var(--acc2)}
.vph .w1{animation-name:vw1}.vph .w2{animation-name:vw2}.vph .w3{animation-name:vw3}
@keyframes vw1{0%,21%{opacity:0;transform:translateY(-20%);filter:blur(8px)}25%,35%{opacity:1;transform:translateY(-50%);filter:blur(0)}39%,100%{opacity:0;transform:translateY(-80%)}}
@keyframes vw2{0%,38%{opacity:0;transform:translateY(-20%);filter:blur(8px)}42%,51%{opacity:1;transform:translateY(-50%);filter:blur(0)}55%,100%{opacity:0;transform:translateY(-80%)}}
@keyframes vw3{0%,54%{opacity:0;transform:translateY(-50%) scale(.6)}58%,63%{opacity:1;transform:translateY(-50%) scale(1)}67%,100%{opacity:0;transform:translateY(-50%) scale(1.8);filter:blur(6px)}}
/* ürün sahnesi */
.op-hero{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;gap:5cqw;opacity:0;animation-name:opHero}
@keyframes opHero{0%,63%{opacity:0}67%,97%{opacity:1}100%{opacity:0}}
.vph:not(.loop) .op-hero{animation-name:opHeroStay}
@keyframes opHeroStay{0%,63%{opacity:0}67%,100%{opacity:1}}
.op-stage{position:relative;height:78cqh;aspect-ratio:.55;perspective:900px}
.op-spot{position:absolute;left:-90%;right:-90%;top:-40%;bottom:-6%;background:radial-gradient(40% 55% at 50% 45%,rgba(233,209,173,.32),transparent 70%),conic-gradient(from 180deg at 50% -10%,transparent 165deg,rgba(255,240,220,.16) 180deg,transparent 195deg);opacity:0;animation-name:opSpot}
@keyframes opSpot{0%,64%{opacity:0}74%,100%{opacity:1}}
.op-prod{position:absolute;left:0;right:0;bottom:12%;height:82%;display:flex;justify-content:center;transform-style:preserve-3d;animation-name:opProd}
.op-prod .prod{height:100%;filter:drop-shadow(0 18px 22px rgba(0,0,0,.7))}
@keyframes opProd{0%,63%{opacity:0;transform:translateY(40%) rotateY(-220deg) scale(.7)}76%{opacity:1;transform:translateY(-3%) rotateY(8deg) scale(1.02)}84%,100%{opacity:1;transform:translateY(0) rotateY(0) scale(1)}}
.op-sweep{position:absolute;inset:0;margin:auto;height:100%;aspect-ratio:var(--ar,.52);background:linear-gradient(105deg,transparent 30%,rgba(255,255,255,.55) 45%,transparent 60%);background-size:300% 100%;-webkit-mask-size:contain;mask-size:contain;-webkit-mask-repeat:no-repeat;mask-repeat:no-repeat;-webkit-mask-position:center;mask-position:center;mix-blend-mode:screen;animation-name:opSweep}
@keyframes opSweep{0%,80%{background-position:100% 0}94%,100%{background-position:0 0}}
.op-ref{position:absolute;left:0;right:0;top:88%;height:82%;display:flex;justify-content:center;transform:scaleY(-1);opacity:0;-webkit-mask-image:linear-gradient(to top,rgba(0,0,0,.35),transparent 45%);mask-image:linear-gradient(to top,rgba(0,0,0,.35),transparent 45%);animation-name:opRef}
.op-ref .prod{height:100%}
@keyframes opRef{0%,72%{opacity:0}84%,100%{opacity:1}}
.op-sl{display:flex;flex-direction:column;font-family:var(--h);font-weight:700;text-transform:uppercase;line-height:.86;color:#fff}
.op-sl b{display:flex;font-weight:700}
.op-sl .s1{font-size:min(9cqw,17cqh);color:var(--acc2);letter-spacing:.06em}
.op-sl .s2{font-size:min(19cqw,36cqh)}
.op-sl .s2 i{font-style:normal;color:var(--acc);display:inline-block;opacity:0;animation-name:opL;animation-delay:calc(5s * .86)}
.vph:not(.loop) .op-sl .s2 i{animation-delay:.6s}
.op-sl span{display:inline-block;opacity:0;animation-name:opL}
.op-sl small{font-family:Manrope,sans-serif;font-weight:700;font-size:min(3.2cqw,6cqh);letter-spacing:.18em;color:rgba(255,255,255,.6);margin-top:.9em;opacity:0;animation-name:opSm}
@keyframes opL{0%,70%{opacity:0;transform:translateY(60%) rotateX(-80deg);filter:blur(6px)}78%,100%{opacity:1;transform:none;filter:blur(0)}}
@keyframes opSm{0%,82%{opacity:0}90%,100%{opacity:1}}
.op-sl span{animation-delay:calc(var(--i) * 45ms)}
.op-bar{position:absolute;left:0;bottom:0;height:3px;width:100%;background:var(--acc);transform-origin:left;animation-name:opBar;animation-timing-function:linear}
@keyframes opBar{from{transform:scaleX(0)}to{transform:scaleX(1)}}
@container (aspect-ratio < 1){.op-hero{flex-direction:column;gap:2cqh}.op-stage{height:52cqh}.op-sl{align-items:center}.op-sl .s1{font-size:9cqw}.op-sl .s2{font-size:22cqw}.op-sl small{font-size:3.4cqw}}
.vph-tag{position:absolute;z-index:4;top:10px;right:10px;display:flex;align-items:center;gap:6px;padding:5px 9px 5px 8px;border-radius:999px;background:rgba(0,0,0,.45);font-size:9.5px;font-weight:800;letter-spacing:.08em;color:rgba(255,255,255,.85)}
.vph-tag::before{content:"";width:0;height:0;border-left:7px solid var(--acc);border-top:4.5px solid transparent;border-bottom:4.5px solid transparent}

/* küçük yardımcılar */
.kicker{font-size:11px;font-weight:800;letter-spacing:.16em;text-transform:uppercase;color:var(--acc2)}
.muted{color:rgba(251,239,223,.7)}
.smp{font-style:normal;opacity:.6}
.sample{position:absolute;z-index:40;right:6px;bottom:4px;font-size:8px;font-weight:700;letter-spacing:.06em;color:rgba(255,255,255,.45);text-transform:uppercase;pointer-events:none}
.legal{position:absolute;z-index:40;left:8px;bottom:4px;font-size:8px;color:rgba(255,255,255,.4);pointer-events:none}
.hint{position:absolute;z-index:20;width:34px;height:34px;pointer-events:none;animation:tap 1.4s ease-in-out infinite}
.hint::before{content:"";position:absolute;inset:0;border-radius:50%;background:rgba(255,255,255,.9);box-shadow:0 0 0 0 rgba(255,255,255,.6);animation:ring 1.4s ease-out infinite}
@keyframes tap{0%,100%{transform:scale(1)}50%{transform:scale(.8)}}
@keyframes ring{0%{box-shadow:0 0 0 0 rgba(255,255,255,.55)}100%{box-shadow:0 0 0 18px rgba(255,255,255,0)}}
.bean{position:absolute;width:14px;height:18px;pointer-events:none}
.burst i{position:absolute;left:50%;top:50%;width:10px;height:14px;border-radius:50%;background:var(--bean);opacity:0;animation:fly 1.1s cubic-bezier(.2,.7,.3,1) forwards}
.burst i::after{content:"";position:absolute;left:45%;top:10%;width:1.5px;height:80%;border-radius:2px;background:rgba(0,0,0,.35);transform:rotate(8deg)}
.burst i.c{width:9px;height:9px;border-radius:2px}
@keyframes fly{0%{opacity:1;transform:translate(-50%,-50%) scale(.4)}100%{opacity:0;transform:translate(calc(-50% + var(--x)),calc(-50% + var(--y))) rotate(var(--r)) scale(1)}}

/* bitiş kartı */
.end{display:flex;flex-direction:column;align-items:center;text-align:center;height:100%;padding:42px 18px 16px}
.end .slogan{font-size:52px;margin-top:4px}
.end .er{width:100%;height:132px;margin:6px 0 0}
.end .k{margin-top:4px}
.end .lead{font-size:12.5px;line-height:1.35;font-weight:600;max-width:270px;margin-top:6px;color:rgba(251,239,223,.82)}
.end .ctas{display:flex;flex-direction:column;gap:7px;width:100%;margin-top:auto}
.end .ctas .btn{width:100%;padding:12px 16px}
.store{display:flex;align-items:center;gap:10px;width:100%;padding:8px 12px;border-radius:14px;background:rgba(255,255,255,.07);text-align:left}
.store .pinw{width:30px;height:30px;flex:none;border-radius:50%;background:#fff;display:grid;place-items:center}
.store .pinw svg{width:14px;height:14px;fill:#0b0b0b}
.store b{display:block;font-size:13px}
.store small{display:block;font-size:11px;color:rgba(251,239,223,.7);margin-top:2px}
.store .dist{margin-left:auto;font-family:var(--h);font-weight:700;font-size:21px;color:var(--acc2);white-space:nowrap}
.end.in .slogan,.end.in .er,.end.in .lead,.end.in .store,.end.in .ctas{animation:rise .6s both}
.end.in .er{animation-delay:.1s}.end.in .lead{animation-delay:.2s}.end.in .store{animation-delay:.3s}.end.in .ctas{animation-delay:.4s}
@keyframes rise{from{opacity:0;transform:translateY(16px)}to{opacity:1;transform:none}}

/* bitiş kartı – 970x250 */
.ad.w .end{display:grid;grid-template-columns:330px 1fr 300px;grid-template-rows:auto auto 1fr;grid-template-areas:"k er ctas" "s er ctas" "l er ctas";align-items:start;text-align:left;padding:52px 26px 20px;column-gap:20px}
.ad.w .end .k{grid-area:k;margin:0}
.ad.w .end .slogan{grid-area:s;font-size:64px;margin-top:6px}
.ad.w .end .lead{grid-area:l;max-width:320px;font-size:13px;margin-top:14px}
.ad.w .end .er{grid-area:er;align-self:center;height:206px;margin:-26px 0 0}
.ad.w .end .ctas{grid-area:ctas;align-self:center;margin:-30px 0 0}
.ad.w .end .store{margin-bottom:2px}
.ad.w .ad-logo{top:18px;left:26px;font-size:19px}
@media (prefers-reduced-motion:reduce){*{animation-duration:.01s!important;animation-iteration-count:1!important;transition-duration:.01s!important}}


.m6{overflow:hidden;background:#0b0b0b}
.plane{position:absolute;transform-origin:50% 100%;transform:perspective(900px) rotateX(52deg);transform-style:preserve-3d}
.plane .map{display:block}
.route{position:absolute;left:0;top:0;pointer-events:none;overflow:visible}
.route path{fill:none;stroke:var(--acc2);stroke-width:6;stroke-linecap:round;stroke-linejoin:round;stroke-dasharray:3 12}
.route path.anim{animation:dash 1s linear infinite}
@keyframes dash{to{stroke-dashoffset:-30}}
.me{position:absolute;width:22px;height:22px;margin:-11px 0 0 -11px;border-radius:50%;background:#4aa3ff;border:4px solid #fff;animation:me 1.8s ease-out infinite}
@keyframes me{0%{box-shadow:0 0 0 0 rgba(74,163,255,.6)}100%{box-shadow:0 0 0 34px rgba(74,163,255,0)}}
.anc{position:absolute;width:2px;height:2px;margin:-1px}
.spin{position:absolute;width:0;height:0;z-index:4}
.spin .pb{position:absolute;left:0;bottom:30px;transform:translateX(-50%);padding:8px 12px;border-radius:12px;background:#fff;color:#0b0b0b;box-shadow:0 18px 30px -8px rgba(0,0,0,.8);white-space:nowrap;animation:pin .9s cubic-bezier(.3,1.6,.5,1) both}
.spin .pb .logo{font-size:20px;color:#0b0b0b}
.spin>i{position:absolute;left:-2px;bottom:0;width:4px;height:32px;background:linear-gradient(#fff,rgba(255,255,255,.2))}
.spin::after{content:"";position:absolute;left:-20px;top:-8px;width:40px;height:16px;border-radius:50%;background:radial-gradient(closest-side,rgba(200,134,78,.8),transparent)}
@keyframes pin{from{transform:translate(-50%,-60px);opacity:0}to{transform:translate(-50%,0);opacity:1}}
.top6{position:absolute;left:0;right:0;top:0;padding:46px 16px 60px;background:linear-gradient(#0b0b0b 55%,transparent)}
.chip{display:inline-flex;font-size:10.5px;font-weight:800;letter-spacing:.12em;padding:5px 9px;border-radius:999px;background:rgba(255,255,255,.12);color:var(--acc2)}
.top6 h2{font-size:32px;margin-top:8px}
.top6 h2 em{font-style:normal;color:var(--acc2)}
.sheet{position:absolute;left:8px;right:8px;bottom:8px;padding:14px;border-radius:22px;background:#fff;color:var(--ink);box-shadow:0 -10px 30px -10px rgba(0,0,0,.6);transform:translateY(110%);transition:transform .6s cubic-bezier(.3,1.2,.5,1)}
.sheet.on{transform:none}
.sh-h{display:flex;align-items:center;gap:10px}
.sh-h .sp{height:58px;flex:none;margin:-22px 0 -6px -4px}
.sh-h b{display:block;font-size:15px}.sh-h small{display:block;font-size:11.5px;font-weight:600;color:rgba(11,11,11,.65);margin-top:2px}
.sh-h .dist{margin-left:auto;font-size:28px;color:var(--acc);white-space:nowrap}

  $$('[data-exit]', root).forEach(function (b) {
    if (b._bound) return; b._bound = 1;
    b.addEventListener('click', function (e) { e.stopPropagation(); var n = b.getAttribute('data-exit'); exit(n, C.exits[n]); });
  });
}

/* ---------- sahne yönetimi ---------- */
function show(el) {
  if (typeof el === 'string') el = $(el);
  $$('.scene', el.parentNode).forEach(function (s) { if (s.parentNode === el.parentNode) s.classList.toggle('on', s === el); });
  track('scene_' + (el.id || 'x'));
  return el;
}

/* ---------- gün dilimi (dinamik metin) ---------- */
function daypart() {
  var f = Q.get('dp'); if (f) return f;
  var h = new Date().getHours();
  return h < 5 ? 'night' : h < 11 ? 'morning' : h < 17 ? 'noon' : h < 22 ? 'evening' : 'night';
}
function clock() {
  var f = Q.get('time'); if (f) return f;
  var d = new Date(); return ('0' + d.getHours()).slice(-2) + ':' + ('0' + d.getMinutes()).slice(-2);
}

/* ---------- ürünler (coffy.com.tr menüsündeki orijinal görseller, dekupe) ---------- */
function P(key) { return C.products[key] || C.products[C.hero]; }
function prodImg(key, cls) { var p = P(key); return '<img class="prod ' + (cls || '') + '" src="' + p.src + '" alt="' + esc(p.name) + '" draggable="false">'; }
/** Dolum efektli ürün: soluk görüntü üzerine renkli görüntü alttan yukarı dolar (--fill 0..1). */
function cup(fill, key, cls) {
  return '<span class="pf ' + (cls || '') + '" style="--fill:' + (fill == null ? 1 : fill) + '">' + prodImg(key, 'ghost') + prodImg(key, 'full') + '<i class="lvl"></i></span>';
}
function setFill(el, v) { var t = el.classList && el.classList.contains('pf') ? el : $('.pf', el); t.style.setProperty('--fill', Math.max(0, Math.min(1, v))); }

function slogan() {
  return '<div class="slogan"><span class="s1">Çok da</span><span class="s2">Coffy<i>.</i>' +
    '<svg class="sw" viewBox="0 0 200 20" preserveAspectRatio="none"><path d="M4 14 C 50 4, 120 2, 196 10"/></svg></span></div>';
}
function logo() { return '<span class="logo">' + (C.brand.logoSvg || 'COFFY') + '</span>'; }

/* ---------- 3B: ürün karuseli (her ürün kameraya bakar, derinliğe göre ölçek/ışık) ---------- */
function ring(host, keys, o) {
  o = o || {};
  var n = keys.length, items, a = o.start || 0, v = o.speed || .45, drag = false, lx = 0, vel = 0, raf, cap;
  host.classList.add('ring');
  host.innerHTML = keys.map(function (k) { return '<div class="ri" data-k="' + k + '">' + prodImg(k) + '</div>'; }).join('') + '<i class="floor"></i><b class="cap"></b>';
  items = $$('.ri', host); cap = $('.cap', host);
  function draw() {
    var R = host.clientWidth * (o.spread || .36), best = -2, bi = 0;
    items.forEach(function (it, i) {
      var t = a + i * 2 * Math.PI / n, x = Math.sin(t) * R, z = Math.cos(t), d = (z + 1) / 2;
      it.style.transform = 'translateX(-50%) translateX(' + x + 'px) translateZ(' + (z * 80) + 'px) rotateY(' + (-Math.sin(t) * 28) + 'deg) scale(' + (.5 + .5 * d) + ')';
      it.style.zIndex = Math.round(d * 100); it.style.opacity = .25 + .75 * d; it.style.filter = 'brightness(' + (.45 + .55 * d) + ')';
      if (z > best) { best = z; bi = i; }
    });
    var nm = P(keys[bi]).name; if (cap.textContent !== nm) cap.textContent = nm;
  }
  function tick() {
    if (!drag) { if (animating() || Math.abs(vel) > .0005) { a += (animating() ? v * .016 : 0) + vel; vel *= .94; } }
    draw(); raf = requestAnimationFrame(tick);
  }
  host.addEventListener('pointerdown', function (e) { drag = true; lx = e.clientX; vel = 0; host.setPointerCapture && host.setPointerCapture(e.pointerId); track('ring_drag'); });
  host.addEventListener('pointermove', function (e) { if (!drag) return; var d = (e.clientX - lx) * .012; a += d; vel = d; lx = e.clientX; });
  host.addEventListener('pointerup', function () { drag = false; });
  tick();
  return { stop: function () { cancelAnimationFrame(raf); } };
}

/* ---------- 3B: işaretçiye göre eğim (fare / dokunma) ---------- */
function tilt(el, max) {
  max = max || 16; var ad = $('#ad');
  ad.addEventListener('pointermove', function (e) {
    var r = ad.getBoundingClientRect(), px = (e.clientX - r.left) / r.width - .5, py = (e.clientY - r.top) / r.height - .5;
    el.style.setProperty('--ry', (px * max * 2).toFixed(1) + 'deg'); el.style.setProperty('--rx', (-py * max).toFixed(1) + 'deg');
  });
  ad.addEventListener('pointerleave', function () { el.style.setProperty('--ry', '0deg'); el.style.setProperty('--rx', '0deg'); });
}

/* ---------- parçacık patlaması ---------- */
function burst(host, n, spread) {
  var b = document.createElement('div'); b.className = 'burst'; b.style.cssText = 'position:absolute;inset:0;pointer-events:none;z-index:45';
  spread = spread || 160;
  for (var i = 0; i < (n || 22); i++) {
    var p = document.createElement('i'), a = Math.random() * Math.PI * 2, r = spread * (.4 + Math.random() * .6);
    if (i % 3 === 0) { p.className = 'c'; p.style.background = ['#ffffff', '#c8864e', '#e9d1ad', '#8a5a36'][i % 4]; }
    p.style.setProperty('--x', Math.cos(a) * r + 'px'); p.style.setProperty('--y', Math.sin(a) * r + 'px');
    p.style.setProperty('--r', (Math.random() * 540 - 270) + 'deg'); p.style.animationDelay = Math.random() * .15 + 's';
    b.appendChild(p);
  }
  host.appendChild(b); later(function () { b.remove(); }, 1600);
}

/* ---------- konum ve en yakın şube (coffy.com.tr/subeler verisi) ---------- */
var GEO = null;
function hav(a, b) {
  var R = 6371000, t = Math.PI / 180, dLa = (b.lat - a.lat) * t, dLo = (b.lng - a.lng) * t;
  var x = Math.sin(dLa / 2) * Math.sin(dLa / 2) + Math.cos(a.lat * t) * Math.cos(b.lat * t) * Math.sin(dLo / 2) * Math.sin(dLo / 2);
  return 2 * R * Math.asin(Math.sqrt(x));
}
function locate() {
  if (GEO) return GEO;
  var u = null, src = 'fallback';
  try { if (window.mraid && mraid.getLocation) { var l = mraid.getLocation(); if (l && isFinite(l.lat)) { u = { lat: +l.lat, lng: +l.lon }; src = 'mraid'; } } } catch (e) { /* MRAID 3 yok */ }
  if (!u) { var la = parseFloat(C.geo.latMacro), lo = parseFloat(C.geo.lonMacro); if (isFinite(la) && isFinite(lo)) { u = { lat: la, lng: lo }; src = 'macro'; } }
  if (!u && Q.get('lat')) { u = { lat: +Q.get('lat'), lng: +Q.get('lon') }; src = 'param'; }
  if (!u) u = { lat: C.geo.fallback.lat, lng: C.geo.fallback.lng };
  var list = C.stores.map(function (s) {
    var m = hav(u, s); return { name: s.name, area: s.area, city: s.city, lat: s.lat, lng: s.lng, m: m, min: Math.max(1, Math.round(m / C.geo.walkMetersPerMin)) };
  }).sort(function (a, b) { return a.m - b.m; });
  GEO = { user: u, src: src, stores: list, near: list[0] };
  track('geo_' + src);
  return GEO;
}
function fmtDist(m) { return m < 1000 ? Math.round(m / 10) * 10 + ' m' : (m / 1000).toFixed(1).replace('.', ',') + ' km'; } // birim sayıdan ayrılmasın
function place(s) { return [s.area, s.city].filter(Boolean).join(' / '); }
/** Konum reklam ağından gelmediyse (önizleme) varsayılan bölge kullanıldığını belirtir. */
function geoNote() { return locate().src === 'fallback' ? ' · <i class="smp">örnek konum: ' + esc(C.geo.fallback.area) + '</i>' : ''; }
var PIN = '<svg viewBox="0 0 24 24"><path d="M12 2a7 7 0 0 0-7 7c0 5.2 7 13 7 13s7-7.8 7-13a7 7 0 0 0-7-7zm0 9.5A2.5 2.5 0 1 1 12 6.5a2.5 2.5 0 0 1 0 5z"/></svg>';
function storeRow() {
  var s = locate().near;
  return '<div class="store"><span class="pinw">' + PIN + '</span><span><b>' + esc(s.name) + '</b><small>' + s.min + ' dk yürüme' + geoNote() + '</small></span><span class="dist">' + fmtDist(s.m) + '</span></div>';
}

/* ---------- bitiş kartı: slogan + 3B ürün karuseli + şube + CTA ---------- */
function endcard(el, o) {
  o = o || {};
  var keys = o.keys || C.ring;
  if (o.first) keys = [o.first].concat(keys.filter(function (k) { return k !== o.first; }));
  el.innerHTML = '<div class="end">' + (o.kicker ? '<div class="kicker k">' + o.kicker + '</div>' : '') + slogan() +
    '<div class="er"></div>' +
    (o.lead ? '<p class="lead">' + o.lead + '</p>' : '') +
    '<div class="ctas">' + (o.store === false ? '' : storeRow()) +
    '<button class="btn pulse" data-exit="directions"><span class="pin">' + PIN + '</span>' + (o.cta || 'Yol tarifi al') + '</button>' +
    '<button class="btn ghost" data-exit="app">' + (o.cta2 || 'Uygulamadan sipariş ver') + '</button></div></div>';
  show(el); bindExits(el);
  ring($('.er', el), keys, { spread: isM() ? .34 : .4 });
  requestAnimationFrame(function () { $('.end', el).classList.add('in'); });
  track('endcard');
}

/* ---------- video aşaması ---------- */
var SND_ON = '<svg viewBox="0 0 24 24"><path d="M3 9v6h4l5 5V4L7 9H3zm13.5 3A4.5 4.5 0 0 0 14 8v8a4.5 4.5 0 0 0 2.5-4zM14 3.2v2.1a7 7 0 0 1 0 13.4v2.1a9 9 0 0 0 0-17.6z"/></svg>';
var SND_OFF = '<svg viewBox="0 0 24 24"><path d="M16.5 12A4.5 4.5 0 0 0 14 8v2.2l2.4 2.4.1-.6zM19 12c0 .9-.2 1.8-.5 2.6l1.5 1.5A8.9 8.9 0 0 0 21 12a9 9 0 0 0-7-8.8v2.1A7 7 0 0 1 19 12zM4.3 3 3 4.3 7.7 9H3v6h4l5 5v-6.7l4.3 4.3c-.7.5-1.4.9-2.3 1.2v2a9 9 0 0 0 3.7-1.8L19.7 21 21 19.7 4.3 3zM12 4 9.9 6.1 12 8.2V4z"/></svg>';
/** Açılış (ana video gelene kadar): logo ışık süzmesi → gerçek Coffy fotoğrafı üzerinde kinetik metin →
 *  spot ışığı altında 3B dönerek yükselen ürün, cam üzerinde ışık geçişi ve zemin yansıması → harf harf slogan. */
function placeholder(loop) {
  var p = P(C.hero), letters = function (t) { return t.split('').map(function (c, i) { return '<span style="--i:' + i + '">' + (c === ' ' ? '&nbsp;' : esc(c)) + '</span>'; }).join(''); };
  return '<div class="vph' + (loop ? ' loop' : '') + '">' +
    '<div class="op-ph" style="background-image:url(' + C.photo + ')"></div><div class="op-sh"></div>' +
    '<div class="op-logo"><span class="logo">' + (C.brand.logoSvg || 'COFFY') + '</span><i class="op-gl"></i></div>' +
    '<div class="vph-w w1">Ders <em>09:00</em>’da.</div><div class="vph-w w2">Toplantı <em>09:01</em>’de.</div><div class="vph-w w3">Peki sen?</div>' +
    '<div class="op-hero"><div class="op-stage"><i class="op-spot"></i><div class="op-prod">' + prodImg(C.hero) +
    '<i class="op-sweep" style="-webkit-mask-image:url(' + p.src + ');mask-image:url(' + p.src + ')"></i></div>' +
    '<div class="op-ref">' + prodImg(C.hero) + '</div></div>' +
    '<div class="op-sl"><b class="s1">' + letters('Çok da') + '</b><b class="s2">' + letters('Coffy') + '<i>.</i></b><small>' + esc(p.name) + ' · coffy.com.tr</small></div></div>' +
    '<i class="op-bar"></i><div class="vph-tag">ANA VİDEO · YER TUTUCU</div></div>';
}
function playVideo(host, done, opt) {
  opt = opt || {};
  var v = C.video, fin = false, tm, t0 = Date.now(), maxMs = (v.src ? v.maxSec : v.placeholderSec) * 1000;
  host.classList.add('vid');
  function finish(how) {
    if (fin) return; fin = true; clearTimeout(tm); track('video_' + (how || 'end'), { sec: Math.round((Date.now() - t0) / 100) / 10 });
    var el = $('video', host); if (el && !opt.loop) try { el.pause(); } catch (e) { /* yok */ }
    if (done) done();
  }
  if (v.src) {
    host.innerHTML = '<video muted playsinline webkit-playsinline autoplay ' + (opt.loop ? 'loop ' : '') + 'preload="auto"' + (v.poster ? ' poster="' + esc(v.poster) + '"' : '') + ' src="' + esc(v.src) + '"></video>' +
      '<button class="snd" aria-label="Ses">' + SND_OFF + '</button><div class="bar"></div>';
    var el = $('video', host), bar = $('.bar', host);
    el.play && el.play().catch(function () { /* otomatik oynatma engellendi */ });
    el.addEventListener('ended', function () { if (!opt.loop) finish('end'); });
    el.addEventListener('timeupdate', function () { bar.style.width = Math.min(100, el.currentTime / Math.min(el.duration || v.maxSec, v.maxSec) * 100) + '%'; });
    $('.snd', host).addEventListener('click', function (e) { e.stopPropagation(); el.muted = !el.muted; this.innerHTML = el.muted ? SND_OFF : SND_ON; track(el.muted ? 'mute' : 'unmute'); });
  } else {
    host.innerHTML = placeholder(opt.loop);
  }
  if (!opt.loop) tm = later(function () { finish('end'); }, maxMs);
  if (!opt.loop && opt.skip !== false) {
    var s = document.createElement('button'); s.className = 'skip'; s.textContent = opt.skipLabel || 'Geç ›';
    s.addEventListener('click', function (e) { e.stopPropagation(); finish('skip'); });
    host.appendChild(s); later(function () { s.classList.add('on'); }, v.skipAfterSec * 1000);
  }
  return { finish: finish };
}

/* ---------- işaretçi (dokunma + fare) ---------- */
function pt(e, el) { var r = el.getBoundingClientRect(), t = e.touches ? e.touches[0] || e.changedTouches[0] : e; return { x: t.clientX - r.left, y: t.clientY - r.top }; }

/* ---------- önizleme sayfası için yeniden başlatma ---------- */
window.addEventListener('message', function (e) { if (e.data === 'restart') location.reload(); });

/* ---------- kullanıcı bir süre etkileşmezse otomatik oynatma (demo) ---------- */
var TOUCHED = false;
document.addEventListener('pointerdown', function () { TOUCHED = true; }, true);
/** ms boyunca dokunma olmazsa fn çalışır; her dokunuş sayacı sıfırlar. Dönen fonksiyon iptal eder. */
function idle(ms, fn) {
  var t, off = function () { clearTimeout(t); document.removeEventListener('pointerdown', arm, true); };
  function arm() { clearTimeout(t); t = later(function () { off(); track('autoplay'); fn(); }, ms); }
  document.addEventListener('pointerdown', arm, true); arm();
  return off;
}

/* ---------- 3B eğimli şehir haritası (yollar, park, su; kuşbakışı perspektif) ---------- */
function mapBg(w, h) {
  var s = 7, rnd = function () { s = (s * 9301 + 49297) % 233280; return s / 233280; }, o = [];
  o.push('<rect width="' + w + '" height="' + h + '" fill="#1d1d1d"/>');
  o.push('<path d="M0 ' + h * .78 + ' C ' + w * .25 + ' ' + h * .7 + ', ' + w * .35 + ' ' + h + ', ' + w * .6 + ' ' + h * 1.02 + ' L0 ' + h + 'Z" fill="#1a2c3b"/>');
  o.push('<rect x="' + w * .62 + '" y="' + h * .12 + '" width="' + w * .22 + '" height="' + h * .16 + '" rx="14" fill="#22341f"/>');
  for (var k = 0; k < 40; k++) { var bx = rnd() * w, by = rnd() * h; o.push('<rect x="' + bx + '" y="' + by + '" width="' + (14 + rnd() * 26) + '" height="' + (10 + rnd() * 20) + '" rx="2" fill="#2a2a2a"/>'); }
  for (var i = 0; i < 9; i++) { var y = (i + .3 + rnd() * .4) * h / 9; o.push('<path d="M-10 ' + y + ' L' + (w + 10) + ' ' + (y + (rnd() - .5) * 30) + '" stroke="#474747" stroke-width="' + (i % 3 ? 3 : 7) + '"/>'); }
  for (var j = 0; j < 7; j++) { var x = (j + .3 + rnd() * .4) * w / 7; o.push('<path d="M' + x + ' -10 L' + (x + (rnd() - .5) * 40) + ' ' + (h + 10) + '" stroke="#474747" stroke-width="' + (j % 3 ? 3 : 7) + '"/>'); }
  o.push('<path d="M-10 ' + h * .2 + ' L' + (w + 10) + ' ' + h * .65 + '" stroke="#5c5c5c" stroke-width="10"/>');
  return '<svg class="map" viewBox="0 0 ' + w + ' ' + h + '" width="' + w + '" height="' + h + '" preserveAspectRatio="xMidYMid slice">' + o.join('') + '</svg>';
}
/** 3B düzlemdeki bir işaretin (anchor) host içindeki ekran konumu; pinler düz katmanda buraya konur (her zaman görünür). */
function screenPos(anchor, host) { var a = anchor.getBoundingClientRect(), h = host.getBoundingClientRect(); return { x: a.left + a.width / 2 - h.left, y: a.top + a.height / 2 - h.top }; }
/** 3B düzlemdeki öğeyi, ekranda istenen yüksekliğe (sy) denk gelecek düzlem konumuna yerleştirir (ikili arama). */
function planeY(el, host, sy, ph) {
  var lo = 0, hi = ph;
  for (var i = 0; i < 16; i++) { var mid = (lo + hi) / 2; el.style.top = mid + 'px'; if (screenPos(el, host).y < sy) lo = mid; else hi = mid; }
  el.style.top = (lo + hi) / 2 + 'px'; return (lo + hi) / 2;
}
/** Şubeyi kullanıcıya göre ekrana yerleştirir (yön gerçek, mesafe ölçeklenir). */
function project(u, s, cx, cy, r) {
  var dx = (s.lng - u.lng) * Math.cos(u.lat * Math.PI / 180) * 111320, dy = -(s.lat - u.lat) * 110540, d = Math.sqrt(dx * dx + dy * dy) || 1;
  return { x: cx + dx / d * r, y: cy + dy / d * r };
}

document.querySelectorAll('.ad-logo').forEach(function(l){l.innerHTML=logo()});
function boot(){(function () {
      var G = locate(), s = G.near, dp = daypart(), SZ = size(), wide = !isM();
      var DL = { morning: 'Derse giderken tam yolunun üstünde.', noon: 'Öğle arasına tam mesafe.', evening: 'Akşam molası için yolun üstünde.', night: 'Yarın sabah ilk durak burası.' };
      var DN = { morning: 'SABAH', noon: 'ÖĞLE', evening: 'AKŞAM', night: 'GECE' };
      // 3B harita düzlemi: reklamdan geniş, alt kenarından geriye yatırılmış
      var PW = Math.round(SZ.w * 1.5), PH = Math.round(SZ.h * (wide ? 1.9 : 1.25)), plane = $('#plane');
      plane.style.width = PW + 'px'; plane.style.height = PH + 'px'; plane.style.left = (SZ.w - PW) / 2 + 'px'; plane.style.top = (SZ.h - PH + (wide ? 20 : 30)) + 'px';
      $('#mapw').innerHTML = mapBg(PW, PH); $('#pbl').innerHTML = logo();
      $('#route').setAttribute('width', PW); $('#route').setAttribute('height', PH);
      // Kullanıcı ve şube, ekranda başlık ile şube kartı arasındaki görünür harita bandına denk gelecek şekilde yerleşir
      var off = (PW - SZ.w) / 2, host = $('#m'), u = { x: (wide ? 500 : SZ.w * .42) + off }, p = project(G.user, s, u.x, PH * .8, PH * .4);
      p.x = Math.min(off + (wide ? 610 : SZ.w - 70), Math.max(off + (wide ? 470 : 70), p.x));
      $('#me').style.left = u.x + 'px'; u.y = planeY($('#me'), host, wide ? 214 : 268, PH);
      $('#anc').style.left = p.x + 'px'; p.y = planeY($('#anc'), host, wide ? 132 : 214, PH);
      var sp = screenPos($('#anc'), host); $('#spin').style.left = sp.x + 'px'; $('#spin').style.top = sp.y + 'px';
      $('#rp').setAttribute('d', 'M' + u.x + ' ' + u.y + ' L' + u.x + ' ' + (p.y + 50) + ' L' + p.x + ' ' + (p.y + 50) + ' L' + p.x + ' ' + (p.y + 6));
      $('#chip').textContent = DN[dp] + ' · ' + clock() + (G.src === 'fallback' ? ' · ' + C.geo.fallback.area.toUpperCase() : '');
      $('#hl').innerHTML = 'En yakın Coffy<br><em>' + fmtDist(s.m) + '</em> ötede.';
      $('#shp').innerHTML = prodImg(C.hero);
      $('#sn').textContent = s.name; $('#ss').innerHTML = esc(place(s)) + ' · ' + s.min + ' dk yürüme'; $('#sd').textContent = fmtDist(s.m);
      $('#dpl').textContent = DL[dp] + ' Çok da Coffy.';
      bindExits($('#m'));
      show('#v');
      playVideo($('#v'), function () {
        show('#m'); $('#spin').style.display = 'none';
        later(function () { $('#spin').style.display = ''; $('#rp').classList.add('anim'); }, 300);
        later(function () { $('#sheet').classList.add('on'); track('endcard'); }, 900);
      });
    })();}
