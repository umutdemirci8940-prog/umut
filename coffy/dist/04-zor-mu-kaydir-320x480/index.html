<style>:root{--W:320px;--H:480px}
:root{
  --esp:#1d110b;--roast:#3a2117;--bean:#5a3422;--cream:#fbefdf;--foam:#fff8ee;
  --acc:#ff5a2c;--acc2:#ffc53a;--mint:#5fe0bd;--pink:#ff8fb3;--ink:#1d110b;
  --h:'Bricolage Grotesque','Manrope',system-ui,sans-serif;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{width:var(--W);height:var(--H);overflow:hidden;background:var(--esp)}
body{font-family:'Manrope',system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;color:var(--cream);-webkit-font-smoothing:antialiased;-webkit-user-select:none;user-select:none;-webkit-tap-highlight-color:transparent;touch-action:manipulation}
button{font:inherit;color:inherit}
.ad{position:relative;width:var(--W);height:var(--H);overflow:hidden;isolation:isolate;
  background:radial-gradient(120% 80% at 80% -10%,rgba(255,90,44,.28),transparent 55%),radial-gradient(90% 60% at -10% 110%,rgba(255,197,58,.16),transparent 60%),var(--esp)}
.ad::after{content:"";position:absolute;inset:0;pointer-events:none;z-index:50;box-shadow:inset 0 0 0 1px rgba(255,255,255,.08)}
.hd{font-family:var(--h);font-weight:800;letter-spacing:-.03em;line-height:.95}
.scene{position:absolute;inset:0;opacity:0;visibility:hidden;transition:opacity .45s ease,visibility .45s}
.scene.on{opacity:1;visibility:visible}

/* logo */
.logo{display:inline-flex;align-items:center;gap:5px;font-family:var(--h);font-weight:800;letter-spacing:-.05em;font-size:22px;line-height:1;color:var(--cream);text-decoration:none}
.logo .dot{width:.36em;height:.36em;border-radius:50%;background:var(--acc);transform:translateY(.22em)}
.logo svg{height:1em;width:auto;fill:currentColor}
.ad-logo{position:absolute;z-index:30;top:12px;left:14px;font-size:19px}

/* butonlar */
.btn{appearance:none;border:0;cursor:pointer;display:inline-flex;align-items:center;justify-content:center;gap:7px;font-weight:800;font-size:14px;line-height:1;border-radius:999px;padding:13px 18px;background:var(--acc);color:#fff;box-shadow:0 8px 22px -8px rgba(255,90,44,.8);transition:transform .2s,background .2s}
.btn:active{transform:scale(.96)}
.btn.alt{background:var(--cream);color:var(--ink);box-shadow:none}
.btn.ghost{background:rgba(255,255,255,.08);color:var(--cream);box-shadow:inset 0 0 0 1.5px rgba(255,255,255,.22)}
.btn .pin{width:12px;height:12px;flex:none}
.pulse{animation:pulse 1.6s ease-in-out infinite}
@keyframes pulse{0%,100%{transform:scale(1)}50%{transform:scale(1.05)}}
.btn:focus-visible,.opt:focus-visible{outline:2px solid var(--acc2);outline-offset:2px}

/* slogan */
.slogan{display:inline-flex;flex-direction:column;align-items:flex-start;font-family:var(--h);font-weight:800;letter-spacing:-.04em;line-height:.86;color:var(--cream)}
.slogan .s1{font-size:.5em;letter-spacing:-.02em;color:var(--acc2);margin-left:.06em}
.slogan .s2{position:relative;font-size:1em}
.slogan .s2 i{font-style:normal;color:var(--acc)}
.slogan .sw{position:absolute;left:0;right:-.1em;bottom:-.16em;height:.22em;width:100%;overflow:visible}
.slogan .sw path{stroke:var(--acc);stroke-width:5;fill:none;stroke-linecap:round;stroke-dasharray:220;stroke-dashoffset:220;animation:draw .9s .35s cubic-bezier(.6,0,.2,1) forwards}
@keyframes draw{to{stroke-dashoffset:0}}

/* bardak */
.cup{display:block;overflow:visible;--fill:.78;--tone:#8a5a36}
.cup .liq{transform:translateY(calc((1 - var(--fill)) * 128px));transition:transform .7s cubic-bezier(.3,1.35,.5,1)}
.cup .wave{animation:wave 2.4s linear infinite}
@keyframes wave{from{transform:translateX(0)}to{transform:translateX(-60px)}}
.cup .ice{animation:bob 3s ease-in-out infinite}
.cup .ice:nth-child(2){animation-delay:-1s}.cup .ice:nth-child(3){animation-delay:-2s}
@keyframes bob{0%,100%{transform:translateY(0) rotate(0)}50%{transform:translateY(-3px) rotate(4deg)}}

/* video katmanı */
.vid{position:absolute;inset:0;overflow:hidden;background:#000;container-type:size}
.vid video{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.vid .skip{position:absolute;z-index:5;right:10px;bottom:10px;border:0;cursor:pointer;border-radius:999px;padding:7px 12px;font-size:11px;font-weight:800;background:rgba(0,0,0,.55);color:#fff;backdrop-filter:blur(6px);opacity:0;transform:translateY(6px);transition:.3s}
.vid .skip.on{opacity:1;transform:none}
.vid .snd{position:absolute;z-index:5;left:10px;bottom:10px;width:30px;height:30px;border:0;border-radius:50%;cursor:pointer;background:rgba(0,0,0,.55);display:grid;place-items:center}
.vid .snd svg{width:15px;height:15px;fill:#fff}
.vid .bar{position:absolute;z-index:5;left:0;bottom:0;height:3px;background:var(--acc);width:0}

/* video yer tutucu (gerçek video gelene kadar) */
.vph{position:absolute;inset:0;background:var(--esp);overflow:hidden}
.vph-bg{position:absolute;inset:-20%;background:radial-gradient(40% 35% at 30% 30%,rgba(255,90,44,.55),transparent 70%),radial-gradient(40% 40% at 75% 70%,rgba(255,197,58,.35),transparent 70%),radial-gradient(30% 30% at 70% 20%,rgba(255,143,179,.25),transparent 70%);animation:vbg 5s linear infinite}
@keyframes vbg{to{transform:rotate(360deg)}}
.vph-grain{position:absolute;inset:0;opacity:.18;background-image:repeating-linear-gradient(0deg,rgba(255,255,255,.06) 0 1px,transparent 1px 3px)}
.vph-w{position:absolute;left:8cqw;right:8cqw;top:50%;transform:translateY(-50%);font-family:var(--h);font-weight:800;letter-spacing:-.04em;line-height:.9;font-size:min(13cqw,24cqh);color:var(--cream);opacity:0}
.vph-w em{font-style:normal;color:var(--acc2)}
.vph .w1{animation:vw1 5s both}.vph .w2{animation:vw2 5s both}.vph .w3{animation:vw3 5s both}
.vph-end{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;gap:4cqw;opacity:0;animation:vend 5s both}
.vph-end .slogan{font-size:min(17cqw,30cqh)}
.vph-end .cup{height:62cqh;width:auto;animation:vcup 5s both}
.vph.loop .w1,.vph.loop .w2,.vph.loop .w3,.vph.loop .vph-end,.vph.loop .vph-end .cup{animation-iteration-count:infinite}
@keyframes vw1{0%{opacity:0;transform:translateY(-30%) scale(1.15)}4%,18%{opacity:1;transform:translateY(-50%) scale(1)}22%,100%{opacity:0;transform:translateY(-70%)}}
@keyframes vw2{0%,22%{opacity:0;transform:translateY(-30%) scale(1.15)}26%,40%{opacity:1;transform:translateY(-50%) scale(1)}44%,100%{opacity:0;transform:translateY(-70%)}}
@keyframes vw3{0%,44%{opacity:0;transform:translateY(-50%) scale(.6)}48%,58%{opacity:1;transform:translateY(-50%) scale(1)}62%,100%{opacity:0;transform:translateY(-50%) scale(1.6)}}
@keyframes vend{0%,60%{opacity:0}64%,97%{opacity:1}100%{opacity:0}}
@keyframes vcup{0%,60%{transform:translateY(40%) rotate(-12deg)}70%,100%{transform:translateY(0) rotate(4deg)}}
.vph-tag{position:absolute;z-index:4;top:10px;right:10px;display:flex;align-items:center;gap:6px;padding:5px 9px 5px 8px;border-radius:999px;background:rgba(0,0,0,.45);font-size:9.5px;font-weight:800;letter-spacing:.08em;color:rgba(255,255,255,.85)}
.vph-tag::before{content:"";width:0;height:0;border-left:7px solid var(--acc);border-top:4.5px solid transparent;border-bottom:4.5px solid transparent}

/* küçük yardımcılar */
.kicker{font-size:11px;font-weight:800;letter-spacing:.16em;text-transform:uppercase;color:var(--acc2)}
.muted{color:rgba(251,239,223,.7)}
.smp{font-style:normal;opacity:.6}
.sample{position:absolute;z-index:40;right:6px;bottom:4px;font-size:8px;font-weight:700;letter-spacing:.06em;color:rgba(255,255,255,.45);text-transform:uppercase;pointer-events:none}
.legal{position:absolute;z-index:40;left:8px;bottom:4px;font-size:8px;color:rgba(255,255,255,.4);pointer-events:none}
.hint{position:absolute;z-index:20;width:34px;height:34px;pointer-events:none;animation:tap 1.4s ease-in-out infinite}
.hint::before{content:"";position:absolute;inset:0;border-radius:50%;background:rgba(255,255,255,.9);box-shadow:0 0 0 0 rgba(255,255,255,.6);animation:ring 1.4s ease-out infinite}

.bean{position:absolute;width:14px;height:18px;pointer-events:none}
.burst i{position:absolute;left:50%;top:50%;width:10px;height:14px;border-radius:50%;background:var(--bean);opacity:0;animation:fly 1.1s cubic-bezier(.2,.7,.3,1) forwards}
.burst i::after{content:"";position:absolute;left:45%;top:10%;width:1.5px;height:80%;border-radius:2px;background:rgba(0,0,0,.35);transform:rotate(8deg)}
.burst i.c{width:9px;height:9px;border-radius:2px}

.end{display:flex;flex-direction:column;align-items:center;text-align:center;height:100%;padding:42px 18px 16px}
.end .slogan{font-size:52px;margin-top:4px}
.end .cup{height:112px;width:auto;margin:10px 0 2px}
.end .k{margin-top:4px}
.end .lead{font-size:12.5px;line-height:1.35;font-weight:600;max-width:270px;margin-top:6px;color:rgba(251,239,223,.82)}
.end .ctas{display:flex;flex-direction:column;gap:7px;width:100%;margin-top:auto}
.end .ctas .btn{width:100%;padding:12px 16px}
.store{display:flex;align-items:center;gap:10px;width:100%;padding:8px 12px;border-radius:14px;background:rgba(255,255,255,.07);text-align:left}
.store .pinw{width:30px;height:30px;flex:none;border-radius:50%;background:var(--acc);display:grid;place-items:center}
.store .pinw svg{width:14px;height:14px;fill:#fff}
.store b{display:block;font-size:13px}
.store small{display:block;font-size:11px;color:rgba(251,239,223,.7);margin-top:2px}
.store .dist{margin-left:auto;font-family:var(--h);font-weight:800;font-size:18px;color:var(--acc2);white-space:nowrap}
.end.in .slogan,.end.in .cup,.end.in .lead,.end.in .store,.end.in .ctas{animation:rise .6s both}
.end.in .cup{animation-delay:.1s}.end.in .lead{animation-delay:.2s}.end.in .store{animation-delay:.3s}.end.in .ctas{animation-delay:.4s}

@media (prefers-reduced-motion:reduce){*{animation-duration:.01s!important;animation-iteration-count:1!important;transition-duration:.01s!important}}

.cup .ice{transform-box:fill-box;transform-origin:center}


.w4{display:flex;flex-direction:column;align-items:center;text-align:center;padding:46px 16px 14px}
.w4 .t{font-size:30px;margin-top:4px}
.deck{position:relative;width:250px;height:262px;margin-top:14px}
.card{position:absolute;inset:0;border-radius:24px;padding:18px;display:flex;flex-direction:column;align-items:flex-start;text-align:left;color:var(--ink);box-shadow:0 20px 40px -18px rgba(0,0,0,.8);touch-action:none;cursor:grab;transition:transform .35s cubic-bezier(.3,1.3,.5,1),opacity .35s;will-change:transform}
.card.drag{transition:none}
.card small{font-size:10px;font-weight:800;letter-spacing:.16em;opacity:.7}
.card svg{margin-top:12px}
.card b{font-family:var(--h);font-weight:800;font-size:25px;line-height:1;letter-spacing:-.03em;margin-top:auto}
.card .lv{display:flex;gap:4px;margin-top:12px;font-size:10px;font-weight:800;letter-spacing:.1em;align-items:center}
.card .lv i{width:16px;height:6px;border-radius:3px;background:var(--ink)}.card .lv i.o{opacity:.2}
.stamp{position:absolute;top:22px;right:14px;padding:6px 10px;border:3px solid currentColor;border-radius:10px;font-family:var(--h);font-weight:800;font-size:17px;letter-spacing:-.01em;transform:rotate(12deg);opacity:0;color:#1d110b;background:rgba(255,255,255,.55)}
.stamp.no{right:auto;left:14px;transform:rotate(-12deg)}
.toast{position:absolute;left:50%;top:330px;transform:translate(-50%,10px);opacity:0;padding:9px 14px;border-radius:999px;background:var(--cream);color:var(--ink);font-size:12.5px;font-weight:800;white-space:nowrap;transition:.3s;z-index:10;pointer-events:none}
.toast.on{opacity:1;transform:translate(-50%,0)}
.ctl{display:flex;gap:8px;width:100%;margin-top:16px}
.ctl .btn{flex:1;font-size:13.5px;padding:12px 8px}
.cnt{display:flex;align-items:center;justify-content:space-between;width:100%;margin-top:10px;font-size:12px;font-weight:700;color:rgba(251,239,223,.75)}
.bn{display:flex;gap:5px}.bn i{width:12px;height:16px;border-radius:50%;background:rgba(255,255,255,.15);transition:.3s}.bn i.on{background:var(--acc2);transform:rotate(20deg)}</style>

  var id = AD.id + 'c' + (++_cupN);
  return CUPT.replace(/__ID__/g, id).replace('__STYLE__', '--fill:' + (fill == null ? .8 : fill) + (tone ? ';--tone:' + tone : '')).replace('__CLS__', cls || '');
}
function setFill(el, v) { (el.classList && el.classList.contains('cup') ? el : $('.cup', el)).style.setProperty('--fill', Math.max(0, Math.min(1, v))); }

function slogan() {
  return '<div class="slogan"><span class="s1">Çok da</span><span class="s2">Coffy<i>.</i>' +
    '<svg class="sw" viewBox="0 0 200 20" preserveAspectRatio="none"><path d="M4 14 C 50 4, 120 2, 196 10"/></svg></span></div>';
}
function logo() { return C.brand.logoSvg ? '<span class="logo">' + C.brand.logoSvg + '</span>' : '<span class="logo">coffy<span class="dot"></span></span>'; }

/* ---------- parçacık patlaması ---------- */
function burst(host, n, spread) {
  var b = document.createElement('div'); b.className = 'burst'; b.style.cssText = 'position:absolute;inset:0;pointer-events:none;z-index:45';
  spread = spread || 160;
  for (var i = 0; i < (n || 22); i++) {
    var p = document.createElement('i'), a = Math.random() * Math.PI * 2, r = spread * (.4 + Math.random() * .6);
    if (i % 3 === 0) { p.className = 'c'; p.style.background = ['#ff5a2c', '#ffc53a', '#5fe0bd', '#ff8fb3'][i % 4]; }
    p.style.setProperty('--x', Math.cos(a) * r + 'px'); p.style.setProperty('--y', Math.sin(a) * r + 'px');
    p.style.setProperty('--r', (Math.random() * 540 - 270) + 'deg'); p.style.animationDelay = Math.random() * .15 + 's';
    b.appendChild(p);
  }
  host.appendChild(b); later(function () { b.remove(); }, 1600);
}

/* ---------- konum ve en yakın şube ---------- */
var GEO = null;
function hav(a, b) {
  var R = 6371000, t = Math.PI / 180, dLa = (b.lat - a.lat) * t, dLo = (b.lng - a.lng) * t;
  var x = Math.sin(dLa / 2) * Math.sin(dLa / 2) + Math.cos(a.lat * t) * Math.cos(b.lat * t) * Math.sin(dLo / 2) * Math.sin(dLo / 2);
  return 2 * R * Math.asin(Math.sqrt(x));
}
function locate() {
  if (GEO) return GEO;
  var u = null, src = 'fallback';
  try { if (window.mraid && mraid.getLocation) { var l = mraid.getLocation(); if (l && isFinite(l.lat)) { u = { lat: +l.lat, lng: +l.lon }; src = 'mraid'; } } } catch (e) { /* MRAID 3 yok */ }
  if (!u) { var la = parseFloat(C.geo.latMacro), lo = parseFloat(C.geo.lonMacro); if (isFinite(la) && isFinite(lo)) { u = { lat: la, lng: lo }; src = 'macro'; } }
  if (!u && Q.get('lat')) { u = { lat: +Q.get('lat'), lng: +Q.get('lon') }; src = 'param'; }
  if (!u) u = { lat: C.geo.fallback.lat, lng: C.geo.fallback.lng };
  var list = C.stores.map(function (s) {
    var m = hav(u, s); return { name: s.name, area: s.area, lat: s.lat, lng: s.lng, hours: s.hours, m: m, min: Math.max(1, Math.round(m / C.geo.walkMetersPerMin)) };
  }).sort(function (a, b) { return a.m - b.m; });
  GEO = { user: u, src: src, stores: list, near: list[0] };
  track('geo_' + src);
  return GEO;
}
function fmtDist(m) { return m < 1000 ? Math.round(m / 10) * 10 + ' m' : (m / 1000).toFixed(1).replace('.', ',') + ' km'; }
function dirUrl() { var s = locate().near; return C.exits.directions.replace('{lat}', s.lat).replace('{lng}', s.lng); }
var PIN = '<svg viewBox="0 0 24 24"><path d="M12 2a7 7 0 0 0-7 7c0 5.2 7 13 7 13s7-7.8 7-13a7 7 0 0 0-7-7zm0 9.5A2.5 2.5 0 1 1 12 6.5a2.5 2.5 0 0 1 0 5z"/></svg>';
function storeRow() {
  var s = locate().near;
  return '<div class="store"><span class="pinw">' + PIN + '</span><span><b>' + esc(s.name) + '</b><small>' + s.min + ' dk yürüme · ' + esc(s.hours) + smp() + '</small></span><span class="dist">' + fmtDist(s.m) + '</span></div>';
}
/** Şube verisi örnekse şube bilgisinin yanına küçük not ekler. */
function smp() { return C.storesSample ? ' · <i class="smp">örnek veri</i>' : ''; }

/* ---------- bitiş kartı (mobil) ---------- */
function endcard(el, o) {
  o = o || {};
  el.innerHTML = '<div class="end">' + (o.kicker ? '<div class="kicker k">' + o.kicker + '</div>' : '') + slogan() +
    (o.cup === false ? '' : cup(o.fill == null ? .85 : o.fill, o.tone)) +
    (o.lead ? '<p class="lead">' + o.lead + '</p>' : '') +
    '<div class="ctas">' + (o.store === false ? '' : storeRow()) +
    '<button class="btn pulse" data-exit="directions"><span class="pin">' + PIN.replace('<svg', '<svg fill="#fff"') + '</span>' + (o.cta || 'Yol tarifi al') + '</button>' +
    '<button class="btn ghost" data-exit="app">' + (o.cta2 || 'Uygulamadan sipariş ver') + '</button></div></div>';
  show(el); bindExits(el);
  requestAnimationFrame(function () { $('.end', el).classList.add('in'); });
  track('endcard');
}

/* ---------- video aşaması ---------- */
var SND_ON = '<svg viewBox="0 0 24 24"><path d="M3 9v6h4l5 5V4L7 9H3zm13.5 3A4.5 4.5 0 0 0 14 8v8a4.5 4.5 0 0 0 2.5-4zM14 3.2v2.1a7 7 0 0 1 0 13.4v2.1a9 9 0 0 0 0-17.6z"/></svg>';
var SND_OFF = '<svg viewBox="0 0 24 24"><path d="M16.5 12A4.5 4.5 0 0 0 14 8v2.2l2.4 2.4.1-.6zM19 12c0 .9-.2 1.8-.5 2.6l1.5 1.5A8.9 8.9 0 0 0 21 12a9 9 0 0 0-7-8.8v2.1A7 7 0 0 1 19 12zM4.3 3 3 4.3 7.7 9H3v6h4l5 5v-6.7l4.3 4.3c-.7.5-1.4.9-2.3 1.2v2a9 9 0 0 0 3.7-1.8L19.7 21 21 19.7 4.3 3zM12 4 9.9 6.1 12 8.2V4z"/></svg>';
function placeholder(loop) {
  return '<div class="vph' + (loop ? ' loop' : '') + '"><div class="vph-bg"></div><div class="vph-grain"></div>' +
    '<div class="vph-w w1">Ders <em>09:00</em>’da.</div><div class="vph-w w2">Toplantı <em>09:01</em>’de.</div><div class="vph-w w3">Peki sen?</div>' +
    '<div class="vph-end">' + cup(.82) + slogan() + '</div><div class="vph-tag">ANA VİDEO · YER TUTUCU</div></div>';
}
function playVideo(host, done, opt) {
  opt = opt || {};
  var v = C.video, fin = false, tm, t0 = Date.now(), maxMs = (v.src ? v.maxSec : v.placeholderSec) * 1000;
  host.classList.add('vid');
  function finish(how) {
    if (fin) return; fin = true; clearTimeout(tm); track('video_' + (how || 'end'), { sec: Math.round((Date.now() - t0) / 100) / 10 });
    var el = $('video', host); if (el && !opt.loop) try { el.pause(); } catch (e) { /* yok */ }
    if (done) done();
  }
  if (v.src) {
    host.innerHTML = '<video muted playsinline webkit-playsinline autoplay ' + (opt.loop ? 'loop ' : '') + 'preload="auto"' + (v.poster ? ' poster="' + esc(v.poster) + '"' : '') + ' src="' + esc(v.src) + '"></video>' +
      '<button class="snd" aria-label="Ses">' + SND_OFF + '</button><div class="bar"></div>';
    var el = $('video', host), bar = $('.bar', host);
    el.play && el.play().catch(function () { /* otomatik oynatma engellendi */ });
    el.addEventListener('ended', function () { if (!opt.loop) finish('end'); });
    el.addEventListener('timeupdate', function () { bar.style.width = Math.min(100, el.currentTime / Math.min(el.duration || v.maxSec, v.maxSec) * 100) + '%'; });
    $('.snd', host).addEventListener('click', function (e) { e.stopPropagation(); el.muted = !el.muted; this.innerHTML = el.muted ? SND_OFF : SND_ON; track(el.muted ? 'mute' : 'unmute'); });
  } else {
    host.innerHTML = placeholder(opt.loop);
  }
  if (!opt.loop) tm = later(function () { finish('end'); }, maxMs);
  if (!opt.loop && opt.skip !== false) {
    var s = document.createElement('button'); s.className = 'skip'; s.textContent = opt.skipLabel || 'Geç ›';
    s.addEventListener('click', function (e) { e.stopPropagation(); finish('skip'); });
    host.appendChild(s); later(function () { s.classList.add('on'); }, v.skipAfterSec * 1000);
  }
  return { finish: finish };
}

/* ---------- işaretçi (dokunma + fare) ---------- */
function pt(e, el) { var r = el.getBoundingClientRect(), t = e.touches ? e.touches[0] || e.changedTouches[0] : e; return { x: t.clientX - r.left, y: t.clientY - r.top }; }

/* ---------- önizleme sayfası için yeniden başlatma ---------- */
window.addEventListener('message', function (e) { if (e.data === 'restart') location.reload(); });

/* ---------- kullanıcı bir süre etkileşmezse otomatik oynatma (demo) ---------- */
var TOUCHED = false;
document.addEventListener('pointerdown', function () { TOUCHED = true; }, true);
/** ms boyunca dokunma olmazsa fn çalışır; her dokunuş sayacı sıfırlar. Dönen fonksiyon iptal eder. */
function idle(ms, fn) {
  var t, off = function () { clearTimeout(t); document.removeEventListener('pointerdown', arm, true); };
  function arm() { clearTimeout(t); t = later(function () { off(); track('autoplay'); fn(); }, ms); }
  document.addEventListener('pointerdown', arm, true); arm();
  return off;
}

/* ---------- stilize harita ---------- */
function mapBg(w, h) {
  var s = 7, rnd = function () { s = (s * 9301 + 49297) % 233280; return s / 233280; }, o = [];
  o.push('<rect width="' + w + '" height="' + h + '" fill="#26170f"/>');
  o.push('<path d="M0 ' + h * .78 + ' C ' + w * .25 + ' ' + h * .7 + ', ' + w * .35 + ' ' + h + ', ' + w * .6 + ' ' + h * 1.02 + ' L0 ' + h + 'Z" fill="#1c2630"/>');
  o.push('<rect x="' + w * .62 + '" y="' + h * .12 + '" width="' + w * .22 + '" height="' + h * .16 + '" rx="14" fill="#2c3220"/>');
  for (var i = 0; i < 9; i++) { var y = (i + .3 + rnd() * .4) * h / 9; o.push('<path d="M-10 ' + y + ' L' + (w + 10) + ' ' + (y + (rnd() - .5) * 30) + '" stroke="#3a2519" stroke-width="' + (i % 3 ? 3 : 7) + '"/>'); }
  for (var j = 0; j < 7; j++) { var x = (j + .3 + rnd() * .4) * w / 7; o.push('<path d="M' + x + ' -10 L' + (x + (rnd() - .5) * 40) + ' ' + (h + 10) + '" stroke="#3a2519" stroke-width="' + (j % 3 ? 3 : 7) + '"/>'); }
  o.push('<path d="M-10 ' + h * .2 + ' L' + (w + 10) + ' ' + h * .65 + '" stroke="#4a2f20" stroke-width="10"/>');
  return '<svg class="map" viewBox="0 0 ' + w + ' ' + h + '" width="' + w + '" height="' + h + '" preserveAspectRatio="xMidYMid slice">' + o.join('') + '</svg>';
}
/** Şubeyi kullanıcıya göre ekrana yerleştirir (yön gerçek, mesafe ölçeklenir). */
function project(u, s, cx, cy, r) {
  var dx = (s.lng - u.lng) * Math.cos(u.lat * Math.PI / 180) * 111320, dy = -(s.lat - u.lat) * 110540, d = Math.sqrt(dx * dx + dy * dy) || 1;
  return { x: cx + dx / d * r, y: cy + dy / d * r };
}

document.querySelectorAll('.ad-logo').forEach(function(l){l.innerHTML=logo()});
function boot(){(function () {
      var CARDS = [
        { k: 'DURUM 1/3', t: 'Final haftası. 4 sınav arka arkaya.', c: '#ff8a5c', ic: 'book', lv: 5 },
        { k: 'DURUM 2/3', t: 'Pazartesi, saat 09:00. Kamera açık.', c: '#5fe0bd', ic: 'clock', lv: 4 },
        { k: 'DURUM 3/3', t: 'Grup ödevi. Herkes sessiz.', c: '#ffc53a', ic: 'chat', lv: 4 },
      ];
      var IC = { book: '<svg viewBox="0 0 48 48" width="54" height="54"><rect x="8" y="30" width="32" height="8" rx="2" fill="#1d110b"/><rect x="11" y="21" width="28" height="8" rx="2" fill="#1d110b" opacity=".75"/><rect x="7" y="12" width="30" height="8" rx="2" fill="#1d110b" opacity=".5"/></svg>', clock: '<svg viewBox="0 0 48 48" width="54" height="54"><circle cx="24" cy="24" r="16" fill="none" stroke="#1d110b" stroke-width="4"/><path d="M24 14v11l7 5" stroke="#1d110b" stroke-width="4" fill="none" stroke-linecap="round"/></svg>', chat: '<svg viewBox="0 0 48 48" width="54" height="54"><path d="M8 10h32v20H22l-9 8v-8H8z" fill="#1d110b"/><circle cx="17" cy="20" r="2.5" fill="#ffc53a"/><circle cx="24" cy="20" r="2.5" fill="#ffc53a"/><circle cx="31" cy="20" r="2.5" fill="#ffc53a"/></svg>' };
      var deck = $('#deck'), ok = 0, busy = false, auto = null;
      deck.innerHTML = CARDS.map(function (c, i) {
        var lv = ''; for (var j = 0; j < 5; j++) lv += '<i' + (j < c.lv ? '' : ' class="o"') + '></i>';
        return '<div class="card" data-i="' + i + '" style="background:' + c.c + ';z-index:' + (10 - i) + ';transform:translateY(' + i * 10 + 'px) scale(' + (1 - i * .05) + ')"><small>' + c.k + '</small>' + IC[c.ic] +
          '<b>' + esc(c.t) + '</b><div class="lv">ZORLUK ' + lv + '</div><div class="stamp yes">ÇOK DA COFFY</div><div class="stamp no">PES?</div></div>';
      }).join('');
      var cards = $$('.card', deck);
      function top() { return cards[ok]; }
      function restack() { cards.forEach(function (c, i) { if (i < ok) return; var d = i - ok; c.style.transform = 'translateY(' + d * 10 + 'px) scale(' + (1 - d * .05) + ')'; }); }
      function accept() {
        var c = top(); if (!c || busy) return; busy = true;
        $('.stamp.yes', c).style.opacity = 1; c.style.transform = 'translate(340px,-30px) rotate(24deg)'; c.style.opacity = 0;
        ok++; $$('#bn i')[ok - 1].classList.add('on'); $('#cn').textContent = ok + '/3 halloldu'; track('swipe_yes_' + ok);
        later(function () { busy = false; restack(); if (ok === 3) finish(); }, 380);
      }
      function reject() {
        var c = top(); if (!c || busy) return; busy = true; track('swipe_no_' + ok);
        c.style.transform = 'translate(-60px,0) rotate(-8deg)';
        $('#toast').classList.add('on');
        later(function () { c.style.transform = 'none'; $('.stamp.no', c).style.opacity = 0; busy = false; }, 380);
        later(function () { $('#toast').classList.remove('on'); }, 1500);
      }
      function finish() { clearInterval(auto); burst($('#w'), 26); later(function () { endcard($('#e'), { kicker: 'FİNAL, PAZARTESİ, GRUP ÖDEVİ…', lead: 'Yanında Coffy varsa hiçbiri çok da şey değil.' }); }, 900); }
      var sx = 0, dx = 0, dragging = null;
      deck.addEventListener('pointerdown', function (e) { var c = e.target.closest('.card'); if (!c || c !== top() || busy) return; clearInterval(auto); dragging = c; sx = e.clientX; dx = 0; c.classList.add('drag'); c.setPointerCapture && c.setPointerCapture(e.pointerId); });
      deck.addEventListener('pointermove', function (e) { if (!dragging) return; dx = e.clientX - sx; dragging.style.transform = 'translateX(' + dx + 'px) rotate(' + dx / 14 + 'deg)'; $('.stamp.yes', dragging).style.opacity = Math.max(0, dx / 90); $('.stamp.no', dragging).style.opacity = Math.max(0, -dx / 90); });
      deck.addEventListener('pointerup', function () { if (!dragging) return; var c = dragging; dragging = null; c.classList.remove('drag'); if (dx > 70) accept(); else if (dx < -70) reject(); else { c.style.transform = 'none'; $$('.stamp', c).forEach(function (s) { s.style.opacity = 0; }); } });
      $('#yes').addEventListener('click', function (e) { e.stopPropagation(); clearInterval(auto); accept(); });
      $('#no').addEventListener('click', function (e) { e.stopPropagation(); clearInterval(auto); reject(); });
      show('#v');
      playVideo($('#v'), function () { show('#w'); idle(6000, function () { auto = setInterval(accept, 1300); }); });
    })();}
if(document.readyState==='loading'){document.addEventListener('DOMContentLoaded',boot)}else{boot()}
