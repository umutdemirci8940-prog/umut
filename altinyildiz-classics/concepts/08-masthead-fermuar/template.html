<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="ad.size" content="width=970,height=250">
<meta name="viewport" content="width=970,height=250">
<title>Altınyıldız Classics – Fermuarı Çek (970x250)</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Urbanist:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<script>var clickTag = window.clickTag || '';</script>
<style>
:root{--ink:#000;--paper:#fff;--mute:#666;--line:#e6e6e6;--soft:#f4f4f2;--ease:cubic-bezier(.22,.61,.36,1)}
*{box-sizing:border-box;margin:0;padding:0}
html,body{width:970px;height:250px;overflow:hidden;background:#fff}
body{font-family:Urbanist,"Helvetica Neue",Arial,sans-serif;color:var(--ink);-webkit-font-smoothing:antialiased;user-select:none;-webkit-user-select:none}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}
#ad{position:relative;width:970px;height:250px;overflow:hidden;cursor:pointer;background:#fff;border:1px solid var(--line)}
#ad:focus-visible{outline:2px solid var(--ink);outline-offset:-3px}

/* İç katman (montun altı) */
.inner{position:absolute;inset:0;background:#fff}
.inner .l{position:absolute;left:0;top:0;width:250px;height:100%;padding:20px 16px 16px 24px;display:flex;flex-direction:column}
.inner .logo{height:20px;align-self:flex-start}
.inner .over{margin-top:22px;font-size:10.5px;font-weight:700;letter-spacing:.24em;text-transform:uppercase;color:var(--mute)}
.inner h2{margin-top:4px;font-size:26px;font-weight:700;line-height:1.05;letter-spacing:-.01em}
.inner .sub{margin-top:8px;font-size:11.5px;color:#333;line-height:1.35}
.tiles{position:absolute;left:252px;top:16px;display:flex;gap:9px}
.tile{width:112px;text-align:left;opacity:.35;transform:translateY(8px);transition:opacity .5s,transform .6s var(--ease)}
.open .tile{opacity:1;transform:none}
.open .tile:nth-child(2){transition-delay:.06s}.open .tile:nth-child(3){transition-delay:.12s}.open .tile:nth-child(4){transition-delay:.18s}
.tile .ph{height:150px;background:var(--soft);overflow:hidden}
.tile img{width:100%;height:100%;object-fit:cover;display:block;transition:transform .5s var(--ease)}
.tile:hover img{transform:scale(1.06)}
.tile small{display:block;margin-top:7px;font-size:9px;font-weight:800;letter-spacing:.22em;text-transform:uppercase;color:var(--mute)}
.tile b{display:block;margin-top:2px;font-size:12px;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tile .n{display:inline-block;margin-top:6px;font-size:9.5px;font-weight:700;color:#999;letter-spacing:.1em}
.inner .r{position:absolute;right:0;top:0;width:224px;height:100%;padding:20px 22px 16px 10px;display:flex;flex-direction:column;justify-content:flex-end;gap:10px}
.cta{height:38px;background:#000;color:#fff;display:flex;align-items:center;justify-content:center;gap:10px;font-size:11.5px;font-weight:700;letter-spacing:.16em;text-transform:uppercase}
.cta .ar{transition:transform .3s var(--ease)}
.cta:hover .ar{transform:translateX(5px)}
.links{display:flex;justify-content:space-between;font-size:10.5px;font-weight:700}
.links button{border-bottom:1px solid #000;padding-bottom:1px}
.links .rp{border:0;color:var(--mute);font-weight:600}

/* Mont (üst katman) */
.half{position:absolute;top:0;width:485px;height:250px;overflow:hidden;will-change:transform,clip-path;z-index:3}
.half img{width:100%;height:100%;display:block;object-fit:cover;pointer-events:none}
.half.l{left:0}.half.r{left:485px}
.half.anim{transition:transform .9s cubic-bezier(.7,0,.3,1),clip-path .9s cubic-bezier(.7,0,.3,1)}
.half.l:after{content:"";position:absolute;inset:0;background:linear-gradient(90deg,rgba(0,0,0,.55),rgba(0,0,0,.05) 70%)}
.copy{position:absolute;left:24px;top:20px;z-index:4;color:#fff;pointer-events:none;transition:opacity .4s}
.copy img{height:20px;display:block}
.copy .over{margin-top:22px;font-size:10.5px;font-weight:700;letter-spacing:.26em;text-transform:uppercase;opacity:.85}
.copy h1{margin-top:5px;font-size:30px;font-weight:700;line-height:1.02;letter-spacing:-.01em}
.copy p{margin-top:12px;font-size:12px;font-weight:600;display:flex;align-items:center;gap:7px}
.copy p i{font-style:normal;display:inline-block;animation:bob 1.4s var(--ease) infinite}
@keyframes bob{50%{transform:translateY(4px)}}
.moving .copy,.open .copy{opacity:0}
/* Fermuar */
.teeth{position:absolute;left:479px;width:12px;bottom:0;z-index:5;pointer-events:none;
  background:repeating-linear-gradient(180deg,#2b2d33 0 3px,#8d8f96 3px 4px,#2b2d33 4px 6px),linear-gradient(90deg,#1c1e24,#1c1e24);background-size:6px 6px,12px 100%;background-position:0 0,0 0;background-repeat:repeat-y,no-repeat;
  box-shadow:0 0 0 1px rgba(0,0,0,.35)}
.teeth:after{content:"";position:absolute;left:6px;top:0;bottom:0;width:6px;background:repeating-linear-gradient(180deg,#2b2d33 0 1.5px,#8d8f96 1.5px 2.5px,#2b2d33 2.5px 6px)}
.pull{position:absolute;left:485px;width:26px;height:58px;margin-left:-13px;z-index:6;touch-action:none;cursor:grab}
.pull .body{position:absolute;left:3px;top:0;width:20px;height:20px;border-radius:5px 5px 7px 7px;background:linear-gradient(135deg,#e9eaee,#9a9ca3 55%,#5f6168);box-shadow:0 2px 4px rgba(0,0,0,.45)}
.pull .tab{position:absolute;left:6px;top:14px;width:14px;height:42px;border-radius:7px;background:linear-gradient(90deg,#c7c9cf,#f3f4f6 45%,#8f9198);box-shadow:0 3px 6px rgba(0,0,0,.45)}
.pull .tab:after{content:"";position:absolute;left:4px;bottom:6px;width:6px;height:12px;border-radius:3px;background:#2b2d33}
.pull.drag{cursor:grabbing}
.bubble{position:absolute;left:24px;top:12px;white-space:nowrap;background:#fff;color:#000;font-size:10.5px;font-weight:800;letter-spacing:.16em;text-transform:uppercase;padding:5px 9px;box-shadow:0 3px 10px rgba(0,0,0,.25);transition:opacity .3s}
.bubble:before{content:"";position:absolute;left:-5px;top:8px;border:5px solid transparent;border-left:0;border-right-color:#fff}
.moving .bubble,.open .bubble{opacity:0}
.open .pull,.open .teeth{opacity:0;pointer-events:none;transition:opacity .3s}

/* Açılış */
.intro{position:absolute;inset:0;background:#fff;z-index:20;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12px;transition:opacity .6s,visibility .6s}
.intro img{height:30px;opacity:0;transform:translateY(6px);animation:up .8s .1s var(--ease) forwards}
.intro .rule{width:0;height:1px;background:#000;animation:rule .8s .45s var(--ease) forwards}
@keyframes up{to{opacity:1;transform:none}}
@keyframes rule{to{width:180px}}
.started .intro{opacity:0;visibility:hidden}
@media (prefers-reduced-motion:reduce){*,*:before,*:after{animation-duration:.01ms!important;animation-iteration-count:1!important;transition-duration:.01ms!important}}
</style>
</head>
<body>
<div id="ad" role="link" tabindex="0" aria-label="Altınyıldız Classics – Fermuarı çekin, Kasım katmanlarını keşfedin. Aşağı ok fermuarı açar.">
  <div class="inner">
    <div class="l"><img class="logo" alt="Altınyıldız Classics" src="%%LOGO%%"><div class="over" id="oOver"></div><h2 id="oTitle"></h2><div class="sub" id="oSub"></div></div>
    <div class="tiles" id="tiles"></div>
    <div class="r"><button class="cta" id="cta" type="button"><span id="ctaTx"></span><span class="ar">→</span></button><div class="links"><button id="coats" type="button"></button><button class="rp" id="replay" type="button"></button></div></div>
  </div>

  <div class="half l" id="hl"><img alt="Altınyıldız Classics mont"></div>
  <div class="half r" id="hr"><img alt=""></div>
  <div class="copy"><img alt="Altınyıldız Classics" src="%%LOGO_W%%"><div class="over" id="cOver"></div><h1 id="cTitle"></h1><p><i>↓</i><span id="cSub"></span></p></div>
  <div class="teeth" id="teeth"></div>
  <div class="pull" id="pull" role="slider" tabindex="0" aria-label="Fermuar" aria-valuemin="0" aria-valuemax="100"><div class="body"></div><div class="tab"></div><div class="bubble" id="bubble"></div></div>

  <div class="intro" aria-hidden="true"><img alt="" src="%%LOGO%%"><div class="rule"></div></div>
</div>
<script>
(function () {
  'use strict';
  var D = /*DATA*/null, IMG = /*IMG*/null, C = D.copy, T = D.timing;
  var $ = function (id) { return document.getElementById(id); };
  var ad = $('ad'), hl = $('hl'), hr = $('hr'), pull = $('pull'), teeth = $('teeth');
  var p = 0, open = false, touched = false, timers = [];
  var TOP = 6, BOT = 196; // fermuar çekecinin gidebildiği aralık (px)
  var lines = function (arr) { return arr.map(function (s) { var e = document.createElement('div'); e.textContent = s; return e.outerHTML; }).join(''); };

  hl.querySelector('img').src = IMG.left; hr.querySelector('img').src = IMG.right;
  $('cOver').textContent = C.closedOver; $('cTitle').innerHTML = lines(C.closedTitle); $('cSub').textContent = C.closedSub;
  $('oOver').textContent = C.openOver; $('oTitle').innerHTML = lines(C.openTitle); $('oSub').textContent = C.openSub;
  $('ctaTx').textContent = C.cta; $('coats').textContent = C.coats + ' →'; $('replay').textContent = C.replay; $('bubble').textContent = C.pull + ' ↓';

  function exit(url, name) {
    if (window.Enabler && Enabler.exitOverride) { Enabler.exitOverride(name, url); return; }
    window.open(window.clickTag && /^https?:/.test(window.clickTag) ? window.clickTag : url, '_blank');
  }

  D.tiles.forEach(function (t, i) {
    var b = document.createElement('button'); b.type = 'button'; b.className = 'tile';
    b.innerHTML = '<div class="ph"><img alt=""></div><small></small><b></b><span class="n"></span>';
    b.querySelector('img').src = IMG[t.img]; b.querySelector('img').alt = t.name;
    b.querySelector('small').textContent = t.cat; b.querySelector('b').textContent = t.name; b.querySelector('.n').textContent = 'KATMAN 0' + (i + 1);
    b.addEventListener('click', function (e) { e.stopPropagation(); exit(t.url, 'Katman: ' + t.cat); });
    $('tiles').appendChild(b);
  });

  /* p: 0 (kapalı) → 1 (fermuar sonuna kadar). Mont V şeklinde açılır. */
  function render(anim) {
    var y = TOP + p * (BOT - TOP), zy = y + 20;     // açıklığın sivri ucu çekecin hemen üstünde
    var gap = Math.pow(p, 0.85) * 300;             // tepedeki açıklık (her yarı için)
    [hl, hr].forEach(function (h) { h.classList.toggle('anim', !!anim); });
    hl.style.clipPath = 'polygon(0 0,' + (485 - gap) + 'px 0,485px ' + zy + 'px,485px 250px,0 250px)';
    hr.style.clipPath = 'polygon(' + gap + 'px 0,485px 0,485px 250px,0 250px,0 ' + zy + 'px)';
    hl.style.transform = 'translateX(' + (-p * 14) + 'px)'; hr.style.transform = 'translateX(' + (p * 14) + 'px)';
    pull.style.transition = anim ? 'top .9s cubic-bezier(.7,0,.3,1)' : 'none'; teeth.style.transition = pull.style.transition.replace('top', 'top');
    pull.style.top = y + 'px'; teeth.style.top = (y + 8) + 'px';
    pull.setAttribute('aria-valuenow', Math.round(p * 100));
  }
  function animateTo(target, ms, done) {
    var from = p, t0 = performance.now();
    (function f(now) {
      var k = Math.min(1, (now - t0) / ms), e = k < .5 ? 4 * k * k * k : 1 - Math.pow(-2 * k + 2, 3) / 2;
      p = from + (target - from) * e; render(false);
      if (k < 1) requestAnimationFrame(f); else done && done();
    })(t0);
  }
  function fullyOpen() {
    if (open) return; open = true; ad.classList.add('open');
    hl.classList.add('anim'); hr.classList.add('anim');
    hl.style.clipPath = 'polygon(0 0,0 0,0 0,0 250px,0 250px)'; hr.style.clipPath = 'polygon(485px 0,485px 0,485px 250px,485px 250px,485px 0)';
    hl.style.transform = 'translateX(-60px)'; hr.style.transform = 'translateX(60px)';
    setTimeout(function () { hl.style.visibility = hr.style.visibility = 'hidden'; }, 950);
  }
  function close() {
    open = false; ad.classList.remove('open'); hl.style.visibility = hr.style.visibility = '';
    p = 1; render(false); requestAnimationFrame(function () { animateTo(0, 900); });
  }

  /* Sürükleme */
  var sy = null, sp = 0;
  pull.addEventListener('pointerdown', function (e) { e.stopPropagation(); if (open) return; userTouched(); sy = e.clientY; sp = p; pull.classList.add('drag'); pull.setPointerCapture(e.pointerId); ad.classList.add('moving'); });
  pull.addEventListener('pointermove', function (e) { if (sy === null) return; p = Math.max(0, Math.min(1, sp + (e.clientY - sy) / (BOT - TOP))); render(false); if (p >= 0.97) { sy = null; fullyOpen(); } });
  function rel() { if (sy === null) return; sy = null; pull.classList.remove('drag'); if (p > 0.55) animateTo(1, 350, fullyOpen); else animateTo(0, 500, function () { ad.classList.remove('moving'); }); }
  pull.addEventListener('pointerup', rel); pull.addEventListener('pointercancel', rel);
  pull.addEventListener('click', function (e) { e.stopPropagation(); });
  // Montun herhangi bir yerine tıklamak da fermuarı açar (ilk tıklama siteye götürmez)
  [hl, hr].forEach(function (h) { h.addEventListener('click', function (e) { e.stopPropagation(); if (open) return; userTouched(); ad.classList.add('moving'); animateTo(1, 1100, fullyOpen); }); });
  pull.addEventListener('keydown', function (e) { if (e.key === 'ArrowDown' || e.key === 'Enter' || e.key === ' ') { e.preventDefault(); e.stopPropagation(); userTouched(); animateTo(1, 1000, fullyOpen); } });

  $('cta').addEventListener('click', function (e) { e.stopPropagation(); exit(D.url, 'CTA'); });
  $('coats').addEventListener('click', function (e) { e.stopPropagation(); exit(D.coatsUrl, 'Montlar'); });
  $('replay').addEventListener('click', function (e) { e.stopPropagation(); close(); });
  ad.addEventListener('click', function () { exit(D.url, 'Ana Cikis'); });
  ad.addEventListener('keydown', function (e) { if (e.target !== ad) return; if (e.key === 'ArrowDown' && !open) { e.preventDefault(); userTouched(); animateTo(1, 1000, fullyOpen); } else if (e.key === 'Enter') exit(D.url, 'Klavye'); });

  /* Gösterim: fermuar biraz inip geri çıkar; etkileşim olmazsa mont kendiliğinden açılır */
  function userTouched() { if (touched) return; touched = true; timers.forEach(clearTimeout); }
  function tease() { if (touched || open) return; animateTo(0.32, 700, function () { setTimeout(function () { if (!touched) animateTo(0, 600); }, 250); }); } // başlık görünür kalır
  function start() {
    render(false);
    timers.push(setTimeout(function () { ad.classList.add('started'); }, 1500));
    timers.push(setTimeout(tease, T.tease), setTimeout(tease, T.tease + 4500));
    timers.push(setTimeout(function () { if (!touched && !open) { ad.classList.add('moving'); animateTo(1, 1400, fullyOpen); } }, T.autoOpen));
  }
  function boot() { if (window.Enabler && !Enabler.isInitialized()) Enabler.addEventListener('init', start); else start(); }
  if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', boot); else boot();
})();
</script>
</body>
</html>
