<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="ad.size" content="width=970,height=250">
<meta name="viewport" content="width=970,height=250">
<title>Altınyıldız Classics – Buğulu Cam (970x250)</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Urbanist:wght@400;500;600;700&display=swap" rel="stylesheet">
<script>var clickTag = window.clickTag || '';</script>
<style>
:root{--ink:#000;--paper:#fff;--mute:#555;--ease:cubic-bezier(.22,.61,.36,1)}
*{box-sizing:border-box;margin:0;padding:0}
html,body{width:970px;height:250px;overflow:hidden;background:#dfe5e9}
body{font-family:Urbanist,"Helvetica Neue",Arial,sans-serif;color:var(--ink);-webkit-font-smoothing:antialiased;user-select:none;-webkit-user-select:none}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}
#ad{position:relative;width:970px;height:250px;overflow:hidden;cursor:pointer;background:#dfe5e9}
#ad:focus-visible{outline:2px solid var(--ink);outline-offset:-3px}
.bg{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;transform:scale(1.04);transition:transform 6s var(--ease)}
.clear .bg{transform:scale(1)}
canvas{position:absolute;inset:0;width:970px;height:250px;touch-action:none;cursor:crosshair;transition:opacity 1.1s var(--ease)}
.clear canvas{opacity:0;pointer-events:none}

/* Buğu üzerindeki metin */
.fog{position:absolute;left:0;right:0;top:0;bottom:0;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;pointer-events:none;transition:opacity .6s}
.fog img{height:20px;margin-bottom:16px}
.fog .over{font-size:10.5px;font-weight:700;letter-spacing:.3em;text-transform:uppercase;color:#333}
.fog .t{margin-top:5px;font-size:28px;font-weight:600;line-height:1.08;letter-spacing:-.01em}
.fog .h{margin-top:12px;font-size:11px;color:#333;display:flex;align-items:center;gap:8px}
.meter{width:120px;height:2px;background:rgba(0,0,0,.15);position:relative;overflow:hidden}
.meter i{position:absolute;left:0;top:0;bottom:0;width:0;background:#000;transition:width .25s}
.wiping .fog{opacity:.35}
.clear .fog{opacity:0}
/* Demo parmak izi */
.finger{position:absolute;left:0;top:0;width:34px;height:34px;margin:-17px 0 0 -17px;border-radius:50%;background:rgba(255,255,255,.55);box-shadow:0 0 0 1.5px rgba(0,0,0,.55);pointer-events:none;opacity:0;transition:opacity .3s}
.finger.on{opacity:1}

/* Açılmış sahne */
.mid{position:absolute;left:330px;top:0;width:152px;height:250px;padding:18px 0 16px;display:flex;flex-direction:column;align-items:center;text-align:center;opacity:0;transform:translateY(8px);transition:opacity .7s .5s var(--ease),transform .7s .5s var(--ease);pointer-events:none}
.clear .mid{opacity:1;transform:none;pointer-events:auto}
.mid img{height:14px}
.mid .t{margin-top:46px;font-size:24px;font-weight:700;letter-spacing:.02em;text-transform:uppercase;line-height:1}
.mid .s{margin-top:5px;font-size:10.5px;font-weight:600;letter-spacing:.18em;text-transform:uppercase;color:#333}
.pick{margin-top:12px;display:flex;flex-direction:column;gap:6px;width:136px}
.pick button{height:26px;border:1px solid #000;background:rgba(255,255,255,.6);font-size:11px;font-weight:700;letter-spacing:.16em;text-transform:uppercase;transition:.25s}
.pick button:hover,.pick button.hl{background:#000;color:#fff}
.cta{margin-top:auto;width:136px;height:30px;background:#000;color:#fff;font-size:10.5px;font-weight:700;letter-spacing:.12em;text-transform:uppercase;display:flex;align-items:center;justify-content:center;gap:8px}
.cta .ar{transition:transform .3s var(--ease)}
.cta:hover .ar{transform:translateX(4px)}
.replay{position:absolute;right:10px;bottom:8px;font-size:10px;font-weight:600;color:#fff;letter-spacing:.06em;opacity:0;transition:opacity .5s 1s;text-shadow:0 1px 3px rgba(0,0,0,.5)}
.clear .replay{opacity:.85}

/* Ürün noktaları + kartları */
.hs{position:absolute;width:24px;height:24px;margin:-12px 0 0 -12px;border-radius:50%;opacity:0;transform:scale(.4);transition:opacity .4s 1s,transform .4s 1s var(--ease);z-index:3}
.hs{pointer-events:none}
.clear .hs{opacity:1;transform:none;pointer-events:auto}
.hs i{position:absolute;inset:7px;border-radius:50%;background:#fff;box-shadow:0 0 0 1px rgba(0,0,0,.3)}
.hs:before{content:"";position:absolute;inset:0;border-radius:50%;border:1.5px solid #fff;animation:ring 2s var(--ease) infinite}
@keyframes ring{0%{transform:scale(.5);opacity:1}100%{transform:scale(1.6);opacity:0}}
.card{position:absolute;width:100px;background:#fff;box-shadow:0 8px 24px rgba(0,0,0,.18);padding:5px 5px 7px;opacity:0;transform:translateY(6px);transition:opacity .3s,transform .35s var(--ease);pointer-events:none;z-index:4;text-align:left}
.card img{display:block;width:90px;height:118px;object-fit:cover}
.card b{display:block;margin-top:5px;font-size:10.5px;font-weight:700;line-height:1.15}
.card span{display:block;font-size:9px;color:#666;margin-top:2px;line-height:1.2}
.card em{display:block;margin-top:5px;font-style:normal;font-size:9.5px;font-weight:700;letter-spacing:.12em;text-transform:uppercase}
.card.on{opacity:1;transform:none;pointer-events:auto}

/* Açılış */
.intro{position:absolute;inset:0;background:#fff;z-index:20;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12px;transition:opacity .7s,visibility .7s}
.intro img{height:30px;opacity:0;transform:translateY(6px);animation:up .8s .1s var(--ease) forwards}
.intro .rule{width:0;height:1px;background:#000;animation:rule .8s .45s var(--ease) forwards}
@keyframes up{to{opacity:1;transform:none}}
@keyframes rule{to{width:180px}}
.started .intro{opacity:0;visibility:hidden}
@media (prefers-reduced-motion:reduce){*,*:before,*:after{animation-duration:.01ms!important;animation-iteration-count:1!important;transition-duration:.01ms!important}}
</style>
</head>
<body>
<div id="ad" role="link" tabindex="0" aria-label="Altınyıldız Classics – Buğulu camı silin, Polar ve Sweatshirt koleksiyonunu keşfedin">
  <img class="bg" id="bg" alt="Altınyıldız Classics Polar ve Sweatshirt koleksiyonu">
  <canvas id="cv" width="970" height="250" aria-hidden="true"></canvas>
  <div class="fog" id="fog">
    <img alt="Altınyıldız Classics" src="%%LOGO%%">
    <div class="over" id="fogOver"></div>
    <div class="t" id="fogTitle"></div>
    <div class="h"><span id="fogHint"></span><span class="meter"><i id="meter"></i></span><span id="pct">%0</span></div>
  </div>
  <div class="finger" id="finger"></div>

  <div class="mid" id="mid">
    <img alt="Altınyıldız Classics" src="%%LOGO%%">
    <div class="t" id="title"></div>
    <div class="s" id="sub"></div>
    <div class="pick" id="pick"></div>
    <button class="cta" id="cta" type="button"><span id="ctaTx"></span><span class="ar">→</span></button>
  </div>
  <button class="replay" id="replay" type="button"></button>

  <div class="intro" aria-hidden="true"><img alt="" src="%%LOGO%%"><div class="rule"></div></div>
</div>
<script>
(function () {
  'use strict';
  var D = /*DATA*/null, IMG = /*IMG*/null, C = D.copy, T = D.timing;
  var $ = function (id) { return document.getElementById(id); };
  var ad = $('ad'), cv = $('cv'), ctx = cv.getContext('2d');
  var W = 970, H = 250, DPR = Math.min(2, window.devicePixelRatio || 1);
  var frost = new Image(), cleared = false, interacted = false, last = null, refog = null, autoT = null;

  $('bg').src = IMG.bg;
  $('fogOver').textContent = C.fogOver;
  $('fogTitle').innerHTML = C.fogTitle.map(function (s) { var e = document.createElement('div'); e.textContent = s; return e.outerHTML; }).join('');
  $('fogHint').textContent = C.fogHint;
  $('title').textContent = C.title; $('sub').textContent = C.sub; $('ctaTx').textContent = C.cta; $('replay').textContent = '↺ ' + C.replay;

  function exit(url, name) {
    if (window.Enabler && Enabler.exitOverride) { Enabler.exitOverride(name, url); return; }
    window.open(window.clickTag && /^https?:/.test(window.clickTag) ? window.clickTag : url, '_blank');
  }

  /* Buğu katmanı */
  // Görünen katman = buğu fotoğrafı × maske. Silme ve yeniden buğulanma yalnızca maskeyi (alfa) değiştirir;
  // böylece fotoğraf üst üste çizilip renk bozulması birikmez.
  cv.width = W * DPR; cv.height = H * DPR; ctx.scale(DPR, DPR);
  var mask = document.createElement('canvas'); mask.width = cv.width; mask.height = cv.height;
  var mctx = mask.getContext('2d'); mctx.scale(DPR, DPR);
  var dirty = false;
  function render() {
    dirty = false;
    ctx.save(); ctx.setTransform(1, 0, 0, 1, 0, 0);
    ctx.globalCompositeOperation = 'source-over'; ctx.clearRect(0, 0, cv.width, cv.height);
    ctx.drawImage(frost, 0, 0, cv.width, cv.height);
    ctx.fillStyle = 'rgba(236,240,243,.38)'; ctx.fillRect(0, 0, cv.width, cv.height);
    ctx.globalCompositeOperation = 'destination-in'; ctx.drawImage(mask, 0, 0);
    ctx.restore();
  }
  function schedule() { if (!dirty) { dirty = true; requestAnimationFrame(render); } }
  function paintFog(alpha) {
    mctx.save(); mctx.globalCompositeOperation = 'source-over'; mctx.globalAlpha = alpha;
    mctx.fillStyle = '#000'; mctx.fillRect(0, 0, W, H); mctx.restore(); schedule();
  }
  function wipe(x, y, r) {
    mctx.save(); mctx.globalCompositeOperation = 'destination-out';
    var g = mctx.createRadialGradient(x, y, r * 0.35, x, y, r);
    g.addColorStop(0, 'rgba(0,0,0,1)'); g.addColorStop(1, 'rgba(0,0,0,0)');
    mctx.fillStyle = g; mctx.beginPath(); mctx.arc(x, y, r, 0, Math.PI * 2); mctx.fill();
    mctx.restore(); schedule();
  }
  function stroke(a, b, r) {
    var dx = b.x - a.x, dy = b.y - a.y, d = Math.sqrt(dx * dx + dy * dy), n = Math.max(1, Math.ceil(d / (r * 0.3)));
    for (var i = 1; i <= n; i++) wipe(a.x + dx * i / n, a.y + dy * i / n, r);
  }
  function measure() {
    var data = mctx.getImageData(0, 0, mask.width, mask.height).data, step = 16 * DPR, tot = 0, clr = 0;
    for (var y = 4; y < cv.height; y += step) for (var x = 4; x < cv.width; x += step) { tot++; if (data[(y * cv.width + x) * 4 + 3] < 90) clr++; }
    return clr / tot;
  }
  function progress() {
    if (cleared) return;
    var p = measure();
    $('meter').style.width = Math.min(100, p / T.threshold * 100) + '%';
    $('pct').textContent = '%' + Math.min(100, Math.round(p / T.threshold * 100));
    if (p >= T.threshold) reveal();
  }
  function reveal() {
    if (cleared) return;
    cleared = true; clearInterval(refog); clearTimeout(autoT);
    $('pct').textContent = '%100'; $('meter').style.width = '100%';
    ad.classList.remove('wiping'); ad.classList.add('clear');
  }
  function refogStart() {
    clearInterval(refog);
    refog = setInterval(function () { if (!cleared && !last) paintFog(0.018); }, 140); // cam yavaşça yeniden buğulanır
  }

  /* Silme etkileşimi */
  function pt(e) { var r = cv.getBoundingClientRect(); return { x: (e.clientX - r.left) * W / r.width, y: (e.clientY - r.top) * H / r.height }; }
  var moved = 0;
  cv.addEventListener('pointerdown', function (e) { e.stopPropagation(); userTouched(); last = pt(e); moved = 0; wipe(last.x, last.y, 30); cv.setPointerCapture(e.pointerId); ad.classList.add('wiping'); });
  cv.addEventListener('pointermove', function (e) {
    if (cleared) return;
    var p = pt(e);
    if (e.pointerType === 'mouse' && !last) { userTouched(); last = last || p; } // fareyle üzerinden geçmek de siler
    if (!last) return;
    moved += Math.abs(p.x - last.x) + Math.abs(p.y - last.y);
    stroke(last, p, 30); last = p;
    ad.classList.add('wiping');
  });
  function up() { last = null; ad.classList.remove('wiping'); progress(); }
  cv.addEventListener('pointerup', up);
  cv.addEventListener('pointerleave', up);
  cv.addEventListener('click', function (e) { e.stopPropagation(); });
  var meterT = setInterval(function () { if (last) progress(); }, 300);

  /* Açılmış sahne: kategori düğmeleri, noktalar, kartlar */
  D.sides.forEach(function (s, k) {
    var b = document.createElement('button'); b.type = 'button';
    b.textContent = s.arrow === 'left' ? '◂ ' + s.label : s.label + ' ▸';
    b.addEventListener('click', function (e) { e.stopPropagation(); exit(s.url, 'Kategori: ' + s.key); });
    $('pick').appendChild(b);

    var hs = document.createElement('button'); hs.type = 'button'; hs.className = 'hs'; hs.innerHTML = '<i></i>';
    hs.style.left = s.spot.x + 'px'; hs.style.top = s.spot.y + 'px'; hs.setAttribute('aria-label', s.card.name);
    var c = document.createElement('button'); c.type = 'button'; c.className = 'card';
    c.style.left = s.card.x + 'px'; c.style.top = s.card.y + 'px';
    c.innerHTML = '<img alt=""><b></b><span></span><em></em>';
    c.querySelector('img').src = IMG[s.card.img]; c.querySelector('img').alt = s.card.name;
    c.querySelector('b').textContent = s.card.name; c.querySelector('span').textContent = s.card.meta; c.querySelector('em').textContent = 'İncele →';
    var hide = null;
    function on() { clearTimeout(hide); c.classList.add('on'); b.classList.add('hl'); }
    function off() { hide = setTimeout(function () { c.classList.remove('on'); b.classList.remove('hl'); }, 220); }
    [hs, c, b].forEach(function (el) { el.addEventListener('mouseenter', on); el.addEventListener('mouseleave', off); });
    hs.addEventListener('click', function (e) { e.stopPropagation(); if (c.classList.contains('on')) exit(s.card.url, 'Urun: ' + s.card.name); else on(); });
    c.addEventListener('click', function (e) { e.stopPropagation(); exit(s.card.url, 'Urun: ' + s.card.name); });
    ad.appendChild(hs); ad.appendChild(c);
  });
  $('cta').addEventListener('click', function (e) { e.stopPropagation(); exit(D.url, 'CTA'); });
  $('replay').addEventListener('click', function (e) {
    e.stopPropagation(); cleared = false; ad.classList.remove('clear');
    mctx.clearRect(0, 0, W, H); paintFog(1); $('meter').style.width = '0'; $('pct').textContent = '%0'; refogStart();
  });
  ad.addEventListener('click', function () { exit(D.url, 'Ana Cikis'); });
  ad.addEventListener('keydown', function (e) { if (e.target !== ad) return; if (e.key === ' ') { e.preventDefault(); userTouched(); reveal(); } else if (e.key === 'Enter') exit(D.url, 'Klavye'); });

  /* Demo: görünmez parmak camda bir "S" çizer; etkileşim olmazsa cam kendiliğinden açılır */
  var demoRAF = null;
  function demo() {
    var f = $('finger'), t0 = performance.now(), dur = 1700, prev = null;
    f.classList.add('on');
    (function tick(now) {
      if (interacted) { f.classList.remove('on'); return; }
      var k = Math.min(1, (now - t0) / dur);
      var p = { x: 120 + k * 730, y: 125 + Math.sin(k * Math.PI * 2) * 62 };
      f.style.transform = 'translate(' + p.x + 'px,' + p.y + 'px)';
      if (prev) stroke(prev, p, 26); prev = p;
      if (k < 1) demoRAF = requestAnimationFrame(tick); else { f.classList.remove('on'); progress(); }
    })(t0);
  }
  function autoReveal() {
    if (interacted || cleared) return;
    var t0 = performance.now(), dur = 1300;
    (function sweep(now) {
      var k = Math.min(1, (now - t0) / dur);
      for (var row = 0; row < 5; row++) wipe(k * W, 25 + row * 50, 46);
      if (k < 1 && !interacted) requestAnimationFrame(sweep); else reveal();
    })(t0);
  }
  function userTouched() {
    if (interacted) return;
    interacted = true; clearTimeout(autoT); cancelAnimationFrame(demoRAF); $('finger').classList.remove('on');
  }
  function start() {
    paintFog(1); refogStart();
    setTimeout(function () { ad.classList.add('started'); }, 1500);
    setTimeout(function () { if (!interacted) demo(); }, T.demo);
    autoT = setTimeout(autoReveal, T.autoClear);
  }
  function boot() {
    var go = function () { if (window.Enabler && !Enabler.isInitialized()) Enabler.addEventListener('init', start); else start(); };
    frost.onload = go; frost.src = IMG.frost;
  }
  if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', boot); else boot();
})();
</script>
</body>
</html>
