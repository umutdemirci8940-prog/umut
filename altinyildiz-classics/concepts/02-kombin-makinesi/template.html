<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="ad.size" content="width=970,height=250">
<meta name="viewport" content="width=970,height=250">
<title>Altınyıldız Classics – Kasım Kombin Makinesi (970x250)</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Urbanist:wght@400;500;600;700&display=swap" rel="stylesheet">
<script>var clickTag = window.clickTag || '';</script>
<style>
:root{--ink:#000;--paper:#fff;--mute:#666;--line:#e6e6e6;--soft:#f4f4f2;--ease:cubic-bezier(.22,.61,.36,1);--R:156px}
*{box-sizing:border-box;margin:0;padding:0}
html,body{width:970px;height:250px;overflow:hidden;background:var(--paper)}
body{font-family:Urbanist,"Helvetica Neue",Arial,sans-serif;color:var(--ink);-webkit-font-smoothing:antialiased;user-select:none;-webkit-user-select:none}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}
#ad{position:relative;width:970px;height:250px;overflow:hidden;cursor:pointer;border:1px solid var(--line);background:var(--paper)}
#ad:focus-visible{outline:2px solid var(--ink);outline-offset:-3px}

/* Sol */
.left{position:absolute;left:0;top:0;width:250px;height:100%;padding:20px 18px 16px 24px;display:flex;flex-direction:column}
.logo{height:20px;width:auto;align-self:flex-start}
.eyebrow{margin-top:24px;font-size:10.5px;font-weight:600;letter-spacing:.22em;text-transform:uppercase;color:var(--mute)}
.headline{margin-top:5px;font-size:25px;font-weight:600;line-height:1.08;letter-spacing:-.01em}
.sub{margin-top:9px;font-size:12px;line-height:1.35;color:#333;max-width:200px}
.hint{margin-top:auto;font-size:10.5px;color:var(--mute);display:flex;gap:6px;align-items:center;transition:opacity .4s}
.hint .dot{width:6px;height:6px;border-radius:50%;background:var(--ink);animation:blink 1.4s infinite;flex:none}
@keyframes blink{50%{opacity:.15}}
.used .hint{opacity:0}

/* Makine */
.machine{position:absolute;left:250px;top:0;width:400px;height:250px;background:var(--soft);border-left:1px solid var(--line);border-right:1px solid var(--line)}
.lbl{position:absolute;top:12px;font-size:10px;font-weight:700;letter-spacing:.24em;color:var(--mute)}
.reel{position:absolute;top:30px;width:var(--R);height:var(--R);overflow:hidden;background:#fff;box-shadow:inset 0 0 0 1px #d8d8d8;touch-action:none;cursor:grab}
.reel:active{cursor:grabbing}
.reel:before,.reel:after{content:"";position:absolute;left:0;right:0;height:22px;z-index:2;pointer-events:none}
.reel:before{top:0;background:linear-gradient(#fff,rgba(255,255,255,0))}
.reel:after{bottom:0;background:linear-gradient(rgba(255,255,255,0),#fff)}
.strip{position:absolute;left:0;top:0;width:100%;will-change:transform}
.strip img{display:block;width:var(--R);height:var(--R);object-fit:cover;pointer-events:none}
.strip.blur img{filter:blur(1.4px)}
.nav{position:absolute;left:0;right:0;z-index:3;height:24px;display:flex;align-items:center;justify-content:center;font-size:12px;opacity:0;transition:opacity .25s;background:rgba(255,255,255,.85)}
.nav.up{top:0}.nav.dn{bottom:0}
.reel:hover .nav{opacity:1}
.win{position:absolute;top:30px;width:var(--R);height:var(--R);pointer-events:none;box-shadow:0 0 0 2px var(--ink);opacity:0;transition:opacity .3s;z-index:4}
.win.flash{animation:flash 1s var(--ease)}
@keyframes flash{0%,100%{opacity:0}20%,60%{opacity:1}}
.buy{position:absolute;top:196px;width:var(--R);height:28px;background:var(--ink);color:#fff;font-size:10.5px;font-weight:700;letter-spacing:.16em;text-transform:uppercase;display:flex;align-items:center;justify-content:center;gap:8px;transition:background .25s}
.buy:hover{background:#2a2a2a}
.buy .ar{transition:transform .3s var(--ease)}
.buy:hover .ar{transform:translateX(4px)}
.plus{position:absolute;top:96px;left:182px;width:14px;text-align:center;font-size:18px;font-weight:500;color:#999}

/* Kol */
.lever{position:absolute;left:356px;top:24px;width:36px;height:200px;touch-action:none}
.track{position:absolute;left:15px;top:14px;width:6px;height:150px;background:#d9d9d6;border-radius:3px}
.fill{position:absolute;left:15px;top:14px;width:6px;height:0;background:var(--ink);border-radius:3px}
.knob{position:absolute;left:4px;top:0;width:28px;height:28px;border-radius:50%;background:var(--ink);box-shadow:0 3px 8px rgba(0,0,0,.3);cursor:grab;transition:transform .45s cubic-bezier(.34,1.56,.64,1)}
.knob.drag{transition:none;cursor:grabbing}
.knob:after{content:"";position:absolute;inset:9px;border-radius:50%;background:#fff;opacity:.9}
.lever .tx{position:absolute;left:0;right:0;top:176px;text-align:center;font-size:10px;font-weight:700;letter-spacing:.2em}
.knob.nudge{animation:nudge 1.6s var(--ease) infinite}
@keyframes nudge{0%,100%{transform:translateY(0)}35%{transform:translateY(26px)}55%{transform:translateY(0)}}

/* Sağ */
.right{position:absolute;left:650px;top:0;width:320px;height:100%;padding:16px 20px 16px 20px;display:flex;flex-direction:column}
.rh{display:flex;justify-content:space-between;align-items:baseline;font-size:10.5px;font-weight:600;letter-spacing:.2em;text-transform:uppercase}
.rh em{font-style:normal;font-weight:500;letter-spacing:.04em;text-transform:none;color:var(--mute)}
.rh b{color:var(--ink);font-weight:700}
.item{margin-top:10px;display:grid;grid-template-columns:34px 1fr auto;align-items:center;gap:10px;padding:7px 0;border-bottom:1px solid var(--line);text-align:left}
.item .k{font-size:9.5px;font-weight:700;letter-spacing:.18em;color:var(--mute)}
.item .n{font-size:14px;font-weight:600;line-height:1.15}
.item .m{font-size:10.5px;color:var(--mute);margin-top:1px}
.item .go{font-size:13px;opacity:.35;transition:.25s}
.item:hover .go{opacity:1;transform:translateX(3px)}
.item + .item{margin-top:0}
.txt > *{transition:opacity .35s,transform .35s var(--ease)}
.swap .txt > *{opacity:0;transform:translateY(5px)}
.note{margin-top:10px;font-size:12.5px;font-weight:500;line-height:1.3;min-height:17px;transition:opacity .35s}
.swap .note{opacity:0}
.again{margin-top:auto;height:34px;border:1.5px solid var(--ink);display:flex;align-items:center;justify-content:center;gap:10px;font-size:12px;font-weight:700;letter-spacing:.16em;text-transform:uppercase;transition:background .25s,color .25s}
.again:hover{background:var(--ink);color:#fff}
.again .ic{display:inline-block;transition:transform .5s var(--ease)}
.again:hover .ic{transform:rotate(-180deg)}

/* Açılış */
.intro{position:absolute;inset:0;background:#fff;z-index:20;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12px;transition:opacity .6s,visibility .6s}
.intro img{height:30px;opacity:0;transform:translateY(6px);animation:up .8s .1s var(--ease) forwards}
.intro .rule{width:0;height:1px;background:#000;animation:rule .8s .45s var(--ease) forwards}
.intro p{font-size:11px;font-weight:600;letter-spacing:.34em;text-transform:uppercase;opacity:0;animation:up .7s .7s var(--ease) forwards}
@keyframes up{to{opacity:1;transform:none}}
@keyframes rule{to{width:180px}}
.started .intro{opacity:0;visibility:hidden}
@media (prefers-reduced-motion:reduce){*,*:before,*:after{animation-duration:.01ms!important;animation-iteration-count:1!important;transition-duration:.01ms!important}}
</style>
</head>
<body>
<div id="ad" role="link" tabindex="0" aria-label="Altınyıldız Classics – Kasım Kombin Makinesi">
  <div class="left">
    <img class="logo" alt="Altınyıldız Classics" src="%%LOGO%%">
    <div class="eyebrow" id="eyebrow"></div>
    <div class="headline" id="headline"></div>
    <div class="sub" id="sub"></div>
    <div class="hint"><span class="dot"></span><span id="hint"></span></div>
  </div>

  <div class="machine" id="machine">
    <div class="lbl" style="left:22px">ÜST</div>
    <div class="lbl" style="left:196px">ALT</div>
    <div class="reel" id="r0" style="left:22px"><div class="strip"></div><button class="nav up" type="button" aria-label="Önceki üst">▲</button><button class="nav dn" type="button" aria-label="Sonraki üst">▼</button></div>
    <div class="plus">+</div>
    <div class="reel" id="r1" style="left:196px"><div class="strip"></div><button class="nav up" type="button" aria-label="Önceki alt">▲</button><button class="nav dn" type="button" aria-label="Sonraki alt">▼</button></div>
    <div class="win" id="w0" style="left:22px"></div>
    <div class="win" id="w1" style="left:196px"></div>
    <button class="buy" id="l0" type="button" style="left:22px"><span class="bt"></span><span class="ar">→</span></button>
    <button class="buy" id="l1" type="button" style="left:196px"><span class="bt"></span><span class="ar">→</span></button>
    <div class="lever" id="lever" aria-label="Kolu çek">
      <div class="track"></div><div class="fill" id="fill"></div>
      <div class="knob nudge" id="knob" role="button" tabindex="0" aria-label="Kolu çek"></div>
      <div class="tx" id="leverTx"></div>
    </div>
  </div>

  <div class="right" id="right">
    <div class="rh"><span id="result"></span><em><span id="triedL"></span> <b id="tried">0</b>/25</em></div>
    <button class="item" id="i0" type="button"><span class="k">ÜST</span><span class="txt"><div class="n"></div><div class="m"></div></span><span class="go">→</span></button>
    <button class="item" id="i1" type="button"><span class="k">ALT</span><span class="txt"><div class="n"></div><div class="m"></div></span><span class="go">→</span></button>
    <div class="note" id="note"></div>
    <button class="again" id="again" type="button"><span class="ic">↻</span><span id="againTx"></span></button>
  </div>

  <div class="intro" aria-hidden="true"><img alt="" src="%%LOGO%%"><div class="rule"></div><p>Kasım Kombin Makinesi</p></div>
</div>
<script>
(function () {
  'use strict';
  var D = /*DATA*/null, IMG = /*IMG*/null, C = D.copy, T = D.timing;
  var $ = function (id) { return document.getElementById(id); };
  var ad = $('ad'), R = 156, REP = 7;
  var sets = [D.tops, D.bottoms];
  var state = [{ i: 0, pos: 0, lock: false }, { i: 0, pos: 0, lock: false }];
  var seen = {}, spinning = false, auto = true, t0 = Date.now(), idleTimer = null;

  $('eyebrow').textContent = C.eyebrow;
  $('headline').innerHTML = C.headline.map(function (s) { var e = document.createElement('div'); e.textContent = s; return e.outerHTML; }).join('');
  $('sub').textContent = C.sub; $('hint').textContent = C.hint; $('leverTx').textContent = C.lever;
  $('result').textContent = C.result; $('triedL').textContent = C.tried; $('againTx').textContent = C.again;

  function exit(url, name) {
    if (window.Enabler && Enabler.exitOverride) { Enabler.exitOverride(name, url); return; }
    window.open(window.clickTag && /^https?:/.test(window.clickTag) ? window.clickTag : url, '_blank');
  }

  /* Makaralar */
  var strips = [0, 1].map(function (r) {
    var s = document.querySelector('#r' + r + ' .strip'), html = '';
    for (var k = 0; k < REP; k++) sets[r].forEach(function (p) { html += '<img alt="" src="' + IMG[p.img] + '">'; });
    s.innerHTML = html;
    return s;
  });
  function N(r) { return sets[r].length; }
  function place(r, animMs) {
    var st = state[r], s = strips[r];
    s.style.transition = animMs ? 'transform ' + animMs + 'ms cubic-bezier(.15,.7,.2,1.04)' : 'none';
    s.style.transform = 'translateY(' + (-st.pos * R) + 'px)';
  }
  function normalize(r) {
    var st = state[r], n = N(r);
    st.pos = Math.floor(REP / 2) * n + st.i; place(r, 0);
  }
  [0, 1].forEach(function (r) { state[r].i = r; normalize(r); });

  function step(r, d) {
    if (spinning) return;
    used(); var st = state[r], n = N(r);
    st.i = (st.i + d + n) % n; st.pos += d; place(r, 380);
    setTimeout(function () { normalize(r); }, 400);
    update(r);
  }

  function spin(isAuto) {
    if (spinning) return;
    if (!isAuto) used();
    var targets = [0, 1].map(function (r) { return state[r].lock ? -1 : r; }).filter(function (r) { return r >= 0; });
    if (!targets.length) { [0, 1].forEach(function (r) { flash(r); }); return; }
    spinning = true;
    $('right').classList.add('swap');
    var longest = 0;
    targets.forEach(function (r, k) {
      var st = state[r], n = N(r), nxt;
      do { nxt = Math.floor(Math.random() * n); } while (nxt === st.i && n > 1);
      var delta = ((nxt - st.i) + n) % n, laps = 2 + k;
      st.pos += laps * n + delta; st.i = nxt;
      var ms = 1100 + k * 450; longest = Math.max(longest, ms);
      strips[r].classList.add('blur');
      place(r, ms);
      setTimeout(function () { strips[r].classList.remove('blur'); }, ms - 250);
      setTimeout(function () { normalize(r); flash(r); }, ms + 30);
    });
    setTimeout(function () { spinning = false; update(); }, longest + 60);
  }
  function flash(r) { var w = $('w' + r); w.classList.remove('flash'); void w.offsetWidth; w.classList.add('flash'); }

  function update(onlyR) {
    var t = D.tops[state[0].i], b = D.bottoms[state[1].i];
    var right = $('right');
    right.classList.add('swap');
    setTimeout(function () {
      [[t, 'i0'], [b, 'i1']].forEach(function (x) { var el = $(x[1]); el.querySelector('.n').textContent = x[0].name; el.querySelector('.m').textContent = x[0].meta; });
      $('note').textContent = D.notes[t.type + '|' + b.type] || '';
      $('l0').setAttribute('aria-label', C.buy + ': ' + t.name); $('l1').setAttribute('aria-label', C.buy + ': ' + b.name);
      seen[state[0].i + '-' + state[1].i] = 1;
      $('tried').textContent = Object.keys(seen).length;
      right.classList.remove('swap');
    }, onlyR === undefined ? 120 : 160);
  }

  /* Satın Al: makarada o an görünen ürünün sayfasına gider */
  [0, 1].forEach(function (r) {
    var b = $('l' + r);
    b.querySelector('.bt').textContent = C.buy;
    b.addEventListener('click', function (e) { e.stopPropagation(); exit(sets[r][state[r].i].url, (r ? 'Alt' : 'Ust') + ' Satin Al'); });
  });

  /* Makara: oklar, sürükleme, tekerlek */
  [0, 1].forEach(function (r) {
    var reel = $('r' + r);
    reel.querySelector('.up').addEventListener('click', function (e) { e.stopPropagation(); step(r, -1); });
    reel.querySelector('.dn').addEventListener('click', function (e) { e.stopPropagation(); step(r, 1); });
    var y0 = null, moved = false;
    reel.addEventListener('pointerdown', function (e) { if (e.target.classList.contains('nav')) return; y0 = e.clientY; moved = false; reel.setPointerCapture(e.pointerId); });
    reel.addEventListener('pointermove', function (e) {
      if (y0 === null || spinning) return;
      var dy = e.clientY - y0; moved = moved || Math.abs(dy) > 4;
      strips[r].style.transition = 'none';
      strips[r].style.transform = 'translateY(' + (-state[r].pos * R + dy) + 'px)';
    });
    reel.addEventListener('pointerup', function (e) {
      if (y0 === null) return;
      var dy = e.clientY - y0; y0 = null;
      if (Math.abs(dy) > 24) step(r, dy < 0 ? 1 : -1); else { place(r, 200); if (!moved) exit(sets[r][state[r].i].url, 'Makara urun'); }
    });
    reel.addEventListener('click', function (e) { e.stopPropagation(); });
    reel.addEventListener('wheel', function (e) { e.preventDefault(); if (Math.abs(e.deltaY) > 8) step(r, e.deltaY > 0 ? 1 : -1); }, { passive: false });
  });

  /* Kol */
  var knob = $('knob'), fill = $('fill'), MAXY = 150, kY = null, ky = 0;
  function setKnob(y) { ky = Math.max(0, Math.min(MAXY, y)); knob.style.transform = 'translateY(' + ky + 'px)'; fill.style.height = ky + 'px'; }
  function release(trigger) {
    knob.classList.remove('drag'); fill.style.transition = 'height .45s cubic-bezier(.34,1.56,.64,1)';
    setKnob(0); setTimeout(function () { fill.style.transition = ''; }, 460);
    if (trigger) spin();
  }
  knob.addEventListener('pointerdown', function (e) { e.stopPropagation(); used(); kY = e.clientY - ky; knob.classList.add('drag'); knob.setPointerCapture(e.pointerId); });
  knob.addEventListener('pointermove', function (e) { if (kY !== null) setKnob(e.clientY - kY); });
  knob.addEventListener('pointerup', function (e) { if (kY === null) return; kY = null; release(ky > MAXY * 0.45 || ky < 6); });
  $('lever').addEventListener('click', function (e) { e.stopPropagation(); });
  function pullAnim(cb) {
    knob.classList.remove('nudge');
    knob.style.transition = 'transform .35s cubic-bezier(.5,0,.75,0)'; fill.style.transition = 'height .35s cubic-bezier(.5,0,.75,0)';
    setKnob(MAXY);
    setTimeout(function () { knob.style.transition = ''; fill.style.transition = ''; release(false); cb && cb(); }, 380);
  }
  knob.addEventListener('keydown', function (e) { if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); e.stopPropagation(); used(); pullAnim(spin); } });

  /* Diğer tıklamalar */
  $('i0').addEventListener('click', function (e) { e.stopPropagation(); exit(D.tops[state[0].i].url, 'Ust urun'); });
  $('i1').addEventListener('click', function (e) { e.stopPropagation(); exit(D.bottoms[state[1].i].url, 'Alt urun'); });
  $('again').addEventListener('click', function (e) { e.stopPropagation(); used(); pullAnim(spin); }); // siteye götürmez, yeni kombin çevirir
  $('machine').addEventListener('click', function (e) { e.stopPropagation(); });
  ad.addEventListener('click', function () { exit(D.tops[state[0].i].cat, 'Ana Cikis'); });
  ad.addEventListener('keydown', function (e) {
    if (e.target !== ad) return;
    if (e.key === ' ' ) { e.preventDefault(); used(); pullAnim(spin); }
    else if (e.key === 'ArrowUp' || e.key === 'ArrowDown') { e.preventDefault(); step(0, e.key === 'ArrowDown' ? 1 : -1); }
    else if (e.key === 'ArrowLeft' || e.key === 'ArrowRight') { e.preventDefault(); step(1, e.key === 'ArrowRight' ? 1 : -1); }
    else if (e.key === 'Enter') exit(D.tops[state[0].i].cat, 'Klavye');
  });

  /* Otomatik oynatma */
  function used() { if (!auto) return; auto = false; clearInterval(idleTimer); ad.classList.add('used'); knob.classList.remove('nudge'); }
  function start() {
    update();
    setTimeout(function () { ad.classList.add('started'); }, 1700);
    setTimeout(function () { if (auto) pullAnim(function () { spin(true); }); }, T.demoSpin);
    idleTimer = setInterval(function () {
      if (!auto) return;
      if (Date.now() - t0 > T.maxAutoplay - T.idleSpin) { clearInterval(idleTimer); return; }
      pullAnim(function () { spin(true); });
    }, T.idleSpin);
  }
  function boot() { if (window.Enabler && !Enabler.isInitialized()) Enabler.addEventListener('init', start); else start(); }
  if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', boot); else boot();
})();
</script>
</body>
</html>
