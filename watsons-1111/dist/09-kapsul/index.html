  W.copy = function (text, btn) {
    function ok() { if (btn) { var o = btn.getAttribute('data-label') || btn.innerHTML; btn.setAttribute('data-label', o); btn.innerHTML = 'Kopyalandı!'; setTimeout(function () { btn.innerHTML = o; }, 1600); } W.track('kupon_kopya'); }
    if (navigator.clipboard && navigator.clipboard.writeText) navigator.clipboard.writeText(text).then(ok, ok);
    else { var t = W.el('textarea'); t.value = text; document.body.appendChild(t); t.select(); try { document.execCommand('copy'); } catch (e) { /* yok */ } t.remove(); ok(); }
  };

  // Ortak parçalar: logo, 11.11 rozeti, yasal not, CTA
  W.logo = function (cls) { return '<img class="wlogo ' + (cls || '') + '" src="' + D.brand.logo + '" alt="Watsons">'; };
  W.badge = function (cls) { return '<div class="b1111 ' + (cls || '') + '"><b>11.11</b><span>' + D.brand.event + '</span></div>'; };

  // Sürükle / kaydır: fare ve dokunmatik için tek arayüz
  W.drag = function (el, h) {
    var on = false, sx = 0, sy = 0;
    function pt(e) { var t = e.touches ? e.touches[0] || e.changedTouches[0] : e; return { x: t.clientX, y: t.clientY }; }
    function down(e) { on = true; var p = pt(e); sx = p.x; sy = p.y; if (h.start) h.start(p, e); }
    function move(e) { if (!on) return; var p = pt(e); if (h.move) h.move(p, p.x - sx, p.y - sy, e); if (e.cancelable && h.prevent !== false) e.preventDefault(); }
    function up(e) { if (!on) return; on = false; var p = pt(e); if (h.end) h.end(p, p.x - sx, p.y - sy, e); }
    el.addEventListener('mousedown', down); addEventListener('mousemove', move); addEventListener('mouseup', up);
    el.addEventListener('touchstart', down, { passive: true }); el.addEventListener('touchmove', move, { passive: false }); el.addEventListener('touchend', up);
  };

  // Siteye yalnızca CTA düğmeleri (.cta) yönlendirir; reklamın geri kalanına tıklamak sadece etkileşimdir.
  // Kendi işlevi olan düğmeler (Oyna, Tekrar…) olayı durdurduğu için buraya gelmez.
  document.addEventListener('click', function (e) {
    var c = e.target.closest('.cta');
    if (!c) return;
    e.preventDefault(); W.exit(c.getAttribute('data-exit') || '', c.getAttribute('data-label') || 'cta');
  });

  // Görseller yüklenince başlat (önizlemede boş kare görünmesin)
  W.ready = function (fn) {
    function go() {
      var imgs = W.$$('img'); var left = imgs.length; var done = false;
      function fin() { if (!done) { done = true; root.classList.add('on'); fn(); } }
      if (!left) return fin();
      imgs.forEach(function (i) { if (i.complete) { if (--left <= 0) fin(); } else { i.addEventListener('load', function () { if (--left <= 0) fin(); }); i.addEventListener('error', function () { if (--left <= 0) fin(); }); } });
      setTimeout(fin, 2500);
    }
    if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', go); else go();
  };
})();
</script>
<script>
(function () {
  var D = W.data, dome = W.$('#dome'), items = W.shuffle(D.products.slice(0, 12)), cols = ['#e708a3', '#009aa9', '#ffd23f', '#7a3cff', '#ff8a3d'];
  var caps = items.map(function (p, i) {
    var c = W.el('div', 'cap', '<img src="' + p.img + '" alt="">'); c.style.setProperty('--c', cols[i % cols.length]);
    var row = Math.floor(i / 4), x = 8 + (i % 4) * 34 + (row % 2) * 14, y = 96 - row * 34;
    c._x = x; c._y = y; c.style.transform = 'translate(' + x + 'px,' + y + 'px) rotate(' + (i * 47) + 'deg)';
    dome.appendChild(c); return c;
  });
  var turns = 0, busy = false, rot = 0;
  function shake() { caps.forEach(function (c, i) { if (!c.parentNode) return; c.style.transform = 'translate(' + (c._x + Math.random() * 16 - 8) + 'px,' + (c._y - Math.random() * 30) + 'px) rotate(' + Math.random() * 360 + 'deg)'; }); setTimeout(function () { caps.forEach(function (c) { c.style.transform = 'translate(' + c._x + 'px,' + c._y + 'px) rotate(' + Math.random() * 360 + 'deg)'; }); }, 420); }
  function turn() {
    if (busy || turns >= items.length) return; busy = true;
    rot += 360; W.$('#knob').style.transform = 'rotate(' + rot + 'deg)';
    W.$('#ad').classList.remove('got'); W.$('#hint').style.display = 'none';
    shake(); setTimeout(shake, 450);
    var p = items[turns], c = caps[turns], col = cols[turns % cols.length]; turns++;
    setTimeout(function () {
      c.remove();
      var o = W.$('#out'); o.innerHTML = ''; var cc = W.el('div', 'cap', '<img src="' + p.img + '" alt="">'); cc.style.setProperty('--c', col); o.appendChild(cc);
      cc.animate([{ transform: 'translate(0,-30px) scale(.6)' }, { transform: 'translate(0,0) scale(1)', offset: .4 }, { transform: 'translate(120px,-120px) scale(1.6) rotate(400deg)', opacity: 1 }, { transform: 'translate(210px,-110px) scale(2.2) rotate(540deg)', opacity: 0 }], { duration: 1100, easing: 'cubic-bezier(.4,0,.3,1)', fill: 'forwards' });
      setTimeout(function () { show(p); busy = false; }, 900);
    }, 1000);
    W.track('kapsul_' + turns);
  }
  function show(p) {
    var card = W.$('#card');
    card.innerHTML = '<img src="' + p.img + '" alt=""><b>' + p.brand + '</b><span>' + p.name + '</span>' + (p.price ? '<div class="pr">' + W.price(p.price) + '</div>' : '');
    W.$('#k').textContent = 'Kapsülden çıkan'; W.$('#h').innerHTML = p.brand; W.$('#p').textContent = (p.club ? 'Watsons Club ile ' + W.price(p.club) + '. ' : '') + D.brand.offer;
    W.$('#lf').textContent = (items.length - turns) + ' kapsül daha · Tekrar çevir';
    W.$('#ad').classList.add('got');
    var r = card.getBoundingClientRect(); W.confetti(W.$('#ad'), 50, { x: r.left + 75, y: r.top + 40 });
  }
  W.$('#knob').addEventListener('click', function (e) { e.stopPropagation(); turn(); });
  W.ready(function () { setTimeout(function () { if (!turns) turn(); }, 2600); });
})();
</script>
