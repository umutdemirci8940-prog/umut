/* Watsons 11.11 – ortak stil */
:root {
  --teal: #009aa9; --teal-d: #00737f; --teal-l: #c6eef2;
  --pink: #e708a3; --gold: #ffd23f; --ink: #0d2b33; --night: #071a24; --cream: #fff7f0;
  --f: 'Rubik', 'Helvetica Neue', Arial, sans-serif;
}
* { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
html, body { width: 100%; height: 100%; overflow: hidden; }
body { font-family: var(--f); color: #fff; background: var(--night); -webkit-font-smoothing: antialiased; user-select: none; -webkit-user-select: none; }
img { display: block; -webkit-user-drag: none; user-select: none; }
button { font: inherit; border: 0; background: none; color: inherit; cursor: pointer; }
.ad { position: relative; width: 100%; height: 100%; overflow: hidden; cursor: pointer; }
.ad * { transition-timing-function: cubic-bezier(.22, .8, .2, 1); }

/* Logo ve rozet */
.wlogo { height: 19px; width: auto; flex: none; align-self: flex-start; }
.side .wlogo, .info .wlogo, .hud .wlogo { align-self: flex-end; }
img.wlogo[src*="logo-c"] { height: 26px; }
.b1111 { display: inline-flex; flex-direction: column; align-items: flex-start; line-height: .86; }
.b1111 b { font-size: 46px; font-weight: 900; letter-spacing: -.04em; background: linear-gradient(180deg, #fff 30%, #c9f1f4); -webkit-background-clip: text; background-clip: text; color: transparent; filter: drop-shadow(0 3px 0 rgba(0, 0, 0, .18)); }
.b1111 span { margin-top: 6px; font-size: 10px; font-weight: 800; letter-spacing: .2em; text-transform: uppercase; color: var(--gold); }

/* Düğmeler */
.cta { display: inline-flex; align-items: center; gap: 8px; height: 38px; padding: 0 20px; border-radius: 99px; background: #fff; color: var(--teal-d); font-size: 13px; font-weight: 800; letter-spacing: .02em; box-shadow: 0 8px 20px rgba(0, 0, 0, .22); transition: transform .25s, box-shadow .25s, background .25s; white-space: nowrap; }
.cta::after { content: '›'; font-size: 20px; line-height: 1; margin-top: -2px; }
.cta:hover { transform: translateY(-2px); box-shadow: 0 12px 26px rgba(0, 0, 0, .3); }
.cta.pk { background: var(--pink); color: #fff; }
.cta.pulse { animation: pulse 1.8s infinite; }
@keyframes pulse { 0%, 100% { box-shadow: 0 0 0 0 rgba(255, 255, 255, .55), 0 8px 20px rgba(0, 0, 0, .22); } 60% { box-shadow: 0 0 0 12px rgba(255, 255, 255, 0), 0 8px 20px rgba(0, 0, 0, .22); } }
.legal { position: absolute; font-size: 8px; line-height: 1.2; color: rgba(255, 255, 255, .62); letter-spacing: .02em; pointer-events: none; }
.hint { display: inline-flex; align-items: center; gap: 6px; font-size: 11px; font-weight: 700; color: rgba(255, 255, 255, .9); }
.hint i { width: 18px; height: 18px; border-radius: 50%; background: rgba(255, 255, 255, .22); position: relative; animation: tap 1.4s infinite; }
.hint i::after { content: ''; position: absolute; inset: 5px; border-radius: 50%; background: #fff; }
@keyframes tap { 0%, 100% { transform: scale(1); } 50% { transform: scale(.75); } }

/* Ürün çipi */
.pc { position: relative; display: flex; flex-direction: column; align-items: center; justify-content: flex-end; background: #fff; border-radius: 14px; color: var(--ink); overflow: hidden; }
.pc img { width: 100%; height: 100%; object-fit: contain; }
.pc .pn { font-size: 10px; font-weight: 700; line-height: 1.2; text-align: center; padding: 0 6px 6px; }
.pc .pb { font-size: 9px; font-weight: 900; letter-spacing: .08em; text-transform: uppercase; color: var(--teal-d); }
.pc .pp { font-size: 13px; font-weight: 900; color: var(--pink); }

/* Konfeti */
.cf { position: absolute; width: 7px; height: 11px; border-radius: 2px; pointer-events: none; z-index: 99; animation: cf 1.4s cubic-bezier(.2, .7, .3, 1) forwards; }
@keyframes cf { 0% { transform: translate(0, 0) rotate(0); opacity: 1; } 100% { transform: translate(var(--x), calc(var(--y) + 160px)) rotate(var(--r)); opacity: 0; } }

/* Kupon */
.coupon { display: inline-flex; align-items: center; gap: 10px; padding: 6px 6px 6px 14px; border: 2px dashed rgba(255, 255, 255, .7); border-radius: 12px; font-weight: 800; }
.coupon code { font-family: inherit; font-size: 16px; letter-spacing: .08em; }
.coupon button { height: 28px; padding: 0 12px; border-radius: 8px; background: #fff; color: var(--teal-d); font-size: 11px; font-weight: 800; }

/* Giriş animasyon yardımcıları */
.fx { opacity: 0; transform: translateY(14px); transition: opacity .7s, transform .7s; }
.on .fx { opacity: 1; transform: none; }
.on .fx.d1 { transition-delay: .15s; } .on .fx.d2 { transition-delay: .3s; } .on .fx.d3 { transition-delay: .45s; } .on .fx.d4 { transition-delay: .6s; }

.ad { background: linear-gradient(105deg, #fff 0%, #f1fbfc 55%, #d8f4f6 100%); color: var(--ink); }

.q .k { font-size: 10px; font-weight: 800; letter-spacing: .18em; text-transform: uppercase; color: var(--teal-d); }
.q h2 { font-size: 20px; font-weight: 900; line-height: 1.1; margin: 4px 0 12px; }
.opts { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
.opts button { height: 46px; border-radius: 12px; background: #fff; color: var(--ink); font-size: 12px; font-weight: 800; box-shadow: 0 4px 12px rgba(0, 90, 100, .1), inset 0 0 0 2px #dff2f4; display: flex; align-items: center; gap: 10px; padding: 0 12px; text-align: left; transition: transform .2s, box-shadow .2s, background .2s; }
.opts button span { font-size: 18px; }
.opts button:hover { transform: translateY(-2px); box-shadow: 0 8px 16px rgba(0, 90, 100, .16), inset 0 0 0 2px var(--teal); }
.opts button.sel { background: var(--teal); color: #fff; }
.pane { transition: opacity .35s, transform .35s; }
.pane.out { opacity: 0; transform: translateX(-20px); }
.res { display: none; }
.res.on { display: flex; gap: 10px; align-items: stretch; }
.rc { width: 92px; border-radius: 14px; background: #fff; box-shadow: 0 8px 18px rgba(0, 90, 100, .14); padding: 8px; display: flex; flex-direction: column; align-items: center; cursor: pointer; animation: rin .5s backwards; }
.rc:nth-child(2) { animation-delay: .12s; } .rc:nth-child(3) { animation-delay: .24s; }
@keyframes rin { from { opacity: 0; transform: translateY(16px); } }
.rc em { font-style: normal; font-size: 9px; font-weight: 900; letter-spacing: .1em; color: #fff; background: var(--pink); border-radius: 99px; padding: 3px 8px; }
.rc img { width: 78px; height: 74px; object-fit: contain; margin: 4px 0; }
.rc b { font-size: 8.5px; font-weight: 900; letter-spacing: .08em; text-transform: uppercase; color: var(--teal-d); text-align: center; }
.rr { flex: none; width: 150px; display: flex; flex-direction: column; justify-content: space-between; gap: 6px; margin-left: 6px; }
.rr p { font-size: 11px; font-weight: 600; color: #4d6a70; }

<script>/* Watsons 11.11 – ortak reklam motoru (tıklama çıkışı, olay ölçümü, yardımcılar) */
(function () {
  'use strict';
  var D = window.AD_DATA || {};
  var W = window.W = { data: D };
  var root = document.documentElement;

  // Masaüstü 970×250 / mobil 320×480: reklam kendi alanının ölçüsüne göre yerleşim seçer
  W.mobile = function () { return window.innerWidth < 640; };
  function mode() { root.classList.toggle('m', W.mobile()); root.classList.toggle('d', !W.mobile()); }
  mode();
  addEventListener('resize', mode);

  // Çıkış: clickTag (Google Ads / DV360 / Admost) → Enabler (Studio) → yedek adres
  W.exit = function (url, label) {
    W.track('exit_' + (label || 'genel'));
    var target = window.clickTag || url || D.brand.home;
    if (window.Enabler && Enabler.exitOverride) { Enabler.exitOverride(label || 'CTA', target); return; }
    window.open(target, '_blank');
  };
  // Olay ölçümü: Studio sayaçları varsa onları, yoksa konsolu kullanır
  W.track = function (name) {
    try { if (window.Enabler && Enabler.counter) Enabler.counter(name); } catch (e) { /* yok */ }
    if (window.console && console.debug) console.debug('[watsons-ad]', name);
  };
  W.$ = function (s, el) { return (el || document).querySelector(s); };
  W.$$ = function (s, el) { return Array.prototype.slice.call((el || document).querySelectorAll(s)); };
  W.el = function (tag, cls, html) { var e = document.createElement(tag); if (cls) e.className = cls; if (html != null) e.innerHTML = html; return e; };
  W.wait = function (ms) { return new Promise(function (r) { setTimeout(r, ms); }); };
  W.reduced = window.matchMedia && matchMedia('(prefers-reduced-motion: reduce)').matches;
  W.shuffle = function (a) { a = a.slice(); for (var i = a.length - 1; i > 0; i--) { var j = Math.floor(Math.random() * (i + 1)); var t = a[i]; a[i] = a[j]; a[j] = t; } return a; };
  W.price = function (p) { return p ? p + ' TL' : ''; };

  // Kampanya saati: 11.11 00:00 (Türkiye) — öncesinde geri sayım, sırasında "bitmesine", sonrasında "son gün"
  W.campaign = function () {
    var y = new Date().getFullYear();
    var start = Date.UTC(y, 10, 10, 21, 0, 0); // 11 Kasım 00:00 TSİ
    var end = Date.UTC(y, 10, 11, 21, 0, 0);   // 12 Kasım 00:00 TSİ
    var now = Date.now();
    if (D.forceNow) now = D.forceNow;
    if (now < start) return { phase: 'once', left: start - now };
    if (now < end) return { phase: 'gun', left: end - now };
    return { phase: 'sonra', left: 0 };
  };
  W.split = function (ms) {
    var s = Math.max(0, Math.floor(ms / 1000));
    return { d: Math.floor(s / 86400), h: Math.floor(s / 3600) % 24, m: Math.floor(s / 60) % 60, s: s % 60 };
  };
  W.pad = function (n) { return (n < 10 ? '0' : '') + n; };

  // Konfeti (Watsons turkuazı, magenta, altın)
  W.confetti = function (host, n, origin) {
    host = host || document.body; n = n || 70;
    var cols = ['#009aa9', '#e708a3', '#ffd23f', '#ffffff', '#5fd3df'];
    var r = host.getBoundingClientRect();
    var ox = origin ? origin.x : r.width / 2, oy = origin ? origin.y : r.height / 2;
    for (var i = 0; i < n; i++) {
      var c = W.el('i', 'cf');
      var a = Math.random() * Math.PI * 2, v = 80 + Math.random() * 220;
      c.style.cssText = 'left:' + ox + 'px;top:' + oy + 'px;background:' + cols[i % cols.length] + ';--x:' + Math.cos(a) * v + 'px;--y:' + (Math.sin(a) * v - 60) + 'px;--r:' + (Math.random() * 720 - 360) + 'deg;animation-delay:' + Math.random() * 0.12 + 's';
      host.appendChild(c);
      (function (c) { setTimeout(function () { c.remove(); }, 1600); })(c);
    }
  };

  // Kupon kodu kopyalama (çıkışı tetiklemez)
  W.copy = function (text, btn) {
    function ok() { if (btn) { var o = btn.getAttribute('data-label') || btn.innerHTML; btn.setAttribute('data-label', o); btn.innerHTML = 'Kopyalandı!'; setTimeout(function () { btn.innerHTML = o; }, 1600); } W.track('kupon_kopya'); }
    if (navigator.clipboard && navigator.clipboard.writeText) navigator.clipboard.writeText(text).then(ok, ok);
    else { var t = W.el('textarea'); t.value = text; document.body.appendChild(t); t.select(); try { document.execCommand('copy'); } catch (e) { /* yok */ } t.remove(); ok(); }
  };

  // Ortak parçalar: logo, 11.11 rozeti, yasal not, CTA
  W.logo = function (cls) { return '<img class="wlogo ' + (cls || '') + '" src="' + D.brand.logo + '" alt="Watsons">'; };
  W.badge = function (cls) { return '<div class="b1111 ' + (cls || '') + '"><b>11.11</b><span>' + D.brand.event + '</span></div>'; };

  // Sürükle / kaydır: fare ve dokunmatik için tek arayüz
  W.drag = function (el, h) {
    var on = false, sx = 0, sy = 0;
    function pt(e) { var t = e.touches ? e.touches[0] || e.changedTouches[0] : e; return { x: t.clientX, y: t.clientY }; }
    function down(e) { on = true; var p = pt(e); sx = p.x; sy = p.y; if (h.start) h.start(p, e); }
    function move(e) { if (!on) return; var p = pt(e); if (h.move) h.move(p, p.x - sx, p.y - sy, e); if (e.cancelable && h.prevent !== false) e.preventDefault(); }
    function up(e) { if (!on) return; on = false; var p = pt(e); if (h.end) h.end(p, p.x - sx, p.y - sy, e); }
    el.addEventListener('mousedown', down); addEventListener('mousemove', move); addEventListener('mouseup', up);
    el.addEventListener('touchstart', down, { passive: true }); el.addEventListener('touchmove', move, { passive: false }); el.addEventListener('touchend', up);
  };

  // Tüm [data-exit] öğeleri tıklamada çıkış yapar; [data-stop] içindekiler yapmaz
  document.addEventListener('click', function (e) {
    var s = e.target.closest('[data-stop]');
    var x = e.target.closest('[data-exit]');
    // Durdurma bölgesi çıkış alanının içindeyse (kontroller) çıkış yok; bölge içindeki açık düğme çıkar
    if (x && (!s || !(x !== s && x.contains(s)))) {
      e.preventDefault(); W.exit(x.getAttribute('data-exit') || '', x.getAttribute('data-label') || 'cta');
    }
  });

  // Görseller yüklenince başlat (önizlemede boş kare görünmesin)
  W.ready = function (fn) {
    function go() {
      var imgs = W.$$('img'); var left = imgs.length; var done = false;
      function fin() { if (!done) { done = true; root.classList.add('on'); fn(); } }
      if (!left) return fin();
      imgs.forEach(function (i) { if (i.complete) { if (--left <= 0) fin(); } else { i.addEventListener('load', function () { if (--left <= 0) fin(); }); i.addEventListener('error', function () { if (--left <= 0) fin(); }); } });
      setTimeout(fin, 2500);
    }
    if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', go); else go();
  };
})();
</script>
<script>
(function () {
  var D = W.data, Q = D.quiz, pane = W.$('#pane'), ans = [], step = 0;
  function render() {
    W.$$('.steps i').forEach(function (s, i) { s.classList.toggle('on', i <= step); });
    if (step < Q.length) {
      var q = Q[step];
      pane.innerHTML = '<div class="k">Soru ' + (step + 1) + '/' + Q.length + '</div><h2>' + q.q + '</h2><div class="opts">' + q.a.map(function (a, i) { return '<button data-i="' + i + '"><span>' + a.i + '</span>' + a.t + '</button>'; }).join('') + '</div>';
      W.$$('.opts button', pane).forEach(function (b) { b.addEventListener('click', function (e) { e.stopPropagation(); b.classList.add('sel'); pick(+b.getAttribute('data-i')); }); });
    } else {
      // Cevaplar → kategori; her adım için o kategoriden bir ürün
      var cat = D.cats.filter(function (c) { return c.key === Q[0].a[ans[0]].cat; })[0] || D.cats[0];
      var pool = (cat.products || []).concat(D.products), picks = [], seen = {};
      for (var i = 0; i < pool.length && picks.length < 3; i++) if (!seen[pool[i].key]) { seen[pool[i].key] = 1; picks.push(pool[i]); }
      var labels = Q[0].a[ans[0]].steps;
      pane.innerHTML = '<div class="k">Senin 11.11 rutinin · ' + cat.name + '</div><h2>' + Q[1].a[ans[1]].t + ' için 3 adım</h2><div class="res on">' + picks.map(function (p, i) { return '<div class="rc" data-exit="' + p.url + '" data-label="rutin_' + p.key + '"><em>' + (i + 1) + '. ' + labels[i] + '</em><img src="' + p.img + '" alt=""><b>' + p.brand + '</b></div>'; }).join('') + '<div class="rr"><p>' + D.brand.offer + '</p><span class="cta pk" data-exit="' + cat.url + '" data-label="rutin_kategori" style="height:32px;padding:0 14px">Rutini Al</span><button id="re">Baştan başla</button></div></div>';
      W.$('#re').addEventListener('click', function (e) { e.stopPropagation(); ans = []; step = 0; swap(); });
      W.track('rutin_sonuc_' + cat.key);
    }
  }
  function swap() { pane.classList.add('out'); setTimeout(function () { render(); pane.classList.remove('out'); }, 300); }
  function pick(i) { ans[step] = i; W.track('rutin_s' + (step + 1) + '_' + i); step++; setTimeout(swap, 250); }
  render();
  W.ready(function () {});
})();
</script>
