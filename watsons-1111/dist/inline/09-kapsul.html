<style>
/* Watsons 11.11 – ortak stil */
:root {
  --teal: #009aa9; --teal-d: #00737f; --teal-l: #c6eef2;
  --pink: #e708a3; --gold: #ffd23f; --ink: #0d2b33; --night: #071a24; --cream: #fff7f0;
  --f: 'Rubik', 'Helvetica Neue', Arial, sans-serif;
}
* { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
html, body { width: 100%; height: 100%; overflow: hidden; }
body { font-family: var(--f); color: #fff; background: var(--night); -webkit-font-smoothing: antialiased; user-select: none; -webkit-user-select: none; }
img { display: block; -webkit-user-drag: none; user-select: none; }
button { font: inherit; border: 0; background: none; color: inherit; cursor: pointer; }
.ad { position: relative; width: 100%; height: 100%; overflow: hidden; cursor: pointer; }
.ad * { transition-timing-function: cubic-bezier(.22, .8, .2, 1); }

/* Logo ve rozet */
.wlogo { height: 28px; width: auto; flex: none; align-self: flex-start; }
.side .wlogo, .info .wlogo, .hud .wlogo { align-self: flex-end; }
.b1111 { display: inline-flex; flex-direction: column; align-items: flex-start; line-height: .86; }
.b1111 b { font-size: 46px; font-weight: 900; letter-spacing: -.04em; background: linear-gradient(180deg, #fff 30%, #c9f1f4); -webkit-background-clip: text; background-clip: text; color: transparent; filter: drop-shadow(0 3px 0 rgba(0, 0, 0, .18)); }
.b1111 span { margin-top: 6px; font-size: 10px; font-weight: 800; letter-spacing: .2em; text-transform: uppercase; color: var(--gold); }

/* Düğmeler */
.cta { display: inline-flex; align-items: center; gap: 8px; height: 38px; padding: 0 20px; border-radius: 99px; background: #fff; color: var(--teal-d); font-size: 13px; font-weight: 800; letter-spacing: .02em; box-shadow: 0 8px 20px rgba(0, 0, 0, .22); transition: transform .25s, box-shadow .25s, background .25s; white-space: nowrap; }
.cta::after { content: '›'; font-size: 20px; line-height: 1; margin-top: -2px; }
.cta:hover { transform: translateY(-2px); box-shadow: 0 12px 26px rgba(0, 0, 0, .3); }
.cta.pk { background: var(--pink); color: #fff; }
.cta.pulse { animation: pulse 1.8s infinite; }
@keyframes pulse { 0%, 100% { box-shadow: 0 0 0 0 rgba(255, 255, 255, .55), 0 8px 20px rgba(0, 0, 0, .22); } 60% { box-shadow: 0 0 0 12px rgba(255, 255, 255, 0), 0 8px 20px rgba(0, 0, 0, .22); } }
.legal { position: absolute; font-size: 8px; line-height: 1.2; color: rgba(255, 255, 255, .62); letter-spacing: .02em; pointer-events: none; }
.hint { display: inline-flex; align-items: center; gap: 6px; font-size: 11px; font-weight: 700; color: rgba(255, 255, 255, .9); }
.hint i { width: 18px; height: 18px; border-radius: 50%; background: rgba(255, 255, 255, .22); position: relative; animation: tap 1.4s infinite; }
.hint i::after { content: ''; position: absolute; inset: 5px; border-radius: 50%; background: #fff; }
@keyframes tap { 0%, 100% { transform: scale(1); } 50% { transform: scale(.75); } }

/* Ürün çipi */
.pc { position: relative; display: flex; flex-direction: column; align-items: center; justify-content: flex-end; background: #fff; border-radius: 14px; color: var(--ink); overflow: hidden; }
.pc img { width: 100%; height: 100%; object-fit: contain; }
.pc .pn { font-size: 10px; font-weight: 700; line-height: 1.2; text-align: center; padding: 0 6px 6px; }
.pc .pb { font-size: 9px; font-weight: 900; letter-spacing: .08em; text-transform: uppercase; color: var(--teal-d); }
.pc .pp { font-size: 13px; font-weight: 900; color: var(--pink); }

/* Konfeti */
.cf { position: absolute; width: 7px; height: 11px; border-radius: 2px; pointer-events: none; z-index: 99; animation: cf 1.4s cubic-bezier(.2, .7, .3, 1) forwards; }
@keyframes cf { 0% { transform: translate(0, 0) rotate(0); opacity: 1; } 100% { transform: translate(var(--x), calc(var(--y) + 160px)) rotate(var(--r)); opacity: 0; } }

/* Kupon */
.coupon { display: inline-flex; align-items: center; gap: 10px; padding: 6px 6px 6px 14px; border: 2px dashed rgba(255, 255, 255, .7); border-radius: 12px; font-weight: 800; }
.coupon code { font-family: inherit; font-size: 16px; letter-spacing: .08em; }
.coupon button { height: 28px; padding: 0 12px; border-radius: 8px; background: #fff; color: var(--teal-d); font-size: 11px; font-weight: 800; }

/* Giriş animasyon yardımcıları */
.fx { opacity: 0; transform: translateY(14px); transition: opacity .7s, transform .7s; }
.on .fx { opacity: 1; transform: none; }
.on .fx.d1 { transition-delay: .15s; } .on .fx.d2 { transition-delay: .3s; } .on .fx.d3 { transition-delay: .45s; } .on .fx.d4 { transition-delay: .6s; }
@media (prefers-reduced-motion: reduce) { *, *::before, *::after { animation-duration: .01ms !important; transition-duration: .01ms !important; } }

.ad { background: linear-gradient(110deg, #ffe9f1 0%, #fff6f9 40%, #dff7f9 100%); color: var(--ink); }
.ad::before { content: ''; position: absolute; inset: 0; background-image: radial-gradient(rgba(231, 8, 163, .14) 2px, transparent 2.2px); background-size: 22px 22px; }
.brand { position: absolute; left: 24px; top: 22px; bottom: 20px; width: 220px; display: flex; flex-direction: column; justify-content: space-between; }
.brand .b1111 b { background: linear-gradient(180deg, var(--pink), #a3006f); -webkit-background-clip: text; background-clip: text; filter: none; }
.brand .b1111 span { color: var(--teal-d); }
.brand h1 { font-size: 17px; font-weight: 900; line-height: 1.15; margin-top: 10px; }
.brand h1 em { font-style: normal; color: var(--pink); }
.brand .wlogo { filter: none; }
.mach { position: absolute; left: 300px; top: 8px; width: 190px; height: 236px; }
.dome { position: absolute; left: 15px; top: 0; width: 160px; height: 150px; border-radius: 50% 50% 18px 18px; background: radial-gradient(circle at 30% 25%, rgba(255, 255, 255, .95), rgba(255, 255, 255, .25) 30%, rgba(200, 240, 245, .35) 70%); box-shadow: inset 0 0 0 4px rgba(255, 255, 255, .9), inset 0 -10px 30px rgba(0, 120, 135, .2), 0 10px 20px rgba(0, 80, 90, .15); overflow: hidden; }
.cap { position: absolute; width: 44px; height: 44px; border-radius: 50%; overflow: hidden; box-shadow: inset -4px -6px 8px rgba(0, 0, 0, .18), 0 2px 4px rgba(0, 0, 0, .15); transition: transform .5s cubic-bezier(.3, 1.5, .5, 1); }
.cap::before { content: ''; position: absolute; left: 0; right: 0; top: 0; height: 50%; background: var(--c); }
.cap::after { content: ''; position: absolute; left: 0; right: 0; bottom: 0; height: 50%; background: rgba(255, 255, 255, .85); }
.cap img { position: absolute; left: 7px; top: 7px; width: 30px; height: 30px; object-fit: contain; z-index: 2; opacity: .9; }
.body { position: absolute; left: 0; top: 140px; width: 190px; height: 96px; border-radius: 16px 16px 22px 22px; background: linear-gradient(160deg, var(--teal), var(--teal-d)); box-shadow: 0 14px 24px rgba(0, 80, 90, .3); }
.body .lbl { position: absolute; left: 14px; top: 12px; font-size: 13px; font-weight: 900; color: #fff; letter-spacing: .04em; }
.body .slot { position: absolute; left: 18px; bottom: 14px; width: 62px; height: 40px; border-radius: 10px; background: #054650; box-shadow: inset 0 6px 10px rgba(0, 0, 0, .4); }
.knob { position: absolute; right: 22px; top: 18px; width: 62px; height: 62px; border-radius: 50%; background: radial-gradient(circle at 35% 30%, #fff, #e8f6f8 60%, #b7dde2); box-shadow: 0 6px 12px rgba(0, 0, 0, .25); cursor: pointer; transition: transform 1s cubic-bezier(.4, 1.4, .5, 1); }
.knob::before { content: ''; position: absolute; left: 50%; top: 6px; bottom: 6px; width: 14px; margin-left: -7px; border-radius: 8px; background: var(--pink); }
.knob:hover { box-shadow: 0 0 0 4px rgba(231, 8, 163, .3), 0 6px 12px rgba(0, 0, 0, .25); }
.out { position: absolute; left: 324px; top: 196px; width: 44px; height: 44px; z-index: 4; pointer-events: none; }
.out .cap { left: 0; top: 0; }
.reveal { position: absolute; left: 520px; right: 150px; top: 20px; bottom: 20px; display: flex; align-items: center; gap: 16px; }
.card { position: relative; width: 150px; height: 200px; border-radius: 18px; background: #fff; box-shadow: 0 16px 30px rgba(0, 80, 90, .2); display: flex; flex-direction: column; align-items: center; padding: 12px; opacity: 0; transform: scale(.4) rotate(-12deg); transition: transform .6s cubic-bezier(.3, 1.5, .5, 1), opacity .3s; cursor: pointer; }
.got .card { opacity: 1; transform: none; }
.card img { width: 120px; height: 120px; object-fit: contain; }
.card b { font-size: 9px; font-weight: 900; letter-spacing: .1em; text-transform: uppercase; color: var(--teal-d); margin-top: 4px; }
.card span { font-size: 10px; font-weight: 700; text-align: center; line-height: 1.2; max-height: 24px; overflow: hidden; }
.card .pr { position: absolute; right: -10px; top: -10px; background: var(--pink); color: #fff; font-size: 12px; font-weight: 900; padding: 7px 10px; border-radius: 99px; box-shadow: 0 6px 12px rgba(231, 8, 163, .4); }
.txt { display: flex; flex-direction: column; gap: 8px; }
.txt .k { font-size: 10px; font-weight: 800; letter-spacing: .2em; text-transform: uppercase; color: var(--pink); }
.txt h2 { font-size: 22px; font-weight: 900; line-height: 1.05; }
.txt p { font-size: 11px; font-weight: 600; color: #4d6a70; }
.txt .left { font-size: 11px; font-weight: 800; color: var(--teal-d); }
.side { position: absolute; right: 22px; top: 24px; bottom: 22px; display: flex; flex-direction: column; justify-content: space-between; align-items: flex-end; }
.side .cta { background: var(--teal); color: #fff; }
.hint { color: var(--teal-d); }
.hint i { background: rgba(0, 122, 135, .25); } .hint i::after { background: var(--pink); }
.legal { left: 24px; bottom: 6px; color: #6a8187; }
</style>
</head>

    var now = Date.now();
    if (D.forceNow) now = D.forceNow;
    if (now < start) return { phase: 'once', left: start - now };
    if (now < end) return { phase: 'gun', left: end - now };
    return { phase: 'sonra', left: 0 };
  };
  W.split = function (ms) {
    var s = Math.max(0, Math.floor(ms / 1000));
    return { d: Math.floor(s / 86400), h: Math.floor(s / 3600) % 24, m: Math.floor(s / 60) % 60, s: s % 60 };
  };
  W.pad = function (n) { return (n < 10 ? '0' : '') + n; };

  // Konfeti (Watsons turkuazı, magenta, altın)
  W.confetti = function (host, n, origin) {
    host = host || document.body; n = n || 70;
    var cols = ['#009aa9', '#e708a3', '#ffd23f', '#ffffff', '#5fd3df'];
    var r = host.getBoundingClientRect();
    var ox = origin ? origin.x : r.width / 2, oy = origin ? origin.y : r.height / 2;
    for (var i = 0; i < n; i++) {
      var c = W.el('i', 'cf');
      var a = Math.random() * Math.PI * 2, v = 80 + Math.random() * 220;
      c.style.cssText = 'left:' + ox + 'px;top:' + oy + 'px;background:' + cols[i % cols.length] + ';--x:' + Math.cos(a) * v + 'px;--y:' + (Math.sin(a) * v - 60) + 'px;--r:' + (Math.random() * 720 - 360) + 'deg;animation-delay:' + Math.random() * 0.12 + 's';
      host.appendChild(c);
      (function (c) { setTimeout(function () { c.remove(); }, 1600); })(c);
    }
  };

  // Kupon kodu kopyalama (çıkışı tetiklemez)
  W.copy = function (text, btn) {
    function ok() { if (btn) { var o = btn.getAttribute('data-label') || btn.innerHTML; btn.setAttribute('data-label', o); btn.innerHTML = 'Kopyalandı!'; setTimeout(function () { btn.innerHTML = o; }, 1600); } W.track('kupon_kopya'); }
    if (navigator.clipboard && navigator.clipboard.writeText) navigator.clipboard.writeText(text).then(ok, ok);
    else { var t = W.el('textarea'); t.value = text; document.body.appendChild(t); t.select(); try { document.execCommand('copy'); } catch (e) { /* yok */ } t.remove(); ok(); }
  };

  // Ortak parçalar: logo, 11.11 rozeti, yasal not, CTA
  W.logo = function (cls) { return '<img class="wlogo ' + (cls || '') + '" src="' + D.brand.logo + '" alt="Watsons">'; };
  W.badge = function (cls) { return '<div class="b1111 ' + (cls || '') + '"><b>11.11</b><span>' + D.brand.event + '</span></div>'; };

  // Sürükle / kaydır: fare ve dokunmatik için tek arayüz
  W.drag = function (el, h) {
    var on = false, sx = 0, sy = 0;
    function pt(e) { var t = e.touches ? e.touches[0] || e.changedTouches[0] : e; return { x: t.clientX, y: t.clientY }; }
    function down(e) { on = true; var p = pt(e); sx = p.x; sy = p.y; if (h.start) h.start(p, e); }
    function move(e) { if (!on) return; var p = pt(e); if (h.move) h.move(p, p.x - sx, p.y - sy, e); if (e.cancelable && h.prevent !== false) e.preventDefault(); }
    function up(e) { if (!on) return; on = false; var p = pt(e); if (h.end) h.end(p, p.x - sx, p.y - sy, e); }
    el.addEventListener('mousedown', down); addEventListener('mousemove', move); addEventListener('mouseup', up);
    el.addEventListener('touchstart', down, { passive: true }); el.addEventListener('touchmove', move, { passive: false }); el.addEventListener('touchend', up);
  };

  // Tüm [data-exit] öğeleri tıklamada çıkış yapar; [data-stop] içindekiler yapmaz
  document.addEventListener('click', function (e) {
    var s = e.target.closest('[data-stop]');
    var x = e.target.closest('[data-exit]');
    // Durdurma bölgesi çıkış alanının içindeyse (kontroller) çıkış yok; bölge içindeki açık düğme çıkar
    if (x && (!s || !(x !== s && x.contains(s)))) {
      e.preventDefault(); W.exit(x.getAttribute('data-exit') || '', x.getAttribute('data-label') || 'cta');
    }
  });

  // Görseller yüklenince başlat (önizlemede boş kare görünmesin)
  W.ready = function (fn) {
    function go() {
      var imgs = W.$$('img'); var left = imgs.length; var done = false;
      function fin() { if (!done) { done = true; root.classList.add('on'); fn(); } }
      if (!left) return fin();
      imgs.forEach(function (i) { if (i.complete) { if (--left <= 0) fin(); } else { i.addEventListener('load', function () { if (--left <= 0) fin(); }); i.addEventListener('error', function () { if (--left <= 0) fin(); }); } });
      setTimeout(fin, 2500);
    }
    if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', go); else go();
  };
})();
</script>
<script>
(function () {
  var D = W.data, dome = W.$('#dome'), items = W.shuffle(D.products.slice(0, 12)), cols = ['#e708a3', '#009aa9', '#ffd23f', '#7a3cff', '#ff8a3d'];
  var caps = items.map(function (p, i) {
    var c = W.el('div', 'cap', '<img src="' + p.img + '" alt="">'); c.style.setProperty('--c', cols[i % cols.length]);
    var row = Math.floor(i / 4), x = 8 + (i % 4) * 34 + (row % 2) * 14, y = 96 - row * 34;
    c._x = x; c._y = y; c.style.transform = 'translate(' + x + 'px,' + y + 'px) rotate(' + (i * 47) + 'deg)';
    dome.appendChild(c); return c;
  });
  var turns = 0, busy = false, rot = 0;
  function shake() { caps.forEach(function (c, i) { if (!c.parentNode) return; c.style.transform = 'translate(' + (c._x + Math.random() * 16 - 8) + 'px,' + (c._y - Math.random() * 30) + 'px) rotate(' + Math.random() * 360 + 'deg)'; }); setTimeout(function () { caps.forEach(function (c) { c.style.transform = 'translate(' + c._x + 'px,' + c._y + 'px) rotate(' + Math.random() * 360 + 'deg)'; }); }, 420); }
  function turn() {
    if (busy || turns >= items.length) return; busy = true;
    rot += 360; W.$('#knob').style.transform = 'rotate(' + rot + 'deg)';
    W.$('#ad').classList.remove('got'); W.$('#hint').style.display = 'none';
    shake(); setTimeout(shake, 450);
    var p = items[turns], c = caps[turns], col = cols[turns % cols.length]; turns++;
    setTimeout(function () {
      c.remove();
      var o = W.$('#out'); o.innerHTML = ''; var cc = W.el('div', 'cap', '<img src="' + p.img + '" alt="">'); cc.style.setProperty('--c', col); o.appendChild(cc);
      cc.animate([{ transform: 'translate(0,-30px) scale(.6)' }, { transform: 'translate(0,0) scale(1)', offset: .4 }, { transform: 'translate(120px,-120px) scale(1.6) rotate(400deg)', opacity: 1 }, { transform: 'translate(210px,-110px) scale(2.2) rotate(540deg)', opacity: 0 }], { duration: 1100, easing: 'cubic-bezier(.4,0,.3,1)', fill: 'forwards' });
      setTimeout(function () { show(p); busy = false; }, 900);
    }, 1000);
    W.track('kapsul_' + turns);
  }
  function show(p) {
    var card = W.$('#card');
    card.innerHTML = '<img src="' + p.img + '" alt=""><b>' + p.brand + '</b><span>' + p.name + '</span>' + (p.price ? '<div class="pr">' + W.price(p.price) + '</div>' : '');
    card.onclick = function (e) { e.stopPropagation(); W.exit(p.url, 'urun_' + p.key); };
    W.$('#k').textContent = 'Kapsülden çıkan'; W.$('#h').innerHTML = p.brand; W.$('#p').textContent = (p.club ? 'Watsons Club ile ' + W.price(p.club) + '. ' : '') + D.brand.offer;
    W.$('#lf').textContent = (items.length - turns) + ' kapsül daha · Tekrar çevir';
    W.$('#ad').classList.add('got');
    var r = card.getBoundingClientRect(); W.confetti(W.$('#ad'), 50, { x: r.left + 75, y: r.top + 40 });
  }
  W.$('#knob').addEventListener('click', function (e) { e.stopPropagation(); turn(); });
  W.ready(function () { setTimeout(function () { if (!turns) turn(); }, 2600); });
})();
</script>
</body>
