<!DOCTYPE html>
<html lang="tr">
<head>
{{HEAD}}
<style>
{{SHARED_CSS}}
.ad { background: linear-gradient(100deg, #e9fbfc 0%, #ffffff 45%, #ffeef4 100%); color: var(--ink); }
.ad::before { content: ''; position: absolute; left: 0; top: 0; bottom: 0; width: 250px; background: linear-gradient(160deg, var(--teal), var(--teal-d)); clip-path: polygon(0 0, 100% 0, 86% 100%, 0 100%); }
.brand { position: absolute; left: 24px; top: 22px; bottom: 20px; width: 190px; display: flex; flex-direction: column; justify-content: space-between; color: #fff; }
.brand h1 { font-size: 17px; font-weight: 900; line-height: 1.12; margin-top: 10px; }
.brand h1 em { font-style: normal; color: var(--gold); }
.shelf { position: absolute; left: 262px; top: 16px; width: 450px; height: 218px; display: grid; grid-template-columns: repeat(5, 1fr); grid-template-rows: 1fr 1fr; gap: 6px 8px; }
.shelf::before, .shelf::after { content: ''; position: absolute; left: -6px; right: -6px; height: 7px; border-radius: 4px; background: linear-gradient(#d7e9ec, #b7d3d8); box-shadow: 0 4px 6px rgba(0, 60, 70, .15); z-index: -1; }
.shelf::before { top: 108px; } .shelf::after { bottom: -2px; }
.prod { position: relative; display: flex; flex-direction: column; align-items: center; justify-content: flex-end; padding-bottom: 6px; cursor: grab; touch-action: none; transition: transform .25s, opacity .3s; }
.prod:hover { transform: translateY(-4px); }
.prod img { width: 70px; height: 74px; object-fit: contain; filter: drop-shadow(0 6px 6px rgba(0, 0, 0, .15)); pointer-events: none; }
.prod span { font-size: 9px; font-weight: 900; color: var(--pink); margin-top: 2px; }
.prod.in { opacity: .2; pointer-events: none; }
.ghost { position: fixed; z-index: 50; width: 76px; height: 80px; pointer-events: none; transform: translate(-50%, -50%) rotate(-6deg) scale(1.1); filter: drop-shadow(0 12px 12px rgba(0, 0, 0, .25)); }
.ghost img { width: 100%; height: 100%; object-fit: contain; }
.cart { position: absolute; right: 22px; top: 16px; bottom: 16px; width: 228px; border-radius: 18px; background: #fff; box-shadow: 0 12px 30px rgba(0, 80, 90, .14), inset 0 0 0 2px #e3f3f5; padding: 12px 14px; display: flex; flex-direction: column; transition: box-shadow .2s, transform .2s; }
.cart.hot { box-shadow: 0 0 0 3px var(--teal), 0 14px 30px rgba(0, 80, 90, .2); transform: scale(1.02); }
.cart .top { display: flex; align-items: center; justify-content: space-between; }
.cart .top b { font-size: 12px; font-weight: 900; letter-spacing: .06em; text-transform: uppercase; }
.cart .top img { height: 18px; }
.basket { position: relative; flex: 1; margin: 8px 0; border-radius: 12px; background: repeating-linear-gradient(90deg, #f1fafb 0 14px, #e6f5f7 14px 16px); display: flex; flex-wrap: wrap; align-content: flex-end; gap: 2px; padding: 6px; overflow: hidden; }
.basket img { width: 36px; height: 40px; object-fit: contain; animation: drop .45s cubic-bezier(.3, 1.6, .5, 1); }
@keyframes drop { from { transform: translateY(-50px) scale(1.3); opacity: 0; } }
.basket .em { position: absolute; inset: 0; display: flex; align-items: center; justify-content: center; font-size: 11px; font-weight: 700; color: #7b979c; text-align: center; padding: 10px; }
.bar { height: 8px; border-radius: 99px; background: #e3f3f5; overflow: hidden; }
.bar i { display: block; height: 100%; width: 0; border-radius: 99px; background: linear-gradient(90deg, var(--teal), var(--pink)); transition: width .5s; }
.lvl { display: flex; justify-content: space-between; margin-top: 5px; font-size: 9px; font-weight: 800; color: #6e8a90; }
.lvl b { color: var(--pink); }
.cart .cta { margin-top: 8px; justify-content: center; background: var(--pink); color: #fff; height: 34px; }
.cart.full .cta { animation: pulse 1.6s infinite; }
.hint { position: absolute; left: 262px; bottom: 4px; color: var(--teal-d); font-size: 10px; }
.hint i { background: rgba(0, 122, 135, .25); }
.hint i::after { background: var(--teal-d); }
.legal { left: 24px; bottom: 6px; }
</style>
</head>
<body>
<div class="ad">
  <div class="brand fx">
    <div>{{BADGE}}<h1>Sepetini doldur, <em>11.11'de</em> kazancını gör</h1></div>
    {{LOGO}}
  </div>
  <div class="shelf fx d1" id="shelf" data-stop></div>
  <div class="hint" id="hint"><i></i> Ürünleri sepete sürükle ya da dokun</div>
  <div class="cart fx d2" id="cart" data-stop>
    <div class="top"><b>11.11 Sepetim</b><span id="cnum" style="font-size:11px;font-weight:800;color:var(--teal-d)">0 ürün</span></div>
    <div class="basket" id="basket"><div class="em" id="em">Rafın ürünlerini buraya bırak</div></div>
    <div class="bar"><i id="bar"></i></div>
    <div class="lvl"><span id="lv">3 ürüne kadar ilerle</span><b id="lvb"></b></div>
    <span class="cta" id="go" data-exit="" data-label="sepet">Sepeti Tamamla</span>
  </div>
  <div class="legal" style="color:rgba(255,255,255,.7)">{{LEGAL}}</div>
</div>
<script>window.AD_DATA = {{DATA}};</script>
<script>{{SHARED_JS}}</script>
<script>
(function () {
  var D = W.data, shelf = W.$('#shelf'), cart = W.$('#cart'), basket = W.$('#basket'), items = D.products.slice(0, 10), inCart = [];
  // Hedefler: 1, 3 ve 5 ürünle açılan 11.11 seviyeleri (metinler data.js → tiers)
  var tiers = D.tiers;
  items.forEach(function (p, i) {
    var e = W.el('div', 'prod', '<img src="' + p.img + '" alt="">' + (p.price ? '<span>' + W.price(p.price) + '</span>' : ''));
    var ghost = null, moved = false;
    W.drag(e, {
      start: function (pt) { moved = false; },
      move: function (pt, dx, dy) {
        if (!moved && Math.abs(dx) + Math.abs(dy) > 6) { moved = true; ghost = W.el('div', 'ghost', '<img src="' + p.img + '" alt="">'); document.body.appendChild(ghost); W.$('#hint').style.opacity = 0; }
        if (ghost) { ghost.style.left = pt.x + 'px'; ghost.style.top = pt.y + 'px'; cart.classList.toggle('hot', over(pt)); }
      },
      end: function (pt) {
        if (ghost) { ghost.remove(); ghost = null; cart.classList.remove('hot'); if (over(pt)) add(i, e); }
      }
    });
    e.addEventListener('click', function (ev) { ev.stopPropagation(); if (!moved) add(i, e); });
    shelf.appendChild(e);
  });
  function over(pt) { var r = cart.getBoundingClientRect(); return pt.x > r.left && pt.x < r.right && pt.y > r.top && pt.y < r.bottom; }
  function add(i, e) {
    if (inCart.indexOf(i) >= 0) return;
    inCart.push(i); e.classList.add('in');
    W.$('#em').style.display = 'none';
    var img = W.el('img'); img.src = items[i].img; basket.appendChild(img);
    var n = inCart.length; W.$('#cnum').textContent = n + ' ürün';
    var t = tiers.filter(function (x) { return n >= x.n; }).pop(), nx = tiers.filter(function (x) { return n < x.n; })[0];
    W.$('#bar').style.width = Math.min(100, n / tiers[tiers.length - 1].n * 100) + '%';
    W.$('#lvb').textContent = t ? t.label : '';
    W.$('#lv').textContent = nx ? (nx.n - n) + ' ürün daha: ' + nx.label : 'Tüm 11.11 avantajları açıldı!';
    if (t && t.n === n) { var r = cart.getBoundingClientRect(); W.confetti(document.body, 40, { x: r.left + r.width / 2, y: r.top + 40 }); }
    if (!nx) cart.classList.add('full');
    W.$('#go').setAttribute('data-exit', D.brand.home);
    W.track('sepet_' + n);
  }
  W.ready(function () {
    // Tanıtım: bir ürün raftan sepete kendiliğinden uçar
    setTimeout(function () {
      if (inCart.length) return;
      var e = W.$$('.prod')[2], a = e.getBoundingClientRect(), b = cart.getBoundingClientRect();
      var g = W.el('div', 'ghost', '<img src="' + items[2].img + '" alt="">'); g.style.left = a.left + a.width / 2 + 'px'; g.style.top = a.top + 40 + 'px'; g.style.transition = 'left .9s cubic-bezier(.5,0,.3,1), top .9s cubic-bezier(.3,-.6,.5,1)';
      document.body.appendChild(g);
      requestAnimationFrame(function () { g.style.left = b.left + b.width / 2 + 'px'; g.style.top = b.top + b.height / 2 + 'px'; });
      setTimeout(function () { g.remove(); add(2, e); }, 950);
    }, 1800);
  });
})();
</script>
</body>
</html>
