<!DOCTYPE html>
<html lang="tr">
<head>
{{HEAD}}
<style>
{{SHARED_CSS}}
.ad { background: radial-gradient(60% 120% at 45% 60%, #16c7d6, var(--teal) 35%, #04535e 100%); }
.snow { position: absolute; inset: 0; pointer-events: none; }
.snow i { position: absolute; top: -10px; width: 6px; height: 6px; border-radius: 50%; background: rgba(255, 255, 255, .7); animation: fall linear infinite; }
@keyframes fall { to { transform: translate(30px, 280px); } }
.brand { position: absolute; left: 26px; top: 24px; bottom: 22px; width: 220px; display: flex; flex-direction: column; justify-content: space-between; z-index: 3; }
.brand h1 { font-size: 18px; font-weight: 900; line-height: 1.12; margin-top: 10px; }
.brand h1 em { font-style: normal; color: var(--gold); }
.scene { position: absolute; left: 380px; top: 128px; width: 0; height: 0; perspective: 800px; z-index: 2; }
.box { position: absolute; left: -60px; top: -40px; width: 120px; height: 120px; transform-style: preserve-3d; transform: rotateX(-22deg) rotateY(-32deg); transition: transform 1s; cursor: pointer; }
.box:hover { transform: rotateX(-22deg) rotateY(-20deg); }
.sh { position: absolute; left: -95px; top: 72px; width: 190px; height: 40px; border-radius: 50%; background: radial-gradient(rgba(0, 0, 0, .5), transparent 70%); }
.f { position: absolute; width: 120px; height: 120px; background: linear-gradient(90deg, transparent 44%, var(--gold) 44% 56%, transparent 56%), linear-gradient(150deg, #f23cb8, var(--pink) 50%, #a3006f); box-shadow: inset 0 0 30px rgba(0, 0, 0, .15); }
.f.fr { transform: translateZ(60px); }
.f.bk { transform: rotateY(180deg) translateZ(60px); }
.f.rt { transform: rotateY(90deg) translateZ(60px); filter: brightness(.85); }
.f.lt { transform: rotateY(-90deg) translateZ(60px); filter: brightness(.85); }
.f.bt { transform: rotateX(-90deg) translateZ(60px); background: #7a0057; }
.f.in { transform: rotateX(90deg) translateZ(-50px); background: #5c0042; }
.lid { position: absolute; left: -6px; top: -12px; width: 132px; height: 24px; transform-style: preserve-3d; transform-origin: 50% 0 -66px; transition: transform 1.1s cubic-bezier(.3, 1.4, .5, 1); }
.lid .l { position: absolute; background: linear-gradient(90deg, transparent 44%, var(--gold) 44% 56%, transparent 56%), linear-gradient(150deg, #f56cc9, #e708a3); }
.lid .tp { width: 132px; height: 132px; top: -66px; transform: rotateX(90deg); background: linear-gradient(90deg, transparent 44%, var(--gold) 44% 56%, transparent 56%), linear-gradient(0deg, transparent 44%, var(--gold) 44% 56%, transparent 56%), linear-gradient(150deg, #f78bd4, #e708a3); }
.lid .s1 { width: 132px; height: 24px; transform: translateZ(66px); }
.lid .s2 { width: 132px; height: 24px; transform: rotateY(180deg) translateZ(66px); }
.lid .s3 { width: 132px; height: 24px; transform: rotateY(90deg) translateZ(66px); filter: brightness(.85); }
.lid .s4 { width: 132px; height: 24px; transform: rotateY(-90deg) translateZ(66px); filter: brightness(.85); }
.bow { position: absolute; left: 36px; top: -38px; width: 60px; height: 40px; }
.bow::before, .bow::after { content: ''; position: absolute; top: 4px; width: 30px; height: 30px; border: 7px solid var(--gold); border-radius: 50% 50% 0 50%; }
.bow::before { left: 0; transform: rotate(-20deg); } .bow::after { right: 0; transform: scaleX(-1) rotate(-20deg); }
.open .lid { transform: translateY(-150px) translateZ(-40px) rotateX(-120deg) rotateZ(25deg); }
.open .box { transform: rotateX(-22deg) rotateY(-32deg); }
.pop { position: absolute; left: -36px; top: -40px; width: 72px; height: 72px; border-radius: 14px; background: #fff; padding: 5px; box-shadow: 0 10px 20px rgba(0, 0, 0, .3); opacity: 0; transform: translate(0, 40px) scale(.3); transition: transform .9s cubic-bezier(.2, 1.4, .4, 1), opacity .3s; z-index: 4; cursor: pointer; }
.pop img { width: 100%; height: 100%; object-fit: contain; }
.open .pop { opacity: 1; }
.tap { position: absolute; left: 330px; top: 214px; z-index: 3; }
.open .tap { opacity: 0; }
.res { position: absolute; left: 600px; right: 150px; top: 24px; bottom: 22px; display: flex; flex-direction: column; justify-content: center; gap: 10px; opacity: 0; transform: translateX(20px); transition: opacity .6s .9s, transform .6s .9s; }
.open .res { opacity: 1; transform: none; }
.res .k { font-size: 10px; font-weight: 800; letter-spacing: .2em; text-transform: uppercase; color: var(--gold); }
.res h2 { font-size: 22px; font-weight: 900; line-height: 1.05; }
.res p { font-size: 11px; font-weight: 600; color: rgba(255, 255, 255, .85); }
.pre { position: absolute; left: 560px; right: 150px; top: 24px; bottom: 22px; display: flex; flex-direction: column; justify-content: center; gap: 6px; transition: opacity .4s; }
.open .pre { opacity: 0; }
.pre h2 { font-size: 26px; font-weight: 900; line-height: 1.02; }
.pre p { font-size: 12px; color: rgba(255, 255, 255, .85); font-weight: 600; }
.side { position: absolute; right: 22px; top: 24px; bottom: 22px; display: flex; flex-direction: column; justify-content: space-between; align-items: flex-end; }
.legal { left: 26px; bottom: 8px; }
</style>
</head>
<body>
<div class="ad" id="ad" data-exit="" data-label="genel">
  <div class="snow" id="snow"></div>
  <div class="brand fx">
    <div>{{BADGE}}<h1>Bu 11.11'de <em>hediyen</em> bizden</h1></div>
    <span class="cta">Tüm Fırsatlar</span>
  </div>
  <div class="scene fx d1" data-stop>
    <div class="sh"></div>
    <div class="box" id="box">
      <div class="f bt"></div><div class="f bk"></div><div class="f lt"></div><div class="f in"></div><div class="f rt"></div><div class="f fr"></div>
      <div class="lid"><div class="l tp"></div><div class="l s1"></div><div class="l s2"></div><div class="l s3"></div><div class="l s4"></div><div class="bow"></div></div>
    </div>
    <div id="pops"></div>
  </div>
  <div class="tap hint" id="tap"><i></i> Kutuyu aç</div>
  <div class="pre fx d2"><h2>Kutunun içinde<br>ne var?</h2><p>Dokun, 11.11'e özel seçkiyi aç.</p></div>
  <div class="res" data-stop>
    <div class="k">11.11 Hediye Kutun</div>
    <h2>Senin için seçtik</h2>
    <p>{{OFFER}}</p>
    <div class="coupon" style="align-self:flex-start"><code>{{CODE}}</code><button id="cp">Kopyala</button></div>
  </div>
  <div class="side fx d3">{{LOGO}}<span class="cta pulse">Alışverişe Başla</span></div>
  <div class="legal">{{LEGAL}}</div>
</div>
<script>window.AD_DATA = {{DATA}};</script>
<script>{{SHARED_JS}}</script>
<script>
(function () {
  var D = W.data, ad = W.$('#ad'), pops = W.$('#pops'), items = D.products.slice(0, 5);
  for (var i = 0; i < 26; i++) { var s = W.el('i'); s.style.left = Math.random() * 100 + '%'; s.style.animationDuration = 5 + Math.random() * 6 + 's'; s.style.animationDelay = -Math.random() * 8 + 's'; s.style.transform = 'scale(' + (.4 + Math.random()) + ')'; W.$('#snow').appendChild(s); }
  // Kutudan fırlayan ürünler yay boyunca dizilir
  var spots = [[-150, -30], [-80, -86], [10, -100], [96, -80], [160, -24]];
  items.forEach(function (p, i) {
    var e = W.el('div', 'pop', '<img src="' + p.img + '" alt="">');
    e._to = 'translate(' + spots[i][0] + 'px,' + spots[i][1] + 'px) rotate(' + (i * 8 - 16) + 'deg)';
    e.style.transitionDelay = (.25 + i * .09) + 's';
    e.addEventListener('click', function (ev) { ev.stopPropagation(); W.exit(p.url, 'urun_' + p.key); });
    pops.appendChild(e);
  });
  var isOpen = false;
  function open() {
    if (isOpen) return; isOpen = true; ad.classList.add('open');
    W.$$('.pop').forEach(function (e) { e.style.transform = e._to; });
    var r = W.$('.scene').getBoundingClientRect();
    setTimeout(function () { W.confetti(ad, 100, { x: r.left, y: r.top - 30 }); }, 350);
    W.track('kutu_ac');
  }
  W.$('#box').addEventListener('click', function (e) { e.stopPropagation(); open(); });
  W.$('#cp').addEventListener('click', function (e) { e.stopPropagation(); W.copy(D.brand.code, this); });
  W.ready(function () {
    // Kutu hafifçe sallanır; 6 sn'de açılmazsa kendiliğinden açılır
    var b = W.$('#box'), k = 0;
    var wob = setInterval(function () { if (isOpen) return clearInterval(wob); k++; b.style.transform = 'rotateX(-22deg) rotateY(' + (-32 + (k % 2 ? 8 : -8)) + 'deg) rotateZ(' + (k % 2 ? 3 : -3) + 'deg)'; setTimeout(function () { if (!isOpen) b.style.transform = ''; }, 300); }, 1600);
    setTimeout(open, 6000);
  });
})();
</script>
</body>
</html>
