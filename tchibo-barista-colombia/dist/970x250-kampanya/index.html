<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="ad.size" content="width=970,height=250">
<meta name="viewport" content="width=970,initial-scale=1">
<title>Tchibo Barista Colombia – Kampanya Masthead 970x250</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@600;700;800;900&family=Lobster&display=swap" rel="stylesheet">
<style>
:root{--blue:#3942a1;--blue2:#2c3488;--cream:#ecd69d;--badge:#eedc94;--orange:#cc6343;--red:#f14827;--yellow:#fec015;--ink:#1f2566}
html,body{margin:0;padding:0;background:#2c3488}
#ad{position:relative;width:970px;height:250px;overflow:hidden;background:var(--blue);font-family:Montserrat,"Segoe UI",Arial,sans-serif;cursor:pointer;user-select:none;-webkit-user-select:none;-webkit-tap-highlight-color:transparent;outline:none;touch-action:none}
#ad:focus-visible{box-shadow:inset 0 0 0 3px var(--yellow)}
.layer{position:absolute;inset:0;will-change:transform}
.scene{position:absolute;inset:0;opacity:0;visibility:hidden;transition:opacity .01s}
.scene.on{opacity:1;visibility:visible}
img{display:block;pointer-events:none}
/* ---- KV sahnesi */
.bg{position:absolute;left:-10px;top:-6px;width:990px;height:262px}
.band{position:absolute;left:0;right:0;bottom:0;height:12px;background:var(--orange)}
.blobA{position:absolute;left:600px;top:70px;width:520px;transform:scale(0);transform-origin:40% 40%}
.blobC{position:absolute;left:430px;top:178px;width:200px;transform:scale(0);transform-origin:50% 60%}
.tris{position:absolute;right:-6px;top:-30px;width:300px;transform:translateX(120%)}
.kv.on .blobA{animation:pop .9s cubic-bezier(.2,1.2,.3,1) .05s both}
.kv.on .blobC{animation:pop .8s cubic-bezier(.2,1.2,.3,1) .25s both}
.kv.on .tris{animation:slideL .8s cubic-bezier(.2,.9,.2,1) .15s both}
.pack{position:absolute;bottom:14px;transform-origin:50% 100%;filter:drop-shadow(0 10px 16px rgba(20,20,60,.35));transition:transform .35s cubic-bezier(.2,.8,.2,1),filter .35s;pointer-events:auto}
.pack img{height:100%;width:auto}
.hero{left:468px;height:214px;transform:translateY(120%) rotate(6deg);z-index:3}
.fam{height:140px;bottom:26px;transform:translateX(160px) rotate(-6deg);opacity:0}
.fam.f1{left:640px;z-index:2}.fam.f2{left:704px;z-index:2}.fam.f3{left:768px;z-index:2}
.kv.on .hero{animation:heroIn 1s cubic-bezier(.2,1.1,.3,1) .5s both}
.kv.on .fam.f1{animation:famIn .7s cubic-bezier(.2,1.1,.3,1) 1.3s both}
.kv.on .fam.f2{animation:famIn .7s cubic-bezier(.2,1.1,.3,1) 1.45s both}
.kv.on .fam.f3{animation:famIn .7s cubic-bezier(.2,1.1,.3,1) 1.6s both}
.pack:hover{transform:translateY(-8px) scale(1.05)!important;filter:drop-shadow(0 18px 22px rgba(20,20,60,.45));animation-play-state:paused}
.kv.settled .pack,.kv.settled .blobA,.kv.settled .blobC,.kv.settled .tris,.kv.settled .badge,.kv.settled .lockup,.kv.settled .sub{animation:none!important;transform:none;opacity:1}
.kv.settled .h span>span{animation:none!important;transform:none}
.lbl{position:absolute;left:50%;bottom:-2px;transform:translate(-50%,120%);white-space:nowrap;background:var(--badge);color:var(--ink);font:800 9.5px/1 Montserrat,Arial,sans-serif;letter-spacing:.04em;padding:6px 9px;border-radius:999px;opacity:0;transition:opacity .25s,transform .25s;pointer-events:none}
.pack:hover .lbl{opacity:1;transform:translate(-50%,100%)}
.badge{position:absolute;left:592px;top:8px;width:82px;height:82px;transform:scale(0) rotate(-20deg);transform-origin:50% 60%;z-index:4}
.badge img{width:100%;height:100%}
.badge b{position:absolute;left:0;top:0;width:100%;height:78%;display:flex;align-items:center;justify-content:center;font:900 17px/1 Montserrat,Arial,sans-serif;color:var(--ink);letter-spacing:.02em;transform:rotate(-8deg)}
.kv.on .badge{animation:badgeIn .8s cubic-bezier(.2,1.4,.3,1) 1.1s both}
.copy{position:absolute;left:40px;top:22px;width:420px;z-index:5}
.lockup{display:flex;align-items:center;gap:10px;height:30px;opacity:0;transform:translateY(10px)}
.lockup img{height:28px;width:auto}
.lockup i{width:1.5px;height:22px;background:var(--cream);opacity:.8}
.lockup b{font:700 15px/1 Montserrat,Arial,sans-serif;letter-spacing:.14em;color:var(--cream)}
.kv.on .lockup{animation:up .7s cubic-bezier(.2,.8,.2,1) .35s both}
.h{margin:18px 0 0;color:var(--cream);font-weight:800;font-size:22px;line-height:1.12;letter-spacing:.02em}
.h span{display:block;overflow:hidden;padding-bottom:2px}
.h span>span{display:block;transform:translateY(112%)}
.h span:nth-child(2)>span{font-weight:600;font-size:19px}
.kv.on .h span:nth-child(1)>span{animation:rise .8s cubic-bezier(.2,.9,.2,1) 1.5s both}
.kv.on .h span:nth-child(2)>span{animation:rise .8s cubic-bezier(.2,.9,.2,1) 1.7s both}
.sub{margin:8px 0 0;display:flex;align-items:baseline;gap:12px;opacity:0;transform:translateY(10px)}
.sub em{font:400 24px/1 Lobster,"Brush Script MT",cursive;color:var(--yellow);font-style:normal}
.sub small{font:700 9.5px/1 Montserrat,Arial,sans-serif;letter-spacing:.2em;color:var(--cream)}
.kv.on .sub{animation:up .7s cubic-bezier(.2,.8,.2,1) 2.2s both}
.cta{position:absolute;left:40px;bottom:30px;z-index:6;border:0;border-radius:999px;padding:0 20px;height:34px;font:800 13px/34px Montserrat,Arial,sans-serif;letter-spacing:.03em;color:var(--ink);background:var(--yellow);box-shadow:0 8px 18px rgba(20,20,60,.35);cursor:pointer;opacity:0;transform:translateY(14px);transition:background .2s,transform .25s;pointer-events:auto}
.cta.on{animation:up .7s cubic-bezier(.2,.8,.2,1) both}
.cta:hover{background:#ffd043;transform:translateY(-2px) scale(1.04)!important}
/* ---- fotoğraf sahnesi */
.photo{position:absolute;left:40px;top:-292px;width:930px;transform-origin:60% 85%}
.ph.on .photo{animation:kenburns 5.2s linear both}
.shade{position:absolute;inset:0;background:linear-gradient(90deg,rgba(35,42,140,.92) 0%,rgba(35,42,140,.78) 34%,rgba(35,42,140,0) 62%)}
.copy2{position:absolute;left:40px;top:56px;width:420px;z-index:5}
.copy2 .k{color:var(--cream);font-weight:800;font-size:22px;line-height:1.12;letter-spacing:.02em}
.copy2 .k span{display:block;overflow:hidden;padding-bottom:2px}
.copy2 .k span>span{display:block;transform:translateY(112%)}
.ph.on .k span:nth-child(1)>span{animation:rise .8s cubic-bezier(.2,.9,.2,1) .35s both}
.ph.on .k span:nth-child(2)>span{animation:rise .8s cubic-bezier(.2,.9,.2,1) .55s both}
.copy2 p{margin:10px 0 0;font:600 12px/1.45 Montserrat,Arial,sans-serif;color:rgba(236,214,157,.9);opacity:0;transform:translateY(10px)}
.ph.on .copy2 p{animation:up .7s cubic-bezier(.2,.8,.2,1) 1s both}
/* ---- geçiş lekesi, noktalar, efekt tuvali */
.wipe{position:absolute;left:485px;top:125px;width:1400px;height:1000px;margin:-500px 0 0 -700px;transform:scale(0);transform-origin:50% 50%;z-index:20;pointer-events:none}
.wipe img{width:100%;height:100%}
#fx{position:absolute;left:0;top:0;width:970px;height:250px;z-index:15;pointer-events:none}
.dots{position:absolute;right:20px;top:20px;display:flex;gap:6px;z-index:30;pointer-events:auto;opacity:0;transition:opacity .8s}
#ad.go .dots{opacity:1}
.dots b{display:block;width:7px;height:7px;border-radius:4px;background:rgba(236,214,157,.45);cursor:pointer;transition:width .35s,background .35s}
.dots b.on{width:20px;background:var(--yellow)}
@keyframes pop{from{transform:scale(0)}to{transform:scale(1)}}
@keyframes slideL{from{transform:translateX(120%)}to{transform:none}}
@keyframes heroIn{0%{transform:translateY(120%) rotate(6deg)}70%{transform:translateY(-4%) rotate(-1.5deg)}100%{transform:none}}
@keyframes famIn{0%{transform:translateX(160px) rotate(-6deg);opacity:0}100%{transform:none;opacity:1}}
@keyframes badgeIn{0%{transform:scale(0) rotate(-30deg)}100%{transform:scale(1) rotate(0)}}
@keyframes up{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:none}}
@keyframes rise{from{transform:translateY(112%)}to{transform:none}}
@keyframes kenburns{from{transform:scale(1)}to{transform:scale(1.06)}}
@media (prefers-reduced-motion:reduce){*{animation-duration:.01s!important;animation-delay:0s!important;transition-duration:.01s!important}}
</style>
</head>

  g.clearRect(0,0,W,H);
