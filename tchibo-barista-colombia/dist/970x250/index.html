<style>
:root{--gold:#e8bb6b;--gold2:#c98f3d;--cream:#f8eedf;--ink:#2a1608}
html,body{margin:0;padding:0;background:#0d0705}
#ad{position:relative;width:970px;height:250px;overflow:hidden;background:#140c08;font-family:Manrope,"Segoe UI",Arial,sans-serif;cursor:pointer;user-select:none;-webkit-user-select:none;-webkit-tap-highlight-color:transparent;outline:none;touch-action:none}
#ad:focus-visible{box-shadow:inset 0 0 0 2px var(--gold)}
#c{position:absolute;left:0;top:0;width:970px;height:250px;display:block}
.ui{position:absolute;inset:0;pointer-events:none}
.brand{position:absolute;left:44px;top:24px;font-weight:800;font-size:14px;letter-spacing:.34em;color:var(--cream);opacity:.95;display:flex;align-items:baseline;gap:10px}
.brand small{font-size:8.5px;letter-spacing:.32em;color:var(--gold);opacity:.95}
.copy{position:absolute;left:44px;top:70px;width:410px}
.over{font-size:10px;font-weight:700;letter-spacing:.22em;color:var(--gold)}
.h{margin:7px 0 0;font-family:"Playfair Display",Georgia,serif;font-weight:700;font-size:28px;line-height:1.1;color:var(--cream);text-shadow:0 2px 16px rgba(0,0,0,.6)}
.h .l{display:block;overflow:hidden;padding-bottom:3px}
.h .l>span{display:block}
.h em{font-style:italic;font-weight:600;color:var(--gold)}
.sub{margin:8px 0 0;font-size:11.5px;line-height:1.4;font-weight:500;letter-spacing:.01em;color:rgba(248,238,223,.72);white-space:nowrap}
.sub i{font-style:normal;color:var(--gold);opacity:.9;padding:0 5px}
.row{position:absolute;left:44px;bottom:26px;display:flex;align-items:center;gap:16px;pointer-events:none}
.cta{pointer-events:auto;position:relative;overflow:hidden;border:0;border-radius:999px;padding:0 20px;height:34px;font:700 13px/34px Manrope,Arial,sans-serif;letter-spacing:.02em;color:var(--ink);background:linear-gradient(180deg,#f2cd85 0%,#e0ad57 55%,#c98f3d 100%);box-shadow:0 6px 18px rgba(0,0,0,.45),inset 0 1px 0 rgba(255,255,255,.55);cursor:pointer;transition:transform .25s cubic-bezier(.2,.7,.2,1),box-shadow .25s}
.cta:hover{transform:translateY(-1px) scale(1.03);box-shadow:0 10px 24px rgba(230,170,80,.35),inset 0 1px 0 rgba(255,255,255,.6)}
.cta:after{content:"";position:absolute;top:-40%;left:-70%;width:45%;height:180%;transform:rotate(18deg);background:linear-gradient(90deg,rgba(255,255,255,0),rgba(255,255,255,.55),rgba(255,255,255,0));animation:shine 5.5s linear 4.2s infinite paused}
#ad.go .cta:after{animation-play-state:running}
.hint{font-size:9.5px;letter-spacing:.05em;color:rgba(248,238,223,.5);font-weight:600;opacity:0;transition:opacity .6s}
.hint.on{opacity:1}
.note{position:absolute;pointer-events:none;font-family:"Playfair Display",Georgia,serif;font-style:italic;font-size:15px;color:var(--gold);white-space:nowrap;text-shadow:0 1px 3px rgba(0,0,0,.8),0 0 14px rgba(230,170,80,.5);transform:translate(-50%,-50%);animation:noteUp 1.7s cubic-bezier(.2,.7,.2,1) forwards}
/* giriş animasyonları */
.brand,.over,.sub,.row{opacity:0;animation:up .9s cubic-bezier(.2,.7,.2,1) both paused}
#ad.go .brand,#ad.go .over,#ad.go .sub,#ad.go .row,#ad.go .h .l>span{animation-play-state:running}
.brand{animation-delay:1.05s}.over{animation-delay:1.35s}.sub{animation-delay:2.15s}.row{animation-delay:2.85s}
.h .l>span{transform:translateY(112%);animation:rise .95s cubic-bezier(.2,.75,.15,1) both paused}
.h .l:nth-child(1)>span{animation-delay:1.55s}.h .l:nth-child(2)>span{animation-delay:1.78s}
@keyframes up{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}
@keyframes rise{from{transform:translateY(112%)}to{transform:none}}
@keyframes shine{0%{left:-70%}18%{left:130%}100%{left:130%}}
@keyframes noteUp{0%{opacity:0;transform:translate(-50%,-30%) scale(.8)}18%{opacity:1;transform:translate(-50%,-70%) scale(1)}70%{opacity:1}100%{opacity:0;transform:translate(-50%,-190%) scale(1.02)}}
@media (prefers-reduced-motion:reduce){
  .brand,.over,.sub,.row,.h .l>span{animation:none;opacity:1;transform:none}
  .cta:after{animation:none}
}
</style>

IMG.bokeh=load(SRC.bokeh);IMG.heatring=load(SRC.heatring);IMG.spark=load(SRC.spark);IMG.shadow=load(SRC.shadow);IMG.glow=load(SRC.glow);
setTimeout(start,2500);

// ---------------------------------------------------------------- sahne
var ad=document.getElementById('ad'),cv=document.getElementById('c'),ctx=cv.getContext('2d');
var DPR=Math.min(window.devicePixelRatio||1,2);
cv.width=W*DPR;cv.height=H*DPR;
var scene=document.createElement('canvas');scene.width=W*DPR;scene.height=H*DPR;var sc=scene.getContext('2d');
sc.scale(DPR,DPR);ctx.scale(DPR,DPR);

function rng(seed){return function(){seed|=0;seed=seed+0x6D2B79F5|0;var t=Math.imul(seed^seed>>>15,1|seed);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296}}
var R=rng(20260920);
function clamp(v,a,b){return v<a?a:v>b?b:v}
function easeOutCubic(p){return 1-Math.pow(1-p,3)}
function bounce(p){var n1=7.5625,d1=2.75;if(p<1/d1)return n1*p*p;if(p<2/d1)return n1*(p-=1.5/d1)*p+.75;if(p<2.5/d1)return n1*(p-=2.25/d1)*p+.9375;return n1*(p-=2.625/d1)*p+.984375}

var CS=.95,CUP={x:482,y:56,w:280*CS,h:200*CS};          // sprite yerleşimi (ölçek .95, tabak tam görünür)
var CUPC={x:CUP.x+140*CS,y:CUP.y+88*CS};               // gövde merkezi
var RIM={x:CUP.x+140*CS,y:CUP.y+30*CS};                // ağız (buhar kaynağı)
var SAUCER={x:CUP.x+140*CS,y:CUP.y+172*CS};

// çekirdekler: v=varyant, s=ölçek, r=açı, land=iniş zamanı (ms)
var beans=[],far=[],heap=[],front=[];
function mkBean(x,y,s,layer,land){var b={x:x,y:y,s:s,v:Math.floor(R()*5),r:(R()-.5)*Math.PI*2,land:land,lift:1,liftT:1,flip:-1,hover:false,seed:R()*100};layer.push(b);beans.push(b);return b}
// uzak (odak dışı, masa arkası)
[[468,124,.30],[736,118,.28],[808,112,.26]].forEach(function(p,k){mkBean(p[0],p[1],p[2],far,300+k*160)});
// masa üzerinde dağınık (sağ orta)
[[792,150,.40],[846,138,.36],[912,156,.44],[948,136,.36],[870,168,.40]].forEach(function(p,k){mkBean(p[0],p[1],p[2],heap,420+k*90)});
// önde yığın (sağ alt köşe)
[[812,212,.60],[876,204,.56],[936,210,.58],[842,236,.68],[906,238,.64],[782,240,.58]].forEach(function(p,k){mkBean(p[0],p[1],p[2],heap,700+k*80)});
// kahraman çekirdekler (en önde, tabak ile yığın arasında)
[[752,232,.82]].forEach(function(p,k){mkBean(p[0],p[1],p[2],front,1250+k*70)});
heap.sort(function(a,b){return a.y-b.y});front.sort(function(a,b){return a.y-b.y});

// bokeh
var bokeh=[];for(i=0;i<7;i++)bokeh.push({x:520+R()*430,y:6+R()*70,s:16+R()*40,a:.05+R()*.12,vx:(R()-.5)*4,ph:R()*6.28,f:.2+R()*.4});

var steam=[],sparks=[],rings=[],puffs=[];
var px=0,py=0,tpx=0,tpy=0,pointer=null,hoverCup=false,hoverBean=null,interactAt=-1e9,lastEmit=0,lastRing=0,suppress=false,hazeAmp=0,glowK=0,t0=0,started_at=0;

function emitSteam(now,strong){
  if(steam.length>40)return;
  var sway=(R()-.5)*2;
  steam.push({x:RIM.x+(R()-.5)*40,y:RIM.y+6+R()*6,born:now,life:2300+R()*1500,img:Math.floor(R()*3),s0:.18+R()*.10,s1:.62+R()*.40*(strong?1.25:1),vy:-(20+R()*12)*(strong?1.3:1),sw:10+R()*12,f:.7+R()*.8,ph:R()*6.28,rot:(R()-.5)*.8,vr:(R()-.5)*.35,a:(strong?.20:.13)+R()*.06});
}
function pop(b,now){
  b.flip=now;interactAt=now;
  for(var k=0;k<14;k++){var a=-Math.PI/2+(R()-.5)*1.7,v=45+R()*80;sparks.push({x:b.x,y:b.y-8*b.s,vx:Math.cos(a)*v,vy:Math.sin(a)*v-25,born:now,life:900+R()*700,s:.5+R()*.8})}
  for(k=0;k<3;k++)puffs.push({x:b.x+(R()-.5)*16,y:b.y-6,born:now+k*120,life:1500+R()*500,img:Math.floor(R()*3),sw:(R()-.5)*30,rot:(R()-.5)*1.2});
  var notes=["Kırmızı meyve","Çikolata","İpeksi krema","Hafif tatlılık","Zarif asidite","Tek yöre Arabica"];
  var n=document.createElement('div');n.className='note';n.textContent=notes[Math.floor(R()*notes.length)];
  n.style.left=clamp(b.x,110,880)+'px';n.style.top=(b.y-14)+'px';document.getElementById('notes').appendChild(n);
  setTimeout(function(){n.parentNode&&n.parentNode.removeChild(n)},1800);
}
function hitBean(x,y){
  var list=front.concat(heap);
  for(var k=list.length-1;k>=0;k--){var b=list[k];var dx=x-b.x,dy=y-b.y,c=Math.cos(-b.r),s=Math.sin(-b.r);var lx=dx*c-dy*s,ly=dx*s+dy*c;var rx=46*b.s*b.lift,ry=33*b.s*b.lift;if((lx*lx)/(rx*rx)+(ly*ly)/(ry*ry)<=1)return b}
  return null;
}

// ---------------------------------------------------------------- çizim
function drawBean(g,b,t,ox,oy,blurpx){
  var p=RM?1:clamp((t-b.land)/900,0,1);
  var e=bounce(p);var yoff=-(1-e)*150;if(p<=0)return;
  var s=b.s*b.lift,w=88*s,h=62*s,x=b.x+ox,y=b.y+oy+yoff;
  var fl=1,by=1;
  if(b.flip>=0){var fp=clamp((t-b.flip)/520,0,1);fl=Math.cos(fp*Math.PI);by=1+Math.sin(fp*Math.PI)*.28;if(fp>=1){b.flip=-1;b.r+=Math.PI*.06}}
  // gölge (ışık sol-üstten → sağ-alt)
  g.globalAlpha=.55*e*(b.lift>1.01?.7:1);
  var lift=(b.lift-1)*40;
  g.drawImage(IMG.shadow,x-w*.72+7*s+lift,y-h*.62+6*s+lift*.6,w*1.45,h*1.35);
  g.globalAlpha=1;
  g.save();g.translate(x,y-lift*.8);g.rotate(b.r+(1-p)*3.2);g.scale(fl,by);
  if(blurpx)g.filter='blur('+blurpx+'px)';
  g.drawImage(IMG.bean[b.v],-w/2,-h/2,w,h);g.restore();
}
function drawScene(now,t){
  var ambient=RM?false:(t<MAX_AUTOPLAY||now-interactAt<6000);
  var g=sc;g.clearRect(0,0,W,H);
  // arka plan (hafif paralaks)
  g.drawImage(IMG.bg,-6+px*3,-4+py*2,W+12,H+8);
  // bokeh
  if(IMG.bokeh.width){g.globalCompositeOperation='lighter';for(var k=0;k<bokeh.length;k++){var o=bokeh[k];var bx=o.x+px*5*(o.s/60+.6)+(ambient?Math.sin(t/1000*o.f+o.ph)*6:0),by=o.y+py*3+(ambient?Math.cos(t/1000*o.f*.7+o.ph)*3:0);g.globalAlpha=o.a*(RM?1:clamp((t-200)/1500,0,1));g.drawImage(IMG.bokeh,bx-o.s/2,by-o.s/2,o.s,o.s)}g.globalCompositeOperation='source-over';g.globalAlpha=1}
  // uzak çekirdekler (odak dışı)
  for(k=0;k<far.length;k++)drawBean(g,far[k],t,px*5,py*3,1.2);
  // sıcak hale + masa yansıması
  var cp=RM?1:clamp((t-700)/900,0,1),ce=easeOutCubic(cp),cy=(1-ce)*30;
  var gk=glowK*(0.85+0.15*Math.sin(t/1000*1.6));
  g.globalCompositeOperation='lighter';
  g.globalAlpha=ce*(.30+.40*gk);var gs=280+90*gk;g.drawImage(IMG.glow,CUPC.x-gs/2+px*4,CUPC.y-gs/2+cy+py*2,gs,gs);
  g.globalAlpha=ce*(.28+.35*gk);g.save();g.translate(SAUCER.x+px*4,SAUCER.y+12+cy);g.scale(1,.34);g.drawImage(IMG.glow,-190-60*gk,-190-60*gk,380+120*gk,380+120*gk);g.restore();
  g.globalCompositeOperation='source-over';g.globalAlpha=1;
  // ısı halkaları (masa üstünde yayılan sıcaklık)
  g.globalCompositeOperation='lighter';
  for(k=rings.length-1;k>=0;k--){var r=rings[k];var rp=(now-r.born)/r.life;if(rp>=1){rings.splice(k,1);continue}var rs=150+rp*400;g.globalAlpha=.6*Math.pow(1-rp,1.3);g.save();g.translate(SAUCER.x+px*4,SAUCER.y+2);g.scale(1,.36);g.drawImage(IMG.heatring,-rs/2,-rs/2,rs,rs);g.restore()}
  g.globalCompositeOperation='source-over';g.globalAlpha=1;
  // fincan
  var hs=1+glowK*.025;
  g.globalAlpha=ce;g.save();g.translate(CUPC.x+px*4,CUPC.y+cy+py*2);g.scale(hs*CS,hs*CS);g.drawImage(IMG.cup,-140,-88,280,200);g.restore();g.globalAlpha=1;
  // buhar
  g.globalCompositeOperation='screen';
  for(k=steam.length-1;k>=0;k--){var s=steam[k];var sp=(now-s.born)/s.life;if(sp>=1){steam.splice(k,1);continue}
    var dt=(now-s.born)/1000;var sx=s.x+Math.sin(dt*s.f+s.ph)*s.sw*sp+px*4,sy=s.y+s.vy*dt+cy;var ss=s.s0+(s.s1-s.s0)*easeOutCubic(sp);var al=s.a*Math.sin(sp*Math.PI);
    g.globalAlpha=al;g.save();g.translate(sx,sy);g.rotate(s.rot+s.vr*dt);g.drawImage(IMG.steam[s.img],-96*ss,-96*ss,192*ss,192*ss);g.restore()}
  g.globalCompositeOperation='source-over';g.globalAlpha=1;

  // ana tuvale aktar + ısı titreşimi (fincanın üstündeki hava)
  ctx.clearRect(0,0,W,H);
  ctx.drawImage(scene,0,0,W,H);
  if(hazeAmp>0.02){
    var x0=RIM.x-96+px*4,ww=192,y1=RIM.y+cy+10;
    ctx.globalAlpha=.7;
    for(var yy=0;yy<y1;yy+=2){var f=(yy/y1);var amp=hazeAmp*(0.25+0.75*f*f);var dx=amp*(Math.sin(yy*.11+t/1000*4.6)+.6*Math.sin(yy*.27-t/1000*3.1));
      ctx.drawImage(scene,x0*DPR,yy*DPR,ww*DPR,2*DPR,x0+dx,yy,ww,2)}
    ctx.globalAlpha=1;
  }
  // yığın + ön çekirdekler
  for(k=0;k<heap.length;k++)drawBean(ctx,heap[k],t,px*8,py*5,0);
  for(k=0;k<front.length;k++)drawBean(ctx,front[k],t,px*12,py*7,0);
  // aroma kıvılcımları
  ctx.globalCompositeOperation='lighter';
  for(k=sparks.length-1;k>=0;k--){var q=sparks[k];var qp=(now-q.born)/q.life;if(qp>=1){sparks.splice(k,1);continue}var qd=(now-q.born)/1000;var qx=q.x+q.vx*qd+px*12,qy=q.y+q.vy*qd+30*qd*qd;var qs=64*q.s*(1-qp*.4);ctx.globalAlpha=1-qp*qp;ctx.drawImage(IMG.spark,qx-qs/2,qy-qs/2,qs,qs)}
  ctx.globalCompositeOperation='screen';
  for(k=puffs.length-1;k>=0;k--){var u=puffs[k];var up=(now-u.born)/u.life;if(up>=1){puffs.splice(k,1);continue}if(up<0)continue;var us=.22+up*.55;ctx.globalAlpha=.30*Math.sin(up*Math.PI);ctx.save();ctx.translate(u.x+u.sw*up+px*12,u.y-70*up);ctx.rotate(u.rot*up);ctx.drawImage(IMG.steam[u.img],-96*us,-96*us,192*us,192*us);ctx.restore()}
  ctx.globalCompositeOperation='source-over';ctx.globalAlpha=1;
  // vinyet
  var vg=ctx.createRadialGradient(W*.55,H*.5,H*.35,W*.55,H*.5,W*.62);vg.addColorStop(0,'rgba(8,3,1,0)');vg.addColorStop(1,'rgba(8,3,1,.42)');ctx.fillStyle=vg;ctx.fillRect(0,0,W,H);
  // giriş: sıcak ışık süpürmesi
  if(!RM&&t<1100){var lp=t/1100;var lg=ctx.createLinearGradient(0,0,W,0);var c=lp*1.4-.2;lg.addColorStop(clamp(c-.25,0,1),'rgba(0,0,0,0)');lg.addColorStop(clamp(c,0,1),'rgba(255,190,110,'+(.22*(1-lp))+')');lg.addColorStop(clamp(c+.25,0,1),'rgba(0,0,0,0)');ctx.fillStyle=lg;ctx.fillRect(0,0,W,H);ctx.fillStyle='rgba(8,3,1,'+(1-easeOutCubic(clamp(t/700,0,1)))+')';ctx.fillRect(0,0,W,H)}
  return ambient;
}

function frame(now){
  var t=now-t0;
  // paralaks yumuşatma (+ boşta hafif kendiliğinden hareket)
  var ax=pointer?tpx:Math.sin(t/1000*.28)*.35,ay=pointer?tpy:Math.cos(t/1000*.21)*.25;
  if(RM){ax=0;ay=0}
  px+=(ax-px)*.06;py+=(ay-py)*.06;
  for(var k=0;k<beans.length;k++){var b=beans[k];b.lift+=(b.liftT-b.lift)*.18}
  var ambient=drawScene(now,t);
  var strong=hoverCup;
  if(ambient&&t>1400&&now-lastEmit>(strong?70:135)){emitSteam(now,strong);lastEmit=now}
  if(strong&&now-lastRing>650){rings.push({born:now,life:1800});lastRing=now}
  hazeAmp+=(((ambient&&t>1400)?(strong?2.4:1.1):0)-hazeAmp)*.05;
  glowK+=((strong?1:0)-glowK)*.06;
  requestAnimationFrame(frame);
}
function start(){if(started)return;started=true;t0=performance.now();ad.className="go";requestAnimationFrame(frame)}

// ---------------------------------------------------------------- etkileşim
function local(e){var r=ad.getBoundingClientRect();return{x:(e.clientX-r.left)*W/r.width,y:(e.clientY-r.top)*H/r.height}}
var hint=document.getElementById('hint'),hintShown=false,hintTimer=0;
function touched(){interactAt=performance.now();hint.classList.remove('on');hintShown=true}
ad.addEventListener('pointerenter',function(){if(hintShown||RM)return;hintShown=true;hint.classList.add('on');hintTimer=setTimeout(function(){hint.classList.remove('on')},3200)});
ad.addEventListener('pointermove',function(e){var p=local(e);pointer=p;tpx=clamp((p.x/W-.5)*2,-1,1);tpy=clamp((p.y/H-.5)*2,-1,1);
  var dx=p.x-CUPC.x,dy=p.y-(CUPC.y+8);var hc=(dx*dx)/(105*105)+(dy*dy)/(98*98)<=1;if(hc!==hoverCup){hoverCup=hc;touched()}
  var hb=hitBean(p.x,p.y);if(hb!==hoverBean){if(hoverBean)hoverBean.liftT=1;hoverBean=hb;if(hb){hb.liftT=1.08;touched()}}
});
ad.addEventListener('pointerleave',function(){pointer=null;tpx=0;tpy=0;hoverCup=false;if(hoverBean){hoverBean.liftT=1;hoverBean=null}});
ad.addEventListener('pointerdown',function(e){var p=local(e);var b=hitBean(p.x,p.y);if(b){pop(b,performance.now());touched();suppress=true;e.preventDefault()}});
function openLink(){var u=window.clickTag||URL_;if(window.Enabler&&window.Enabler.exit){window.Enabler.exit('CTA')}else{window.open(u,'_blank','noopener')}}
ad.addEventListener('click',function(){if(suppress){suppress=false;return}openLink()});
document.getElementById('cta').addEventListener('click',function(e){e.stopPropagation();openLink()});
ad.addEventListener('keydown',function(e){if(e.key==='Enter'||e.key===' '){e.preventDefault();openLink()}});
})();
</script>
